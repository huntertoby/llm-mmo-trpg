name: CI

# 只手動觸發（2026-10-19 使用者決定）：每段都已在本機跑過完整的 scripts/check.py，
# 自動 CI 是重複的，且會耗盡私人 repo 每月的 Actions 額度。需要時到 GitHub 的 Actions 頁面按「Run workflow」。
on:
  workflow_dispatch:

# 同一分支／PR 有新的 run 時取消舊的，節省 Actions 用量
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        # Windows 以 2 倍計時，只跑最低支援版本
        exclude:
          - os: windows-latest
            python-version: "3.13"
    env:
      # 讓 Windows 上的子程序（pytest、mypy）以 UTF-8 輸出繁體中文訊息
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: uv run python scripts/check.py
