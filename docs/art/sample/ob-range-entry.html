<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出發後的靶場入口（#150 第 9 點、#147）</title>
<!-- 樣張（第 2 版）：不接進遊戲。框、按鈕、字級直接載入現行樣式（只讀）；新增的排版在 obSamples.css。
     網址參數：?part=master（主城工坊師傅的選單）｜gran（霧渡鎮葛蘭開的「正式選定」畫面，標出試打入口）；
       master：?state=normal｜hover（新項目的一般與滑過）。
       gran（整頁，照現行靶場 RangeScreen）：?sel=mix（預設，已選 2/2：點燃、撞擊）｜one（已選 1/2：點燃）；
             ?hover=try｜demo（「拿起試打」「看示範」滑過）；?off=try｜kw（「拿起試打」變灰｜高處沒有起始技能、它的「看示範」變灰）。
     手機寬 390、桌機寬 1280 用同一頁。
     截圖：docs/art/shots/ob/entry-*.png；紀錄：docs/art/OB與PR樣張.md 第 2 節。 -->
<link rel="stylesheet" href="../../../client/src/styles/index.css">
<link rel="stylesheet" href="../../../client/src/world/mail.css">
<link rel="stylesheet" href="obSamples.css">
</head>
<body class="ob-shot">
<div id="root"></div>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script><script src="fx.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="anim.js"></script><script src="idleWeapons.js"></script>
<script src="qNpc.js"></script><script src="qPortrait.js"></script>
<script src="portraits.js"></script><script src="realms.js"></script><script src="enemyArt.js"></script><script src="explore.js"></script><script src="hud.js"></script>
<script src="regions4.js"></script><script src="cloudTiles.js"></script><script src="ashenTiles.js"></script><script src="townTiles.js"></script>
<script src="gearArt.js"></script><script src="skillIcons.js"></script><script src="regionArt.js"></script><script src="worldPaintedArt.js"></script>
<script src="tools/obLiveIcons.js"></script>
<script src="obSamples.js"></script>
<script>
const { h, cv, line, portrait, doll, hero, kwIcon, dummyIcon, entryShell, entryPlaque, entryPanel, LINES } = OB;
const PART = OB.param("part", "master"), STATE = OB.param("state", "normal");
const W = window.innerWidth, H = window.innerHeight, phone = W < 600, narrow = W < 1040, root = document.getElementById("root");
const closeBtn = () => h("button.world-hud-panel-close", { type: "button", "aria-label": "關閉" }, "×");

function master() {
  OB.applyTheme("capital");
  // 「改造技能」的小圖：師傅手上那把平頭工匠鎚（現行武器小圖示的錘，和師傅手上的是同一個 hammer／iron），放在和木樁小圖同一種深色方框裡
  const hammerIcon = (size) => cv(size, size, (x) => { x.fillStyle = "#161a2a"; x.beginPath(); x.roundRect(0, 0, size, size, 8); x.fill(); x.strokeStyle = "rgb(200 168 104 / 55%)"; x.lineWidth = 1; x.beginPath(); x.roundRect(0.5, 0.5, size - 1, size - 1, 8); x.stroke();
    // 小圖示是畫給米色圓章看的深色墨線，所以框裡先墊現行的米色圓章（theme.css .weapon-icon 的漸層）
    const r = size / 2 - 5, g = x.createRadialGradient(size / 2, size * 0.42, 0, size / 2, size / 2, r); g.addColorStop(0, "#f6eed8"); g.addColorStop(1, "#d6c7a2");
    x.fillStyle = g; x.beginPath(); x.arc(size / 2, size / 2, r, 0, OB.TAU); x.fill(); x.strokeStyle = "#c8a868"; x.lineWidth = 1; x.stroke();
    const art = OBLive.weaponIcon({ kind: "hammer", material: "iron" }, size - 10); if (art) x.drawImage(art, 5, 5, size - 10, size - 10); }, "ob-menu-icon");
  // 停用的項目只寫一次「之後開放」（第 1 版左邊「之後開放」、右邊「還沒開放」重複）
  const item = (icon, title, desc, opt = {}) => h("button.ob-menu-item", { type: "button", class: (opt.hover ? "is-hover " : "") + (opt.isNew ? "ob-menu-new" : ""), disabled: opt.off ? true : null },
    icon, h("span.ob-menu-text", {}, h("b", {}, title, opt.isNew ? h("span.ob-new-tag", {}, "新") : null), h("span", {}, desc)), opt.off ? null : h("span.ob-menu-go", {}, "›"));
  const panel = h("div.ui-popup.rt-frame.ui-popup-hud.world-hud-panel.ob-master-panel", { "data-popup": "hud", style: `top:${phone ? 70 : 84}px;width:${phone ? W - 16 : 520}px;max-width:${phone ? W - 16 : 520}px` },
    h("div.ui-popup-body", {}, closeBtn(),
      h("div.mail-head", {}, (() => { const c = portrait("workshop_master", 56); c.classList.add("story-portrait"); return c; })(),
        h("div.mail-head-text", {}, h("h2", {}, "工坊師傅"), h("div.small.muted", {}, "主城工坊・靶場與改造"))),
      h("div.ob-menu", {},
        item(dummyIcon(40), "靶場試玩", "用你現在的技能與裝備打木樁，看看打起來怎麼樣", { isNew: true, hover: STATE === "hover" }),
        item(hammerIcon(40), "改造技能", "之後開放", { off: true })),
      h("div.small.muted.ob-menu-note", {}, "靶場是測試模式：不算勝負、不給經驗與掉落、不耗任何資源；腰包道具與誓約不帶進去。")));
  root.append(h("div.ob-world", { style: `height:${H}px` }, OB.capitalScene(W, H, { weapon: "one_handed_sword" }), h("div.ob-place", {}, "樞島・工坊靶場"), panel));
}

function gran() {
  // 整頁（照現行靶場 RangeScreen 的外殼與三塊：左預覽、中武器架、右關鍵字）；樣張新增的只有「推薦」小牌、葛蘭的頭像、窄版的黏底列與標號
  OB.applyTheme("cloud_ridge");
  const SELP = OB.param("sel", "mix"), HOVER = OB.param("hover", ""), OFF = OB.param("off", "");
  const COUNT = 2, SEL = SELP === "one" ? ["ignite"] : ["ignite", "collision"], REC = ["collision", "prone"], NOSKILL = OFF === "kw" ? "high_ground" : null;
  const full = SEL.length >= COUNT, zhOf = (id) => OB.KW.find((k) => k[0] === id)[1];
  const mark = (n) => h("span.ob-mark.ob-mark-at", {}, String(n));
  // 黏底列上的「拿起試打」用一般按鈕色（plain）：旁邊就是藍色的「確定選這套」，兩顆都藍容易按錯
  const tryBtn = (plain) => h("button.range-try", { type: "button", class: (plain ? "" : "primary ") + (HOVER === "try" ? "is-hover" : ""), disabled: OFF === "try" ? true : null }, "拿起試打");
  const leaveBtn = () => h("button", { type: "button" }, "之後再選");
  const goBtn = () => h("button.primary.entry-create-go", { type: "button", disabled: full ? null : true }, "確定選這套");

  const keeper = entryPanel("range-keeper",
    h("div.ob-speaker", {}, portrait("gran", phone ? 48 : 64), h("div.ob-speaker-text", {}, line("葛蘭", LINES.gran1), line("葛蘭", LINES.gran2))),
    h("p.muted.small.range-sandbox-note", {}, "試打是測試模式：不算勝負、不給經驗與掉落、不耗任何資源。按「確定選這套」前都能改。"));
  const preview = entryPanel("range-preview", h("div.section-title", {}, "新來的"),
    h("div.range-preview-slot", {}, h("div.look-preview", {}, doll(hero("bow"), "front", narrow ? 2.0 : 2.9, narrow ? 110 : 160, narrow ? 96 : 150, { foot: 12 }),
      h("span.look-facings", {}, ["正面", "朝東", "朝西", "背面"].map((t, i) => h("button.look-chip", { type: "button", class: i === 0 ? "selected" : "", "aria-pressed": String(i === 0) }, t))))),
    h("div.range-preview-weapon.small", {}, "手上：弓（遠程）"));
  const racks = entryPanel("range-racks", h("div.section-title", {}, "武器架"), OB.rackList("弓"),
    h("div.range-weapon-card", {},
      h("div", {}, h("b", {}, "弓"), h("span.muted.small", {}, "　遠程・HP 50・法力 20")),
      h("div.small", {}, "拋射：可越過 1 格高的障礙射擊；普攻：1d8＋敏捷 × 0.3；雙手：占用副手欄位，不能再裝備盾或副手物品"),
      h("div.small.muted", {}, "試打用：普攻＋你選的關鍵字給的起始技能（測試模式，不耗任何資源）"),
      h("span.ob-mark-wrap.ob-wide-only", {}, tryBtn(), mark(1))));
  const kwRow = ([id, zh, skill], i) => {
    const on = SEL.includes(id), rec = REC.includes(id), none = id === NOSKILL;
    const demo = h("button.small-button.range-demo", { type: "button", class: i === 0 && HOVER === "demo" ? "is-hover" : "", disabled: none ? true : null }, "看示範");
    return h("div.range-keyword", { class: on ? "selected" : "", "data-keyword": id, "data-state": (rec ? "rec" : "plain") + (on ? "-sel" : "") + (none ? "-off" : "") },
      h("button.run-keyword", { type: "button", class: (on ? "primary selected" : "") + (none ? " unavailable" : ""), disabled: none || (!on && full) ? true : null },
        kwIcon(id), h("b", {}, zh), h("span.small", {}, "　" + (none ? "弓沒有起始技能" : skill)), rec ? h("span.ob-rec", {}, "推薦") : null),
      i === 0 ? h("span.ob-mark-wrap", {}, demo, h("span.ob-mark.ob-mark-corner", {}, "2")) : demo);
  };
  const keywords = entryPanel("range-keywords", h("div.section-title", {}, `選 ${COUNT} 個關鍵字（${SEL.length}/${COUNT}）`),
    h("div.muted.small", {}, "每個關鍵字給 1 招起始技能；標「推薦」的是照你前兩場用得最多的招挑的，不照著選也行。都能先「看示範」。"),
    h("div.range-keyword-list", {}, OB.KW.map(kwRow)),
    full ? h("div.small.run-start-links.muted", {}, "觸發關係：這兩招沒有互相觸發（各自製造自己的關鍵字）；之後學到的招可以利用它們。") : null,
    h("div.small.entry-note", {}, "屬性：確定後全部照推薦配法重配。", h("span.muted", {}, "接著葛蘭會教你自己配。")),
    h("div.run-actions.entry-actions.ob-wide-only", {}, leaveBtn(), goBtn()));
  // 窄版（< 1040）：三塊直排後很長，「拿起試打」與兩顆確認鈕收進黏底列，不用捲過 22 把武器
  const bar = entryPanel("ob-choose-bar ob-narrow-only",
    h("div.ob-bar-text.small", {}, h("b", {}, "手上：弓"), `　已選 ${SEL.length}/${COUNT}：${SEL.map(zhOf).join("、")}`),
    h("div.ob-bar-actions", {}, h("span.ob-mark-wrap", {}, tryBtn(true), h("span.ob-mark.ob-mark-corner", {}, "1")), leaveBtn(), goBtn()));
  const legend = h("div.ob-legend", {}, h("b", {}, "試打入口（樣張標號，不是遊戲畫面的一部分）"),
    h("div", {}, h("span.ob-mark.inline", {}, "1"), narrow ? "「拿起試打」：窄版放在黏底列（寬版在武器卡下面，位置和現行靶場一樣）。用選的武器＋目前選的關鍵字給的起始技能進靶場（測試模式）。"
      : "「拿起試打」：在武器卡下面，位置和現行靶場一樣。用選的武器＋目前選的關鍵字給的起始技能進靶場（測試模式）。"),
    h("div", {}, h("span.ob-mark.inline", {}, "2"), "「看示範」：每個關鍵字右邊各一顆，位置和現行靶場一樣。用選的武器放那一招打木樁。"));
  root.append(entryShell("world-range ob-choose-page", entryPlaque("正式選定", "霧渡鎮導師堂・選你自己的武器與關鍵字"), keeper, h("div.range-body", {}, preview, racks, keywords), bar), legend);
}

(PART === "gran" ? gran : master)();
OB.ready();
</script>
</body></html>
