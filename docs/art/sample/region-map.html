<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>雲嶺區域插畫</title>
<style>
  body { margin: 0; background: #1b1f26; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="regionArt.js"></script>
<script>
  // ?style=scroll（古地圖卷軸）或 ?style=painted（俯視彩繪）
  // &full=1：不蓋霧、不畫地點，看整張地景
  const q = new URLSearchParams(location.search);
  RegionArt.draw(document.getElementById("c"), q.get("style") || "scroll", { full: q.get("full") === "1" });
</script>
</body>
</html>
