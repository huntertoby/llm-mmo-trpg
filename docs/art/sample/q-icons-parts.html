     網址參數 ?part=
       a      總表 A（&group=skeleton｜effect1｜effect2｜effect3｜surface｜status1｜status2｜condition｜cost｜trigger1｜trigger2｜link｜shape｜change｜element｜card1｜card2）
              每列：現行（實際尺寸、放大 4 倍、最小尺寸 2 倍內部解析度的圖最近鄰放大）｜Q 版（在現行底上的實際尺寸、4 倍向量、2 倍內部解析度的圖最近鄰放大）
       b      總表 B：每類最小尺寸總排＋剪影排＋56px 圖示上的實際大小，最下面是跨類相近的幾組（&group= 類名｜near；near 可加 &nfrom=0&nn=3 分段）
       asm    組裝：24 招的 96／56 完整圖示，現行｜Q 版（&from=&n= 分段）
       scene  情境圖：技能卡（常駐行、效果行、組裝算式）與工坊的 96px 圖示，左現行、右 Q 版
       audit  自查表；review  全部圖樣最小尺寸最近鄰放大：上排 2 倍內部解析度、下排真 1 倍（&cat=、&from=&n=、&only=類:代碼,…）；hash  指紋
       true1x 真 1 倍（canvas 寬高＝CSS px）最近鄰放大：每格 現行｜Q 版真 1 倍｜Q 版 2 倍內部解析度；&group=chip（全部圖樣：圓片 18px、卡片小圖 16／18／13px，×6，預設；可加 &cat=）｜corner（56px 精簡圖示角落的骨架徽章與觸發時機，×6）｜asm（24 招的 56px 圖示：現行卡片小圖｜Q 版精簡，×3），&from=&n= 分段；重拍：qicons_shots.py true1x parts
       all    a＋b＋asm＋scene（預設）
     截圖：docs/art/shots/qicons/parts-*.png；特寫：docs/art/closeup/qicons/parts/；重拍：uv run python docs/art/sample/tools/qicons_shots.py parts -->

<script>
const { h } = OB, Q = QIcons, QS = QIconsSkills, QP = QIconsParts, QL = window.QPartsLive, SK = window.QSKILLS, BY = Object.fromEntries(SK.map((s) => [s.id, s])), ICON = window.QPARTS_ICONS, NL = String.fromCharCode(10), TAU = Math.PI * 2;
OB.applyTheme("capital"); QL.setGlossary(window.QPARTS_GLOSSARY);
const PART = OB.param("part", "all"), root = document.getElementById("root"), show = (p) => PART === "all" || PART === p;
const nn = (c, px, k) => { c.style.width = c.style.height = px * k + "px"; c.style.imageRendering = "pixelated"; return c; };
const one = (label, els) => h("div.qp-one", {}, h("span", {}, els), h("i", {}, label));
/* opt.res＝指定內部解析度（1＝真 1 倍，?part=true1x 用） */
const mk = (px, zoom, draw, opt = {}) => { const res = opt.res ?? (zoom === 1 ? 2 : zoom), c = document.createElement("canvas"); c.width = c.height = Math.round(px * res); c.style.width = c.style.height = px * zoom + "px"; const x = c.getContext("2d"); x.scale((px * res) / 100, (px * res) / 100); draw(x); return c; };
const lookOf = (s) => ({ ...s.q, kind: s.kind, rarity: s.rarity });
/* 沒有 Q 版圖樣的狀態：用現行的白色狀態圖樣頂著（狀態圖示是另一批） */
QP.hooks.status = (c, o, id) => { c.save(); c.fillStyle = c.strokeStyle = QL.statusColor(id); c.lineWidth = 2.2; c.lineCap = c.lineJoin = "round"; QL.statusGlyph(c, id); c.restore(); };

// ---------------------------------------------------------------- 現行：每一類的部件怎麼畫（都是 QPartsLive＝遊戲端原始程式）
const RING = { condition: "#ffe9a8", trigger: "#ffffff", link: "#ffffff", target: "#ffffff" }, FAINT = "rgba(255,255,255,0.3)";
function livePart(cat, id, opt = {}) {
  if (cat === "effect") return QL.effectPart({ type: id });
  if (cat === "status") return QL.effectPart({ type: "apply_status", status: id });
  if (cat === "surface") return QL.effectPart({ type: "create_surface", surface: id });
  if (cat === "condition") { const [a, b] = id.split(":"); return QL.conditionPart(a, b); }
  if (cat === "cost") return QL.costPart(id);
  if (cat === "trigger") return QL.triggerPart(id, false);
  if (cat === "link") return QL.linkPart(id);
  if (cat === "target") return QL.modifierTargetPart(TARGET_APPLIES[id] ?? {}); /* 11-12：改造對象（現行 modifierTargetPart） */
  if (cat === "change") return QL.modifierChangePart(id, opt.value ?? CHANGE_VALUE[id], opt.partIds ?? (id === "on_hit_effects" ? ["detonate_runes"] : []));
  return null;
}
/* 11-12：改造對象每個代碼對應的 applies_to 例子（現行那一欄用；tag_other／actions 用內容裡真的有的 rune_read、shove） */
const TARGET_APPLIES = { all_skills: { all_skills: true }, all_attacks: { all_attacks: true }, attack: { actions: ["attack"] }, tag_push: { skill_tags: ["push"] }, tag_heal: { skill_tags: ["heal"] }, tag_control: { skill_tags: ["control"] }, tag_ranged: { skill_tags: ["ranged"] }, tag_shout: { skill_tags: ["shout", "area"] }, tag_area: { skill_tags: ["area"] }, tag_summon: { skill_tags: ["summon"] }, tag_other: { skill_tags: ["rune_read"] }, actions: { actions: ["shove"] }, default: {} };
const CHANGE_VALUE = { add_element: "fire", damage_permille: 150, hit_bonus: 1, cooldown_delta: -1, area_delta: 1, push_distance_delta: 1, ap_delta: -1, range_delta: 1, add_tags: ["push"], on_hit_effects: [], shape_to: "line", allow_self_target: true, grant_pierce: true, heal_permille: 200, summon_hp_permille: 500, summon_limit_delta: 1, summon_duration_delta: 1, summon_damage_permille: 250, summon_attack_dice: 1, form_upkeep_permille: -500, form_entry_permille: 500 };
/** 現行的組裝列方塊（tileCanvas 的畫法：100 單位、裁成圓、圓片半徑 42）。 */
/* 11-13：獨狼的兩個新條件，遊戲端現在借別的 Q 版條件圖暫代（client/src/render/qIcon/parts.ts），「現行」那一欄照它畫借來的圖 */
const LW_NEW = ["lone_wolf", "self_lacks_status"], LW_BORROW = { lone_wolf: "target_isolated", self_lacks_status: "target_has_status" };
/* 11-13：BS-1 的兩個新部件，遊戲端現在也借別的 Q 版圖暫代（parts.ts）：每一下都命中借「手持指定武器」的劍，無聲（修正內容）借條件「潛行偷襲」的兜帽、畫在修正內容的圓片（淡白環）上 */
const BS_NEW = [["condition", "all_strikes_hit"], ["change", "silent_strike"]], BS_BORROW = { "condition:all_strikes_hit": ["condition", "wielding_weapon"], "change:silent_strike": ["condition", "self_concealed"] };
const isBS = (e) => BS_NEW.some(([c, i]) => c === e.cat && i === e.id);
function liveTile(cat, id, px, zoom = 1, opt = {}) {
  if (cat === "condition" && LW_BORROW[id]) return qTile(cat, LW_BORROW[id], px, zoom, opt);
  if (BS_BORROW[cat + ":" + id]) { const [bc, bi] = BS_BORROW[cat + ":" + id]; return QP.chipCanvas(bc, bi, px, zoom, { ring: RING[cat] ?? FAINT, ...opt }); }
  return mk(px, zoom, (x) => { x.beginPath(); x.arc(50, 50, 49, 0, TAU); x.clip();
    if (cat === "skeleton") QL.optionTile("skeleton", id).draw(x);
    else if (cat === "shape") QL.optionTile("shape", id).draw(x);
    else if (cat === "element") { x.fillStyle = "rgba(8,10,16,0.8)"; x.beginPath(); x.arc(50, 50, 42, 0, TAU); x.fill(); QL.elementGlyph(x, id, 50, 50, (42 / 12) * 0.8, QL.elementPalette(id).accent); } /* skillIcon.ts 的 elementChip 放大 */
    else QL.drawChip(x, livePart(cat, id, opt), 50, 50, 42, { ring: RING[cat] ?? (cat === "cost" ? livePart(cat, id).color : FAINT) }); }, opt);
}
const qTile = (cat, id, px, zoom = 1, opt = {}) => (cat === "element" ? QP.chipCanvas(cat, id, px, zoom, { ring: false, bg: "rgba(8,10,16,0.8)", ...opt }) : QP.chipCanvas(cat, id, px, zoom, { ...(cat === "cost" ? { ring: QP.COST_RING[id] } : {}), ...(cat === "change" ? { value: CHANGE_VALUE[id] } : {}), ...opt }));
/** 96／56px 圖示上角落的小圓片（實際大小：半徑 11 單位）。kind＝"badge"（骨架徽章，稀有度色環）或其他。 */
const cornerLive = (cat, id, iconPx, r = 11) => mk((iconPx * (r * 2 + 4)) / 100, 1, (x) => { x.scale(100 / (r * 2 + 4), 100 / (r * 2 + 4)); const c = r + 2;
  if (cat === "skeleton") { x.fillStyle = "rgba(8,10,16,0.88)"; x.beginPath(); x.arc(c, c, r, 0, TAU); x.fill(); x.strokeStyle = "#4da3ff"; x.lineWidth = 2; x.stroke(); x.save(); x.translate(c, c); x.scale(0.85, 0.85); QL.skeletonGlyph(x, id, 0, 0); x.restore(); }
  else QL.drawChip(x, livePart(cat, id), c, c, r, { ring: RING[cat] ?? FAINT }); });
const cornerQ = (cat, id, iconPx, r = 11) => { const side = (iconPx * (r * 2 + 4)) / 100, c = document.createElement("canvas"); c.width = c.height = Math.round(side * 2); c.style.width = c.style.height = side + "px"; const x = c.getContext("2d"), u = iconPx / 100; x.scale(u * 2, u * 2); const m = r + 2;
  if (cat === "skeleton") { x.fillStyle = "rgba(8,10,16,0.88)"; x.beginPath(); x.arc(m, m, r, 0, TAU); x.fill(); x.strokeStyle = "#4da3ff"; x.lineWidth = 2; x.stroke(); QP.paint(x, cat, id, m, m, r * 1.56, u, 2); }
  else QP.chip(x, cat, id, m, m, r, { ring: RING[cat] ?? FAINT, unitPx: u, res: 2, value: CHANGE_VALUE[id] }); return c; };

// ---------------------------------------------------------------- 技能卡小圖的現行畫法：client/src/ui/SkillCardGlyphs.tsx 的 CHIP_PATHS、effectPath、PinGlyph 原樣抄過來（JSX 屬性改成 SVG 屬性，數字與顏色一字不改）
const INK = "#1c1712";
const CARD_SVG = {
  ap: `<polygon points="11,1 4,11 9,11 7,19 16,8 11,8" fill="#ffd23a" stroke="${INK}" stroke-width="1.5"/>`,
  mana: `<path d="M10 2C6 8 4 11 4 13a6 6 0 0 0 12 0c0-2-2-5-6-11z" fill="#4a8ae0" stroke="${INK}" stroke-width="1.5"/>`,
  stamina: `<path d="M3 10h4l2-5 3 10 2-5h3" stroke="#c8a030" stroke-width="2.2" fill="none"/>`,
  hp: `<path d="M10 17S3 12 3 7a3.5 3.5 0 0 1 7-1 3.5 3.5 0 0 1 7 1c0 5-7 10-7 10z" fill="#e04a3a" stroke="${INK}" stroke-width="1.5"/>`,
  source: `<polygon points="10,1 13,8 19,8 14,12 16,19 10,15 4,19 6,12 1,8 7,8" fill="#c8bcff" stroke="${INK}" stroke-width="1.3"/>`,
  uses: `<rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="#e8dcc0" stroke-width="2"/><path d="M7 10h6" stroke="#e8dcc0" stroke-width="2"/>`,
  cooldown: `<circle cx="10" cy="10" r="7.5" fill="none" stroke="#8ab8f0" stroke-width="2.5"/><path d="M10 4v6l4 2" stroke="#8ab8f0" stroke-width="2" fill="none"/>`,
  range: `<rect x="2" y="7" width="6" height="6" fill="#ffd23a" stroke="${INK}"/><rect x="8" y="7" width="6" height="6" fill="#e04a3a" stroke="${INK}"/><rect x="14" y="7" width="4" height="6" fill="#3a3028" stroke="${INK}"/>`,
  reaction: `<path d="M4 10a6 6 0 1 1 2 4.5" stroke="#5ad06a" stroke-width="2.5" fill="none"/><path d="M3 15l3-1-1-3" stroke="#5ad06a" stroke-width="2" fill="none"/>`,
  trigger: `<path d="M11 2 5 11h4l-1 7 6-9h-4z" fill="#f0a040" stroke="${INK}" stroke-width="1.3"/>`,
  delayed: `<circle cx="10" cy="10" r="7.5" fill="#f2e6c8" stroke="${INK}" stroke-width="1.5"/><path d="M10 5v5l3 2" stroke="${INK}" stroke-width="1.8" fill="none"/>`,
  activation: `<polygon points="10,2 12.5,7.5 18,8 14,12 15,18 10,15 5,18 6,12 2,8 7.5,7.5" fill="#ffb938" stroke="${INK}" stroke-width="1.3"/>`,
  drawback: `<polygon points="10,2 18.5,17 1.5,17" fill="#e0a040" stroke="${INK}" stroke-width="1.3"/><path d="M10 7v5M10 14v1.5" stroke="${INK}" stroke-width="2"/>`,
  damage: (color) => `<path d="M3 17L16 4" stroke="${INK}" stroke-width="5"/><path d="M3 17L16 4" stroke="${color}" stroke-width="2.5"/>`,
  heal: `<path d="M8 3h4v5h5v4h-5v5H8v-5H3V8h5z" fill="#7dffb0" stroke="${INK}" stroke-width="1.3"/>`,
  shield: `<path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z" fill="#9ab8d8" stroke="${INK}" stroke-width="1.5"/>`,
  move: `<path d="M3 10h10M10 5l5 5-5 5" stroke="#f2e6c8" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  status: `<circle cx="10" cy="10" r="6.5" fill="#c8a0d8" stroke="${INK}" stroke-width="1.5"/>`,
  surface: `<path d="M2 8q4-4 8 0t8 0M2 14q4-4 8 0t8 0" stroke="#5ab0f0" stroke-width="2.5" fill="none"/>`,
  summon: `<circle cx="10" cy="7" r="4" fill="#7dffb0" stroke="${INK}" stroke-width="1.3"/><path d="M3 18c1-5 4-6 7-6s6 1 7 6z" fill="#7dffb0" stroke="${INK}" stroke-width="1.3"/>`,
  stack: `<rect x="4" y="11" width="12" height="5" rx="1" fill="#e8bb48" stroke="${INK}"/><rect x="4" y="6" width="12" height="5" rx="1" fill="#e8bb48" stroke="${INK}"/>`,
  pin: `<path d="M10.5 1.5 14.5 5.5 12 6.5 9.5 9 9.8 12.2 8.6 13.4 6 10.8 2.5 14.3 1.7 13.5 5.2 10 2.6 7.4 3.8 6.2 7 6.5 9.5 4Z" fill="#b8ab96"/>`,
};
const CARD_PX = Object.fromEntries(QP.list().card.map((e) => [e.id, e.px]));
const EL_COLOR = { fire: "#ff6a1a", ice: "#8fe3ff", lightning: "#fff36b", poison: "#7ddc3a", holy: "#ffd75e", shadow: "#9a6ad8", wind: "#7fe0c0", earth: "#b0814a" };
/** 現行卡片小圖（SVG）。zoom>1 直接放大向量。 */
function liveCard(id, zoom = 1, element = null) { const px = CARD_PX[id], d = document.createElement("span"), body = typeof CARD_SVG[id] === "function" ? CARD_SVG[id](element ? EL_COLOR[element] : "#e8eef4") : CARD_SVG[id];
