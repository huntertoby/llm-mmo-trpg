<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>城鎮與室內圖庫</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #1b1714; color: #eadfcc; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; width: 1300px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .note { color: #b8ab96; font-size: 13px; margin: 0 0 10px; line-height: 1.6; }
  h2 { font-size: 16px; margin: 14px 0 6px; }
  h2 small { color: #b8ab96; font-weight: normal; font-size: 12px; margin-left: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 11.5px; color: #d8ccb8; margin-top: 3px; line-height: 1.35; max-width: 260px; }
  figcaption b { color: #9a8e7c; font-weight: normal; display: block; font-size: 10.5px; }
  canvas { display: block; border-radius: 4px; border: 1px solid #000; }
</style>
</head>
<body>
<h1>城鎮圖庫：主城、霧渡鎮，以及酒館、鐵匠鋪、導師殿（樣張，等使用者看過再定）</h1>
<p class="note">美術 PM，2026-11-04。主城在五區中央的浮島上：白石街道、藍頂金飾，廣場中央是通往五區的傳送陣（已開放的區有顏色），五面區旗。霧渡鎮沿用雲嶺的白牆黛瓦。室內 10×8，畫在畫面中央、四周暗。示範圖都疊上 HUD 版面 A。全部程式繪製。</p>
<div id="root"></div>
<script src="storyDoll.js"></script>
<script src="paperdoll.js"></script>
<script src="realms.js"></script>
<script src="enemyArt.js"></script>
<script src="explore.js"></script>
<script src="hud.js"></script>
<script src="regions4.js"></script>
<script src="cloudTiles.js"></script>
<script src="ashenTiles.js"></script>
<script src="townTiles.js"></script>
<script>
  const E = Explore, TT = TownTiles, AT = AshenTiles, H = Hud, T = 52;
  const root = document.getElementById("root");
  function cv(w, h, s) { const c = document.createElement("canvas"); c.width = w * s * 2; c.height = h * s * 2; c.style.width = w * s + "px"; c.style.height = h * s + "px"; const ctx = c.getContext("2d"); ctx.scale(s * 2, s * 2); return [c, ctx]; }
  function section(title) { const h = document.createElement("h2"); h.innerHTML = title; root.appendChild(h); const row = document.createElement("div"); row.className = "row"; root.appendChild(row); return row; }
  function card(row, w, h, s, draw, name, id) { const [c, ctx] = cv(w * T, h * T, s); draw(ctx); const f = document.createElement("figure"); f.appendChild(c); const cap = document.createElement("figcaption"); cap.innerHTML = `${name}<b>${id}</b>`; f.appendChild(cap); row.appendChild(f); }
  const plazaBg = (c, w, h) => { for (let gy = 0; gy < h; gy++) for (let gx = 0; gx < w; gx++) TT.plaza(c, gx, gy); };

  // ---------- 圖庫 ----------
  let row = section("1. 主城的建築與街景<small>白石藍頂金飾；招牌只放圖示</small>");
  card(row, 4, 3, 0.9, (c) => { plazaBg(c, 4, 3); TT.stoneHall(c, 0, 0, 4, 3, { door: 2, windows: [0.8, 3.2], sign: "jar" }); }, "白石建築（酒館、雇用所、商會）", "buildings: stone_hall＋doors");
  card(row, 5, 4, 0.9, (c) => { plazaBg(c, 5, 4); TT.stoneHall(c, 0, 0, 5, 4, { door: 2.5, windows: [1, 4], sign: "scroll", spire: true }); }, "技能導師殿（有晶尖塔，有室內）", "buildings: mentor_hall＋doors");
  card(row, 3, 3, 0.9, (c) => { plazaBg(c, 3, 3); TT.portalPlaza(c, 0, 0); }, "中央傳送陣（五區光圈；已開放的有顏色）", "teleport_stones（主城的特殊外觀）");
  card(row, 5, 1, 0.9, (c) => { plazaBg(c, 5, 1); ["crystal_crown", "cloud_ridge", "arcane_hub", "ashen_waste", "frost_tide"].forEach((r, k) => TT.banner(c, k * T, 0, r)); }, "五面區旗", "decor: banner");
  card(row, 2, 2, 0.9, (c) => { plazaBg(c, 2, 2); TT.fountain(c, 0, 0); }, "噴水池（擋路）", "新物件 fountain（同 low_wall）");
  card(row, 2, 1, 0.9, (c) => { plazaBg(c, 2, 1); TT.stall(c, 0, 0, "#c83a2a"); TT.stall(c, 1, 0, "#3a5ad0"); }, "市集攤位", "facilities: shop");
  row = section("2. 霧渡鎮的建築<small>沿用 explore.png 的白牆黛瓦（6B-4 用）；餘燼集用荒原的廢鐵屋</small>");
  card(row, 4, 3, 0.9, (c) => { for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 4; gx++) E.ground(c, "p", gx, gy); E.house(c, 0, 0, 4, 3, { door: 2, sign: "jar", windows: [1, 3], lit: true, lanterns: [1, 3], accent: "#b8432f" }); }, "酒館（有室內）", "buildings: tavern");
  card(row, 3, 3, 0.9, (c) => { for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) E.ground(c, "p", gx, gy); E.house(c, 0, 0, 3, 3, { door: 1.5, sign: "anvil", windows: [0.6] }); }, "鐵匠鋪（有室內，含附魔台）", "buildings: smithy");
  card(row, 3, 3, 0.9, (c) => { for (let gy = 0; gy < 3; gy++) for (let gx = 0; gx < 3; gx++) AT.redSand(c, gx * T, gy * T, gx, gy); AT.scrapHouse(c, 0, 0, 3, 3, { door: 1, chimney: true, sign: "anvil" }); }, "餘燼集的鐵匠鋪（荒原風格）", "buildings: forge_house");

  // ---------- 示範（疊 HUD A）----------
  const S = 1.15;
  function screen(title, sub, draw) { const r = section(`${title}<small>${sub}</small>`); const [c, ctx] = cv(20 * T, 12 * T, S); draw(ctx); r.appendChild(c); }
  function npc(ctx, gx, gy, look, gear, icon, kind, facing = "south") { const p = E.person(ctx, gx, gy, look, gear, facing); if (icon) E.bubble(ctx, gx * T + T / 2, gy * T + T * 0.82 - 52, icon, kind); }
  const SK = E.SKIN;
  screen("3. 示範：主城中央廣場（32×24 的一部分）", "導師殿、酒館、鐵匠鋪、傳送陣、區旗、噴水池、市集；HUD A", (c) => {
    for (let gy = 0; gy < 12; gy++) for (let gx = 0; gx < 20; gx++) TT.plaza(c, gx, gy);
    TT.stoneHall(c, 1, 0, 5, 3, { door: 2.5, windows: [1, 4], sign: "jar" });
    TT.stoneHall(c, 7, -1, 6, 5, { door: 3, windows: [1.2, 4.8], sign: "scroll", spire: true });
    TT.stoneHall(c, 14, 0, 5, 3, { door: 2.5, windows: [1, 4], sign: "anvil" });
    ["crystal_crown", "cloud_ridge", "arcane_hub", "ashen_waste", "frost_tide"].forEach((r, k) => TT.banner(c, [2, 5, 9, 14, 17][k] * T, 4 * T, r));
    TT.portalPlaza(c, 8.5, 5.2);
    TT.fountain(c, 2, 7); TT.stall(c, 14, 8, "#c83a2a"); TT.stall(c, 15, 8, "#3a5ad0"); TT.stall(c, 16, 8, "#6aa84a"); E.board(c, 5, 6);
    npc(c, 3.5, 3, { skin: SK[0], hair: "short", hairColor: "#6a3d1e" }, { body: { kind: "robe", color: "#8a6a3a" } }, "jar", "talk");
    npc(c, 9.5, 3.4, { skin: SK[1], hair: "long", hairColor: "#c8c0b0" }, { body: { kind: "robe", color: "#5a3a9a" }, head: { kind: "wizard_hat", color: "#5a3a9a" } }, "bang", "quest");
    npc(c, 16.5, 3, { skin: SK[2], hair: "short", hairColor: "#2a1a10" }, { body: { kind: "leather", material: "leather", color: "#4a3a2a" } }, "anvil", "talk");
    npc(c, 15, 7, { skin: SK[0], hair: "short", hairColor: "#1a1a1a" }, { body: { kind: "coat", color: "#3a5ad0" } }, "coin", "talk");
    E.person(c, 12, 8, ...E.PARTY[1], "west", null);
    E.person(c, 10, 9, ...E.PARTY[0], "north", "#5aa0ff");
    H.hudA(c, 20, 12, "主城", "portal", { scene: "capital" });
  });
  screen("4. 示範：霧渡鎮", "沿用可走動樣張的霧渡鎮，換成 HUD A", (c) => E.town(c, H.hudA));
  screen("5. 示範：酒館（室內 10×8）", "吧檯、酒桶、壁爐、桌椅；走到吧檯旁就開酒館面板（傳聞、雇用）", (c) => {
    TT.room(c, 5, 2, 10, 8, "#5a4030");
    TT.P.shelf(c, 6, 2, 2, ["#8a5a30", "#c8a070", "#6a3a20", "#e8e0d0"]); TT.P.fireplace(c, 12, 2);
    TT.P.counter(c, 6, 4, 4); TT.P.keg(c, 10, 4);
    TT.P.table(c, 7, 7); TT.P.table(c, 11, 7); TT.P.table(c, 12, 5);
    npc(c, 7.5, 3.4, { skin: SK[0], hair: "short", hairColor: "#6a3d1e" }, { body: { kind: "robe", color: "#8a6a3a" } }, "jar", "talk");
    npc(c, 11, 6.4, { skin: SK[1], hair: "short", hairColor: "#1a1a1a" }, { body: { kind: "coat", color: "#3c4a48" }, head: { kind: "wide_hat", material: "wood", color: "#c8a868" } }, "dots", "talk", "west");
    npc(c, 13, 4.6, { skin: SK[2], hair: "short", hairColor: "#2a1a10" }, { body: { kind: "leather", material: "leather", color: "#6a5040" } }, "bang", "quest", "west");
    E.person(c, 9.5, 8, ...E.PARTY[0], "north", "#5aa0ff");
    H.hudA(c, 20, 12, "霧渡鎮・酒館", "portal", { scene: "interior" });
  });
  screen("6. 示範：鐵匠鋪（含附魔台）", "鍛爐、鐵砧、武器架、附魔台（發光符文）；走到鐵匠或附魔台旁就開面板", (c) => {
    TT.room(c, 5, 2, 10, 8, "#4a3e38", "#7a6a58");
    AT.forge(c, 6 * T, 2 * T); AT.forge(c, 7 * T, 2 * T); TT.P.rack(c, 9, 2); TT.P.rack(c, 10, 2); TT.P.shelf(c, 12, 2, 2, ["#9aa0a8", "#c3ccd6", "#8a5a30"]);
    TT.P.anvil(c, 7, 4); TT.P.enchant(c, 12, 5, 300); TT.P.counter(c, 9, 6, 2);
    npc(c, 7, 5, { skin: SK[2], hair: "short", hairColor: "#2a1a10" }, { body: { kind: "leather", material: "leather", color: "#4a3a2a" } }, "anvil", "talk", "east");
    npc(c, 13, 5.4, { skin: SK[1], hair: "long", hairColor: "#c8c0b0" }, { body: { kind: "robe", color: "#5a3a9a" } }, "ask", "info", "west");
    E.person(c, 9.5, 8, ...E.PARTY[0], "north", "#5aa0ff");
    H.hudA(c, 20, 12, "霧渡鎮・鐵匠鋪", "portal", { scene: "interior" });
  });
  screen("7. 示範：技能導師殿（主城）", "晶石像、書架、地毯、燭台；走到導師旁就開成長與技能面板", (c) => {
    TT.room(c, 5, 2, 10, 8, "#3a3a5a", "#b8aa8a");
    TT.P.rug(c, 8, 4, 4, 5); TT.P.statue(c, 9.5, 1.6); TT.P.shelf(c, 6, 2, 2, ["#5a3a9a", "#3a5ad0", "#c83a2a", "#e8bb48"]); TT.P.shelf(c, 12, 2, 2, ["#3a5ad0", "#5a3a9a", "#6aa84a", "#e8bb48"]);
    for (const [gx, gy] of [[6, 5], [6, 8], [13, 5], [13, 8]]) TT.P.candle(c, gx, gy);
    npc(c, 9.5, 4.2, { skin: SK[0], hair: "long", hairColor: "#c8c0b0" }, { body: { kind: "robe", color: "#3a5ad0" }, head: { kind: "wizard_hat", color: "#3a5ad0" }, main_hand: { kind: "staff", material: "wood" } }, "scroll", "quest");
    E.person(c, 9.5, 8, ...E.PARTY[0], "north", "#5aa0ff");
    H.hudA(c, 20, 12, "主城・導師殿", "portal", { scene: "interior" });
  });
</script>
</body>
</html>
