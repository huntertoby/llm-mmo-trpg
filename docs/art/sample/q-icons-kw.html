<title>KW 段：連擊、怒氣、專注、氣的美術樣張</title>
<!-- 樣張，不接進遊戲（畫圖 agent，2026-11-13）。紀錄：docs/art/KW樣張.md；畫法：qIconsKW.js；拍圖：tools/kw_shots.py。
     網址參數 ?part=
       cand     ①圓章圖樣：每個關鍵字 A／B 兩案 × 圓章 13／17／20／27（裝備格 32／42／48／64），真 1 倍與 2 倍內部解析度，最近鄰放大；剪影
       color    ②關鍵字色：16 色色票與 16 個圓章 × 正常／紅色弱／綠色弱／藍色弱／灰階；OKLab 距離表；推薦組 vs 對照組
       near     ①撞圖：既有 12 個＋新 4 個圓章排一排（真 1 倍 13、17，放大 5 倍），兩案各一排；和同題材的第③④⑤批記號並排
       gear     ①放在裝備格上：代表裝備 × 新關鍵字（32、42 真 1 倍與 2 倍）
       cond     ⑤條件部件「層數達 N」：A／B × 30／26／18／16，和既有條件與層數部件並排（真 1 倍放大）；情境（技能卡 56、96、組裝列、說明行）
       hud      ④HUD 層數計量：A／B × 每種 0～滿層（真 1 倍放大）；HUD 主角卡實際位置（現行 vs Q 版）
       create   ③創角關鍵字圖示：既有 12＋新 4（A／B），15 與 30 px，按鈕情境
       audit    自查表（文字）；hash 新圖指紋（文字）
       all      cand＋color＋near＋gear＋cond＋hud＋create（預設）
     加 &mute=1（沒有聲音，照規定帶著）。截圖：docs/art/shots/qicons-kw/。 -->

<style>
  html, body { margin: 0; }
  body.qi { background: #17151b; color: #eadfcc; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; width: 1280px; padding: 0 0 24px; overflow-x: hidden; }

<body class="qi">
<div class="qi-wrap" id="root"></div>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script><script src="fx.js"></script><script src="realms.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="anim.js"></script><script src="idleWeapons.js"></script>
<script src="gearArt.js"></script><script src="skillsData.js"></script><script src="skillIcons.js"></script><script src="parts.js"></script><script src="assembled.js"></script>
<script src="itemIcons.js"></script><script src="hudIcons.js"></script><script src="tools/obLiveIcons.js"></script>
<script src="obSamples.js"></script>
<script src="qIcons.js"></script><script src="qIconsWeapons.js"></script><script src="qIconsArmor.js"></script><script src="qIconsSkills.js"></script><script src="qIconsParts.js"></script><script src="qIconsStatus.js"></script>
<script src="qPartsData.js"></script>
<script src="qIconsKeywords.js"></script><script src="qIconsHud.js"></script>
<script src="qIconsKW.js"></script>
<script>
const { h } = OB, Q = QIcons, QW = QIconsWeapons, QA = QIconsArmor, QS = QIconsSkills, QP = QIconsParts, QST = QIconsStatus, K = QIconsKeywords, QH = QIconsHud, KW = QIconsKW, TAU = Math.PI * 2;
OB.applyTheme("capital");
const PART = OB.param("part", "all"), root = document.getElementById("root"), show = (p) => PART === "all" ? ["cand", "color", "near", "gear", "cond", "hud", "create"].includes(p) : PART === p;
const T1 = { res: 1 };
const nn = (c, k) => { c.style.width = c.width * k / (c.dataset.res ? Number(c.dataset.res) : 1) + "px"; c.style.height = c.height * k / (c.dataset.res ? Number(c.dataset.res) : 1) + "px"; c.style.imageRendering = "pixelated"; return c; };
const r2 = (c) => { c.dataset.res = "2"; return c; };
const one = (label, els) => h("div.qi-one", {}, h("span", { style: "display:flex;gap:4px;align-items:center" }, els), label ? h("i", {}, label) : null);
const ALL16 = [...K.KEYS, ...KW.KEYS];
const zhOf = (kw) => (KW.isNew(kw) ? KW.ZH[kw] : K.LIST[kw].zh);
const CHIP = KW.SIZES.map((S) => [S, K.sizeOf(S, 1)]); /* 真 1 倍圓章邊長：32→13、42→18、48→20、64→27 */
const chip1 = (kw, D, cand, o = {}) => KW.chipCanvas(kw, D, 1, { res: 1, cand, ...o });
const chip2 = (kw, D, cand, o = {}) => r2(KW.chipCanvas(kw, D, 1, { res: 2, cand, ...o }));
const CANDS = ["a", "b"];

// ---------------------------------------------------------------- 色盲模擬（Machado 2009，嚴重度 0.6＝色弱；線性 RGB 上乘矩陣）
const CVD = {
  none: null,
  prot: [[0.385450, 0.769005, -0.154455], [0.100526, 0.829802, 0.069673], [-0.007442, -0.022190, 1.029632]],
  deut: [[0.498864, 0.674741, -0.173604], [0.205199, 0.754872, 0.039929], [-0.011131, 0.030969, 0.980162]],
  trit: [[1.104996, -0.046633, -0.058363], [-0.032137, 0.971635, 0.060503], [0.001336, 0.317922, 0.680742]],
  gray: "gray",
};
const CVD_ZH = { none: "正常", prot: "紅色弱", deut: "綠色弱", trit: "藍色弱", gray: "灰階" };
const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const gam = (v) => { v = Math.min(1, Math.max(0, v)); return Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055)); };
const simRGB = (r, g, b, mode) => { const L = [lin(r), lin(g), lin(b)]; if (mode === "none") return [r, g, b]; if (mode === "gray") { const y = gam(0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2]); return [y, y, y]; } const M = CVD[mode]; return M.map((row) => gam(row[0] * L[0] + row[1] * L[1] + row[2] * L[2])); };
const simCanvas = (src, mode) => { const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.style.cssText = src.style.cssText; if (src.dataset.res) c.dataset.res = src.dataset.res; const x = c.getContext("2d"); x.drawImage(src, 0, 0); if (mode === "none") return c; const im = x.getImageData(0, 0, c.width, c.height), d = im.data; for (let i = 0; i < d.length; i += 4) { const [r, g, b] = simRGB(d[i], d[i + 1], d[i + 2], mode); d[i] = r; d[i + 1] = g; d[i + 2] = b; } x.putImageData(im, 0, 0); return c; };
const hex3 = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const oklab = (rgb) => { const [r, g, b] = rgb.map(lin); let l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b, m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b, s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b; [l, m, s] = [l, m, s].map((v) => Math.cbrt(Math.max(0, v))); return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; };
const dist = (a, b, mode) => { const A = oklab(simRGB(...hex3(a), mode)), B = oklab(simRGB(...hex3(b), mode)); return 100 * Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); };

if (PART === "all") root.append(h("h1", {}, "KW 段：連擊、怒氣、專注、氣的美術樣張（五項）"),
  h("p.note", {}, "畫圖 agent，2026-11-13。依據 main 的 docs/phases/PhaseKW計畫.md 第 3 節。①圓章圖樣與③創角圖示每個關鍵字 A／B 兩案（金框＝推薦）；②關鍵字色一組推薦＋色盲模擬；④HUD 層數計量 A（通用斜切段）／B（各關鍵字自己的格形）；⑤條件部件「層數達 N」A／B。既有的畫法檔一個都沒改。"));

// ---------------------------------------------------------------- ① 圓章兩案
if (show("cand")) {
  root.append(h("h2", {}, "①圓章圖樣：A／B 兩案 × 四個尺寸", h("small", {}, "　每格：真 1 倍（圓章 13／18／20／27）最近鄰放大 4 倍｜2 倍內部解析度放大 2 倍｜實際大小（2 倍）。最右：圖樣剪影（不含圓底）。金框＝推薦")),
    h("div.qi-tb", { style: "grid-template-columns:200px repeat(4,max-content) max-content" }, h("div"), CHIP.map(([S, D]) => h("div.hd", {}, `裝備格 ${S}：圓章 ${D}`)), h("div.hd", {}, "剪影 13／27"),
      KW.KEYS.flatMap((kw) => CANDS.map((cd) => { const e = KW.CAND[kw][cd], pick = KW.PICK[kw] === cd;
        return [h("div.rh", {}, h("span", {}, `${KW.ZH[kw]} ${cd.toUpperCase()}${pick ? "（推薦）" : ""}`, h("small", {}, e.topic), h("small", {}, "src " + e.src + "　k " + e.k))),
          CHIP.map(([, D]) => h("div.c" + (pick ? ".qi-pick" : ""), {}, nn(chip1(kw, D, cd), 4), nn(chip2(kw, D, cd), 2), chip2(kw, D, cd))),
          h("div.c", {}, [13, 27].map((D) => { const cpx = (D - 2) * e.k, g = KW.glyph(kw, cpx, 1, { cand: cd, ow: 0 }), x = g.getContext("2d"); x.globalCompositeOperation = "source-in"; x.fillStyle = "#f2e6c8"; x.fillRect(0, 0, g.width, g.height); return nn(g, 3); }))]; })).flat()));
}

// ---------------------------------------------------------------- ② 顏色
if (show("color")) {
  const modes = Object.keys(CVD);
  const sw = (col) => h("span", { style: `display:inline-block;width:22px;height:22px;border-radius:4px;background:${col};box-shadow:inset 0 0 0 1px #0006` });
  const swSim = (col, mode) => { const [r, g, b] = simRGB(...hex3(col), mode); return sw(`rgb(${r},${g},${b})`); };
  root.append(h("h2", {}, "②關鍵字色：推薦組（新 4 色在最右，粗字）× 色盲模擬", h("small", {}, "　色票＋圓章（真 1 倍 18，放大 3 倍）。模擬：Machado 2009 嚴重度 0.6（色弱）；灰階＝亮度")),
    h("div.qi-tb", { style: "grid-template-columns:70px repeat(16,max-content)" }, h("div"), ALL16.map((kw) => h("div.hd", { style: KW.isNew(kw) ? "color:#ffe08a;font-weight:bold" : "" }, zhOf(kw))),
      modes.flatMap((m) => [h("div.rh", {}, CVD_ZH[m]), ALL16.map((kw) => h("div.c" + (KW.isNew(kw) ? ".qi-pick" : ""), { style: "flex-direction:column" }, swSim(KW.colorOf(kw), m), nn(simCanvas(chip1(kw, 18), m), 3)))]).flat()));
  /* 距離表：每個新色和最近的兩色 */
  const rows = (C) => KW.KEYS.map((kw) => { const me = C[kw], others = ALL16.filter((k) => k !== kw).map((k) => [k, KW.isNew(k) ? C[k] : K.KC[k]]);
    return KW.ZH[kw].padEnd(3, "　") + me + "  " + modes.map((m) => { const ds = others.map(([k, c]) => [dist(me, c, m), k]).sort((a, b) => a[0] - b[0]); return CVD_ZH[m] + " " + ds[0][0].toFixed(1) + "(" + zhOf(ds[0][1]) + ")"; }).join("  "); }).join("\n");
  const oldMin = modes.map((m) => { let best = [999]; for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) { const d = dist(K.KC[K.KEYS[i]], K.KC[K.KEYS[j]], m); if (d < best[0]) best = [d, K.KEYS[i], K.KEYS[j]]; } return CVD_ZH[m] + " " + best[0].toFixed(1) + "(" + zhOf(best[1]) + "–" + zhOf(best[2]) + ")"; }).join("  ");
  const spec = (a, b) => modes.map((m) => CVD_ZH[m] + " " + dist(KW.COLOR[a], K.KC[b], m).toFixed(1)).join("  ");
  root.append(h("h3", {}, "OKLab 距離（×100；大約 2 就看得出差，越大越好）：新色和最近的那一色"),
    h("div.qi-audit", {}, "推薦組\n" + rows(KW.COLOR) + "\n\n對照組（第一直覺：連擊鋼白、怒氣亮紅、專注藍紫、氣青綠）\n" + rows(KW.COLOR_ALT) + "\n\n既有 12 色彼此最近：" + oldMin + "\n派工單點名的兩對（推薦組）：怒氣–點燃 " + spec("fury", "ignite") + "\n                          氣–召喚物 " + spec("ki", "summon")));
  root.append(h("h3", {}, "推薦組 vs 對照組（圓章 18 真 1 倍放大 3 倍，正常與綠色弱）"),
    h("div.qi-tb", { style: "grid-template-columns:120px repeat(8,max-content)" }, h("div"), ["正常", "綠色弱"].flatMap((z) => KW.KEYS.map((kw) => h("div.hd", {}, z + " " + KW.ZH[kw]))),
      [["推薦", {}], ["對照", { alt: true }]].flatMap(([z, o]) => [h("div.rh", {}, z), ["none", "deut"].flatMap((m) => KW.KEYS.map((kw) => h("div.c", {}, nn(simCanvas(chip1(kw, 18, undefined, o), m), 3))))]).flat()));
}

// ---------------------------------------------------------------- ① 撞圖：16 個圓章一排
if (show("near")) {
  const row = (cand, D, k) => h("div", { style: "display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end" }, ALL16.map((kw) => one(zhOf(kw), [nn(chip1(kw, D, cand), k)])));
  root.append(h("h2", {}, "①撞圖：既有 12 個＋新 4 個圓章排一排（真 1 倍，最小 13 放大 5 倍、18 放大 3 倍）", h("small", {}, "　上排新 4 個用 A、下排用 B")));
  for (const cd of CANDS) root.append(h("h3", {}, `新 4 個用 ${cd.toUpperCase()}：圓章 13（裝備格 32）`), row(cd, 13, 5), h("h3", {}, `新 4 個用 ${cd.toUpperCase()}：圓章 18（背包格 42）`), row(cd, 18, 3));
  /* 同題材、同畫面會出現的既有圖（第③④⑤批）：真 1 倍放大 4 倍 */
  const S = (id) => QST.cardCanvas(id, 20, 1, { res: 1 }), C = (cat, id) => QP.chipCanvas(cat, id, 18, 1, { res: 1 });
  const groups = [
    ["連擊", "combo_point", [["骨架：連段（同 B 的兩顆閃光）", C("skeleton", "combo")], ["效果：累積層數", C("effect", "add_stack")],["撞擊（圓章）", chip1("collision", 18)], ["倒地（圓章）", chip1("prone", 18)]]],
    ["怒氣", "fury", [["點燃（圓章）", chip1("ignite", 18)], ["狀態：嘲諷", S("taunted")], ["狀態：狂怒姿態", S("stance_fury")], ["狀態：流血", S("bleed")], ["隱蔽（圓章）", chip1("concealed", 18)]]],
    ["專注", "focus", [["標記（圓章）", chip1("marked", 18)], ["效果：揭露（眼）", C("effect", "reveal")], ["狀態：致盲", S("blinded")], ["條件：每一下都命中", C("condition", "all_strikes_hit")]]],
    ["氣", "ki", [["召喚物（圓章）", chip1("summon", 18)], ["狀態：蓄力", S("charging")], ["狀態：風架勢", S("stance_wind_1")], ["冰凍（圓章）", chip1("frozen", 18)], ["潮濕（圓章）", chip1("wet", 18)]]],
  ];
  root.append(h("h3", {}, "和最像的既有圖並排（真 1 倍放大 4 倍；狀態卡 20、部件圓片 18、圓章 18）"),
    h("div.qi-tb", { style: "grid-template-columns:60px max-content max-content 1fr" }, groups.map(([zh, kw, others]) => [h("div.rh", {}, zh), h("div.c.qi-pick", {}, one("A", [nn(chip1(kw, 18, "a"), 4)])), h("div.c", {}, one("B", [nn(chip1(kw, 18, "b"), 4)])), h("div.c", { style: "justify-content:flex-start" }, others.map(([z, cv]) => one(z, [nn(cv, 4)])))]).flat()));
}

// ---------------------------------------------------------------- ① 放在裝備格上
if (show("gear")) {
  const REPS = [["雙匕首・短", { kind: "dual_dagger", form: "short", material: "steel" }], ["戰斧・鐵", { kind: "axe", form: "battle", material: "iron" }], ["短弓・木", { kind: "bow", form: "short", material: "wood" }], ["長杖・木", { kind: "staff", form: "long", material: "wood" }], ["拳套・鐵", { kind: "fist", form: "knuckle", material: "iron" }], ["半身板甲・鋼", { kind: "plate", form: "half", material: "steel" }], ["長靴・皮", { kind: "boots", form: "tall", material: "leather" }]];
  /* 角的左上座標：qIconsKeywords.js 的 at()（沒有匯出，照抄一筆不改） */
  const cornerAt = (corner, size, D, res) => { const m = size * K.MARGIN, snap = (v) => Math.round(v * res) / res, far = snap(size - m - D), near = snap(m); return [corner[1] === "r" ? far : near, corner[0] === "b" ? far : near]; };
  const isArmor = (look) => !!QA.KINDS[look.kind], defOf = (look) => (isArmor(look) ? QA.def(look) : QW.def(look, true));
  const gearCv = (look, kw, px, res, cand) => { const cv = isArmor(look) ? QA.canvas(look, px, 1, { res }) : QW.canvas(look, px, 1, { frame: "gear", res }); cv.dataset.res = String(res); const x = cv.getContext("2d"); x.setTransform(res, 0, 0, res, 0, 0);
    const D = K.sizeOf(px, res), corner = K.cornersOf(defOf(look))[0], [x0, y0] = cornerAt(corner, px, D, res); KW.chip(x, kw, x0, y0, D, res, { cand }); return cv; };
  root.append(h("h2", {}, "①放在裝備格上（推薦 A；角照第⑤b 批 KEY_CORNER）", h("small", {}, "　每格：32 真 1 倍放大 3 倍｜42 真 1 倍放大 2 倍｜42 實際大小（2 倍）")),
    h("div.qi-tb", { style: "grid-template-columns:70px repeat(7,max-content)" }, h("div"), REPS.map(([z]) => h("div.hd", {}, z)),
      KW.KEYS.flatMap((kw) => [h("div.rh", {}, nn(chip1(kw, 18), 2), KW.ZH[kw]), REPS.map(([, look]) => h("div.c.n", { style: "flex-direction:column" }, nn(gearCv(look, kw, 32, 1), 3), h("span", { style: "display:flex;gap:4px;align-items:center" }, nn(gearCv(look, kw, 42, 1), 2), nn(gearCv(look, kw, 42, 2), 1))))]).flat()));
}

// ---------------------------------------------------------------- ⑤ 條件部件
KW.installCond();
if (show("cond")) {
  const SZ = [30, 26, 18, 16];
  const tile = (cat, id, px, res) => { const cv = QP.chipCanvas(cat, id, px, 1, { res }); cv.dataset.res = String(res); return cv; };
