<!-- 樣張，不接進遊戲（畫圖 agent，2026-11-11）。紀錄：docs/art/Q版小圖示-第1批武器.md；規則：docs/art/Q版小圖示樣張.md 第 2 節。
     左＝現行畫法（只讀）：武器小圖示是實機程式打包的 tools/obLiveIcons.js（client/src/render/weaponIcon.ts），裝備圖示是 gearArt.js（client/src/render/gearIcon.ts 的樣張版）；
     右＝Q 版（qIconsWeapons.js，一張圖放米色圓章與裝備格兩種框）。
     網址參數 ?part=
       a        總表 A：全部 61 款，現行在左、Q 版在右，圓章 20／24、裝備格 32／48 的 1 倍＋ 4 倍放大（&group=melee1｜melee2｜ranged｜off 只畫一組）
       b        總表 B：全部 20px 圓章排在一起（撞圖檢查）：現行一排、Q 版一排、Q 版剪影一排；下面是同一張 2 倍內部解析度的圖用最近鄰放大 4 倍
       c        對照 C：每種一格，Q 版人物拿著它＋圖示
       scene    情境圖：武器架（米色圓章 20px）與背包／裝備欄（裝備格 42px），現行與 Q 版並排
       var      變體：材質、元素關鍵字、稀有度（照現行的分法）
       close    單一種類的特寫（&kind=sword…）：每款 1 倍、4 倍、2 倍內部解析度的圖最近鄰放大 6 倍
       audit    自查表：規則 7 佔框比（分母＝圓章框線以內的直徑）、規則 6 亮度
       review   自己檢查用：全部款式最近鄰放大（圓章 20／24／28、裝備格 32）：上排 2 倍內部解析度、下排真 1 倍，&from=0&n=30 分段
       true1x   真 1 倍（canvas 寬高＝CSS px）最近鄰放大 6 倍：每格 現行｜Q 版真 1 倍｜Q 版 2 倍內部解析度；&group=badge（圓章 20，預設）｜gear（裝備格 32）｜rar（稀有度框 ×5），&from=&n= 分段；重拍：qicons_shots.py true1x weapons
       hash     每款六個尺寸的像素指紋（改版前後比對哪幾款真的變了）；qicons_shots.py --hash
     第 2 版（2026-11-12，照 Q版小圖示-第1批武器-審查.md）：圓章裡的構圖用 o.badge 分（鞭在圓章裡盤成一圈、弓的弦與箭桿在圓章裡是 1px 深褐線）。
       all      a＋b＋c＋var＋scene（預設）
     截圖：docs/art/shots/qicons/weapons-*.png；特寫：docs/art/closeup/qicons/weapons/；重拍：uv run python docs/art/sample/tools/qicons_shots.py weapons -->

<body class="qi">

<script>
const { h } = OB, Q = QIcons, QW = QIconsWeapons, TAU = Math.PI * 2;
OB.applyTheme("capital");
const PART = OB.param("part", "all"), root = document.getElementById("root");
const show = (p) => PART === "all" || PART === p;
/** 一張 canvas：顯示邊長 px×zoom；zoom 1 時內部 ×2，放大時直接用向量畫到該倍率。opt.res＝指定內部解析度（1＝真 1 倍，?part=true1x 用）。 */
function cvs(px, zoom, draw, opt = {}) { const res = opt.res ?? (zoom === 1 ? 2 : zoom), c = document.createElement("canvas"); c.width = c.height = Math.round(px * res); c.style.width = c.style.height = px * zoom + "px"; const x = c.getContext("2d"); x.scale(res, res); draw(x, res); return c; }
/** 把 2 倍內部解析度的圖（內部 ×2）用最近鄰放大 k 倍，檢查用。 */
const nn = (c, px, k) => { c.style.width = c.style.height = px * k + "px"; c.style.imageRendering = "pixelated"; return c; };

/* 真 1 倍檢查（?part=true1x）的小工具（五個樣張頁各有一份相同的）。真 1 倍＝canvas 寬高等於 CSS px（內部解析度 res＝1），是 100% 縮放螢幕上的像素；
   其他分段的「最近鄰放大」都是 2 倍內部解析度（canvas 寬高＝CSS px ×2）。一格三張，都用最近鄰放大 k 倍：現行（真 1 倍）｜Q 版真 1 倍｜Q 版 2 倍內部解析度（對照）。 */
const T1X = { res: 1 };
const t1Cell = (label, px, k, old1, q1, q2, bg = "#2a2a3c") => { for (const c of [old1, q1]) if (c && c.width !== px) console.error("true1x: " + label + " canvas " + c.width + " != " + px);
  return h("div", { style: "background:" + bg + ";border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center" }, h("div", { style: "display:flex;gap:4px;align-items:center" }, old1 ? nn(old1, px, k) : h("span", { style: "width:" + px * k + "px;height:" + px * k + "px;display:inline-block;box-shadow:inset 0 0 0 1px #4a4450" }), nn(q1, px, k), nn(q2, px, k)), h("i", { style: "font:11px Consolas,'Microsoft JhengHei',sans-serif;color:#b8ab96;font-style:normal;white-space:nowrap;overflow:hidden;max-width:" + (px * k * 3 + 8) + "px" }, label)); };
const t1Page = (title, cols, cells, total) => { document.documentElement.dataset.t1total = String(total);
  root.append(h("div", { style: "font-size:12.5px;color:#e8cf90;margin:0 0 4px" }, title + "　每格左起：現行（真 1 倍）｜Q 版真 1 倍｜Q 版 2 倍內部解析度（對照）；都是最近鄰放大"), h("div", { style: cols ? "display:grid;grid-template-columns:repeat(" + cols + ",max-content);gap:4px" : "display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end" }, cells)); };

// ---------------------------------------------------------------- 清單與預設外觀
// 預設材質：有出現在 content/weapons.yaml 的種類用武器表的 look（單手劍、雙手劍、火槍、手槍是鋼，其餘鐵／木／皮）；沒有的用 gearAppearance.json 的 defaultMaterial。
const MAT_OF = { sword: "steel", greatsword: "steel", longgun: "steel", pistol: "steel", dual_pistol: "steel" };
const lookOf = (kind, form, extra = {}) => ({ kind, form, material: MAT_OF[kind] ?? QW.KINDS[kind].def, ...extra });
const ALL = QW.list().map((v) => ({ ...v, look: lookOf(v.kind, v.form) }));
const GROUPS = { melee1: ["sword", "greatsword", "dagger", "dual_dagger", "axe"], melee2: ["hammer", "spear", "scythe", "fist", "whip"], ranged: ["bow", "crossbow", "longgun", "shotgun", "pistol", "dual_pistol", "staff"], off: ["round_shield", "kite_shield", "tome", "orb"] };
const GROUP_ZH = { melee1: "近戰（一）劍、巨劍、匕首、雙匕首、斧：5 種 16 款", melee2: "近戰（二）錘、矛、鐮刀、拳套、鞭：5 種 15 款", ranged: "遠程與法器 7 種 22 款", off: "副手 4 種 8 款" };

// ---------------------------------------------------------------- 現行畫法（只讀）
const beige = (x, s) => { const g = x.createRadialGradient(s / 2, s * 0.42, 0, s / 2, s / 2, s / 2); g.addColorStop(0, "#f6eed8"); g.addColorStop(1, "#d6c7a2"); x.fillStyle = g; x.beginPath(); x.arc(s / 2, s / 2, s / 2, 0, TAU); x.fill(); x.lineWidth = s / 24; x.strokeStyle = "#c8a868"; x.beginPath(); x.arc(s / 2, s / 2, s / 2 - s / 48, 0, TAU); x.stroke(); };
/** 現行武器小圖示（client/src/render/weaponIcon.ts 打包的 OBLive）放在米色圓章上。副手現行沒有小圖示。 */
const oldBadge = (look) => (QW.KINDS[look.kind].slot === "offhand" ? null : (px, zoom, o) => cvs(px, zoom, (x, res) => { beige(x, px); const a = OBLive.weaponIcon(look, Math.round(px * res / 2)); if (a) x.drawImage(a, 0, 0, px, px); }, o)); /* res＝1 時 OBLive 畫的就是 px 邊長的 canvas（它內部固定 ×2，所以給 px/2），線寬照 px 算，是現行畫法的真 1 倍 */
/** 樣張端 gearArt.js 用的元素關鍵字名（shock、freeze）和遊戲端（charged、frozen）不同，畫現行那一欄時換過去。 */
const OLD_KW = { charged: "shock", frozen: "freeze" };
const oldItem = (look) => ({ ...look, keywords: (look.keywords ?? []).map((k) => OLD_KW[k] ?? k) });
/** 現行魔導劍的裝備圖示：樣張端 gearArt.js 沒有 arcane 形制，以下是 client/src/render/gearIcon.ts 的 D.sword（arcane 分支）原樣程式。 */
function oldArcane(x, rarity) {
  const INK = "#16181d", A = "#9a86ff", P = { a: "#a9b6c6", guard: rarity === "epic" || rarity === "legendary" ? "#e8bb48" : "#7a5a3a", handle: "#5e3b1f" };
  const shape = (col, path, lw = 2) => { x.beginPath(); path(); x.fillStyle = col; x.fill(); x.lineWidth = lw; x.strokeStyle = INK; x.stroke(); };
  QW.gearFrame(x, rarity ?? "common");
  x.save(); x.beginPath(); x.roundRect(3, 3, 58, 58, 8); x.clip(); x.translate(32, 33); x.scale(1.15, 1.15); x.translate(-32, -33); x.translate(32, 33); x.rotate(Math.PI / 4);
  shape(P.a, () => { x.moveTo(-3.5, 8); x.lineTo(-3.5, -22); x.lineTo(0, -28); x.lineTo(3.5, -22); x.lineTo(3.5, 8); x.closePath(); });
  x.save(); x.shadowColor = A; x.shadowBlur = 5; x.beginPath(); x.moveTo(0, 5); x.lineTo(0, -22); x.strokeStyle = A; x.lineWidth = 2.4; x.stroke(); x.restore();
  shape("#b08a4a", () => { for (let i = 0; i < 12; i += 1) { const a = (i / 12) * TAU, k = i % 2 === 0 ? 7.5 : 5.6; x.lineTo(Math.cos(a) * k, 10 + Math.sin(a) * k * 0.6); } x.closePath(); }, 1.5);
  x.fillStyle = A; x.beginPath(); x.arc(0, 10, 2, 0, TAU); x.fill();
  shape(P.handle, () => x.roundRect(-2.5, 12, 5, 10, 1.5), 1.5);
  x.restore();
}
/** 現行裝備圖示（gearArt.js＝client/src/render/gearIcon.ts 的樣張版，64 單位；≤36px 不畫關鍵字小圖樣）。 */
const oldGear = (look) => (px, zoom, o) => cvs(px, zoom, (x) => { x.scale(px / 64, px / 64); x.lineJoin = "round"; if (look.kind === "sword" && look.form === "arcane") oldArcane(x, look.rarity); else GearArt.draw(x, oldItem(look), px <= 36); }, o);
const newBadge = (look) => (px, zoom, o = {}) => QW.canvas(look, px, zoom, o);
const newGear = (look, motif = false) => (px, zoom, o = {}) => QW.canvas(look, px, zoom, { frame: "gear", motif, ...o });

// ---------------------------------------------------------------- 總表 A 與特寫的卡片
const one = (label, els) => h("div.qi-one", {}, h("span", {}, els), h("i", {}, label));
/** 一邊（現行或 Q 版）：圓章 20／24、裝備格 32／48 的 1 倍，圓章 24 與裝備格 32 的 4 倍；close＝再加 2 倍內部解析度的圖最近鄰放大 6 倍（圓章 20、裝備格 32）。 */
function side(kind, badge, gear, close) {
  const b1 = badge ? one("圓章 20・24", [badge(20, 1), badge(24, 1)]) : h("div.qi-none", {}, "現行沒有小圖示");
  const g1 = one("裝備格 32・48", [gear(32, 1), gear(48, 1)]);
  const big = close && kind === "old" ? [] : [badge ? one("圓章 24 ×4", [badge(24, 4)]) : null, one("裝備格 32 ×4", [gear(32, 4)])]; /* 特寫頁的現行那一邊只放 1 倍與 1 倍放大圖（4 倍向量圖在總表 A） */
  if (close) big.push(badge ? one("圓章 20：2 倍內部解析度 ×6", [nn(badge(20, 1), 20, 6)]) : null, one("裝備格 32：2 倍內部解析度 ×6", [nn(gear(32, 1), 32, 6)]));
  return h("div.qi-side." + kind, {}, h("span.qi-tag", {}, kind === "old" ? "現行" : "Q版"), h("div.qi-col", {}, b1, g1), big);
}
const card = (v, close) => h("div.qi-card", {}, h("div.qi-nm", {}, `${v.kindZh}・${v.zh}`, h("small", {}, `${v.kind} / ${v.form}`)),
  h("div.qi-pair", { style: close ? "grid-template-columns:452px 1fr" : "" }, side("old", oldBadge(v.look), oldGear(v.look), close), side("new", newBadge(v.look), newGear(v.look), close)));

if (PART === "all") root.append(h("h1", {}, "小圖示改 Q 版：第 1 批 武器與副手（現行在左、Q 版在右）"),
  h("p.note", {}, "畫圖 agent，2026-11-11。武器 17 種 53 款＋副手 4 種 8 款（清單照遊戲端 gearAppearance.json 的 kind × form）。同一張圖放兩種框：米色圓章（武器小圖示 20、24px）與裝備格（32、48px）；框都是現行樣式，只換框裡的圖。全部程式繪製，新畫法在 qIconsWeapons.js，現行畫法只讀。"));

if (show("a")) {
  const only = OB.param("group", "");
  root.append(h("h2", {}, "總表 A：全部款式", h("small", {}, "　每款：圓章 20、24 與裝備格 32、48 的實際尺寸，以及圓章 24、裝備格 32 放大 4 倍（放大的是直接用向量畫到 4 倍，簡化程度照 1 倍）")));
  for (const [g, kinds] of Object.entries(GROUPS)) { if (only && only !== g) continue;
    root.append(h("h3", {}, GROUP_ZH[g]), h("div.qi-grid", { style: "grid-template-columns:1fr" }, ALL.filter((v) => kinds.includes(v.kind)).sort((a, b) => kinds.indexOf(a.kind) - kinds.indexOf(b.kind)).map((v) => card(v, false)))); }
}

// ---------------------------------------------------------------- 總表 B：撞圖檢查
/** Q 版圖樣的剪影（整張塗成深色）放在米色圓章上。 */
function silhouette(look, px) {
  const d = QW.def(look), res = 2;
  return cvs(px, 1, (x) => { beige(x, px); const a = px * d.meta.badge, p = (px - a) / 2, art = Q.render({ d: d.d }, a, res, { ow: Q.outlinePx(px), badge: true }), t = document.createElement("canvas"); t.width = art.width; t.height = art.height; const tx = t.getContext("2d"); tx.drawImage(art, 0, 0); tx.globalCompositeOperation = "source-in"; tx.fillStyle = "#16121a"; tx.fillRect(0, 0, t.width, t.height); x.drawImage(t, p, p, a, a); });
}
if (show("b")) {
  const sheet = (k) => h("div.qi-sheet", {}, Object.keys(QW.KINDS).map((kind) => { const vs = ALL.filter((v) => v.kind === kind), z = (c) => (k === 1 ? c : nn(c, 20, k)), blank = () => h("span", { style: `width:${20 * k}px;height:${20 * k}px;display:inline-block` });
    return h("div.qi-grp", {}, h("b", {}, `${QW.KINDS[kind].zh}：${vs.map((v) => v.zh).join("、")}`),
      h("div.r", {}, h("em", {}, "現行"), vs.map((v) => { const o = oldBadge(v.look); return o ? z(o(20, 1)) : blank(); })),
      h("div.r", {}, h("em", {}, "Q版"), vs.map((v) => z(newBadge(v.look)(20, 1)))),
