<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Q 版 NPC 與人形敵人</title>
<style>
  body { margin: 0; padding: 12px 16px; background: #1b1e24; color: #e8e8ea; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 12px; width: 1284px; }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 14px 0 4px; border-bottom: 1px solid #3a3f4a; padding-bottom: 3px; }
  .note { color: #a9adb6; margin: 2px 0 6px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 6px; }
  .cell { background: #262b33; border-radius: 6px; padding: 4px 4px 2px; }
  .cell:nth-child(2n) { background: #22262e; }
  .cell b { font-size: 13px; } .cell i { color: #a9adb6; font-style: normal; margin-left: 4px; } .cell .s { color: #e8bb48; font-size: 11px; display: block; height: 14px; overflow: hidden; white-space: nowrap; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>Q 版 NPC 與人形敵人（全身四方向：正、東、西、背）</h1>
<div class="note">本體＝<code>qDoll.js</code>（不改）；新部件＝<code>qNpc.js</code>，和本體合成後描同一圈剪影外框。外觀資料照 content 的 portrait 欄位（傭兵、主城、雲嶺、荒原、郵差）；
<span style="color:#e8bb48">★</span> 是為了一眼看出身分建議補的（content 沒有，美術 PM 決定要不要寫進 content）。1.5 倍。修士色票 代決 7；盜賊三套 代決 9。</div>
<div id="root"></div>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script><script src="fx.js"></script><script src="realms.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="anim.js"></script><script src="idleWeapons.js"></script>
<script src="qNpc.js"></script><script src="qPortrait.js"></script>
<script>
const QS = new URLSearchParams(location.search), Z = +(QS.get("z") ?? 1), ONLY = QS.get("s");
const SZ = 1.5 * Z, CW = 49 * Z, CH = 92 * Z, VIEWS = [["front", false, "正"], ["side", false, "東"], ["side", true, "西"], ["back", false, "背"]];
const root = document.getElementById("root"); if (Z > 1) document.body.style.setProperty("--cols", String(Math.max(1, Math.floor(6 / Z))));
function cell(host, name, sub, note, unit, opt = {}) {
  const d = document.createElement("div"); d.className = "cell";
  d.innerHTML = `<b>${name}</b><i>${sub ?? ""}</i><span class="s">${note ?? ""}</span>`;
  const c = document.createElement("canvas"), dpr = 2; c.width = CW * 4 * dpr; c.height = CH * dpr; c.style.width = CW * 4 + "px"; c.style.height = CH + "px";
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const k = SZ * (opt.k ?? 1);
  VIEWS.forEach(([v, w, zh], i) => {
    const cx = CW * i + CW / 2, cy = CH - 12 * Z;
    x.fillStyle = "rgba(0,0,0,0.25)"; x.beginPath(); x.ellipse(cx, cy, 11 * k, 3.2 * k, 0, 0, Math.PI * 2); x.fill();
    if (opt.elite) { x.strokeStyle = "#16121a"; x.lineWidth = 2.6; x.beginPath(); x.ellipse(cx, cy, 13 * k, 4 * k, 0, 0, Math.PI * 2); x.stroke(); x.strokeStyle = "#ffbf3a"; x.lineWidth = 1.3; x.stroke(); }
    QNpc.stamp(x, unit, v, cx, cy, k, w, { dpr: 2, glow: opt.glow });
    x.fillStyle = "#6a707c"; x.font = "10px sans-serif"; x.textAlign = "center"; x.fillText(zh, cx, CH - 1);
  });
  d.appendChild(c); host.appendChild(d);
}
let SEC = 0;
function section(title, note, fn) {
  SEC++; if (ONLY && !ONLY.split(",").includes(String(SEC))) return;
  const h = document.createElement("h2"); h.textContent = title; root.appendChild(h);
  if (note) { const n = document.createElement("div"); n.className = "note"; n.innerHTML = note; root.appendChild(n); }
  const g = document.createElement("div"); g.className = "grid"; root.appendChild(g); fn(g);
}
section("山中修士（青霧觀，雲嶺）", "新部件：髮髻（qDoll bun）、赤膊、念珠（qDoll beads）、圍裙、背葫蘆、木偶箱、黃符、白紗面罩、白羽披肩、劍穗、拂塵、符紙、傀儡線。精英＝金環、頭目＝外光（外光只代表頭目）。",
  (g) => QNpc.MONKS.forEach(([n, r, u, o]) => cell(g, n, r, "", u, { k: o?.k, elite: o?.elite, glow: o?.glow })));
for (const key of ["base", "cliff", "ash"]) { const [t, list] = QNpc.BANDITS[key];
  section(t, key === "cliff" ? "斗笠改成 Q 版草編圓錐（qNpc <code>douli</code>）；C 版借用的 <code>wide_hat</code> 在 Q 版是西式寬簷帽，看不出斗笠。" : "", (g) => list.forEach(([n, r, u, o]) => cell(g, n, r, "", u, { elite: o?.elite, glow: o?.glow }))); }
const P = QPortrait, GROUPS = [["merc", "系統傭兵（9；武器照 build）"], ["capital", "主城樞島 NPC（9）"], ["postman", "郵差（3；郵袋 mailbag）"], ["cloud_ridge", "雲嶺 NPC（9＋葛蘭；霜音是白狐，不畫紙娃娃）"], ["ashen_waste", "灰燼荒原 NPC（6）"]];
for (const [grp, title] of GROUPS) section(title, "", (g) => P.N.filter((n) => n[3] === grp && !n[7].includes("fox")).forEach((n) => { const s = P.SUGGEST[n[0]]; cell(g, n[1], n[2], s?.note ?? "", P.bodyUnit(n)); }));
document.title += " ✓";
</script>
</body>
</html>
