<p class="note">畫圖 agent，2026-11-19。紀錄 docs/art/SK-2原語-美術.md。分段：

<script>
const OO = OccludeOutline, SK = SK2Prim, QP = QIconsParts, QS = QIconsSkills, QSt = QIconsStatus, Q = QIcons, GB = QBossGiant, T = OO.T;
const P = new URLSearchParams(location.search), PART = P.get("part") || "icons", CASE = P.get("case") || "hook";
const FONT = "'Noto Sans TC','Microsoft JhengHei',sans-serif", TAU = Math.PI * 2;
try { QStatusLive.setGlossary(window.QPARTS_GLOSSARY); } catch (e) { console.log("status glossary: " + e); }
SK.install();
const TP = PaperDoll.TEMPLATES, R4 = Regions4, REG = (id) => R4.REGIONS.find((r) => r.id === id);
const ASH = REG("ashen_waste"), CRY = REG("crystal_crown");
const tile = (region, id) => (ctx, x, y, gx, gy) => { ctx.save(); ctx.translate(x, y); ctx.scale(T / 52, T / 52); R4.tile(ctx, region, id, 0, 0, gx, gy); ctx.restore(); };
/** 遊戲的地圖縮放（同 rg-marks.html／occlude-outline.html：stageLayout.ts fitScale＋hudSideInsets，12×12 地圖）：1600×900 → 1.31、800×600 → 0.53。 */
const S1600 = Math.min((1600 - 268 - 240 - 16) / 588, (900 - 60 - 16) / 630), S800 = Math.min((800 - 246 - 226 - 16) / 588, (600 - 60 - 16) / 630);
/** 狀態列的反向放大（minMark.ts：registerMark(row, { base: ROW_ICON_FEET − 2, min: MIN_STATUS_GLYPH_PX 10 })）。 */
const rowK = (S) => Math.max(1, 10 / (9 * S));
const { ease, span, lerp, clamp } = SK;

// ---------------- 拼圖（照 rg-marks.html） ----------------
function sheet(W, blocks) {
  const lay = [], pad = 14; let y = pad;
  const tmp = document.createElement("canvas").getContext("2d");
  const wrap = (s, w, px) => { tmp.font = `${px}px ${FONT}`; const out = []; for (const para of String(s).split("\n")) { let line = ""; for (const ch of para) { if (tmp.measureText(line + ch).width > w && line) { out.push(line); line = ch; } else line += ch; } out.push(line); } return out; };
  for (const b of blocks) {
    if (b.title) { lay.push({ t: "title", s: b.title, y }); y += 26; }
    else if (b.note) { const ls = wrap(b.note, W - 2 * pad, 13); lay.push({ t: "note", ls, y }); y += ls.length * 18 + 4; }
    else if (b.cells) {
      const gap = b.gap ?? 12; let x = pad, rowH = 0; const items = [];
      for (const c of b.cells) {
        const w = c.w ?? c.cv.width, h = c.h ?? c.cv.height;
        if (x + w > W - pad + 0.5 && items.length) { lay.push({ t: "cells", items: items.splice(0), y }); y += rowH + 10; x = pad; rowH = 0; }
        const caps = c.cap ? wrap(c.cap, Math.max(w, c.capW ?? 110), 12) : [];
        items.push({ c, x, w, h, caps, bg: c.bg }); x += Math.max(w, caps.length ? (c.capW ?? 110) : 0) + gap; rowH = Math.max(rowH, h + (caps.length ? caps.length * 16 + 4 : 0));
      }
      lay.push({ t: "cells", items, y }); y += rowH + 10;
    }
  }
  const Hh = y + pad, cv = document.createElement("canvas"); cv.width = W; cv.height = Hh;
  const g = cv.getContext("2d"); g.fillStyle = "#14161f"; g.fillRect(0, 0, W, Hh); g.textBaseline = "top";
  for (const l of lay) {
    if (l.t === "title") { g.font = `bold 16px ${FONT}`; g.fillStyle = "#e8bb48"; g.fillText(l.s, pad, l.y); }
    else if (l.t === "note") { g.font = `13px ${FONT}`; g.fillStyle = "#b8ab96"; l.ls.forEach((s, i) => g.fillText(s, pad, l.y + i * 18)); }
    else for (const it of l.items) {
      if (it.bg) { g.fillStyle = it.bg; g.fillRect(it.x, l.y, it.w, it.h); }
      g.imageSmoothingEnabled = !it.c.nn; g.drawImage(it.c.cv, it.x, l.y, it.w, it.h); g.imageSmoothingEnabled = true;
      g.font = `12px ${FONT}`; g.fillStyle = "#d8ccb8"; it.caps.forEach((s, i) => g.fillText(s, it.x, l.y + it.h + 4 + i * 16));
    }
  }
  return cv;
}
function publish(cv, type = "image/jpeg") {
  document.getElementById("sheet").appendChild(cv);
  document.getElementById("out").textContent = cv.toDataURL(type, 0.8);
  document.documentElement.dataset.w = cv.width;
  document.documentElement.dataset.h = document.documentElement.scrollHeight;
  document.documentElement.dataset.done = "1";
}
const box = (w, h, fill, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); if (fill) { g.fillStyle = fill; g.fillRect(0, 0, w, h); } draw(g); return c; };
/** 最近鄰放大（真 1 倍的 canvas 放大 Z 倍）。 */
const nn = (cv, Z, cap, bg) => ({ cv, w: cv.width * Z, h: cv.height * Z, nn: true, cap, bg });
/** 放在現行技能介面的深色底上（組裝列、工坊）。 */
const PANEL = "#1e2230";

// =====================================================================
// 戰場繪製（模型像素 1 格 48；照 rg-marks.html render 的圖層順序：地面 → 地面標記 → 單位之下 → 一排一排 → 之上 → 頭頂）
// =====================================================================
const BODY = new Map();
/** 單位身體快取（同一個 tpl／view／west／sc 只用 QDoll.stamp 畫一次），貼到 (u.x, u.y)。 */
function bodySprite(u, sc) {
  const key = [u.tpl, u.view, !!u.west, sc.toFixed(3), JSON.stringify(u.pose ?? null)].join("|");
  if (!BODY.has(key)) {
    const W = Math.ceil(2.4 * T * sc), H = Math.ceil(2.6 * T * sc), c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d"); g.setTransform(sc, 0, 0, sc, 0, 0); g.translate(1.2 * T - 0.5 * T, 1.7 * T - 0.5 * T - OO.FEET);
    if (u.pose) QDoll.setPose(u.pose);
    try { OO.drawBody(g, { ...u, x: 0, y: 0, dx: 0, dy: 0, h: 0 }, sc); } finally { QDoll.setPose(null); }
    BODY.set(key, { c, ox: 1.2 * T, oy: 1.7 * T });
  }
  return BODY.get(key);
}
function drawUnit(g, u, sc) {
  const f = OO.feetOf(u), s = bodySprite(u, sc);
  g.save();
  if (u.fall) { const sx = u.west ? 1 : -1; g.translate(f.x + sx * 6 * u.fall, f.y - 4 * u.fall); g.rotate(sx * u.fall * Math.PI / 2); g.translate(-f.x, -f.y); g.filter = `grayscale(${0.7 * u.fall}) brightness(${1 - 0.2 * u.fall})`; g.globalAlpha = 1 - 0.25 * u.fall; } /* 倒下：往背後（朝西的往東）躺平、變灰 */
  g.drawImage(s.c, f.x - s.ox, f.y - s.oy, s.c.width / sc, s.c.height / sc);
  if (u.flash > 0) { const w = whiteOf(s.c); g.globalAlpha = clamp(u.flash) * (1 - 0.4 * (u.fall ?? 0)); g.drawImage(w, f.x - s.ox, f.y - s.oy, s.c.width / sc, s.c.height / sc); }
  g.restore();
}
const WHITE = new WeakMap();
function whiteOf(src) { if (!WHITE.has(src)) { const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; const x = c.getContext("2d"); x.drawImage(src, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); WHITE.set(src, c); } return WHITE.get(src); }
/** 腳邊 HP 條＋狀態列（Q 版狀態圖示、第⑤批；會擴散的加記號）。status：[{ id, spread, pop（0～1 剛加上的放大）, a（透明度）}]。 */
function hud(g, u, sc, K) {
  if (u.fall >= 1 || u.noHud) return;
  const c = OO.centerOf(u), w = T * 0.8, y = c.y + T * 0.36, cx = c.x + (u.dx ?? 0);
  g.fillStyle = "#000"; g.fillRect(cx - w / 2, y, w, 5);
  const r = u.hp ?? 1; g.fillStyle = r > 0.5 ? "#4cd964" : r > 0.25 ? "#ffcc00" : "#ff3b30"; g.fillRect(cx - w / 2, y, w * r, 5);
  const list = (u.status ?? []).filter((s) => (s.a ?? 1) > 0);
  if (!list.length) return;
  const px = 11 * K, n = Math.min(K > 1 ? 1 : 3, list.length), x0 = cx - (n * px + (n - 1)) / 2;
  list.slice(0, n).forEach((s, i) => {
    const k = 1 + 0.6 * (1 - ease(s.pop ?? 1)), q = px * k, cv = SK.headCanvas(s.id, Math.round(q * sc), 1, { res: 1, spread: s.spread }); /* 直接以裝置像素的大小畫（框邊長＝畫面上的 px，記號才用對的排法） */
    const mx = x0 + i * (px + 1) + px / 2, my = y - 4 - px / 2, m = g.getTransform();
    const dx = Math.round(m.a * mx + m.e - cv.width / 2), dy = Math.round(m.d * my + m.f - cv.height / 2);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = s.a ?? 1; g.drawImage(cv, dx, dy); g.restore();
  });
}
/** 表面（遊戲端 SURFACES：表面色疊在地形上；樣張用圓角方塊＋幾道亮紋示意，k＝剩下的比例 0～1）。 */
const SURF = { ice: { col: "#c8ecff", a: 0.7, hi: "#ffffff" }, water: { col: "#3a7bd5", a: 0.55, hi: "#cfe8ff" }, fire: { col: "#ff6a1a", a: 0.7, hi: "#ffd23f" }, poison: { col: "#7bc043", a: 0.6, hi: "#d6f59a" } };
function surface(g, gx, gy, id, k = 1, glow = 0) {
  if (k <= 0) return; const s = SURF[id], cx = (gx + 0.5) * T, cy = (gy + 0.5) * T, h = (T / 2 - 2) * Math.sqrt(k);
  g.save(); g.globalAlpha = Math.min(0.92, s.a + 0.15) * Math.min(1, k * 1.4); g.beginPath(); g.roundRect(cx - h, cy - h, h * 2, h * 2, 10 * Math.sqrt(k)); g.fillStyle = s.col; g.fill(); g.globalAlpha = Math.min(1, k * 1.4); g.lineWidth = 1; g.strokeStyle = "rgba(22,18,26,0.55)"; g.stroke();
  g.globalAlpha = 0.55 * Math.min(1, k * 1.4) + glow * 0.4; g.lineWidth = 1.6 + glow * 1.6; g.strokeStyle = s.hi; g.stroke();
  g.globalAlpha = 0.7 * Math.min(1, k * 1.4); g.strokeStyle = s.hi; g.lineWidth = 1.4; g.lineCap = "round";
  for (const [a, b, c2, d] of [[-0.6, -0.4, -0.15, -0.55], [0.1, 0.2, 0.55, 0.05], [-0.4, 0.45, -0.05, 0.3]]) { g.beginPath(); g.moveTo(cx + a * h, cy + b * h); g.lineTo(cx + c2 * h, cy + d * h); g.stroke(); }
  g.restore();
}
/** 一個場景畫成一張 canvas。scene＝{ cols, rows, groundAt, units, giant, decals, under, over, top }；view＝{ S, res, x0, y0, w, h }。 */
function render(scene, view) {
  const sc = view.S * (view.res ?? 1) * (view.zoom ?? 1), W = Math.round(view.w * sc), H = Math.round(view.h * sc);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  const xf = () => g.setTransform(sc, 0, 0, sc, -view.x0 * sc, -view.y0 * sc);
  xf(); const K = rowK(view.S);
  for (let y = 0; y < scene.rows; y++) for (let x = 0; x < scene.cols; x++) { g.save(); g.beginPath(); g.rect(x * T, y * T, T, T); g.clip(); scene.groundAt(x, y)(g, x * T, y * T, x, y); g.restore(); }
  g.save(); g.strokeStyle = "rgba(0,0,0,0.22)"; g.lineWidth = 1 / sc; for (let y = 0; y <= scene.rows; y++) { g.beginPath(); g.moveTo(0, y * T); g.lineTo(scene.cols * T, y * T); g.stroke(); } for (let x = 0; x <= scene.cols; x++) { g.beginPath(); g.moveTo(x * T, 0); g.lineTo(x * T, scene.rows * T); g.stroke(); } g.restore();
  if (scene.decals) { xf(); scene.decals(g); }
  if (scene.under) { xf(); scene.under(g); }
  const units = [...scene.units].sort((a, b) => a.y - b.y || a.x - b.x);
  const rows = [...new Set([...units.map((u) => u.y), ...(scene.giant ? [scene.giant.row] : [])])].sort((a, b) => a - b);
  for (const row of rows) {
    if (scene.giant && scene.giant.row === row) { xf(); drawGiant(g, scene.giant); }
    const inRow = units.filter((u) => u.y === row);
    for (const u of inRow) { xf(); if (!u.fall) { g.save(); g.translate(u.dx ?? 0, 0); OO.drawRing(g, u); g.restore(); } drawUnit(g, u, sc); }
    for (const u of inRow) { xf(); hud(g, u, sc, K); }
    if (scene.rowFx) { xf(); scene.rowFx(g, row); }
  }
  if (scene.over) { xf(); scene.over(g); }
  if (scene.top) { xf(); scene.top(g); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  return cv;
}
/** 巨型頭目（灰燼之心 3×3）：錨點＝3×3 南排的南緣中點；cx,cy 是中心格。flash：撞擊白閃，shake：左右晃（模型 px）。 */
function drawGiant(g, G) {
  g.save(); g.translate((G.cx + 0.5) * T + (G.shake ?? 0), (G.cy + 2) * T); GB.draw(g, { phase: 1, t: 0 }, { flash: G.flash ?? 0 }); g.restore();
}

// ---------------- 角色、手的位置 ----------------
const U = {
  mage: (o) => ({ kind: "doll", team: "ally", tpl: "hero_mage", doll: TP.hero_mage, view: "side", hp: 0.9, hero: true, ...o }),
  bandit: (o) => ({ kind: "doll", team: "enemy", tpl: "bandit", doll: TP.bandit, view: "side", west: true, hp: 0.8, ...o }),
};
const HANDS = new Map();
/** 主手／副手在世界座標的位置（QDoll 的 POSE.hands 記錄；stamp 的離屏原點在 (W/2, H−FOOT)＝(64, 98)×size）。 */
function handOf(u, who = "off") {
  const key = [u.tpl, u.view, !!u.west, JSON.stringify(u.pose ?? null)].join("|");
  if (!HANDS.has(key)) {
    const P0 = { ...(u.pose ?? {}), hands: {} }, c = document.createElement("canvas"); c.width = 300; c.height = 300; const dpr = 3, size = OO.K;
    QDoll.setPose(P0); try { QDoll.stamp(c.getContext("2d"), u.doll, u.view, 150, 200, size, !!u.west, { dpr }); } finally { QDoll.setPose(null); }
    const rel = {}; for (const k of ["main", "off"]) if (P0.hands[k]) rel[k] = [-64 * size + P0.hands[k][0] / dpr, -98 * size + P0.hands[k][1] / dpr];
    HANDS.set(key, rel);
  }
  const r = HANDS.get(key)[who] ?? HANDS.get(key).main ?? [8, -24], f = OO.feetOf(u);
  return { x: f.x + r[0], y: f.y + r[1] };
}
const chestOf = (u) => { const f = OO.feetOf(u); return { x: f.x, y: f.y - 22 }; };

// ---------------- 地面 ----------------
/** 雲嶺地面（explore.js 的地面；同 rg-marks.html 的 CLOUD）：灰石，特效的顏色看得清楚。熔岩格用灰燼荒原的岩漿。 */
const CLOUD = (ctx, x, y, gx, gy) => { ctx.save(); ctx.translate(x - gx * T, y - gy * T); ctx.scale(T / 52, T / 52); Explore.ground(ctx, "s", gx, gy); ctx.restore(); };
const groundStone = (lava = []) => (x, y) => (lava.some(([a, b]) => a === x && b === y) ? tile(ASH, "lava") : CLOUD);
const VIEWW = (S, res = 1, zoom = 1) => ({ S, res, zoom, x0: 0, y0: T * 1.4, w: T * 9, h: T * 4.2 });

// =====================================================================
// 演出（t 毫秒 → 場景）。時間軸寫在每個函式的註解；紀錄檔第 3 節有同一張表。
// =====================================================================
const CASTER_POSE = { cast: { lean: 0.1, armL: -0.9 }, pull: { lean: -0.18, armL: -0.5 } };
/**
 * 吸收表面（gain＝元素）：法師 (1,3) 站在冰上，吸走腳下的冰。
 *   0–150 按地：法師前傾、冰面邊緣變亮。150–520 抽起：冰面往中心縮、透明；7 顆冰晶從冰面各處沿螺旋往上收進副手。
 *   380–620 成球：副手前方長出一顆冰色光球。560–1000 化成：光球一閃，收益的圖樣（元素＝冰的元素片；層數／治療／護盾換成那個效果的部件圖樣）
 *   從頭頂浮起、淡出；法杖頭染成冰色（這一招的元素換掉了）。
 */
function sceneAbsorb(t, opt = {}) {
  const surf = opt.surf ?? "ice", gain = opt.gain ?? "element:ice";
  const pose = t < 150 ? null : t < 620 ? CASTER_POSE.cast : null;
  const M = U.mage({ id: "M", x: 1, y: 3, pose }), B = U.bandit({ id: "B", x: 5, y: 3 });
  const hand = handOf(M, "off"), base = { x: 1.5 * T, y: 3.5 * T };
  const lift = ease(span(t, 150, 520)), glowRim = t < 150 ? span(t, 0, 150) : 1 - span(t, 150, 300);
  const col = SURF[surf], tint = surf === "water" ? QS.TINT.water : surf === "fire" ? QS.TINT.fire : surf === "poison" ? QS.TINT.poison : QS.TINT.ice;
  return {
    cols: 9, rows: 7, groundAt: groundStone(), units: [M, B],
    decals: (g) => surface(g, 1, 3, surf, 1 - lift, glowRim),
    top: (g) => {
      // 冰晶：7 顆，從冰面四周（固定角度）沿螺旋往上收進手
      // 抽起的光柱：從冰面往上收窄到手（半透明、兩側一道亮邊）
      const col = span(t, 160, 260) * (1 - span(t, 460, 560));
      if (col > 0) { const w0 = 21, w1 = 4; g.save(); g.globalAlpha = 0.32 * col; const gr = g.createLinearGradient(0, base.y, 0, hand.y); gr.addColorStop(0, tint[0]); gr.addColorStop(1, tint[1]); g.fillStyle = gr; g.beginPath(); g.moveTo(base.x - w0, base.y + 4); g.quadraticCurveTo(base.x - w0 * 0.3, base.y - 6, hand.x - w1, hand.y); g.lineTo(hand.x + w1, hand.y); g.quadraticCurveTo(base.x + w0 * 0.3, base.y - 6, base.x + w0, base.y + 4); g.closePath(); g.fill(); g.globalAlpha = 0.8 * col; g.strokeStyle = tint[1]; g.lineWidth = 1.4; g.stroke(); g.restore(); }
      for (let i = 0; i < 10; i++) {
        const t0 = 150 + i * 24, p = span(t, t0, t0 + 300); if (p <= 0 || p >= 1) continue;
        const a0 = (i / 10) * TAU + 0.4, r0 = 23, sx = base.x + Math.cos(a0) * r0, sy = base.y + Math.sin(a0) * r0 * 0.55;

PARTS.audit = () => {
  const rows = [];
  for (const e of NEW) for (const px of [30, 26, 18]) {
    const res = 4, cpx = px * 0.42 * 1.56, g = QP.glyph("effect", e.id, cpx, res), S = g.width, d = g.getContext("2d").getImageData(0, 0, S, S).data;
    let n = 0, lumSum = 0, hi = 0, x0 = S, x1 = 0, y0 = S, y1 = 0, out = 0; /* 圓片色環內緣＝半徑 42 − 線寬一半（現行 drawChip：線寬 r×0.12）→ 39.5／42 的圓片單位；圖樣 ±10 單位＝r×1.56／2 → 色環內緣＝圖樣 12.06 單位＝cpx × 0.603 */
    const c = S / 2, Rin = cpx * 0.603 * res; /* 第 2 版修正：圖樣本身＝圓片半徑 42 單位 × 1.56（chip）＝px × 0.655，18 的圓片是 11.8 px、走 ≤14 的 tiny；第 1 版用 px × 0.78＝14.04，18 量到的是不簡化的那一份 */
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = (y * S + x) * 4; if (d[i + 3] < 128) continue; const isOut = d[i] === 0x16 && d[i + 1] === 0x12 && d[i + 2] === 0x1a; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); if (isOut) continue; if (Math.hypot(x + 0.5 - c, y + 0.5 - c) > Rin) out++; n++; const L = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; lumSum += L; if (L >= 150) hi++; }
    const inner = 2 * Rin;
    rows.push([e.zh, px, ((Math.max(x1 - x0, y1 - y0) + 1) / inner * 100).toFixed(0) + "%", (lumSum / n).toFixed(0), (hi / n * 100).toFixed(0) + "%", (out / Math.max(1, n) * 100).toFixed(1) + "%"]);
  }
  const t = document.createElement("table"); t.innerHTML = "<tr><th>部件</th><th>圓片 px</th><th>佔色環內徑</th><th>平均亮度</th><th>亮度≥150</th><th>色塊超出色環內緣</th></tr>" + rows.map((r) => "<tr>" + r.map((v) => `<td>${v}</td>`).join("") + "</tr>").join("");
  t.style.cssText = "border-collapse:collapse;font-size:13px"; t.querySelectorAll("td,th").forEach((x) => (x.style.cssText = "border:1px solid #444;padding:2px 8px"));
  const pre = document.createElement("pre"); pre.id = "audit"; pre.textContent = rows.map((r) => r.join("\t")).join("\n");
  document.getElementById("sheet").append(t, pre);
  const cv = box(10, 10, "#000", () => {}); document.getElementById("out").textContent = cv.toDataURL("image/png");
  document.documentElement.dataset.h = document.documentElement.scrollHeight; document.documentElement.dataset.done = "1";
};
