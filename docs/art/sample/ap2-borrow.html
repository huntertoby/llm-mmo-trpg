//    部件：分母＝色環內緣直徑（圖樣 12.06 單位，同 sk3）；狀態：分母＝框內緣寬度（innerWidth），圖樣大小照 paint()（框邊長 × 0.74 × fitK）。

PARTS.audit = () => {
