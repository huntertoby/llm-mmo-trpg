     左＝現行畫法（只讀）：裝備圖示 gearArt.js（client/src/render/gearIcon.ts 的樣張版）；右＝Q 版（qIconsArmor.js，只放裝備格，沒有米色圓章）。武器與副手用第 1 批（qIconsWeapons.js，沒有改）。
     網址參數 ?part=
       a        總表 A：全部 44 款，現行在左、Q 版在右：裝備格 64／48／32 的實際尺寸、32 放大 4 倍（向量）、32 的 2 倍內部解析度的圖最近鄰放大 4 倍（&group=head｜body｜hands｜feet｜acc 只畫一組）
       b        總表 B：全部 32px 裝備格排在一起（撞圖檢查）：現行一排、Q 版一排、Q 版剪影一排；同一張 2 倍內部解析度的圖最近鄰放大 3 倍；最下面和第 1 批的盾、拳套、法器珠、法書並排
       c        對照 C：每款一格，Q 版人物穿著它（正面、側面）＋圖示（&group= 同上；飾品人物身上不畫，那一組只放現行與 Q 版）
       var      變體：材質、染色、元素關鍵字、稀有度（照現行的分法）
       scene    情境圖：裝備欄（9 格）與背包（裝備格 42px）、最小尺寸 32px，左邊全部現行、右邊全部 Q 版（武器與副手用第 1 批）
       close    單一種類的特寫（&kind=helmet…）：每款 64／48／42／32 的 1 倍、32 的 4 倍向量、32 的 2 倍內部解析度的圖最近鄰放大 5 倍，加人物對照
       audit    自查表：規則 7 佔框比、規則 6 亮度與亮面、離 48 格邊緣、離裝備格框線；另外把全部材質、染色、元素變體也量一遍
       review   自己檢查用：全部款式最近鄰放大（32 ×4、48 ×2）：上排 2 倍內部解析度、下排真 1 倍，&from=0&n=22 分段
       true1x   真 1 倍（canvas 寬高＝CSS px）最近鄰放大 6 倍：每格 現行｜Q 版真 1 倍｜Q 版 2 倍內部解析度，裝備格 32；&group=all（44 款，預設）｜dark（黑、紅、藍、褐染色各抽幾款），&from=&n= 分段；重拍：qicons_shots.py true1x armor
       hash     每款四個尺寸（32／42／48／64）的像素指紋
       all      a＋b＋c＋var＋scene（預設）
     截圖：docs/art/shots/qicons/armor-*.png；特寫：docs/art/closeup/qicons/armor/；重拍：uv run python docs/art/sample/tools/qicons_shots.py armor -->

<script>
const { h } = OB, Q = QIcons, QW = QIconsWeapons, QA = QIconsArmor, TAU = Math.PI * 2;
OB.applyTheme("capital");
const PART = OB.param("part", "all"), GROUP = OB.param("group", ""), root = document.getElementById("root");
const show = (p) => PART === "all" || PART === p;
/** 一張 canvas：顯示邊長 px×zoom；zoom 1 時內部 ×2，放大時直接用向量畫到該倍率。opt.res＝指定內部解析度（1＝真 1 倍，?part=true1x 用）。 */
function cvs(px, zoom, draw, opt = {}) { const res = opt.res ?? (zoom === 1 ? 2 : zoom), c = document.createElement("canvas"); c.width = c.height = Math.round(px * res); c.style.width = c.style.height = px * zoom + "px"; const x = c.getContext("2d"); x.scale(res, res); draw(x, res); return c; }
/** 把 2 倍內部解析度的圖（內部 ×2）用最近鄰放大 k 倍，檢查用。 */
const nn = (c, px, k) => { c.style.width = c.style.height = px * k + "px"; c.style.imageRendering = "pixelated"; return c; };

/* 真 1 倍檢查（?part=true1x）的小工具（五個樣張頁各有一份相同的）。真 1 倍＝canvas 寬高等於 CSS px（內部解析度 res＝1），是 100% 縮放螢幕上的像素；
   其他分段的「最近鄰放大」都是 2 倍內部解析度（canvas 寬高＝CSS px ×2）。一格三張，都用最近鄰放大 k 倍：現行（真 1 倍）｜Q 版真 1 倍｜Q 版 2 倍內部解析度（對照）。 */
const T1X = { res: 1 };
const t1Cell = (label, px, k, old1, q1, q2, bg = "#2a2a3c") => { for (const c of [old1, q1]) if (c && c.width !== px) console.error("true1x: " + label + " canvas " + c.width + " != " + px);
  return h("div", { style: "background:" + bg + ";border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center" }, h("div", { style: "display:flex;gap:4px;align-items:center" }, old1 ? nn(old1, px, k) : h("span", { style: "width:" + px * k + "px;height:" + px * k + "px;display:inline-block;box-shadow:inset 0 0 0 1px #4a4450" }), nn(q1, px, k), nn(q2, px, k)), h("i", { style: "font:11px Consolas,'Microsoft JhengHei',sans-serif;color:#b8ab96;font-style:normal;white-space:nowrap;overflow:hidden;max-width:" + (px * k * 3 + 8) + "px" }, label)); };
const t1Page = (title, cols, cells, total) => { document.documentElement.dataset.t1total = String(total);
  root.append(h("div", { style: "font-size:12.5px;color:#e8cf90;margin:0 0 4px" }, title + "　每格左起：現行（真 1 倍）｜Q 版真 1 倍｜Q 版 2 倍內部解析度（對照）；都是最近鄰放大"), h("div", { style: cols ? "display:grid;grid-template-columns:repeat(" + cols + ",max-content);gap:4px" : "display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end" }, cells)); };

// ---------------------------------------------------------------- 清單與預設外觀（預設材質照 gearAppearance.json 各形制的 defaultMaterial）
const lookOf = (kind, form, extra = {}) => ({ kind, form, material: QA.KINDS[kind].formDef?.[form] ?? QA.KINDS[kind].def, ...extra });
const ALL = QA.list().map((v) => ({ ...v, look: lookOf(v.kind, v.form) }));
const GROUPS = { head: ["hood", "hat", "circlet", "cap", "helmet"], body: ["robe", "leather", "mail", "plate", "coat"], hands: ["cloth_gloves", "leather_gloves", "gauntlets", "bracers"], feet: ["shoes", "boots", "iron_boots", "greaves"], acc: ["ring", "pendant", "charm"] };
const GROUP_ZH = { head: "頭 5 種 11 款", body: "身體 5 種 10 款", hands: "手 4 種 8 款", feet: "腳 4 種 8 款", acc: "飾品 3 種 7 款（戒指、墜飾、護符）" };
const inGroup = (g) => ALL.filter((v) => GROUPS[g].includes(v.kind));

// ---------------------------------------------------------------- 現行畫法（只讀）
/** 樣張端 gearArt.js 用的元素關鍵字名（shock、freeze）和遊戲端（charged、frozen）不同，畫現行那一欄時換過去。 */
const OLD_KW = { charged: "shock", frozen: "freeze" };
const oldItem = (look) => ({ ...look, keywords: (look.keywords ?? []).map((k) => OLD_KW[k] ?? k) });
/** 現行裝備圖示（gearArt.js＝client/src/render/gearIcon.ts 的樣張版，64 單位；≤36px 不畫關鍵字小圖樣）。 */
const oldGear = (look) => (px, zoom, o) => cvs(px, zoom, (x) => { x.scale(px / 64, px / 64); x.lineJoin = "round"; GearArt.draw(x, oldItem(look), px <= 36); }, o);
const isArmor = (look) => !!QA.KINDS[look.kind];
/** Q 版：防具飾品用這一批（qIconsArmor.js），武器與副手用第 1 批（qIconsWeapons.js）。 */
const newGear = (look, motif = false) => (px, zoom, o = {}) => (isArmor(look) ? QA.canvas(look, px, zoom, { motif, ...o }) : QW.canvas(look, px, zoom, { frame: "gear", motif, ...o }));

// ---------------------------------------------------------------- 人物對照（QDoll.stamp，不改畫）
/** 穿著這件裝備的 Q 版人物。裝備 → 人物部件用現行的 GearArt.dollGear；人物的材質表沒有銅、銀、晶石（會退回布色），這三種直接給顏色。focus＝畫面中心對準人物的哪個高度（人物單位，腳底 0、往上為負）。 */
const FOCUS = { head: [-30, 3.3], body: [-14, 3], hands: [-13, 3.4], feet: [-6, 3.6] };
function doll(look, view, w = 100, hh = 116) {
  const slot = QA.KINDS[look.kind].slot; if (!FOCUS[slot]) return null;
  const gear = GearArt.dollGear([oldItem(look)]), it = gear[slot];
  if (it && ["copper", "silver", "crystal"].includes(it.material) && !it.color) it.color = QA.MAT[it.material][0];
  const unit = { look: OB.HERO_LOOK, gear: { ...OB.HERO_GEAR, ...gear } }, [fy, k] = FOCUS[slot];
  return OB.cv(w, hh, (x) => { QDoll.stamp(x, unit, view, w / 2, hh / 2 - fy * k, k, false, { dpr: 3 }); });
}

// ---------------------------------------------------------------- 總表 A 與特寫的卡片
const one = (label, els) => h("div.qi-one", {}, h("span", {}, els), h("i", {}, label));
/** 一邊（現行或 Q 版）：裝備格 64／48／32（特寫多一個 42）的 1 倍；Q 版多一張 32 的 4 倍向量圖；兩邊都有 32 的 2 倍內部解析度的圖最近鄰放大（總表 4 倍、特寫 5 倍）。 */
function side(kind, gear, close) {
  const sizes = close ? [64, 48, 42, 32] : [64, 48, 32];
  return h("div.qi-side." + kind, {}, h("span.qi-tag", {}, kind === "old" ? "現行" : "Q版"), one("裝備格 " + sizes.join("・"), sizes.map((s) => gear(s, 1))),
    kind === "new" ? one("32 ×4（向量）", [gear(32, 4)]) : null, one(`32：2 倍內部解析度 ×${close ? 5 : 4}`, [nn(gear(32, 1), 32, close ? 5 : 4)]));
}
const card = (v, close) => h("div.qi-card", {}, h("div.qi-nm", {}, `${v.kindZh}・${v.zh}`, h("small", {}, `${v.kind} / ${v.form}・${QA.MAT_ZH[v.look.material]}`)),
  h("div.qi-pair", { style: close ? "grid-template-columns:max-content max-content max-content" : "grid-template-columns:max-content max-content" }, side("old", oldGear(v.look), close), side("new", newGear(v.look), close),
    close ? h("div.qi-side.doll", {}, h("span.qi-tag", {}, "人物"), doll(v.look, "front") ?? h("div.note", { style: "width:150px" }, "人物身上不畫（照現行圖示的題材）"), doll(v.look, "side")) : null));

if (PART === "all") root.append(h("h1", {}, "小圖示改 Q 版：第 2 批 防具與飾品（現行在左、Q 版在右）"),
  h("p.note", {}, "畫圖 agent，2026-11-12。防具 18 種 37 款＋飾品 3 種 7 款（清單照遊戲端 gearAppearance.json 的 kind × form）。只放裝備格（64、48、42、32px），沒有米色圓章；框是現行樣式，只換框裡的圖。全部程式繪製，新畫法在 qIconsArmor.js，現行畫法只讀。"));

if (show("a")) {
  root.append(h("h2", {}, "總表 A：全部款式", h("small", {}, "　每款：現行｜Q 版，裝備格 64、48、32 的實際尺寸；Q 版 32 放大 4 倍（直接用向量畫到 4 倍）；兩邊 32 的 2 倍內部解析度的圖最近鄰放大 4 倍（2 倍裝置像素，不是 100% 縮放螢幕上的真 1 倍；真 1 倍看 ?part=true1x）")));
  for (const g of Object.keys(GROUPS)) { if (GROUP && GROUP !== g) continue; root.append(h("h3", {}, GROUP_ZH[g]), h("div.qi-grid", { style: "grid-template-columns:1fr" }, inGroup(g).map((v) => card(v, false)))); }
}

// ---------------------------------------------------------------- 總表 B：撞圖檢查
/** Q 版圖樣的剪影（整張塗成米白）放在深色格底上（不畫框）。 */
function silhouette(look, px) {
  const d = isArmor(look) ? QA.def(look) : QW.def(look), res = 2, p = px * Q.GEAR_PAD, a = px - p * 2;
  return cvs(px, 1, (x) => { x.fillStyle = "#23262d"; x.beginPath(); x.roundRect(px / 32, px / 32, px * 30 / 32, px * 30 / 32, px * 9 / 64); x.fill();
    const art = Q.render({ d: d.d }, a, res, {}), t = document.createElement("canvas"); t.width = art.width; t.height = art.height; const tx = t.getContext("2d"); tx.drawImage(art, 0, 0); tx.globalCompositeOperation = "source-in"; tx.fillStyle = "#e8e0c8"; tx.fillRect(0, 0, t.width, t.height); x.drawImage(t, p, p, a, a); });
}
if (show("b")) {
  const grp = (title, vs, k) => { const z = (c) => (k === 1 ? c : nn(c, 32, k));
    return h("div.qi-grp", {}, h("b", {}, title), h("div.r", {}, h("em", {}, "現行"), vs.map((v) => z(oldGear(v.look)(32, 1)))), h("div.r", {}, h("em", {}, "Q版"), vs.map((v) => z(newGear(v.look)(32, 1)))), h("div.r", {}, h("em", {}, "剪影"), vs.map((v) => z(silhouette(v.look, 32))))); };
  const SUB = OB.param("sub", ""); /* 自己檢查用：&sub=3a｜3b｜x 只畫放大 3 倍的某一段 */
  const sheet = (k, gs = Object.keys(GROUPS)) => h("div.qi-sheet", {}, gs.map((g) => grp(`${GROUP_ZH[g]}：${inGroup(g).map((v) => v.zh).join("、")}`, inGroup(g), k)));
  // 和第 1 批並排：容易撞的幾組——圓的（圓盾、法器珠、戒指、臂環、項鍊墜）、長方的（塔盾、鳶盾、法書、全罩盔、吊牌、符牌）、手形的（拳套三款、手套六款）
  const w1 = (kind, form) => ({ kind, form, zh: QW.KINDS[kind].forms[form], look: { kind, form, material: QW.KINDS[kind].def } }), a2 = (kind, form) => ALL.find((v) => v.kind === kind && v.form === form);
  const CROSS = [["圓的：第 1 批圓盾、法器珠 vs 戒指、臂環、項鍊墜", [w1("round_shield", "wood"), w1("round_shield", "banded"), w1("orb", "ball"), w1("orb", "floating"), a2("ring", "plain"), a2("ring", "gem"), a2("ring", "signet"), a2("bracers", "ring"), a2("pendant", "pendant")]],
    ["長方的：第 1 批塔盾、鳶盾、法書 vs 全罩盔、吊牌、符牌、皮臂甲", [w1("kite_shield", "tower"), w1("kite_shield", "kite"), w1("tome", "book"), w1("tome", "scroll"), a2("helmet", "greathelm"), a2("pendant", "tag"), a2("charm", "tablet"), a2("bracers", "leather")]],
    ["手形的：第 1 批拳套 vs 手套、護手", [w1("fist", "katar"), w1("fist", "knuckle"), w1("fist", "claw"), a2("cloth_gloves", "plain"), a2("cloth_gloves", "fingerless"), a2("leather_gloves", "short"), a2("leather_gloves", "long"), a2("gauntlets", "plate"), a2("gauntlets", "mail")]],

  let nv = 0, badv = 0; const low = { 材質: null, 染色: null, 元素: null }, excs = [];
  const tryOne = (type, label, look) => { const r = check(look), L = Number(r.text.split(" | ")[1]); nv++; if (!r.ok) { badv++; lines.push(`不過 ${label} | ${r.text} |${r.why}`); } if (r.exc) { excs.push([r.lum, `${label} | ${r.text} | ${r.ok ? "其餘各項過" : "不過" + r.why}`]); return; } if (!low[type] || L < low[type][0]) low[type] = [L, `${label} | ${r.text}`]; };
  for (const v of ALL) { for (const m of v.mats) if (m !== v.def) tryOne("材質", `${v.kind}/${v.form} 材質 ${QA.MAT_ZH[m]}`, lookOf(v.kind, v.form, { material: m }));
    for (const m of v.mats) if (m === "cloth" || m === "leather") for (const dy of Object.keys(QA.DYE)) tryOne("染色", `${v.kind}/${v.form} ${QA.MAT_ZH[m]}染${QA.DYE_ZH[dy]}`, lookOf(v.kind, v.form, { material: m, dye: dy }));
    for (const k of Object.keys(QA.KW)) tryOne("元素", `${v.kind}/${v.form} ${k}`, lookOf(v.kind, v.form, { keywords: [k] })); }
  for (const [t, l] of Object.entries(low)) if (l) lines.push(`${t}最暗：${l[1]}`);
  lines.push(`變體共 ${nv} 個（其中規則 6 例外 ${excs.length} 個），不過 ${badv} 個`, "", `規則 6 的例外（近黑的染色：保留深色，不套平均亮度 ≥100；佔框、亮面、貼格邊、壓框照常檢查）共 ${excs.length} 個，平均亮度 ${excs.length ? Math.min(...excs.map((e) => e[0])).toFixed(0) + "～" + Math.max(...excs.map((e) => e[0])).toFixed(0) : "—"}：`, ...excs.map((e) => "例外 " + e[1]));
  root.append(h("div.qi-audit", { id: "audit" }, lines.join(String.fromCharCode(10))));
}
// ---------------------------------------------------------------- 指紋（?part=hash）：每款裝備格 32／42／48／64 各算一個像素指紋
if (PART === "hash") {
  const fp = (cv) => { const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let a = 2166136261; for (let i = 0; i < d.length; i++) { a ^= d[i]; a = Math.imul(a, 16777619) >>> 0; } return a.toString(16).padStart(8, "0"); };
  const rows = []; /* &sub=var：全部材質、染色、元素變體各算 32／48 兩個指紋（改共用換色邏輯時，比對哪些變體真的變了） */
  if (OB.param("sub", "") === "var") for (const v of ALL) { for (const m of v.mats) { rows.push([`${v.kind}/${v.form} mat=${m}`, lookOf(v.kind, v.form, { material: m })]); if (m === "cloth" || m === "leather") for (const dy of Object.keys(QA.DYE)) rows.push([`${v.kind}/${v.form} mat=${m} dye=${dy}`, lookOf(v.kind, v.form, { material: m, dye: dy })]); }
    for (const k of Object.keys(QA.KW)) rows.push([`${v.kind}/${v.form} kw=${k}`, lookOf(v.kind, v.form, { keywords: [k] })]); }
  root.append(h("div.qi-audit", { id: "audit" }, rows.length ? rows.map(([t, l]) => `${t} | ${[32, 48].map((px) => fp(newGear(l)(px, 1))).join(" ")}`).join(String.fromCharCode(10)) : ALL.map((v) => `${v.kind}/${v.form} | ${[32, 42, 48, 64].map((px) => fp(newGear(v.look)(px, 1))).join(" ")}`).join(String.fromCharCode(10))));
}
// ---------------------------------------------------------------- 真 1 倍（?part=true1x&group=all｜dark&from=0&n=8）：全部 44 款的裝備格 32px；dark＝最暗的四種染色（黑、紅、藍、褐）各抽四款
if (PART === "true1x") {
  const g = OB.param("group", "all"), from = Number(OB.param("from", "0")), n = Number(OB.param("n", "999"));
  const DARK = [["robe", "long", "cloth"], ["hood", "cowl", "cloth"], ["cloth_gloves", "fingerless", "cloth"], ["boots", "tall", "leather"]];
  const list = g === "dark" ? ["black", "red", "blue", "brown"].flatMap((dye) => DARK.map(([kind, form, material]) => { const v = ALL.find((a) => a.kind === kind && a.form === form); return { ...v, zh: v.zh + "・" + QA.MAT_ZH[material] + "染" + QA.DYE_ZH[dye], look: { kind, form, material, dye } }; })) : ALL;
  t1Page("真 1 倍：裝備格 32px" + (g === "dark" ? "，最暗的染色（黑、紅、藍、褐）" : "") + "（最近鄰放大 6 倍）。", 2, list.slice(from, from + n).map((v) => t1Cell(v.kindZh + "・" + v.zh + " " + v.kind + "/" + v.form + " 裝備格32", 32, 6, oldGear(v.look)(32, 1, T1X), newGear(v.look)(32, 1, T1X), newGear(v.look)(32, 1))), list.length);
}
document.documentElement.dataset.ready = "1"; document.documentElement.dataset.h = String(Math.ceil(document.body.getBoundingClientRect().height));
</script>
