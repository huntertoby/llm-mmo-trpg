     左＝現行畫法（只讀）：tools/qHudLive.js——遊戲端 HudBarIcons.tsx、HudIcons.tsx、BattleToolIcons.tsx、SettingsHead.tsx、CreateIcons.tsx（RegionCrest）、
     render/skillIcon.ts 的 cardGlyphCanvas 原樣打包（vite lib 模式；React 元件用 renderToStaticMarkup 輸出 SVG，再畫進 canvas）。
     StatGlyph 的 4 個 SVG（STAT_PATHS 沒有匯出）、HoverFloat 的 PinIcon、float-card.css 的 .float-card.pinned::after、status-card.css 的 .stat-pip 照抄在下面並註明出處。
     右＝Q 版（qIconsHud.js）：框照現行（功能列淺色圓底、紋章六角金框），只換框裡的圖；同題材的直接呼叫前幾批。
     網址參數 ?part=
       a       總表 A（&group=bar｜gen｜tool｜res｜set｜pip｜crest，&from=&n= 分段）：每列 現行（實際大小放在現行的底上、×4 向量、2 倍內部解析度最近鄰放大）｜Q 版（同左）
       pin     圖釘兩種並排：A＝Q 版紅頭／灰鋼（第 4 批）、B＝Q 版金頭（照浮動卡的金色），三個用到的地方各一列
       moon    月亮與夜晚：時間欄＋天氣欄並排（白天、晴夜、雨夜），現行｜Q 版
       unused  通用小圖沒有地方用到的 7 個：現行｜同題材的 Q 版（不另畫，呼叫同一個畫法）
       b       總表 B：全部最小尺寸、剪影、現行排在一起；&group=near 和前幾批同結構的並排
       scene   情境圖：大世界 HUD（功能列、地名條、時間天氣、錢、任務追蹤）、戰鬥工具列、狀態卡資源列、設定面板、建角紋章；左現行、右 Q 版
       audit   自查表；review 最近鄰放大（上排 2 倍內部、下排真 1 倍；&only=id,…）；hash 指紋
       true1x  真 1 倍：每格 現行｜Q 真 1 倍｜Q 2 倍（&group=all｜pin，&from=&n= 分段）
       all     a＋pin＋moon＋scene（預設）
     重拍：uv run python docs/art/sample/tools/qicons_shots.py hud；--audit hud；--hash hud；true1x hud -->

/** client/src/ui/StatusCardParts.tsx 的 STAT_PATHS（沒有匯出，原樣照抄；viewBox 0 0 20 20、顯示 16px）。 */
const INK = "#1c1712";
const STAT_SVG = {
  move: `<path d="M6 2h5v9l6 2v4H6z" fill="#a07040" stroke="${INK}" stroke-width="1.5"/>`,
  shield: `<path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z" fill="#9ab8d8" stroke="${INK}" stroke-width="1.5"/>`,
  weapon: `<path d="M4 16L15 5" stroke="${INK}" stroke-width="4"/><path d="M4 16L15 5" stroke="#dfe4ea" stroke-width="2"/><path d="M3 11l6 6" stroke="#e8bb48" stroke-width="2.5"/>`,
  ammo: `<rect x="7" y="3" width="6" height="14" rx="3" fill="#e8bb48" stroke="${INK}" stroke-width="1.5"/>`,

/** client/src/ui/HoverFloat.tsx 的 PinIcon（原樣照抄；fill＝currentColor：未釘 .unit-float .tile-pin-icon 的 --muted #9a98a6 50%，已釘 #ffd04a）。 */
const PIN_SVG = (col) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="13" height="13"><path d="M10.5 1.5 14.5 5.5 12 6.5 9.5 9 9.8 12.2 8.6 13.4 6 10.8 2.5 14.3 1.7 13.5 5.2 10 2.6 7.4 3.8 6.2 7 6.5 9.5 4Z" fill="${col}"/></svg>`;
/** client/src/styles/float-card.css 的 .float-card.pinned::after（原樣照抄：18px 金圓底 --ui-gold-hi、深藍 1.5px 外圈、裡面 12px 的深色圖釘 SVG）。 */
const AFTER_PIN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12"><path d="M6 1.5h4l-.6 4.2 2.3 2.3H4.3l2.3-2.3z" fill="#1c1712"/><path d="M8 8v6.5" stroke="#1c1712" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const withXmlns = (s) => (s.includes("xmlns=") ? s : s.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"'));
/** 現行的 SVG 字串（spec → markup）。 */
function liveSvg(spec, px) {

  if (kind === "hud") return QL.hud(a, px);
  if (kind === "tool") return QL.tool(a, px);
  if (kind === "settings") return QL.settings(a);

  if (kind === "pinicon") return PIN_SVG(a === "on" ? "#ffd04a" : "#9a98a6");

const IMG = new Map();
const keyOf = (spec, px) => spec.join(":") + "@" + px;
function preload(spec, px) { const k = keyOf(spec, px); if (IMG.has(k)) return null; const s = liveSvg(spec, px); if (s === null) return null; const img = new Image(); IMG.set(k, img);

function liveCv(spec, px, zoom = 1, opt = {}) {
  const res = opt.res ?? (zoom === 1 ? 2 : zoom), [kind, a] = spec;
  if (kind === "card") { const src = QL.cardGlyphCanvas(a, px, res, opt.pinned === undefined ? {} : { pinned: opt.pinned }), c = blankCv(src.width); c.getContext("2d").drawImage(src, 0, 0); c.style.width = c.style.height = px * zoom + "px"; return c; }
  if (kind === "pip") { /* client/src/styles/status-card.css 的 .stat-pip（9px 圓、1px 框 #8a7a5a；源力亮 .stat-pip.source.on：底 #c8bcff、框 #8a7ad8），照抄 */
    const c = blankCv(Math.round(px * res)); c.style.width = c.style.height = px * zoom + "px"; const x = c.getContext("2d"); x.scale(res, res); x.beginPath(); x.arc(px / 2, px / 2, px / 2 - 0.5, 0, TAU); if (a === "on") { x.fillStyle = "#c8bcff"; x.fill(); } x.lineWidth = 1; x.strokeStyle = a === "on" ? "#8a7ad8" : "#8a7a5a"; x.stroke(); return c; }
  const img = IMG.get(keyOf(spec, px)), c = blankCv(Math.round(px * res)); c.style.width = c.style.height = px * zoom + "px";

/** 現行 .float-card.pinned::after（18px＋深藍外圈 1.5px）。 */
function liveAfterPin(zoom = 1, opt = {}) { const res = opt.res ?? (zoom === 1 ? 2 : zoom), px = 18, S = px + 3, c = blankCv(Math.round(S * res)); c.style.width = c.style.height = S * zoom + "px"; const x = c.getContext("2d"); x.scale(res, res);
  x.beginPath(); x.arc(S / 2, S / 2, px / 2 + 1.5, 0, TAU); x.fillStyle = "#1e2236"; x.fill(); x.beginPath(); x.arc(S / 2, S / 2, px / 2, 0, TAU); x.fillStyle = "#e8bb48"; x.fill(); const img = IMG.get(keyOf(["afterpin"], 12)); if (img) x.drawImage(img, (S - 12) / 2, (S - 12) / 2, 12, 12); return c; }

const L = QH.list(), BY = Object.fromEntries(L.map((e) => [e.id, e]));
const GROUPS = [["bar", "功能列 8（world/HudBarIcons.tsx；淺色圓底照現行）"], ["gen", "通用小圖：用到的 16 個（world/HudIcons.tsx；任務卷軸、留言和功能列同一份，在上面）"], ["tool", "戰鬥工具鈕 7（ui/BattleToolIcons.tsx，20px）"], ["res", "資源小圖 8（ui/StatusCardParts.tsx 的 StatGlyph，16px）"], ["set", "設定標題 3（ui/SettingsHead.tsx，16px）"], ["pip", "源力小晶石圓點（建議新增：狀態卡 .stat-pip.source，9px）"], ["crest", "區域紋章 6（ui/CreateIcons.tsx 的 RegionCrest，34／30px；六角金框照現行）"]];

/** 某個大小用的現行畫法與 Q 版的框：bare＝這個大小沒有淺色圓底（任務卷軸 20／14、留言 13 是通用小圖）。 */
const liveSpec = (e, px) => (e.bare?.includes(px) ? e.also : e.live);

const oldCv = (id, px, zoom = 1, opt = {}) => liveCv(liveSpec(BY[id], px), px, zoom, opt);

function onFrame(e, px, cv) {

const uniq = (a) => [...new Set(a)];

// ---------------------------------------------------------------- 總表 A
function rowA(e) {

    h("div.qh-side.old", {}, h("span.qh-tag", {}, "現行"), side((px, z, o) => oldCv(e.id, px, z, o))), h("div.qh-side.new", {}, h("span.qh-tag", {}, "Q版"), side((px, z, o) => qCv(e.id, px, z, o))));
}

function main() {
  const counts = { new: L.filter((e) => !e.src).length, reuse: L.filter((e) => e.src).length };
  if (PART === "all") root.append(h("h1", {}, "小圖示改 Q 版：第 7 批 HUD（現行在左、Q 版在右）"),
    h("p.note", {}, `畫圖 agent，2026-11-12。遊戲端 HUD 的圖示照實盤點（紀錄第 1 節）：這頁 ${L.length} 個圖示（新畫 ${counts.new}、沿用或同一份 ${counts.reuse}），另有圖釘兩種並排、通用小圖沒用到的 7 個（?part=unused）。` +
      "框照現行（功能列淺色圓底、紋章六角金框、浮動卡金色圓底），只換裡面的圖。"));

  if (show("a")) {
    const only = OB.param("group", "");
    root.append(h("h2", {}, "總表 A：每個圖示", h("small", {}, "　左現行（遊戲端原始程式）、右 Q 版；第一格是遊戲裡實際的每個大小（放在現行的鈕、膠囊、面板上；功能列 24 是說明卡標題）、×4 向量、最小尺寸的 2 倍內部解析度與真 1 倍最近鄰放大")));
    const from = Number(OB.param("from", "0")), n = Number(OB.param("n", "99"));
    for (const [g, title] of GROUPS) { if (only && only !== g) continue; root.append(h("h3", {}, title + (only && (from > 0 || n < 99) ? "（第 " + (from + 1) + " 列起）" : "")), ...L.filter((e) => e.grp === g).slice(only ? from : 0, only ? from + n : 99).map(rowA)); }
