<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>C 手繪墨線繪本：擴畫參考</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #1b1e24; color: #e8e8ea; font-family: "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 18px 0 6px; }
  .sub { color: #a0a4ad; font-size: 13px; margin-bottom: 8px; line-height: 1.55; }
  table { border-collapse: separate; border-spacing: 5px; }
  th { font-size: 13px; color: #e8e8ea; font-weight: 400; padding: 2px 4px; }
  td { background: #2d323c; border-radius: 6px; padding: 2px; }
  td.lab { background: none; text-align: right; font-size: 13px; white-space: nowrap; padding-right: 4px; }
  td.lab small { display: block; color: #8a909a; font-size: 11px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: #2d323c; border-radius: 6px; padding: 4px 4px 6px; text-align: center; font-size: 12px; color: #c8ccd4; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>C 手繪墨線繪本：擴畫參考</h1>
<div class="sub">使用者選 C（「C畫風擴畫參考」）。外觀仍由資料欄位決定：種族用 <code>look</code>（方案乙 10 族，龍裔甲乙丙戊），裝備用 kind／color。每格兩個：正面／真側面（朝東）；背面另列一表。</div>

<h2>① 放大看細節</h2>
<div class="row" id="big"></div>

<h2>② 10 族 × 5 套裝備</h2>
<table id="grid"></table>

<h2>②b 背面（朝北）：主手在畫面右；披風、尾巴蓋在身上，看不到臉</h2>
<table id="back"></table>

<h2>③ 形態 10 種（帶主角主色＋腳下手繪光環；左邊是變身前，同比例）</h2>
<div class="row" id="forms"></div>

<h2>④ 戰場實際大小（每格 52px）</h2>
<div id="field"></div>
<div class="sub" style="margin-top:4px">上兩排朝東、下兩排朝西；最右一欄是形態。</div>

<script src="storyDoll.js"></script>
<script>
const SD = StoryDoll, DPR = 2;
const I = (slot, kind, extra = {}) => ({ slot, kind, ...extra });
const SETS = [
  ["輕裝＋弓＋披風", { body: I("body", "leather", { color: "#4f7a3a" }), feet: I("feet", "boots"), main_hand: I("main_hand", "bow"), cloak: I("cloak", "cape", { color: "#a83030" }) }],
  ["重甲＋頭盔＋戰斧", { body: I("body", "plate"), feet: I("feet", "greaves"), head: I("head", "helmet"), main_hand: I("main_hand", "axe") }],
  ["法袍＋尖帽＋法杖", { body: I("body", "robe", { color: "#5a3a8a" }), head: I("head", "wizard_hat", { color: "#4a2e74" }), main_hand: I("main_hand", "staff") }],
  ["成對匕首", { body: I("body", "leather", { color: "#3a4a5a" }), feet: I("feet", "boots"), main_hand: I("main_hand", "dagger"), off_hand: I("off_hand", "dagger") }],
  ["劍＋圓盾＋披風", { body: I("body", "shirt", { color: "#4f7fbf" }), feet: I("feet", "boots"), main_hand: I("main_hand", "sword"), off_hand: I("off_hand", "shield_round", { color: "#2f5fae" }), cloak: I("cloak", "cape", { color: "#2a4a8a" }) }],
];
const RACES = [
  ["人類", "晶冠", { skin: "#f1c9a5", hair: "short", hairColor: "#6a3d1e" }],
  ["精靈", "晶冠", { skin: "#f6e0cc", hair: "long", hairColor: "#e8e0c8", ears: "pointed", build: "tall" }],
  ["狐族", "雲嶺", { skin: "#f1d0b0", hair: "short", hairColor: "#d8762a", ears: "beast", tail: "fox" }],
  ["龍裔", "雲嶺", { skin: "#d8a878", hair: "short", hairColor: "#3a2418", horns: "dragon", hornColor: "#5a1a14", pattern: "dragonscale", slitEyes: true, scaleColor: "#c8402a", tail: "dragon", tailColor: "#c8402a", spines: true }],
  ["矮人", "樞市", { skin: "#e8b890", hair: "short", hairColor: "#a8481e", beard: true, build: "stout" }],
  ["晶能義體人", "樞市", { skin: "#e6c4a4", hair: "short", hairColor: "#2a2a34", pattern: "circuit" }],
  ["獸人", "灰燼", { skin: "#86a060", hair: "short", hairColor: "#1e1a14", tusks: true, build: "tall" }],
  ["角魔", "灰燼", { skin: "#b07a7a", hair: "long", hairColor: "#1e1418", horns: "curved", hornColor: "#bfb0a4", tail: "demon" }],
  ["鱗族", "霜潮", { skin: "#78b4aa", hair: "none", ears: "fin", pattern: "scales", eyes: "#103030" }],
  ["海民", "霜潮", { skin: "#b07a52", hair: "long", hairColor: "#2a8a9a", pattern: "marks", markColor: "#3aa8e0" }],
];
function cv(w, h, bg = "#2d323c") {
  const c = document.createElement("canvas");
  c.width = w * DPR; c.height = h * DPR; c.style.width = `${w}px`; c.style.height = `${h}px`;
  const ctx = c.getContext("2d"); ctx.scale(DPR, DPR); if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  return [c, ctx];
}
const look = (i) => RACES[i][2], gear = (i) => SETS[i][1];
// ① 放大
const big = document.getElementById("big");
for (const [ri, si, cap] of [[0, 4, "人類・劍盾"], [3, 1, "龍裔・重甲"], [1, 2, "精靈・法袍"], [2, 3, "狐族・成對匕首"]]) {
  const d = document.createElement("div"); d.className = "card";
  const [c, ctx] = cv(250, 230);
  SD.stamp(ctx, { look: look(ri), gear: gear(si) }, "front", 70, 214, 2.6);
  SD.stamp(ctx, { look: look(ri), gear: gear(si) }, "side", 182, 214, 2.6);
  d.append(c); d.insertAdjacentHTML("beforeend", cap); big.append(d);
}
// ② 種族 × 裝備
const grid = document.getElementById("grid");
grid.insertAdjacentHTML("beforeend", `<tr><th></th>${SETS.map(([t]) => `<th>${t}</th>`).join("")}</tr>`);
RACES.forEach(([zh, realm, lk]) => {
  const tr = document.createElement("tr");
  tr.insertAdjacentHTML("beforeend", `<td class="lab">${zh}<small>${realm}</small></td>`);
  for (const [, g] of SETS) {
    const td = document.createElement("td"); const [c, ctx] = cv(128, 108);
    SD.stamp(ctx, { look: lk, gear: g }, "front", 36, 101, 1.32);
    SD.stamp(ctx, { look: lk, gear: g }, "side", 94, 101, 1.32);
    td.append(c); tr.append(td);
  }
  grid.append(tr);
});
// ②b 背面
const back = document.getElementById("back"), BACK_RACES = [0, 1, 2, 3, 4, 7, 8];
back.insertAdjacentHTML("beforeend", `<tr><th></th>${BACK_RACES.map((i) => `<th>${RACES[i][0]}</th>`).join("")}</tr>`);
SETS.forEach(([t, g]) => {
  const tr = document.createElement("tr");
  tr.insertAdjacentHTML("beforeend", `<td class="lab">${t}</td>`);
  for (const ri of BACK_RACES) { const td = document.createElement("td"); const [c, ctx] = cv(80, 100); SD.stamp(ctx, { look: look(ri), gear: g }, "back", 40, 93, 1.3); td.append(c); tr.append(td); }
  back.append(tr);
});
// ③ 形態（10 種；左邊是變身前的角色，同比例；形態依 formArt.js 的大小倍率放大）
const forms = document.getElementById("forms");
const FORM_SHOW = [
  ["bear", { hero: "#4f7a3a" }, 0, 0], ["cat", { hero: "#a83030" }, 2, 3], ["roc", { hero: "#2a4a8a" }, 1, 0],
  ["demon", { hero: "#a83030" }, 7, 3], ["giant", { hero: "#4f7fbf" }, 4, 1], ["avatar", { hero: "#4f7fbf", element: "fire", auraColor: "#ff7a1a" }, 1, 2],
  ["shadow", { hero: "#9a6ad8" }, 7, 3], ["treant", { hero: "#5a3a8a" }, 8, 2], ["werewolf", { hero: "#a83030" }, 6, 0],
  ["dragon", { hero: "#c8402a", element: "fire", auraColor: "#ff7a1a" }, 3, 1],
];
for (const [id, spec, ri, si] of FORM_SHOW) {
  const d = document.createElement("div"); d.className = "card";
  const big = id === "dragon" || id === "giant";
  const [c, ctx] = cv(big ? 300 : 200, 170);
  const f = SD.FORMS[id];
  SD.stamp(ctx, { look: look(ri), gear: gear(si) }, "side", 26, 158, 1.4);
  SD.stampForm(ctx, id, { auraR: 16 * f.size, ...spec }, big ? 170 : 120, 158, 1.4 * f.size);
  d.append(c); d.insertAdjacentHTML("beforeend", `${f.zh}（×${f.size}）`); forms.append(d);
}
// ④ 戰場
const T = 52, COLS = 9, ROWS = 4;
const [fc, fctx] = cv(T * COLS, T * ROWS, null);
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { fctx.fillStyle = (x + y) % 2 ? "#8a8a84" : "#7d8a7a"; fctx.fillRect(x * T, y * T, T, T); }
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS - 1; x++) {
  const ri = (x + y * 3) % RACES.length, si = (x + y) % SETS.length, west = y >= 2;
  const view = x === 0 ? (y % 2 ? "back" : "front") : "side";
  SD.stamp(fctx, { look: look(ri), gear: gear(si) }, view, x * T + T / 2, y * T + T * 0.86, 0.74, view === "side" && west);
}
["bear", "werewolf", "treant", "dragon"].forEach((id, i) => { const [, spec] = FORM_SHOW.find((r) => r[0] === id); SD.stampForm(fctx, id, { auraR: 16 * SD.FORMS[id].size, ...spec }, (COLS - 1) * T + T / 2, i * T + T * 0.88, 0.6 * Math.min(SD.FORMS[id].size, 1.3), i >= 2); });
document.getElementById("field").append(fc);
</script>
</body>
</html>
