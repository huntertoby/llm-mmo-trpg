<!-- 樣張，不接進遊戲（畫圖 agent，2026-11-12）。紀錄：docs/art/Q版小圖示-第5批狀態.md；規則：docs/art/Q版小圖示樣張.md 第 2 節。
     左＝現行畫法（只讀）：tools/qStatusLive.js——遊戲端 client/src/render/statusIcon.ts（paintStatusIcon、statusIconCanvas）與 skillIcon.ts（statusIconTile、tileCanvas）原樣打包（vite lib 模式，和實機同一份程式）。
     右＝Q 版（qIconsStatus.js）：框的形狀、框色、大小照現行，只換框裡的圖；控制類別色改畫在框的底色。第 4 批已畫的 32 個直接呼叫 qIconsParts.js。
     資料：qPartsData.js（後端的名詞表，含每個狀態的 status_look）。
     尺寸照遊戲端：狀態卡 20px（tileCanvas：100 單位的方塊裁成圓，框在 50,50、邊長 84 → 框約 16.8px）；戰場頭頂 11px（statusIconCanvas：框邊長 px−2＝9px）。
     網址參數 ?part=
       a      總表 A（&group=ctrl｜debuff｜buff｜shield｜neutral｜stance｜element｜boss）：每列 現行（20、11 實際、20 ×4、2 倍內部解析度最近鄰放大）｜Q 版（同左）
       b      總表 B：全部 118 個的最小尺寸排在一起（實際、2 倍放大、剪影、現行），最下面和第 3 批記號、第 4 批圓片並排（&group=all｜near；near 可加 &nfrom=&nn= 分段）
       cls    類別色：控制類 7 個 × 現行｜Q 不染底｜第 1 版對照 (b) 的深琥珀｜Q 版定案底色，20 與 11 的實際、2 倍、真 1 倍
       scene  情境圖：Q 版人物頭頂兩個圖示＋「+N」、主角狀態卡一列；左現行、右 Q 版
       audit  自查表；review  每個狀態的最近鄰放大（上排 2 倍內部、下排真 1 倍；&from=&n=、&only=id,…）；hash  指紋
       true1x 真 1 倍：每格 現行｜Q 真 1 倍｜Q 2 倍（&group=card（狀態卡 20）｜head（頭頂 11），&from=&n= 分段）
       all    a＋cls＋scene（預設）
     重拍：uv run python docs/art/sample/tools/qicons_shots.py status；--audit status；--hash status；true1x status -->

<script>
const { h } = OB, Q = QIcons, QS = QIconsSkills, QP = QIconsParts, QT = QIconsStatus, QL = window.QStatusLive, NL = String.fromCharCode(10), TAU = Math.PI * 2;
OB.applyTheme("capital"); QL.setGlossary(window.QPARTS_GLOSSARY);
const PART = OB.param("part", "all"), root = document.getElementById("root"), show = (p) => PART === "all" ? ["a", "cls", "scene"].includes(p) : PART === p;
const nn = (c, px, k) => { c.style.width = c.style.height = px * k + "px"; c.style.imageRendering = "pixelated"; return c; };
const one = (label, els) => h("div.qs-one", {}, h("span", {}, els), h("i", {}, label));
const T1X = { res: 1 };

// ---------------------------------------------------------------- 現行（遊戲端原始程式）
/** 狀態卡：statusIconTile＋tileCanvas（tileCanvas 內部固定 ×2；res＝1 時給 px/2，canvas 就是 px 邊長＝真 1 倍；zoom＞1 時直接畫到 px×zoom）。 */
const liveCard = (id, px = 20, zoom = 1, opt = {}) => { const tile = QL.statusIconTile(id), res = opt.res ?? 2, src = QL.tileCanvas(tile, (px * (zoom > 1 ? zoom * 2 : res)) / 2), c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.style.width = c.style.height = px * zoom + "px"; c.getContext("2d").drawImage(src, 0, 0); return c; };
/** 戰場頭頂：statusIconCanvas（內部 ×2）；真 1 倍與放大是同一個 paintStatusIcon 直接畫到 px×res 的 canvas（框邊長 px−2）。 */
const liveHead = (id, px = 11, zoom = 1, opt = {}) => { const res = opt.res ?? (zoom === 1 ? 2 : zoom); if (res === 2 && zoom === 1) { const src = QL.statusIconCanvas(id, px), c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.style.width = c.style.height = px + "px"; c.getContext("2d").drawImage(src, 0, 0); return c; }
  const c = document.createElement("canvas"); c.width = c.height = Math.round(px * res); c.style.width = c.style.height = px * zoom + "px"; const x = c.getContext("2d"); x.scale(res, res); QL.paintStatusIcon(x, id, px / 2, px / 2, px - 2); return c; };
const qCard = (id, px = 20, zoom = 1, opt = {}) => QT.cardCanvas(id, px, zoom, opt);
const qHead = (id, px = 11, zoom = 1, opt = {}) => QT.headCanvas(id, px, zoom, opt);
/** 狀態卡的格子（現行 .stat-badge：24px、深褐底、20px 圖示＋右下角數字）。 */
const badge = (cv, corner) => h("span.stat-badge.status-badge", {}, cv, corner ? h("b.stat-corner", {}, corner) : null);

// ---------------------------------------------------------------- 清單與分組（遊戲端顯示的清單＝名詞表的 118 個）
const L = QT.list(), BY = Object.fromEntries(L.map((e) => [e.id, e]));
const ORDER = {
  ctrl: ["控制類 7 個（框的底色染類別色）", ["stun", "frozen", "slow", "root", "taunted", "feared", "silenced"]],
  debuff: ["持續傷害與其他減益 14 個", ["burning", "poison", "bleed", "prone", "weaken", "vulnerable", "blinded", "marked", "armor_broken", "entangled", "overdrawn", "revealed", "time_bomb", "oath_broken"]],
  buff: ["增益 11 個", ["hasted", "empowered", "regenerating", "guarded", "defending", "stoneskin", "overwatch", "infused_fire", "infused_holy", "rallied", "commanding"]],
  shield: ["護盾家族 6 個（同一面盾、換盾面記號）", ["shielded", "shielded_thorns", "shielded_mending", "shielded_wet", "shielded_charged", "shielded_marking"]],
  neutral: ["中性：隱蔽、免死、連結、種族技、蓄力、休戰、誓約 11 個", ["concealed", "undying", "soul_link", "heart_link", "race_adapt", "race_stonewall", "charging", "league_truce", "oath_bonus_easy", "oath_bonus_medium", "oath_bonus_hard"]],
  stance: ["姿態 9 個（同一個六角臂章、換底色與紋章）", ["stance_guard", "stance_bulwark", "stance_ironwall", "stance_bastion", "stance_fury", "stance_flame", "stance_blaze", "stance_frost", "stance_glacier"]],
  element: ["元素架勢 9 種 × 5 級（各級同一個圖；一列一種，壹～伍級的 id 寫在左邊）", QT.ELEMENTS.map((e) => "stance_" + e + "_1")],
  boss: ["首領戰與詞綴的狀態 15 個", ["sword_formation", "array_ward", "summit_array_ward", "shard_burst", "rift_resonance", "rift_channel", "crystal_surge", "crystal_surge_2", "rift_collapse", "mist_return", "molten_burst", "heart_ember_burst", "frost_ember_burst", "molten_shell", "hard_shell"]],
};
const ELV = (id) => /^stance_(\w+)_1$/.exec(id)?.[1];
const IN_ORDER = new Set(Object.values(ORDER).flatMap(([, ids]) => ids.flatMap((id) => (ELV(id) && QT.ELEMENTS.includes(ELV(id)) ? [1, 2, 3, 4, 5].map((n) => "stance_" + ELV(id) + "_" + n) : [id]))));
const MISSING = L.filter((e) => !IN_ORDER.has(e.id) || e.kind === "missing").map((e) => e.id);
if (MISSING.length) console.error("status: not covered " + MISSING.join(","));
const KIND_ZH = { b4: "沿用第 4 批", borrow: "借用同題材", new: "新畫" };
const SRC_ZH = (e) => (e.kind === "b4" ? "沿用第 4 批：" + e.src.slice(3) : e.kind === "borrow" ? "借用 " + e.src : e.family === "element_stance" ? "新畫（元素架勢紋章）" : "新畫");
const CLS_ZH = { hard: "硬控", movement: "移動控制", mental: "心智控制" }, POL_ZH = { buff: "增益（圓框）", debuff: "減益（圓角方框）", neutral: "中性（六角框）" };
const counts = { b4: L.filter((e) => e.kind === "b4").length, borrow: L.filter((e) => e.kind === "borrow").length, new: L.filter((e) => e.kind === "new").length };

if (PART === "all") root.append(h("h1", {}, "小圖示改 Q 版：第 5 批 狀態圖示（現行在左、Q 版在右）"),
  h("p.note", {}, `畫圖 agent，2026-11-12。遊戲端顯示的狀態 ${L.length} 個（名詞表）：沿用第 4 批 ${counts.b4}（含聖輝、暗影架勢貳～伍級 8 個用壹級的圖）、借用第 3、4 批同題材 ${counts.borrow}、新畫 ${counts.new}（其中元素架勢 7 種 × 5 級 35 個是 7 個新紋章）。` +
    "框的形狀、框色、大小照現行，只換框裡的圖；控制類別色從「圖樣顏色」改成「框的底色」。" + (MISSING.length ? "　缺：" + MISSING.join("、") : "")));

// ---------------------------------------------------------------- 總表 A
function rowA(id) {
  const e = BY[id], lv = ELV(id) && QT.ELEMENTS.includes(ELV(id)), ids = lv ? [1, 2, 3, 4, 5].map((n) => "stance_" + ELV(id) + "_" + n) : [id];
  const zh = lv ? e.zh.replace(/·壹$/, "") + "（壹～伍）" : e.zh;
  const old = [one("20・11", [badge(liveCard(id)), liveHead(id)]), one("20 ×4", [liveCard(id, 20, 4)]), one("20：2 倍內部 ×3", [nn(liveCard(id), 20, 3)]), one("11：2 倍 ×4", [nn(liveHead(id), 11, 4)])];
  const neu = [one("20・11", [badge(qCard(id)), qHead(id)]), one("20 ×4（向量）", [qCard(id, 20, 4)]), one("20：2 倍內部 ×3", [nn(qCard(id), 20, 3)]), one("11：2 倍 ×4", [nn(qHead(id), 11, 4)])];
  return h("div.qs-row", {}, h("div.qs-lab", {}, zh, h("code", {}, ids.join(" ")), h("small", {}, POL_ZH[e.pol] + (e.cls ? "・" + CLS_ZH[e.cls] : "") + (e.dot ? "・持續傷害 " + e.dot : "")), h("small", {}, e.topic), h("small", {}, SRC_ZH(e))),
    h("div.qs-side.old", {}, h("span.qs-tag", {}, "現行"), old), h("div.qs-side.new", {}, h("span.qs-tag", {}, "Q版"), neu));
}
if (show("a")) {
  const only = OB.param("group", "");
  root.append(h("h2", {}, "總表 A：每個狀態", h("small", {}, "　左現行（遊戲端原始程式）、右 Q 版；20＝主角狀態卡（放在現行的 .stat-badge 格子裡）、11＝戰場頭頂。放大的是 2 倍內部解析度的圖用最近鄰放大（真 1 倍看 ?part=true1x）")));
  for (const [g, [title, ids]] of Object.entries(ORDER)) { if (only && only !== g) continue; root.append(h("h3", {}, title), ...ids.map(rowA)); }
}

// ---------------------------------------------------------------- 總表 B：撞圖
/** 剪影（米白、深底）：圖樣本身 cpx。 */
function silhouette(id, cpx, k) { const g = QT.glyph(id, cpx, 2, { ow: 0 }), c = document.createElement("canvas"); c.width = c.height = g.width; const x = c.getContext("2d"); x.drawImage(g, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = "#f2e6c8"; x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = "destination-over"; x.fillStyle = "#23262d"; x.fillRect(0, 0, c.width, c.height); return nn(c, g.width / 2, k); }
/** 第 4 批圓片（18px）與第 3 批記號（技能圖示右上，用第 4 批的圓片畫法看同一個記號）放進同一排比。 */
const chip18 = (cat, id) => nn(QP.chipCanvas(cat, id, 18), 18, 2.6);
if (show("b")) {
  const g = OB.param("group", "all");
  const cell = (id) => ({ act: badge(qCard(id)), head: nn(qHead(id), 11, 4), big: nn(qCard(id), 20, 2.4), sil: silhouette(id, 20 * 0.84 * QT.GLYPH_K, 2.4), old: nn(liveCard(id), 20, 2.4) });
  const sheet = (ids, title, extra = []) => { const cs = ids.map(cell); return h("div.qs-grp", {}, h("b", {}, title),
    h("div.r", {}, h("em", {}, "狀態卡 20"), cs.map((c) => h("span", {}, c.act)), extra.map(() => h("span", {}, ""))), h("div.r", {}, h("em", {}, "頭頂 11 ×4"), cs.map((c) => h("span", {}, c.head)), extra.map(() => h("span", {}, ""))), h("div.r", {}, h("em", {}, "20 ×2.4"), cs.map((c) => h("span", {}, c.big)), extra.map(([cat, id]) => h("span", {}, chip18(cat, id)))),
    h("div.r", {}, h("em", {}, "剪影"), cs.map((c) => h("span", {}, c.sil)), extra.map(() => h("span", {}, ""))), h("div.r", {}, h("em", {}, "現行 20"), cs.map((c) => h("span", {}, c.old)), extra.map(() => h("span", {}, ""))), h("div.r.lab", {}, h("em", {}, ""), ids.map((id) => h("span", {}, (BY[id]?.zh ?? id).slice(0, 7))), extra.map(([cat, id, lab]) => h("span", {}, lab)))); };
  const cut = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  if (g === "all") { root.append(h("h2", {}, "總表 B：全部狀態的最小尺寸排在一起", h("small", {}, "　每組：狀態卡 20 實際（.stat-badge 格子）、頭頂 11（2 倍內部 ×4）、狀態卡 20（2 倍內部 ×2.4）、剪影、現行 20")));
    const all = Object.values(ORDER).flatMap(([, ids]) => ids.flatMap((id) => (ELV(id) && QT.ELEMENTS.includes(ELV(id)) && !["holy", "shadow"].includes(ELV(id)) ? [id] : ELV(id) ? [id] : [id])));
    root.append(h("div.qs-sheet", {}, cut(all, 20).map((ids, i, a) => sheet(ids, `第 ${i + 1}／${a.length} 組`)))); }
  if (g === "near") {
    const N = [
      ["盾：狀態與圓片（第 4 批）", ["shielded", "shielded_thorns", "shielded_mending", "shielded_wet", "shielded_charged", "shielded_marking", "defending", "guarded", "vulnerable", "undying"], [["effect", "shield", "圓片 護盾"], ["effect", "intercept", "圓片 擋攻擊"], ["trigger", "hit_by_spell", "圓片 被法術"]]],
      ["六角臂章：姿態與架勢", ["stance_guard", "stance_bulwark", "stance_ironwall", "stance_bastion", "stance_fury", "stance_flame", "stance_blaze", "stance_frost", "stance_glacier"], [["skeleton", "stance", "徽章 姿態"]]],
      ["六角臂章：元素架勢", QT.ELEMENTS.map((e) => "stance_" + e + "_1").concat(["stance_fury", "stance_frost"]), [["element", "fire", "元素片 火"], ["element", "ice", "元素片 冰"]]],
      ["火與熱", ["burning", "stance_fury", "stance_blaze", "stance_fire_1", "molten_burst", "heart_ember_burst", "molten_shell", "infused_fire", "charging"], [["surface", "fire", "表面 火"], ["element", "fire", "元素片 火"], ["effect", "consume_status", "消耗狀態"]]],
      ["冰", ["frozen", "stance_frost", "stance_glacier", "stance_ice_1", "frost_ember_burst"], [["surface", "ice", "表面 冰"], ["element", "ice", "元素片 冰"]]],
      ["晶石與陣", ["shard_burst", "rift_resonance", "rift_channel", "crystal_surge", "crystal_surge_2", "rift_collapse", "array_ward", "summit_array_ward", "mist_return"], [["cost", "source", "代價 源力"], ["effect", "teleport", "效果 傳送"], ["card", "source", "卡片 源力"]]],
      ["旗、章、殼", ["rallied", "league_truce", "oath_bonus_easy", "oath_bonus_medium", "oath_bonus_hard", "oath_broken", "hard_shell", "molten_shell", "race_stonewall"], [["effect", "apply_status", "效果 施加狀態"], ["skeleton", "aura", "徽章 增益"]]],
      ["人形、箭頭、閃電、心", ["race_adapt", "commanding", "entangled", "overdrawn", "heart_link", "soul_link", "hasted", "armor_broken", "sword_formation"], [["effect", "grant_ap", "效果 給 AP"], ["condition", "moved_this_turn", "條件 移動過"], ["effect", "leap", "效果 跳躍"], ["effect", "redirect_damage", "效果 分擔"]]],
    ];
    const from = Number(OB.param("nfrom", "0")), n = Number(OB.param("nn", "99"));
    root.append(h("h2", {}, "撞圖：和第 3、4 批相近的並排", h("small", {}, "　右邊幾格是第 4 批的 18px 圓片（2 倍內部 ×2.6），放在「20 ×2.4」那一列")), h("div.qs-sheet", {}, N.slice(from, from + n).map(([t, ids, ex]) => sheet(ids, t, ex))));
  }
}
