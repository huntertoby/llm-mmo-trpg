<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>灰燼之心 3×3（GB A1＋A2）</title>
<style>
  body{margin:0;padding:12px 16px;background:#14161f;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}

<body>
<h1>灰燼之心 3×3：立繪（A1）＋部位格標示（A2）樣張</h1>
<p class="note">畫圖 agent，2026-11-14（PhaseGB 計畫 D14～D18、D23、T20；第 9 節 A1、A2）。分段：
<a href="?part=sprites&w=1600&mute=1">1a 立繪 1600 真 1 倍</a><a href="?part=sprites&w=800&mute=1">1b 立繪 800 真 1 倍</a><a href="?part=big&mute=1">1c 立繪放大＋佔格</a><a href="?part=anchor&mute=1">1d 錨點與外接框</a>
<a href="?part=field&w=1600&mute=1">2a 比例 1600</a><a href="?part=field&w=800&mute=1">2b 比例 800</a>
<a href="?part=marks&w=1600&mute=1">3a 部位格 1600</a><a href="?part=marks&w=800&mute=1">3b 部位格 800</a><a href="?part=marks-nn&mute=1">3c 部位格特寫</a><a href="?part=probe&mute=1">自查</a></p>

<textarea id="out"></textarea>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="realms.js"></script><script src="enemyArt.js"></script>
<script src="explore.js"></script><script src="regions4.js"></script>
<script src="qCreature.js"></script><script src="qCreatureAnim.js"></script><script src="qBoss.js"></script>
<script src="tools/qStatusLive.js"></script><script src="qPartsData.js"></script>
<script src="occludeOutline.js"></script>
<script src="qIcons.js"></script><script src="qIconsWeapons.js"></script><script src="qIconsSkills.js"></script><script src="qIconsParts.js"></script>
<script src="qBossGiant.js"></script><script src="qBossGiantIcons.js"></script>
<script>
const GB = QBossGiant, OO = OccludeOutline, T = GB.T, P = new URLSearchParams(location.search), PART = P.get("part") || "sprites";
try { QStatusLive.setGlossary(window.QPARTS_GLOSSARY); } catch (e) { console.log("status glossary: " + e); }
const TP = PaperDoll.TEMPLATES, R4 = Regions4, ASH = R4.REGIONS.find((r) => r.id === "ashen_waste");
const FONT = "'Noto Sans TC','Microsoft JhengHei',sans-serif";
/** 遊戲的地圖縮放（同 occlude-outline.html：stageLayout.ts fitScale＋hudSideInsets；熔心坑 12×12）：1600×900 → 1.31、800×600 → 0.53。 */
const S1600 = Math.min((1600 - 268 - 240 - 16) / 588, (900 - 60 - 16) / 630), S800 = Math.min((800 - 246 - 226 - 16) / 588, (600 - 60 - 16) / 630);
const W_ = P.get("w") === "800" ? 800 : 1600, SW = W_ === 800 ? S800 : S1600;
// 地面：灰燼荒原（Regions4 ashen_waste 的 stone／lava／wall，52 單位畫到 48 格；同 occlude-outline.html）
const tile = (id) => (ctx, x, y, gx, gy) => { ctx.save(); ctx.translate(x, y); ctx.scale(T / 52, T / 52); R4.tile(ctx, ASH, id, 0, 0, gx, gy); ctx.restore(); };
const STONE = tile("stone"), LAVA = tile("lava"), WALL = tile("wall");
/** 熔心坑改圖後的地面（GB-2 6.2 的方向：外圈牆、y 1 與兩側是岩漿、坑底石地；座標未定，只取灰燼之心周圍）。 */
const pitGround = (gx, gy) => (gx === 0 || gy === 0 || gx === 11 || gy === 11 ? WALL : gx === 1 || gy === 1 || gx === 10 ? LAVA : STONE);

// ---- 六種外觀（三階段 × 熔殼在／不在） ----
const VARS = [
  { k: "p1s", zh: "第 1 階段・殼｜熔殼在（開場）", st: { phase: 1, shell: 1, t: 300 } },
  { k: "p1n", zh: "第 1 階段・殼｜熔殼不在（被冰打碎、或殼縫先破）", st: { phase: 1, shell: 0, t: 300 } },
  { k: "p2n", zh: "第 2 階段・呼吸｜熔殼不在（一般：換階段時移除）", st: { phase: 2, shell: 0, t: 300 } },
  { k: "p2s", zh: "第 2 階段・呼吸｜熔殼在（現行內容不會出現）", st: { phase: 2, shell: 1, t: 300 } },
  { k: "p3n", zh: "第 3 階段・熔毀｜熔殼不在（一般）", st: { phase: 3, shell: 0, t: 300 } },
  { k: "p3s", zh: "第 3 階段・熔毀｜熔殼在（現行內容不會出現）", st: { phase: 3, shell: 1, t: 300 } },
];

// ================= 場景：地面＋單位（一排一排）＋巨型頭目＋部位格標示 =================
// scene：{ cols, rows, ground(gx,gy), giant: { x, y（中心格）, st, opt, hover, parts, melee, marks }, units: [OO 單位] }；view：{ S, res, x0, y0, w, h }（模型像素）
function render(scene, view) {
  const sc = view.S * (view.res ?? 1), W = Math.round(view.w * sc), H = Math.round(view.h * sc);
  const cv = GB.mk(W, H), g = cv.getContext("2d"), xf = (c) => c.setTransform(sc, 0, 0, sc, -view.x0 * sc, -view.y0 * sc);
  g.fillStyle = "#14161f"; g.fillRect(0, 0, W, H); xf(g);
  for (let y = 0; y < scene.rows; y++) for (let x = 0; x < scene.cols; x++) { g.save(); g.beginPath(); g.rect(x * T, y * T, T, T); g.clip(); (scene.ground ?? pitGround)(x, y)(g, x * T, y * T, x, y); g.restore(); }
  g.save(); g.strokeStyle = "rgba(0,0,0,0.22)"; g.lineWidth = 1 / sc; for (let y = 0; y <= scene.rows; y++) { g.beginPath(); g.moveTo(0, y * T); g.lineTo(scene.cols * T, y * T); g.stroke(); } for (let x = 0; x <= scene.cols; x++) { g.beginPath(); g.moveTo(x * T, 0); g.lineTo(x * T, scene.rows * T); g.stroke(); } g.restore();
  const Gi = scene.giant, ax = Gi ? (Gi.x + 0.5) * T : 0, ay = Gi ? (Gi.y + 2) * T : 0; // 錨點＝南排南緣中點
  const m = new DOMMatrix([sc, 0, 0, sc, (ax - view.x0) * sc, (ay - view.y0) * sc]);
  if (Gi && (Gi.opt ?? {}).pitGlow !== false) { g.setTransform(m); GB.groundGlow(g, Gi.st); } // 第 2 版：第 3 階段坑底紅光屬地面層，地格之後、所有單位之前（審查必修 3）
  const list = [...(scene.units ?? []).map((u) => ({ u, row: u.y, x: u.x })), ...(Gi ? [{ giant: true, row: Gi.y + 1, x: Gi.x }] : [])].sort((a, b) => a.row - b.row || a.x - b.x);
  let i = 0;
  while (i < list.length) {
    const row = list[i].row, inRow = []; for (; i < list.length && list[i].row === row; i++) inRow.push(list[i]);
    for (const it of inRow) {
      if (it.giant) {
        g.setTransform(m); GB.draw(g, Gi.st, Gi.opt ?? {});
        if (Gi.hover && Gi.hover !== "body") GB.glowPart(g, W, H, m, Gi.st, Gi.hover, { dpr: view.res ?? 1 });
      } else { xf(g); OO.drawRing(g, it.u); const F = GB.mk(W, H), fc = F.getContext("2d"); xf(fc); OO.drawBody(fc, it.u, sc); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(F, 0, 0); }
    }
    for (const it of inRow) if (!it.giant && it.u.hp !== undefined) { xf(g); smallHud(g, it.u); }
  }
  if (Gi && Gi.marks) { g.setTransform(m); GB.drawMarks(g, Gi.parts ?? {}, { S: view.S, res: view.res ?? 1, hover: Gi.hover, melee: Gi.melee !== false }); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  return cv;
}
function smallHud(ctx, u) { const c = { x: (u.x + 0.5) * T, y: (u.y + 0.5) * T }, w = T * 0.8; ctx.fillStyle = "#000"; ctx.fillRect(c.x - w / 2, c.y + T * 0.36, w, 5); ctx.fillStyle = u.hp > 0.5 ? "#4cd964" : u.hp > 0.25 ? "#ffcc00" : "#ff3b30"; ctx.fillRect(c.x - w / 2, c.y + T * 0.36, w * u.hp, 5); }
const U = {
  hero: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_fighter, view: "back", hp: 0.8, hero: true, ...o }),
  archer: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_archer, view: "back", hp: 0.9, ...o }),
  mage: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_mage, view: "side", hp: 0.6, ...o }),
  lizard: (o) => ({ kind: "creature", team: "enemy", spec: { body: "lizard", material: "magma", size: "small" }, hp: 0.9, ...o }), // heart_ember_lizard 的 doll
};
/** 只放一隻巨型頭目：5×5 格（北一排岩漿、3×3、南一排石地）的小場景。 */
const solo = (st, o = {}) => ({ cols: 12, rows: 12, giant: { x: 5, y: 3, st, opt: o.opt, hover: o.hover, parts: o.parts, melee: o.melee, marks: o.marks }, units: o.units ?? [] });
const soloView = (S, res = 1, pad = 0.35) => ({ S, res, x0: (4 - pad) * T, y0: (1 - 0.15) * T, w: (3 + 2 * pad) * T, h: (4.15 + pad) * T });

// ---- 拼圖（同 boss-parts.html 的 sheet／publish） ----
function sheet(W, blocks) {
  const lay = [], pad = 14; let y = pad;
  const tmp = document.createElement("canvas").getContext("2d");
  const wrap = (s, w, px) => { tmp.font = `${px}px ${FONT}`; const out = []; for (const para of String(s).split("\n")) { let line = ""; for (const ch of para) { if (tmp.measureText(line + ch).width > w && line) { out.push(line); line = ch; } else line += ch; } out.push(line); } return out; };
  for (const b of blocks) {
    if (b.title) { lay.push({ t: "title", s: b.title, y }); y += 26; }
    else if (b.note) { const ls = wrap(b.note, W - 2 * pad, 13); lay.push({ t: "note", ls, y }); y += ls.length * 18 + 4; }
    else if (b.cells) {
      const gap = b.gap ?? 12; let x = pad, rowH = 0, items = [];
      const flush = () => { if (!items.length) return; lay.push({ t: "cells", items, y }); y += rowH + 10; x = pad; rowH = 0; items = []; };
      for (const c of b.cells) { const w = c.w ?? c.cv.width, h = c.h ?? c.cv.height; if (x + w > W - pad + 0.5 && items.length) flush(); const caps = c.cap ? wrap(c.cap, Math.max(w, 110), 12) : []; items.push({ c, x, w, h, caps }); x += w + gap; rowH = Math.max(rowH, h + caps.length * 16 + 4); }
      flush();
    }
  }
  const H = y + pad, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"); g.fillStyle = "#14161f"; g.fillRect(0, 0, W, H); g.textBaseline = "top";
  for (const l of lay) {
    if (l.t === "title") { g.font = `bold 16px ${FONT}`; g.fillStyle = "#e8bb48"; g.fillText(l.s, pad, l.y); }
    else if (l.t === "note") { g.font = `13px ${FONT}`; g.fillStyle = "#b8ab96"; l.ls.forEach((s, i) => g.fillText(s, pad, l.y + i * 18)); }
    else for (const it of l.items) {
      g.imageSmoothingEnabled = !it.c.nn; g.drawImage(it.c.cv, Math.round(it.x), Math.round(l.y), it.w, it.h); g.imageSmoothingEnabled = true;
      g.font = `12px ${FONT}`; g.fillStyle = "#d8ccb8"; it.caps.forEach((s, i) => g.fillText(s, it.x, l.y + it.h + 4 + i * 16));
    }
  }
  return cv;
}
function publish(cv, type = "image/jpeg") {
  document.getElementById("sheet").appendChild(cv);
  document.getElementById("out").textContent = cv.toDataURL(type, 0.8);
  document.documentElement.dataset.w = cv.width; document.documentElement.dataset.h = document.documentElement.scrollHeight; document.documentElement.dataset.done = "1";
}
const nn = (cv, z, cap) => ({ cv, w: cv.width * z, h: cv.height * z, nn: true, cap });
const PARTS = {};

// ================= 量外接框（模型像素，相對錨點） =================
function bbox(st, opt = {}, thr = 8) {
  const Z = 4, B = GB.BOX, cv = GB.mk((B[2] - B[0]) * Z, (B[3] - B[1]) * Z), g = cv.getContext("2d", { willReadFrequently: true });
  g.setTransform(Z, 0, 0, Z, -B[0] * Z, -B[1] * Z); GB.draw(g, st, opt);
  const d = g.getImageData(0, 0, cv.width, cv.height).data; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) if (d[(y * cv.width + x) * 4 + 3] > thr) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const r = (v) => Math.round(v * 10) / 10;
  return { x0: r(x0 / Z + B[0]), x1: r((x1 + 1) / Z + B[0]), y0: r(y0 / Z + B[1]), y1: r((y1 + 1) / Z + B[1]) };
}

// ================= 1a／1b 立繪真 1 倍 =================
PARTS.sprites = () => {
  const S = SW, nnz = P.get("g") === "nn", z = W_ === 800 ? 4 : 2;
  const blocks = [{ title: `1${W_ === 800 ? "b" : "a"}${nnz ? "2" : ""}. 立繪${nnz ? "最近鄰 ×" + z : "真 1 倍"}（${W_}×${W_ === 800 ? 600 : 900} 視窗、地圖縮放 ${S.toFixed(2)}、一格 ${(T * S).toFixed(1)} px）` },
    { note: nnz ? `真 1 倍的圖（1 裝置像素＝1 畫面 px）裁本體一帶（佔格往外 0.3 格、往上 4.1 格）最近鄰放大 ×${z}。` : "灰燼地格：北一排岩漿、中間 3×3（中心格＝熔心坑 (5, 3)）、南一排石地。每張都是真 1 倍（1 裝置像素＝1 畫面 px）。地面陣營環用提案 A（3×3 圓角方框）。" }];
  const cells = VARS.map((v) => {
    if (!nnz) return { cv: render(solo(v.st), soloView(S, 1)), cap: v.zh };
    const cv = render(solo(v.st), { S, res: 1, x0: 3.7 * T, y0: 0.9 * T, w: 3.6 * T, h: 4.3 * T });
    return nn(cv, z, v.zh);
  });
  if (W_ === 800 && !nnz) { blocks.push({ cells, gap: 16 }); blocks.push({ title: `最近鄰 ×${z}` }); const cz = VARS.map((v) => nn(render(solo(v.st), { S, res: 1, x0: 3.7 * T, y0: 0.9 * T, w: 3.6 * T, h: 4.3 * T }), z, v.zh)); blocks.push({ cells: cz, gap: 14 }); }
  else blocks.push({ cells, gap: 16 });
  publish(sheet(nnz ? 1340 : 1280, blocks), "image/png");
};
// ================= 1c 立繪放大＋佔格與高度上限 =================
PARTS.big = () => {
  const S = 2.2, blocks = [{ title: "1c. 立繪放大（向量直接畫到 2.2 倍）＋佔格 3×3 與高度上限 4 格" }, { note: "青虛線＝佔格與每一格（北排噴口、中排殼縫｜核心｜殼縫、南排前殼）；紅線＝高度上限（南緣往上 4 格＝北排往上再 1 格，北邊是岩漿）；黃點＝錨點（南排南緣中點）。" }];
  const cells = VARS.map((v) => {
    const vw = soloView(S, 1, 0.3), cv = render(solo(v.st, { opt: { ring: "rect" } }), vw), g = cv.getContext("2d");
    const ax = (5.5 * T - vw.x0) * S, ay = (5 * T - vw.y0) * S;
    g.save(); g.translate(ax, ay); g.scale(S, S);
    g.setLineDash([4 / S, 3 / S]); g.lineWidth = 1.2 / S; g.strokeStyle = "rgba(120,240,255,0.85)";
    for (let k = 0; k <= 3; k++) { g.beginPath(); g.moveTo(-72 + k * 48, -144); g.lineTo(-72 + k * 48, 0); g.stroke(); g.beginPath(); g.moveTo(-72, -144 + k * 48); g.lineTo(72, -144 + k * 48); g.stroke(); }
    g.setLineDash([]); g.strokeStyle = "#16121a"; g.lineWidth = 4 / S; g.beginPath(); g.moveTo(-84, -192); g.lineTo(84, -192); g.stroke(); g.strokeStyle = "#ff5a4a"; g.lineWidth = 2 / S; g.stroke();
    g.fillStyle = "#ffe14d"; g.beginPath(); g.arc(0, 0, 3 / S * 1.4, 0, Math.PI * 2); g.fill(); g.restore();
    return { cv, cap: v.zh };
  });
  blocks.push({ cells: cells.slice(0, 3), gap: 10 }, { cells: cells.slice(3), gap: 10 });
  publish(sheet(1280, blocks));
};
// ================= 1d 錨點與外接框 =================
PARTS.anchor = () => {
  const rows = VARS.map((v) => ({ v, body: bbox(v.st, { glow: false, ring: false, pitGlow: false }), all: bbox(v.st, { ring: false, pitGlow: false }) }));
  const W = (b) => (b.x1 - b.x0).toFixed(1), Hh = (b) => (b.y1 - b.y0).toFixed(1);
  const lines = rows.map((r) => `${r.v.zh}：本體 x ${r.body.x0}～${r.body.x1}、y ${r.body.y0}～${r.body.y1}（${W(r.body)}×${Hh(r.body)}）；含外光 x ${r.all.x0}～${r.all.x1}、y ${r.all.y0}～${r.all.y1}（${W(r.all)}×${Hh(r.all)}）`);
  const top = Math.min(...rows.map((r) => r.all.y0)), side = Math.max(...rows.map((r) => Math.max(-r.all.x0, r.all.x1))), bot = Math.max(...rows.map((r) => r.all.y1));
  const px = (S) => `一格 ${(T * S).toFixed(1)} px；佔格 ${(144 * S).toFixed(1)}×${(144 * S).toFixed(1)} px；外接框（含外光）最寬 ${(2 * side * S).toFixed(1)}、最高 ${((bot - top) * S).toFixed(1)} px（往上 ${(-top * S).toFixed(1)}、往下 ${(bot * S).toFixed(1)}）`;
  document.documentElement.dataset.anchor = JSON.stringify({ rows: rows.map((r) => ({ k: r.v.k, body: r.body, all: r.all })), top, side, bot, S1600, S800 });
  const blocks = [{ title: "1d. 錨點與外接框（模型像素：1 格＝48，原點＝錨點＝南排南緣中點，y 往上是負）" },
    { note: `錨點：佔格中心格（T20 (5, 3)）中心往南 72 模型 px＝南排南緣中點。佔格 x −72～72、y −144～0；高度上限 4 格＝y ≥ −192。\n以下量自畫出來的像素（alpha > 8；陣營環另計），熔岩噴發的熔岩柱（spout）、熔毀階段坑底的紅光（地面的光）不算在外接框內。\n${lines.join("\n")}\n全部外觀合起來：x ±${side}、y ${top}～${bot}（${(bot - top).toFixed(1)} 高 ＝ ${((bot - top) / 48).toFixed(2)} 格；往上 ${(-top / 48).toFixed(2)} 格 ≤ 4）。\n1600 寬（地圖縮放 ${S1600.toFixed(3)}）：${px(S1600)}。\n800 寬（地圖縮放 ${S800.toFixed(3)}）：${px(S800)}。` }];
  publish(sheet(1280, blocks));
};
// ================= 2 比例圖：3×3 立在灰燼地格上，南邊、兩側站 1 格的主角與餘燼蜥 =================
PARTS.field = () => {
  const S = SW, z = W_ === 800 ? 3 : 2;
  const units = (o = {}) => [U.hero({ id: "h", x: 5, y: 5 }), U.archer({ id: "a", x: 4, y: 6 }), U.lizard({ id: "l1", x: 6, y: 5, west: true }), U.lizard({ id: "l2", x: 3, y: 3 }), U.mage({ id: "m", x: 7, y: 3, west: true }), ...(o.more ?? [])];
  const V = { S, res: 1, x0: 1.5 * T, y0: 0.4 * T, w: 8 * T, h: 6.9 * T };
  const a = render({ cols: 12, rows: 12, giant: { x: 5, y: 3, st: { phase: 1, shell: 1, t: 300 } }, units: units() }, V);
  const parts = { vent: { state: "off", why: "ranged" }, seam: { state: "off", why: "range" }, core: { state: "ok" } };
  const b = render({ cols: 12, rows: 12, giant: { x: 5, y: 3, st: { phase: 2, shell: 0, t: 300 }, marks: true, parts, hover: "core", melee: true }, units: units() }, V);
  // 南邊緊貼的那一格放大（看前殼有沒有擋到南邊的人）
  if (P.get("p3") === "1") { // 2c：第 3 階段＋兩側多站人（審查 r7 同場景：(3,2) 弓手、(7,4) 戰士）；紅光改成地面層後兩側的人不被染

    for (const v of VARS) out[`sprite-${v.k}-${wz}`] = fnv(render(solo(v.st), soloView(S, 1)));
    CASES.forEach((c, i) => { out[`mark${i + 1}-${wz}`] = fnv(caseCv(c, S)); });
  }
  const vw = { S: S1600, res: 1, x0: 3.7 * T, y0: 0.2 * T, w: 3.6 * T, h: 5 * T };
  for (const bt of [0, 0.25, 0.5, 0.7, 0.85, 1]) out[`shed-${bt}`] = fnv(render(solo({ phase: 1, shell: 0, breakT: bt, t: 300 }), vw));
  Object.assign(out, icHash());
  document.documentElement.dataset.hash = JSON.stringify(out);
  publish(sheet(400, [{ title: "hash" }]));
};
// ================= 自查：單一外觀放大（?part=probe&k=p2n&z=4&hover=seam） =================
PARTS.probe = () => {
  const v = VARS.find((x) => x.k === (P.get("k") || "p1s")) ?? VARS[0], Z = +(P.get("z") || 4);
  const cv = render(solo(v.st, { hover: P.get("hover") || undefined }), soloView(Z, 1, 0.2));
  publish(sheet(Math.max(800, cv.width + 40), [{ cells: [{ cv, cap: v.zh }] }]));
};

try { (PARTS[PART] ?? PARTS.sprites)(); } catch (e) { console.log("ERR " + e.stack); document.documentElement.dataset.err = String(e); }
</script>
