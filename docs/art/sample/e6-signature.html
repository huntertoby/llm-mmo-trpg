<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>E6 招牌效果樣張</title>
<!-- E6「裝備招牌效果」介面樣張（畫圖 agent，2026-11-23；紀錄 docs/art/E6-招牌-美術.md）。
     ?part=cards｜offer｜world｜panel｜compare｜icons｜anim｜t1x｜audit｜all（預設 all），網址加 &mute=1。
     框、卡片、按鈕、字一律載入現行 client/src/styles/index.css（只讀）；這頁只加 e6-* 的新元件（下面的 <style>）。 -->
<link rel="stylesheet" href="../../../client/src/styles/index.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-size: 14px; }
  .e6-part { margin: 0 0 28px; }
  .e6-part > h1 { font-size: 18px; margin: 0 0 4px; color: #f0e6cc; }
  .e6-note { color: var(--muted); font-size: 12px; margin: 0 0 10px; max-width: 1100px; text-wrap: pretty; }
  .e6-cap { font-size: 12px; color: #e0b060; margin: 0 0 4px; }
  .e6-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px 12px; align-items: start; }
  .e6-grid > div { min-width: 0; }

  /* ===== 招牌框（新元件）：稀有度色（--sig）的細框＋左邊 3px 色條＋由左往右淡掉的底色；第一行是類型牌與名字 ===== */
  .e6-sig {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    padding: 6px 8px 7px 11px; border: 1px solid var(--sig); border-radius: 4px; overflow: hidden;
    background: linear-gradient(90deg, color-mix(in srgb, var(--sig) 20%, #14141c), color-mix(in srgb, var(--sig) 6%, #14141c) 75%);
    box-shadow: inset 3px 0 0 var(--sig);
  }
  .e6-sig-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .e6-sig-tag {
    display: inline-flex; align-items: center; gap: 3px; padding: 0 7px 0 6px; border-radius: 9px; white-space: nowrap;
    font-size: 12px; line-height: 18px; background: color-mix(in srgb, var(--sig) 30%, #0c0e16); color: color-mix(in srgb, var(--sig) 50%, #ffffff);
  }
  .e6-sig-tag:has(.e6-ico) { padding-left: 1px; }
  .e6-ico { display: inline-block; flex: none; }
  .e6-sig-name { font-weight: 700; color: #f6eedb; }
  /* 現行卡片的副標（部位・稀有度・Lv・武器）在 250 寬會剩一個字在最後一行（「雙／手」）：樣張加 text-wrap: pretty，移植時一併加（見紀錄） */
  .gear-card-headtext .small { text-wrap: pretty; }
  .e6-sig-text { font-size: 13px; line-height: 1.45; text-wrap: pretty; }
  .e6-sig-off { font-size: 12px; line-height: 1.4; color: var(--muted); text-wrap: pretty; }
  .gear-rarity-legendary .e6-sig { border-width: 1px; }
  /* 標灰＝沒有效果（本專案既定）：框與色條換灰、沒有底色；名字照現行「重複詞條」的標法（灰字＋刪除線，float-card.css .part-tip-line.inactive）；說明灰字；原因灰字不劃線 */
  .e6-sig.off { background: none; }
  .e6-sig.off .e6-sig-tag { background: #23232d; color: var(--muted); }
  .e6-sig.off .e6-sig-name { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(160, 160, 176, 0.6); }
  .e6-sig.off .e6-sig-text { color: var(--muted); }
  .e6-sig.off .e6-ico, .e6-pick-row.off .e6-ico { filter: grayscale(1); opacity: 0.5; }

  /* ===== 撿到時的一次性強調（提案）：框外一圈稀有度色的光暈亮起又收掉＋一道斜光由左掃到右，各一次、1.2 秒內結束，不重播 ===== */
  .e6-sig.fx { animation: e6-glow 1.1s ease-out 0.25s 1 both; }
  .e6-sig.fx::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(105deg, transparent 38%, rgb(255 255 255 / 24%) 50%, transparent 62%) no-repeat;
    background-size: 260% 100%; animation: e6-sheen 0.8s ease-in-out 0.25s 1 both;
  }
  .e6-sig.fx .e6-sig-tag { animation: e6-pop 0.35s ease-out 0.25s 1 both; }
  @keyframes e6-glow { 0% { box-shadow: inset 3px 0 0 var(--sig), 0 0 0 0 transparent; } 30% { box-shadow: inset 3px 0 0 var(--sig), 0 0 9px 1px var(--sig); } 100% { box-shadow: inset 3px 0 0 var(--sig), 0 0 0 0 transparent; } }
  @keyframes e6-sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  @keyframes e6-pop { 0% { transform: scale(0.82); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  :root[data-reduced-motion="true"] .e6-sig.fx, :root[data-reduced-motion="true"] .e6-sig.fx::after, :root[data-reduced-motion="true"] .e6-sig.fx .e6-sig-tag { animation: none; }
  /* 關鍵影格（只在樣張用）：把動畫停在 --t 那一刻 */
  .e6-freeze .e6-sig.fx, .e6-freeze .e6-sig.fx::after, .e6-freeze .e6-sig.fx .e6-sig-tag { animation-play-state: paused; animation-delay: calc(0.25s - var(--t)); }

  /* ===== 角色面板：招牌清單（新元件）===== */
  .e6-pick { margin: 6px 0; }
  .e6-pick .section-title { margin: 6px 0 4px; }
  .e6-pick-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .e6-pick-row {
    display: grid; grid-template-columns: 16px 16px 1fr; align-items: start; gap: 6px; padding: 4px 6px; border-radius: 4px;
    background: color-mix(in srgb, var(--sig) 10%, transparent); box-shadow: inset 2px 0 0 var(--sig); cursor: pointer;
  }
  .e6-pick-row > .e6-box, .e6-pick-row > .e6-ico { margin-top: 1px; }
  .e6-pick-row.off { background: none; box-shadow: inset 2px 0 0 #3a3a48; }
  .e6-pick-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
  .e6-pick-row.off .e6-pick-name { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(160, 160, 176, 0.6); }
  .e6-pick-off { color: var(--muted); text-wrap: pretty; }
  .e6-pick-hint { color: #e0b060; margin: 0 0 4px; }
  .e6-pick-row.press { outline: 1px solid #e0b060; outline-offset: -1px; }
  /* 勾選框：方框＝招牌，圓鈕＝改寫規則（全身只能 1 個，勾一個就換掉另一個）；勾上＝金黃底（--accent，同「已選這個」）＋深色勾 */
  .e6-box { position: relative; width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid #8a8898; border-radius: 3px; background: #0c0e16; display: inline-block; }
  .e6-box.round { border-radius: 50%; }
  .e6-box.on { border-color: var(--accent); background: var(--accent); }
  .e6-box.on:not(.round)::after { content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3.5px; height: 7px; border: solid #16121a; border-width: 0 2px 2px 0; transform: rotate(42deg); }
  .e6-box.round.on { background: #0c0e16; }
  .e6-box.round.on::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }

  /* ===== 大世界：戰利品那一行的裝備小牌、背包滿時的列 ===== */
  .e6-loot-gear { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px 0 3px; border-radius: 3px; background: color-mix(in srgb, var(--sig) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sig) 60%, transparent); white-space: nowrap; }
  .e6-loot-gear b { color: var(--sig); font-weight: 700; }
  .e6-loot-tag { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: color-mix(in srgb, var(--sig) 50%, #ffffff); }

  /* 比較頁 */
  .e6-cmp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .e6-cmp > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  @media (max-width: 900px) { .e6-cmp { grid-template-columns: 1fr; } }
  .e6-icons { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .e6-icons figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 12px; text-align: center; max-width: 170px; }
  .e6-icons .row { display: flex; align-items: end; gap: 8px; }
  .e6-frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .e6-mock-panel { max-width: 320px; }
  .e6-panels { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .e6-panels > .panel { width: 320px; box-sizing: border-box; }
  textarea#out { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<textarea id="out"></textarea>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script>
<script src="qDoll.js"></script>
<script src="tools/qStatusLive.js"></script><script src="qPartsData.js"></script>
<script src="qIcons.js"></script><script src="qIconsWeapons.js"></script><script src="qIconsArmor.js"></script><script src="qIconsSkills.js"></script><script src="qIconsParts.js"></script>
<script src="e6Signature.js"></script>
<script>
(() => {
  const E = window.E6Sig, { h, ITEMS: I, card, sigBox, pickList, icon, KINDS, ORDER, RARITY } = E;
  E.install();
  const P = new URLSearchParams(location.search), part = P.get("part") ?? "all";
  const root = document.getElementById("root");
  const section = (id, title, note, ...kids) => h("section.e6-part", { id }, h("h1", null, title), note ? h("p.e6-note", null, note) : null, kids);
  const capd = (cap, node) => h("div", null, h("div.e6-cap", null, cap), node);

  // ---------- 1. 裝備卡第一行的招牌框 ----------
  function partCards() {
    return section("cards", "1. 裝備卡第一行的招牌框（A 案：類型小圖示＋字）",
      "卡片照現行 GearCardView（圖示、名稱、部位・稀有度・Lv、詞條、和目前的比較），只多招牌那一框，放在詞條之前＝第一行。框色＝卡片的稀有度色（稀有藍、史詩紫、傳說金），不另開新色；灰＝沒有效果。",
      h("div.e6-grid", null,
        capd("新動作（稀有・主手）", card(I.hook)),
        capd("新反應（史詩・身體）", card(I.vest)),
        capd("地形規則（稀有・腳）", card(I.frost)),
        capd("行為改寫（史詩・主手）", card(I.cleave)),
        capd("改寫規則（史詩・項鍊）", card(I.ember)),
        capd("傳說的獨特效果（副手）", card(I.mountain)),
        capd("標灰：穿上後是第 4 個", card(I.lava)),
        capd("標灰：改寫規則衝突", card(I.blood))));
  }

  // ---------- 2. 撿到時的展示 ----------
  function offerPanel(fx) {
    const cands = [I.hook, I.gloves, I.ember];
    return h("div.panel.run-gear-offer", { "data-testid": "gear-offer" },
      h("h2", null, "戰利品：裝備三選一（第 3 場後）"),
      h("p.muted.small", null, "選 1 件直接換上，換下的裝備進背包（營火可以換回來）；不想換就都不拿。選完之後才是升級。"),
      h("div.run-offer-cards", null, cands.map((it) => h("div.run-offer-card", null, card(it, { fx }), h("button", { type: "button" }, "選這個")))),
      h("div.run-actions", null, h("button.primary", { type: "button" }, "都不拿（不換裝備）")));
  }
  function lootChip(it) {
    return h("span.e6-loot-gear", { "--sig": RARITY[it.rarity][0] }, h("b", null, it.name), h("span.e6-loot-tag", null, icon(it.sig.kind, 14), "招牌"));
  }
  function worldMock(fx) {
    return h("div.e6-panels", null,
      h("div.panel", { style: "width:360px" },
        h("div.section-title.small", null, "地點圖右側：戰後那一行（現行 last_loot_zh）"),
        h("div.small.world-last-battle", null, "戰利品：鐵礦 ×2、狼皮 ×1、獵人皮手套"),
        h("div.section-title.small", { style: "margin-top:10px" }, "提案：帶招牌的裝備換成小牌"),
        h("div.small.world-last-battle", { style: "line-height:22px" }, "戰利品：鐵礦 ×2、狼皮 ×1、", lootChip(I.frost), "、獵人皮手套"),
        h("div.section-title.small", { style: "margin-top:10px" }, "背包滿了：選要丟哪件（LootChoicePanel 的列）"),
        h("ul.world-shop-list.small", null,
          lootRow(I.frost, "新拿到", true), lootRow(I.gloves, "背包裡", false))),
      h("div.panel.world-screen-pane.world-bag-screen", { style: "flex:1 1 560px;min-width:0;max-width:760px" },
        h("div.world-quest-head", null, h("h2", null, "背包與裝備"), h("span.muted.small", null, "金幣 1,240")),
        h("div.world-bag-main", null,
          h("div.world-bag-side", { style: "flex:1 1 300px;min-width:0" },
            h("div.section-title.small", null, "詳情：剛撿到的霜行長靴（第一次打開時強調一次）"),
            h("div.run-offer-card", null, card(I.frost, { fx }), h("div.run-actions", null, h("button.primary", { type: "button" }, "換上（腳）")))))));
  }
  function lootRow(it, side, sig) {
    return h("li", { style: "display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px" },
      h("span.world-shop-thing", { style: "display:inline-flex;align-items:center;gap:6px" }, E.gearIcon(it, 24), h("span.world-shop-name", null, it.name),
        sig ? h("span.e6-loot-tag", { style: "--sig:" + RARITY[it.rarity][0] }, icon(it.sig.kind, 14), "招牌") : null),
      h("span.muted", null, side), h("label", null, h("input", { type: "checkbox" }), "丟掉"));
  }
  function partOffer() {
    return section("offer", "2. 撿到時的展示：一輪的三選一",
      "卡片本身已有招牌框；三張並排時一眼看出哪幾張會改玩法（手、頭、戒指不帶招牌）。剛打開這個畫面時，招牌框各強調一次（光暈亮起又收掉＋一道斜光掃過，1.2 秒內結束、不重播；減少動態時不播）。截圖是播完後的樣子，過程見 7.",
      offerPanel(true));
  }
  function partWorld() {
    return section("world", "3. 撿到時的展示：大世界掉落",
      "大世界的掉落是一行字（last_loot_zh）＋物品飛進背包，裝備卡在背包的詳情裡。提案：① 戰後那一行把帶招牌的裝備換成稀有度色的小牌（名字＋類型小圖示＋「招牌」）；② 背包滿時的列在名字後面加同一個小標；③ 第一次在背包打開這件時，招牌框強調一次（同三選一）。飛進背包的動畫不改。",
      worldMock(true));
  }

  // ---------- 4. 角色面板的勾選 ----------
  function heroPanel(title, rows, opt = {}) {
    const worn = [I.hook, I.vest, I.ember, I.lava, I.gloves];
    return h("div.panel.run-hero", null,
      h("div.e6-cap", null, title),
      h("div.hud-title", null, "艾琳　", h("span.muted", null, "Lv 12")),
      h("div.run-gear", null,
        h("div.section-title", null, "裝備", h("span.muted.small", null, "　背包 4 件")),
        h("div.gear-row", null, (opt.worn ?? worn).map((it) => E.gearIcon(it, 32)))),
      pickList(rows, opt));
  }
  function partPanel() {
    return section("panel", "4. 角色面板：勾選要生效的招牌（一輪的主角面板 RunHeroPanel，寬 320）",
      "放在「裝備」那一排圖示底下。方框＝招牌（最多勾 3 個），圓鈕＝改寫規則（全身 1 個；點另一個就直接換過去）。沒勾的就是沒有效果，整列標灰並寫原因（用字已定）。標題後面寫「生效 N／3」，有改寫規則時再接「改寫規則 N／1」。滑過一列看完整說明（同現行裝備圖示的浮動卡）。",
      h("div.e6-panels", null,
        heroPanel("① 4 個招牌、勾了 3 個，第 4 個標灰", [
          { it: I.hook, on: true }, { it: I.vest, on: true }, { it: I.lava, on: false }, { it: I.ember, on: true }]),
        heroPanel("② 兩條改寫規則衝突：勾一條，另一條標灰", [
          { it: I.hook, on: true }, { it: I.blood, on: false, off: E.offRule("項鍊") }, { it: I.ember, on: true }],
          { worn: [I.hook, I.blood, I.ember, I.frost, I.gloves] }),
        heroPanel("③ 已滿 3 個時按了沒勾的那一列（提示是新字）", [
          { it: I.hook, on: true }, { it: I.vest, on: true }, { it: I.lava, on: false, press: true }, { it: I.ember, on: true }],
          { hint: "已經有 3 個生效：先取消勾選一個，再勾這個。" })),
      h("div.e6-cap", { style: "margin-top:14px" }, "大世界：背包與裝備的「穿戴中」底下放同一份清單（寬的時候兩欄）"),
      h("div.panel.world-screen-pane", { style: "max-width:900px" },
        h("div.section-title", null, "穿戴中"),
        h("ul.world-worn", null, [I.cleave, I.mountain, null, I.vest, null, I.lava, I.ember, null, null].map((it, i) =>
          h(`li.world-worn-slot${it ? "" : ".empty"}`, null, h("span.world-worn-box", null, it ? E.gearIcon(it, 44) : h("span", { style: "width:44px;height:44px;display:inline-block" })),
            h("span.world-worn-cat", null, ["主手", "副手", "頭", "身體", "手", "腳", "項鍊", "戒指 1", "戒指 2"][i])))),
        h("div", { style: "columns:2 300px;column-gap:16px" },
          pickList([{ it: I.cleave, on: true }, { it: I.mountain, on: true }, { it: I.vest, on: true }, { it: I.lava, on: false }, { it: I.ember, on: false, off: E.offRule("副手") }]))));
  }

  // ---------- 5. A／B 比較 ----------
  function partCompare() {
    const its = [I.hook, I.vest, I.frost, I.cleave, I.ember];
    const col = (title, mode) => h("div", null, h("div.e6-cap", null, title), its.map((it) => sigBox(it, { mode })), sigBox(I.lava, { mode }));
    return section("compare", "5. 類型小圖示：A 有圖示／B 只有文字",
      "同一組招牌框排三欄。A＝類型牌前面一個 18 px 小圖示（建議）；B1＝只有文字；B2＝文字＋每種一個框色（不建議：框色已經用來表示稀有度，五種顏色又和元素色、關鍵字色撞）。",
      h("div.e6-cmp", null, col("A：小圖示＋字（框色＝稀有度）", "A"), col("B1：只有字（框色＝稀有度）", "B1"), col("B2：字＋每種一個框色", "B2")));
  }

  // ---------- 6. 小圖示 ----------
  function partIcons() {
    const big = (k) => { const K = KINDS[k], cv = window.QIconsParts.glyph(K.cat, K.id, 36, 2); cv.style.width = cv.style.height = "48px"; return cv; };
    return section("icons", "6. 五種招牌的類型小圖示（A 案）",
      "四種直接用第④批已有的部件（同一個題材同一個形），只有地形規則新畫。實際尺寸：裝備卡 18、角色面板 16、戰利品小牌 14（圖樣本身＝格子的 75%，都 ≤14 px：走 tiny、不包外框）。真 1 倍與最近鄰放大見 t1x。",
      h("div.e6-icons", null, ORDER.map((k) => h("figure", null,
        h("div.row", null, big(k), icon(k, 18), icon(k, 16), icon(k, 14)),
        h("b", null, KINDS[k].zh), h("span.muted", null, KINDS[k].src)))));
  }

  // ---------- 7. 一次性強調的關鍵影格 ----------
  function partAnim() {
    const ts = [0, 0.4, 0.6, 0.7, 1.4];
    return section("anim", "7. 撿到時的一次性強調：關鍵影格",
      "0.25 秒後開始：類型牌輕彈一下（0.35 秒）、框外光暈亮起再收（1.1 秒）、一道斜光由左掃到右（0.8 秒）。只播一次；同一件裝備之後再看到不播；減少動態時整段不播。",
      h("div.e6-frames", null, ts.map((t) => h("div.e6-freeze", { style: `--t:${t}s` }, h("div.e6-cap", null, `t = ${t} 秒`), sigBox(I.hook, { fx: true })))),
      h("div.e6-frames", { style: "margin-top:10px" }, ts.map((t) => h("div.e6-freeze", { style: `--t:${t}s` }, h("div.e6-cap", null, `傳說 t = ${t} 秒`), sigBox(I.mountain, { fx: true })))));
  }

  // ---------- t1x：真 1 倍＋最近鄰放大（canvas，給腳本存 PNG） ----------
  const mixHex = (a, b, t) => { const p = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  function grayed(cv) { /* 同 CSS filter: grayscale(1) opacity(.5)：灰階後 alpha 減半 */
    const o = document.createElement("canvas"); o.width = cv.width; o.height = cv.height; const x = o.getContext("2d"); x.drawImage(cv, 0, 0);
    const d = x.getImageData(0, 0, o.width, o.height); for (let i = 0; i < d.data.length; i += 4) { const l = 0.2126 * d.data[i] + 0.7152 * d.data[i + 1] + 0.0722 * d.data[i + 2]; d.data[i] = d.data[i + 1] = d.data[i + 2] = l; d.data[i + 3] *= 0.5; } x.putImageData(d, 0, 0); return o;
  }
  function sheetT1x() {
    const Z = 6, sizes = [18, 16, 14], BG = [["稀有牌底", mixHex("#0c0e16", "#6fb4ff", 0.3)], ["史詩牌底", mixHex("#0c0e16", "#c58cff", 0.3)], ["卡片底", "#14141c"]];
    const colW = (s) => s * Z + 12, rowH = 18 * Z + 30, labelW = 96;
    const W = labelW + sizes.reduce((a, s) => a + 22 + colW(s), 0) + 16 * Z + 30, Hh = 56 + ORDER.length * rowH + 20;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = Hh; const x = cv.getContext("2d"); x.imageSmoothingEnabled = false;
    x.fillStyle = "#101016"; x.fillRect(0, 0, W, Hh); x.font = "13px 'Noto Sans TC', sans-serif"; x.fillStyle = "#e8e6e3";
    x.fillText("真 1 倍（canvas 寬高＝CSS px）｜最近鄰 ×6（imageSmoothingEnabled=false）", 8, 18); x.fillText("底色：18＝稀有牌底、16＝史詩牌底、14＝卡片底；最右＝16 標灰", 8, 36);
    ORDER.forEach((k, r) => {
      const y0 = 56 + r * rowH; x.fillStyle = "#f0e6cc"; x.fillText(KINDS[k].zh, 8, y0 + 16); let X = labelW;
      sizes.forEach((s, i) => {
        const g = icon(k, s, 1), bg = BG[i][1];
        x.fillStyle = bg; x.fillRect(X, y0, s + 4, s + 4); x.drawImage(g, X + 2, y0 + 2); /* 1 倍原樣（整數位置） */
        x.fillStyle = "#9a98a6"; x.font = "11px 'Noto Sans TC', sans-serif"; x.fillText(s + "", X, y0 + s + 18); x.font = "13px 'Noto Sans TC', sans-serif";
        const X2 = X + s + 8; x.fillStyle = bg; x.fillRect(X2, y0, s * Z, s * Z); x.drawImage(g, 0, 0, s, s, X2, y0, s * Z, s * Z);
        X = X2 + s * Z + 14;
      });
      const g = grayed(icon(k, 16, 1)); x.fillStyle = "#14141c"; x.fillRect(X, y0, 16 * Z, 16 * Z); x.drawImage(g, 0, 0, 16, 16, X, y0, 16 * Z, 16 * Z);
    });
    return cv;
  }

  // ---------- audit：佔框、亮度（量真 1 倍與 4 倍，tiny 那一份） ----------
  function audit() {
    const lines = ["kind      box  res  bbox(px)   佔格%  佔圖樣%  平均亮度  亮度≥150%"];
    for (const k of ORDER) for (const s of [18, 16, 14]) for (const res of [1, 4]) {
      const g = icon(k, s, res), d = g.getContext("2d").getImageData(0, 0, g.width, g.height).data; let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, n = 0, sum = 0, hi = 0;
      for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; const p = i / 4, x = p % g.width, y = (p / g.width) | 0; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; if (d[i] === 0x16 && d[i + 1] === 0x12 && d[i + 2] === 0x1a) continue; n++; sum += l; if (l >= 150) hi++; }
      const side = Math.max(x1 - x0 + 1, y1 - y0 + 1) / res;
      lines.push(`${k.padEnd(9)} ${String(s).padStart(3)}  ${res}x  ${((x1 - x0 + 1) / res).toFixed(1)}×${((y1 - y0 + 1) / res).toFixed(1)}`.padEnd(32) + `${(side / s * 100).toFixed(0).padStart(4)}  ${(side / (s * 0.75) * 100).toFixed(0).padStart(6)}  ${(sum / n).toFixed(0).padStart(8)}  ${(hi / n * 100).toFixed(0).padStart(8)}`);
    }
    return lines.join("\n");
  }

  const PARTS = { cards: partCards, offer: partOffer, world: partWorld, panel: partPanel, compare: partCompare, icons: partIcons, anim: partAnim };
  const go = () => {
    if (part === "t1x") { const cv = sheetT1x(); root.append(cv); document.getElementById("out").textContent = cv.toDataURL("image/png"); }
    else if (part === "audit") root.append(h("pre", { id: "audit" }, audit()));
    else (part === "all" ? Object.keys(PARTS) : [part]).forEach((p) => root.append(PARTS[p]()));
    document.documentElement.dataset.h = String(Math.ceil(root.getBoundingClientRect().bottom + 8));
  };
  (document.fonts?.ready ?? Promise.resolve()).then(go);
})();
</script>
