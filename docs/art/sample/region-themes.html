<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>區域主題對照</title>
<style>
  body{margin:0;padding:14px 18px;background:#101218;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;width:1250px}
  h1{font-size:19px;margin:0 0 4px}.note{color:#b8ab96;font-size:13px;margin:0 0 10px;line-height:1.5}
  .row{display:flex;gap:14px}.col{width:404px}
  .cap{font-size:12px;color:#c8bca8;line-height:1.5;margin-top:6px}
  .cap b{color:#e8bb48}
  canvas{display:block;border-radius:6px}
</style></head>
<body>
<h1>同一個 HUD 和事件卡，換三種區域主題（全域層中性、區域層鮮明）</h1>
<p class="note">美術 PM，2026-11-04。全域層（版面、字型、按鈕、深藍底、金色主框）三區都一樣；會換的只有區域點綴：主框四角的飾件、標題牌的材質、事件插圖背景、等待動畫的墨色與封蠟、頭像框色。人物照舊是 C 墨線繪本。全部程式繪製，只是示意。</p>
<div class="row" id="r"></div>
<script>
const TAU=Math.PI*2, FONT="'Noto Sans TC','Microsoft JhengHei',sans-serif", SERIF="'Noto Serif TC','PMingLiU',serif";
const NAVY="#1e2236", NAVY2="#161a2a", GOLD="#c8a868", GOLD2="#e8bb48", CREAM="#f2e6c8";
const THEMES={
 cloud:{name:"雲嶺（東方）",accent:"#6aa84a",ink:"#1c1712",seal:"#b8432f",ground:["#5f8f4a","#6a9a52"],plaque:"jade",corner:"cloud",
   lines:"說書人提筆補上一段……", wait:"墨黑＋朱紅封蠟", art:"竹林、石板、薄霧"},
 ashen:{name:"灰燼荒原（災變）",accent:"#ff6a1a",ink:"#3a1a10",seal:"#ff6a1a",ground:["#3a2a24","#4a3028"],plaque:"iron",corner:"rivet",
   lines:"說書人撣掉頁上的灰……", wait:"焦褐墨＋餘燼火星＋熔岩橘封蠟", art:"焦土、熔岩、枯木"},
 capital:{name:"主城樞島（碎界中樞）",accent:"#a898ff",ink:"#22305a",seal:"#7a5ad0",ground:["#cfc8b8","#ddd6c6"],plaque:"crystal",corner:"filigree",
   lines:"說書人翻到樞島那一頁……", wait:"晶藍墨＋紫晶封蠟", art:"白石板、源晶燈、藍頂"},
};
function cv(w,h){const c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";const x=c.getContext("2d");x.scale(2,2);return[c,x];}
function corner(x,X,Y,sx,sy,T){x.save();x.translate(X,Y);x.scale(sx,sy);x.lineWidth=1.6;
  if(T.corner==="cloud"){x.strokeStyle=T.accent;x.beginPath();x.arc(10,10,6,Math.PI,TAU*0.95);x.stroke();x.beginPath();x.arc(18,6,4,Math.PI,TAU);x.stroke();x.fillStyle=T.seal;x.beginPath();x.arc(4,4,2.5,0,TAU);x.fill();}
  else if(T.corner==="rivet"){x.fillStyle="#5a5a60";x.fillRect(0,0,18,6);x.fillRect(0,0,6,18);x.fillStyle="#9a9aa0";[[3,3],[12,3],[3,12]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,1.6,0,TAU);x.fill();});x.fillStyle=T.accent;x.globalAlpha=0.7;x.fillRect(16,2,3,2);x.globalAlpha=1;}
  else {x.strokeStyle=GOLD2;x.beginPath();x.moveTo(0,16);x.quadraticCurveTo(0,0,16,0);x.stroke();x.fillStyle=T.accent;x.beginPath();x.moveTo(7,2);x.lineTo(10,7);x.lineTo(7,12);x.lineTo(4,7);x.closePath();x.fill();x.strokeStyle="#f2eaff";x.lineWidth=0.6;x.stroke();}
  x.restore();}
function frame(x,X,Y,W,H,T,r=8){x.fillStyle=NAVY;x.beginPath();x.roundRect(X,Y,W,H,r);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.5;x.stroke();
  corner(x,X+2,Y+2,1,1,T);corner(x,X+W-2,Y+2,-1,1,T);corner(x,X+2,Y+H-2,1,-1,T);corner(x,X+W-2,Y+H-2,-1,-1,T);}
function plaque(x,X,Y,W,H,text,T){
  if(T.plaque==="jade"){const g=x.createLinearGradient(X,Y,X,Y+H);g.addColorStop(0,"#2f4a3a");g.addColorStop(1,"#1f3428");x.fillStyle=g;}
  else if(T.plaque==="iron"){const g=x.createLinearGradient(X,Y,X,Y+H);g.addColorStop(0,"#4a4044");g.addColorStop(1,"#2a2426");x.fillStyle=g;}
  else {const g=x.createLinearGradient(X,Y,X,Y+H);g.addColorStop(0,"#2a2a5a");g.addColorStop(1,"#1a1a3a");x.fillStyle=g;}
  x.beginPath();x.roundRect(X,Y,W,H,5);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.2;x.stroke();x.strokeStyle=T.accent;x.globalAlpha=0.6;x.beginPath();x.roundRect(X+3,Y+3,W-6,H-6,3);x.stroke();x.globalAlpha=1;
  x.fillStyle=CREAM;x.font=`bold 15px ${SERIF}`;x.fillText(text,X+12,Y+H/2+5);}
function face(x,X,Y,s,T){x.fillStyle=NAVY2;x.beginPath();x.arc(X+s/2,Y+s/2,s/2,0,TAU);x.fill();x.strokeStyle=T.accent;x.lineWidth=2;x.stroke();
  x.fillStyle="#f1c9a5";x.beginPath();x.arc(X+s/2,Y+s*0.55,s*0.24,0,TAU);x.fill();x.fillStyle="#3a2414";x.beginPath();x.arc(X+s/2,Y+s*0.47,s*0.25,Math.PI,TAU);x.fill();}
function bar(x,X,Y,W,k,col){x.fillStyle="#0c0e16";x.beginPath();x.roundRect(X,Y,W,8,4);x.fill();x.fillStyle=col;x.beginPath();x.roundRect(X,Y,W*k,8,4);x.fill();}
function person(x,X,Y,body){x.fillStyle="rgba(0,0,0,0.25)";x.beginPath();x.ellipse(X,Y+2,8,3,0,0,TAU);x.fill();x.fillStyle=body;x.beginPath();x.roundRect(X-5,Y-16,10,14,3);x.fill();x.strokeStyle="#2b1e16";x.lineWidth=1;x.stroke();x.fillStyle="#f1c9a5";x.beginPath();x.arc(X,Y-21,5,0,TAU);x.fill();x.stroke();}
function eventArt(x,X,Y,W,H,key,T){x.save();x.beginPath();x.roundRect(X,Y,W,H,6);x.clip();
  const tw=W/7,th=H/3;for(let i=0;i<7;i++)for(let j=0;j<3;j++){x.fillStyle=T.ground[(i+j)%2];x.fillRect(X+i*tw,Y+j*th,tw+1,th+1);}
  if(key==="cloud"){x.strokeStyle="#3a6a2a";x.lineWidth=2;for(let i=0;i<6;i++){x.beginPath();x.moveTo(X+8+i*5,Y+H);x.lineTo(X+10+i*5,Y+8);x.stroke();}x.fillStyle="rgba(255,255,255,0.25)";x.beginPath();x.ellipse(X+W*0.7,Y+20,60,10,0,0,TAU);x.fill();
    x.fillStyle="#8a9aa0";x.fillRect(X+W*0.45,Y+th,tw*2,th);x.fillStyle="#9aa8a8";x.beginPath();x.roundRect(X+W*0.52,Y+th*0.6,14,26,3);x.fill();}
  else if(key==="ashen"){x.strokeStyle="#ff6a1a";x.lineWidth=1.2;for(let i=0;i<5;i++){x.beginPath();x.moveTo(X+20+i*55,Y+10);x.lineTo(X+30+i*55,Y+30);x.lineTo(X+22+i*55,Y+50);x.stroke();}
    const g=x.createLinearGradient(X+W-80,Y,X+W,Y);g.addColorStop(0,"rgba(255,106,26,0)");g.addColorStop(1,"rgba(255,140,40,0.9)");x.fillStyle=g;x.fillRect(X+W-80,Y,80,th);
    x.strokeStyle="#2a1a10";x.lineWidth=2;x.beginPath();x.moveTo(X+30,Y+H);x.lineTo(X+32,Y+18);x.lineTo(X+22,Y+8);x.moveTo(X+32,Y+24);x.lineTo(X+42,Y+12);x.stroke();
    x.fillStyle="#6a6a70";x.beginPath();x.roundRect(X+W*0.52,Y+th*0.6,14,26,3);x.fill();}
  else {x.strokeStyle="rgba(200,168,104,0.5)";x.lineWidth=0.8;for(let i=0;i<7;i++){x.beginPath();x.moveTo(X+i*tw,Y);x.lineTo(X+i*tw,Y+H);x.stroke();}
    [[0.18,0.3],[0.85,0.3]].forEach(([a,b])=>{const cx=X+W*a,cy=Y+H*b;x.fillStyle="#e8e0d0";x.fillRect(cx-3,cy,6,16);x.fillStyle="#a898ff";x.beginPath();x.moveTo(cx,cy-12);x.lineTo(cx+5,cy-3);x.lineTo(cx,cy+2);x.lineTo(cx-5,cy-3);x.closePath();x.fill();
      const g=x.createRadialGradient(cx,cy-5,0,cx,cy-5,16);g.addColorStop(0,"rgba(168,152,255,0.6)");g.addColorStop(1,"rgba(168,152,255,0)");x.fillStyle=g;x.beginPath();x.arc(cx,cy-5,16,0,TAU);x.fill();});
    x.fillStyle="#3a5ad0";x.beginPath();x.moveTo(X+W*0.4,Y+18);x.lineTo(X+W*0.6,Y+18);x.lineTo(X+W*0.56,Y+4);x.lineTo(X+W*0.44,Y+4);x.fill();x.fillStyle="#f2ece0";x.fillRect(X+W*0.42,Y+18,W*0.16,14);
    x.fillStyle="#9aa8b8";x.beginPath();x.roundRect(X+W*0.52,Y+th*1.2,14,26,3);x.fill();}
  person(x,X+W*0.28,Y+H*0.85,key==="ashen"?"#6a4a3a":key==="capital"?"#3a5ad0":"#2f5a5a");
  const v=x.createRadialGradient(X+W/2,Y+H/2,H*0.3,X+W/2,Y+H/2,W*0.6);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,0.5)");x.fillStyle=v;x.fillRect(X,Y,W,H);
  x.restore();x.strokeStyle=GOLD;x.lineWidth=1.5;x.beginPath();x.roundRect(X,Y,W,H,6);x.stroke();
  x.fillStyle="rgba(20,18,30,0.8)";x.beginPath();x.roundRect(X+8,Y+8,62,20,10);x.fill();x.strokeStyle=GOLD;x.lineWidth=1;x.stroke();x.fillStyle=CREAM;x.font=`bold 11px ${FONT}`;x.fillText("◆ 古碑",X+16,Y+22);}
function quillWait(x,X,Y,T){ // 等待：羽毛筆＋羊皮紙，墨色與封蠟依區域
  x.fillStyle="#e9d6a8";x.beginPath();x.roundRect(X,Y,58,40,4);x.fill();x.strokeStyle="rgba(120,80,40,0.5)";x.lineWidth=1;x.stroke();
  x.strokeStyle=T.ink;x.lineWidth=1.3;x.beginPath();for(let i=0;i<=14;i++){const s=i/14;i?x.lineTo(X+6+s*34,Y+14+Math.sin(s*14)*1.3):x.moveTo(X+6,Y+14);}x.stroke();
  x.beginPath();for(let i=0;i<=8;i++){const s=i/8;i?x.lineTo(X+6+s*20,Y+24+Math.sin(s*12)*1.3):x.moveTo(X+6,Y+24);}x.stroke();
  x.fillStyle=T.seal;x.beginPath();x.arc(X+48,Y+31,6,0,TAU);x.fill();x.fillStyle="rgba(255,255,255,0.35)";x.beginPath();x.arc(X+46,Y+29,2,0,TAU);x.fill();
  if(T.corner==="rivet"){for(let i=0;i<4;i++){x.fillStyle="#ffb030";x.beginPath();x.arc(X+40+i*5,Y+6-i*3,1.2,0,TAU);x.fill();}}
  if(T.corner==="filigree"){const g=x.createRadialGradient(X+30,Y+20,0,X+30,Y+20,34);g.addColorStop(0,"rgba(168,152,255,0.25)");g.addColorStop(1,"rgba(168,152,255,0)");x.fillStyle=g;x.fillRect(X-6,Y-6,70,52);}
  x.save();x.translate(X+38,Y+24);x.rotate(-0.7);x.fillStyle="#f2f0e8";x.strokeStyle="#1c1712";x.lineWidth=0.7;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-5,-14,-2,-26);x.quadraticCurveTo(5,-14,0,0);x.fill();x.stroke();x.restore();}
const r=document.getElementById("r");
["cloud","ashen","capital"].forEach(key=>{const T=THEMES[key];const col=document.createElement("div");col.className="col";
  const [c,x]=cv(404,500);x.fillStyle="#0e1018";x.fillRect(0,0,404,500);
  // 頂部：主角卡＋區名牌
  frame(x,8,8,196,62,T);face(x,16,14,48,T);x.fillStyle=CREAM;x.font=`bold 12px ${FONT}`;x.fillText("冒險者",72,26);bar(x,72,32,120,0.8,"#d04a3a");bar(x,72,44,120,0.6,"#3a7ad0");bar(x,72,56,120,0.9,"#c8a030");
  plaque(x,214,14,182,36,T.name.split("（")[0],T);x.fillStyle="#b8ab96";x.font=`11px ${FONT}`;x.fillText(T.name.match(/（(.*)）/)[1],222,64);
  // 事件卡
  frame(x,8,80,388,300,T);eventArt(x,18,90,368,150,key,T);
  x.fillStyle=NAVY2;x.beginPath();x.roundRect(18,248,368,56,6);x.fill();x.strokeStyle="#3a3a5a";x.lineWidth=1;x.stroke();
  face(x,26,254,40,{accent:"#a898ff"});x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("說書人",74,268);x.fillStyle=CREAM;x.font=`12.5px ${FONT}`;x.fillText(T.lines,74,288);
  quillWait(x,322,256,T);
  ["查看四周","說服","戰鬥","放棄"].forEach((s,i)=>{x.fillStyle="#262a3a";x.beginPath();x.roundRect(18+i*92,316,86,28,6);x.fill();x.strokeStyle="#3a4060";x.stroke();x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText(s,40+i*92,334);});
  x.fillStyle="#9a8e7c";x.font=`11px ${FONT}`;x.fillText("按鈕、字型、深藍底：三區相同（全域層）",18,368);
  // 下：功能列
  frame(x,40,392,324,46,T);["包","技","花","卷","影","話"].forEach((s,i)=>{x.fillStyle="#262a3a";x.beginPath();x.roundRect(52+i*52,400,40,30,6);x.fill();x.strokeStyle=GOLD;x.lineWidth=1;x.stroke();x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText(s,66+i*52,420);});
  col.appendChild(c);
  const p=document.createElement("div");p.className="cap";p.innerHTML=`<b>${T.name}</b><br>四角飾件、標題牌材質、頭像框色：區域色 ${T.accent}<br>事件插圖背景：${T.art}<br>等待（羽毛筆羊皮紙）：${T.wait}`;col.appendChild(p);r.appendChild(col);});
</script></body></html>
