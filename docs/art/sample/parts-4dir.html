<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>部件四方向</title>
<style>
  body{margin:0;padding:14px 18px;background:#14161f;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;width:1280px}
  h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;color:#e8bb48;margin:18px 0 6px}
  .note{color:#b8ab96;font-size:13px;margin:0 0 8px;line-height:1.55}
  canvas{display:block;border-radius:6px;background:#2a2e40}
</style></head>
<body>
<h1>Q 版部件 × 四方向（正面、背面、朝東、朝西）</h1>
<p class="note">美術 PM，2026-11-04 晚。使用者原話：「我快哭了 這頭髮還要我講」「還有其他物件都要考慮4面」。每個部件四面分別畫，不拿正面左右照抄：側面是側臉（前半臉、後半頭髮、後腦露耳），長髮只在耳後；帽子、配件轉成側面；背面看不到臉前的東西。人物放大到戰場約 3 倍。對照表見 <code>docs/art/部件四方向清單.md</code>。</p>
<div id="secs"></div>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script><script src="fx.js"></script><script src="realms.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="anim.js"></script>
<script>
const Q=QDoll,R=RaceArt.RACES,IT=PaperDoll.ITEMS,FONT="'Noto Sans TC','Microsoft JhengHei',sans-serif";
const V=[["front",false,"正面"],["back",false,"背面"],["side",false,"朝東"],["side",true,"朝西"]];
const BASE={skin:"#f1c9a5",hair:"short",hairColor:"#6a3d1e"},SHIRT={body:{kind:"shirt",color:"#4f7fbf"},feet:{kind:"boots",material:"leather"}};
// 每一節：[標題, [[列名, unit], ...], 放大倍數]
const SECTIONS=window.SECTIONS||[];
function section(title,rows,K=3.2,note=""){const d=document.getElementById("secs");const h=document.createElement("h2");h.textContent=title;d.appendChild(h);if(note){const p=document.createElement("p");p.className="note";p.textContent=note;d.appendChild(p);}
  const per=Math.min(rows.length,2),RH=Math.round(66*K),W=1240,c=document.createElement("canvas");const nrow=Math.ceil(rows.length/per),H=nrow*RH+6;c.width=W*2;c.height=H*2;c.style.width=W+"px";c.style.height=H+"px";d.appendChild(c);const x=c.getContext("2d");x.scale(2,2);
  rows.forEach(([zh,u],i)=>{const col=i%per,row=Math.floor(i/per),x0=col*(W/per),y0=row*RH;x.fillStyle=(row+col)%2?"#262a3a":"#2e3346";x.fillRect(x0,y0,W/per,RH);x.fillStyle="#e8bb48";x.font=`13px ${FONT}`;x.textAlign="left";x.fillText(zh,x0+8,y0+18);
    V.forEach(([v,w,t],j)=>{const cx=x0+70+j*(W/per-80)/4+20,fy=y0+RH-22;Q.stamp(x,u,v,cx,fy,K,w);x.fillStyle="#8a8070";x.font=`10px ${FONT}`;x.textAlign="center";x.fillText(t,cx,y0+RH-5);x.textAlign="left";});});}
const HAIRS=[["短髮","short"],["長髮","long"],["齊肩","bob"],["馬尾","ponytail"],["雙馬尾","twin"],["刺蝟","spiky"],["髮髻","bun"],["光頭","none"]];
section("1. 髮型 × 四方向",HAIRS.map(([zh,h])=>[zh,{look:{...BASE,hair:h,hairColor:h==="long"?"#c8c0b0":BASE.hairColor},gear:SHIRT}]),3.2,"側面：頭髮蓋頭頂與後半顆頭，前半是臉（一隻眼、鼻尖、腮紅），短髮在後腦露出耳朵；長髮、齊肩蓋住耳朵、只垂在後側；馬尾、雙馬尾、髮髻在後腦。");
const HATS=[["兜帽","hood",{color:"#3f6a32"}],["頭盔","helmet",{material:"steel"}],["角盔","horned_helm",{material:"iron"}],["巫師帽","wizard_hat",{color:"#5a3fa0"}],["便帽","cap",{color:"#6a4a2e"}],["頭巾","bandana",{color:"#b33a3a"}],["頭冠","circlet",{material:"gold"}],["寬帽","wide_hat",{color:"#8a6a3a"}],["面紗","veil",{color:"#d8d0c0"}],["護目鏡","goggles",{}],["王冠","crown",{material:"gold"}],["全罩盔","greathelm",{material:"steel"}]];
section("2. 頭飾 × 四方向",HATS.map(([zh,k,m])=>[zh,{look:{...BASE,hair:k==="hood"?"long":"short"},gear:{...SHIRT,head:{slot:"head",kind:k,...m}}}]),3.2,"側面：帽簷、帽舌、寶石、鏡片、面紗都在臉前那一側；頭巾的結、兜帽的垂片在後腦。背面：看不到帽舌、寶石、鏡片、面紗，只看到帽子後面、結、帶子。");
window.section=section;
</script>
<script src="parts-extra.js"></script>
</body></html>
