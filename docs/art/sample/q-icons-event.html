<script>
const { h } = OB, Q = QIcons, QP = QIconsParts, QH = QIconsHud, QE = QIconsEvent, QL = window.QEventLive, NL = String.fromCharCode(10), TAU = Math.PI * 2;

const nn = (c, px, k) => { c.style.width = c.style.height = px * k + "px"; c.style.imageRendering = "pixelated"; return c; };
const nnWH = (c, w, hh, k) => { c.style.width = w * k + "px"; c.style.height = hh * k + "px"; c.style.imageRendering = "pixelated"; return c; };

const L = QE.list(), BY = Object.fromEntries(L.map((e) => [e.id, e]));
/** 小牌一格：深色膠囊底上的圖示，邊長 BOX（13 的圖示四周留 2）。 */
const BOX = 17, PILL_BG = "#1d1915";

// ---------------------------------------------------------------- 現行（遊戲端原始程式）
/** 現行的 canvas：顯示 px×zoom；zoom 1 時 2 倍內部解析度（遊戲的 DPR 2），放大時直接畫到該倍率（向量），res 1＝真 1 倍。 */

const cvPx = (id, px) => (BY[id].grp === "badge" ? BOX : px);
/** 現行的底：事件卡面板（圓環圖示、d20）、插圖小牌的深色膠囊。 */

  const counts = { new: L.filter((e) => !e.src).length, reuse: L.filter((e) => e.src).length };
  if (PART === "all") root.append(h("h1", {}, "小圖示改 Q 版：第 8 批事件卡（現行在左、Q 版在右）"),
    h("p.note", {}, `畫圖 agent，2026-11-12。遊戲端事件卡的圖示照實盤點（紀錄第 1 節）：這頁 ${L.length} 個（新畫 ${counts.new}、沿用 ${counts.reuse}）。框照現行（事件卡深底圓＋選項色圓環、插圖小牌的深色膠囊；d20 沒有框），只換裡面的圖。`));

    root.append(h("h2", {}, "d20：六種顏色 × 64／24／20／16", h("small", {}, "　64 是判定結果的兩顆骰（寫點數；自然 20 金、自然 1 灰，其他照結果色）；24 DC、20 結果列、16 擲骰鈕都是一般色。顏色照現行 D20_COLOR、OUTCOME_COLOR")),
      h("div", { style: "display:flex;flex-direction:column;gap:6px" }, side(false), side(true)));
  }

    root.append(h("h2", {}, "事件插圖左上角的小牌：現行｜Q 版（只換小牌的圖示；泡泡、場景照現行）", h("small", {}, view === "art" ? `　插圖顯示寬 ${w}（卡寬 min(460, 46%)），2 倍內部解析度；小牌一角的放大在 &view=crop` : `　小牌一角（插圖顯示寬 ${w}）：上 2 倍內部解析度 ×1.5、下真 1 倍 ×3，最近鄰放大`)),
      h("div", { style: "display:grid;grid-template-columns:repeat(" + (view === "crop" ? 1 : 2) + ",max-content);gap:8px" }, ids.slice(Number(OB.param("from", "0")), Number(OB.param("from", "0")) + Number(OB.param("n", "99"))).map((id) => {
        const scale = w / QL.EVENT_ART_W, cw = Math.round(120 * scale), ch = Math.round(28 * scale);

        if (view === "crop") return h("div", { style: "background:#201d24;border:1px solid #3a3440;border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px" }, h("b", { style: "font-size:12px;color:#e8cf90" }, QL.SCENES[id].zh + "（" + QL.SCENES[id].icon + "）"), h("div", { style: "display:flex;gap:10px;align-items:flex-start" }, h("div", {}, h("div", { style: "font-size:11px;color:#8a7e6c" }, "現行"), pair(false)), h("div", {}, h("div", { style: "font-size:11px;color:#c8bcff" }, "Q 版"), pair(true))));
