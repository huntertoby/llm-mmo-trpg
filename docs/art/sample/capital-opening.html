<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>主城開場</title>
<style>
  body{margin:0;padding:14px 18px;background:#101218;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;width:1250px}
  h1{font-size:19px;margin:0 0 4px}.note{color:#b8ab96;font-size:13px;margin:0 0 10px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cap{font-size:12.5px;color:#d8ccb6;line-height:1.55;margin:6px 2px 0}.cap b{color:#e8bb48}
  canvas{display:block;border-radius:6px}
</style></head>
<body>
<h1>主城開場（#125）：四格分鏡（RT-5 樣張，第 2 版）</h1>
<p class="note">美術 PM，2026-11-04。第 1 版有幾何占位（橢圓浮島、膠囊人、色塊房子），照品質底線重畫：主城用城鎮圖庫的白石地磚、傳送陣、區旗、白石建築；人物用 C 墨線紙娃娃；說書人頭像用 portrait；大世界圖用第 2 版畫法；霧渡鎮用可走動樣張的霧渡鎮。文案照玩法 PM 定稿。全部程式繪製。</p>
<div class="grid" id="g"></div>
<script src="raceArt.js"></script>
<script src="paperdoll.js"></script>
<script src="storyDoll.js"></script>
<script src="portraits.js"></script>
<script src="realms.js"></script>
<script src="enemyArt.js"></script>
<script src="explore.js"></script>
<script src="hud.js"></script>
<script src="regions4.js"></script>
<script src="cloudTiles.js"></script>
<script src="ashenTiles.js"></script>
<script src="townTiles.js"></script>
<script src="regionArt.js"></script>
<script src="worldPaintedArt.js"></script>
<script>
const E=Explore,TT=TownTiles,T=52,TAU=Math.PI*2,SK=E.SKIN;
const FONT="'Noto Sans TC','Microsoft JhengHei',sans-serif",SERIF="'Noto Serif TC','PMingLiU',serif";
const NAVY="#1e2236",NAVY2="#161a2a",GOLD="#c8a868",GOLD2="#e8bb48",CREAM="#f2e6c8",VIO="#a898ff";
const PW=600,PH=360,K=PW/(20*T); // 每格畫 20×12 格，縮到 600×360
function panel(draw){const c=document.createElement("canvas");c.width=PW*2;c.height=PH*2;c.style.width=PW+"px";c.style.height=PH+"px";const x=c.getContext("2d");x.scale(2,2);x.save();x.scale(K,K);draw(x);x.restore();return [c,x];}
function glow(x,cx,cy,r,col,a=1){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.save();x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill();x.restore();}
function fil(x,X,Y,sx,sy,acc=VIO){x.save();x.translate(X,Y);x.scale(sx,sy);x.strokeStyle=GOLD2;x.lineWidth=1.4;x.beginPath();x.moveTo(0,14);x.quadraticCurveTo(0,0,14,0);x.stroke();x.fillStyle=acc;x.beginPath();x.moveTo(6,2);x.lineTo(9,6);x.lineTo(6,10);x.lineTo(3,6);x.closePath();x.fill();x.restore();}
function cloudC(x,X,Y,sx,sy){x.save();x.translate(X,Y);x.scale(sx,sy);x.strokeStyle="#6aa84a";x.lineWidth=1.4;x.beginPath();x.arc(9,9,5,Math.PI,TAU*0.95);x.stroke();x.beginPath();x.arc(16,5,3.5,Math.PI,TAU);x.stroke();x.fillStyle="#b8432f";x.beginPath();x.arc(4,4,2.2,0,TAU);x.fill();x.restore();}
function border(x,corner=fil){x.strokeStyle=GOLD;x.lineWidth=1.6;x.beginPath();x.roundRect(1,1,PW-2,PH-2,6);x.stroke();corner(x,3,3,1,1);corner(x,PW-3,3,-1,1);corner(x,3,PH-3,1,-1);corner(x,PW-3,PH-3,-1,-1);}
function plaqueLoc(x,X,Y,t,acc=VIO){x.fillStyle="rgba(16,18,34,0.9)";x.beginPath();x.roundRect(X,Y,t.length*13+26,24,5);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.1;x.stroke();x.strokeStyle=acc;x.globalAlpha=0.6;x.beginPath();x.roundRect(X+3,Y+3,t.length*13+20,18,3);x.stroke();x.globalAlpha=1;x.fillStyle=CREAM;x.font=`bold 13px ${SERIF}`;x.fillText(t,X+13,Y+17);}
const NARR={look:{skin:"#e8c8a8",hair:"none",beard:true,hairColor:"#d8d0c0"},gear:{body:{kind:"robe",color:"#4a3a5a",trim:"#e8bb48"},head:{kind:"hood",color:"#3a2e48"}}};
Portraits.REGION.hub=["#a898ff","#22284a","#7a7ab0"];
function narrCard(x,X,Y,W,lines){x.fillStyle="rgba(30,34,54,0.95)";x.beginPath();x.roundRect(X,Y,W,64,8);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.4;x.stroke();fil(x,X+2,Y+2,1,1);fil(x,X+W-2,Y+2,-1,1);
  Portraits.portrait(x,X+8,Y+8,48,["narrator","說書人","","hub",NARR.look,NARR.gear,[]]);x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("說書人",X+64,Y+20);x.fillStyle=CREAM;x.font=`12.5px ${FONT}`;lines.forEach((t,i)=>x.fillText(t,X+64,Y+38+i*17));}
const HERO=E.PARTY[0];
function plazaArea(c,w,h){for(let gy=0;gy<h;gy++)for(let gx=0;gx<w;gx++)TT.plaza(c,gx,gy);}
function cloudEdge(c,y0){const r=RegionArt.rng(7);for(let i=0;i<30;i++){const cx=i*38+r()*20,cy=y0+r()*30;const g=c.createRadialGradient(cx,cy-6,4,cx,cy,36);g.addColorStop(0,"rgba(255,255,255,0.95)");g.addColorStop(1,"rgba(214,222,238,0.85)");c.fillStyle=g;c.beginPath();c.ellipse(cx,cy,40,20,0,0,TAU);c.fill();}}
function brokenBridge(c,x0,y0,dx,dy,len){ // 斷在雲上的木板浮橋（只畫外觀）：木板、兩側繩索與繩柱、斷口垂繩
  const px=(i)=>x0+dx*i*T*0.5, py=(i)=>y0+dy*i*T*0.5, nx=dy?1:0, ny=dx?1:0; // 法線方向（橋寬）
  for(let i=0;i<len;i++){if(i>=len-2&&i%2===1)continue;const w=dx?T*0.46:T*0.9,h=dx?T*0.9:T*0.46;c.fillStyle=i%2?"#a07040":"#8a5a30";c.fillRect(px(i)-w/2,py(i)-h/2,w,h);c.strokeStyle="#4a2e18";c.lineWidth=1.2;c.strokeRect(px(i)-w/2,py(i)-h/2,w,h);}
  for(const s of [-1,1]){const off=s*T*0.42;c.strokeStyle="#6a4a2a";c.lineWidth=2.2;c.beginPath();c.moveTo(px(0)+nx*off,py(0)+ny*off);c.lineTo(px(len-1)+nx*off,py(len-1)+ny*off);c.stroke();
    for(let i=0;i<len;i+=2){c.fillStyle="#5a3e28";c.fillRect(px(i)+nx*off-3,py(i)+ny*off-3,6,6);}}
  const ex=px(len-1),ey=py(len-1);for(const s of [-1,1]){const off=s*T*0.42;c.strokeStyle="#6a4a2a";c.lineWidth=2;c.beginPath();c.moveTo(ex+nx*off,ey+ny*off);c.quadraticCurveTo(ex+nx*off+dx*18,ey+ny*off+dy*18+22,ex+nx*off+dx*10,ey+ny*off+dy*10+40);c.stroke();}}
const panels=[];
// ① 醒來
panels.push([()=>{const [c,x]=panel(c=>{plazaArea(c,20,12);
    ["crystal_crown","cloud_ridge","arcane_hub","ashen_waste","frost_tide"].forEach((r,k)=>TT.banner(c,[3,6,13,16,9.5][k]*T,[3,1.6,1.6,3,0.6][k]*T,r));
    TT.portalPlaza(c,8.5,3.2);glow(c,10*T,4.8*T,170,"rgba(168,152,255,0.55)");
    // 主角在光圈裡半坐起（紙娃娃側躺後抬起上身）
    c.fillStyle="rgba(0,0,0,0.28)";c.beginPath();c.ellipse(10*T+14,6.05*T,62,16,0,0,TAU);c.fill();
    c.save();c.translate(10*T-36,6*T-6);c.rotate(1.5);StoryDoll.stamp(c,{look:HERO[0],gear:HERO[1]},"side",0,0,2.4,false);c.restore();
    const v=c.createRadialGradient(10*T,4*T,180,10*T,4*T,640);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(10,12,30,0.65)");c.fillStyle=v;c.fillRect(0,0,20*T,12*T);});
  plaqueLoc(x,14,12,"樞島・中央廣場");narrCard(x,14,PH-128,PW-28,["傳送陣的光暗了下去。你在樞島中央醒來，晶柱還在低鳴。","五座浮橋斷在雲上，各自指向一個界域。"]);
  x.fillStyle="#3a5ad0";x.beginPath();x.roundRect(PW-132,PH-54,112,32,7);x.fill();x.strokeStyle="#ffe08a";x.lineWidth=1.6;x.stroke();x.fillStyle="#fff";x.font=`bold 13px ${FONT}`;x.fillText("站起來",PW-97,PH-33);border(x);return c;},
 "<b>① 醒來（事件插圖新場景 awaken）</b>：主城白石地磚、五光圈傳送陣、五面區旗（城鎮圖庫畫法）；主角是玩家自己的紙娃娃，躺在光圈旁正要醒來（正式版做成躺→半坐起的兩格動作）。說書人卡用 hub 主題與說書人頭像，只有「站起來」。"]);
// ② 廣場與浮橋＋守印人
panels.push([()=>{const [c,x]=panel(c=>{c.fillStyle="#c8d4e8";c.fillRect(0,0,20*T,12*T);cloudEdge(c,-10);cloudEdge(c,11*T);
    for(let gy=1;gy<11;gy++)for(let gx=3;gx<17;gx++)TT.plaza(c,gx,gy);
    TT.stoneHall(c,7,0,6,3,{door:3,windows:[1.2,4.8],sign:"scroll",spire:true});
    TT.portalPlaza(c,8.5,4.6);
    brokenBridge(c,2.8*T,6*T,-1,0,6);brokenBridge(c,17.2*T,6*T,1,0,6);brokenBridge(c,6*T,10.8*T,0,1,4);brokenBridge(c,14*T,10.8*T,0,1,4);
    E.person(c,10,8.4,...HERO,"north","#5aa0ff");
    E.person(c,12,7.4,{skin:SK[1],hair:"long",hairColor:"#d8d0c0",beard:true},{body:{kind:"robe",color:"#3a3a6a",trim:"#e8bb48"},head:{kind:"hood",color:"#2a2a4a"},main_hand:{kind:"staff",material:"crystal"}},"west",null);
    E.bubble(c,12*T+T/2,7.4*T+T*0.82-52,"bang","quest");});
  // 橋頭石碑的小牌
  const S=[[8,206,"雲嶺","",true,"#6aa84a"],[PW-108,206,"魔導樞市","之後的賽季",false],[196,PH-58,"灰燼荒原","尚未開放",false],[436,PH-58,"霜潮海境","之後的賽季",false]];
  S.forEach(([X,Y,n,lab,open,col])=>{x.fillStyle="rgba(16,18,34,0.9)";x.beginPath();x.roundRect(X,Y,96,lab?36:22,5);x.fill();x.strokeStyle=open?col:"#6a6a78";x.lineWidth=1.2;x.stroke();x.fillStyle=open?CREAM:"#a0a0aa";x.font=`bold 11.5px ${FONT}`;x.fillText(n,X+8,Y+15);
    if(lab){x.font=`10.5px ${FONT}`;x.fillText("🔒 "+lab,X+8,Y+30);}});
  x.fillStyle="rgba(242,236,224,0.97)";x.beginPath();x.roundRect(PW-270,128,250,48,8);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.2;x.stroke();x.fillStyle="#1c1712";x.font=`bold 11px ${FONT}`;x.fillText("守印人",PW-260,144);x.font=`12px ${FONT}`;x.fillText("新來的？雲嶺那邊缺人手。站上傳送陣，",PW-260,160);x.fillText("去霧渡鎮找渡婆婆。",PW-260,174);
  x.fillStyle="rgba(16,18,34,0.9)";x.beginPath();x.roundRect(14,14,170,44,6);x.fill();x.strokeStyle=GOLD;x.stroke();x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("任務",24,30);x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText("到霧渡鎮找渡婆婆",24,50);
  border(x);return c;},
 "<b>② 廣場與浮橋</b>：四周是雲，浮橋外端斷在雲上（缺木板、垂斷繩）；橋頭石碑小牌：雲嶺亮、荒原「尚未開放」、其他三區「之後的賽季」。守印人（G7 會給的紙娃娃外觀：兜帽長袍、晶杖）頭上「！」，說定稿的第一個指示，任務欄出現。"]);
// ③ 第一次打開大世界圖
panels.push([()=>{const c=document.createElement("canvas");c.width=PW*2;c.height=PH*2;c.style.width=PW+"px";c.style.height=PH+"px";const x=c.getContext("2d");
  const bg=document.createElement("canvas");WorldPaintedArt.drawBackdrop(bg,900);x.drawImage(bg,0,0,PW*2,PW*2*bg.height/bg.width);x.scale(2,2);
  const sx=PW/1280,sy=sx;const isl=WorldPaintedArt.ISLANDS;
  const cl=isl.find(i=>i.id==="cloud_ridge"),cp=isl.find(i=>i.id==="capital");
  glow(x,cl.x*sx,(cl.y+cl.ry*1.6)*sy,70,"rgba(255,224,138,0.5)");
  x.fillStyle="#3a5ad0";x.beginPath();x.roundRect(cl.x*sx-74,(cl.y+cl.ry*1.5)*sy,148,26,13);x.fill();x.strokeStyle="#ffe08a";x.lineWidth=2;x.stroke();x.fillStyle="#fff";x.font=`bold 12px ${FONT}`;x.textAlign="center";x.fillText("◆ 傳送到霧渡鎮（免費）",cl.x*sx,(cl.y+cl.ry*1.5)*sy+17);
  x.fillStyle="rgba(16,18,34,0.9)";x.beginPath();x.roundRect(cp.x*sx-40,(cp.y+cp.ry*1.25)*sy,80,20,5);x.fill();x.strokeStyle=GOLD;x.lineWidth=1;x.stroke();x.fillStyle=CREAM;x.font=`11px ${FONT}`;x.fillText("你在樞島",cp.x*sx,(cp.y+cp.ry*1.25)*sy+14);x.textAlign="left";
  x.fillStyle="rgba(16,18,34,0.85)";x.beginPath();x.roundRect(14,12,200,24,5);x.fill();x.fillStyle="#d8ccb6";x.font=`11px ${FONT}`;x.fillText("五座島依序從雲裡浮起（只播一次）",24,28);
  border(x);return c;},
 "<b>③ 第一次打開大世界圖</b>：用大世界圖第 2 版的畫法（同首頁）。五座島依序從雲裡浮起，每座 0.3 秒，只播一次；雲嶺的傳送鈕發金光、寫「免費」（還沒到過霧渡鎮時）。減少動態時直接顯示。"]);
// ④ 抵達霧渡鎮
panels.push([()=>{const [c,x]=panel(c=>{E.town(c,()=>{});});
  x.fillStyle="rgba(16,18,34,0.92)";x.beginPath();x.roundRect(PW/2-90,10,180,28,6);x.fill();x.strokeStyle="#6aa84a";x.lineWidth=1.3;x.stroke();x.fillStyle=CREAM;x.font=`bold 14px ${SERIF}`;x.textAlign="center";x.fillText("雲嶺・霧渡鎮",PW/2,30);x.textAlign="left";
  x.fillStyle="rgba(16,18,34,0.9)";x.beginPath();x.roundRect(14,PH-58,250,44,6);x.fill();x.strokeStyle=GOLD;x.lineWidth=1;x.stroke();x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("任務更新",24,PH-41);x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText("渡婆婆在鎮上，頭上有「！」",24,PH-23);
  border(x,cloudC);return c;},
 "<b>④ 抵達霧渡鎮</b>：用可走動樣張的霧渡鎮；地名牌與四角點綴換成雲嶺（RT-1 的主題切換，淡入 0.3 秒），任務欄更新；接上雲嶺新手任務鏈，從這裡起才有東方風。"]);
const g=document.getElementById("g");panels.forEach(([fn,cap])=>{const d=document.createElement("div");d.appendChild(fn());const p=document.createElement("div");p.className="cap";p.innerHTML=cap;d.appendChild(p);g.appendChild(d);});
</script></body></html>
