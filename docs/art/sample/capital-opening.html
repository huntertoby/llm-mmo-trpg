<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>主城開場</title>
<style>
  body{margin:0;padding:14px 18px;background:#101218;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;width:1250px}
  h1{font-size:19px;margin:0 0 4px}.note{color:#b8ab96;font-size:13px;margin:0 0 10px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

<body>
<h1>主城開場（#125）：四格分鏡（RT-5 樣張）</h1>
<p class="note">美術 PM，2026-11-04。新角色在樞島中央廣場醒來 → 看到五座浮橋與橋頭石碑 → 守印人給第一個指示 → 第一次打開大世界圖、免費傳送到霧渡鎮。全程 1～2 分鐘，沒有戰鬥。主城用 hub／capital 主題（深藍、金、晶紫）；到霧渡鎮後點綴換成雲嶺。說書語氣：中性奇幻城邦，清楚、略帶莊重。全部程式繪製，示意用。</p>
<div class="grid" id="g"></div>
<script>
const TAU=Math.PI*2,FONT="'Noto Sans TC','Microsoft JhengHei',sans-serif",SERIF="'Noto Serif TC','PMingLiU',serif";
const NAVY="#1e2236",NAVY2="#161a2a",GOLD="#c8a868",GOLD2="#e8bb48",CREAM="#f2e6c8",VIO="#a898ff";
const REG=[["晶冠城邦","#8ab0ff",false,"之後的賽季"],["雲嶺","#6aa84a",true,""],["魔導樞市","#4ad0c8",false,"之後的賽季"],["灰燼荒原","#ff6a1a",false,"尚未開放"],["霜潮海境","#6ac0e8",false,"之後的賽季"]];
function cv(w,h){const c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.style.width=w+"px";c.style.height=h+"px";const x=c.getContext("2d");x.scale(2,2);return[c,x];}
function glow(x,cx,cy,r,col,a=1){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.save();x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill();x.restore();}
function filigree(x,X,Y,sx,sy,acc=VIO){x.save();x.translate(X,Y);x.scale(sx,sy);x.strokeStyle=GOLD2;x.lineWidth=1.5;x.beginPath();x.moveTo(0,16);x.quadraticCurveTo(0,0,16,0);x.stroke();x.fillStyle=acc;x.beginPath();x.moveTo(7,2);x.lineTo(10,7);x.lineTo(7,12);x.lineTo(4,7);x.closePath();x.fill();x.restore();}
function cloudCorner(x,X,Y,sx,sy){x.save();x.translate(X,Y);x.scale(sx,sy);x.strokeStyle="#6aa84a";x.lineWidth=1.5;x.beginPath();x.arc(10,10,6,Math.PI,TAU*0.95);x.stroke();x.beginPath();x.arc(18,6,4,Math.PI,TAU);x.stroke();x.fillStyle="#b8432f";x.beginPath();x.arc(4,4,2.5,0,TAU);x.fill();x.restore();}
function frame(x,X,Y,W,H,corner=filigree,fill=true){x.fillStyle=NAVY;x.beginPath();x.roundRect(X,Y,W,H,8);if(fill)x.fill();x.strokeStyle=GOLD;x.lineWidth=1.5;x.stroke();corner(x,X+2,Y+2,1,1);corner(x,X+W-2,Y+2,-1,1);corner(x,X+2,Y+H-2,1,-1);corner(x,X+W-2,Y+H-2,-1,-1);}
function stone(x,X,Y,W,H,T=26){for(let i=0;i*T<W;i++)for(let j=0;j*T<H;j++){x.fillStyle=(i+j)%2?"#d8d2c4":"#cfc8b8";x.fillRect(X+i*T,Y+j*T,T,T);x.strokeStyle="rgba(120,110,90,0.25)";x.lineWidth=0.6;x.strokeRect(X+i*T,Y+j*T,T,T);
  if(((i*7+j*13)%12)===0){x.strokeStyle="rgba(200,168,104,0.45)";x.beginPath();x.moveTo(X+i*T+T/2,Y+j*T+4);x.lineTo(X+i*T+T-4,Y+j*T+T/2);x.lineTo(X+i*T+T/2,Y+j*T+T-4);x.lineTo(X+i*T+4,Y+j*T+T/2);x.closePath();x.stroke();}}}
function portal(x,cx,cy,r,lit=1){x.save();x.translate(cx,cy);x.scale(1,0.5);glow(x,0,0,r*1.5,"rgba(168,152,255,0.55)",lit);x.strokeStyle=GOLD2;x.lineWidth=2.5;x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();
  REG.forEach(([,c,open],i)=>{const a=-Math.PI/2+i*TAU/5;x.fillStyle=open?c:"#8a8a90";x.globalAlpha=open?1:0.6;x.beginPath();x.arc(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72,r*0.16,0,TAU);x.fill();x.globalAlpha=1;});x.restore();
  glow(x,cx,cy-20,24,"rgba(200,190,255,0.8)",lit);x.fillStyle="#c8bcff";x.beginPath();x.moveTo(cx,cy-46);x.lineTo(cx+8,cy-22);x.lineTo(cx,cy-2);x.lineTo(cx-8,cy-22);x.closePath();x.fill();x.strokeStyle="#f2eaff";x.lineWidth=1;x.stroke();}
function hero(x,X,Y,pose){x.strokeStyle="#2b1e16";x.lineWidth=1.1;
  if(pose==="sit"){x.fillStyle="rgba(0,0,0,0.2)";x.beginPath();x.ellipse(X,Y+2,16,4,0,0,TAU);x.fill();x.fillStyle="#2f5a5a";x.beginPath();x.roundRect(X-14,Y-6,22,8,3);x.fill();x.stroke();
    x.beginPath();x.roundRect(X-4,Y-20,10,15,3);x.fill();x.stroke();x.fillStyle="#f1c9a5";x.beginPath();x.arc(X+2,Y-25,6,0,TAU);x.fill();x.stroke();x.fillStyle="#3a2414";x.beginPath();x.arc(X+2,Y-28,6,Math.PI,TAU);x.fill();
    x.strokeStyle="#f1c9a5";x.lineWidth=2.5;x.beginPath();x.moveTo(X+5,Y-14);x.lineTo(X+12,Y-6);x.stroke();}
  else{x.fillStyle="rgba(0,0,0,0.2)";x.beginPath();x.ellipse(X,Y+2,8,3,0,0,TAU);x.fill();x.fillStyle="#2f5a5a";x.beginPath();x.roundRect(X-5,Y-16,10,15,3);x.fill();x.stroke();x.fillStyle="#f1c9a5";x.beginPath();x.arc(X,Y-21,5.5,0,TAU);x.fill();x.stroke();x.fillStyle="#3a2414";x.beginPath();x.arc(X,Y-24,5.5,Math.PI,TAU);x.fill();}}
function npcFig(x,X,Y,body,hood){x.fillStyle="rgba(0,0,0,0.2)";x.beginPath();x.ellipse(X,Y+2,8,3,0,0,TAU);x.fill();x.fillStyle=body;x.strokeStyle="#2b1e16";x.lineWidth=1.1;x.beginPath();x.moveTo(X-7,Y);x.lineTo(X-4,Y-18);x.lineTo(X+4,Y-18);x.lineTo(X+7,Y);x.closePath();x.fill();x.stroke();
  x.fillStyle="#e8c8a8";x.beginPath();x.arc(X,Y-22,5,0,TAU);x.fill();x.stroke();if(hood){x.fillStyle=hood;x.beginPath();x.arc(X,Y-23,6.5,Math.PI*0.9,TAU*1.05);x.fill();}}
function mark(x,X,Y,ch="!",col=GOLD2){x.fillStyle=col;x.beginPath();x.roundRect(X-7,Y-9,14,16,4);x.fill();x.strokeStyle="#2b1e16";x.lineWidth=1;x.stroke();x.fillStyle="#1c1712";x.font=`bold 12px ${FONT}`;x.textAlign="center";x.fillText(ch,X,Y+3);x.textAlign="left";}
function narr(x,X,Y,W,text,corner=filigree){frame(x,X,Y,W,62,corner);x.fillStyle=NAVY2;x.beginPath();x.arc(X+30,Y+31,20,0,TAU);x.fill();x.strokeStyle=VIO;x.lineWidth=2;x.stroke();
  x.fillStyle="#3a2e48";x.beginPath();x.arc(X+30,Y+29,13,Math.PI*0.85,TAU*1.07);x.fill();x.fillStyle="#e8c8a8";x.beginPath();x.arc(X+30,Y+33,7,0,TAU);x.fill();x.fillStyle="#d8d0c0";x.beginPath();x.ellipse(X+30,Y+39,5,3,0,0,TAU);x.fill();
  x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("說書人",X+58,Y+20);x.fillStyle=CREAM;x.font=`12.5px ${FONT}`;const L=text.split("|");L.forEach((t,i)=>x.fillText(t,X+58,Y+38+i*17));}
function banner(x,X,Y,c){x.strokeStyle="#5a4a3a";x.lineWidth=1.5;x.beginPath();x.moveTo(X,Y);x.lineTo(X,Y-30);x.stroke();x.fillStyle=c;x.beginPath();x.moveTo(X,Y-30);x.lineTo(X+12,Y-27);x.lineTo(X,Y-20);x.fill();}
const W=600,H=360,panels=[];
// 1 醒來
panels.push([(x)=>{x.fillStyle="#0e1018";x.fillRect(0,0,W,H);frame(x,8,8,W-16,H-16);
  x.save();x.beginPath();x.roundRect(20,20,W-40,200,6);x.clip();stone(x,20,20,W-40,200);
  REG.forEach(([,c],i)=>banner(x,90+i*110,92+(i%2)*14,c));portal(x,300,160,70,1);hero(x,300,176,"sit");
  const v=x.createRadialGradient(300,140,80,300,140,330);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(10,12,30,0.7)");x.fillStyle=v;x.fillRect(20,20,W-40,200);x.restore();
  x.strokeStyle=GOLD;x.lineWidth=1.5;x.beginPath();x.roundRect(20,20,W-40,200,6);x.stroke();
  x.fillStyle="rgba(20,18,30,0.8)";x.beginPath();x.roundRect(30,30,96,22,11);x.fill();x.strokeStyle=GOLD;x.lineWidth=1;x.stroke();x.fillStyle=CREAM;x.font=`bold 11px ${FONT}`;x.fillText("◆ 樞島・中央廣場",38,45);
  narr(x,20,232,W-40,"傳送陣的光漸漸暗下。你在樞島中央醒來，|晶柱還在低鳴，四周的浮橋通往五個界域。");
  x.fillStyle="#262a3a";x.beginPath();x.roundRect(W-140,304,110,30,6);x.fill();x.strokeStyle=GOLD;x.stroke();x.fillStyle=CREAM;x.font=`13px ${FONT}`;x.fillText("站起來",W-108,324);},
 "<b>① 醒來（插圖場景 awaken）</b>：主角在傳送陣光圈裡半坐起，晶柱發光，五面區旗；說書人卡用 hub 主題。只有一個按鈕「站起來」，按了進入廣場。"]);
// 2 廣場與浮橋＋守印人
panels.push([(x)=>{x.fillStyle="#0e1018";x.fillRect(0,0,W,H);x.save();x.beginPath();x.roundRect(8,8,W-16,H-16,8);x.clip();
  x.fillStyle="#cfd8e8";x.fillRect(8,8,W-16,H-16);for(let i=0;i<14;i++){x.fillStyle="rgba(255,255,255,0.6)";x.beginPath();x.ellipse(30+i*44,(i%3)*120+30,40,12,0,0,TAU);x.fill();}
  stone(x,120,60,360,240,24);portal(x,300,190,46,0.9);
  const ends=[[300,60,300,14],[120,150,30,150],[480,150,570,150],[230,300,190,346],[420,300,470,346]];const order=[0,1,2,3,4];
  ends.forEach(([a,b,c,d],i)=>{const [nm,col,open,lab]=REG[order[i]];x.strokeStyle="#8a6a40";x.lineWidth=10;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();x.strokeStyle="#c8a070";x.lineWidth=7;x.setLineDash([3,3]);x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();x.setLineDash([]);
    const sx=a+(c-a)*0.05,sy=b+(d-b)*0.05;x.fillStyle=open?"#e8e0d0":"#9a9aa0";x.beginPath();x.roundRect(sx-7,sy-16,14,18,3);x.fill();x.strokeStyle=col;x.lineWidth=1.6;x.stroke();
    x.fillStyle="rgba(16,18,30,0.86)";const tw=open?40:84;x.beginPath();x.roundRect(sx+10,sy-22,tw,lab?30:18,5);x.fill();x.strokeStyle=open?col:"#6a6a70";x.lineWidth=1;x.stroke();
    x.fillStyle=open?CREAM:"#9a9aa0";x.font=`bold 10.5px ${FONT}`;x.fillText(nm,sx+14,sy-9);if(lab){x.font=`10px ${FONT}`;x.fillText("🔒 "+lab,sx+14,sy+4);}});
  hero(x,300,232,"stand");npcFig(x,350,226,"#3a3a5a","#2a2a48");mark(x,350,192);
  x.restore();frame(x,8,8,W-16,H-16,filigree,false);
  x.fillStyle="#f2ece0";x.beginPath();x.roundRect(370,170,206,40,8);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.2;x.stroke();x.fillStyle="#1c1712";x.font=`bold 11px ${FONT}`;x.fillText("守印人",380,186);x.font=`12px ${FONT}`;x.fillText("去雲嶺的霧渡鎮，找渡婆婆。",380,202);
  x.fillStyle="rgba(16,18,30,0.9)";x.beginPath();x.roundRect(20,20,170,46,6);x.fill();x.strokeStyle=GOLD;x.stroke();x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("任務",30,36);x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText("到霧渡鎮找渡婆婆",30,56);},
 "<b>② 廣場與浮橋</b>：四面都是雲（浮島邊緣），五座浮橋伸向界域；橋頭石碑：雲嶺亮、荒原「尚未開放」、其他三區「之後的賽季」（灰、鎖頭）。守印人頭上「！」，說出第一個指示，任務欄出現。"]);
// 3 第一次打開大世界圖
panels.push([(x)=>{x.fillStyle="#0e1018";x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#5a7ab8");g.addColorStop(1,"#e8c8a8");x.fillStyle=g;x.beginPath();x.roundRect(8,8,W-16,H-16,8);x.fill();
  for(let i=0;i<16;i++){x.fillStyle="rgba(255,255,255,0.55)";x.beginPath();x.ellipse(20+i*40,300+(i%2)*14,46,14,0,0,TAU);x.fill();}
  const isl=[[300,70,0],[150,170,1],[470,140,2],[320,250,3],[480,250,4]];
  isl.forEach(([cx,cy,ri],k)=>{const [nm,col,open]=REG[ri];const rise=k<3?1:0.55;x.save();x.globalAlpha=rise;x.translate(0,(1-rise)*30);
    x.fillStyle=open?"#7ab85a":"#a8a8b0";x.beginPath();x.ellipse(cx,cy,56,22,0,0,TAU);x.fill();x.fillStyle="#6a5040";x.beginPath();x.moveTo(cx-50,cy+4);x.lineTo(cx,cy+56);x.lineTo(cx+50,cy+4);x.fill();
    if(!open){x.fillStyle="rgba(255,255,255,0.6)";x.beginPath();x.ellipse(cx,cy+2,60,18,0,0,TAU);x.fill();}
    x.fillStyle="rgba(20,24,50,0.9)";x.beginPath();x.roundRect(cx-40,cy+30,80,22,4);x.fill();x.strokeStyle=GOLD;x.lineWidth=1.2;x.stroke();x.fillStyle=CREAM;x.font=`bold 12px ${SERIF}`;x.textAlign="center";x.fillText(nm,cx,cy+46);x.textAlign="left";x.restore();});
  x.fillStyle="#e8e0d0";x.beginPath();x.ellipse(300,180,40,16,0,0,TAU);x.fill();glow(x,300,170,26,"rgba(168,152,255,0.7)");x.fillStyle="#c8bcff";x.beginPath();x.moveTo(300,148);x.lineTo(306,170);x.lineTo(294,170);x.fill();
  x.fillStyle="rgba(20,24,50,0.9)";x.beginPath();x.roundRect(250,198,100,20,4);x.fill();x.fillStyle=CREAM;x.font=`11px ${FONT}`;x.fillText("你在樞島",274,212);
  glow(x,150,232,60,"rgba(255,224,138,0.55)");x.fillStyle="#3a7ad0";x.beginPath();x.roundRect(88,224,124,26,13);x.fill();x.strokeStyle="#ffe08a";x.lineWidth=2;x.stroke();x.fillStyle="#fff";x.font=`bold 12px ${FONT}`;x.fillText("◆ 傳送到霧渡鎮（免費）",96,241);
  frame(x,8,8,W-16,H-16,filigree,false);},
 "<b>③ 第一次打開大世界圖</b>：五座島依序從雲裡浮起（每座 0.3 秒，只播這一次；減少動態時直接顯示）。雲嶺的傳送鈕發金光、寫「免費」；其他島照 6F-ART1b。第一次之後照 #120 的傳送規則。"]);
// 4 抵達霧渡鎮
panels.push([(x)=>{x.fillStyle="#0e1018";x.fillRect(0,0,W,H);x.save();x.beginPath();x.roundRect(8,8,W-16,H-16,8);x.clip();
  for(let i=0;i<25;i++)for(let j=0;j<15;j++){x.fillStyle=(j>5&&j<10)?((i+j)%2?"#8a9a98":"#9aa8a6"):((i+j)%2?"#6a9a52":"#5f8f4a");x.fillRect(8+i*24,8+j*24,24,24);}
  x.fillStyle="#3a4a48";x.fillRect(40,40,200,60);x.fillStyle="#f2f0e8";x.fillRect(46,100,188,40);x.fillStyle="#b8432f";x.fillRect(46,100,188,4);x.fillStyle="#5a3e28";x.fillRect(120,112,22,28);
  x.fillStyle="#3a4a48";x.fillRect(360,40,200,60);x.fillStyle="#f2f0e8";x.fillRect(366,100,188,40);x.fillStyle="#5a3e28";x.fillRect(440,112,22,28);
  glow(x,300,200,40,"rgba(138,176,255,0.6)");x.fillStyle="#8ab0ff";x.beginPath();x.moveTo(300,176);x.lineTo(308,196);x.lineTo(300,206);x.lineTo(292,196);x.fill();
  hero(x,300,232,"stand");npcFig(x,350,280,"#3c4a48",null);x.fillStyle="#c8c8c0";x.beginPath();x.arc(350,254,4,0,TAU);x.fill();mark(x,350,240);
  const v=x.createRadialGradient(300,180,120,300,180,360);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(10,12,30,0.55)");x.fillStyle=v;x.fillRect(8,8,W-16,H-16);x.restore();
  frame(x,8,8,W-16,H-16,cloudCorner,false);
  x.fillStyle="rgba(16,18,30,0.92)";x.beginPath();x.roundRect(170,22,260,30,6);x.fill();x.strokeStyle="#6aa84a";x.lineWidth=1.2;x.stroke();x.fillStyle=CREAM;x.font=`bold 14px ${SERIF}`;x.textAlign="center";x.fillText("雲嶺・霧渡鎮",300,42);x.textAlign="left";
  x.fillStyle="rgba(16,18,30,0.9)";x.beginPath();x.roundRect(20,300,250,40,6);x.fill();x.strokeStyle=GOLD;x.stroke();x.fillStyle=GOLD2;x.font=`bold 11px ${FONT}`;x.fillText("任務更新",30,316);x.fillStyle=CREAM;x.font=`12px ${FONT}`;x.fillText("渡婆婆就在鎮口，頭上有「！」",30,333);},
 "<b>④ 抵達霧渡鎮</b>：傳送後地名牌換成雲嶺（玉綠、雲紋四角，RT-1 的主題切換），渡婆婆頭上「！」，任務欄更新；接上雲嶺新手任務鏈，從這裡起才有東方風。"]);
const g=document.getElementById("g");panels.forEach(([fn,cap])=>{const d=document.createElement("div");const [c,x]=cv(W,H);fn(x);d.appendChild(c);const p=document.createElement("div");p.className="cap";p.innerHTML=cap;d.appendChild(p);g.appendChild(d);});
</script></body></html>
