<html lang="zh-Hant"><head><meta charset="utf-8"><title>被遮擋剪影外框</title>
<style>
  body{margin:0;padding:12px 16px;background:#14161f;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  h1{font-size:18px;margin:0 0 6px}.note{color:#b8ab96;font-size:13px;margin:0 0 8px;line-height:1.55;max-width:1280px}
  a{color:#e8bb48;margin-right:12px}canvas{display:block}#out{display:none}
</style></head>
<body>
<h1>被遮擋剪影外框（樣張）</h1>
<p class="note">畫圖 agent，2026-11-12。分段：<a href="?part=boss&mute=1">1 頭目擋人</a><a href="?part=pair&mute=1">2 一般互擋</a><a href="?part=flash&mute=1">3 受擊閃白</a><a href="?part=team&mute=1">4 陣營色</a><a href="?part=tune&mute=1">5 門檻與線寬</a><a href="?part=true1x&mute=1">6a 真 1 倍</a><a href="?part=field&w=1600&mute=1">6b 戰場 1600</a><a href="?part=field&w=800&mute=1">6b 戰場 800</a><a href="?part=collide&mute=1">撞圖</a><a href="?part=fragment&mute=1">10 55～70% 放大</a><a href="?part=measure&mute=1">量測表</a>。第 2 版（同日）：門檻 55%（降到 45% 才拿掉）、透明度 0.8、比例在模型像素算。每段畫成一張圖（腳本從 #out 取出存檔）。</p>
<div id="sheet"></div>
<textarea id="out"></textarea>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script>
<script src="qDoll.js"></script><script src="storyDoll.js"></script><script src="realms.js"></script><script src="enemyArt.js"></script>
<script src="explore.js"></script><script src="regions4.js"></script>
<script src="qCreature.js"></script><script src="qCreatureAnim.js"></script><script src="qBoss.js"></script>
<script src="tools/qStatusLive.js"></script><script src="qPartsData.js"></script>
<script src="occludeOutline.js"></script>
<script>
const OO = OccludeOutline, T = OO.T, P = new URLSearchParams(location.search), PART = P.get("part") || "boss";
try { QStatusLive.setGlossary(window.QPARTS_GLOSSARY); } catch (e) { console.log("status glossary: " + e); }
const TP = PaperDoll.TEMPLATES, R4 = Regions4, REG = (id) => R4.REGIONS.find((r) => r.id === id);
const ASH = REG("ashen_waste"), CRY = REG("crystal_crown");
const tile = (region, id) => (ctx, x, y, gx, gy) => { ctx.save(); ctx.translate(x, y); ctx.scale(T / 52, T / 52); R4.tile(ctx, region, id, 0, 0, gx, gy); ctx.restore(); };
const ASH_GROUND = tile(ASH, "stone"), CRY_GROUND = tile(CRY, "stone");
/** 遊戲的地圖縮放（stageLayout.ts fitScale＋hudSideInsets；熔心坑 12×12＝588×630 模型像素）：1600×900 視窗 1.31、800×600 視窗 0.53。 */
const S1600 = Math.min((1600 - 268 - 240 - 16) / 588, (900 - 60 - 16) / 630), S800 = Math.min((800 - 246 - 226 - 16) / 588, (600 - 60 - 16) / 630);
// ---- 單位 ----
const U = {
  hero: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_fighter, view: "front", hp: 0.8, hero: true, ...o }),
  mage: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_mage, view: "front", hp: 0.6, ...o }),
  archer: (o) => ({ kind: "doll", team: "ally", doll: TP.hero_archer, view: "front", hp: 0.9, ...o }),
  bandit: (o) => ({ kind: "doll", team: "enemy", doll: TP.bandit, view: "front", hp: 0.7, ...o }),
  shield: (o) => ({ kind: "doll", team: "enemy", doll: TP.bandit_shieldbearer, view: "front", hp: 0.9, ...o }),
  lizard: (o) => ({ kind: "creature", team: "enemy", spec: { body: "lizard", material: "magma", size: "small" }, hp: 0.9, ...o }),
  golem: (o) => ({ kind: "creature", team: "enemy", spec: { body: "golem", material: "crystal", element: "lightning", elite: true }, hp: 1, ...o }),
  beetle: (o) => ({ kind: "creature", team: "enemy", spec: { body: "crawler", variant: "beetle", material: "magma", size: "large", elite: true, traits: ["lava_pool"] }, hp: 1, ...o }),
  ooze: (o) => ({ kind: "creature", team: "enemy", spec: { body: "ooze", material: "magma", traits: ["core"] }, hp: 0.5, ...o }),
  pylon: (o) => ({ kind: "creature", team: "enemy", spec: { body: "pylon", material: "crystal", element: "lightning" }, hp: 0.8, ...o }),
  ah: (o) => ({ kind: "boss", team: "enemy", who: "ah", st: { phase: 1, shell: 1, t: 300 }, hp: 0.7, ...o }),
  sl: (o) => ({ kind: "boss", team: "enemy", who: "sl", st: { phase: 2, t: 900 }, hp: 0.55, ...o }),
};
const burst = (x, y, a = 1) => (ctx) => { ctx.save(); ctx.translate((x + 0.5) * T, (y + 0.5) * T + OO.FEET); ctx.scale(OO.K, OO.K); QCreatureAnim.drawFx(ctx, [{ k: "burst", x: 0, y: -24, r: 9, c: "#ffffff", c2: "#ffe08a", a }], {}); ctx.restore(); };
// ---- 拼圖 ----
const FONT = "'Noto Sans TC','Microsoft JhengHei',sans-serif";
function sheet(W, blocks) {
  // blocks: {title} | {note} | {cells:[{cv, cap, w?, h?, nn?}], gap?}
  const lay = [], pad = 14; let y = pad;
  const tmp = document.createElement("canvas").getContext("2d");
  const wrap = (s, w, px) => { tmp.font = `${px}px ${FONT}`; const out = []; for (const para of String(s).split("\n")) { let line = ""; for (const ch of para) { if (tmp.measureText(line + ch).width > w && line) { out.push(line); line = ch; } else line += ch; } out.push(line); } return out; };
  for (const b of blocks) {
    if (b.title) { lay.push({ t: "title", s: b.title, y }); y += 26; }
    else if (b.note) { const ls = wrap(b.note, W - 2 * pad, 13); lay.push({ t: "note", ls, y }); y += ls.length * 18 + 4; }
    else if (b.cells) {
      const gap = b.gap ?? 12; let x = pad, rowH = 0; const items = [];
      for (const c of b.cells) { const w = c.w ?? c.cv.width, h = c.h ?? c.cv.height; if (x + w > W - pad + 0.5 && items.length) break; const caps = c.cap ? wrap(c.cap, Math.max(w, 120), 12) : []; items.push({ c, x, w, h, caps }); x += w + gap; rowH = Math.max(rowH, h + caps.length * 16 + 4); }
      lay.push({ t: "cells", items, y }); y += rowH + 10;
    }
  }
  const H = y + pad, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"); g.fillStyle = "#14161f"; g.fillRect(0, 0, W, H); g.textBaseline = "top";
  for (const l of lay) {
    if (l.t === "title") { g.font = `bold 16px ${FONT}`; g.fillStyle = "#e8bb48"; g.fillText(l.s, pad, l.y); }
    else if (l.t === "note") { g.font = `13px ${FONT}`; g.fillStyle = "#b8ab96"; l.ls.forEach((s, i) => g.fillText(s, pad, l.y + i * 18)); }
    else for (const it of l.items) {
      g.imageSmoothingEnabled = !it.c.nn; g.drawImage(it.c.cv, it.x, l.y, it.w, it.h); g.imageSmoothingEnabled = true;
      g.font = `12px ${FONT}`; g.fillStyle = "#d8ccb8"; it.caps.forEach((s, i) => g.fillText(s, it.x, l.y + it.h + 4 + i * 16));
    }
  }
  return cv;
}
function publish(cv, type = "image/jpeg") {
  document.getElementById("sheet").appendChild(cv);
  document.getElementById("out").textContent = cv.toDataURL(type, 0.8);
  document.documentElement.dataset.w = cv.width;
  document.documentElement.dataset.h = document.documentElement.scrollHeight;
  document.documentElement.dataset.done = "1";
}
const pct = (r) => `${Math.round(r * 100)}%`;
const statOf = (res, id) => res.stats.find((s) => s.id === id);
/** 一格：畫場景，回傳 {cv, cap}；cap 自動補上被擋單位的遮擋比例與畫不畫。 */
function cell(scene, view, opt, cap, who) {
  const r = OO.render(scene, view, opt), s = who ? statOf(r, who) : null;
  const big = s && Math.abs(s.raw - s.ratio) > 0.005 ? `（大型前排 ${pct(s.ratio)}）` : "";
  const tail = s ? `｜被擋 ${pct(s.raw)}${big}${opt.outline === false || opt.threshold === 0 ? "" : s.drawn ? "→畫" : "→不畫"}` : "";
  return { cv: r.canvas, cap: cap + tail, res: r };
}
// 場景：col 欄、目標在 (c, r)、前排在 (c, r+1)
function duo(back, front, opt = {}) {
  return { cols: opt.cols ?? 5, rows: opt.rows ?? 4, ground: opt.ground ?? ASH_GROUND, heights: opt.heights, units: [back, front, ...(opt.more ?? [])], fx: opt.fx, legacy: opt.legacy, hover: opt.hover };
}
const VIEW_Z = (S, zoom, x0, y0, w, h, res = 1) => ({ S, zoom, res, x0, y0, w, h });

const PARTS = {};
// ================= 1. 頭目擋一般單位 =================
PARTS.boss = () => {
  const V = VIEW_Z(S1600, 1.6, T * 0.5, T * 0.2, T * 4, T * 3.15);
  const ahAlly = duo(U.hero({ id: "t", x: 2, y: 1, marker: "A", status: ["burning"] }), U.ah({ id: "b", x: 2, y: 2 }), { fx: burst(2, 1) });
  const ahEnemy = duo(U.lizard({ id: "t", x: 2, y: 1, west: true }), U.ah({ id: "b", x: 2, y: 2 }));
  const slAlly = duo(U.mage({ id: "t", x: 2, y: 1, marker: "B" }), U.sl({ id: "b", x: 2, y: 2 }), { ground: CRY_GROUND, fx: burst(2, 1) });
  const slEnemy = duo(U.shield({ id: "t", x: 2, y: 1, view: "front" }), U.sl({ id: "b", x: 2, y: 2 }), { ground: CRY_GROUND });
  const C = (sc, opt, cap) => cell(sc, V, opt, cap, "t");
  publish(sheet(1280, [
    { title: "1. 大型頭目擋一般單位（CB-4 情境：頭目站在目標南邊、往正北打；地圖縮放 1.31＝1600 寬，畫面再放大 1.6 倍）" },
    { note: "每列：左＝現況（不畫外框）、中＝加外框（目標是友方，含受擊特效）、右＝加外框（目標是敵方）。外框＝選定值（第 2 版）：遮擋 ≥55% 才畫（降到 45% 以下才拿掉）、只畫被擋住的那一段輪廓、陣營環外框色（友 #a9ccff、敵 #ffb3a8）、線寬 1.5 px、兩側各襯 0.75 px 黑邊（#16121a）、整層透明度 0.8；圖層在單位之上、特效之下（星爆蓋在外框上）。" },
    { cells: [C(ahAlly, { outline: false }, "灰燼之心擋友方・現況"), C(ahAlly, {}, "灰燼之心擋友方・加外框"), C(ahEnemy, {}, "灰燼之心擋敵方（餘燼蜥）・加外框")] },
    { cells: [C(slAlly, { outline: false }, "碎晶之主擋友方・現況"), C(slAlly, {}, "碎晶之主擋友方・加外框"), C(slEnemy, {}, "碎晶之主擋敵方（持盾盜匪）・加外框")] },
  ]));
};
// ================= 2. 一般單位互擋 =================
PARTS.pair = () => {
  const V = VIEW_Z(S1600, 1.9, T * 0.75, T * 0.2, T * 2.5, T * 3.0);
  const C = (sc, cap) => cell(sc, V, {}, cap, "t");
  const flat = { cols: 4, rows: 4 }, hi = (h) => ({ cols: 4, rows: 4, heights: [[], [], [0, h, 0, 0]] });
  publish(sheet(1280, [
    { title: "2. 一般單位前後排互擋（縮放 1.31，再放大 1.9 倍；格下是模型像素量的遮擋比例；第 3 版只算大型前排）" },
    { note: "第 1 版 40% 時，「法杖高 3」（50%）、「傀儡高 2」（48%）、「傀儡擋軟泥」（42%）三格會在前排身上畫一小段，像前排的護目鏡、項鍊、頭帶；第 2 版這三格不畫。第 3 版只算大型前排（身體面積 ≥ 4000 模型 px²，現在等於只有頭目），8 格全部不畫：第 5 格（69%）第 2 版在頭盔上畫一條粉紅帶，第 3 版不畫，交給 6F-22 舊剪影。" },
    { note: "平地上一般體型互相幾乎擋不到：Q 版人形含外框高約 39 px，前後排的腳底差一格 48 px，前排的頭頂碰不到後排的腳（量出來 0%）。擋得到的是：前排站高台（每階抬 6 px）、前排是精英傀儡這種高個子（×1.15）、舉高的武器（法杖），以及後排是矮的異形（軟泥、蜥蜴）。前排站高台時，遊戲現在另有 6F-22 的虛線剪影（見撞圖）。" },
    { cells: [
      C(duo(U.archer({ id: "t", x: 1, y: 1 }), U.shield({ id: "f", x: 1, y: 2 }), flat), "人擋人・平地"),
      C(duo(U.archer({ id: "t", x: 1, y: 1 }), U.shield({ id: "f", x: 1, y: 2, h: 3 }), hi(3)), "人擋人・前排高 3 階"),
      C(duo(U.archer({ id: "t", x: 1, y: 1 }), U.mage({ id: "f", x: 1, y: 2, h: 3 }), hi(3)), "人擋人・法杖、前排高 3 階"),
      C(duo(U.ooze({ id: "t", x: 1, y: 1 }), U.hero({ id: "f", x: 1, y: 2 }), flat), "人擋異形（軟泥）・平地"),
    ] },
    { cells: [
      C(duo(U.ooze({ id: "t", x: 1, y: 1 }), U.shield({ id: "f", x: 1, y: 2, h: 3 }), hi(3)), "人擋異形（軟泥）・前排高 3 階"),
      C(duo(U.archer({ id: "t", x: 1, y: 1 }), U.golem({ id: "f", x: 1, y: 2 }), flat), "異形擋人・精英碎晶傀儡・平地"),
      C(duo(U.archer({ id: "t", x: 1, y: 1 }), U.golem({ id: "f", x: 1, y: 2, h: 2 }), hi(2)), "異形擋人・精英傀儡・高 2 階"),
      C(duo(U.ooze({ id: "t", x: 1, y: 1 }), U.golem({ id: "f", x: 1, y: 2 }), flat), "異形擋異形・傀儡擋軟泥・平地"),
    ] },
  ]));
};
// ================= 3. 受擊閃白 =================
PARTS.flash = () => {
  // 人形受擊（motionClips.ts humanHit）：白閃 0.85 → 0（播到 1/4＝90 ms 消失）、往後彈 7 虛擬像素（南北向一半）；12 格／秒的片段裡實際是第 0、1 格
  // 異形受擊（qCreatureAnim.ts hitCommon、creaturePose.ts hit）：400 ms 片段的前 20%（80 ms）固定 0.9，之後 0。外框強度 k＝白閃 ÷ 該片段峰值（OO.PEAK），不寫死 0.85。
  const HIT = 360, CHIT = 400, frames = [0, 30, 60, 90, 180, 300];
  const V = VIEW_Z(S1600, 2, T * 1.75, T * 0.35, T * 1.5, T * 2.2);
  const human = (ms) => { const k = ms / HIT; return { f: Math.round(Math.max(0, 1 - k * 4) * OO.PEAK.humanHit * 20) / 20, peak: OO.PEAK.humanHit, knock: 7 * Math.sin(Math.min(1, k * 1.6) * Math.PI) * OO.K * 0.5 }; };
  const creature = (ms) => ({ f: ms / CHIT < 0.2 ? OO.PEAK.creatureHit : 0, peak: OO.PEAK.creatureHit, knock: 3 * Math.sin(Math.min(1, (ms / CHIT) / 0.18) * Math.PI / 2) * (ms / CHIT < 0.18 ? 1 : Math.max(0, 1 - (ms / CHIT - 0.18) / 0.82)) * OO.K * 0.5 });
  const row = (mk, clip) => frames.map((ms) => {
    const { f, peak, knock } = clip(ms), sc = mk(f, knock, peak);
    return cell(sc, V, { flash: { t: f / peak } }, `${ms} ms・白閃 ${f.toFixed(2)}／峰值 ${peak}`, null);
  });
  const ah = (f, kn, pk) => duo(U.hero({ id: "t", x: 2, y: 1, flash: f, dy: -kn }), U.ah({ id: "b", x: 2, y: 2 }), { fx: f > 0 ? burst(2, 1, f / pk) : null });
  const sl = (f, kn, pk) => duo(U.bandit({ id: "t", x: 2, y: 1, flash: f, dy: -kn }), U.sl({ id: "b", x: 2, y: 2 }), { ground: CRY_GROUND, fx: f > 0 ? burst(2, 1, f / pk) : null });
  const liz = (f, kn, pk) => duo(U.lizard({ id: "t", x: 2, y: 1, flash: f, dy: -kn, west: true }), U.ah({ id: "b", x: 2, y: 2 }), { fx: f > 0 ? burst(2, 1, f / pk) : null });
  publish(sheet(1280, [
    { title: "3. 受擊閃白：被擋住的目標受擊時，外框跟著閃白（地圖縮放 1.31，再放大 2 倍；第 2 版透明度 0.8）" },
    { note: "身體露出來的部分照舊整片閃白（silhouetteFlash），被擋住的部分由外框閃：顏色往白混、透明度往 1 拉。強度 k＝當下白閃 ÷ 該片段的峰值（人形受擊 0.85、人形重擊 0.95、異形與頭目受擊 0.9、異形重擊 0.99；召喚物照身體走人形或異形），不寫死人形的 0.85。外框不變粗（變粗會像選取框）。" },
    { note: "第 1 列：灰燼之心擋友方（人形受擊 360 ms，0.85 → 0，90 ms 歸零；外框藍 → 白）。" },
    { cells: row(ah, human) },
    { note: "第 2 列：碎晶之主擋敵方（人形受擊；外框紅 → 白）。" },
    { cells: row(sl, human) },
    { note: "第 3 列：灰燼之心擋餘燼蜥（異形受擊 400 ms，前 80 ms 固定 0.9，之後 0；k＝0.9 ÷ 0.9＝1，外框整圈白）。" },
    { cells: row(liz, creature) },
  ]));
};
// ================= 4. 陣營色 =================
PARTS.team = () => {
  const V = VIEW_Z(S1600, 2.4, T * 1.0, T * 0.3, T * 2, T * 2.15);
  const tones = [[{ tone: "stroke", ink: 0 }, "RING.stroke・只有色線"], [{ tone: "stroke", ink: 0.75 }, "RING.stroke＋襯黑邊（選定）"], [{ tone: "fill", ink: 0 }, "RING.fill"], [{ tone: "team", ink: 0 }, "TEAM_COLORS"]];
  const mkRow = (sc, who) => tones.map(([o, cap]) => cell(sc, V, o, `${who}・${cap}`, "t"));
  publish(sheet(1280, [
    { title: "4. 友方、敵方兩種陣營色（色從遊戲端現有色票取，不另外發明；地圖縮放 1.31，再放大 2.4 倍）" },
    { note: "出處：client/src/render/artPalette.ts RING（腳下圈：友 fill #2f6fd0／stroke #a9ccff，敵 #c63b3b／#ffb3a8；6F-22 被高台擋住的剪影也用 stroke），client/src/battle/glossary.ts TEAM_COLORS（友 #2f7de1、敵 #d23c3c）。HP 條是依血量變色（綠黃紅），不是陣營色，不採用。襯黑邊＝色線兩側各 0.75 px 的 #16121a（Q 版外框色）。" },
    { cells: mkRow(duo(U.hero({ id: "t", x: 2, y: 1 }), U.ah({ id: "b", x: 2, y: 2 })), "灰燼之心擋友方") },
    { cells: mkRow(duo(U.bandit({ id: "t", x: 2, y: 1 }), U.ah({ id: "b", x: 2, y: 2 })), "灰燼之心擋敵方") },
    { cells: mkRow(duo(U.archer({ id: "t", x: 2, y: 1 }), U.sl({ id: "b", x: 2, y: 2 }), { ground: CRY_GROUND }), "碎晶之主擋友方") },
    { cells: mkRow(duo(U.bandit({ id: "t", x: 2, y: 1 }), U.sl({ id: "b", x: 2, y: 2 }), { ground: CRY_GROUND }), "碎晶之主擋敵方") },
  ]));
};
// ================= 5. 門檻與線寬、透明度 =================
PARTS.tune = () => {
  const V = VIEW_Z(S1600, 1.6, T * 0.75, T * 0.2, T * 2.5, T * 3.0);
  // 門檻：同一對（精英傀儡擋弓手）只換前排高度，量出來約 26／48／60%（模型像素）；格子裡照畫（門檻 0），看值不值得畫
  const g = (h) => duo(U.archer({ id: "t", x: 1, y: 1 }), U.golem({ id: "f", x: 1, y: 2, h }), { cols: 4, rows: 4, heights: [[], [], [0, h, 0, 0]] });
  const verdict = (st) => [[40, "第 1 版"], [55, "第 2 版"]].map(([t, v]) => `${v} ${t}%${st.raw >= t / 100 ? "畫" : "不畫"}`).join("・") + `・第 3 版（大型前排）${st.drawn ? "畫" : "不畫"}`;
  const tag = (c) => { c.cap = c.cap.replace(/→(畫|不畫)$/, "") + `｜${verdict(statOf(c.res, "t"))}`; return c; };

};
