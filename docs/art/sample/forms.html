<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>形態外觀樣張</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #1b1e24; color: #e8e8ea; font-family: "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 14px 0 6px; }
  .sub { color: #a0a4ad; font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .cell { background: #232730; border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; color: #c8ccd4; }
  .cell .m { color: #8a909a; font-size: 11px; }
  canvas { display: block; margin: 0 auto 4px; }
</style>
</head>
<body>
<h1>形態（變身，#48）：整身替換，沿用召喚物外觀系統</h1>
<div class="sub">形態外觀用召喚物同一套欄位（body／variant／size／trait），由資料的外觀 id 指定；新畫法只有 <b>bear、cat、demon</b> 三個 variant，鳥沿用鷹隼放大。<br>
變身中仍認得出是誰：保留陣營環（藍）與字母徽章，另加一圈元素色淡光環（樣張用源晶藍紫；有元素時換元素色）。不認得的外觀 id → 原角色紙娃娃＋光環。</div>

<h2>① 原角色 → 四種形態（放大 2 倍，正面／側面）</h2>
<div class="row" id="big"></div>

<h2>② 戰場實際大小（每格 52px）：和一般單位擺在一起</h2>
<div class="row" id="field"></div>

<script src="paperdoll.js"></script>
<script src="summonArt.js"></script>
<script>
const D = PaperDoll, S = SummonArt, DPR = 3, T = 52;
const FORMS = [
  ["原角色（未變身）", null, "—"],
  ["熊：坦克", { body: "beast", variant: "bear", size: "large" }, "beast／bear／large"],
  ["貓：近戰刺客", { body: "beast", variant: "cat", size: "medium" }, "beast／cat／medium"],
  ["鳥：遠程、越過 1 格高", { body: "beast", variant: "bird", size: "medium", trait: "flying" }, "beast／bird／medium／flying"],
  ["惡魔：雙刃、機動", { body: "humanoid", variant: "demon", size: "medium" }, "humanoid／demon／medium"],
  ["不認得的外觀 id", { body: "???" }, "退回原角色＋光環"],
];
const HERO = D.TEMPLATES.hero_fighter;
function cv(w, h) {
  const c = document.createElement("canvas");
  c.width = w * DPR; c.height = h * DPR; c.style.width = `${w}px`; c.style.height = `${h}px`;
  const ctx = c.getContext("2d"); ctx.scale(DPR, DPR); return [c, ctx];
}
function base(ctx, cx, cy, k, transformed) {
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, 18 * k, 6.5 * k, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#5aa0ff44"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#5aa0ff"; ctx.stroke();
  if (transformed) {
    ctx.beginPath(); ctx.ellipse(cx, cy, 22 * k, 8 * k, 0, 0, Math.PI * 2);
    ctx.shadowColor = "#9a86ff"; ctx.shadowBlur = 6 * k; ctx.lineWidth = 1.6; ctx.strokeStyle = "#9a86ffcc"; ctx.stroke();
  }
  ctx.restore();
}
function badge(ctx, x, y, k) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, 6 * k, 0, Math.PI * 2); ctx.fillStyle = "#1d1a22"; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = "#5aa0ff"; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = `bold ${8 * k}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("A", x, y + 0.5); ctx.restore();
}
function drawForm(ctx, spec, facing, cx, cy, k) {
  const known = spec && (spec.body === "beast" || spec.body === "humanoid");
  base(ctx, cx, cy - 2 * k, k, spec !== null);
  if (!known) D.stamp(ctx, HERO, facing, cx, cy, k, { dpr: DPR });
  else S.stamp(ctx, spec, facing, cx, cy, k);
  badge(ctx, cx - 16 * k, cy - 2 * k, k);
}
const big = document.getElementById("big");
for (const [label, spec, meta] of FORMS) {
  const [c, ctx] = cv(220, 140);
  ctx.fillStyle = "#2d323c"; ctx.fillRect(0, 0, 220, 140);
  drawForm(ctx, spec, "south", 60, 124, 1.6);
  drawForm(ctx, spec, "east", 160, 124, 1.6);
  const d = document.createElement("div"); d.className = "cell"; d.append(c);
  d.insertAdjacentHTML("beforeend", `${label}<div class="m">${meta}</div>`); big.append(d);
}
const field = document.getElementById("field");
{
  const [c, ctx] = cv(T * 7, T);
  for (let i = 0; i < 7; i++) { ctx.fillStyle = i % 2 ? "#8a8a84" : "#7d8a7a"; ctx.fillRect(i * T, 0, T, T); }
  const list = [null, ...FORMS.slice(1, 5).map((f) => f[1])];
  list.forEach((spec, i) => drawForm(ctx, spec, "south", i * T + T / 2, T * 0.82, 0.78));
  S.stamp(ctx, "war_wolf", "south", 5 * T + T / 2, T * 0.82, 0.78);
  D.stamp(ctx, D.TEMPLATES.bandit, "south", 6 * T + T / 2, T * 0.82, 0.78, { dpr: DPR });
  const d = document.createElement("div"); d.className = "cell"; d.append(c);
  d.insertAdjacentHTML("beforeend", `原角色、熊、貓、鳥、惡魔｜對照：召喚物戰狼、敵方盜賊`); field.append(d);
}
</script>
</body>
</html>
