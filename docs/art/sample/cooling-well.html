const PIT = {

  heights: ["000000000000", "000000000000", "000000000000", "000000000000", "000000000000", "000000000000", "000000000000", "000000000000", "000000000000", "001000000100", "000000000000", "000000000000"],

const PIT_TER = { ".": "stone", v: "lava", "#": "wall" };

const pitSurf = (wells, extra = []) => { const m = new Map(); for (const w of wells) if (w.k === 4) for (const [x, y] of spill3(w.x, w.y)) m.set(`${x},${y}`, "water"); for (const [x, y] of extra) m.set(`${x},${y}`, "water"); return m; };
function pitTileSpec(x, y, surf) { // giant-boss.html 照抄（artSpecs.ts tileArtSpec）
  const t = terAt(x, y), s = surf.get(`${x},${y}`) ?? "none";
  const nb = (dx, dy) => (inPit(x + dx, y + dy) ? { terrain: terAt(x + dx, y + dy), surface: surf.get(`${x + dx},${y + dy}`) ?? "none" } : undefined);

function pitTile(g, x, y, surf) { // giant-boss.html 照抄

    { note: "畫法照 ashenObjects.ts：灰褐石井圈（ruinTop／ruinFace、灰縫）、鐵箍與鏽點照鐵油桶、外框 #1c1712；第 2 版：頂面上緣 15.5（不高於殘牆壓頂石 15.6）、正面高 10/52；若玩法定不是掩護就維持這個高度，沒有舊樣張的鐵轆轤架。井水 #3a8ee0（比荒原水表面 #45627a 亮）＋兩縷熱氣；正面的藍色水滴＝「打破會漏水」的記號（照油桶危險記號：黑框實心小圖形畫在身上）。受損自己畫（同薄冰，不套通用裂痕），受損時下面有現行的物件耐久條。" },
    { cells: ITEMS.slice(0, 5).map((it) => ({ cv: itemCv(it, 192, 1), cap: it.cap })), gap: 14 },
    { cells: ITEMS.slice(5).map((it) => ({ cv: itemCv(it, 192, 1), cap: it.cap })), gap: 14 },
  ]));
};
PARTS["well-t1"] = () => {
  const blocks = [{ title: "2. 冷卻井真 1 倍：1600（一格 62.8 px）與 800（一格 25.5 px），右邊最近鄰 ×4" }];
  for (const [S, wz] of [[S1600, "1600"], [S800, "800"]]) {
    const px = T * S;
    blocks.push({ note: `${wz}：一格 ${px.toFixed(1)} px（真 1 倍）。` + "編號：1 冷卻井完好、2 受損 1、3 受損 2、4 打破後、5 現行 A5 水表面、6 鐵油桶、7 殘牆、8 破木箱、9 斷柱。" }, { cells: ITEMS.map((it) => ({ cv: itemCv(it, px, 1), cap: String(ITEMS.indexOf(it) + 1) })), gap: wz === "800" ? 14 : 10 });
    blocks.push({ cells: ITEMS.slice(0, 6).map((it) => nn(itemCv(it, px, 1), wz === "800" ? 5 : 3, it.cap.split("：")[0].split("（")[0] + ` ×${wz === "800" ? 5 : 3}`)), gap: 10 });
  }
  publish(sheet(1560, blocks), "image/png");
};

// ================= 3、4 破壞演出（(3,8) 那口；3×3＝x 2～4、y 7～9） =================
const BRK = { x: 3, y: 8 };
const brkUnits = () => [U.hero({ id: "h", x: 3, y: 7, active: true }), U.mage({ id: "m", x: 4, y: 8, view: "side", west: true })];
const brkScene = (k) => ({ wells: PIT.wells.map(([x, y]) => (x === BRK.x && y === BRK.y ? { x, y, k, hpStage: 2, hp: 0.27 } : { x, y })), units: brkUnits() });
PARTS.break = () => {
  const S = SW, V = FULL(S), is8 = W_ === 800, z = is8 ? 3 : 1;
  const crop = (cv) => cropPit(cv, V, 1.2 * T, 5.9 * T, 4.6 * T, 4.4 * T);
  const frames = [{ k: undefined, cap: "前：受損 2（被打到 ≤33%）" }, ...CW.FRAMES.map((f) => ({ k: f.k, cap: `K${f.k}　${f.ms} ms　${f.zh}` }))];
  const cells = frames.map((f) => { const sc = brkScene(f.k); if (f.k === undefined) sc.wells = sc.wells.map((w) => (w.x === BRK.x && w.y === BRK.y ? { x: w.x, y: w.y, hpStage: 2, hp: 0.27 } : w)); const c = crop(renderPit(sc, V)); return z > 1 ? nn(c, z, f.cap) : { cv: c, cap: f.cap }; });
  publish(sheet(1560, [
    { title: `${is8 ? 4 : 3}. 冷卻井被打破的演出（${W_} 寬真 1 倍${z > 1 ? `，最近鄰 ×${z}` : ""}）：(3,8) 那口，3×3＝x 2～4、y 7～9` },
    { note: "井圈白閃、裂縫亮 → 碎成 10 塊往外飛＋中央水柱 → 碎塊落地、水花往外 → 漣漪 → 留下泡在水裡的碎屑。K1～K3 新水面的邊有一圈亮色水沫（銜接井裡的亮藍），K4 收掉。水用現行水表面（terrainArt.ts，荒原水色 #45627a，相連併塊）：新的 3×3 水表面先畫好，用從井心往外長的圓形遮罩露出來（K1 半徑約半格、K2 十字、K3 到角、K4 全部）。戰士 (3,7) 在井北、法師 (4,8) 在井東：水表面在單位腳下；水花蓋在戰士身上是因為井在南邊一排（後畫）。3×3 含 (2,9) 高台、(4,9) 矮牆：水照放（規則怎麼放要開發確認，見移植需求）。" },
    { cells, gap: 12 },
  ]), "image/png");
};

// ================= 5、6、7 熔心坑 =================
PARTS.pit = () => {
  const S = SW, V = FULL(S), is8 = W_ === 800, cv = renderPit({ giant: { st: P1S }, units: openUnits() }, V);
  const blocks = [{ title: `${is8 ? 6 : 5}. 熔心坑第 1 階段開場：4 口冷卻井取代水表面（${W_}×${is8 ? 600 : 900} 視窗、地圖縮放 ${S.toFixed(3)}，一格 ${(T * S).toFixed(1)} px），真 1 倍` },
    { note: "和 giant-boss.html 6a／6b 同一場景，只把 (3,4)、(7,4)、(3,8)、(8,8) 的水表面換成冷卻井物件（完好）。地形、矮牆、單位、頭目全部同 A5。" },
    { cells: [{ cv, cap: "整張（真 1 倍）" }].concat(is8 ? [nn(cv, 2, "整張 ×2")] : []), gap: 16 }];
  if (!is8) {
    const cs = PIT.wells.map(([x, y]) => nn(cropPit(cv, V, (x - 1) * T, (y - 1) * T, 3 * T, 3 * T), 2, `(${x},${y}) ×2`));
    blocks.push({ title: "四口井局部最近鄰 ×2" }, { cells: cs, gap: 12 });
  } else {
    const cs = PIT.wells.map(([x, y]) => nn(cropPit(cv, V, (x - 1) * T, (y - 1) * T, 3 * T, 3 * T), 4, `(${x},${y}) ×4`));
    blocks.push({ cells: cs, gap: 12 });
  }
  publish(sheet(1560, blocks), "image/png");
};
PARTS["pit-broken"] = () => {
  const S = S1600, V = FULL(S);
  const wells = [{ x: 3, y: 4 }, { x: 7, y: 4, hpStage: 1, hp: 0.6 }, { x: 3, y: 8, k: 4 }, { x: 8, y: 8, hpStage: 2, hp: 0.27 }];
  const units = [U.hero({ id: "h", x: 3, y: 7, active: true }), U.mage({ id: "m", x: 2, y: 8, view: "back" }), U.archer({ id: "a", x: 9, y: 9, view: "side", west: true }), U.lizard({ id: "l1", x: 2, y: 4 }), U.lizard({ id: "l2", x: 8, y: 4, west: true })];
  const cv = renderPit({ giant: { st: P1S }, units, wells }, V);
  publish(sheet(1560, [
    { title: "7. 打破後：(3,8) 的井變成 3×3 水表面＋碎石圈；1600 真 1 倍" },
    { note: "(3,8) 打破（3×3＝x 2～4、y 7～9，含高台 (2,9) 與矮牆 (4,9) 底下）；(7,4) 受損 1、(8,8) 受損 2（下面是現行物件耐久條）、(3,4) 完好。戰士 (3,7)、法師 (2,8) 站在水裡，弓手站高台 (9,9)。右：西南一帶最近鄰 ×2。" },
    { cells: [{ cv, cap: "整張（真 1 倍）" }, nn(cropPit(cv, V, 1.2 * T, 5.9 * T, 4.6 * T, 4.6 * T), 2, "(3,8) 3×3 ×2"), nn(cropPit(cv, V, 6 * T, 2.6 * T, 4 * T, 7 * T), 2, "受損 1 (7,4)、受損 2 (8,8) ×2")], gap: 16 },
  ]), "image/png");
};

try { (PARTS[PART] ?? PARTS.well)(); } catch (e) { console.log("ERR " + e.stack); document.documentElement.dataset.err = String(e); }
</script>
