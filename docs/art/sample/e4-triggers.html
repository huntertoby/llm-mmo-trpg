<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>E4 觸發圖示</title>
<style>
  body{margin:0;padding:12px 16px;background:#14161f;color:#eadfcc;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  h1{font-size:18px;margin:0 0 6px}.note{color:#b8ab96;font-size:13px;margin:0 0 8px;line-height:1.55;max-width:1280px}
  a{color:#e8bb48;margin-right:12px}canvas{display:block}#out{display:none}
</style></head>
<body>
<h1>E4 觸發圖示：格擋時、你讓別人位移時（樣張）</h1>
<p class="note">畫圖 agent，2026-11-22。紀錄 docs/art/E4-觸發圖示-美術.md。分段：
<a href="?part=icons&mute=1">圖樣</a><a href="?part=icons-t1&mute=1">真 1 倍</a><a href="?part=near&mute=1">撞圖</a><a href="?part=all&mute=1">全部觸發</a><a href="?part=full96&mute=1">完整圖示</a><a href="?part=trials&mute=1">試過的方案</a><a href="?part=audit&mute=1">自查</a></p>
<div id="sheet"></div>
<textarea id="out"></textarea>
<script src="current.js"></script><script src="raceArt.js"></script><script src="paperdoll.js"></script>
<script src="qDoll.js"></script>
<script src="tools/qStatusLive.js"></script><script src="qPartsData.js"></script>
<script src="qIcons.js"></script><script src="qIconsWeapons.js"></script><script src="qIconsSkills.js"></script><script src="qIconsParts.js"></script><script src="qIconsStatus.js"></script>
<script src="sk3Mechanics.js"></script><script src="ap2Borrow.js"></script><script src="e4Triggers.js"></script>
<script>
const QP = QIconsParts, E4 = E4Trig;
const P = new URLSearchParams(location.search), PART = P.get("part") || "icons";
const FONT = "'Noto Sans TC','Microsoft JhengHei',sans-serif";
/* 先把已經移植到遊戲端的 SK-3 三個、AP-2 一個觸發裝上，觸發表才和遊戲端 TRIG（26 個）一樣齊。 */
SK3Mech.install(); AP2Borrow.install(); E4.install({ trials: PART === "trials" });

// ---------------- 拼圖（照 ap2-borrow.html） ----------------
function sheet(W, blocks) {
  const lay = [], pad = 14; let y = pad;
  const tmp = document.createElement("canvas").getContext("2d");
  const wrap = (s, w, px) => { tmp.font = `${px}px ${FONT}`; const out = []; for (const para of String(s).split("\n")) { let line = ""; for (const ch of para) { if (tmp.measureText(line + ch).width > w && line) { out.push(line); line = ch; } else line += ch; } out.push(line); } return out; };
  for (const b of blocks) {
    if (b.title) { lay.push({ t: "title", s: b.title, y }); y += 26; }
    else if (b.note) { const ls = wrap(b.note, W - 2 * pad, 13); lay.push({ t: "note", ls, y }); y += ls.length * 18 + 4; }
    else if (b.cells) {
      const gap = b.gap ?? 12; let x = pad, rowH = 0; const items = [];
      for (const c of b.cells) {
        const w = c.w ?? c.cv.width, h = c.h ?? c.cv.height;
        const cw = Math.max(w, c.cap ? (c.capW ?? 110) : 0);
        if (x + cw > W - pad + 0.5 && items.length) { lay.push({ t: "cells", items: items.splice(0), y }); y += rowH + 10; x = pad; rowH = 0; }
        const caps = c.cap ? wrap(c.cap, Math.max(w, c.capW ?? 110), 12) : [];
        items.push({ c, x, w, h, caps, bg: c.bg }); x += cw + gap; rowH = Math.max(rowH, h + (caps.length ? caps.length * 16 + 4 : 0));
      }
      lay.push({ t: "cells", items, y }); y += rowH + 10;
    }
  }
  const Hh = y + pad, cv = document.createElement("canvas"); cv.width = W; cv.height = Hh;
  const g = cv.getContext("2d"); g.fillStyle = "#14161f"; g.fillRect(0, 0, W, Hh); g.textBaseline = "top";
  for (const l of lay) {
    if (l.t === "title") { g.font = `bold 16px ${FONT}`; g.fillStyle = "#e8bb48"; g.fillText(l.s, pad, l.y); }
    else if (l.t === "note") { g.font = `13px ${FONT}`; g.fillStyle = "#b8ab96"; l.ls.forEach((s, i) => g.fillText(s, pad, l.y + i * 18)); }
    else for (const it of l.items) {
      if (it.bg) { g.fillStyle = it.bg; g.fillRect(it.x, l.y, it.w, it.h); }
      g.imageSmoothingEnabled = !it.c.nn; g.drawImage(it.c.cv, it.x, l.y, it.w, it.h); g.imageSmoothingEnabled = true;
      g.font = `12px ${FONT}`; g.fillStyle = "#d8ccb8"; it.caps.forEach((s, i) => g.fillText(s, it.x, l.y + it.h + 4 + i * 16));
    }
  }
  return cv;
}
function publish(cv, type = "image/png") {
  document.getElementById("sheet").appendChild(cv);
  document.getElementById("out").textContent = cv.toDataURL(type, 0.8);
  document.documentElement.dataset.w = cv.width;
  document.documentElement.dataset.h = document.documentElement.scrollHeight;
  document.documentElement.dataset.done = "1";
}
/** 最近鄰放大（drawImage 時關掉平滑＝真最近鄰）。 */
const nn = (cv, Z, cap, capW) => ({ cv, w: cv.width * Z, h: cv.height * Z, nn: true, cap, capW });
const chip = (cat, id, px, zoom = 1, opt = {}) => QP.chipCanvas(cat, id, px, zoom, { ...opt, ring: opt.ring ?? QP.RING[cat] });
/** 剪影：真 1 倍裡色環以內亮度 > 70 的像素（同 ap2-borrow.html）。 */
const SIL = (cat, id, px) => { const c = chip(cat, id, px, 1, { res: 1 }), x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height), r = px / 2, rin = px * 0.42 * 0.94;
  for (let i = 0; i < d.data.length; i += 4) { const p = i / 4, X = p % c.width, Y = Math.floor(p / c.width), inR = Math.hypot(X + 0.5 - r, Y + 0.5 - r) < rin; const L = 0.3 * d.data[i] + 0.59 * d.data[i + 1] + 0.11 * d.data[i + 2]; const on = inR && L > 70; d.data[i] = d.data[i + 1] = d.data[i + 2] = on ? 235 : 30; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; };
/** 完全紅色盲（protanopia）模擬：同 ap2-borrow.html。 */
const PROTAN = (c) => { const x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height); for (let i = 0; i < d.data.length; i += 4) { const r = d.data[i], g = d.data[i + 1], b = d.data[i + 2]; d.data[i] = 0.567 * r + 0.433 * g; d.data[i + 1] = 0.558 * r + 0.442 * g; d.data[i + 2] = 0.242 * g + 0.758 * b; } x.putImageData(d, 0, 0); return c; };

const NEW = [
  { id: "on_block", zh: "格擋時（on_block）" },
  { id: "on_displace", zh: "你讓別人位移時（on_displace）" },
];
const SIZES = [30, 26, 18];
const live = (id) => E4.LIVE[`trigger:${id}`][1];
const PARTS = {};

// =====================================================================
// 1. 圖樣：現行（暫借）｜新，各尺寸、×4 向量、2 倍解析度 ×4 最近鄰
// =====================================================================
PARTS.icons = () => {
  const blocks = [{ title: "E4 觸發：新圖樣（組裝列圓片 30／26／18，觸發白環）" },
    { note: "每列：現行（暫借）30／26／18｜新 30／26／18｜×4 向量（30）｜18 的 2 倍解析度 ×4 最近鄰｜26 的 2 倍解析度 ×4 最近鄰。圓片底與白環照現行 drawChip。圖樣本身：30→19.7、26→17.0、18→11.8 px（18 走 tiny：不包外框、省小零件）。" }];
  for (const e of NEW) {
    const cells = [], L = live(e.id);
    for (const px of SIZES) cells.push({ cv: chip("trigger", L, px), w: px, h: px, cap: px === 30 ? `現行（借 ${QP.entry("trigger", L).zh}）` : "", capW: 92 });
    for (const px of SIZES) cells.push({ cv: chip("trigger", e.id, px), w: px, h: px, cap: px === 30 ? "新" : "", capW: 40 });
    cells.push({ cv: chip("trigger", e.id, 30, 4), w: 120, h: 120, cap: "×4 向量（圓片 30）", capW: 120 });
    cells.push(nn(chip("trigger", e.id, 18), 4, "圓片 18 2 倍解析度 ×4"));
    cells.push(nn(chip("trigger", e.id, 26), 4, "圓片 26 2 倍解析度 ×4"));
    blocks.push({ title: e.zh }, { note: QP.entry("trigger", e.id).topic }, { cells });
  }
  publish(sheet(1100, blocks));
};
/** 真 1 倍：canvas 寬高＝CSS px，×6 最近鄰；每組左現行、右新。 */
PARTS["icons-t1"] = () => {
  const blocks = [{ title: "真 1 倍（res 1）×6 最近鄰：每組左＝現行（暫借）、右＝新" }, { note: "100% 縮放螢幕的最壞情況（遊戲端固定 DPR 2）。第三組（18）是組裝列實際最小尺寸。" }];
  for (const e of NEW) {
    const cells = [], L = live(e.id);
    for (const px of SIZES) { cells.push(nn(chip("trigger", L, px, 1, { res: 1 }), 6, `圓片 ${px} 現行`)); cells.push(nn(chip("trigger", e.id, px, 1, { res: 1 }), 6, `圓片 ${px} 新`)); }
    blocks.push({ title: e.zh }, { cells, gap: 16 });
  }
  publish(sheet(1280, blocks));
};

// =====================================================================
// 2. 撞圖：兩組最相近的（受擊家族、位移家族），每組 26 的 2 倍 ×3｜18 真 1 倍 ×5｜18 剪影｜18 真 1 倍紅色盲
// =====================================================================
const GROUPS = [
  { zh: "格擋時 vs 受擊家族與盾", note: "被近戰命中時（現行暫借）、被攻擊時、被法術命中時、敵人擲中你時（觸發，都是左上來襲物＋右下小藍盾）；效果：護盾、替隊友擋攻擊、免死；狀態：帶電護盾、守護（木盾）；命中時（撞擊星＋劍）。",
    items: [["trigger", "on_block"], ["trigger", "hit_by_melee"], ["trigger", "hit_by_attack"], ["trigger", "hit_by_spell"], ["trigger", "enemy_hit_roll"], ["trigger", "on_hit"], ["effect", "shield"], ["effect", "intercept"], ["effect", "cheat_death"], ["status", "shielded_charged"], ["status", "defending"]] },
  { zh: "你讓別人位移時 vs 撞擊、移動與位移家族", note: "造成撞擊後（現行暫借）、移動後、敵人靠近時、敵人離開時、受傷時（觸發）；效果：推擊、拉扯、交換位置、傳送、瞬步、跳躍；骨架：位移（同效果「衝鋒」的雙 V）。",
    items: [["trigger", "on_displace"], ["trigger", "on_collision"], ["trigger", "on_move"], ["trigger", "enemy_enters_adjacent"], ["trigger", "enemy_leaves_adjacent"], ["trigger", "on_damaged"], ["effect", "push"], ["effect", "pull"], ["effect", "swap"], ["effect", "teleport"], ["effect", "shadowstep"], ["effect", "leap"], ["skeleton", "displace"]] },
];
PARTS.near = () => {
  const blocks = [{ title: "撞圖：新圖（每組第一個，★）和最相近的既有圖並排" }];
  for (const gr of GROUPS) {
    const a = [], b = [], s = [], p = [];
    for (const [cat, id] of gr.items) {
      const e = QP.entry(cat, id), mine = e.src === "new:e4";
      a.push({ cv: chip(cat, id, 26, 3), w: 78, h: 78, cap: (mine ? "★新 " : "") + (e.zh ?? id), capW: 96 });
      b.push(nn(chip(cat, id, 18, 1, { res: 1 }), 5, "", 96));
      s.push(nn(SIL(cat, id, 18), 5, "", 96));
      p.push(nn(PROTAN(chip(cat, id, 18, 1, { res: 1 })), 5, "", 96));
    }
    blocks.push({ title: gr.zh }, { note: gr.note + " 上排 26 的 2 倍 ×3｜第二排 18 真 1 倍 ×5｜第三排 18 剪影｜第四排 18 真 1 倍完全紅色盲 ×5。" }, { cells: a, gap: 18 }, { cells: b, gap: 18 }, { cells: s, gap: 18 }, { cells: p, gap: 18 });
  }
  blocks.push({ note: "剪影＝真 1 倍裡色環以內亮度 > 70 的像素。效果、狀態、骨架照第④批 chipCanvas 畫成圓片（同尺寸並排）；觸發白環、其他照各自的環。" });
  publish(sheet(1500, blocks));
};
/** 全部觸發（遊戲端 TRIG 26 個＋新 2 個）：18 真 1 倍 ×5、剪影、26 的 2 倍。 */
PARTS.all = () => {
  const ids = Object.keys(QP.CATS.trigger).filter((id) => !id.includes("__"));
  const order = ["on_block", "on_displace", ...ids.filter((id) => id !== "on_block" && id !== "on_displace")];
  const cap = (id) => (QP.entry("trigger", id).src === "new:e4" ? "★" : "") + QP.entry("trigger", id).zh;
  publish(sheet(1500, [
    { title: `全部觸發 ${order.length} 個（遊戲端 TRIG 26 個＋新 2 個★）並排` },
    { note: "第一段：圓片 18 真 1 倍 ×5（組裝列實際最小尺寸）。第二段：同上的剪影。第三段：圓片 26（2 倍解析度）×2 向量。" },
    { title: "圓片 18 真 1 倍 ×5" }, { cells: order.map((id) => nn(chip("trigger", id, 18, 1, { res: 1 }), 5, cap(id), 90)), gap: 10 },
    { title: "圓片 18 剪影 ×5" }, { cells: order.map((id) => nn(SIL("trigger", id, 18), 5, cap(id), 90)), gap: 10 },
    { title: "圓片 26 ×2" }, { cells: order.map((id) => ({ cv: chip("trigger", id, 26, 2), w: 52, h: 52, cap: cap(id), capW: 90 })), gap: 10 },
  ]));
};
/** 完整技能圖示：96（工坊，觸發左上白環）與 56 mid（技能卡）。 */
PARTS.full96 = () => {
  const seg = (sk, shape, eff) => [{ skeleton: sk, shape_id: shape, effects: eff.map((type) => ({ type })) }];
  const set = [
    ["示意：被動「格擋時 → 傷害」（格擋後反擊）", { kind: "passive", rarity: "rare", trigger: "on_block", elements: [], condition: null, segments: seg("strike", "single", ["damage"]) }, { kind: "passive", rarity: "rare", prop: "w:sword", motion: "slash", act: "hit" }],
    ["對照：同上，觸發換回現行暫借的「被近戰命中時」", { kind: "passive", rarity: "rare", trigger: "hit_by_melee", elements: [], condition: null, segments: seg("strike", "single", ["damage"]) }, { kind: "passive", rarity: "rare", prop: "w:sword", motion: "slash", act: "hit" }],
    ["示意：被動「你讓別人位移時 → 自身護盾」", { kind: "passive", rarity: "epic", trigger: "on_displace", elements: [], condition: null, segments: seg("aura", "self", ["shield"]) }, { kind: "passive", rarity: "epic", prop: "none", motion: "aura", act: "shield" }],
    ["示意：被動「你讓別人位移時 → 推擊」（觸發和效果列都有位移題材時）", { kind: "passive", rarity: "epic", trigger: "on_displace", elements: [], condition: null, segments: seg("displace", "single", ["push"]) }, { kind: "passive", rarity: "epic", prop: "none", motion: "aura", act: "push" }],
    ["對照：被動「造成撞擊後 → 自身護盾」（現行暫借的那一個）", { kind: "passive", rarity: "epic", trigger: "on_collision", elements: [], condition: null, segments: seg("aura", "self", ["shield"]) }, { kind: "passive", rarity: "epic", prop: "none", motion: "aura", act: "shield" }],
  ];
  const blocks = [{ title: "完整技能圖示：96（工坊；觸發左上白環、效果列在底）與 56 mid（技能卡：觸發左上＋骨架徽章）" },
    { note: "主圖（道具＋出手＋記號）照第③批推導，不在這次範圍。每招：96 的 2 倍解析度｜96 真 1 倍 ×2｜56 mid 2 倍解析度｜56 mid 真 1 倍 ×3。" }];
  for (const [zh, icon, look] of set) {
    blocks.push({ title: zh }, { cells: [
      { cv: QP.canvas(icon, look, 96, 1), w: 96, h: 96, cap: "96" },
      nn(QP.canvas(icon, look, 96, 1, { res: 1 }), 2, "96 真 1 倍 ×2"),
      { cv: QP.canvas(icon, look, 56, 1, { level: "mid" }), w: 56, h: 56, cap: "56 mid" },
      nn(QP.canvas(icon, look, 56, 1, { res: 1, level: "mid" }), 3, "56 mid 真 1 倍 ×3"),
    ], gap: 24 });
  }
  publish(sheet(1100, blocks));
};
/** 試過的方案：每個方案 30、26 向量｜18 真 1 倍 ×6｜18 剪影 ×6｜26 真 1 倍 ×4。 */
PARTS.trials = () => {
  const blocks = [{ title: "試過的方案（A＝定案）：30、26（2 倍解析度）｜18 真 1 倍 ×6｜18 剪影 ×6｜26 真 1 倍 ×4" }];
  const NEAR = { on_block: [["trigger", "hit_by_melee"], ["trigger", "hit_by_attack"], ["trigger", "hit_by_spell"], ["trigger", "on_hit"], ["effect", "shield"], ["effect", "intercept"]],
    on_displace: [["trigger", "on_collision"], ["trigger", "enemy_enters_adjacent"], ["trigger", "enemy_leaves_adjacent"], ["trigger", "on_move"], ["condition", "adjacent_ally"], ["effect", "shadowstep"]] };
  for (const [id, list] of Object.entries(E4.TRIALS)) {
    blocks.push({ title: QP.entry("trigger", id).zh });
    list.forEach(([zh], i) => { const k = `${id}__try${i}`; blocks.push({ cells: [{ cv: chip("trigger", k, 30), w: 30, h: 30, cap: zh, capW: 200 }, { cv: chip("trigger", k, 26), w: 26, h: 26 }, nn(chip("trigger", k, 18, 1, { res: 1 }), 6), nn(SIL("trigger", k, 18), 6), nn(chip("trigger", k, 26, 1, { res: 1 }), 4)], gap: 14 }); });
    blocks.push({ note: "最相近的既有圖（18 真 1 倍 ×6｜剪影 ×6）：" + NEAR[id].map(([c, i]) => QP.entry(c, i).zh).join("、") },
      { cells: NEAR[id].flatMap(([c, i]) => [nn(chip(c, i, 18, 1, { res: 1 }), 6), nn(SIL(c, i, 18), 6)]), gap: 10 });
  }
  publish(sheet(1500, blocks));
};

// =====================================================================
// 3. 自查（規則 6、7；同 ap2-borrow.html）：量實際走到的那一份（18 是 tiny），4 倍內部解析度，不算外框色
//    分母＝色環內緣直徑（圖樣 12.06 單位）。
// =====================================================================
PARTS.audit = () => {
  const rows = [], res = 4;
  const measure = (g, Rin, denom) => { const S = g.width, d = g.getContext("2d").getImageData(0, 0, S, S).data, c = S / 2; let n = 0, lumSum = 0, hi = 0, x0 = S, x1 = 0, y0 = S, y1 = 0, out = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = (y * S + x) * 4; if (d[i + 3] < 128) continue; const isOut = d[i] === 0x16 && d[i + 1] === 0x12 && d[i + 2] === 0x1a; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); if (isOut) continue; if (Rin && Math.hypot(x + 0.5 - c, y + 0.5 - c) > Rin) out++; n++; const L = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; lumSum += L; if (L >= 150) hi++; }
    return { occ: (Math.max(x1 - x0, y1 - y0) + 1) / denom, lum: lumSum / n, hi: hi / n, out: out / Math.max(1, n) }; };
  const ids = [...NEW.map((e) => e.id), "hit_by_melee", "on_collision"];
  for (const id of ids) for (const px of SIZES) {
    const cpx = px * 0.42 * 1.56, Rin = cpx * 0.603 * res, m = measure(QP.glyph("trigger", id, cpx, res), Rin, 2 * Rin);
    rows.push([QP.entry("trigger", id).zh + (id.startsWith("on_b") || id === "on_displace" ? "" : "（現行，參考）"), `圓片 ${px}`, cpx.toFixed(1) + (cpx <= 14 ? " tiny" : ""), (m.occ * 100).toFixed(0) + "%", m.lum.toFixed(0), (m.hi * 100).toFixed(0) + "%", (m.out * 100).toFixed(1) + "%"]);
  }
  const t = document.createElement("table"); t.innerHTML = "<tr><th>圖樣</th><th>尺寸</th><th>圖樣 px</th><th>佔框（色環內徑）</th><th>平均亮度</th><th>亮度≥150</th><th>超出色環內緣</th></tr>" + rows.map((r) => "<tr>" + r.map((v) => `<td>${v}</td>`).join("") + "</tr>").join("");
  t.style.cssText = "border-collapse:collapse;font-size:13px"; t.querySelectorAll("td,th").forEach((x) => (x.style.cssText = "border:1px solid #444;padding:2px 8px"));
  const pre = document.createElement("pre"); pre.id = "audit"; pre.textContent = rows.map((r) => r.join("\t")).join("\n");
  document.getElementById("sheet").append(t, pre);
  const cv = document.createElement("canvas"); cv.width = cv.height = 10; document.getElementById("out").textContent = cv.toDataURL("image/png");
  document.documentElement.dataset.h = document.documentElement.scrollHeight; document.documentElement.dataset.done = "1";
};
(async () => { try { await (PARTS[PART] ?? PARTS.icons)(); } catch (e) { console.log("ERR " + e.stack); document.documentElement.dataset.err = String(e); } })();
</script>
</body></html>
