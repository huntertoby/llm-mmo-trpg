# 地圖類型（Phase WL-2；原本寫在 src/trpg/content/maps.py 的 Archetype／ARCHETYPES）。
# 地圖檔（content/maps/<id>.yaml）的 archetype、區域表（regions.yaml）的 map_pool 只能填這裡的 id；
# 不認得的類型由載入器（trpg content check）擋下。
# 順序就是清單順序（例如 trpg sim matrix 的類型欄）；加一種類型只要多一列，不用改程式。
# 前 8 種是 docs/design/05-戰鬥.md 5.1 的地圖類型；test 是測試地圖、training 是技能工坊的靶場（Phase 3F-1）、
# boss 是 Boss 戰專屬地圖（Phase 3-5b）。
archetypes:
  - id: bridge_chasm
  - id: oil_depot
  - id: swamp
  - id: ruined_heights
  - id: forest
  - id: corridor
  - id: open_plain
  - id: frozen_lake
  - id: test
  - id: training
  - id: boss
