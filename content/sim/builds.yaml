# 代表性 build（Phase 2C-3 5.3；docs/design/06-技能.md 6.8 的 build × 地圖類型矩陣）。
# 一個 build ＝ 一名英雄（屬性、HP、武器、行為模式、技能）。矩陣的我方隊伍 ＝ build 英雄 ＋
# companions（沒有技能的標準隊友），敵方是地圖的 encounter.enemies。
# 屬性、HP、護甲比照既有英雄範本（近戰＝戰士、法系＝法師／雷術士、遠程＝弓手），讓 build 之間的差異
# 主要來自技能；技能的 weapon_req 與武器分類必須相容（載入時檢查），所以部分技能依主題換成同武器
# 分類的技能（見 docs/phases/Phase2C-3報告.md）。
companions: [sim_companion_fighter, sim_companion_archer]
# Phase 2G-1：build_tank 加入破甲系（sunder_strike、armor_breaker）、build_assassin 加入狂怒姿態、build_warlock 加入毒雲與標記引爆、
# build_healer 加入再起（second_wind），讓每個手寫技能都被至少一名英雄或單位裝備（tests/content/test_coverage.py）。
# Phase 2G-2：新增 12 個示範技能（觸發時機、反應事件、連段、地形原語），分配給主題相符的 build（沒有新增 build，仍為 12 個）。
# Phase 3C-5a：build_push 加震地推倒（topple）、build_fire 加念力投擲（hurl_object；油桶落地爆炸，3C-6 再整理成念力流）。
# Phase 3D-1：連段條件與資源互動的示範技能（衝勢劈砍、並肩斬、獵殺落單、先發制人、連段雷光、專注湧流、疾時之潮、竊取祝福）。
# Phase 3D-2：新增 build_charger（衝鋒流）：猛虎衝撞（dash）、騰躍（leap）、調虎離山與護衛換位（swap）。
# Phase 3D-2c：build_charger 的盾擊換成蠻牛衝陣（charge_through，主動欄位已滿）。
# Phase 3D-2b：新增 build_banisher（放逐流）：放逐（teleport_target）、虛空互換（swap_any）。
# Phase 3D-3：新反應事件的示範反應技（每人反應欄位只有 1 個）：build_banisher 加反咒（hit_by_spell）、build_tank 加悲憤（ally_downed）、
# build_assassin 加迎頭痛擊（enemy_enters_adjacent）、build_ranged 加掩護射擊（ally_targeted）。
# Phase 3D-3：技能變形的示範修正技能：build_tank 加震懾餘波（area_delta：嘲諷怒吼的環形 +1）、build_healer 加慈悲光束（shape_to：
# 回春由單體轉成直線）與自我療癒（allow_self_target）。
# Phase 3D-4b：新增 build_summoner（召喚師）：召喚元素之靈、喚起骷髏、立起圖騰（build_trapper 仍裝著 3D-4a 的喚起骷髏）。
# Phase 3C-3a：build_push 加破城衝撞與裂骨印記（撞擊）、build_fire 加烈焰護身（on_cast_tag）、build_warlock 加蝕心追擊（on_status_applied）。
# Phase 3D-6：常駐類傳說（以 1 AP ＋ 源力啟動）：build_summoner 加慈焰誓約（火牆不再燒到隊友）、build_guardian 加移山之力、
# build_striker 加血痕疾行、build_trapper 加殘影之誓（規則改變型，每人最多 1 個）；build_charger 加戰神降臨（修正型傳說，被動欄位）。
# Phase 3C-2：修正技能（kind: modifier，裝在被動欄位，上限 3）——build_push 加重踏、build_fire 加灼傷之痕與餘燼循環、
# build_tank 加雷之手（單手劍的物理普攻變成雷電，3C-5 再整理）。
# Phase 3D-7b：build_gambler 加狂野之刃（高變異）、狂戰士之怒（以血換力）；build_striker 加過載電流（超載）；build_ranged 以遠距狙擊（依距離縮放）換下煙霧箭（主動欄位已滿）；build_tank 以困獸旋斬（依周圍敵人數縮放）換下碎骨重擊（主動欄位已滿）。
# Phase 3C-6a：build_striker 加聚雷（依目標相鄰的敵方數縮放 enemies_adjacent_target）。
# Phase 3D-8a：build_support 以汲命術（吸血）換下專注湧流、build_healer 以聖光爆發（聖光雙效）換下疾時之潮（兩者主動欄位已滿）；新增 build_seer
# （偵察破咒流）：破魔（驅散）、照明彈（揭露）搭配竊取祝福、咒印，並接收被換下的專注湧流與疾時之潮（3C-6 再整理）。
# Phase 3D-8b：build_healer 以返魂術（復活）換下不死誓約（主動欄位已滿）；新增 build_bomber（定時炸彈流）：定時炸彈符、灰燼收割
# （擊殺時返還 AP 並重置冷卻），並接收被換下的不死誓約（3C-6 再整理）。
# Phase 3D-7a：新增 build_gambler（賭徒／狂戰士流）：血祭重擊（賭注）、孤注一擲（失手反噬）搭配捨身突刺、狂怒姿態與嗜血（3C-6 再整理）。
# Phase 3D-8c：build_ranged 以監視射擊（overwatch）換下升高平台（主動欄位已滿；升高平台改由 build_winged 接收）、build_assassin 以前後夾擊
# （flanked）換下魯莽突刺（魯莽突刺仍在 build_gambler）；新增 build_winged（飛翼流）：展翼、賜予羽翼（grant_skill，暫時獲得「飛行」），
# 搭配升高平台、穿透射擊、居高射擊與狙擊，並接收被換下的升高平台（3C-6 再整理）。
# Phase 3D-8d：build_assassin 以瞬步背刺（shadowstep landing: behind）換下先發制人、以暗影突襲（shadowstep landing: choose ＋
# self_concealed）換下撕裂打擊（主動欄位已滿；撕裂打擊仍在 hero_fighter）；先發制人改由 build_gambler 的空欄位接收（3C-6 再整理）。
# Phase 3C-6b（整理）：念力投擲由 build_fire 搬到新的 build_telekinesis（念力流）；新增 build_wallburn（推牆焚燒：推擊改造 ＋ on_collision
# ＋ 油與火）與 build_detonator（狀態引爆：施加狀態 ＋ on_status_applied ＋ consume_status）。撞擊流（推擊改造 ＋ 撞擊 ＋ on_collision）
# 就是既有的 build_push（重踏、破城衝撞、裂骨印記、震地推倒），不另加；衝鋒流 build_charger 是位移（dash／leap／swap）主題。
# Phase 3F-3b：複合技能（AI 會用）——build_charger 以瞬影旋斬（傳送 → 錐形）換下颶風踢（颶風踢仍在 build_push 等）；build_push 以躍擊震地
# （跳躍 → 十字震地擊倒）換下盾擊（盾擊仍由敵方盾兵使用）。
# Phase 3F-4a：四種即時第二段的示範技能（AI 3F-4b 才會用，先裝在主動欄位有空位的地方，不改變既有戰鬥）——build_fire 加引力爆
# （聚集 → 範圍打擊）、build_striker 加破甲連擊（命中 → 加碼段）、build_bomber 加死亡迴旋（擊殺 → 接下一段）；回馬斬（動作 → 位移）
# 裝在單位範本 hero_fighter（近戰 build 的主動欄位都已滿）。
builds:
  - id: build_push
    name_zh: 位移流
    theme_zh: 把人踢下深淵、撞牆、推進冰窟；在深淵、岩漿、冰湖與高台有利，在沒有地形可利用的平原不利。
    hero:
      id: build_push
      name_zh: 位移流英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_gale_kick, skill_leap_slam, skill_blink, skill_parting_slash, skill_bloodlust, skill_arcane_blade, skill_heavy_stomp, skill_battering_ram, skill_fracture_mark, skill_quake_topple]

  - id: build_fire
    name_zh: 火焰流
    theme_zh: 點燃油與草叢、引爆油桶、範圍火焰；在油庫與森林有利，在雨天與冰湖（火會融冰）不利。
    hero:
      id: build_fire
      name_zh: 火焰流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_fire_bolt, skill_cinder_burst, skill_ashen_oath, skill_shatter_blast, skill_detonate_burning, skill_searing_scar, skill_ember_cycle, skill_ember_ward, skill_gravity_burst]

  - id: build_storm
    name_zh: 雷電／水流
    theme_zh: 雷電沿水擴散、召水與定身；在沼澤（水窪）有利，在乾燥的平原與走廊以外的地方沒有導體。
    hero:
      id: build_storm
      name_zh: 雷電流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: lightning_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_chain_lightning, skill_summon_tide, skill_frost_shackle, skill_conductive_strike, skill_twin_strike, skill_deep_freeze, skill_tide_snare, skill_arc_follow_up]

  - id: build_tank
    name_zh: 坦克
    theme_zh: 重擊、盾擊、嘲諷怒吼與守護結界，用嘲諷把敵人的攻擊吸到自己身上，再靠護盾與護甲扛住；在走廊（堵口）有利，在被遠程風箏的開闊地不利。
    hero:
      id: build_tank
      name_zh: 坦克英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      ai_profile: guard
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills:
        [skill_encircled_sweep, skill_shield_bash, skill_taunting_roar, skill_guardian_aegis, skill_sunder_strike, skill_armor_breaker, skill_thunder_hand, skill_grief_rage, skill_lingering_roar]

  - id: build_ranged
    name_zh: 遠程
    theme_zh: 穿透射擊、居高射擊與煙幕箭；在高台與開闊地有利，在視線破碎的森林與走廊不利。
    hero:
      id: build_ranged
      name_zh: 遠程英雄
      attributes: {str: 10, dex: 16, con: 12, int: 10, wis: 12, wil: 10}
      max_hp: 46
      speed: 5
      armor_bonus: 2
      weapon: bow
      tags: [hero, sim]
      max_mana: 24
      skills: [skill_piercing_shot, skill_high_ground_shot, skill_sniper_shot, skill_overwatch, skill_lucky_break, skill_time_surge, skill_armor_piercing_arrow, skill_timber_piercer, skill_covering_fire]

  - id: build_assassin
    name_zh: 刺殺
    theme_zh: 匕首的高暴擊、流血與處決；近身貼上殘血目標才發光，在視線被遮擋的森林有利，在空曠處容易被集火。
    hero:
      id: build_assassin
      name_zh: 刺殺英雄
      attributes: {str: 14, dex: 16, con: 12, int: 10, wis: 10, wil: 10}   # 匕首吃敏捷、技能吃力量
      max_hp: 50
      speed: 5
      armor_bonus: 2
      weapon: dagger
      ai_profile: flanker   # 3D-8c：移動時偏好夾擊位置
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_shadow_ambush, skill_execute, skill_blink, skill_fury_stance, skill_crippling_crit, skill_pincer_strike, skill_pick_off, skill_shadow_backstab, skill_ambush_stab]

  - id: build_support
    name_zh: 輔助
    theme_zh: 戰歌強化全隊、順風加速護衛、寒鎖定住逼近的敵人；自己不擅長殺敵，隊友越多、陣線越穩越發光。
    hero:
      id: build_support
      name_zh: 輔助英雄
      attributes: {str: 8, dex: 12, con: 10, int: 12, wis: 16, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: frost_staff
      ai_profile: support
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_war_hymn, skill_tailwind, skill_frost_shackle, skill_reflex_ward, skill_steady_breath, skill_rallying_cry, skill_mirror_cast, skill_life_drain]

  - id: build_healer
    name_zh: 治療
    theme_zh: 聖域範圍治療、再生持續回血、淨化解除負面，並以守護結界替最危險的同伴擋下一擊。
    hero:
      id: build_healer
      name_zh: 治療英雄
      attributes: {str: 8, dex: 12, con: 10, int: 12, wis: 16, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: frost_staff
      ai_profile: support
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_sanctuary, skill_renewal, skill_purify, skill_guardian_aegis, skill_second_wind, skill_resurrection, skill_beam_of_mercy, skill_self_mending, skill_holy_burst]

  - id: build_warlock
    name_zh: 術士
    theme_zh: 以咒印標記獵物，再用恐懼、沉默與黑霧削弱敵人的行動；站在遠處用負面狀態控制戰場。
    hero:
      id: build_warlock
      name_zh: 術士英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills:
        [skill_hex_bolt, skill_dread_gaze, skill_hush, skill_blinding_dark, skill_venom_cloud, skill_mark_detonation, skill_creeping_blight, skill_blessing_thief]

  - id: build_guardian
    name_zh: 守護者
    theme_zh: 嘲諷吸引火力、堅壁姿態減傷、挺身而出替隊友擋下單體攻擊，荊棘之膚讓貼身的攻擊者自己受傷；隊友越脆弱、被集火越兇越發光，單打獨鬥與被範圍技能轟炸時不利（Phase 2E-2，初值未經模擬）。
    hero:
      id: build_guardian
      name_zh: 守護者英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      ai_profile: guard
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_taunting_roar, skill_stand_firm, skill_bulwark_stance, skill_thorn_skin, skill_soul_bond, skill_vigil_call, skill_charging_strike, skill_shoulder_strike, skill_mountain_mover]

  - id: build_striker
    name_zh: 蓄力流
    theme_zh: 用靜電掌一下一下累積靜電，累積到足夠層數再以雷霆終結一次放出；被動餘燼烙印讓每次命中多一筆火焰傷害。蓄力與終結需要幾個回合的鋪陳，在能安穩輸出的地方發光，被貼身集火或沒有時間蓄力時不利（Phase 2E-3，初值未經模擬）。
    hero:
      id: build_striker
      name_zh: 蓄力流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: lightning_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_static_palm, skill_thunder_finisher, skill_overcurrent, skill_ember_brand, skill_cluster_bolt, skill_bloodwake_stride, skill_armor_break_combo]

  - id: build_trapper
    name_zh: 陷阱流
    theme_zh: 在敵人必經之處埋下灰燼地雷與捕獸夾，再用寒鎖拖住逼近的敵人讓陷阱有時間生效；敵人被迫走過狹窄通道時發光，在開闊地、敵人可以繞開時不利（Phase 2E-3，初值未經模擬）。
    hero:
      id: build_trapper
      name_zh: 陷阱流英雄
      attributes: {str: 8, dex: 14, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: archer
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_cinder_mine, skill_bear_trap, skill_frost_shackle, skill_sinkhole, skill_fleet_foot, skill_raise_skeleton, skill_afterimage_vow]

  - id: build_charger
    name_zh: 衝鋒流
    theme_zh: 猛虎衝撞一個箭步衝到敵人面前、打完再把他推飛撞牆；蠻牛衝陣選終點格直線衝過敵陣、沿途每個敵人各擲命中並撞倒（隊友讓路），騰躍越過人群與障礙脫離包圍，調虎離山與護衛換位把敵人換進險地或把隊友換出險境。地形越開闊越能衝，被定身或四面被圍死（沒有相鄰空格可衝）時不利（Phase 3D-2，初值未經模擬）。
    hero:
      id: build_charger
      name_zh: 衝鋒流英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 24
      skills: [skill_tiger_charge, skill_vault_leap, skill_decoy_swap, skill_guard_swap, skill_shadow_whirl, skill_bull_rush, skill_war_avatar]

  - id: build_banisher
    name_zh: 放逐流
    theme_zh: 放逐把敵人傳送到別處（運氣好時是深淵與岩漿），虛空互換把敵人換進包圍圈、把隊友換出險境。有深淵、岩漿與高低差的地圖最有用；火焰箭、咒印與裂地衝擊補足輸出（Phase 3D-2b，初值未經模擬）。
    hero:
      id: build_banisher
      name_zh: 放逐流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_banish, skill_void_swap, skill_fire_bolt, skill_hex_bolt, skill_shatter_blast, skill_blink, skill_counterspell]

  - id: build_summoner
    name_zh: 召喚師
    theme_zh: 召喚元素之靈與骷髏替自己打前線，立起戰意圖騰強化身邊的同伴；召喚物不佔勝負條件，敵人必須先處理它們；召喚物活得久（敵人分心、地形窄）時發光，被範圍傷害或快速集火時不利（Phase 3D-4b，初值未經模擬）。
    hero:
      id: build_summoner
      name_zh: 召喚師英雄
      attributes: {str: 8, dex: 12, con: 12, int: 16, wis: 14, wil: 12}
