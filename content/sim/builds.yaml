# 代表性 build（Phase 2C-3 5.3；docs/design/06-技能.md 6.8 的 build × 地圖類型矩陣）。
# 一個 build ＝ 一名英雄（屬性、HP、武器、行為模式、技能）。矩陣的我方隊伍 ＝ build 英雄 ＋
# companions（沒有技能的標準隊友），敵方是地圖的 encounter.enemies。
# 屬性、HP、護甲比照既有英雄範本（近戰＝戰士、法系＝法師／雷術士、遠程＝弓手），讓 build 之間的差異
# 主要來自技能；技能的 weapon_req 與武器分類必須相容（載入時檢查），所以部分技能依主題換成同武器
# 分類的技能（見 docs/phases/Phase2C-3報告.md）。
companions: [sim_companion_fighter, sim_companion_archer]
# Phase 2G-1：build_tank 加入破甲系（sunder_strike、armor_breaker）、build_assassin 加入狂怒姿態、build_warlock 加入毒雲與標記引爆、
# build_healer 加入再起（second_wind），讓每個手寫技能都被至少一名英雄或單位裝備（tests/content/test_coverage.py）。
# Phase 2G-2：新增 12 個示範技能（觸發時機、反應事件、連段、地形原語），分配給主題相符的 build（沒有新增 build，仍為 12 個）。
# Phase 3C-3a：build_push 加破城衝撞與裂骨印記（撞擊）、build_fire 加烈焰護身（on_cast_tag）、build_warlock 加蝕心追擊（on_status_applied）。
# Phase 3C-2：修正技能（kind: modifier，裝在被動欄位，上限 3）——build_push 加重踏、build_fire 加灼傷之痕與餘燼循環、
# build_tank 加雷之手（單手劍的物理普攻變成雷電，3C-5 再整理）。
builds:
  - id: build_push
    name_zh: 位移流
    theme_zh: 把人踢下深淵、撞牆、推進冰窟；在深淵、岩漿、冰湖與高台有利，在沒有地形可利用的平原不利。
    hero:
      id: build_push
      name_zh: 位移流英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_gale_kick, skill_shield_bash, skill_blink, skill_parting_slash, skill_bloodlust, skill_arcane_blade, skill_heavy_stomp, skill_battering_ram, skill_fracture_mark]

  - id: build_fire
    name_zh: 火焰流
    theme_zh: 點燃油與草叢、引爆油桶、範圍火焰；在油庫與森林有利，在雨天與冰湖（火會融冰）不利。
    hero:
      id: build_fire
      name_zh: 火焰流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_fire_bolt, skill_cinder_burst, skill_ashen_oath, skill_shatter_blast, skill_detonate_burning, skill_searing_scar, skill_ember_cycle, skill_ember_ward]

  - id: build_storm
    name_zh: 雷電／水流
    theme_zh: 雷電沿水擴散、召水與定身；在沼澤（水窪）有利，在乾燥的平原與走廊以外的地方沒有導體。
    hero:
      id: build_storm
      name_zh: 雷電流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: lightning_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_chain_lightning, skill_summon_tide, skill_frost_shackle, skill_conductive_strike, skill_twin_strike, skill_deep_freeze, skill_tide_snare]

  - id: build_tank
    name_zh: 坦克
    theme_zh: 重擊、盾擊、嘲諷怒吼與守護結界，用嘲諷把敵人的攻擊吸到自己身上，再靠護盾與護甲扛住；在走廊（堵口）有利，在被遠程風箏的開闊地不利。
    hero:
      id: build_tank
      name_zh: 坦克英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      ai_profile: guard
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills:
        [skill_bone_crusher, skill_shield_bash, skill_taunting_roar, skill_guardian_aegis, skill_sunder_strike, skill_armor_breaker, skill_thunder_hand]

  - id: build_ranged
    name_zh: 遠程
    theme_zh: 穿透射擊、居高射擊與煙幕箭；在高台與開闊地有利，在視線破碎的森林與走廊不利。
    hero:
      id: build_ranged
      name_zh: 遠程英雄
      attributes: {str: 10, dex: 16, con: 12, int: 10, wis: 12, wil: 10}
      max_hp: 46
      speed: 5
      armor_bonus: 2
      weapon: bow
      tags: [hero, sim]
      max_mana: 24
      skills: [skill_piercing_shot, skill_high_ground_shot, skill_smoke_arrow, skill_raise_perch, skill_lucky_break, skill_time_surge]

  - id: build_assassin
    name_zh: 刺殺
    theme_zh: 匕首的高暴擊、流血與處決；近身貼上殘血目標才發光，在視線被遮擋的森林有利，在空曠處容易被集火。
    hero:
      id: build_assassin
      name_zh: 刺殺英雄
      attributes: {str: 14, dex: 16, con: 12, int: 10, wis: 10, wil: 10}   # 匕首吃敏捷、技能吃力量
      max_hp: 50
      speed: 5
      armor_bonus: 2
      weapon: dagger
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_rending_strike, skill_execute, skill_blink, skill_fury_stance, skill_crippling_crit, skill_reckless_lunge]

  - id: build_support
    name_zh: 輔助
    theme_zh: 戰歌強化全隊、順風加速護衛、寒鎖定住逼近的敵人；自己不擅長殺敵，隊友越多、陣線越穩越發光。
    hero:
      id: build_support
      name_zh: 輔助英雄
      attributes: {str: 8, dex: 12, con: 10, int: 12, wis: 16, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: frost_staff
      ai_profile: support
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_war_hymn, skill_tailwind, skill_frost_shackle, skill_reflex_ward, skill_steady_breath, skill_rallying_cry, skill_mirror_cast]

  - id: build_healer
    name_zh: 治療
    theme_zh: 聖域範圍治療、再生持續回血、淨化解除負面，並以守護結界替最危險的同伴擋下一擊。
    hero:
      id: build_healer
      name_zh: 治療英雄
      attributes: {str: 8, dex: 12, con: 10, int: 12, wis: 16, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: frost_staff
      ai_profile: support
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_sanctuary, skill_renewal, skill_purify, skill_guardian_aegis, skill_second_wind, skill_undying_oath]

  - id: build_warlock
    name_zh: 術士
    theme_zh: 以咒印標記獵物，再用恐懼、沉默與黑霧削弱敵人的行動；站在遠處用負面狀態控制戰場。
    hero:
      id: build_warlock
      name_zh: 術士英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills:
        [skill_hex_bolt, skill_dread_gaze, skill_hush, skill_blinding_dark, skill_venom_cloud, skill_mark_detonation, skill_creeping_blight]

  - id: build_guardian
    name_zh: 守護者
    theme_zh: 嘲諷吸引火力、堅壁姿態減傷、挺身而出替隊友擋下單體攻擊，荊棘之膚讓貼身的攻擊者自己受傷；隊友越脆弱、被集火越兇越發光，單打獨鬥與被範圍技能轟炸時不利（Phase 2E-2，初值未經模擬）。
    hero:
      id: build_guardian
      name_zh: 守護者英雄
      attributes: {str: 16, dex: 12, con: 14, int: 10, wis: 10, wil: 10}
      max_hp: 60
      speed: 5
      armor_bonus: 4
      weapon: one_handed_sword
      ai_profile: guard
      resist: {physical: 100}
      tags: [hero, sim]
      max_mana: 20
      skills: [skill_taunting_roar, skill_stand_firm, skill_bulwark_stance, skill_thorn_skin, skill_soul_bond, skill_vigil_call]

  - id: build_striker
    name_zh: 蓄力流
    theme_zh: 用靜電掌一下一下累積靜電，累積到足夠層數再以雷霆終結一次放出；被動餘燼烙印讓每次命中多一筆火焰傷害。蓄力與終結需要幾個回合的鋪陳，在能安穩輸出的地方發光，被貼身集火或沒有時間蓄力時不利（Phase 2E-3，初值未經模擬）。
    hero:
      id: build_striker
      name_zh: 蓄力流英雄
      attributes: {str: 8, dex: 12, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: lightning_staff
      ai_profile: cunning
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_static_palm, skill_thunder_finisher, skill_ember_brand]

  - id: build_trapper
    name_zh: 陷阱流
    theme_zh: 在敵人必經之處埋下灰燼地雷與捕獸夾，再用寒鎖拖住逼近的敵人讓陷阱有時間生效；敵人被迫走過狹窄通道時發光，在開闊地、敵人可以繞開時不利（Phase 2E-3，初值未經模擬）。
    hero:
      id: build_trapper
      name_zh: 陷阱流英雄
      attributes: {str: 8, dex: 14, con: 10, int: 16, wis: 12, wil: 12}
      max_hp: 40
      speed: 5
      armor_bonus: 1
      weapon: fire_staff
      ai_profile: archer
      resist: {elemental: 150}
      tags: [hero, sim]
      max_mana: 40
      skills: [skill_cinder_mine, skill_bear_trap, skill_frost_shackle, skill_sinkhole, skill_fleet_foot]
