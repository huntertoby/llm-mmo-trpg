# 測試用物品（Phase 3G-G1；docs/design/08-裝備.md 8.23）。數值都是初值，未經模擬；不是掉落表。
#
# 欄位：id、name_zh、slot_type（weapon 武器／offhand 副手／head／body／hands／feet／neck／ring）、
#   weapon（武器類物品引用 weapons.yaml，基礎數值沿用武器資料）、paired（成對武器：占用副手）、
#   tags（例：shield）、legendary（傳說）、affixes（白名單 affixes.yaml 的 id ＋ 擲出的 value）。
# 頭、身體、手、腳、項鍊、戒指目前沒有基礎數值資料，基礎數值為 0（只有詞條）。
# G1 的測試物品只掛已結算的第 1、2、8 類詞條。
# 外觀（G5a，選填，只影響圖示）：kind 造型、form 形制、material 材質、dye 染色（只對布、皮）、style、rarity；
# 清單與預設見 equipment/appearance.yaml，關鍵字由詞條推導、不在這裡填。
items:
  # --- 主手 ---
  - id: item_test_sword
    name_zh: 試煉長劍
    slot_type: weapon
    kind: sword
    form: straight
    material: steel
    weapon: one_handed_sword
    affixes:
      - {affix: affix_attr_str, value: 2}
      - {affix: affix_cond_height_hit, value: 1}
  - id: item_test_hammer
    name_zh: 試煉戰錘
    slot_type: weapon
    kind: hammer
    form: warhammer
    material: iron
    weapon: hammer
    affixes:
      - {affix: affix_cond_low_hp_damage, value: 150}
      - {affix: affix_cost_glass}
  - id: item_test_bow
    name_zh: 試煉長弓
    slot_type: weapon
    kind: bow
    form: long
    material: wood
    weapon: bow
    affixes:
      - {affix: affix_max_hp, value: 8}
  - id: item_test_twin_daggers
    name_zh: 試煉雙匕首
    slot_type: weapon
    kind: dual_dagger
    form: stiletto
    material: steel
    weapon: dagger
    paired: true
    affixes:
      - {affix: affix_attr_str, value: 1}
  # --- 副手 ---
  - id: item_test_shield
    name_zh: 試煉圓盾
    slot_type: offhand
    kind: round_shield
    form: banded
    material: iron
    tags: [shield]
    affixes:
      - {affix: affix_max_hp, value: 8}
      - {affix: affix_attr_str, value: 1}
  # --- Phase 3I-2 副手本體（offhands.yaml；沒有詞條，只有副手的常駐特性）---
  - id: item_offhand_round_shield
    name_zh: 圓盾
    slot_type: offhand
    offhand: round_shield
    kind: round_shield
    form: wood
    material: wood
    tags: [shield]
  - id: item_offhand_tower_shield
    name_zh: 塔盾
    slot_type: offhand
    offhand: tower_shield
    kind: kite_shield
    form: tower
    material: iron
    tags: [shield]
  - id: item_offhand_tome
    name_zh: 法書
    slot_type: offhand
    offhand: tome
    kind: tome
    form: book
    material: leather
    tags: [tome]
  - id: item_offhand_orb
    name_zh: 法器珠
    slot_type: offhand
    offhand: orb
    kind: orb
    form: ball
    material: crystal
    tags: [orb]
  # --- 頭 ---
  - id: item_test_helm
    name_zh: 試煉頭盔
    slot_type: head
    kind: helmet
    form: horned
    material: iron
    affixes:
      - {affix: affix_cond_still_defense, value: 150}
      - {affix: affix_resist_fire, value: 100}
  # --- 身體 ---
  - id: item_test_armor
    name_zh: 試煉鎖甲
    slot_type: body
    kind: mail
    form: chain
    material: iron
    affixes:
      - {affix: affix_max_hp, value: 12}
      - {affix: affix_resist_fire, value: 150}
      - {affix: affix_cond_still_defense, value: 200}
  # --- 手 ---
  - id: item_test_gloves
    name_zh: 試煉手套
    slot_type: hands
    kind: leather_gloves
    form: short
    material: leather
    dye: brown
    affixes:
      - {affix: affix_attr_str, value: 1}
      - {affix: affix_max_hp, value: 4}
  # --- 腳 ---
  - id: item_test_boots
    name_zh: 試煉疾行靴
    slot_type: feet
    kind: boots
    form: tall
    material: leather
    dye: black
    affixes:
      - {affix: affix_cost_swift}
      - {affix: affix_max_hp, value: 4}
  # --- 項鍊 ---
  - id: item_test_amulet
    name_zh: 試煉血契項鍊
    slot_type: neck
    kind: pendant
    form: pendant
    material: silver
    affixes:
      - {affix: affix_cond_low_hp_damage, value: 100}
      - {affix: affix_cost_blood}
  # --- 戒指 ---
  - id: item_test_ring_fire
    name_zh: 試煉焰紋戒
    slot_type: ring
    kind: ring
    form: gem
    material: gold
    affixes:
      - {affix: affix_resist_fire, value: 150}
      - {affix: affix_cost_glass}
  - id: item_test_ring_str
    name_zh: 試煉力量戒
    slot_type: ring
    kind: ring
    form: signet
    material: silver
    affixes:
      - {affix: affix_attr_str, value: 2}
      - {affix: affix_cond_height_hit, value: 1}
  - id: item_test_ring_hp
    name_zh: 試煉生命戒
    slot_type: ring
    kind: ring
    form: plain
    material: copper
    affixes:
      - {affix: affix_max_hp, value: 16}
  # --- Phase 3G-G2：技能強化、普攻附加、武器特性強化 ---
  - id: item_g2_hammer
    name_zh: 震地戰錘
    slot_type: weapon
    weapon: hammer
    kind: hammer
    form: warhammer
    material: iron
    affixes:
      - {affix: affix_trait_hammer_knockback}
      - {affix: affix_kw_prone_damage, value: 100}
      - {affix: affix_attack_mark}
  - id: item_g2_amulet
    name_zh: 引雷項鍊
    slot_type: neck
    kind: pendant
    form: pendant
    material: silver
    affixes:
      - {affix: affix_kw_shock_area}
      - {affix: affix_kw_burn_duration}
  # --- Phase 3G-G3a：觸發與充能 ---
  - id: item_g3a_blade
    name_zh: 蓄電長劍
    slot_type: weapon
    kind: sword
    form: straight
    material: steel
    weapon: one_handed_sword
    affixes:
      - {affix: affix_trig_every3_prone}
      - {affix: affix_charge_static}
  - id: item_g3a_armor
    name_zh: 怒焰荊棘甲
    slot_type: body
    kind: mail
    form: chain
    material: iron
    affixes:
      - {affix: affix_trig_thorns_burn}
      - {affix: affix_charge_fury}
  - id: item_g3a_ring
    name_zh: 嗜戰戒指
    slot_type: ring
    kind: ring
    form: signet
    material: copper
    affixes:
      - {affix: affix_trig_kill_ap}
  # --- Phase 3G-G3b：授予動作（第 9 類）、授予反應（第 10 類）、改變規則（第 11 類，傳說）---
  - id: item_g3b_hook_gauntlets
    name_zh: 鉤爪護手
    slot_type: hands
    kind: gauntlets
    form: plate
    material: steel
    affixes:
      - {affix: affix_act_grapple}
      - {affix: affix_act_smoke}
  - id: item_g3b_bulwark_shield
    name_zh: 壁壘塔盾
    slot_type: offhand
    kind: kite_shield
    form: tower
    material: steel
    tags: [shield]
    affixes:
      - {affix: affix_act_shield_wall}
      - {affix: affix_react_ranged_block}
  - id: item_g3b_guard_mail
    name_zh: 護衛鎖甲
    slot_type: body
    kind: mail
    form: chain
    material: iron
    affixes:
      - {affix: affix_react_guard_ally}
  - id: item_g3b_sniper_helm
    name_zh: 哨兵頭盔
    slot_type: head
    kind: helmet
    form: iron
    material: steel
    affixes:
      - {affix: affix_react_double_overwatch}
  - id: item_g3b_legend_ember
    name_zh: 慈焰項鍊
    slot_type: neck
    kind: pendant
    form: pendant
    material: gold
    rarity: legendary
    legendary: true
    affixes:
      - {affix: affix_rule_fire_mends}
  - id: item_g3b_legend_titan
    name_zh: 移山項鍊
    slot_type: neck
    kind: pendant
    form: pendant
    material: gold
    rarity: legendary
    legendary: true
    affixes:
      - {affix: affix_rule_move_any_object}
  - id: item_g3b_legend_wake
    name_zh: 血痕項鍊
    slot_type: neck
    kind: pendant
    form: tag
    material: gold
    rarity: legendary
    legendary: true
    affixes:
      - {affix: affix_rule_bleeding_wake}
  # --- Phase 3-32a 普攻流對照模擬用（不是掉落表；數值為初值）---
  - id: item_sim_attack_bow
    name_zh: 連擊長弓
    slot_type: weapon
    kind: bow
    form: long
    material: wood
    weapon: bow
    affixes:
      - {affix: affix_attack_combo, value: 3}
      - {affix: affix_attack_cleave}
      - {affix: affix_trait_bow_high_range}
  # --- Phase 3-33f2 召喚專用詞條（測試／模擬用，不是掉落表；數值為初值）---
  - id: item_sim_summon_orb
    name_zh: 喚靈法珠
    slot_type: offhand
    kind: orb
    form: ball
    material: crystal
    tags: [orb]
    affixes:
      - {affix: affix_summon_cooldown}
      - {affix: affix_summon_duration}
  - id: item_sim_summon_pendant
    name_zh: 獻靈項鍊
    slot_type: neck
    kind: pendant
    form: pendant
    material: silver
    affixes:
      - {affix: affix_summon_sacrifice, value: 200}
      - {affix: affix_trig_summon_blast}
  - id: item_sim_summon_ring
    name_zh: 安魂戒
    slot_type: ring
    kind: ring
    form: gem
    material: gold
    affixes:
      - {affix: affix_trig_summon_mend}
      - {affix: affix_summon_sacrifice, value: 200}
  - id: item_sim_summon_blade
    name_zh: 傳承長劍
    slot_type: weapon
    kind: sword
    form: straight
    material: steel
    weapon: one_handed_sword
    affixes:
      - {affix: affix_attack_mark}
      - {affix: affix_summon_inherit_attack}
