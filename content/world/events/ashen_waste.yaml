# 灰燼荒原事件骨架（Phase 5F-5a；schema：src/trpg/content/world_events.py）。
# 來源：docs/design/19-灰燼荒原與賽季主線.md 19.4（15 個骨架；#85、#89；#118 玩法 PM 代決、待使用者確認）＋
# 19.3「角魔古祭壇：機遇（帶點燃技能、在晴天正午來此）」寫成骨架 16（同雲嶺骨架 12 雷雨中的古松祭壇）。
# 欄位對照 19.4：who／want／obstacle／stakes＝誰／想要什麼／阻礙／賭注；solutions＝可選解法；threads＝事件結果可能留下的線頭。
# 寫法同 events/cloud_ridge.yaml（18 雲嶺）。開發 PM 自定（代決 5F5a-*）：所有 ID；locations、day_phase、weather
# （19.4 沒寫出現地點，依 19.3「內容」欄與骨架文字推定）；線頭 scope 全部 personal；交涉付出的東西都用補給代替。
# 城鎮是安全區：有戰鬥解法的骨架不在餘燼集出現（載入檢查）；餘燼集只有骨架 15。
# 只留線頭、不做機制的（代決 5F5a-9）：冷卻井「附近 3 個地點變成有水」、鐵匠的配方碼、小犬同伴。
# 屬性：str 力量、dex 敏捷、con 體質、int 智力、wis 感知、wil 意志。
region: ashen_waste
skeletons:
  - id: laotie_dig
    number: 1
    art: chest
    who_zh: 拾荒者老鐵
    want_zh: 挖出埋在灰裡的舊機械
    obstacle_zh: 餘燼蜥巢
    stakes_zh: 一件舊零件
    locations: [old_iron_post, scorched_outskirts]
    npcs: [scavenger_laotie]
    solutions:
      - {kind: combat, threads: [laotie_knows_valley]}
      - {kind: situation, attributes: [int], note_zh: 機關（安全拆出）}
    threads:
      - id: laotie_knows_valley
        aliases_zh: [黑曜谷, 老鐵知道]
        text_zh: 老鐵知道黑曜谷在哪
        npc: scavenger_laotie
        hints_location: obsidian_valley
  - id: water_caravan
    number: 2
    art: caravan
    who_zh: 迷路的運水隊
    want_zh: 把水送到灰井村
    obstacle_zh: 灰燼犬
    stakes_zh: 村落的水源
    locations: [ash_mire, old_iron_post]
    solutions:
      - {kind: combat, note_zh: 護送戰（撤離）, objective: escape, threads: [ash_well_owes_you]}
      - {kind: situation, attributes: [wis], note_zh: 追蹤（找捷徑）}
    threads:
      - {id: ash_well_owes_you, text_zh: 灰井村欠你人情, aliases_zh: [灰井村的人情]}
  - id: ashen_deserter
    number: 3
    art: ambush
    who_zh: 斷崖幫逃兵
    want_zh: 回雲嶺
    obstacle_zh: 追兵
    stakes_zh: 運輸路線情報
