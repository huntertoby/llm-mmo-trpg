# 雲嶺事件骨架（Phase 5B-1；docs/phases/Phase5計畫.md 8.3）。schema：src/trpg/content/world_events.py。
# 來源：docs/design/18-雲嶺內容.md 18.4（18 個骨架；#85、#89；#111 玩法 PM 代決、待使用者確認）。
# 欄位對照 18.4：who／want／obstacle／stakes＝誰／想要什麼／阻礙／賭注；solutions＝可選解法
# （combat 戰鬥、situation 情境判定〔attributes＝允許的屬性〕、parley 交涉、abandon 放棄、opportunity 機遇）；
# threads＝事件結果可能留下的線頭（9.6.7 #6；線頭只能由事件結果產生，5B-2／5B-4）。
# 開發 PM 自定（代決 5B1-1、5B1-5）：所有 ID；locations、day_phase、weather（18.4 沒寫出現地點，
# 依 18.3「內容」欄與骨架文字推定）；線頭 scope 全部 personal；「雷雨」＝ rain ＋ night。
# 屬性：str 力量、dex 敏捷、con 體質、int 智力、wis 感知、wil 意志。
region: cloud_ridge
