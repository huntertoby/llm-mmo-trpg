# 情境判定的規則（Phase 5B-2；docs/phases/Phase5計畫.md 9.4）。schema：src/trpg/content/world_situations.py。
# 來源：docs/design/09-世界與敘事.md 9.6.4（±2、用心清單最多 +2、種族 +1、三段結果、獎懲有預算上限、
# 失敗懲罰依危險度分級）、9.6.11 #115（方法 12 類與常見屬性、10 族 +1；玩法 PM 代決、待使用者確認）。
# 開發 PM 定的初值（之後用模擬定，9.6.10「數值類」）：partial_margin、budget、dangers、exchange_supplies。
# - check：dc_shift_max／care_max／race_bonus 只能比 9.6.4 嚴，不能放寬（schema 上限 2／2／1）。
# - budget：等級 xp 預算 ＝ xp_base ＋ xp_per_level × 地點建議等級（一場戰鬥 100 xp，見 roguelite.yaml）；
#   模板的 xp_permille 乘這個預算。threads_max 照 9.6.7 #6「事件結束留 0～2 條線頭」。
# - dangers：危險度 1～3 允許的懲罰（supplies 失去補給、debuff 下一場戰鬥帶 debuff、hurt 受傷、
#   reinforce 下一場戰鬥敵人增援）與受傷上限（最大 HP 的 ‰）。
# - exchange_supplies：用心清單 ③「提出拿得出來的交換條件」拿補給出來時花掉的量。
methods:
  - {id: force, name_zh: 力取, attributes: [str]}
  - {id: climb, name_zh: 攀爬跳躍, attributes: [str, dex]}
  - {id: stealth, name_zh: 潛行, attributes: [dex]}
  - {id: finesse, name_zh: 靈巧, attributes: [dex]}
  - {id: endurance, name_zh: 耐力, attributes: [con]}
  - {id: lore, name_zh: 學識, attributes: [int]}
  - {id: mechanism, name_zh: 機關, attributes: [int]}
  - {id: notice, name_zh: 察覺, attributes: [wis]}
  - {id: tracking, name_zh: 追蹤, attributes: [wis]}
  - {id: parley, name_zh: 交涉, attributes: [wil]}
  - {id: intimidate, name_zh: 威嚇, attributes: [wil, str]}
  - {id: uncanny, name_zh: 異象, attributes: [wil]}
race_methods:
  human: lore
  elf: notice
  fox: parley
  dragonkin: intimidate
  dwarf: mechanism
  cyborg: finesse
  orc: force
  fiend: uncanny
  scalefolk: stealth
  seafolk: endurance
check:
  dc_shift_max: 2
  partial_margin: 5
  care_max: 2
  race_bonus: 1
budget:
  xp_base: 20
  xp_per_level: 10
  supplies_max: 2
  threads_max: 2
  buffs_max: 1
  reveals_max: 1
dangers:
  - {level: 1, penalties: [supplies, debuff], hurt_max_permille: 0}
  - {level: 2, penalties: [supplies, debuff, hurt], hurt_max_permille: 250}
  - {level: 3, penalties: [supplies, debuff, hurt, reinforce], hurt_max_permille: 400}
exchange_supplies: 1
