# 說書人的降級模板與各區語氣（Phase 5B-3；docs/phases/Phase5計畫.md 15.4）。schema：src/trpg/content/world_narration.py。
# 用途：本機模型不可用、或說書人的輸出一直不合法時，用這裡的模板文字代替（docs/專案計畫.md 3.1「模型不可用時遊戲要能降級」）。
# tones：給說書人的區域語氣（docs/design/09-世界與敘事.md 9.6.10 #107、#127：旁白簡潔具體、短句少形容詞；雲嶺東方，只有青霧觀修士用文言）。
# 區域 ID 照 content/regions.yaml 或地點圖；晶冠、樞市、海境還沒有地點圖，先放著給之後的區用（6L-1 C4）。
# 佔位符：{who} 骨架的誰、{want} 想要、{obstacle} 阻礙、{stakes} 賭注、{location} 地點名、{approach} 情境模板的說明、{name} NPC 名。
# 開發 PM 定（代決 5B3-7），之後可改；改了只動這個檔。
tones:
  capital: 中性奇幻城邦：清楚、略帶莊重；各區來的人照自己的口音
  cloud_ridge: 東方山城：短句白話；只有青霧觀修士用文言、稱人『施主』，盜賊、獵人、商人、村民說白話
  ashen_waste: 粗獷：短句、口語，常用廢鐵、灰燼與火的比喻；拾荒者與盜賊說話直白（5F-5a，開發 PM 定）
  crystal_crown: 奇幻城邦：典雅清楚，帶一點騎士與法師的禮節；不用文言
  arcane_hub: 機械感：短句、精確，常用齒輪、黃銅、晶能與符文的比喻；工匠說話講效率
  frost_tide: 航海口語：爽快直接，常用潮汐、風向、船與冰的比喻；水手說話帶吆喝
event_text: 在{location}，{who}擋在你面前。
event_more: '{who}想要{want}。擋在中間的是{obstacle}。賭上的是{stakes}。'
event_more_no_obstacle: '{who}想要{want}。賭上的是{stakes}。'
situation_text: '{who}的事還沒了結。你打算{approach}。'
situation_more: 賭上的是{stakes}。
outcome_text:
  success: '{approach}，成了。'
  partial: '{approach}，只成了一半。'
  failure: '{approach}，沒有成。'
chat_text: '{name}看了你一眼，沒有多說。'
