# 大世界規則的數值（Phase 5A-2；docs/phases/Phase5計畫.md 6.4）。schema：src/trpg/content/world_rules.py。
# 全部是開發 PM 定的初值（Phase 5 計畫 Q2、D10），之後用模擬定（docs/design/09-世界與敘事.md 9.6.10「數值類」）；
# 改數值只改這裡，不改程式。規則本身在 trpg.world（移動、遇敵、感知判定、紮營、天氣）。
# - supplies：補給上限與新角色帶的量（9.6.7 #11「野外紮營要用，用完只能回城補」）。
# - camp_cost：紮營（＝營火）花的補給（9.6.11 #114「花 1 補給紮營」）。
# - hasten：趕路花的補給與遇敵機率倍率 ‰（9.6.7 #9「可花補給趕路降低遇敵機率」）。
# - encounter：每一步的遇敵機率 ‰ ＝ min(max, base ＋ per_level ×（目的地建議等級 − 1））；
#   城鎮、傳送點為 0（9.6.7 #9「越危險的區越高」）。
# - perception：隱藏地點感知判定 DC ＝ dc_base ＋ 建議等級 ÷ level_divisor（捨去；9.6.11 #112）。
# - weather：各區每半天的天氣權重（9.6.10 #104；05 5.1「各區天氣傾向」：傾向的天氣權重 3、其他 1；
#   day／night 是遊戲日的前半與後半）。天氣 ID 見 weather.yaml。沒列的區用 default_weather。
supplies:
  max: 10
  start: 5
camp_cost: 1
hasten:
  cost: 1
  encounter_permille: 500
encounter:
  base_permille: 150
  per_level_permille: 30
  max_permille: 500
perception:
  dc_base: 10
  level_divisor: 2
default_weather:
  day: {clear: 1}
  night: {night: 1}
weather:
  # 晶冠城邦：晴、夜
  - region: crystal_crown
    day: {clear: 3, rain: 1, fog: 1}
    night: {night: 3, rain: 1, fog: 1}
  # 雲嶺：霧、雨
  - region: cloud_ridge
    day: {clear: 1, rain: 3, fog: 3}
    night: {night: 1, rain: 3, fog: 3}
  # 魔導樞市：夜、雨
  - region: arcane_hub
    day: {clear: 1, rain: 3, fog: 1}
    night: {night: 3, rain: 3, fog: 1}
  # 灰燼荒原：晴、霧
  - region: ashen_waste
    day: {clear: 3, rain: 1, fog: 3}
    night: {night: 1, rain: 1, fog: 3}
  # 霜潮海境：雨、霧
  - region: frost_tide
    day: {clear: 1, rain: 3, fog: 3}
    night: {night: 1, rain: 3, fog: 3}
