# 雲嶺的聊天內容、事件好感度與酒館傳聞（Phase 5B-4；docs/phases/Phase5計畫.md 16.4、16.5）。
# schema：src/trpg/content/world_quests.py。
# 級別（玩法 PM 定，2026-11-03，照 #85 2a）：中立給一般傳聞、友善給隱藏任務入口、信賴才說人設卡的祕密
# （例：渡婆婆說出暗門）。內容取自 18.4、18.5（#111 待使用者確認）；文字、事件好感度數值、傳聞池是開發 PM
# 定（代決 5B4-3、5B4-13）。聊天與傳聞只是資訊：不給線頭、不揭露地點、不給道具經驗（9.6.7 #3、#6）。
region: cloud_ridge
talk:
  # 渡婆婆（鎮長）
  - {id: granny_du_rumor, npc: granny_du, rank: neutral, kind: rumor, text_zh: 夜裡鎮上有燈籠隊在找失蹤的人，失蹤的都往山裡去了}
  # 信賴說出祕密時解鎖骨架 22「渡婆婆的往事」（18.7.7）；暗門的線頭只由那個事件的結果給（#85）
  - {id: granny_du_secret, npc: granny_du, rank: trusted, kind: secret, unlocks_skeleton: granny_past, text_zh: 她年輕時是斷崖幫的人，提到斷崖幫的舊帳就欲言又止}
  # 柳掌櫃（商人）
  - {id: liu_rumor, npc: shopkeeper_liu, rank: neutral, kind: rumor, text_zh: 雷雨夜的古松祭壇不太平，聽說有人在那兒撿到怪東西}
  - {id: liu_cave_entry, npc: shopkeeper_liu, rank: friendly, kind: quest_entry, quest: hidden_elixir_cave, text_zh: 藥師谷的谷底似乎還有一處洞窟，沒人敢進去，他想知道裡面還有沒有丹砂}
  - {id: liu_secret, npc: shopkeeper_liu, rank: trusted, kind: secret, text_zh: 他一直偷偷收購源晶碎片，連斷崖幫都和他做過買賣}
  # 青崖道長（技能導師）
  - {id: qingya_rumor, npc: daoist_qingya, rank: neutral, kind: rumor, text_zh: 觀裡為了源晶要不要交給官府，吵了好幾天}
  - {id: qingya_secret, npc: daoist_qingya, rank: trusted, kind: secret, text_zh: 他其實想離開道觀，只是放心不下這些弟子}
  # 阿岳（獵戶）
  - {id: ayue_rumor, npc: hunter_ayue, rank: neutral, kind: rumor, text_zh: 北坡的狼最近被什麼東西趕下山，連熊都不安分}
  - {id: ayue_secret, npc: hunter_ayue, rank: trusted, kind: secret, text_zh: 他的父親死在源晶裂痕，他一直想進去找父親的遺物}
  # 小蓮（道童）
  - {id: xiaolian_rumor, npc: acolyte_xiaolian, rank: neutral, kind: rumor, text_zh: 觀裡的師兄們最近常吵架，有人半夜偷偷下山}
  - {id: xiaolian_secret, npc: acolyte_xiaolian, rank: trusted, kind: secret, text_zh: 她偷看過觀主修煉，觀主身上纏著源晶的光}
  # 霧鎖真人（觀主、Boss）
  - {id: mistlock_rumor, npc: mistlock_master, rank: neutral, kind: rumor, text_zh: 雲頂觀的霧一年比一年濃，觀主很久沒下山了}
  - {id: mistlock_secret, npc: mistlock_master, rank: trusted, kind: secret, text_zh: 他想借源晶的力量飛升}
  # 疤面（斷崖幫二當家）
  - {id: scarface_rumor, npc: scarface, rank: neutral, kind: rumor, text_zh: 斷崖幫最近在運一批東西出山，要走藥師谷那條路}
  - {id: scarface_secret, npc: scarface, rank: trusted, kind: secret, text_zh: 他和柳掌櫃一直有交易，碎片就是賣給柳掌櫃的}
  # 霜音（白狐）
  - {id: frost_chime_rumor, npc: frost_chime, rank: neutral, kind: rumor, text_zh: 狐火在霧裡會指路，跟著走的人不一定回得來}
  - {id: frost_chime_secret, npc: frost_chime, rank: trusted, kind: secret, text_zh: 她親眼見過裂痕裡的異象，說那裡面有「我們」}

