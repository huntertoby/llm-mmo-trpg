# 霧渡鎮酒館的傳聞池（9.6.7 #1：指向機遇或隱藏地點的線索；開發 PM 定，代決 5B4-13）。只是文字。
rumors:
  - {id: rumor_storm_altar, skeleton: storm_altar, text_zh: 有人說雷雨夜站在古松祭壇旁，帶著雷的招式會跟著發光}
  - {id: rumor_poison_spring, skeleton: poison_spring, text_zh: 藥師谷的毒泉後面好像還有路，只是沒人撐得過那陣毒霧}
  - {id: rumor_tomb_sword, skeleton: tomb_sword, text_zh: 劍冢裡有把殘劍拔不出來，聽說有個劍客一直在找它}
  - {id: rumor_north_slope, location: north_slope, text_zh: 北坡獵場出了一頭狼王，眼睛紅得像火}
  - {id: rumor_bear_den, skeleton: bear_den, text_zh: 冬湖邊的熊巢底下會發光，獵戶都不敢靠近}
  - {id: rumor_crystal_rift, location: crystal_rift, text_zh: 源晶裂痕這陣子霧特別濃，常有霧魅從裡面爬出來}
