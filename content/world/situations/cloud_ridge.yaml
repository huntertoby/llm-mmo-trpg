# 雲嶺情境模板（Phase 5B-2；docs/phases/Phase5計畫.md 10.3）。schema：src/trpg/content/world_situations.py。
# 來源：docs/design/18-雲嶺內容.md 18.4 每個「情境判定」解法一個模板（skeleton＋solution＝骨架與解法索引，0 起）。
# - attributes：開頭＝18.4 解法的屬性；第 2 種照 18.4「補充」（玩法 PM 定）：從 09 9.6.11 方法表同一類的
#   常見屬性補，不夠再補一個主題不同的屬性。methods：每個屬性都有一個方法能用（9.6.11 #115）。
# - 開發 PM 定的初值（代決 5B2-9，之後模擬定）：base_dc（約 10＋地點建議等級的一半）、danger、weaknesses
#   （用心清單 ④，照骨架的阻礙推定）、三段獎懲、哪個結果留哪條線頭。
# - 獎懲必須在 situation_rules.yaml 的預算與危險度內（載入時檢查）；xp_permille 乘地點的等級 xp 預算。
# - advantage_threads：18.4 補充「斷崖幫寨的暗門」持有時，骨架 14 的偷走得到優勢（玩法 PM 定）。
# 狀態 ID：buff empowered／guarded／rallied；debuff weaken／poison／bleed（statuses.yaml）。
