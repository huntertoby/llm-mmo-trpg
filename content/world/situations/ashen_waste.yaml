# 灰燼荒原情境模板（Phase 5F-5a；schema：src/trpg/content/world_situations.py）。
# 來源：docs/design/19-灰燼荒原與賽季主線.md 19.4 每個「情境判定」解法一個模板（skeleton＋solution＝骨架與解法索引，0 起）。
# 寫法同 situations/cloud_ridge.yaml：attributes 開頭＝19.4 解法的屬性，第 2 種從 09 9.6.11 方法表同一類的常見屬性補；
# methods 每個屬性都有一個方法能用（9.6.11 #115）。開發 PM 定的初值（之後模擬定）：base_dc（約 10＋地點建議等級的一半）、
# danger、weaknesses（用心清單 ④，照骨架的阻礙推定）、三段獎懲、哪個結果留哪條線頭。
# 獎懲必須在 situation_rules.yaml 的預算與危險度內（載入時檢查）；xp_permille 乘地點的等級 xp 預算。
# 狀態 ID：buff empowered／guarded／rallied；debuff weaken／poison／bleed（statuses.yaml）。
region: ashen_waste
templates:
  - id: laotie_disarm
    skeleton: laotie_dig
    solution: 1
    note_zh: 繞開蜥巢，把舊機械安全拆出來
    methods: [mechanism, finesse]
    attributes: [int, dex]
    base_dc: 13
    danger: 2
    weaknesses:
      - {id: lizards_sleep_in_heat, text_zh: 餘燼蜥白天熱的時候都窩在巢裡不動, methods: [mechanism, finesse], aliases_zh: [窩在巢裡, 蜥蜴在睡]}
    success: {rewards: {xp_permille: 1000, supplies: 1, threads: [laotie_knows_valley]}}
    partial:
      rewards: {xp_permille: 500, threads: [laotie_knows_valley]}
      penalties: {hurt_permille: 100}
    failure: {penalties: {hurt_permille: 200, debuffs: [weaken]}}

