# 灰燼荒原遭遇表（Phase 5F-5a；schema：src/trpg/content/world_encounters.py）。
# 來源：docs/design/19-灰燼荒原與賽季主線.md 19.2（熔岩獸群、精英、詞綴、遠程上限 2、陣容例、中立族群與混族例）、
# 19.3「內容」欄（各地點出現誰）、19.8（懸賞陣容在 world/season.yaml）；#118 玩法 PM 代決、待使用者確認。
# 規則：09 9.6.6（混族、每場遠程上限、一般營地有機率混進 1 名精英、精英巢穴固定有精英）。
# 陣容、權重與機率是開發 PM 的初值（docs/phases/Phase5計畫.md 39.3），未經大量模擬。
# OB-7（#155，09 9.6.6「遭遇大小」）：巡邏（路邊）2 名、駐守與固定戰（地點戰）2～3 名，精英巢穴、懸賞、Boss 照原設計
# （歸類表 docs/phases/PhaseOB-7遭遇歸類.md）。
# - 三方混戰（third）：19.2.2「熔岩獸群攻擊盜賊的運輸隊，玩家可以選邊」、19.6.1 第 4 步「熔岩獸群、盜賊、祭司的護衛」
#   （引擎只有一個第三方：熔岩獸群與盜賊放同一邊，代決 5F5a-7）。
# - objective（5F-5a）：三村落的移動遇敵是守點戰（19.9 #2「每村一場守點戰」；地圖支援時，代決 5F5a-4）。
# - armor_mods（5F-5a）：灰燼之心的護甲。雲嶺骨架 14 的世界線頭「碎片被送往灰燼荒原」到期（世界旗標 ashen_heart_hardened）+1；
#   每攔下 1 批碎片 −1（主線第 2 步攔截成功的劇情旗標、荒原骨架 13 的線頭；合計 −3～+1，19.4、代決 5F5a-5）。
region: ashen_waste
ranged_cap: 2
camp_elite_permille: 100
affixes: [regenerating, berserk, blazing, hard_shelled]

groups:
  # 熔岩獸群（19.2.1）
  - {id: lizard_swarm, name_zh: 餘燼蜥群, units: [ember_lizard, ember_lizard, ember_lizard]}
  - {id: hound_pack, name_zh: 灰燼犬群, units: [ash_hound, ember_lizard]}
  - {id: lizard_brood, name_zh: 熔爐母獸與蜥群, units: [furnace_matriarch, ember_lizard]}   # 陣容例
  - {id: beetle_line, name_zh: 甲蟲與噴岩龜, units: [lava_beetle, lava_tortoise]}                        # 陣容例
  - {id: colossus_smoke, name_zh: 巨像與硫煙, units: [scorched_colossus, sulfur_beast]}             # 陣容例
  - {id: deadwood_sulfur, name_zh: 枯木林的硫煙, units: [sulfur_beast, sulfur_beast, ash_hound]}
  - {id: mire_slugs, name_zh: 灰泥沼的蛞蝓, units: [magma_slug, magma_slug, ember_lizard]}
  - {id: mire_mix, name_zh: 沼上的熔岩獸, units: [magma_slug, fire_dust_bat]}
  - {id: well_guardians, name_zh: 冷卻井邊的熔岩獸, units: [magma_slug, lava_beetle, ember_lizard]}
  - {id: tar_tortoises, name_zh: 焦油坑的噴岩龜, units: [lava_tortoise, ember_lizard, ember_lizard]}
  # RG-1（#162，19.2.1「加深內容」）：熔殼甲兵站在噴岩龜前面擋遠程；加在現有地點，原陣容不動
  - {id: tar_shell_line, name_zh: 熔殼與噴岩龜, units: [molten_shell_trooper, lava_tortoise, ember_lizard]}
  - {id: cave_shell_line, name_zh: 洞窟熔殼陣, units: [molten_shell_trooper, lava_tortoise]}
  - {id: tar_brood, name_zh: 焦油坑的母獸, units: [furnace_matriarch, ember_lizard, ash_hound]}
  - {id: cave_beetles, name_zh: 熔岩洞窟的甲蟲, units: [lava_beetle, thunder_shell_beetle, lava_tortoise]}
  - {id: cave_lord, name_zh: 熔核領主的熔岩池, units: [molten_lord, ember_lizard, ember_lizard]}                  # 精英（19.3）
  - {id: obsidian_frost, name_zh: 寒燼蜥群, units: [frost_ember_lizard, frost_ember_lizard, ember_lizard]}
  - {id: obsidian_mix, name_zh: 黑曜谷的異種, units: [frost_ember_lizard, thunder_shell_beetle, fire_dust_bat]}
  - {id: fortress_beasts, name_zh: 要塞裡的熔岩獸, units: [scorched_colossus, lava_beetle]}
  # 中立族群（19.2.2）：斷崖幫荒原分隊、野獸、源晶失控造物
  - {id: scavenger_beasts, name_zh: 哨站外的野獸, units: [ash_hound, scorched_stoneback]}
  - {id: convoy_guard, name_zh: 斷崖幫運輸隊, units: [bandit, bandit_shieldbearer, ashen_gunner]}
  - {id: convoy_raid, name_zh: 獸群襲擊運輸隊, units: [ember_lizard, ash_hound, ash_hound], third: [bandit, ashen_gunner]}  # 三方：玩家可以選邊
  - {id: overseer_crew, name_zh: 督工營的鐵鍊隊, units: [bandit, lava_beetle, ashen_gunner]}   # 混族例：盜賊用鐵鍊牽著熔岩甲蟲
  - {id: overseer_guard, name_zh: 督工營的守衛, units: [bandit_shieldbearer, bandit, lava_beetle]}
  - {id: fortress_bandits, name_zh: 要塞裡的斷崖幫, units: [scorched_colossus, bandit, ashen_gunner]}
  - {id: altar_wraiths, name_zh: 祭壇的熔晶魅, units: [molten_wraith, molten_wraith, horned_zealot]}
  # 主線第 2 章第 4 步「赫琳的背叛」（19.6.1：熔岩獸群、盜賊、祭司的護衛三方混戰）
  - {id: altar_betrayal, name_zh: 赫琳的背叛, units: [horned_zealot, horned_zealot, molten_wraith], third: [ember_lizard, ember_lizard, bandit]}
  # 三村落的守點戰（19.9 #2「熔岩潰堤」）
  - {id: village_raid_light, name_zh: 衝進赤沙村的熔岩獸, units: [ember_lizard, ember_lizard, ash_hound]}
  - {id: village_raid_mid, name_zh: 衝進灰井村的熔岩獸, units: [lava_beetle, ember_lizard, fire_dust_bat]}
  - {id: village_raid_heavy, name_zh: 衝進鐵爐村的熔岩獸, units: [lava_beetle, ash_hound, lava_tortoise]}
  # 懸賞（19.8；精英由 world/season.yaml 的懸賞排在最前）
  - {id: forge_scar_band, name_zh: 鍛疤的鐵鍊隊, units: [bandit, lava_beetle, ashen_gunner]}
  - {id: molten_lord_band, name_zh: 熔核領主的熔岩池, units: [ember_lizard, ember_lizard, lava_tortoise]}
  - {id: frost_king_band, name_zh: 寒燼蜥王的巢, units: [frost_ember_lizard, frost_ember_lizard]}
  # 線頭「母獸的後代在擴散」到期（19.4 骨架 7）：焦油坑多一隻餘燼蜥（打贏那一場結束）
  - {id: brood_spread, name_zh: 擴散的蜥群, units: [furnace_matriarch, ember_lizard, ember_lizard]}
  # 熔心坑 Boss 戰（19.2.3；20.6：餘燼蜥 ×2 在核心兩側，Boss 地圖 molten_heart_pit 的站位依這個順序）
  - {id: ashen_heart_court, name_zh: 灰燼之心, units: [ashen_heart, heart_ember_lizard, heart_ember_lizard]}

locations:
  - location: scorched_outskirts
    groups: [{group: lizard_swarm}, {group: hound_pack}]
  - location: old_iron_post
    groups: [{group: scavenger_beasts}]
  - location: deadwood_forest
    groups: [{group: deadwood_sulfur, weight: 2}, {group: colossus_smoke}]
  - location: red_sand_village
    groups: [{group: village_raid_light}]
    objective: defend
  - location: ash_mire
    groups: [{group: mire_slugs}, {group: mire_mix}]
  - location: cooling_well
    groups: [{group: well_guardians}]
  - location: gang_convoy_road
    groups: [{group: convoy_guard, weight: 2}, {group: convoy_raid}]
  - location: ash_well_village
    groups: [{group: village_raid_mid}]
    objective: defend
  - location: tar_pits
    groups: [{group: tar_tortoises}, {group: tar_brood}, {group: lizard_brood}, {group: tar_shell_line}]
    variants:
      - {flag: brood_spread, group: brood_spread}
  - location: overseer_camp
    groups: [{group: overseer_crew}, {group: overseer_guard}]
    elite: {unit: forge_scar, affix: hard_shelled, duel: true}   # 懸賞「熔爐督工」＝盜賊隊長精英（19.8；詞綴開發 PM 定）；RG-2 單挑（19.2.1：開發挑不會補血的）
  - location: iron_forge_village
    groups: [{group: village_raid_heavy}]
    objective: defend
  - location: obsidian_valley
    groups: [{group: obsidian_frost}, {group: obsidian_mix}]
  - location: lava_cave
    groups: [{group: cave_beetles}, {group: beetle_line}, {group: cave_lord}, {group: cave_shell_line}]
  - location: horned_altar
    groups: [{group: altar_wraiths}, {group: altar_betrayal}]
  - location: ruined_fortress
    groups: [{group: fortress_bandits}, {group: fortress_beasts}]
  - location: molten_heart_pit
    groups: [{group: ashen_heart_court}]   # Boss 地點的戰鬥＝Boss 戰（5F-2，代決 5F2-13）
    armor_mods:
      unit: ashen_heart
      min_total: -3
      max_total: 1
      mods:
        - {world_flag: ashen_heart_hardened, amount: 1}   # 雲嶺骨架 14 的世界線頭到期
        - {story_flag: ashen_convoy_stopped, amount: -1}  # 主線第 2 步：攔截斷崖幫運輸隊
        - {thread: convoy_intercepted, amount: -1}        # 荒原骨架 13：被攔下的碎片
