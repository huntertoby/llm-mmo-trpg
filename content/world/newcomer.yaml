# 新手引導（Phase 6F-2；schema：src/trpg/content/world_newcomer.py）。
# 依據：09 9.6.9 #99（新手引導、戰鬥短提示可關）、#125（開局在主城）；21 21.5「開局」；18 18.7.1。
# - start_region：新手區。新角色出生在主城中央廣場；還沒到過這一區的小鎮時，主城可以直接傳送過去
#   （第一次傳送免費、不需要先站上那邊的傳送石，21.5）。到過之後照 #120 的一般規則。
# - opening：新角色在主城醒來時的開場（玩法 PM 給的兩句；模型關閉時就用這兩句當模板文字）。
# - guide_*：任務追蹤器與開場卡的指引句（玩法 PM 筆記 U2；guide_capital_how_zh、guide_town_zh 是 6F-2 實作者暫定）。
# - main_advice_zh：新手任務鏈完成前，主線標的建議（筆記 U4）。
# - battle_hints：任何大世界戰鬥都可能出現的短提示（冰面、陷阱、致命地形、被推撞；筆記 U1「另加」的四種，
#   6F-2b 玩法 PM 定稿四句；其餘兩句仍是 6F-2 實作者暫定）。新手任務各步的提示寫在 quests/<region>.yaml 的 teach。
#   trigger 的意思見 schema 的 BATTLE_HINT_TRIGGERS。提示只影響畫面，不改戰鬥結果。
# - flash_lesson／reflash_lesson（#132）：新手第 1 步完成後回到城鎮，引導第一次閃現（用第 1 步原本給的 1 點靈感，
#   不另給點）；升到 reflash_level 級、閃過之後導師改教重閃。可以略過；之後在城鎮或營火隨時能閃。
#   flash_lesson 兩句是 #132 的原話；reflash_lesson 照 6F-2b 玩法 PM 回覆定稿。
#   #150 第 6 點（OB-3）：走新開局流程的角色 4 級前不能閃現，第一次閃現的引導改到新手第 3 步打完（升到 4 級）
#   回霧渡鎮才出；靈感照常累積。已完成開局的舊角色照舊在第 1 步之後。
# - 6F-4（#133、C2）：mentor_npc＝霧渡鎮導師堂的駐堂導師葛蘭（npcs/cloud_ridge.yaml）；allocate_lesson 是葛蘭的配點教學
#   （玩法 PM 配點教學修改稿第 6 節的台詞），排在第一次閃現之前、可以略過；level_up_zh／level_up_mentor_zh 是升級畫面；
#   attribute_notes 是配點教學裡滑過屬性時的白話說明。
# - 6F-2b（玩法 PM 回覆）：guide_capital_how_zh、ice_surface、lethal_terrain、reflash_lesson 四句定稿。
start_region: cloud_ridge
mentor_npc: gran
allocate_lesson:
  - speaker_zh: 葛蘭
    text_zh: 升級了？身上多了兩點力氣。來，我示範怎麼分。
  - speaker_zh: 葛蘭
    text_zh: 不知道怎麼配就按「推薦配法」。配錯了也沒關係，在城鎮或營火都能免費重來。
# OB-3（#150、09 9.6.9）：走新開局流程的角色正式選定後才教配點（8 點都已照推薦配好，教的是「重配再自己分」）；
# 略過（lesson:allocate_skip）之後第一次進城鎮或營火再提示一次，用下面這句（OB-3 實作者暫定，待玩法 PM 定稿）。
allocate_again_lesson:
  - speaker_zh: 葛蘭
    text_zh: 上次沒動的屬性點還照推薦配著。想自己分的話，現在可以重來一次。
allocate_done_zh: 好。接下來看看你剛才用過的那一招。
allocate_skip_zh: 隨時回來找我。
level_up_zh: 升到 {level} 級：屬性點 +{points}、靈感 +{insight}。
level_up_mentor_zh: 回霧渡鎮找導師堂的葛蘭，學怎麼配點。
attribute_notes:
  str: 力量武器的普攻與武器技；推擊、破壞物件；耐力上限；14 起撞擊傷害多 1、受到的少 1
  dex: 敏捷武器的普攻與武器技；防禦、先攻；耐力上限；比較不會在冰面滑倒
  con: 最大 HP；錘與拳套；耐力上限；抵抗暈眩、冰凍、中毒、流血
  int: 火、雷、冰、大地法術；法力上限；14 起你產生的表面多 1 回合
  wis: 治療、護盾、標記法術；權杖與鞭；法力上限；14 起看得見更遠的陷阱與隱蔽單位
  wil: 召喚、詛咒、暗影法術；法器珠、圖騰杖、鐮刀；法力上限；14 起控制抵抗 +1
flash_lesson:
  - speaker_zh: 說書人
    text_zh: 剛才那一招還在你手裡發燙。
  - speaker_zh: 葛蘭
    text_zh: 讓剛用過的招靈光一閃。
reflash_lesson:
  - speaker_zh: 葛蘭
    text_zh: 閃過的變化不滿意，可以重閃其中一次換成別的變化：要花靈感，但不用先上場
reflash_level: 3
opening:
  - speaker_zh: 說書人
    text_zh: 傳送陣的光暗了下去。你在樞島中央醒來，晶柱還在低鳴。五座浮橋斷在雲上，各自指向一個界域。
  - speaker_zh: 守印人
    text_zh: 新來的？雲嶺那邊缺人手。站上傳送陣，去霧渡鎮找渡婆婆。
guide_capital_zh: 到霧渡鎮找渡婆婆
guide_capital_how_zh: 走到中央廣場的傳送陣，或按 M 選雲嶺的霧渡鎮
guide_town_zh: 找渡婆婆   # RT-5b（玩法 PM 決定，交接 3.5 a975018e）：拿掉「頭上有「！」的」，主線「！」在畫面上另外突出
main_advice_zh: 建議先完成{quest}
battle_hints:
  - id: ice_surface
    trigger: ice_present
    text_zh: 冰面很滑：踏上第一格要過敏捷判定，失敗會一路滑出去再倒地
  - id: trap_tile
    trigger: trap_present
    text_zh: 格子上有陷阱：踩到就會觸發，能繞就繞
  - id: lethal_terrain
    trigger: lethal_terrain
    text_zh: 深淵、岩漿、冰窟是致命地形：被推進去會直接倒下，別背對它站
  - id: pushed
    trigger: pushed
    text_zh: 被推撞時撞到人或牆會多受傷：別貼著隊友或牆站成一排
# 主城工坊靶場（Phase TR-1，#134；21 21.5、09 9.6.9、06 6.27.3）：新角色在這裡試武器、選武器與 2 個關鍵字，按「確定出發」才算完成開局。
# - racks：武器架的大類順序（近戰、遠程、法器）；第一季可用的主手武器（weapons.yaml 裡不是召喚物專用的）都掛上去。
# - placeholder_weapon：還沒選武器時手上的佔位武器（拳套＝空手的樣子；確定出發時換掉，不給玩家）。
# - map／hero_at／dummies：沙盒試打的地圖與位置（沿用技能工坊的靶場圖 training_range）。木樁 3 個：會動（有人靠近就退開）、
#   站在水上（試雷電導電、冰凍）、普通（旁邊有石柱）。都不攻擊、HP 300。
# - demos：每大類 2 招示範招（選完收回、不進技能庫；#148、21 21.5），該大類每把武器都能用：
#   近戰 瞬步背刺＋狂野之刃；遠程 淬毒箭＋燧石飛刃；法器 火焰箭＋火花連鎖（#148，2026-11-11 改為不綁武器的招）。
#   示範招不得帶「要某把武器或副手才生效」的效果（tests/content/test_newcomer_content.py 檢查）。
# - demo_notes：示範卡片在技能本體說明之外多寫的一句（技能 ID → 文字；只在靶場顯示，不改技能本體）。
# - intro：守印人帶到靶場時的話；done：確定出發後指示去霧渡鎮（TR-1 實作者暫定文案，待玩法 PM 定稿）。
range:
  racks: [melee, ranged, focus]
  placeholder_weapon: fist
  map: training_range
  hero_at: [2, 5]
  max_rounds: 30
  dummies:
    - {unit: training_dummy_moving, at: [9, 3], label_zh: 會動的木樁}
    - {unit: training_dummy, at: [6, 8], label_zh: 站在水上的木樁}
    - {unit: training_dummy, at: [6, 4], label_zh: 普通的木樁}
  demos:
    melee: [skill_shadow_backstab, skill_wild_blade]
    ranged: [skill_rng_venom_arrow, skill_oil_spark_throw]
    focus: [skill_fire_bolt, skill_spark_chain]
  demo_notes:
    skill_oil_spark_throw: 靶場的油桶打破會流出油
  # #150 入門武器（入門招＝上面的 demos，換招只改 demos）
  starters: {melee: one_handed_sword, ranged: bow, focus: fire_staff}
  intro:
    - speaker_zh: 守印人
      text_zh: 醒了？先別急著走。空手出去，雲嶺的霧會把你吞掉。
    - speaker_zh: 守印人
      text_zh: 這裡是工坊靶場。架上的武器隨便拿，打打木樁，順手的再帶走；選好兵器，再挑兩個你信得過的路數。
  done:
    - speaker_zh: 守印人
      text_zh: 好，就這套。站上傳送陣，去雲嶺的霧渡鎮找渡婆婆——第一趟不收錢。
