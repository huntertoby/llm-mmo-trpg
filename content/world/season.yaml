# 第一季的日程、今日目標、懸賞、世界事件（Phase 5F-1；docs/phases/Phase5計畫.md 35.4）。
# schema：src/trpg/content/world_season.py；規則：src/trpg/world/season_board.py。
# 來源：docs/design/09-世界與敘事.md 9.7（14 天節奏、懸賞先搶先贏不設每日數量、世界事件每 3～4 天 1 個）、
# 9.6.9 #99（今日目標 3 條、完成給少量任務幣、新手期偏教學）、9.6.10 #103（門檻依前一天上線人數自動調整）、
# 18 18.7.4（雲嶺懸賞）、19 19.6（主線時間點）、19.9（世界事件）。
# 時區與刷新時刻在 world/rules.yaml 的 calendar；開賽日在 config/server.toml 的 [season]。
# 數值（任務幣、門檻比例、目標次數）是開發 PM 的初值（Phase 5 計畫 Q14、代決 5F1-11），未經模擬。
days: 14

# 9.7 節奏（顯示用；天數 1 起、閉區間、依序涵蓋整季）
schedule:
  - {id: act1, days: [1, 3], name_zh: 霧中裂痕, text_zh: 主線第 1～2 章、雲嶺；世界事件「霧潮入侵」}
  - {id: act2, days: [4, 7], name_zh: 灰燼之心, text_zh: 灰燼荒原、懸賞；世界事件「熔岩潰堤」}
  - {id: act3, days: [8, 10], name_zh: 封印, text_zh: 封印鑰匙集滿即解鎖 Boss（最早第 8 天、第 10 天強制）}
  - {id: race, days: [11, 13], name_zh: Boss 競賽, text_zh: 首殺者得獎金；第 13 天截止影子循環賽報名}
  - {id: finale, days: [14, 14], name_zh: 季末, text_zh: 無人首殺時舉行影子循環賽}

# 時間點（顯示用；規則在各段：主線 5B-4／荒原、Boss 5F-3、循環賽 5F-4）
milestones:
  - {id: story_skill_1, day: 2, name_zh: 主線第 1 章的劇情技能}
  - {id: story_skill_2, day: 6, name_zh: 主線第 2 章的劇情技能}
  - {id: boss_earliest, day: 8, name_zh: 賽季 Boss 最早解鎖}
  - {id: boss_forced, day: 10, name_zh: 賽季 Boss 強制解鎖；主線第 3 章的劇情技能}
  - {id: league_signup_close, day: 13, name_zh: 影子循環賽截止報名}
  - {id: league, day: 14, name_zh: 影子循環賽}

# 今日目標（#99）：全服同一組、進度算角色（代決 5F1-3）；完成一條給 coins 任務幣。
# 第 1～newbie_days 天用 newbie（教學）；之後每天從 goals 確定性抽 count 條。
daily_goals:
  count: 3
  coins: 1
  newbie_days: 2
  newbie: [starter_steps, reveal_hidden, elite_once]
  goals:
    - {id: starter_steps, text_zh: 完成新手任務 2 步, goal: {kind: quest_step, quest_kind: starter, count: 2}}
    - {id: reveal_hidden, text_zh: 發現 1 個隱藏地點, goal: {kind: location_revealed, count: 1}}
    - {id: elite_once, text_zh: 打倒 1 隻精英, goal: {kind: battle_won, elite: true, count: 1}}
    - {id: win_battles, text_zh: 打贏 3 場戰鬥, goal: {kind: battle_won, count: 3}}
    - {id: fog_battle, text_zh: 在霧中打贏 1 場, goal: {kind: battle_won, weather: [fog], count: 1}}
    - {id: rain_battle, text_zh: 在雨中打贏 1 場, goal: {kind: battle_won, weather: [rain], count: 1}}
    - {id: quest_steps, text_zh: 推進任務 2 步, goal: {kind: quest_step, count: 2}}
    - {id: situation_wins, text_zh: 情境判定成功 2 次, goal: {kind: situation_success, count: 2}}
    - {id: talk_npcs, text_zh: 和 NPC 聊天 2 次, goal: {kind: talked, count: 2}}
    - {id: camp_once, text_zh: 在野外紮營 1 次, goal: {kind: camped, count: 1}}
    - {id: camp_fight, text_zh: 打贏 1 場營地的戰鬥, goal: {kind: battle_won, location_kinds: [camp], count: 1}}
    - {id: bounty_once, text_zh: 搶下 1 張懸賞, goal: {kind: bounty_claimed, count: 1}}

# 懸賞（18.7.4；09 9.7「先搶先贏，不設每日數量」）：每天刷新時貼出 from_day 起的全部懸賞；
# 每個角色每天在該地點的第一場遭遇是懸賞陣容（group＋elite 排最前；角色自己的遭遇變化優先），之後照一般遭遇（5F-1b）。
# 先打倒的人拿大獎 coins（並補經驗到懸賞份數），其他人打倒拿小獎 consolation_coins（9.6.3；初值）。
# 雲嶺懸賞第 1 天起（代決 5F1-8：9.7「第 4～7 天 懸賞」對應荒原懸賞 19.8 的等級 7～8）。
bounties:
  - {id: north_wolf_king, name_zh: 北坡狼王, region: cloud_ridge, location: north_slope, level: 5,
     group: north_slope_pack, elite: {unit: mist_wolf, affix: berserk}, coins: 3, consolation_coins: 1, from_day: 1}
  # 會分身：本體 sect_mist_swordsman 開場用召喚原語召出 1 名低血量、同招式的霧影（18.7.4；5F-1b 玩法 PM 代決）
  - {id: mist_swordsman, name_zh: 霧中劍客, region: cloud_ridge, location: sword_tomb, level: 5,
     group: mist_swordsman_band, elite: {unit: sect_mist_swordsman, affix: mist_veiled}, coins: 3, consolation_coins: 1, from_day: 1}
  - {id: scarface, name_zh: 斷崖幫二當家「疤面」, region: cloud_ridge, location: cliff_gang_fort, level: 4,
     group: scarface_risen, elite: {unit: bandit_captain, affix: heart_linked}, coins: 3, consolation_coins: 1, from_day: 1}

# 世界事件（19.9、#103）：全服一條進度；門檻＝goal.count × 前一天上線帳號數 ÷ base_players（Q14），
# 最少保留原門檻的 min_target_permille（250＝1/4，30 → 8，無條件進位）；前一天沒有上線紀錄（含第 1 天）
# 用原門檻（代決 5F1-4；5F-1b 玩法 PM 2026-11-03 代決）。達到門檻立刻成功；結束日過了還沒到就失敗。
# #2 熔岩潰堤（荒原村落守點）等荒原內容到位再加（5F-5）。
world_events:
  - id: mist_tide
    name_zh: 霧潮入侵
    text_zh: 全服在雲嶺的霧中打贏戰鬥；成功則開放灰燼荒原
    days: [1, 3]
    goal: {kind: battle_won, region: cloud_ridge, weather: [fog], count: 30}
    base_players: 8
    min_target_permille: 250
    on_success: {flags: [ashen_waste_open]}
    # 失敗：第 4 天仍開放，但荒原建議等級 +1（19.9；9.6.7 #15）
    on_failure: {flags: [ashen_waste_open], level_bonus: [{region: ashen_waste, amount: 1}]}
  # #3 封印共鳴（19.9；Phase 5F-3）：全服累積封印鑰匙（目標種類 seal_key：事件開始時帶入之前的全服鑰匙數）。
  # 集滿 → 旗標 seal_resonance_full（season_boss.unlock.flag）：最早第 8 天、且至少 24 小時後解鎖碎晶之主；
  # 沒集滿時第 10 天強制解鎖，所以失敗沒有效果。門檻 12 是開發 PM 的初值（代決 5F3-7），照上線人數調整。
  - id: seal_resonance
    name_zh: 封印共鳴
    text_zh: 全服累積封印鑰匙；集滿則提早解鎖賽季 Boss「碎晶之主」
    days: [7, 10]
    goal: {kind: seal_key, count: 12}
    base_players: 8
    on_success: {flags: [seal_resonance_full]}

# 封印鑰匙（19.6.2；Phase 5F-3）：個人每個來源第一次達成給 1 把，同時算進全服鑰匙；個人至少 required 把才能挑戰賽季 Boss。
# 來源（代決 5F3-8）：雲頂觀霧鎖真人第一次打倒、每張懸賞第一次搶下；荒原第 2 章結局、世界事件 #2 等 5F-5。
seal_keys:
  required: 1
  sources:
    - {id: summit_boss, kind: elite_first_kill, unit: sect_mist_lock_master, name_zh: 打倒雲頂觀的霧鎖真人}
    - {id: bounty, kind: bounty_claimed, name_zh: 搶下懸賞}

# 賽季 Boss（19.7、09 9.7、#87、#100、#101；Phase 5F-3）：碎晶之主，獨立 Boss 地圖裂界門（荒原地點圖 5F-5，代決 5F3-1）。
# - 解鎖：封印共鳴集滿後最早第 8 天且至少 24 小時；第 10 天強制；解鎖前 24 小時公告；開放到第 13 天結束（代決 5F3-9、5F3-10）。
# - 挑戰：從城鎮出發、只准系統傭兵（#87）、每帳號每天 3 次（#100；按下挑戰就扣、撤退不退，代決 5F3-2）、種子由伺服器給。
# - 評分（#87：輪數、全隊存活、有沒有人倒下；代決 5F3-11）：max(0, 1000 − 20 × 輪數) ＋ 100 × 存活人數 ＋ 200（沒人倒下）。
season_boss:
  id: rift_shard_lord
  name_zh: 碎晶之主
  battle_map: rift_gate
  units: [rift_shard_lord, rift_pillar_mist, rift_pillar_thunder, rift_pillar_fire]
  level: 10
  unlock: {earliest_day: 8, forced_day: 10, close_day: 13, announce_hours: 24, flag: seal_resonance_full}
  daily_attempts: 3
  entry_kinds: [town]
  title_zh: 碎晶的終結者
  score: {base: 1000, per_round: 20, per_survivor: 100, no_down: 200}

# 影子循環賽（Phase 5F-4；09 9.7「季末保底」、#101）：每帳號 1 角色、第 13 天截止報名；
# 每對組合 × maps × seeds 個種子 × 交換先後手，全員拉到等級上限、雙方都由 AI 操作（初值，開發 PM 定）。
league:
  signup_close_day: 13
  maps: [open_plain, dark_forest, swamp]   # 3 張事先公布的地圖：開闊、遮蔽、水澤
  seeds: 2          # 每對組合 × 每張地圖的種子數；每個種子交換先後手各打 1 場
  max_rounds: 30    # 到輪數上限＝和局（同大世界戰鬥）
  batch_size: 10    # 背景每批幾場
