# 大世界的物品（Phase 5D-1；docs/phases/Phase5計畫.md 26.2）。schema：src/trpg/content/world_economy.py。
# 名稱、內容、價格依 docs/design/20-第一季商店與裝備內容.md 20.1（玩法 PM 代決 #119）；ID 與戰鬥中的骰子由開發 PM 定
# （代決 5D1-9）；5D-2 的材料加在這個檔。
# - 消耗品（08 8.17：藥水、投擲瓶；卷軸正式季）：skill 是戰鬥中的用法（「道具技能」：1 AP、每個用一次、
#   不佔技能欄位、標籤含 item；和 content/skills/ 同一套檢查、不進技能池）。field_*_permille 是野外使用
#   回最大值的 ‰（20.1 的百分比；09 9.6.11 #113「HP 靠藥水」）。
# - 補給（kind: supply）：買了直接加補給，不進背包、不能賣（20.1；代決 5D1-7）。
# - 材料：粗料（08 8.14 通用 1 階）、青竹節（雲嶺特產，18.2.4）；材料不能賣（20.1）。
# - 染料 6 色：只買得到、存在背包（染色在之後的段）。
# - 冰瓶、火瓶：20.1 由餘燼集（灰燼荒原）賣，霧渡鎮不賣；先定義好，荒原內容到位後只加店。
