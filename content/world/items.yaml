# 大世界的物品（Phase 5D-1；docs/phases/Phase5計畫.md 25.2）。schema：src/trpg/content/world_economy.py。
# 名稱與數值是開發 PM 定的初值（代決 5D1-1、5D1-9）；5D-2 的材料加在這個檔。
# - 消耗品（08 8.17：藥水、投擲瓶；卷軸正式季）：skill 是戰鬥中的用法（「道具技能」：1 AP、每個用一次、
#   不佔技能欄位、標籤含 item；和 content/skills/ 同一套檢查、不進技能池）。field_*_permille 是野外使用
#   回最大值的 ‰（09 9.6.11 #113「HP 靠藥水」；8.17 例「回 30% HP」）。
# - 材料：粗料（08 8.14 通用 1 階）、青竹節（雲嶺特產，18.2.4）。
# - 染料：只買得到、存在背包（染色在之後的段）。
