# 雲嶺 NPC 人設卡（Phase 5B-1；docs/phases/Phase5計畫.md 8.4）。schema：src/trpg/content/world_events.py。
# 來源：docs/design/18-雲嶺內容.md 18.5（#107；#111 玩法 PM 代決、待使用者確認）。
# 開發 PM 自定：ID；location 對到地點圖（18.5「青霧觀」＝青霧觀山門 mist_temple_gate）。
# secret_zh 只給說書人參考，不直接顯示給玩家；人設卡只影響對話與劇情，不影響數值（9.6.7 #3、#5）。
region: cloud_ridge
npcs:
  - id: granny_du
    aliases_zh: [婆婆]
    name_zh: 渡婆婆
    role_zh: 鎮長
    location: mist_ferry
    personality_zh: 精明、護短
    speech_zh: 短句，愛用渡船比喻
    address_zh: "{name}"  # 6R-2（#137）：長輩口吻叫名字
    secret_zh: 年輕時是斷崖幫的人
    hooks_zh: 區域任務鏈；好感度高才說出暗門
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#e8c8a8', hair: bun, hair_color: '#c8c8c0', bun_band: '#b8432f'}
      gear: {body: {kind: robe, color: '#3c4a48', trim: '#e8bb48'}}
      extras: [wrinkles]
  - id: shopkeeper_liu
    aliases_zh: [掌櫃]
    name_zh: 柳掌櫃
    role_zh: 商人
    location: mist_ferry
    personality_zh: 圓滑、愛八卦
    speech_zh: 客氣，句尾常加「呢」
    secret_zh: 偷偷收購源晶碎片
    hooks_zh: 傳聞來源；隱藏配方的材料
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#f1c9a5', hair: short, hair_color: '#2a1a10'}
      gear: {body: {kind: robe, color: '#8a6a3a', trim: '#e8bb48'}}
      extras: [cap, mustache]
  - id: daoist_qingya
    aliases_zh: [道長, 青崖]
    name_zh: 青崖道長
    role_zh: 技能導師
    location: mist_temple_gate
    personality_zh: 嚴肅、慢熱
    speech_zh: 古風、文言，稱人「施主」
    address_zh: 施主  # 6R-2（#137）：青霧觀修士稱人「施主」
    secret_zh: 想離開道觀
    hooks_zh: 導師任務鏈（#95）
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#f1c9a5', hair: bun, hair_color: '#e8e8e0', bun_band: '#2f5a5a', beard: true}
      gear: {body: {kind: robe, color: '#2f5a5a', trim: '#e8e8e0'}}
  - id: hunter_ayue
    aliases_zh: [阿岳, 獵戶阿岳]
    name_zh: 阿岳
    role_zh: 獵戶，劇情夥伴
    location: hunter_hut
    personality_zh: 直爽、話少
    speech_zh: 口語、粗短
    secret_zh: 父親死在源晶裂痕
    hooks_zh: 新手任務鏈的劇情夥伴（#97）；主線第 1 章同行
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#d9a47a', hair: short, hair_color: '#3a2414'}
      gear: {body: {kind: leather, color: '#6a5040'}}
      extras: [fur_collar]
  - id: acolyte_xiaolian
    aliases_zh: [道童]
    name_zh: 小蓮
    role_zh: 道童
    location: mist_temple_gate
    personality_zh: 好奇、膽小
    speech_zh: 叫人「哥哥／姐姐」
    address_zh: 施主  # 6R-2（#137）：青霧觀修士稱人「施主」
    secret_zh: 偷看過觀主修煉
    hooks_zh: 事件 2、6；主線線索
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#f6e0cc', hair: bun, hair_color: '#1a1a1a', bun_band: '#6aa84a'}
      gear: {body: {kind: robe, color: '#8ab890', trim: '#f2e6c8'}}
  - id: mistlock_master
    aliases_zh: [真人, 觀主]
    name_zh: 霧鎖真人
    role_zh: 青霧觀觀主、區域 Boss
    location: cloud_summit
    personality_zh: 自負、執著
    speech_zh: 慢條斯理，愛講道理
    address_zh: 施主  # 6R-2（#137）：青霧觀修士稱人「施主」
    secret_zh: 想用源晶飛升
    hooks_zh: 主線第 1 章 Boss
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#e8d8c8', hair: long, hair_color: '#9aa8b0'}
      gear: {body: {kind: robe, color: '#e8e8e0', trim: '#3a5a5a'}, head: {kind: veil, color: '#dfe4e2'}}
      extras: [mist]
  - id: scarface
    aliases_zh: [二當家]
    name_zh: 疤面
    role_zh: 斷崖幫二當家
    location: cliff_gang_fort
    personality_zh: 狠、記仇
    speech_zh: 粗話少、威脅多
    secret_zh: 和柳掌櫃有交易
    hooks_zh: 懸賞、線頭「二當家記恨你」
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#a8724c', hair: short, hair_color: '#1a1a1a'}
      gear: {body: {kind: leather, color: '#7a6a4a'}}
      extras: [wide_hat, scar]
  - id: frost_chime
    name_zh: 霜音
    role_zh: 白狐
    location: crane_cliff
    personality_zh: 神祕、愛捉弄人
    speech_zh: 只用問句回答
    secret_zh: 是裂痕異象的見證者
    hooks_zh: 隱藏地點；獸耳族主角（任何血脈）有專屬對話：霜音把獸耳族都當成山靈的孩子（#138）
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      extras: [fox]
  # Phase 6F-4 新增（#133；18 18.5）：霧渡鎮導師堂的駐堂導師。外觀照 docs/art/gran-doll.png（晶冠遠征隊的舊外套：
  # 藍紫底、金邊；鋼護手；短鬚；舊疤只畫在頭像）。只填現有的外觀欄位，不新增畫法部件。
  - id: gran
    aliases_zh: [葛蘭, 導師, 葛蘭導師]
    name_zh: 葛蘭
    role_zh: 導師堂駐堂導師
    location: mist_ferry
    personality_zh: 爽朗、實戰派，退休的晶冠遠征者
    speech_zh: 白話、短句，愛用「來，我示範」
    secret_zh: 年輕時在源晶裂痕丟了隊友，不肯再進山
    hooks_zh: 新手的配點與第一次閃現教學（#133、#132）；之後在霧渡鎮提供導師功能（閃現、重閃、溶掉、傳承）；青崖照舊是導師任務鏈的主角
    portrait:
      look: {skin: '#e8c8a8', hair: short, hair_color: '#d8d4c8', beard: true}
      gear: {body: {kind: coat, material: cloth, color: '#4a4680', trim: '#d9b24a'}, hands: {kind: bracers, material: steel}}
      extras: [scar]
  # Phase 5D-3 新增；5D-3b 照玩法 PM 補的 18.5 人設卡改寫。
  - id: smith_shi
    aliases_zh: [石師傅, 鐵匠]
    name_zh: 石師傅
    role_zh: 鐵匠
    location: mist_ferry
    personality_zh: 沉默寡言、手藝自傲
    speech_zh: 一句話不超過十個字，常用「嗯」「拿來」
    secret_zh: 年輕時替青霧觀打過劍陣用的劍，知道劍陣的弱點
    hooks_zh: 鐵匠與附魔台；信賴時說出祕密（劍陣弟子落單時最弱，只是資訊）
    portrait:  # 6C-7：照 docs/art/sample/portraits.js（美術 PM 提案）
      look: {skin: '#d9a47a', hair: short, hair_color: '#6a5440', beard: true, build: stout}
      gear: {body: {kind: leather, color: '#5a4030'}}
      extras: [headband]
