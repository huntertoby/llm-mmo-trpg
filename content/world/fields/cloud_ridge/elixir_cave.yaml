# 丹爐洞實地地圖（6C-4；玩法 PM 草稿第 11 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 隱藏秘境 16×14，建議 5 級：山腹裡的煉丹洞，中央是巨大的丹爐，熱氣與毒霧交錯。
# 唯一的出口在西邊洞口，回到藥師谷的隱藏洞口（arrive: elixir_cave_mouth，那一側是門）。
# 高度全平 0。洞口長廊寬 4、往兩側水房的通道寬 3（狹窄長廊感）。
# 中央丹爐用油桶（可以打翻、會燒），丹爐旁一小片毒霧表面；兩側水房是水表面（furnace_tide 用得到）。
# 隱藏任務「丹爐之謎」（20.3 丹爐殘蓋）的地點。
# 敵人：丹爐前駐守 furnace_steward（精英青霧執事）；南水房駐守 furnace_tide。
# 事件點：丹爐（runaway_furnace）。
