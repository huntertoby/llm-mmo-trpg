# 源晶裂痕實地地圖（6C-4；玩法 PM 草稿第 16 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 異象 24×18，建議 5 級，傳送石：大地裂開一道發光的源晶裂縫，霧魅從裂縫湧出，盜賊和修士在裂縫前對峙。
# 主線第 1 章的核心。西邊往北坡獵場、東邊往劍冢（都在南半）；東北裂縫後的山門往雲頂觀（北半）。
# 照 18.3，雲頂觀只能從這裡進入；山門前的霧牆是情境物件 rift_mist_wall（草稿待確認 9：
# 主線第 1 章推進到對應步驟前擋住入口，提示語「霧太濃，還過不去」），由走路動作擋，
# 地圖上不畫會擋路的格子（6C-5 接）。
# 中央裂縫：深淵 x 8～15（長 8 格、寬 2 格），兩側接碎晶岩脊（牆），把地圖分成南北兩半；
# 中間 2 座天然石橋（x 9、x 14，石地，不會斷）。碎晶堆用瓦礫物件（碎晶傀儡的來源）。
# 傳送石在西南、離裂縫較遠的安全角落。高度：北半東側往山門 1，其餘 0。
# 敵人：裂縫北側駐守 rift_wraiths（三方）；南側駐守 rift_scavengers（三方）。
# 「霧魅從裂痕湧出」生效期間夜晚多一隻霧魅，是遭遇表的事（6C-1 接）。
# 事件點：裂縫邊（possessed_hunter）、石橋（shard_convoy）。
