# 古松祭壇實地地圖（6C-3；玩法 PM 草稿第 8 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 祭壇 24×18，建議 3 級，營火：山坡上一棵焦黑的千年古松，樹下是石祭壇；雷雨夜會落雷。
# 東南的山坡小路往雨中梯田；東邊的松林小路往雲海吊橋（6C-4，配對待補）。
# 高度：東邊 0，往西每 6 格高一層，祭壇高台 2、祭壇後方的山坡 3。
# 古松用枯樹（可燃、可推倒）、石祭壇與石棋盤用矮牆，營火在祭壇側邊。
# 敵人：祭壇後方駐守 altar_wardens。
# 事件點：古松下（storm_altar，雷雨夜；保底機遇也在這裡）、石棋盤（pine_elder_go）、
# 山坡小路（lost_acolyte）。
