# 雨中梯田實地地圖（6C-3；玩法 PM 草稿第 4 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 2 級，傳送石：層層梯田常年下雨。4 層梯田（北高南低，高度 3／2／1／0），每層
# 最上面一列是 1 格寬的田埂（石地），中間一條往上的石階；水田是水表面；稻草人用枯樹（可推倒）。
# 出口：西 → 竹林小徑、北 → 青霧觀山門（往上的石階）、西北 → 古松祭壇（山坡小路）、
# 東南 → 斷崖幫寨（峽谷口）。傳送石在中層（高度 2）的土地廟旁。
# 敵人：上層駐守 terrace_clash（三方：盜賊對修士，新手任務 3 的固定戰；草稿待確認 6：兩群互相
# 對峙、不會自己打起來，碰到就照陣容的 third 開三方戰，所以只放一個駐守點）；田埂巡邏 sect_patrol。
# 事件點：土地廟旁（lost_acolyte）、峽谷口（gang_toll）。
