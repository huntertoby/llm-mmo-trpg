# 冬湖實地地圖（6C-4；玩法 PM 草稿第 12 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 4 級，營火：結冰的高山湖。冰面會滑，湖心有冰洞（致命）。
# 南邊往獵戶小屋（對到獵戶小屋北邊的獵道）；北邊往北坡獵場（獵道高 1）。
# 湖面用石地加冰面表面（踩上去會滑，#121 的路徑提示用得到）；冰洞 2 個用 ice_hole 地形。
# 沿湖岸有路，不必走冰面也到得了北邊（冰洞不擋唯一通路）。
# 獵人帳篷用矮牆，營火在帳篷旁；熊洞在東北角，岩壁圍起來、洞口朝南。
# 敵人：東岸駐守 lake_hunters；湖心偏北駐守 lake_bears（三方：修士對石背熊；
# 石背熊 4 級以上才出現由遭遇表決定，6C-1 接）。
# 事件點：熊洞口（bear_den）、帳篷（fox_traveler）。
