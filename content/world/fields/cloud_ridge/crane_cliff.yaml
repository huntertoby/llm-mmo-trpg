# 鶴歸崖實地地圖（6C-4；玩法 PM 草稿第 14 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 隱藏秘境 16×14，建議 6 級：雲上的斷崖平台，雷羽鷹的巢，強風。
# 唯一的出口在南邊的崖縫，回到北坡獵場的隱藏崖縫（arrive: crane_cliff_crack，那一側是門）。
# 多層崖台：下層 0、中層 1、上層 2、崖頂 3（每層高 1，走得上去）；崖台外緣是深淵（致命）。
# 6R-1（#138）：下層東側加 2 層崖台 (12, 10)～(12, 11)（高 2，比下層高 2 層，獸躍、攀爬上得去）；
# 南邊 (13, 11) 高 1 是走得上去的坡。死角、不通往出口。
# 強風是天氣或畫面的事，地圖不另畫。鷹巢用木箱（可燃、打得壞）；霜音的石台用矮牆。
# NPC：霜音（白狐，人設卡在這裡）站在石台旁。
# 敵人：崖頂駐守 crane_nest（三方：修士對雷羽鷹）；下層駐守 crane_cliff_bear（三方：鷹對熊）。
# 事件點：霜音的石台（frost_chime_riddle）。
