# 斷崖幫寨實地地圖（6C-3；玩法 PM 草稿第 7 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 3 級：建在峽谷峭壁上的木寨；懸賞「斷崖幫二當家」。
# 西邊峽谷口往雨中梯田（草稿：寨西北）；寨後東北的木棧道往藥師谷（6C-4，配對待補）。
# 高度：峽谷口 0、寨中 1、寨後高台與木棧道 2、瞭望台 3（弓手位置）。木柵用牆畫，寨門在西邊。
# 木棧道沒有木頭地形，用石地畫（不會被燒斷，避免唯一的通路斷掉）；棧道東邊與南邊是峽谷（致命）。
# 暗門：寨子東側的岩縫，平時是普通岩壁，持有線頭「斷崖幫寨的暗門」才顯示（草稿待確認 8）。
# 暗門不通往任何地點，不是門也不是出口，先記成情境物件 gang_fort_secret_door（6C-5 再接）。
# 敵人：寨中央駐守 cliff_gang_core（「二當家記恨你」到期後由遭遇表的 variants 換成
# scarface_risen，6C-1 接）；木棧道巡邏 cliff_gang_hounds。
# 事件點：寨門外（gang_toll）、岩縫邊（gang_deserter）。
