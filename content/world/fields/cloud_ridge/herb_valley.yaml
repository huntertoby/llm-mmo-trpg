# 藥師谷實地地圖（6C-4；玩法 PM 草稿第 10 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 遺跡 24×18，建議 4 級，營火：谷底藥田和廢棄的藥廬，東側有一口冒毒霧的泉。
# 西南的棧道往斷崖幫寨（高 1）；西北上坡往雲海吊橋（高 1～2）；
# 隱藏：谷底東側毒泉後方的岩壁是丹爐洞的洞口（門 elixir_cave_mouth，hidden_until: reveal）。
# 「走到洞口 3 格內做感知判定、持有任務線索也會顯示」是 reveal 的事（地點圖的 reveal: [situation]），
# 地圖只畫洞口的位置。
# 毒泉用毒霧表面；藥田用草叢物件（易燃）；藥廬殘牆用矮牆（掩體），營火在藥廬裡。
# 崖上的靈芝：北側崖壁下的事件點 cliff_lingzhi（攀爬點）。
# 敵人：藥田駐守 valley_keepers；谷口巡邏 valley_beasts。
# 事件點：崖下（cliff_lingzhi）、毒泉邊（poison_spring）、藥廬（gang_deserter）。
