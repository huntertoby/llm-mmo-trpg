# 渡口石階實地地圖（Phase 6B-1 草稿；格式說明見 mist_ferry.yaml 開頭）。
# 路徑圖 20×12：西邊的土路接霧渡鎮，往東爬上 0→1→2→3 的石階，到高台再往北接竹林小徑。
# 南邊是崖下的霧河（深淵）；高台邊緣落差 3 層，只能走石階上去（照戰鬥規則，一步最多往上 1 層）。
# 竹林小徑的地圖還沒畫，往北的出口只檢查格式，配對列為「待補」。
