  """"""..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ,,,,,,..,,,,........
  ########""""########
  ########====########
legend:
  ".": stone
  '"': grass
  ",": dirt
  "#": wall
  "=": chasm
objects:
  - {at: [5, 3], kind: stone_pillar}   # 燈籠柱
  - {at: [9, 4], kind: crate}   # 渡船殘骸
  - {at: [10, 4], kind: crate}
  - {at: [10, 5], kind: fallen_log}
  - {at: [11, 8], kind: crate}
  - {at: [13, 2], kind: stone_pillar}   # 山門牌坊
  - {at: [16, 2], kind: stone_pillar}
  - {at: [16, 5], kind: low_wall}
  - {at: [18, 3], kind: grass}
  - {at: [18, 4], kind: grass}
entry: [2, 8]
exits:
  - {id: to_mist_ferry, at: [[0, 8], [0, 9]], to: mist_ferry, arrive: to_ferry_steps}   # 石階底
  - {id: to_bamboo_path, at: [[14, 0], [15, 0]], to: bamboo_path, arrive: to_ferry_steps}   # 石階頂的山門牌坊
spawns:
  - {at: [9, 6], group: bandit_raiders, personal: true, until_quest: starter_ferry}   # 中段平台（新手任務 1 的固定戰；個人的駐守；任務完成後不再出現，6C-5）
  - {at: [3, 7], group: bandit_shield_line, patrol: [[3, 7], [17, 7]], day_phase: night}   # 石階上巡邏（草稿：夜晚）
event_spots:
  - {at: [8, 8], id: wounded_peddler}   # 石階中段
  - {at: [11, 6], id: broken_ferry}   # 渡船殘骸旁
  - {at: [4, 3], id: lantern_patrol}   # 燈籠柱下（夜晚）
