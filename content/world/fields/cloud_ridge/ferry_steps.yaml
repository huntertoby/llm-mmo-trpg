# 渡口石階實地地圖（Phase 6B-1 草稿，6C-3 依玩法 PM 草稿第 2 張重畫）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 路徑圖 20×12，建議 1 級：西邊石階底接霧渡鎮，往東爬三段石階（高度 0／1／2），石階頂往北穿過
# 山門牌坊接竹林小徑。北邊是山壁；南側崖邊大多有岩石擋著，只有中段平台旁一小段是懸崖（致命），
# 新手區不放太多。中段平台停著被砸壞的渡船殘骸（木箱、倒木當掩體）。
# 敵人：中段平台駐守 bandit_raiders（新手任務 1 的固定戰）；石階上巡邏 bandit_shield_line
# （草稿「夜晚多一隊」：日夜由 6C-1 決定，這裡只畫路線）。
# 事件點：石階中段（wounded_peddler、broken_ferry）、夜晚的燈籠點（lantern_patrol）。
id: ferry_steps
name_zh: 渡口石階
region: cloud_ridge
location: ferry_steps
layout: path
size: [20, 12]
heights: |
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001111112222222
  00000001000012222222
