# 獵戶小屋實地地圖（6C-3；玩法 PM 草稿第 6 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 2 級，營火：林邊的獵戶小屋與曬肉架，劇情夥伴阿岳的家。
# 南邊接霧渡鎮、東邊往竹林小徑、北邊的獵道往冬湖（冬湖在 6C-4，配對待補）。
# 北邊的林子高一層（枯樹當樹林）；小屋只有門口，不做室內；曬肉架用矮牆；營火在屋前。
# 草稿的「陷阱坑（阿岳設的，敵人踩到會觸發）」：現有地形與物件沒有陷阱，這段不畫（報告待決）。
# 敵人：林子北緣巡邏 hunter_beasts（下山的野獸）。事件點：屋前（ayue_request，白天）。
