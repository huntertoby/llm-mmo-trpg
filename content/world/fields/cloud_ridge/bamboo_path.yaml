# 竹林小徑實地地圖（6C-3；玩法 PM 草稿第 3 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 路徑圖 20×12，建議 1～2 級：濃密竹林中間一條彎小路。南邊接渡口石階，西邊獵人踩出的小徑往
# 獵戶小屋，東邊過小溪上的石橋往雨中梯田。
# - 竹叢：擋視線、可以點燃，用 dead_tree（枯樹：擋視線、可燃、可推倒）；其中兩叢靠路邊的是
#   「倒下的竹堆，可以推倒」。草叢（grass）是可燃的隱蔽處。
# - 中央小溪：水表面（雷擊會擴散），石橋那兩列沒有水。
# 敵人：竹林深處（東北的土坡）駐守 mist_wolf_pack（新手任務 2 的固定戰）；小路上巡邏
# bandit_wolf_handler。事件點：小溪邊（wounded_peddler）、小路（lantern_patrol，夜晚）。
