# 霧渡鎮實地地圖（Phase 6B-1 草稿；schema：src/trpg/content/fields.py）。
# 格式（Phase 6 計畫 2.2）：
# - size、heights、terrain、legend、objects、surfaces：和戰鬥地圖（content/maps/）同寫法；
#   地形 ID 在 content/terrain.yaml、物件 ID 在 content/objects.yaml。座標 (x, y)：x 向右、y 向下。
# - exits：邊緣出口（可佔好幾格）；to＝相鄰地點，arrive＝對面地圖上回來的出口 ID。
#   出口 ID 慣例：to_<目的地點>，所以對面回來的出口一律叫 to_<本地點>。一條地點連線＝一對出口。
#   跨區的渡口寫 region: <區域>（見 fields.py 模組說明）。
# - doors：門與洞口；to＝本地點的室內圖 ID，或相鄰的隱藏地點（那時要寫 hidden_until: reveal）。
# - teleport_stones：每區 2～3 個、城鎮 1 個。entry：預設入口（舊存檔、傳送、全滅回城）。
# - npcs：world/npcs/<區域>.yaml 的人設卡；facilities：shop、smithy、tavern、mentor、
#   notice_board、hire、enchanter（走到旁邊就開面板）。
# - spawns（6C-1）、campfires、event_spots、situation_objects（6C-5）：這段只定義欄位。
#
# 草稿說明：外觀在 6B-ART1 才到，先用現有地形拼。北路往獵戶小屋、東路口往渡口石階、
# 南邊過霧河的木棧橋往「往灰燼荒原的渡口」（照 18.3 的 pos：渡口石階在東、獵戶小屋在北、
# 渡口在西南）。牆（#）是建築：西北酒館、東北鐵匠鋪、西邊導師堂；霧河（=）用深淵代替。
