  - {at: [4, 15], kind: wooden_bridge}
  - {at: [3, 16], kind: wooden_bridge}
  - {at: [4, 16], kind: wooden_bridge}
  - {at: [8, 7], kind: stone_pillar}     # 懸賞板的石柱
  - {at: [14, 11], kind: crate}          # 柳掌櫃的攤位
