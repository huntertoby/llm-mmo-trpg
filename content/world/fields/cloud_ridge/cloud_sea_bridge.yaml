# 雲海吊橋實地地圖（6C-4；玩法 PM 草稿第 9 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18（草稿待確認 1：照草稿用 24×18、4 個出口），建議 3～4 級，傳送石：
# 一座長吊橋跨過雲海深淵，兩岸是岩台；修士在橋上巡邏。
# 西邊南岸往古松祭壇、南邊南岸山道往青霧觀山門、東南的東岸下坡往藥師谷、北岸石階往劍冢。
# 高度：南岸 0（西側岩台 1）、北岸 1、北岸岩台 2（雲鶴使站在高處）。
# 吊橋寬 2 格（x 9～10），整段是木橋物件，兩側是深淵（致命）；中段可以斬斷繩索。
# 致命地形不擋唯一通路：東側崖邊有一條 2 格寬的石徑繞過深淵，吊橋斷了照樣過得去。
# 傳送石在南岸。敵人：北橋頭駐守 sword_array；橋上巡邏 bridge_patrol。
# 事件點：北岸岩台（crane_envoy）。
