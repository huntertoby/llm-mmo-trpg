# 青霧觀山門實地地圖（6C-3；玩法 PM 草稿第 5 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 2 級，營火：山門牌坊、香客小村、修士守門；區域任務鏈起點。
# 南邊參道往雨中梯田；山門後的山道往東北接雲海吊橋（6C-4，配對待補）。
# 高度：香客小村 0、山門前石坪 1、山門後 2。觀牆一整列，只有參道的牌坊口過得去；石柱是牌坊。
# 香爐是油桶；茶棚用木箱當桌子，營火在茶棚旁。
# 敵人：平時沒有（村落）。山門守衛 temple_gate_guard 照草稿待確認 7 是「不主動開戰的友方守衛」，
# 只在叛徒戰線頭到期時變成 temple_traitor 的叛徒戰，所以不放進 spawns（spawns 是碰到就開打的
# 敵人）；守衛站的位置是牌坊口內側 [11, 5]、[12, 5]，留給 6C-1 決定怎麼畫叛徒戰。
# NPC：青崖道長（導師任務鏈）、小蓮（人設卡都在這裡）。事件點：茶棚（monks_dispute）。
