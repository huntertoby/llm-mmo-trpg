# 往灰燼荒原的渡口實地地圖（6C-3；玩法 PM 草稿第 18 張；Phase 6 計畫 Q2：渡口是一張短的路徑圖）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 路徑圖 20×12：雲海（深淵）上的長棧橋，東北接霧渡鎮的碼頭，往西走到棧橋盡頭就上船，抵達灰燼荒原
# 的灰渡口（跨區出口 region: ashen_waste；灰渡口的地圖在 6D-1，配對待補）。棧橋用泥土地形畫，
# 寬 4 格，不用會被打斷的木橋物件。盡頭繫著的渡船用木箱表示。
# 開放：世界事件 #1 成功（或失敗後第 4 天）才開放，開放前霧渡鎮那一側用柵欄封住（地點的
# unlock_flag，由走路動作擋）。每個人第一次抵達灰渡口後，荒原才在自己的大世界圖上亮起（21.1）。
# 沒有敵人、沒有事件（傳送類地點）。
id: ashen_ferry
name_zh: 往灰燼荒原的渡口
region: cloud_ridge
location: ashen_ferry
size: [20, 12]
heights: |
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
terrain: |
  ===============,,,,=
  ===============,,,,=
  ===============,,,,=
  ===============,,,,=
  ,,,,,,,,,,,,,,,,,,,=
  ,,,,,,,,,,,,,,,,,,,=
  ,,,,,,,,,,,,,,,,,,,=
  ,,,,,,,,,,,,,,,,,,,=
  ====================
  ====================
  ====================
  ====================
legend:
  ",": dirt
  "=": chasm
objects:
  - {at: [1, 4], kind: crate}   # 往荒原的渡船
  - {at: [1, 7], kind: crate}
  - {at: [6, 4], kind: stone_pillar}   # 繫船的石樁
  - {at: [11, 7], kind: stone_pillar}
  - {at: [17, 2], kind: crate}   # 碼頭的貨
entry: [16, 2]
exits:
  - {id: to_mist_ferry, at: [[16, 0], [17, 0]], to: mist_ferry, arrive: to_ashen_ferry}   # 東北：霧渡鎮的碼頭
  - {id: to_ash_ferry, at: [[0, 5], [0, 6]], to: ash_ferry, arrive: to_ashen_ferry, region: ashen_waste}   # 西：棧橋盡頭上船
