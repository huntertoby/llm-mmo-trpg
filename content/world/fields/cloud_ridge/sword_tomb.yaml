# 劍冢實地地圖（6C-4；玩法 PM 草稿第 15 張）。
# 格式說明見 mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 遺跡 24×18，建議 5 級：插滿殘劍的古戰場，中央是殘留的劍陣；懸賞「霧中劍客」。
# 南邊往雲海吊橋（對到吊橋北岸石階）；西邊小路往源晶裂痕。
# 高度：古戰場 0、中央劍陣石台 1（四角是石柱）。
# 殘劍叢用矮牆（擋路但不擋視線）；中央的殘劍是事件點 tomb_sword（拔劍點），不另放物件。
# 敵人：石台駐守 tomb_array；外圍巡邏 tomb_swordsmen。
# 懸賞期間換成 mist_swordsman_band 加霧中劍客，是遭遇表的事（6C-1 接）。
# 事件點：殘劍（tomb_sword）、西側小路（shard_convoy）。
