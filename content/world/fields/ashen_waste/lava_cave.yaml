  - {at: [18, 6], surface: water}
entry: [2, 9]
exits:
  - {id: to_tar_pits, at: [[0, 8], [0, 9]], to: tar_pits, arrive: to_lava_cave}   # 西：洞口，往焦油坑
  - {id: to_horned_altar, at: [[23, 8], [23, 9]], to: horned_altar, arrive: to_lava_cave}   # 東：往角魔古祭壇
  - {id: to_ruined_fortress, at: [[11, 0], [12, 0]], to: ruined_fortress, arrive: to_lava_cave}   # 北：往廢墟要塞
spawns:
