# 熔岩洞窟實地地圖（6D-2；玩法 PM 草稿第 15 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 7～8 級：地底熔岩河與洞穴，熔核領主背著熔岩池守在深處（岩漿渡橋＋狹窄長廊，5F5a-8）。
# 出口：西往焦油坑、東往角魔古祭壇、北往廢墟要塞。三個出口都在熔岩河北側的主洞，彼此走得到。
# 熔岩河（lava，致命）橫在 y 12～13，把南邊的深處（熔核領主的洞）隔開；石橋 2 座用石地畫（不是木橋，打不斷），
#   深處是死路，不是任何出口的必經之路。熔岩池在深處東側。
# 鐘乳石用石柱（可推倒）。水源：洞頂滴水形成的水窪（水表面 2 格）。
# 敵人：洞口駐守 cave_beetles；熔岩池旁駐守 cave_lord（精英熔核領主；懸賞期間換成 molten_lord_band 是遭遇的事）；
#   主洞通道巡邏 beetle_line。
# 事件點：熔岩池（molten_lord_pool）、洞口（lost_pup）。
id: lava_cave
name_zh: 熔岩洞窟
