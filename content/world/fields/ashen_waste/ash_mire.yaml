# 灰泥沼實地地圖（6D-1；玩法 PM 草稿第 7 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 6 級：灰色泥沼，水和泥混在一起，是荒原裡「水能發揮」的地方；熔核蛞蝓爬過的地方會留下油
# （那是單位的特性，地圖不預放油）。泥地用泥土，沼水用一大片水表面（x 5～18、y 5～12），
# 沼中 4 個石墩高 1（石地），枯蘆葦用草叢物件（可燃）；北側是灰燼地（草地）。
# 北邊往灰井村（6D-2，待補）；東南往舊鐵哨站。
# 敵人：沼中駐守 mire_slugs；沼邊小路巡邏 mire_mix。
# 事件點：沼邊小路（water_caravan）。
