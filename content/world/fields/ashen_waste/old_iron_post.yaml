# 舊鐵哨站實地地圖（6D-1；玩法 PM 草稿第 4 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 5 級，營火、傳送石（城北的交通樞紐）：舊時代的鐵哨站，現在是獵人和拾荒者的落腳處，
# 區域任務鏈起點。中央是鐵板地（石地），鐵哨塔用石柱（watchtower 待使用者確認）、帳篷用木箱（tent 待確認），
# 四角留著鐵欄殘段（矮牆）。區域題目「怕水」（草稿第 0 節、待確認 5）：有戰鬥的圖至少一處水（水表面）。
# 南邊往餘燼集（6D-3，待補）；西北往灰泥沼；東北往冷卻井。
# NPC：老鐵（scavenger_laotie）。草稿的「獵人」沒有人設卡（world/npcs/ashen_waste.yaml），先不放。
# 敵人：哨站外圍巡邏 scavenger_beasts。哨站是村落但不是三村落，碰到是一般戰鬥（草稿待確認 4）。
# 事件點：帳篷（laotie_dig）、水槽（water_caravan）。
