# 枯木林實地地圖（6D-1；玩法 PM 草稿第 5 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 5～6 級：燒焦的枯樹林，地面是灰燼地（草地），非常易燃；硫煙獸冒著黃煙。
# 枯木叢用枯樹（dead_grove 待確認，草稿第 0 節：還沒進 objects.yaml 前用 dead_tree）、倒木；
# 硫磺坑用毒霧表面。區域題目「怕水」（草稿第 0 節、待確認 5）：有戰鬥的圖至少一處水（快乾的溪，水表面 3 格）。
# 南側一條林間小路（泥土）東西貫穿：西南往焦土外圍、東南往斷崖幫運輸道；東側小路上方是開闊處。
# 敵人：林中駐守 deadwood_sulfur；林間小路巡邏 colossus_smoke。
# 事件點：林間小路（ashen_deserter）、開闊處（sandstorm）、林緣（ashen_convoy）。
