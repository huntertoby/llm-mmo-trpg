# 鐵爐村實地地圖（6D-2；玩法 PM 草稿第 13 張；三村落之一）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 8 級，營火：靠熔岩取熱的鐵匠村，敵人最重。
# 唯一的出口在西北，回熔爐督工營。村口是西面土牆的缺口 [7, 8]～[7, 9]。
# 守點戰（21.9 第 20 條；草稿待確認 2、3）：守點目標是村中央的大鐵砧，記成情境物件 iron_forge_anvil [11, 9]；
#   駐守 village_raid_heavy 放在村口外 [6, 9]，離鐵砧曼哈頓 5 格。
# 熔岩取熱池（lava，致命）用矮牆（low_wall）整圈圍起來，不在任何通路上。鐵匠屋只畫外牆。
# 水源：淬火池（水表面 2 格）。
# NPC：草稿的「鐵爐村的鐵匠」沒有人設卡（world/npcs/ashen_waste.yaml 的鐵匠是餘燼集的爐叔），先不放。
# 事件點：鐵匠屋門口（forge_smith）。
