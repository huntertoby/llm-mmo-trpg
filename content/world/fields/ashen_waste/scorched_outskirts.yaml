# 焦土外圍實地地圖（6D-1；玩法 PM 草稿第 3 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 5 級：餘燼集外的焦土平原（泥土），幾片灰燼地（草地），地面有裂縫，餘燼蜥在灰裡鑽進鑽出。
# 焦土的裂縫：岩漿（~）1 格寬，第一張圖只放 2 段（x 6～12 的橫裂縫、x 16 的直裂縫），都繞得過去。
# 半埋的舊機械：瓦礫物件（拾荒者的挖掘點，事件 laotie_dig）。區域題目「怕水」（草稿第 0 節、待確認 5）：有戰鬥的圖至少一處水（水表面）。
# 西邊往餘燼集（6D-3，待補）；東北往枯木林；東南往赤沙村（6D-2，待補）。
# 敵人：平原中央駐守 lizard_swarm；南邊路上巡邏 hound_pack。
# 事件點：舊機械旁（laotie_dig）、開闊地（sandstorm，限白天由骨架決定）。
