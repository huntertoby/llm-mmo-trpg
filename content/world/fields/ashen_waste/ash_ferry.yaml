# 灰渡口實地地圖（6D-1；玩法 PM 草稿第 1 張；schema：src/trpg/content/fields.py）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 路徑圖 20×12：荒原這一側的渡口。焦黑的棧橋往西南伸進灰河，半沉的舊渡船泡在棧橋旁，岸上堆著鏽鐵。
# 西南：棧橋盡頭上船，跨區回雲嶺「往灰燼荒原的渡口」（region: cloud_ridge，和雲嶺 ashen_ferry 的
# to_ash_ferry 互指；草稿待確認 12）。東北：岸上的廢鐵門往餘燼集（餘燼集城鎮圖在 6D-3，配對待補）。
# 灰河沒有水的地形，深水照 6C-3 的做法用深淵畫（=），岸邊淺水用水表面；棧橋用石地畫、寬 2 格，
# 不用會被打斷的木橋物件（6C-3 報告第 5 節第 6 條）。
# 「第一次親自走過渡口，荒原才在自己的圖上亮起」（21.1、21.9 第 4 條）是程式的事（6D-5／6C-6），
# 地圖上沒有欄位。沒有敵人、沒有事件（傳送類地點）。
id: ash_ferry
name_zh: 灰渡口
region: ashen_waste
location: ash_ferry
size: [20, 12]
heights: |
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
  00000000000000000000
terrain: |
  ======,,,,,,,,,,,,,,
  ======,,,,,,,,,,,,,,
  ======,,,,,,,,,,,,,,
  ======,,,,,,,,,,,,,,
  =======,,,,,,,,,,,,,
  ========,,,,,,,,,,,,
  =========,,,,,,,,,,,
  ==========,,,,,,,,,,
  ..........,,,,,,,,,,
  ..........,,,,,,,,,,
  ====================
  ====================
legend:
  ",": dirt
  ".": stone
  "=": chasm
objects:
  - {at: [2, 7], kind: crate}   # 半沉的舊渡船（深水裡，裝飾）
  - {at: [3, 7], kind: crate}
  - {at: [13, 3], kind: rubble}   # 岸上的廢鐵堆
  - {at: [14, 3], kind: rubble}
  - {at: [14, 4], kind: rubble}
  - {at: [16, 7], kind: rubble}
  - {at: [17, 6], kind: rubble}
surfaces:
  - {at: [6, 1], surface: water}   # 岸邊淺水
  - {at: [6, 2], surface: water}
  - {at: [7, 4], surface: water}
  - {at: [8, 5], surface: water}
  - {at: [9, 6], surface: water}
  - {at: [10, 7], surface: water}
  - {at: [10, 9], surface: water}
  - {at: [11, 9], surface: water}
entry: [12, 6]
exits:
  - {id: to_ashen_ferry, at: [[0, 8], [0, 9]], to: ashen_ferry, arrive: to_ash_ferry, region: cloud_ridge}   # 西南：棧橋盡頭上船，回雲嶺
  - {id: to_ember_market, at: [[16, 0], [17, 0]], to: ember_market, arrive: to_ash_ferry}   # 東北：岸上的廢鐵門
