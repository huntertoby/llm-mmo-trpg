# 赤沙村實地地圖（6D-2；玩法 PM 草稿第 6 張；三村落之一）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 6 級，營火：紅沙地上的小村，土牆圍著村子，村中央是水井。
# 世界事件 #2「熔岩潰堤」要守的第一個村子，敵人最輕。
# 唯一的出口在西北，回焦土外圍。村口是北面土牆的缺口 [10, 4]～[11, 4]。
# 守點戰（21.9 第 20 條；草稿待確認 2、3）：守點目標是村中央的水井，記成情境物件 red_sand_well [12, 8]；
#   駐守 village_raid_light 放在村口外 [11, 3]，離水井曼哈頓 6 格，切出的 12×12 同時包含接觸點和水井。
# 土牆用 earth_wall 物件；村民的屋子只畫外牆（沒有室內）。水源：水井旁的水表面 2 格（區域題目「怕水」）。
# NPC：草稿的村民、孩子沒有人設卡（world/npcs/ashen_waste.yaml），先不放。
# 事件點：村口（lost_pup）。
