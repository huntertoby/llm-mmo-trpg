# 灰井村實地地圖（6D-2；玩法 PM 草稿第 10 張；三村落之一）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 村落 24×18，建議 7 級，營火：圍著一口灰井的村子，常年缺水，敵人中等。
# 唯一的出口在南邊，回灰泥沼。村口是南面土牆的缺口 [11, 14]～[12, 14]。
# 守點戰（21.9 第 20 條；草稿待確認 2、3）：守點目標是灰井，記成情境物件 ash_well [12, 10]；
#   駐守 village_raid_mid 放在村口外 [12, 15]，離灰井曼哈頓 5 格。
# 土牆用 earth_wall 物件；屋子只畫外牆。水源：水缸（水表面 2 格）。灰井本身是乾的，不放水。
# 事件點：無（骨架 2 運水隊的目的地是這裡，但事件在灰泥沼和哨站觸發）。
