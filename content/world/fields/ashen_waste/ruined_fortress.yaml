# 廢墟要塞實地地圖（6D-2；玩法 PM 草稿第 17 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 遺跡 24×18，建議 8 級，傳送石（Boss 前，在要塞內庭）：碎界前的要塞廢墟，城牆倒塌，石碑上刻著古文。
# 城牆（wall）圍成 x 2～20、y 2～15，南門 [11, 15]～[12, 15]、東邊後門 [20, 4]～[20, 5]；
#   北牆、西牆各有一段倒成矮牆（low_wall）的缺口。西北角的城樓高 2，東側一格高 1 的台階上去。
# 出口：南往熔岩洞窟；東往熔心坑（後門外的岩坡）。
# 熔心坑的入口（草稿待確認 6）：後門外的岩坡記成情境物件 pit_lava_seal（熔岩封住的通道），
#   開放時間照 5F5a-2（世界事件 #2 成功時立刻、失敗時第 8 天 6 點）；擋路是走路動作照地點 unlock_flag 的事，
#   地圖上不畫會擋路的物件，封住時的提示「岩漿還在流，過不去」也是那時接。
# 石碑：情境物件 fortress_stele（主線第 2 章第 3 步、事件 11）。水源：古蓄水池（水表面 2 格）。
# 敵人：內庭駐守 fortress_bandits；東城牆外巡邏 fortress_beasts。
# 事件點：石碑（fortress_stele）。
