# 冷卻井實地地圖（6D-1；玩法 PM 草稿第 8 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 遺跡 24×18，建議 6 級，營火：古代的冷卻裝置。中央是巨大的井圈（石地高 1），井口是深淵（=）。
# 古代裝置：情境物件 cooling_well_relic（井圈北緣，用機關或學識修理；事件點同名放在旁邊）。
# 啟動後「附近 3 個地點變有水」只留成線頭，不做機制（5F5a-9）。
# 四周 3 口小冷卻井：cooling_well 物件（打破後造水，十字 5 格）待使用者確認，先用預放的水表面代替
# （草稿待確認 7）。斷管用矮牆。
# 西南往舊鐵哨站；東北往焦油坑。
# 敵人：井邊駐守 well_guardians。事件點：古代裝置（cooling_well_relic）。
