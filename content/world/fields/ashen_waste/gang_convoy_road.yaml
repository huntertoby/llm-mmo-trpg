# 斷崖幫運輸道實地地圖（6D-1；玩法 PM 草稿第 9 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 6 級（草稿待確認 1：照草稿用 24×18，兩群對峙放得下）：沿著岩漿河的運輸路，
# 盜賊用推車押送源晶碎片。主線第 2 章第 2 步：攔截運輸隊（撤離勝利條件，是遭遇的事）。
# 岩漿河（~）沿北側 y 3～4，致命；2 座木橋跨岩漿通往北岸的藏貨處（北岸不是必經之路，
# 所以木橋被打斷也不擋出口）。推車用木箱（cart 待確認），放在路北側，可以推進岩漿。
# 南側是灰燼地（草地）。區域題目「怕水」（草稿第 0 節、待確認 5）：有戰鬥的圖至少一處水（路邊的水桶站，水表面 2 格）。
# 西邊往枯木林；東南往熔爐督工營。
# 敵人：路中央駐守 convoy_guard；東段駐守 convoy_raid（陣容本身帶 third：獸群對盜賊，兩群對峙，
# 碰到就開三方戰，照雲嶺的畫法只放一個點）。
# 事件點：路旁（ashen_deserter、burned_bandit）、推車（ashen_convoy）。
