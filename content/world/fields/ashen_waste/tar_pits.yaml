# 焦油坑實地地圖（6D-1；玩法 PM 草稿第 11 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 營地 24×18，建議 7 級，傳送石（北部的分岔，在南側）：冒泡的焦油池（大片油表面），油加火。
# 熔爐母獸在西南的巢（瓦礫）產卵，噴岩龜站在東北的岩台（石地高 1～2）上拋射。
# 岩台下的滲水用水表面 2 格（區域題目「怕水」）。
# 西南往冷卻井；東往熔岩洞窟（6D-2，待補）。
# 隱藏：西北岩壁上被黑曜碎石堵住的窄縫是黑曜谷的入口（門 obsidian_valley_crack，hidden_until: reveal；
# 黑曜谷在 6D-2，配對待補）。顯示條件（3 格內感知、線頭「老鐵知道黑曜谷在哪」、朋友的足跡）是
# reveal 的事，地圖只畫窄縫的位置。
# 敵人：池邊岩台駐守 tar_tortoises；母獸巢駐守 tar_brood（線頭「母獸的後代在擴散」到期後換成
# brood_spread，是遭遇表 variants 的事）；南側小路巡邏 lizard_brood。
# 事件點：母獸巢（furnace_brood）、開闊處（sandstorm）。
