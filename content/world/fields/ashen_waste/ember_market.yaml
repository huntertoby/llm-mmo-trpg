# 餘燼集實地地圖（6D-2；玩法 PM 草稿第 2 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 小鎮 24×18：廢鐵搭成的避難市集。地上是焦土（dirt）和鐵板路（stone），中央有一口大水缸（水表面 2×2），
# 傳送石在水缸旁。城鎮是安全區，沒有敵人，只出非戰鬥事件。
# 出口：西南往灰渡口（岸邊的廢鐵門）、東門往焦土外圍、北門往舊鐵哨站。
# 建築（外觀在美術段才到，先用牆拼）：西北酒館、東北爐叔鐵鋪（含餘燼附魔台）有室內（6D-3）：
#   酒館門 [3, 5] → interiors/ember_market_tavern.yaml、鐵鋪門 [19, 5] → interiors/ember_market_smithy.yaml。
#   鐵匠（smithy）、酒館（tavern）、雇用（hire）、附魔台（enchanter）的設施在室內（比照霧渡鎮）。
# 攤位與設施：鐵娘的廢鐵攤（shop）、懸賞板（notice_board，石柱）、灰鬚站在酒館外的牆邊（mentor，19.5）。
# NPC：鐵娘、灰鬚。爐叔（smith_lu）在鐵鋪室內（6D-3）。
# 事件點：酒館老兵（tavern_veteran）在酒館室內（6D-3 由門口外移進去），鎮上不放事件點。
# 「餘燼集－裂界門」照 5F5a-1 不畫。
