# 角魔古祭壇實地地圖（6D-2；玩法 PM 草稿第 16 張）。
# 格式說明見 cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北（照地點圖的 pos，玩法 PM 草稿）。
# 祭壇 24×18，建議 7 級：角魔的古老火焰祭壇。唯一的出口在西邊，回熔岩洞窟；東、北是岩壁。
# 石坪（stone）中央是高 1 的祭壇台，火焰祭壇記成情境物件 horned_fire_altar（機遇 noon_altar 的地點）；
#   四周石柱圈 4 根；聖火盆用油桶（換外觀）。水源：祭壇前（西側）的淨水池（水表面 2 格）。
# NPC：赫琳（主線推進前在祭壇前）。
# 敵人：祭壇外圍（南側）駐守 altar_wraiths。主線第 2 章第 4 步時換成三方的 altar_betrayal，
#   第 4 步完成後恢復（草稿待確認 9）：這是遭遇的事，地圖只放 altar_wraiths 一個駐守點。
# 事件點：祭壇（horned_pilgrim、noon_altar；後者限晴天白天，由骨架決定）。
