# 主城酒館室內（6D-4；玩法 PM 主城草稿第 1、2 節；格式說明見 ../../cloud_ridge/mist_ferry.yaml 開頭）。
# 10×8：南邊門口回到主城的酒館門（東牆 [5, 11]）。
