    figure:
      portrait:
        look: {skin: '#f1c9a5', hair: bun, hair_color: '#c8d0d8', bun_band: '#4ad0c8'}
        gear: {body: {kind: robe, color: '#2a5a7a', trim: '#cfe8f0'}, off_hand: {kind: orb, material: crystal}}
        extras: [earring, wrinkles]
      facing: w
