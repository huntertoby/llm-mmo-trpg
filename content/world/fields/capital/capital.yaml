    name_zh: 守池人
    note_zh: 池水記得每個走過這裡的人。說說你想要什麼樣的力量——說得越具體，它越聽得懂。   # WP-2：也是許願池面板標頭下守池人的那一句（TXT-2：玩法 PM 定稿句）
