        look: {skin: '#d9a47a', hair: long, hair_color: '#d8d0c0', beard: true}
        gear: {body: {kind: robe, color: '#3a3a6a', trim: '#e8bb48'}, head: {kind: hood, color: '#2a2a4a'}}
      held: {kind: staff, material: crystal}
      facing: e   # RT-5b：面向東邊剛醒來的主角
