# 主城實地地圖（6D-4；玩法 PM 草稿 `玩法PM-Phase6主城草稿.md`，2026-11-04，未寫入設計文件）。
# 格式說明見 ../cloud_ridge/mist_ferry.yaml 開頭；方向：x 越大越東、y 越小越北。
# 主城的寫法（src/trpg/content/fields.py 模組說明）：region: capital、location: capital；主城不在任何
# 區域的地點圖裡，沒有走路的出口（exits 空），只能傳送抵達（抵達方式、大世界圖一開始就解鎖是 6D-5）。
# 名稱暫用「樞島」（草稿待確認 1）。32×24：五區中央的浮島城市，邊緣是雲（深淵）。
#
# 建築與設施（草稿第 1 節；牆、石柱、木箱是規則，外觀是 6D-ART2 的 buildings 與物件 look，只畫）：
# - 中央廣場（11～20, 9～14）：傳送石 [15, 11]、抵達點（entry）在傳送石旁 [16, 11]、公告板（石柱）。
#   四角的石柱是源晶燈。
# - 北：技能導師殿（5×4，門 [15, 4] → interiors/capital_mentor_hall.yaml）。
# - 西：酒館（4×4，東牆的門 [5, 11] → interiors/capital_tavern.yaml）。
# - 東：鐵匠鋪（4×3，西牆的門 [25, 11] → interiors/capital_smithy.yaml，含附魔台）。
# - 東北：封印廣場（封印台、裂界投影＝賽季 Boss 挑戰入口〔草稿待確認 5〕、Boss 擊殺石碑）。守印人 RT-5b 起站在中央廣場傳送石旁。
# - 西北：許願池（水表面 2×2、守池人）。
# - 東南：技能工坊靶場（木人樁用 crate、工坊師傅）。
# - 南：傭兵營（帳篷用牆、傭兵管事＝hire、影子循環賽報名台）。
# - 西南：整備亭（四根石柱的亭子；換技能組、配點、換裝、休息是 6D-5 的規則）。
# 功能型 NPC 沒有人設卡（草稿待確認 2）：不放 npcs（npcs 會開自由聊天、要人設卡），站位寫成
# facilities（有現成設施種類的：導師、酒館、鐵匠、附魔台、公告板、雇用）或 situation_objects
# （沒有現成種類的：守印人、守池人、工坊師傅、書記），點了直接開面板（面板接線是 6D-5）。
# 6V-1：這四位在原本的格子上多一個 `figure`（紙娃娃與頭像，只畫；不改互動、不擋路、不是 npcs）。
# 五座浮橋（草稿第 3 節，方向待確認 4）：橋面是深淵上的木橋（wooden_bridge），伸到地圖邊緣但不是出口；
# 橋頭石碑（石柱）開該區的傳送選單。兩者都寫成 situation_objects：bridge_<區域>、stele_<區域>。
#   西 雲嶺、南 灰燼荒原、北 晶冠城邦、東 魔導樞市、東南 霜潮海境。
# 安全區（草稿第 4 節）：沒有 spawns、沒有營火、沒有事件點（主城沒有自己的事件骨架）。
