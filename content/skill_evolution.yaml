# 3 級分歧進化的模板（Phase 3-26b，docs/design/06-技能.md 6.28；玩法決定 #38）。
#
# 升到 3 級時，引擎依這招的用法統計（trpg.skillgen.evolution）從這裡挑兩支：
#   加深（deepen）：強化這招自己的關鍵字；
#   橋接（bridge）：往最常一起用的關鍵字（前後搭配的技能、打到的目標身上的狀態）。
# 模板只描述「怎麼改」，不寫強度：套用之後依同階預算重新調整骰子與倍率（沿用隨機組合器的調整器），
# 再交給驗證器；不合格的模板不出現。稀有度只決定可用的原語、不加強度（6.12）：進化後的稀有度取
# 「原本」與「新內容需要」中較高的一個（不會變成傳說）。
# 戰場變奏（6.24，battle_variant）：進化時加一個變奏，候選共用 skill_composer.yaml 的 variant。沒有 LLM 時名稱用組合式「{前綴}・{原名}」。

far_distance: 3                 # 平均施放距離 ≥ 3：換形狀先試遠距離的形狀
spread_targets_permille: 1500   # 平均目標數 < 1.5：視為單體用法，加深優先換形狀
bridge_keyword_tries: 3         # 橋接最多試 3 個關鍵字（依統計排序）

templates:
  # ---- 加深 ----
  - id: intensify
    branch: deepen
    op: intensify
    summary_zh: 加深{keyword}：這招製造的{keyword}多持續 1 回合，或補上製造{keyword}的效果
  - id: reshape
    branch: deepen
    op: reshape
    prefix_zh: 擴散
    summary_zh: 換形狀：一次打到更多目標（傷害依預算調整）
    skeletons: [area]
    shapes:
      - {shape: {type: line, size: 3}, reach: far}
      - {shape: {type: square3, range: 4}, reach: far}
      - {shape: {type: cone, size: 2}, reach: near}
      - {shape: {type: cross, range: 3}, reach: near}
  - id: extend
    branch: deepen
    op: extend
    prefix_zh: 恆久
    summary_zh: 延長：這招的狀態、表面與區域都多持續 1 回合（效果依預算調整）
  - id: delayed_burst
    branch: deepen
    op: delay
    prefix_zh: 延爆
    summary_zh: 延遲大範圍：貼上目標，下一輪在周圍爆開
    delay_rounds: 1
    delay_radius: 1
    skeletons: [control]
  - id: kill_chain
    branch: deepen
    op: on_kill
    prefix_zh: 收割
    summary_zh: 擊殺接續：打倒敵人時返還 1 AP
    on_kill:
      - {type: refund_ap, amount: 1}
  - id: battle_variant
    branch: deepen
    op: variant
    prefix_zh: 變奏
    summary_zh: 戰場變奏：在特定地形下自動換成另一種型態（強度依預算調整）

  # ---- 橋接 ----
  - id: bridge_exploit
    branch: bridge
    op: graft_uses
    summary_zh: 橋接{keyword}：目標帶有{keyword}時加碼
    skeletons: [combo]
  - id: bridge_imbue
    branch: bridge
    op: graft_makes
    summary_zh: 橋接{keyword}：命中時製造{keyword}

# 各關鍵字的嫁接效果。makes：製造該關鍵字（數值固定）；uses：利用它的加碼傷害（強度由預算調整）。
# 沒有簡單嫁接方式的一邊省略（例：召喚物、高處的製造），該方向的模板就不會出現。
grafts:
  ignite:
    prefix_zh: 灼燃
    makes: {type: apply_status, status: burning, duration: 1}
    uses: {type: damage, condition: {type: target_has_status, status: burning}}
  wet:
    prefix_zh: 潮濕
    makes: {type: create_surface, surface: water}
    uses: {type: damage, condition: {type: target_on_surface, surface: water}}
  charged:
    prefix_zh: 雷鳴
    makes: {type: damage, element: lightning}
    uses: {type: damage, condition: {type: cast_tag_this_turn, tag: lightning}}
  frozen:
    prefix_zh: 霜結
    makes: {type: create_surface, surface: ice}
    uses: {type: damage, condition: {type: target_has_status, status: frozen}}
  prone:
    prefix_zh: 崩倒
    makes: {type: knock_prone}
    uses: {type: damage, condition: {type: target_has_status, status: prone}}
  collision:
    prefix_zh: 衝撞
    makes: {type: push, distance: 1}
    uses: {type: damage, condition: {type: target_collided}}
  marked:
    prefix_zh: 印記
    makes: {type: apply_status, status: marked, duration: 2}
    uses: {type: damage, condition: {type: target_has_status, status: marked}}
  high_ground:
    prefix_zh: 居高
    uses: {type: damage, condition: {type: height_advantage}}
  concealed:
    prefix_zh: 暗影
    makes: {type: create_surface, surface: smoke, duration: 2}
    uses: {type: damage, condition: {type: self_concealed}}

# 召喚技能的三支分歧進化（Phase 3-33f2，docs/design/06-技能.md 6.29.4；數值為初值，未經模擬）。
# 召喚技能沒有可調的骰子，進化直接改 summon 效果（見 trpg.skillgen.summon_evolution）：
#   加深＝單隻更強並多一個小特性｜橋接＝召喚物多帶一個灌注關鍵字｜數量型＝一次召喚 2 隻較弱的。
# 進化後照同階預算驗證；超出時依序縮短持續輪數、增加冷卻（不加強度）。
summon:
  deepen_prefix_zh: 強化
  deepen_hp_permille: 300
  traits: {static: sturdy, melee: swift, ranged: keen}   # 小特性依召喚物定位挑（core.yaml 的 summon_traits）
  count_prefix_zh: 雙生
  count_number: 2
  count_power_permille: 600
  min_duration: 1
