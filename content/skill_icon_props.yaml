# 技能圖示道具的允許清單（Phase IP-1，06 6.36，玩法決定 #151）。
#
# 技能的選填欄位 icon_prop（content/skills/*.yaml）只能填這裡的 id，而且要和技能的武器大類對得上：
# 道具有 weapon_class 時，技能的 weapon_req 必須相同或是 any；沒有 weapon_class 的道具不限大類。
# 只影響圖示，不進引擎結算、預算、重播與出題。只有 content/skills/ 的手寫技能可以填；LLM 生成的技能
# 與白板配方不帶這個欄位。
#
# 來源：docs/art/技能圖示道具清單.md 第 1 節（美術 PM 維護，64 個值）。新增道具要先有圖、過美術審查，
# 再加進美術清單，最後才加到這裡。
#
# 欄位：
#   id            道具值（w: 武器／副手／中性、el: 元素、summon: 召喚物、form: 化身、none）
#   name_zh       中文名
#   group         weapon／offhand／neutral／element／summon／form／special
#   weapon_class  適用的武器大類 melee／ranged／focus；省略 ＝ 不限
#                 副手：盾算近戰，法書與法器珠算法器；拳套與飛刃是中性道具（不限）
props:
  # 1.1 武器（17）
