# 技能的觸發時機（docs/phases/Phase2E計畫.md 3.1）。被動技能（kind: passive）的 trigger.event 引用這裡的 id。
# 帶有此被動的單位稱為「持有者」；has_other 為 true 的時機有「另一方」單位，trigger.target: other 才能使用。
# budget_coefficient_permille：被動的預算係數（‰），取代主動技能的 AP 係數
#   可用預算 ＝ tier_budget × 係數 × (1000 ＋ 代價折抵) ÷ 1000；max_per_round 每多 1 次 × passive_extra_trigger_permille
# budget_by_n_permille：every_n_hits 依 n（2 或 3）查表
# min_rarity：使用此時機的最低稀有度（Phase 2E 決定 H：被動全部 epic）
# 所有係數都是初值，未經模擬（Phase 2E 決定 J）。
triggers:
  - id: on_hit
    name_zh: 命中時
    llm_hint: "持有者的攻擊命中時自動發動。"
    description_zh: 持有者的攻擊（普攻或技能）命中一個單位，在該次傷害結算之後。另一方為被命中的單位。
    has_other: true
    budget_coefficient_permille: 400
    min_rarity: epic
  - id: on_crit
    name_zh: 暴擊時
    llm_hint: "持有者的攻擊暴擊時自動發動。"
    description_zh: 同「命中時」，且為暴擊。另一方為被命中的單位。
    has_other: true
    budget_coefficient_permille: 250
    min_rarity: epic
  - id: on_natural_20
    name_zh: 擲出自然 20 時
    llm_hint: "持有者的攻擊擲出最高點數時自動發動。"
    description_zh: 持有者的攻擊擲出自然 20（不論是否命中，只計單位目標）。另一方為攻擊目標。
    has_other: true
    budget_coefficient_permille: 150
    min_rarity: epic
  - id: on_kill
    name_zh: 擊倒時
    llm_hint: "持有者擊倒敵人時自動發動。"
    description_zh: 持有者造成的傷害（任何來源歸給持有者）讓單位倒下。另一方為倒下的單位（對它的傷害與狀態無效）。
    has_other: true
    budget_coefficient_permille: 300
    min_rarity: epic
  - id: on_damaged
    name_zh: 受傷時
    llm_hint: "持有者受到傷害時自動發動。"
    description_zh: 持有者受到傷害（數值大於 0，任何原因）。另一方為傷害來源（沒有來源時無）。
    has_other: true
    budget_coefficient_permille: 400
    min_rarity: epic
  - id: on_turn_start
    name_zh: 回合開始時
    llm_hint: "持有者的回合開始時自動發動。"
    description_zh: 持有者回合開始，在狀態與表面的回合開始效果之後（被跳過的回合不觸發）。
    has_other: false
    budget_coefficient_permille: 500
    min_rarity: epic
  - id: on_turn_end
    name_zh: 回合結束時
    llm_hint: "持有者的回合結束時自動發動。"
    description_zh: 持有者回合結束，在狀態倒數之前（被跳過的回合不觸發）。
    has_other: false
    budget_coefficient_permille: 500
    min_rarity: epic
  - id: on_move
    name_zh: 移動後
    llm_hint: "持有者主動移動完成後自動發動。"
    description_zh: 持有者的一次主動移動動作完成後（不是每一步；強制位移不算）。
    has_other: false
    budget_coefficient_permille: 300
    min_rarity: epic
  - id: every_n_hits
    name_zh: 每命中 n 次
    llm_hint: "持有者每累計命中指定次數就自動發動一次。"
    params:
      n: {llm_hint: "每幾次命中發動一次。", type: int, required: true, min: 2, max: 3}
    description_zh: 持有者累計命中第 n、2n、3n…次時（計數方式同「命中時」；n 由技能指定，2 或 3）。另一方為被命中的單位。
    has_other: true
    budget_by_n_permille: {2: 500, 3: 600}
    min_rarity: epic
  # --- Phase 3C-3a：協同管道 3「監聽自己的動作」（docs/design/06-技能.md 6.14.2）。係數為初值，未經模擬。
  # random_composer：3C-6b 起四個新時機都由組合器產生（on_cast_tag 抽一個元素標籤；on_status_applied、on_enter_surface 以一半機率指定狀態或表面）。
  - id: on_cast_tag
    name_zh: 施放帶標籤的技能後
    llm_hint: "持有者施放帶指定標籤的技能後自動發動。"
    params:
      tag: {llm_hint: "技能必須帶有的標籤。", type: tag, required: true}
    description_zh: 持有者施放一個帶 trigger.tag 標籤的技能（含修正規則加上的標籤；不含被動觸發與陷阱），在該技能結算之後。沒有另一方，效果作用在持有者。
    has_other: false
    budget_coefficient_permille: 350
    min_rarity: epic
  - id: on_status_applied
    name_zh: 施加狀態後
    llm_hint: "持有者成功對別人施加狀態後自動發動。"
    params:
      status: {llm_hint: "只在施加這個狀態時發動，不填則任何狀態都算。", type: status}
    description_zh: 持有者成功對其他單位施加狀態（抵抗成功、對自己施加都不算；刷新持續時間算）。trigger.status 省略時任何狀態都算。另一方為被施加的單位。
    has_other: true
    budget_coefficient_permille: 400
    min_rarity: epic
  - id: on_collision
    name_zh: 造成撞擊後
    llm_hint: "持有者造成撞擊後自動發動。"
    description_zh: 持有者造成的撞擊（被持有者推、拉、擊退的單位因障礙提前停下，或距離超過上限的撞擊）。另一方為被推的單位。
    has_other: true
    budget_coefficient_permille: 300
    min_rarity: epic
  # --- Phase 3C-3b：on_enter_surface（需要表面 creator，見 Tile.surface_creator）。
  - id: on_enter_surface
    name_zh: 敵人進入你的表面時
    llm_hint: "敵人踏進持有者造出的表面時自動發動。"
    params:
      surface: {llm_hint: "只在這種表面時發動，不填則任何表面都算。", type: surface}
    description_zh: 敵方單位步行或被強制位移（傳送不算）進入持有者造出的表面；回合開始站在上面、表面出現在腳下都不算。trigger.surface 省略時任何表面都算。另一方為進入的單位。
    has_other: true
    budget_coefficient_permille: 350
    min_rarity: epic
  # --- Phase 3-33f2：召喚物倒下時（只給裝備詞條用；效果是以倒下的召喚物為中心的爆炸或治療）。
  - id: on_summon_downed
    name_zh: 召喚物倒下時
    llm_hint: "持有者的召喚物被打倒時自動發動。"
    description_zh: 持有者的召喚物被打倒（時效到期、被獻祭、召喚者倒下而消失都不算）。另一方為倒下的召喚物；效果以牠倒下的位置為中心結算。目前只有裝備詞條使用，被動技能與隨機組合器不使用。
    has_other: true
    budget_coefficient_permille: 300
    min_rarity: epic
    random_composer: false
  # --- TF-1（#159 伴生，06 6.34.5）：戰鬥開始時。只給轉型「伴生」用，隨機組合器不使用（係數為初值，未經模擬）。
  - id: on_battle_start
    name_zh: 戰鬥開始時
    llm_hint: "戰鬥開始時自動發動一次。"
    description_zh: 戰鬥開始、先攻順序排好之後，第一位行動之前（每場一次）。沒有另一方，效果作用在持有者。
    has_other: false
    budget_coefficient_permille: 200   # 每場只有一次（回合開始時是每回合，500）
    min_rarity: epic
    random_composer: false
  # --- SK-3（#166，06 6.38 第 10 點）：你造的關鍵字被利用時（雙向協同）。給被動與裝備詞條用。
  # SK-3b（玩法交接 4.1.30）：「利用」有四種——你施加的狀態被消耗（consume_status，例：引爆你的燃燒）、
  # 你造的表面被元素觸發互動表（例：雷電打在你造的水上導電、火碰到你的油）、條件型（別人或自己的效果因為目標身上有你造的
  # 狀態、站在你造的表面上而成立，而且真的生效；trpg.engine.skills.exploits）、你刻的符文被讀取或引爆。層數不算。誰利用都算。
  # 任何單位的每回合最多 1 次（被動與詞條同一套）；照觸發深度上限。係數為初值，未經模擬。
  # random_composer 仍是 false（一般抽選不抽，既有種子不變）；組合器只以獨立串流 composer.exploit 產生（skill_composer.yaml）。
  - id: on_keyword_exploited
    name_zh: 你造的關鍵字被利用時
    llm_hint: "持有者造的狀態、表面或符文被任何人利用（消耗、元素互動、效果因它成立、符文被讀取或引爆）時發動，每回合一次。"
    params:
      status: {llm_hint: "只在這個狀態被利用時發動；和表面擇一，都不填則任何狀態或表面都算。", type: status}
      surface: {llm_hint: "只在這種表面被利用時發動；和狀態擇一，都不填則任何狀態或表面都算。", type: surface}
    description_zh: 持有者施加的狀態被消耗（例：燃燒被引爆）、持有者造出的表面被元素觸發互動（例：水被雷電導電、油被點燃）、某個效果因為目標身上有持有者造的狀態或站在持有者造的表面上而成立並且生效（條件型），或持有者刻的符文被讀取（條件成立並生效）或引爆；層數不算；誰利用都算，含自己。trigger.status／surface 擇一縮小範圍（符文兩者都不符），都省略時任何一種都算。沒有另一方，效果作用在持有者。任何單位的每回合最多 1 次（SK-3b）。
    has_other: false
    budget_coefficient_permille: 300
    min_rarity: epic
    random_composer: false
    max_per_round: 1   # 每回合最多 1 次（6.38 第 10 點；HC-7 b 從 TriggerSpec 的檢查搬來）
  # --- AP-2（#168，05 5.2「會給 AP 的內容」）：這回合用完所有 AP 時。給被動與裝備詞條用。係數為初值，未經模擬（工坊可調）。
  # random_composer: false（一般抽選不抽，既有種子不變）；組合器只以獨立串流產生（AP-2 第 4 項）。
  - id: on_ap_spent_all
    name_zh: 這回合用完所有 AP 時
    llm_hint: "持有者自己的回合裡，一個動作把 AP 用到 0 時發動，每回合一次。"
    description_zh: 持有者自己的回合裡，一個動作（技能、普攻、跑步、互動等）結算完後 AP 剛好用光（動作前還有 AP）時觸發；結束回合不算。每回合最多 1 次。沒有另一方，效果作用在持有者。
    has_other: false
    budget_coefficient_permille: 400
    min_rarity: epic
    random_composer: false
    max_per_round: 1   # 每回合最多 1 次（AP-2；HC-7 b 從 TriggerSpec 的檢查搬來）
  # --- E4（#175，08 8.29 E4 第 1、2 點）：你讓別人位移時。給被動與裝備詞條用。係數為保守的初值，未經模擬（工坊可調）。
  # random_composer: false（一般抽選不抽，既有種子不變）。
  - id: on_displace
    name_zh: 你讓別人位移時
    llm_hint: "持有者推、拉、擊退、傳送別人或和別人互換位置，讓對方實際移動至少 1 格時發動。"
    description_zh: 持有者推、拉、命中後擊退、傳送別人、和別人互換位置（含讓另外兩人互換），被位移的單位實際移動了至少 1 格時觸發；隊友也算，自己位移自己不算。一次位移只觸發 1 次（不是每格 1 次）；移動 0 格（第一格就被擋住）只算「造成撞擊後」，被推之後在冰上滑行不另外算。另一方為被位移的單位。
    has_other: true
    budget_coefficient_permille: 250
    min_rarity: epic
    random_composer: false
