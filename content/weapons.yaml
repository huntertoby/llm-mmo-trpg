    flat: 0
    attack_bonus: 0
    scaling_attr: int
    element: ice
    crit_range: 20
    two_handed: true
  # --- Phase 3-24a1：武器擴充第一批（數值為初值，未經模擬）---
  - id: axe
    name_zh: 斧
    weapon_class: melee
    range: 1
    dice: 1d8
    flat: 0
    attack_bonus: 0
    scaling_attr: str
    element: physical
