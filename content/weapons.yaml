# 武器表。
# 欄位：id、name_zh、weapon_class（melee 近戰／ranged 遠程／focus 法器，技能的 weapon_req 對照用）、
#       range（射程，曼哈頓距離；1 為近戰）、dice（傷害骰 NdM）、flat（固定傷害）、
#       attack_bonus（攻擊值加值）、scaling_attr（縮放屬性：str/dex/con/int/wis/wil）、
#       element（元素）、crit_range（暴擊最低自然骰值，20 表示只有自然 20）、two_handed（雙手）。
# summon_only（Phase 3-33e1）：true ＝ 召喚物專用的武器，不列入開局可選的武器。
# 武器小特性（Phase 3-24a1；全部是下列選填參數，引擎只讀參數、不寫死數值）：
#       secondary_scaling_attr（第二縮放屬性）與 attr_mode（Phase 3H-1，08 8.11 雙屬性取法：
#         同類（都是物理或都是心智）max 取較高者；一物理一心智 mean 取平均，要兩個都點；3I-1 依 #46，schema 檢查）、
#       armor_break {defense_permille: -100, rounds: 1}（破甲：普攻命中後目標防禦 ‰ 變化與回合數）、
#       knockback（震退：普攻命中後沿攻擊方向推幾格，沿用推擊與撞擊）、
#       reach（觸及：藉機攻擊範圍，不可超過 range）、
#       blessing {flat, dice}（祝禱：普攻命中時最近的隊友回復量）、
#       summon_dice_bonus（統御：自己的召喚物普攻多幾顆傷害骰）、
#       lob（拋射：視線可越過幾層高的障礙）、
#       counter（Phase 3I-1 反擊：相鄰敵人的近戰攻擊命中你時，以內建反應 counter_attack 回擊一次；佔本輪反應、不花 AP 與耐力）、
#       reap {hp_permille, damage_permille}（3I-1 收割：目標當下 HP ≤ 最大 HP 的 hp_permille‰ 時，普攻與武器技傷害 +damage_permille‰）、
#       entangle {move_penalty}（3I-1 纏繞：普攻命中後施加 entangled，目標下回合移動 −move_penalty；不疊加、不擲抵抗）、
#       paired（3I-4 成對武器：算一件、占雙手；two_handed 仍為 false）、strikes（3I-4 普攻連打幾下，預設 1）。
# look（Phase 3E-2e）：預設外觀 {kind, material, element?, form?}，紙娃娃主手與武器小圖示用；沒寫的武器前端依 weapon_class 退回。
#       kind／form／material 是 equipment/appearance.yaml 的造型；雙手與否看 two_handed。
# 遠程武器小特性（Phase 3-24a2；同樣只是參數）：
#       pierce_line（穿透一直線：命中後最多再擊中幾名後方敵人）、ignore_height（不受高度影響）、
#       magazine／reload_ap（彈匣容量與裝填 AP；0 ＝ 不用裝填；有彈匣即直射，不可有 lob）、
#       gunshot（槍聲：開火解除自己的隱蔽）、steady {hit, crit_range}（站定：本回合未移動時加成）、
#       ignore_cover（無視半掩護）、armor_pierce_permille（穿透目標防禦的 ‰）、
#       range_mod [{min_distance, max_distance, hit, damage_permille}]（依攻擊距離的命中與傷害修正）。
weapons:
  - id: one_handed_sword
    name_zh: 單手劍
    look: {kind: sword, material: steel}
    weapon_class: melee
    range: 1
    dice: 1d8
    flat: 0
    attack_bonus: 0
    scaling_attr: str
    element: physical
    crit_range: 20
    two_handed: false
  - id: greatsword
    name_zh: 雙手劍
    look: {kind: greatsword, material: steel}
    weapon_class: melee
    range: 1
    dice: 2d6
