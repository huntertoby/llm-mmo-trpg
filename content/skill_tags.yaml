# 技能標籤的中文名（Phase 3-41a，說明整修清單 3.1～3.4、3.2、5.7）。
#
# 技能的 tags（content/skills/*.yaml）是自由字串，被修正規則（applies_to.skill_tags）、條件
# （cast_tag_this_turn）、觸發（on_cast_tag）、超載層數（stacks.yaml overload.tag）與刻印（inscribe 的
# tag 符文）引用。玩家看到的文字一律用這裡的中文名，查不到時說明文字用「特定標籤」帶過，不顯示英文。
#
# 欄位：
#   name_zh  顯示名稱（例：「帶「治療」標籤的技能」）
#   rune_zh  刻印符文的單字（選填；inscribe 用標籤刻符文時顯示為「<單字>紋」，例：獵紋）
#
# 測試（tests/narrative/test_card_text_scan.py）檢查 content/skills/ 用到的每個標籤都在這裡。
