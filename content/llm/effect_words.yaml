# 敘事一致性詞表（Phase 4-L11 初稿，交玩法 PM 定稿）。
# LLM 寫的名稱、概念、施放敘事、閃現 note_zh 提到 words 裡的詞時，技能效果裡必須有 matches 的其中一項
# （狀態 statuses、元素 elements、表面 surfaces、原語 primitives、召喚物 units；任一符合即可），
# 找不到就回報錯誤碼重試。ignore：含這些詞的片段不算（例如「怒火」不算提到火）。
# 閃現變化加上的效果（變化後有、變化前沒有的狀態／元素／表面／原語／召喚物）若出現在某組的 matches，
# 名稱、概念或施放敘事要提到那些組的其中一個詞（note_zh 有填時也要提到）。
# 詞選得保守：單字只留不常被比喻用的（火、冰、雷、毒…），「風」「土」「石」「浪」這類常當形容的字只收複合詞。
groups:
  # ---- 控制 ----
  - id: slow
    words: [遲緩, 減速, 緩速, 拖慢]
    matches: {statuses: [slow, frozen]}
  - id: root
    words: [定身, 禁錮, 束縛, 纏縛, 纏繞]
    matches: {statuses: [root, entangled, frozen], primitives: [cleanse]}
  - id: stun
    words: [暈眩, 昏迷, 震暈, 擊暈]
    matches: {statuses: [stun]}
  - id: frozen
    words: [冰封, 凍結]
    matches: {statuses: [frozen], surfaces: [ice]}
  - id: prone
    words: [倒地, 撂倒, 絆倒, 摔倒, 掀翻]
    matches: {statuses: [prone], primitives: [knock_prone, topple, shockwave]}
  - id: push
    words: [擊退, 推開, 震退, 彈開, 轟開, 震開]
    matches: {primitives: [push, shockwave, push_aside]}
  - id: pull
    words: [拉近, 拽回, 勾回, 牽引, 拖回]
    matches: {primitives: [pull, swap, swap_any, teleport_target], units: [summon_pull_totem]}
  - id: blind
    words: [致盲, 目盲, 失明]
    matches: {statuses: [blinded]}
  - id: silence
    words: [噤聲, 禁言]
    matches: {statuses: [silenced]}
  - id: fear
    words: [恐懼, 驚懼, 畏懼]
    matches: {statuses: [feared]}
  - id: taunt
    words: [嘲諷, 挑釁]
    matches: {statuses: [taunted]}
  - id: bleed
    words: [流血, 出血]
    matches: {statuses: [bleed]}
  - id: stealth
    words: [隱蔽, 潛行, 隱身, 隱匿]
    matches: {statuses: [concealed], surfaces: [smoke, darkness], primitives: [shadowstep]}
  # ---- 元素 ----
  - id: fire
    words: [火, 焰, 炎, 燃, 焚, 熾]
    ignore: [怒火, 開火, 火花, 火網, 魂火, 燃起, 燃燒一點, 火速, 電光石火]
    matches:
      elements: [fire]
      statuses: [burning, stance_flame, stance_blaze, infused_fire]
      surfaces: [fire, oil]
      primitives: [clear_surface, blow_surface]
      units: [summon_fire_spirit, summon_foxfire_decoy, summon_bomb_puppet, summon_elemental_spirit]
  - id: ice
    words: [冰, 霜, 凍, 寒氣, 嚴寒, 極寒]
    ignore: [冰冷]
    matches:
      elements: [ice]
      statuses: [frozen, stance_frost, stance_glacier]
      surfaces: [ice]
      units: [summon_ice_spirit, summon_elemental_spirit]
  - id: lightning
    words: [雷, 電, 閃電, 霹靂]
    ignore: [地雷, 悶雷, 閃電般, 電光石火]
    matches: {elements: [lightning], units: [summon_thunder_spirit, summon_elemental_spirit]}
  - id: poison
    words: [毒, 瘴]
    ignore: [毒辣, 惡毒]
    matches:
      elements: [poison]
      statuses: [poison]
      surfaces: [poison]
      primitives: [cleanse, clear_surface, blow_surface]
  - id: wind
    words: [狂風, 旋風, 疾風, 颶風, 暴風, 強風, 烈風, 勁風, 風刃, 風壓, 氣流]
    matches: {elements: [wind], primitives: [blow_surface]}
  - id: earth
    words: [大地, 岩, 地脈, 地裂, 裂地, 沙]
    ignore: [岩漿]
    matches:
      elements: [earth]
      statuses: [stoneskin]
      primitives: [raise_terrain, lower_terrain, create_obstacle, topple, hurl_object]
      units: [summon_earth_wall, summon_golem]
  - id: holy
    words: [神聖, 聖光, 聖, 光明]
    matches: {elements: [holy], surfaces: [holy], statuses: [infused_holy]}
  - id: shadow
    words: [暗影, 陰影, 幽影, 黑暗, 闇]
    matches:
      elements: [shadow]
      surfaces: [darkness, smoke]
      statuses: [concealed, blinded]
      primitives: [shadowstep, clear_surface]
      units: [summon_shade, summon_afterimage]
  - id: water
    words: [水, 濕, 潮水, 潮濕]
    ignore: [行雲流水]
    matches:
      surfaces: [water]
      primitives: [clear_surface, blow_surface]
      units: [summon_water_sprite]
  # ---- 召喚 ----
  - id: summon
    words: [召喚, 喚出, 召來]
    matches: {primitives: [summon, sacrifice_summon]}
  - id: vine
    words: [藤蔓, 藤, 荊棘, 根鬚]
    matches: {units: [summon_vine], primitives: [create_obstacle], statuses: [entangled, root]}
  - id: totem
    words: [圖騰]
    matches:
      units: [summon_plateau_totem, summon_pull_totem, summon_war_totem]
      primitives: [zone]
  # ---- 其他 ----
  - id: teleport
    words: [瞬移, 傳送]
    matches: {primitives: [teleport, shadowstep, swap, swap_any, teleport_target, leap, dash]}
  - id: heal
    words: [治療, 治癒, 癒合]
    matches: {primitives: [heal, revive], statuses: [regenerating]}
  - id: shield
    words: [護盾, 屏障, 護罩]
    matches:
      primitives: [shield, intercept, create_obstacle, raise_terrain]
      statuses: [shielded, guarded, stoneskin]
      units: [summon_guardian_spirit]
