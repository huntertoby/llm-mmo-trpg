# 技能預算的規則數值（docs/phases/Phase2B計畫.md 4.2–4.3、4.6）。‰＝千分比（1000 = ×1）。
# 階級預算 tier_budget 與武器基準傷害 budget_reference_weapon_damage 在 rules/core.yaml；
# 基礎點數在 skill_primitives.yaml、狀態與表面的 budget_points 在 statuses.yaml／surfaces.yaml、
# 形狀倍率在 skill_shapes.yaml、協同係數在 skill_synergies.yaml。
#
#   可用預算 ＝ tier_budget[階級] × AP 係數 × (1000 ＋ 代價折抵) ÷ 1000
#   合格     ＝ min_ratio ≤ total ÷ 可用預算 ≤ max_ratio
min_ratio_permille: 700      # 過弱下限（0.7）
max_ratio_permille: 1000     # 超預算上限（1.0）

# 射程係數（Phase 3-49，玩法決定 #53）：固定射程 N（整數 ≥ 1）的技能，形狀倍率再乘
# (1000 ＋ (N − range_baseline) × range_step_permille) ÷ 1000（射程 1＝0.85、4＝1.00、10＝1.30）。
# 射程寫「武器射程」的武器技、射程 0（以施放者／落點為中心）與沒有射程的形狀（自身、光環等）為 ×1.0。
range_baseline: 4
# 已知超出預算範圍（70～100%）的內建技能（Phase 3-49 射程係數上線後；不改技能數值，交玩法 PM 決定怎麼調，
# 調整後從這裡移除）。trpg content check 不把它們的 budget.over／budget.weak 算成錯誤。
# 重算報表：uv run python scripts/range_budget_report.py。
known_budget_exceptions: []  # 2026-10-24 玩法 PM 調完 5 招（射程／骰子），清單清空
range_step_permille: 50

ap_coefficient_permille: {1: 500, 2: 1000, 3: 1600}   # 主動技能依 ap_cost
reaction_coefficient_permille: 600                     # 反應技（2E-2 起可生成；初值，未經模擬）
# 姿態技能（Phase 2E-2）：可用預算 ＝ tier_budget × 這個係數 × (1000 ＋ 代價折抵) ÷ 1000。
# 姿態狀態的點數在 statuses.yaml 的 budget_points（持續到取消，不乘持續比例）。初值，未經模擬。
stance_coefficient_permille: 1000
# 被動技能（Phase 2E-1）：可用預算 ＝ tier_budget × 觸發時機的係數（skill_triggers.yaml）× (1000 ＋ 代價折抵) ÷ 1000；
# trigger.max_per_round 每多 1 次，可用預算再 × 這個值（次數越多，每次能分到的預算越少）。初值，未經模擬。
passive_extra_trigger_permille: 800
# 陷阱技能（Phase 2E-3）：觸發不確定，可用預算 ＝ tier_budget × AP 係數 × 這個值 × (1000 ＋ 代價折抵) ÷ 1000。
# 陷阱的影響範圍倍率取 trap.shape（single／cross／square3）對應的形狀倍率。初值，未經模擬。
trap_coefficient_permille: 800
# consume_stack 的加成點數 ＝ 同技能傷害點數 × 期望消耗層數 × per_stack_permille ÷ 1000；
# 期望消耗層數 ＝ 該層數上限 × 這個值 ÷ 1000（500＝上限的一半；玩家不一定每次都累積滿）。初值，未經模擬。
consume_stack_expected_permille: 500

# consume_status（Phase 3C-3b；初值，未經模擬）：點數 ＝ then 各效果點數合計 × 期望倍率（scale 時）
# × (1000 ＋ splash 加成) ÷ 1000 × 「需要先有狀態」折扣；形狀與對象倍率照一般效果計算。
consume_status_scale_expected: 2
consume_status_splash_permille: 500
consume_status_discount_permille: 700

# 條件倍率：none 無條件、common／harsh 依 skill_conditions.yaml 的 harshness。
# 技能層級的條件乘在 total，效果層級的條件只乘該效果。
# 撞擊強化（Phase 3C-3a）：push／pull 填了 collision_dice 時，每顆骰加這麼多點（初值，未經模擬）。
collision_die_points: 1
# 投擲物件（Phase 3C-5a）：點數 ＝ 骰子平均 × 這個折扣（需要附近有可投擲的物件）÷ 1000；knock_prone: true 另加
# knock_prone 原語的 base_points。形狀倍率照一般效果（object_then_tile 為 1.0）。初值，未經模擬。
hurl_object_discount_permille: 800
# 直線衝撞（Phase 3D-2c）：點數 ＝（dice 平均 ＋ on_hit 的點數：knock_prone 為該原語的 base_points、
# push_aside 為 push 的 base_points）× 預期被撞到的敵人數（‰）÷ 1000。初值，未經模擬。
charge_through_expected_targets_permille: 1500
# 召喚（Phase 3D-4a）：點數 ＝ 召喚物每輪預估傷害（武器骰平均 ＋ 固定傷害）× duration × 這個值 ÷ 1000
# （命中率與吸引火力的折合）。初值，未經模擬。
summon_round_value_permille: 800
# 3D-4b 圖騰：點數 ＝ 光環狀態的 budget_points × 預期受惠的友方數 × duration × summon_round_value_permille ÷ 1000²。初值，未經模擬。
totem_expected_allies_permille: 1000
# 3-33e2a 召喚物特性計入預算（初值，未經模擬）：特性價值 ＝ 各項（見 skill_rules.py 的 summon_trait_*）加總，
# 與武器骰平均相加後乘持續輪數與 summon_round_value_permille；自爆與被推倒壓人是一次性（不乘持續輪數）。
summon_trait_extra_damage_permille: 800    # 額外傷害（雷靈的雷電 1d4）：骰子平均 × 80%
summon_trait_status_permille: 200          # 命中附帶狀態：狀態點數 × 20%（點燃 3 → 0.6）
summon_trait_conditional_permille: 400     # 有條件才生效的命中特性（冰靈打水中的目標才冰凍）：再 × 40%
summon_trait_surface_permille: 100         # 造表面：表面點數 × 10%
summon_trait_chain_permille: 300           # 水面連鎖：連鎖傷害 × 30%（要站在水裡）
summon_trait_heal_permille: 600            # 脈動治療：治療骰平均 × 60%
summon_trait_backstab_permille: 250        # 背刺多的骰：骰子平均 × 25%（要繞背）
summon_trait_trip_permille: 200            # 絆倒：擊倒點數 × 20%（對抗判定、每輪 1 次）
summon_trait_knockback_permille: 250       # 震退：推擊點數 × 格數 × 25%
summon_trait_immovable_permille: 500       # 不會被推動（石像）：每輪 0.5 點（擋路的價值）
summon_trait_height_permille: 300          # 高處加傷：每輪傷害 × 加傷比例 × 30%（要站得比目標高）
summon_trait_conceal_points: 1             # 召喚時隱蔽（一次性）
summon_detonate_targets_permille: 800      # 自爆：傷害骰平均 × 0.8 個敵人（一次性；爆裂傀儡要先走到敵人旁）
summon_detonate_rounds: 1                  # 會自爆的召喚物：一般攻擊與特性只算 1 輪（自爆後就消失了）
summon_trait_pull_permille: 1000           # 拉扯（吸引圖騰，3-33e2b 合併補上；初值，未經模擬）：拉扯點數 × 100%，每輪
summon_trait_platform_permille: 1000       # 高台（高台圖騰，3-33e2b 合併補上；初值，未經模擬）：升起地形點數 × 高度 × 100%，每輪
summon_topple_targets_permille: 900        # 被推倒壓人：（傷害骰平均 ＋ 擊倒點數）× 0.9 個敵人（一次性；土牆不攻擊，價值全在這裡）
summon_hp_weight_permille: 300                # 3-33f2 加深進化：召喚物最大 HP +N% 的價值 ＝ 每輪價值 × N% × 30%（初值，未經模擬）

# 3D-5 持續區域：點數 ＝ effects 的基礎點數合計 × 預估觸發次數（形狀格數 × duration × zone_cell_round_permille ÷ 1000）
#   × zone_both_permille（when: both 時）× zone_moving_permille（anchor: moving 時）
#   ＋ 表面（surface）的點數 × 形狀格數 ×（moving 時 1 ＋ duration × speed 次新覆蓋，否則 1）× zone_surface_permille。
# 形狀倍率不另外套用（格數已算進觸發次數）。初值，未經模擬。
zone_cell_round_permille: 120
zone_both_permille: 1500
zone_moving_permille: 1500
zone_surface_permille: 300
# 3D-1：restore_resource 的點數（初值，未經模擬）：法力每點 700‰ 點、冷卻每回合 3 點
restore_mana_point_permille: 700
restore_cooldown_points: 3
# 3D-8a：驅散與揭露的點數（初值，未經模擬）：驅散 1 個增益 3 點、全部 6 點；揭露 ＝ 2 ＋ 1 × duration 點。
dispel_one_points: 3
dispel_all_points: 6
# 3-11 暫時障礙：create_obstacle 持續 n 回合（1–10）的點數 ＝ 基礎 3 × 第 n 項（‰）；永久 ＝ 1000‰（現狀）。
obstacle_duration_permille: [400, 500, 600, 700, 750, 800, 850, 900, 950, 1000]
# 3-23 刻印（初值，未經模擬）：inscribe 的點數 ＝ 基礎 5 × 第 n 項（‰，n ＝ duration 1–5，省略取預設 3 輪）；
# detonate_runes 的點數 ＝ 骰子平均 × detonate_runes_permille ÷ 1000（需要先刻印的折扣），形狀倍率照一般效果。
inscribe_duration_permille: [600, 800, 1000, 1200, 1400]
# 3-50b 護盾持續時間：shield 的點數 ＝ 骰子平均 × 第 n 項（‰；n ＝ duration 2、3 回合，省略 ＝ 2 回合 ＝ 1000‰）。初值，未經模擬。
shield_duration_permille: [1000, 1300]
detonate_runes_permille: 700
# 3-54b 大範圍越貴越稀有（06 6.33，#58）：升降地形（raise_terrain、lower_terrain）的影響格數（形狀 cell_count）≥ min_cells 時，
# 技能的稀有度至少要 rarity（依 min_cells 由小到大，取符合的最高一項）：4～6 格最低稀有、7 格以上最低史詩。
terrain_area_rarity:
  - {min_cells: 4, rarity: rare}
  - {min_cells: 7, rarity: epic}
# 3-54b 風元素傷害的元素擴散格數（spread）：擴散 n 格時（n ＝ 1、2；省略 ＝ 1），傷害效果的點數 × 第 n 項（‰）。初值，未經模擬。
wind_spread_permille: [1000, 1150]
# 3-24c 獻祭召喚物（初值，未經模擬）：點數 ＝ 骰子平均 × sacrifice_summon_permille ÷ 1000（需要先有召喚物、且召喚物會消失的折扣）。
sacrifice_summon_permille: 800
reveal_base_points: 2
reveal_round_points: 1
# 3D-8b 復活與定時炸彈（初值，未經模擬）：復活 ＝ revive_base_points ＋ hp_permille × revive_hp_point_permille ÷ 1000；
# 定時炸彈 ＝ 骰子平均 ×（base ＋ 半徑 × radius）÷ 1000（預期波及的人數）；
# 擊殺時效果（on_kill）＝ 各效果點數 × 預估擊殺率（refund_ap 每點 AP 折合 refund_ap_points 點；
# refund_cooldown ＝ 技能冷卻回合 × restore_cooldown_points）。
revive_base_points: 6
revive_hp_point_permille: 10
delayed_damage_base_targets_permille: 1000
delayed_damage_radius_targets_permille: 400
on_kill_expected_permille: 300
refund_ap_points: 6
# 3D-8c 暫時獲得技能（初值，未經模擬）：grant_skill 的點數 ＝ 被給技能的總點數 × 預期使用次數
# （grant_skill_expected_uses_per_round_permille ÷ 1000 × 持續輪數）。
grant_skill_expected_uses_per_round_permille: 800
# 3D-8a 吸血：回復的 HP 折合傷害點數的比例（‰）：傷害效果點數 × (1 ＋ lifesteal_permille × 此值 ÷ 10⁶)。聖光雙效
# （split_heal）的點數 ＝ 傷害點數 ＋ 治療點數（骰子平均），再乘形狀與 affects: all 的對象係數。初值，未經模擬。
lifesteal_value_permille: 800
# 穿透（Phase 3C-5b）：技能有 pierce: true 時，總點數 ×（1000 ＋ 這個值）÷ 1000（無視半掩護、穿過木製物件；
# 後方目標只受 core.yaml 的 pierce_behind_permille 傷害，所以只加一點）。初值，未經模擬。
pierce_bonus_permille: 150
# 戰場變奏（Phase 3-25a，docs/design/06-技能.md 6.24）：基礎型態的總點數 ×（1000 ＋ 這個值 × 變奏數）÷ 1000；
# 每個變奏型態另外照一般技能計算，各自落在預算窗內。初值 10%，之後以模擬調整。
variant_surcharge_permille: 100
# 變奏的射程 ±：Phase 3-49 起由射程係數（range_step_permille）直接算在型態本身的形狀上，不再另外加價。
# 複合技能（Phase 3F-3a，docs/design/06-技能.md 6.23「位移 → 動作」）：總點數 ＝（位移段點數 ＋ 動作段點數）
# ×（1000 ＋ 這個值）÷ 1000；兩段各自依自己的骨架與形狀計算。省下一次行動的代價；初值，之後以模擬調整。
composite_tax_permille: 150
# 3F-4a：擊殺 → 接下一段（on_kill）與命中 → 加碼段（on_hit）的第二段點數再 × 觸發機率（on_kill_expected_permille、
# modifier.hit_rate_permille）。兩段之間形成元素／表面連鎖（第一段造表面或施加狀態、第二段的元素引爆或與之互動，依
# interactions.yaml 與狀態的 removed_by_element；第二段消耗第一段的狀態也算）時，總點數再 ×（1000 ＋ 這個值）÷ 1000。
# 初值 1000（點數翻倍），未經模擬。
composite_self_combo_permille: 1000
# 3F-4b：延遲段（when: delayed）的第二段點數 × 這個折扣（敵人看得到、能反應；被攻擊才釋放的也用同一個值），
# 再乘複合加成。初值，未經模擬。
composite_delayed_discount_permille: 800

condition_permille: {none: 1000, common: 850, harsh: 600}
all_target_permille: 800    # affects: all（敵我不分）的對象係數

# 代價折抵（‰，各項加總、以 total_cap 截斷後乘上去）
allowance:
  cooldown_per_turn: 50     # 冷卻每回合
  cooldown_cap: 300
  uses_per_battle: {1: 400, 2: 250}
  uses_default: 100         # 每場 3 次以上
  mana_per_point: 5         # 法力每點
  mana_cap: 150
  # 耐力（Phase 3H-2，06 6.10：武器技花耐力；初值）：耐力 2 點 ＝ 法力 1 點，預算點數等價——
  # 折抵 ＝ 耐力 × mana_per_point ÷ stamina_per_mana（向下取整），上限同 mana_cap。內建武器技一律「耐力 ＝ 原法力 × 2」，強度不變。
  stamina_per_mana: 2
  hp_per_permille: 1        # hp_percent 每 1‰
  hp_cap: 200
  # 自身狀態代價（Phase 2H-1，初值，未經模擬）：折抵 ＝ 狀態 budget_points × 有效回合 × per_point_permille，
  # 有效回合 ＝ duration − 1（狀態在施放當回合結束就 −1，所以 duration 限制為 2–3）；先套用 cap，再和其他折抵一起截斷在 total_cap。
  # 狀態只能是 allowed 之內的自身負面狀態；只有主動技能可以使用。
  #
  # Phase 3-50（06 6.5 代價換強度第一批，玩法決定 #54）：允許清單加入 stun（暈眩）、silenced（沉默）、bleed（流血）。
  # - status_caps：個別狀態的專屬上限（暈眩 400，其他用 cap 250）；
  # - fixed_duration：持續時間固定（暈眩 2＝跳過自己下一個回合；其餘 2–3）；
  # - spell_only：只能放在法術技（沉默；驗證器檢查）。
  # 暈眩 8 點 ×（2−1）× 40 ＝ 320‰；沉默 5 點 ×（2−1）× 40 ＝ 200‰；流血 3 點 × 1 × 40 ＝ 120‰。
  self_status:
    allowed: [vulnerable, weaken, slow, root, stun, silenced, bleed]
    per_point_permille: 40
    cap: 250
    status_caps: {stun: 400}
    fixed_duration: {stun: 2}
    spell_only: [silenced]
  # 透支（cost.overdraft，Phase 3-50）：施放後自己下一個回合少 1 AP，固定折抵（一招最多 1 AP；與 self_status 擇一）。
  overdraft_permille: 200
  # 源力代價（cost.source，傳說技能，Phase 3C-4a；初值，未經模擬）：每點折抵 source_per_point，上限 source_cap
  source_per_point: 250
  source_cap: 500
  total_cap: 500            # 各項先套用自己的上限，加總後再截斷在這個值（Phase 2C-1）

# 雙屬性縮放（secondary_scaling_attr，Phase 2H-2）與專精加成（mastery）都不計預算：
# - 雙屬性：兩屬性各 50%（取平均），只是改變「靠哪些屬性變強」，預算不變（6.12：稀有度不增加強度）。
#   最低稀有度在 rules/core.yaml 的 dual_scaling_min_rarity。
# - 專精：縮放屬性的基礎屬性是自己所有屬性中最高（含並列）時，range 施放距離 +1 或 duration 狀態持續 +1。
#   屬於 build 條件的小加成，預算以沒有加成的版本計算；雙屬性技能不可設定專精。

# 稀有度的結構上限（其餘限制由各資料檔的 min_rarity 決定）
rarity:
  common: {max_effects: 2}
  rare: {max_effects: 4}
  epic: {max_effects: 4}
  legendary: {max_effects: 4}

# 技能的費用花哪種資源（Phase 3H-2，docs/design/06-技能.md 6.10）：武器技花耐力、法術技花法力。
# 隨機組合器與 LLM 提議的數值以法力計，最後依類別換成等價的耐力（allowance.stamina_per_mana）。
cost_resource: {weapon: stamina, spell: mana}

# 修正技能（kind: modifier，Phase 3C-2；docs/design/06-技能.md 6.14.1）。全部為初值，未經模擬（3C-5 的 sim matrix 再看）。
#   規則點數 ＝ 每場預估使用次數 ×（命中後才生效的再 × hit_rate）× 每次的價值 × 條件倍率（condition_permille）
#   total    ＝ Σ 規則點數 × 協同係數（修正技能沒有效果，機制標籤通常為空）
#   可用預算 ＝ tier_budget × coefficient_permille ÷ 1000（修正技能沒有代價，不折抵）
# 使用次數：applies_to 各項加總，all_attacks 涵蓋 attack、all_skills 涵蓋 skill_tags；skill_tag 為「每個標籤」，上限 uses_cap。
# 命中後才生效：damage_permille、cooldown_delta、push_distance_delta、add_element、on_hit_effects（命中前就生效：hit_bonus、ap_delta、range_delta、add_tags）。
# 每次的價值：damage_permille ＝ budget_reference_weapon_damage × ‰；push_distance_delta ＝ push 原語 base_points × 格數；
#   on_hit_effects ＝ 效果本身的點數（同一般技能的效果點數，形狀倍率以 self 計）；其他見 points_milli（千分之一點）。
modifier:
  coefficient_permille: 300
  hit_rate_permille: 600
  shape_benefit_permille: 400   # 技能變形（3D-3）：站位剛好受益的比例（初值）
  uses: {attack: 6, shove: 2, trip: 2, interact: 1, all_attacks: 10, all_skills: 6, skill_tag: 3}
  uses_cap: 12
  per_turn_limit_uses: 8        # 3-31：帶 per_turn_limit 的規則，每場預估使用次數（每個自己的回合最多 1 次；初值，未經模擬）
  empty_slots_permille: 800     # 3-32a：依空欄位數加傷的規則（普攻精通）以滿格估算再 × 此值（技能欄空著本身就是代價；初值，未經模擬；3-32c 精通 80‰→60‰ 後由 500 調到 700；3-32d 精通 60‰→50‰ 再調到 800，維持預算 ≥ 70%）
  on_hit_rune_permille: 270     # 3-31：命中後的 inscribe／detonate_runes 點數 × 此值（符文單獨沒效果、要搭配讀取者；初值，未經模擬）
  points_milli:
    hit_bonus: 350        # 命中 +1 ≈ 命中率 +5% × 基準傷害 7
    cooldown_delta: 1200  # 冷卻 −1
    ap_decrease: 3000     # AP −1（省下的 AP 約等於半次普攻以上）
    ap_increase: -500     # AP +1 是代價（負值）
    range_delta: 500      # 射程 ±1
    add_element: 1000     # 獲得元素（導電、點燃、與表面互動）
    add_tag: 200          # 每個標籤（讓其他修正與 3C-3 的 on_cast_tag 接上）
    grant_pierce: 1200    # 技能獲得穿透（3C-5b；命中前就生效；每次使用的價值，3 次 ≈ 3.6 點）
    area_delta: 1400      # 範圍 +1（3D-3）：基準傷害 7 × 直線每格的形狀倍率加成 200‰
    allow_self_target: 2800   # 治療、護盾、增益類技能也包含自己（3D-3；約半個小治療）
    summon_hp_per_100: 500    # 召喚物最大 HP 每 +10%（3-24b1；召喚物約 14 HP，每 +10% ≈ 1.4 HP；初值，未經模擬）
    summon_attack_die: 1200   # 召喚物攻擊每多 1 顆傷害骰（3-24b1；初值，未經模擬）
    summon_limit: 3500        # 召喚物同時上限 ±1（3-33f1 召喚專精；與下兩項一起反推：群召與精英召喚都落在預算 70～100%；初值，未經模擬）
    summon_duration: 400      # 召喚物持續 +1 輪（3-33f1；反推值，持續輪數本身多半受戰鬥長度限制，價值低）
    summon_damage_per_100: 300   # 召喚物傷害加成每 +10%（3-33f1；反推值）
    # heal_permille（3-24b1）不在這裡：基準武器傷害 × ‰（同 damage_permille，初值，未經模擬）
    # shape_to（3D-3）不在這裡：基準傷害 × 轉換前後的形狀倍率差（skill_shapes.yaml），單體→直線 ≈ 2.8、單體→連鎖 ≈ 1.75、直線→錐形 ≈ 1.4

# 改寫規則型原語（Phase 3C-4a 起：grant_ap、reset_cooldown、cheat_death）
max_rule_rewrite: 1           # 每個技能最多 1 個
rule_rewrite_min_cooldown: 4  # 必須 uses_per_battle: 1 或冷卻至少這麼多回合
rule_rewrite_min_cooldown_with_source: 2   # 花源力（傳說，cost.source）時改為冷卻至少 2 回合（初值）

# 常駐類傳說（Phase 3D-6，docs/design/06-技能.md 6.14.4）：修正型與規則改變型傳說要以 1 AP ＋ 源力啟動（activation）。
#   係數改用 ap_coefficient_permille 的「啟動 AP」那一欄（rules/core.yaml 的 legendary_activation_ap，目前 1 → 500‰），
#   不用修正係數：啟動是一次 1 AP 的動作。限時（timed，持續 legendary_timed_rounds 輪）為基準；
#   整場（battle）的可用預算再 × legendary_battle_budget_permille（使用者決定：整場的效果較弱）。
#   規則改變（rule_change 原語）每一類的點數在 rule_changes.yaml 的 kinds。初值，以模擬調整。
legendary_battle_budget_permille: 600

# 賭博型技能（Phase 3D-7a，docs/design/06-技能.md 6.17）：預算以期望值計——gamble 效果的點數 ＝ 成功率 × win ＋ 失敗率 × lose
#   （damage_multiplier ＝ 同技能傷害效果點數 ×（倍率 − 1）；self_damage_of_hit ＝ 同技能傷害點數 × n‰ 的自傷）。
#   對施放者自己的有害效果（自傷、反噬狀態）折合 gamble_self_harm_permille‰ 後從總點數扣除；
#   失手反噬（cost.on_miss）同樣折合，再 × gamble_on_miss_rate_permille‰（預估未命中的比例）。
#   可用預算再 × gamble_variance_bonus_permille‰（平均強度略高 10% 作為冒險補償）。全部為初值，未經模擬。
gamble_variance_bonus_permille: 1100
gamble_self_harm_permille: 500
gamble_on_miss_rate_permille: 300


# 高變異、超載、依情況縮放（Phase 3D-7b；初值，未經模擬；都屬於「期望值」算法）：
#   爆骰：每顆骰的平均 E_k ＝ (s+1)/2 ＋ E_(k−1)/s（k＝explode_max，s＝面數；武器技用 explode_weapon_sides），
#         傷害點數 × (1 ＋ (E_k ÷ E_0 − 1) × variance_dice_share_permille‰)；
#   暴擊範圍：額外暴擊率 ＝ (20 − crit_range) ÷ 20（以基礎暴擊 20 為準），傷害點數 × (1 ＋ 額外暴擊率 × variance_dice_share_permille‰)；
#   damage_permille：傷害點數 × ‰；scaling：傷害點數 × (1 ＋ min(cap, 預估步數 × per_step)‰)，預估步數見 scale_expected_steps_milli；
#   超載：帶標籤的傷害點數 × (1 ＋ 平均層數 × per_stack‰ × overload_expected_permille‰)。
variance_dice_share_permille: 700
explode_weapon_sides: 8
scale_expected_steps_milli:
  missing_hp_10pct: 2000
  distance: 3000
  enemies_adjacent_target: 1500
  enemies_adjacent_self: 1500
overload_expected_permille: 1000
