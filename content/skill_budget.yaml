# 技能預算的規則數值（docs/phases/Phase2B計畫.md 4.2–4.3、4.6）。‰＝千分比（1000 = ×1）。
# 階級預算 tier_budget 與武器基準傷害 budget_reference_weapon_damage 在 rules/core.yaml；
# 基礎點數在 skill_primitives.yaml、狀態與表面的 budget_points 在 statuses.yaml／surfaces.yaml、
# 形狀倍率在 skill_shapes.yaml、協同係數在 skill_synergies.yaml。
#
#   可用預算 ＝ tier_budget[階級] × AP 係數 × (1000 ＋ 代價折抵) ÷ 1000
#   合格     ＝ min_ratio ≤ total ÷ 可用預算 ≤ max_ratio
min_ratio_permille: 700      # 過弱下限（0.7）
max_ratio_permille: 1000     # 超預算上限（1.0）

ap_coefficient_permille: {1: 500, 2: 1000, 3: 1600}   # 主動技能依 ap_cost
reaction_coefficient_permille: 600                     # 反應技（2E-2 起可生成；初值，未經模擬）
# 姿態技能（Phase 2E-2）：可用預算 ＝ tier_budget × 這個係數 × (1000 ＋ 代價折抵) ÷ 1000。
# 姿態狀態的點數在 statuses.yaml 的 budget_points（持續到取消，不乘持續比例）。初值，未經模擬。
stance_coefficient_permille: 1000
# 被動技能（Phase 2E-1）：可用預算 ＝ tier_budget × 觸發時機的係數（skill_triggers.yaml）× (1000 ＋ 代價折抵) ÷ 1000；
# trigger.max_per_round 每多 1 次，可用預算再 × 這個值（次數越多，每次能分到的預算越少）。初值，未經模擬。
passive_extra_trigger_permille: 800
# 陷阱技能（Phase 2E-3）：觸發不確定，可用預算 ＝ tier_budget × AP 係數 × 這個值 × (1000 ＋ 代價折抵) ÷ 1000。
# 陷阱的影響範圍倍率取 trap.shape（single／cross／square3）對應的形狀倍率。初值，未經模擬。
trap_coefficient_permille: 800
# consume_stack 的加成點數 ＝ 同技能傷害點數 × 期望消耗層數 × per_stack_permille ÷ 1000；
# 期望消耗層數 ＝ 該層數上限 × 這個值 ÷ 1000（500＝上限的一半；玩家不一定每次都累積滿）。初值，未經模擬。
consume_stack_expected_permille: 500

# 條件倍率：none 無條件、common／harsh 依 skill_conditions.yaml 的 harshness。
# 技能層級的條件乘在 total，效果層級的條件只乘該效果。
condition_permille: {none: 1000, common: 850, harsh: 600}
all_target_permille: 800    # affects: all（敵我不分）的對象係數

# 代價折抵（‰，各項加總、以 total_cap 截斷後乘上去）
allowance:
  cooldown_per_turn: 50     # 冷卻每回合
  cooldown_cap: 300
  uses_per_battle: {1: 400, 2: 250}
  uses_default: 100         # 每場 3 次以上
  mana_per_point: 5         # 法力每點
  mana_cap: 150
  hp_per_permille: 1        # hp_percent 每 1‰
  hp_cap: 200
  # 自身狀態代價（Phase 2H-1，初值，未經模擬）：折抵 ＝ 狀態 budget_points × 有效回合 × per_point_permille，
  # 有效回合 ＝ duration − 1（狀態在施放當回合結束就 −1，所以 duration 限制為 2–3）；先套用 cap，再和其他折抵一起截斷在 total_cap。
  # 狀態只能是 allowed 之內的自身負面狀態；只有主動技能可以使用。
  self_status: {allowed: [vulnerable, weaken, slow, root], per_point_permille: 40, cap: 250}
  total_cap: 500            # 各項先套用自己的上限，加總後再截斷在這個值（Phase 2C-1）

# 雙屬性縮放（secondary_scaling_attr，Phase 2H-2）與專精加成（mastery）都不計預算：
# - 雙屬性：兩屬性各 50%（取平均），只是改變「靠哪些屬性變強」，預算不變（6.12：稀有度不增加強度）。
#   最低稀有度在 rules/core.yaml 的 dual_scaling_min_rarity。
# - 專精：縮放屬性的基礎屬性是自己所有屬性中最高（含並列）時，range 施放距離 +1 或 duration 狀態持續 +1。
#   屬於 build 條件的小加成，預算以沒有加成的版本計算；雙屬性技能不可設定專精。

# 稀有度的結構上限（其餘限制由各資料檔的 min_rarity 決定）
rarity:
  common: {max_effects: 2}
  rare: {max_effects: 4}
  epic: {max_effects: 4}
  legendary: {max_effects: 4}

# 修正技能（kind: modifier，Phase 3C-2；docs/design/06-技能.md 6.14.1）。全部為初值，未經模擬（3C-5 的 sim matrix 再看）。
#   規則點數 ＝ 每場預估使用次數 ×（命中後才生效的再 × hit_rate）× 每次的價值 × 條件倍率（condition_permille）
#   total    ＝ Σ 規則點數 × 協同係數（修正技能沒有效果，機制標籤通常為空）
#   可用預算 ＝ tier_budget × coefficient_permille ÷ 1000（修正技能沒有代價，不折抵）
# 使用次數：applies_to 各項加總，all_attacks 涵蓋 attack、all_skills 涵蓋 skill_tags；skill_tag 為「每個標籤」，上限 uses_cap。
# 命中後才生效：damage_permille、cooldown_delta、push_distance_delta、add_element、on_hit_effects（命中前就生效：hit_bonus、ap_delta、range_delta、add_tags）。
# 每次的價值：damage_permille ＝ budget_reference_weapon_damage × ‰；push_distance_delta ＝ push 原語 base_points × 格數；
#   on_hit_effects ＝ 效果本身的點數（同一般技能的效果點數，形狀倍率以 self 計）；其他見 points_milli（千分之一點）。
modifier:
  coefficient_permille: 300
  hit_rate_permille: 600
  uses: {attack: 6, shove: 2, trip: 2, interact: 1, all_attacks: 10, all_skills: 6, skill_tag: 3}
  uses_cap: 12
  points_milli:
    hit_bonus: 350        # 命中 +1 ≈ 命中率 +5% × 基準傷害 7
    cooldown_delta: 1200  # 冷卻 −1
    ap_decrease: 3000     # AP −1（省下的 AP 約等於半次普攻以上）
    ap_increase: -500     # AP +1 是代價（負值）
    range_delta: 500      # 射程 ±1
    add_element: 1000     # 獲得元素（導電、點燃、與表面互動）
    add_tag: 200          # 每個標籤（讓其他修正與 3C-3 的 on_cast_tag 接上）

# 改寫規則型原語（目前沒有此類原語）
max_rule_rewrite: 1           # 每個技能最多 1 個
rule_rewrite_min_cooldown: 4  # 必須 uses_per_battle: 1 或冷卻至少這麼多回合
