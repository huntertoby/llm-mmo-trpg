# 技能預算的規則數值（docs/phases/Phase2B計畫.md 4.2–4.3、4.6）。‰＝千分比（1000 = ×1）。
# 階級預算 tier_budget 與武器基準傷害 budget_reference_weapon_damage 在 rules/core.yaml；
# HC-B 起原語的基礎點數（primitive_points）、狀態與表面的點數（status_points、surface_points）、形狀倍率（shape_budget）
# 都在這個檔（開放數值工坊；HC-W2 起依參數值查表的形狀倍率 by_value 也在這裡）；協同係數在 skill_synergies.yaml。
#
#   可用預算 ＝ tier_budget[階級] × AP 係數 × (1000 ＋ 代價折抵) ÷ 1000
#   合格     ＝ min_ratio ≤ total ÷ 可用預算 ≤ max_ratio
min_ratio_permille: 700      # 過弱下限（0.7）
max_ratio_permille: 1000     # 超預算上限（1.0）

# 射程係數（Phase 3-49，玩法決定 #53）：固定射程 N（整數 ≥ 1）的技能，形狀倍率再乘
# (1000 ＋ (N − range_baseline) × range_step_permille) ÷ 1000（射程 1＝0.85、4＝1.00、10＝1.30）。
# 射程寫「武器射程」的武器技、射程 0（以施放者／落點為中心）與沒有射程的形狀（自身、光環等）為 ×1.0。
range_baseline: 4
# 已知超出預算範圍（70～100%）的內建技能（Phase 3-49 射程係數上線後；不改技能數值，交玩法 PM 決定怎麼調，
# 調整後從這裡移除）。trpg content check 不把它們的 budget.over／budget.weak 算成錯誤。
# 重算報表：uv run python scripts/range_budget_report.py。
known_budget_exceptions: [skill_summon_elite]  # 2026-10-24 清空；BAL-14b：精英召喚改傷害 +25%、持續 +1 後預算比 10.7%（同時上限 −1 抵 3500 點），計價待玩法 PM 決定
range_step_permille: 50

ap_coefficient_permille: {1: 500, 2: 1000, 3: 1600}   # 主動技能依 ap_cost
reaction_coefficient_permille: 600                     # 反應技（2E-2 起可生成；初值，未經模擬）
# 姿態技能（Phase 2E-2）：可用預算 ＝ tier_budget × 這個係數 × (1000 ＋ 代價折抵) ÷ 1000。
# 姿態狀態的點數在下面的 status_points（持續到取消，不乘持續比例）。初值，未經模擬。
stance_coefficient_permille: 1000
# 形態技能（Phase 3J-1a，enter_form；06 6.30「照姿態計」）：可用預算 ＝ tier_budget × 這個係數 × (1000 ＋ 代價折抵) ÷ 1000，
# 取代姿態係數。enter_form 的點數是下面 primitive_points 的 enter_form（固定，11）。3J-4 由 1000 改 800：1 階 14×0.8＝11.2（98%）、
# 2 階 18×0.8＝14.4（76%），十種形態才都落在合格區間 70～100%（係數 1000 時 2 階形態只有 61%）。初值，未經模擬。
form_coefficient_permille: 800
# 看最大 HP 的護盾（GS-3，#173，shield 的 max_hp_permille）：每 100‰（最大 HP 的 10%）算幾點，代替骰子平均。
# 初值照「化形守護維持 GS-2 的比例（76.7%）」反推：GS-2 的 7d8 平均 31.5 點 ＝ 150‰ × 21 ÷ 100。未經模擬，開放數值工坊。
shield_max_hp_points: 21
# 被動技能（Phase 2E-1）：可用預算 ＝ tier_budget × 觸發時機的係數（skill_triggers.yaml）× (1000 ＋ 代價折抵) ÷ 1000；
# trigger.max_per_round 每多 1 次，可用預算再 × 這個值（次數越多，每次能分到的預算越少）。初值，未經模擬。
passive_extra_trigger_permille: 800
# 裝備授予的技能（E1，08 8.28；玩法交接 4.1.36 待決答覆 1）：不管技能本身標幾階，一律照這一階的預算窗檢查
# （trpg content check；超出就是錯）。開放數值工坊。
gear_skill_tier: 1
# 陷阱技能（Phase 2E-3）：觸發不確定，可用預算 ＝ tier_budget × AP 係數 × 這個值 × (1000 ＋ 代價折抵) ÷ 1000。
# 陷阱的影響範圍倍率取 trap.shape（single／cross／square3）對應的形狀倍率。初值，未經模擬。
trap_coefficient_permille: 800
# consume_stack 的加成點數 ＝ 同技能傷害點數 × 期望消耗層數 × per_stack_permille ÷ 1000；
# 期望消耗層數 ＝ 該層數上限 × 這個值 ÷ 1000（500＝上限的一半；玩家不一定每次都累積滿）。初值，未經模擬。
consume_stack_expected_permille: 500

# consume_status（Phase 3C-3b；初值，未經模擬）：點數 ＝ then 各效果點數合計 × 期望倍率（scale 時）
# × (1000 ＋ splash 加成) ÷ 1000 × 「需要先有狀態」折扣；形狀與對象倍率照一般效果計算。
consume_status_scale_expected: 2
consume_status_splash_permille: 500
consume_status_discount_permille: 700

# 條件倍率：none 無條件、common／harsh 依 skill_conditions.yaml 的 harshness。
# 技能層級的條件乘在 total，效果層級的條件只乘該效果。
# 撞擊強化（Phase 3C-3a）：push／pull 填了 collision_dice 時，每顆骰加這麼多點（初值，未經模擬）。
collision_die_points: 1
# 投擲物件（Phase 3C-5a）：點數 ＝ 骰子平均 × 這個折扣（需要附近有可投擲的物件）÷ 1000；knock_prone: true 另加
# knock_prone 原語的點數（primitive_points）。形狀倍率照一般效果（object_then_tile 為 1.0）。初值，未經模擬。
hurl_object_discount_permille: 800
# 直線衝撞（Phase 3D-2c）：點數 ＝（dice 平均 ＋ on_hit 的點數：knock_prone 為該原語的點數、
# push_aside 為 push 的點數，都在 primitive_points）× 預期被撞到的敵人數（‰）÷ 1000。初值，未經模擬。
charge_through_expected_targets_permille: 1500
# 召喚（Phase 3D-4a）：點數 ＝ 召喚物每輪預估傷害（武器骰平均 ＋ 固定傷害 ÷ quantity_scale）× duration × 這個值 ÷ 1000
# （命中率與吸引火力的折合）。初值，未經模擬。
summon_round_value_permille: 800
# 3D-4b 圖騰：點數 ＝ 光環狀態的點數（status_points）× 預期受惠的友方數 × duration × summon_round_value_permille ÷ 1000²。初值，未經模擬。
totem_expected_allies_permille: 1000
# 3-33e2a 召喚物特性計入預算（初值，未經模擬）：特性價值 ＝ 各項（見 skill_rules.py 的 summon_trait_*）加總，
# 與武器骰平均相加後乘持續輪數與 summon_round_value_permille；自爆與被推倒壓人是一次性（不乘持續輪數）。
summon_trait_extra_damage_permille: 800    # 額外傷害（雷靈的雷電 1d4）：骰子平均 × 80%
summon_trait_status_permille: 200          # 命中附帶狀態：狀態點數 × 20%（點燃 3 → 0.6）
summon_trait_conditional_permille: 400     # 有條件才生效的命中特性（冰靈打水中的目標才冰凍）：再 × 40%
summon_trait_surface_permille: 100         # 造表面：表面點數 × 10%
summon_trait_chain_permille: 300           # 水面連鎖：連鎖傷害 × 30%（要站在水裡）
summon_trait_heal_permille: 600            # 脈動治療：治療骰平均 × 60%
summon_trait_backstab_permille: 250        # 背刺多的骰：骰子平均 × 25%（要繞背）
summon_trait_trip_permille: 200            # 絆倒：擊倒點數 × 20%（對抗判定、每輪 1 次）
summon_trait_knockback_permille: 250       # 震退：推擊點數 × 格數 × 25%
summon_trait_immovable_permille: 500       # 不會被推動（石像）：每輪 0.5 點（擋路的價值）
summon_trait_height_permille: 300          # 高處加傷：每輪傷害 × 加傷比例 × 30%（要站得比目標高）
summon_trait_conceal_points: 1             # 召喚時隱蔽（一次性）
summon_detonate_targets_permille: 800      # 自爆：傷害骰平均 × 0.8 個敵人（一次性；爆裂傀儡要先走到敵人旁）
summon_detonate_rounds: 1                  # 會自爆的召喚物：一般攻擊與特性只算 1 輪（自爆後就消失了）
summon_trait_pull_permille: 1000           # 拉扯（吸引圖騰，3-33e2b 合併補上；初值，未經模擬）：拉扯點數 × 100%，每輪
summon_trait_platform_permille: 250        # 高台（高台圖騰，3-33e2b 合併補上；初值，未經模擬）：升起地形點數 × 高度 × 100%，每輪
summon_topple_targets_permille: 900        # 被推倒壓人：（傷害骰平均 ＋ 擊倒點數）× 0.9 個敵人（一次性；土牆不攻擊，價值全在這裡）
summon_hp_weight_permille: 300                # 3-33f2 加深進化：召喚物最大 HP +N% 的價值 ＝ 每輪價值 × N% × 30%（初值，未經模擬）

# 3D-5 持續區域：點數 ＝ effects 的基礎點數合計 × 預估觸發次數（形狀格數 × duration × zone_cell_round_permille ÷ 1000）
#   × zone_both_permille（when: both 時）× zone_moving_permille（anchor: moving 時）
#   ＋ 表面（surface）的點數 × 形狀格數 ×（moving 時 1 ＋ duration × speed 次新覆蓋，否則 1）× zone_surface_permille。
# 形狀倍率不另外套用（格數已算進觸發次數）。初值，未經模擬。
zone_cell_round_permille: 120
zone_both_permille: 1500
zone_moving_permille: 1500
zone_surface_permille: 300
# 3D-1：restore_resource 的點數（初值，未經模擬）：法力每 quantity_scale 點（core.yaml，現為 10）700‰ 點、冷卻每回合 3 點
restore_mana_point_permille: 700
restore_cooldown_points: 3
# 3D-8a：驅散與揭露的點數（初值，未經模擬）：驅散 1 個增益 3 點、全部 6 點；揭露 ＝ 2 ＋ 1 × duration 點。
dispel_one_points: 3
dispel_all_points: 6
# HC-B：原語的基礎預算點數（從 skill_primitives.yaml 的 base_points 搬來，值不變；開放數值工坊）。
# 順序同原語表；算法照原語的 budget_basis（固定／× 格數／× 數量／× 持續時間係數），形狀倍率另算。
# 鉤、疾病擴散、吸收表面的點數照舊是下面 SK-3b 那幾項（hook_points 等），沒有併進這張表。
primitive_points:
  cleanse: 3          # 淨化（固定）
  push: 2             # 推擊（× 格數）
  pull: 2             # 拉扯（× 格數）
  knock_prone: 3      # 擊倒（固定）
  shockwave: 4        # 震波（固定）
  teleport: 4         # 傳送（固定）
  dash: 3             # 衝鋒（固定）
  leave_form: 0       # 解除形態（固定）
  shadowstep: 3       # 瞬步（固定）；BAL-13d：4 → 3（瞬步背刺每 AP 傷害 ≥ 普攻 1.2 倍）
  leap: 3             # 跳躍（固定）
  swap: 4             # 交換位置（固定）
  teleport_target: 11  # 傳送他人（固定）
  swap_any: 12         # 任意兩者互換（固定）
  destroy_object: 2   # 摧毀物件（固定）
  create_obstacle: 3  # 產生障礙（× 持續回合係數）
  raise_terrain: 7    # 隆起地形（固定）
  lower_terrain: 7    # 下陷地形（固定）
  intercept: 4        # 替隊友擋攻擊（固定）
  add_stack: 2        # 累積層數（× 數量）
  place_trap: 2       # 放置陷阱（固定）
  grant_ap: 4         # 給予 AP（× 數量）
  reset_cooldown: 7   # 重置冷卻（固定）
  cheat_death: 8      # 免死（固定）
  redirect_damage: 7  # 分擔傷害（固定）
  copy_skill: 9       # 複製技能（固定）
  extra_reaction: 7   # 額外反應（× 數量）
  topple: 6           # 推倒（固定）
  steal_buff: 4       # 奪取增益（固定）
  inscribe: 5         # 刻印（× 持續輪數係數）
  blow_surface: 1     # 吹送（× 格數）
  clear_surface: 3    # 清除表面（固定）
  enter_form: 11       # 進入形態（固定）
# HC-B：形狀倍率（‰），從 skill_shapes.yaml 的 budget 搬來（值不變；開放數值工坊）。順序同形狀表。
#   倍率 ＝ base_permille ＋ per_unit_permille × 參數值（參數見 skill_shapes.yaml 的 budget.param）；
#   錐形、十字、環形、連鎖依參數值查表 by_value（HC-W2 從 skill_shapes.yaml 的 by_value_permille 搬來，值不變；
#   鍵是參數值：錐形 size、十字 arm、環形 radius、連鎖 jumps，必須涵蓋參數的整個範圍），base_permille 只在
#   參數沒填時用（例：陷阱的十字範圍）。連鎖的 non_power_by_value（BAL-13d）：不在 power_primitives（形狀表）
#   的效果（狀態、推擊、表面……照常施加、不衰減）改查這張表。
#   只套用在對象為 enemies／allies／all／tiles 的效果（affects: self 與 teleport 一律 1.0）。
shape_budget:
  self:             {base_permille: 1000}   # 自身
  single:           {base_permille: 1000}   # 單體
  line:             {base_permille: 800, per_unit_permille: 200}   # 直線
  cone:             {base_permille: 1000, by_value: {2: 1300, 3: 1600, 4: 2000}}   # 錐形（依長度 size 查表）
  cross:            {base_permille: 1800, by_value: {1: 1800, 2: 2000}}   # 十字（依臂長 arm 查表；臂長 2 的初值見 skill_shapes.yaml）
  square3:          {base_permille: 2000}   # 方陣
  ring:             {base_permille: 1000, by_value: {1: 1800, 2: 2200}, solid_by_value: {1: 1800, 2: 2600}}   # 環形（依半徑 radius 查表）
  # GS-3（#173）：實心環形 solid_by_value 照涵蓋的格數：半徑 1 同樣 8 格（＝1800）；半徑 2 共 24 格，照環形
  # 每多 8 格 +400 外推（8 格 1800、16 格 2200 → 24 格 2600），取較貴的保守初值，未經模擬，開放數值工坊。
  ground_tile:      {base_permille: 1000}   # 指定格
  chain:   # 連鎖（依跳數 jumps 查表；BAL-13c 威力衰減、BAL-13d 非威力效果的說明見 skill_shapes.yaml）
    base_permille: 1000
    by_value: {1: 1188, 2: 1313, 3: 1375}
    non_power_by_value: {1: 1250, 2: 1500, 3: 1750}
  allies_in_radius: {base_permille: 1000, per_unit_permille: 400}   # 範圍光環
  object_then_tile: {base_permille: 1000}   # 物件與落點
  unit_then_tile:   {base_permille: 1000}   # 單位與落點
  unit_pair:        {base_permille: 1000}   # 兩個單位
# HC-B：技能施加狀態（預設持續時間）的預算點數，從 statuses.yaml 的 budget_points 搬來（值不變；開放數值工坊）。
# 沒有列在這裡的狀態不能由技能施加；只給敵人（enemy_only）、只由機制施加（mechanic_only）的狀態不能列。順序同狀態表。
status_points:
  defending: 2           # 守護
  prone: 3               # 倒地
  burning: 3             # 燃燒
  concealed: 3           # 隱蔽
  overwatch: 6           # 監視
  slow: 3                # 緩速
  root: 4                # 定身
  stun: 8                # 暈眩
  frozen: 8              # 冰凍
  weaken: 4              # 虛弱
  vulnerable: 4          # 易傷
  bleed: 3               # 流血
  poison: 3              # 中毒
  guarded: 4             # 護衛
  stoneskin: 3           # 石膚
  empowered: 4           # 激昂
  rallied: 4             # 戰意
  hasted: 3              # 加速
  regenerating: 4        # 再生
  taunted: 3             # 嘲諷；玩法 PM 2026-10-23：加 mental 後由 4 降 3，控制遞減就是代價、不再用預算加價
  feared: 5              # 恐懼
  silenced: 5            # 沉默
  blinded: 4             # 致盲
  marked: 4              # 被標記
  stance_fury: 11         # 狂怒姿態
  stance_bulwark: 11      # 堅壁姿態
  stance_guard: 14        # 堅守姿態
  stance_ironwall: 18     # 鐵壁姿態
  stance_flame: 14        # 焰刃姿態
  stance_blaze: 18        # 烈焰姿態
  stance_frost: 14        # 霜刃姿態
  stance_glacier: 18      # 冰川姿態
  infused_fire: 6        # 火焰附魔
  infused_holy: 6        # 神聖附魔
  commanding: 3          # 號令
  stance_physical_1: 15   # 戰意架勢·壹
  stance_physical_2: 17   # 戰意架勢·貳
  stance_physical_3: 19   # 戰意架勢·參
  stance_physical_4: 22   # 戰意架勢·肆
  stance_physical_5: 28   # 戰意架勢·伍
  stance_fire_1: 15       # 烈焰架勢·壹
  stance_fire_2: 17       # 烈焰架勢·貳
  stance_fire_3: 19       # 烈焰架勢·參
  stance_fire_4: 22       # 烈焰架勢·肆
  stance_fire_5: 28       # 烈焰架勢·伍
  stance_ice_1: 15        # 寒霜架勢·壹
  stance_ice_2: 17        # 寒霜架勢·貳
