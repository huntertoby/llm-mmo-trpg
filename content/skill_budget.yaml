  stance_ice_5: 28        # 寒霜架勢·伍
  stance_lightning_1: 15  # 雷霆架勢·壹
  stance_lightning_2: 17  # 雷霆架勢·貳
  stance_lightning_3: 19  # 雷霆架勢·參
