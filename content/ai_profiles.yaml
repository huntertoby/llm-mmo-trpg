# 效用 AI 的行為模式（docs/專案計畫.md 5.9；docs/phases/Phase1計畫.md 6.1-13；
# 掩護權重與候選移動數見 docs/phases/Phase1C計畫.md 2.5 #1、3.5）。
# AI 對每個合法動作跑 preview，分數 = 預覽收益 + 命中率 × 位置價值的變化（動作後 − 動作前）；
# 分數 > 0 的動作中取最高者（平手依 legal_actions 的順序），沒有正分的動作時結束回合。
#
# 預覽收益（乘上命中率／成功率的期望值）：
#   damage         每點對敵傷害（攻擊的主要傷害用精確期望值）
#   env_damage     每點對敵的環境傷害（爆炸、雷電擴散、墜落、致命地形、表面）額外加分
#   kill           每擊倒一名敵人（確定 ×命中率；只是可能 ×命中率 ÷4）
#   env_kill       以環境擊倒（墜落、深淵、爆炸……）額外加分
#   friendly_fire  每點對友方（含自己）傷害的扣分（取最少與最多後果的平均）
#   push           每名被強制位移的敵人
#   status         每個施加在敵人身上的狀態（倒地等）
#   surface        每名因此站在有害表面（火、毒）上的敵人
#   defend         防禦動作：每名 6 格內的敵人
#   expose         每名因此離開掩護的敵人（被推離半掩護物件旁，或掩護物被摧毀；取最少與最多後果的平均）
#   cover_damage   對「緊鄰敵人的半掩護物件」造成的每點傷害
#   heal           每點實際治療到友方（含自己）的 HP（Phase 2A；取最少與最多後果的平均）
#   shield         每點實際增加的護盾量（新吸收量 − 原吸收量，下限 0；Phase 2D-1，初值未經模擬）
#   support        友方增益：× ally_status_values 的價值 × 新增的持續比例（新持續 − 剩餘 ÷ 新持續，下限 0）；
#                  淨化：× 被移除的每個狀態在 status_values 的價值（沒列出的用 3）
#   mana           技能的法力機會成本：每點法力（扣在技能的分數上）。法力不回復，花掉就沒了
#   stamina_permille  技能的耐力機會成本（Phase 3H-2）：每點耐力 × ‰。武器技的耐力 ＝ 原法力 × 2，所以 500 ＝ 和原本的 mana: 1 等價
#   cooldown       技能的冷卻機會成本：每回合冷卻（扣在技能的分數上）
#   （技能對友方造成的傷害用 friendly_fire；讓友方站上有害的新表面，每名友方扣
#     friendly_fire × 8，相當於一場小火的傷害）
# 環境權重的原則（Phase 2C-4；初值未經模擬，平衡階段再調）：非狡猾型也要有基本的環境權重，否則
# 「利用環境」指令（×2）乘上 0 仍是 0。env_damage ≈ 該行為模式 damage 的 0.3 倍；env_kill ≈ 該
# 模式自己的 kill；push、surface、expose 取較小的值。目的是在明顯的機會出現時（例如把敵人推下
# 深淵）會做，但不會為了環境放棄正常攻擊。狡猾型（cunning）維持原本的高權重。
# 位置價值（行動者在動作後的位置）：
#   approach       與最近敵人的走路步數（越近越好；繞過牆、深淵、岩漿，不看單位；走不到時退回曼哈頓距離，Phase 2C-4）
#   threat         能直接攻擊到的敵人數
#   keep_distance  2 格內的敵人數（扣分；隱蔽的敵人不算——要走到 2 格內才打得到，Phase 2C-4）
#   height         所在高度
#   protect        與最需要保護的友方（HP 比例最低）的距離（越近越好）
#   objective      與勝利條件格子（出口、守點）的距離（越近越好）
#   hazard         站在有害表面上（扣分）
#   cover          在射程內看得到、且從其位置看過來自己受到半掩護的敵人數（偏好有掩護的射擊位置；射程外的
#                  敵人打不到自己，不算——否則雙方躲在掩護後互相射程外時會永遠不接近，Phase 2C-4）
#   backstab       （3D-8d）近戰單位緊貼著敵人、而且站在那個敵人的背後格（背刺位置）的敵人數；表格層級 facing: 填入每個模式
#   back_exposed   （3D-8d）背對相鄰的近戰敵人（扣分）：朝向以「結束移動時面向最近的敵人」近似，背後格站著近戰敵人時扣分；同上
#   flank          （3D-8c）夾擊：緊貼著敵人、而且敵人的對面站著自己的友方的敵人數（近戰單位移動時偏好能夾擊的位置；目前只有 flanker 用）
#   reach_spacing  （3-24a1）長柄近戰武器（矛）：站在 2 格到射程內且打得到的每個敵人加分、緊貼的每個敵人扣同樣的分數（偏好在觸及距離出手；
#                  必須大於 approach，才會在還有移動點數時停在 2 格而不是貼上去）
#   knock_angle    （3-24a1）帶震退的武器（錘）：緊貼著、推開後會撞到東西或掉進致命地形的每個敵人加分（低權重，偏好能撞擊的角度）
#   line_up        （3-24a2）帶穿透的武器（弩）：站位能讓一條直線穿過多名敵人時，每多穿透一名敵人加分（低權重）
#   charge_per_enemy  （3E-1）直線衝撞每個會被穿過的敵人的固定加分（預設 3，不是 0）
#   shadowstep     （3E-1）瞬步的固定加分（預設 3，不是 0）；shadowstep_behind：落在目標背後再加（預設 2）
#   exposed        能打到自己、自己卻打不到的敵人數（射程更長，或自己被遮住；扣分）。互相打得到的對射
#                  不算，所以不會讓弓手不敢進入射擊位置；煙幕、隱蔽讓敵人打不到自己時降低
#
# move_candidates：每次決策中，移動先以「直接放到目的地」的位置價值排序，只保留前 N 個；其中有風險的
# 移動（可能被藉機攻擊、踩上有進入效果的表面、墜落、撤離、倒地站起）才跑完整 preview，其餘的分數
# 直接由位置價值算出（與完整 preview 的分數相同）。攻擊、推擊等其他動作一律跑完整 preview。
move_candidates: 6
# status_values（Phase 2B-1）：對敵人施加各狀態的價值，單位是「等值的傷害點數」。
# 收益 = 行為模式的 damage 權重 × 價值 × 命中率 × 施加成功率（有 save_attr 的狀態要乘上抵抗判定的失敗率）。
# 沒列出的狀態（燃燒、倒地……）維持原本的規則：每個施加的狀態固定加 status 權重。
# 初值未經模擬（Phase 2C 統一調整）：暈眩約一整回合的行動，定身與緩速約半回合的走位，
# 虛弱與易傷約 25% 的傷害差，流血與中毒約 1d4 × 3 回合。
# 2D-1：加上 taunted（嘲諷，約半個回合的行動被迫集中在施放者身上）。
# 2D-2：加上 feared（恐懼，約一回合的走位加攻擊劣勢）、silenced（沉默，約半回合的法術輸出；目標沒有可用的
# 法術技時價值為 0；3-50：自己沉默時價值取同一個值）、blinded（致盲，攻擊劣勢加射程縮短）、marked（被標記，友方對它的命中提高）。初值未經模擬。
status_values: {stun: 12, frozen: 12, root: 6, slow: 4, weaken: 5, vulnerable: 6, bleed: 6, poison: 6, taunted: 5, feared: 6, silenced: 5, blinded: 5, marked: 4, overdrawn: 8}
# ally_status_values（Phase 2D-1）：對友方（含自己）施加各增益的價值，同樣是「等值的傷害點數」，收益 =
# 行為模式的 support 權重 × 價值 × 新增的持續比例。初值未經模擬（平衡階段再調）：再生約 1d4 × 3 回合的
# 治療，護衛約 30% 的減傷、激昂與加速約一回合的額外輸出或走位。
ally_status_values: {guarded: 5, stoneskin: 3, empowered: 5, rallied: 5, hasted: 3, regenerating: 6, defending: 3, stance_fury: 8, stance_bulwark: 8}
# trap_likelihood_permille（Phase 2E-3）：AI 放置陷阱的收益 ＝ 陷阱觸發效果的價值 × 範圍波及的預期敵人數
# （單體 1、十字 1.5、3×3 為 2）× 這個機率（‰）。放置本身在預覽裡沒有效果，收益完全來自這個粗估；
# AI 只在最近的敵人 1–3 格內放、同時最多 2 個、範圍內不放友方。初值未經模擬（平衡階段再調）。
trap_likelihood_permille: 700
# trap（Phase 2F-2，原本寫死在 engine/ai/utility.py，數值不變）：
#   max_active              同陣營同時最多放幾個陷阱
#   near                    只在最近的敵人 1–near 格（曼哈頓）內的格子放陷阱
#   shape_factor_permille   陷阱觸發時預期波及的敵人數（相對單體，‰），以形狀 ID 為鍵
#   default_factor_permille 沒有列出的形狀使用的係數（‰）
trap:
  max_active: 2
  near: 3
  shape_factor_permille: {single: 1000, cross: 1500, square3: 2000}
  default_factor_permille: 1000
# rewrite（Phase 3C-4a）：改寫規則型原語（grant_ap、reset_cooldown、cheat_death）與源力的評分，單位為等值傷害點數
# （× 行為模式的 damage 權重）。最簡單的近似，初值未經模擬：
#   ap_points         獲得的每點 AP（≈ 多一次動作；與其他動作一樣不扣這次花的 AP）；給友方的 AP × ally_ap_permille
#   cooldown_points   被重置的每一回合冷卻
#   undying_points    免死 × 目標已損失 HP 的比例（滿血為 0，所以只在 HP 低時才值得）
#   source_points     每花一點源力的扣分
# Phase 3C-4b（初值，未經模擬）：
#   redirect_points   靈魂連結 × 目標已損失 HP 的比例（施放者 HP 不到一半不連結）
#   reaction_points   每個額外反應次數（目標有反應規則才有價值）
# Phase 3D-1（初值，未經模擬）：
#   mana_points       友方每回復 1 點法力（restore_resource；冷卻縮短沿用 cooldown_points）
#   steal_points      每奪取 1 個增益（steal_buff）
# Phase 3D-8a（初值，未經模擬）：
#   dispel_points     每驅散敵人 1 個增益（dispel）
#   reveal_points     每讓 1 個敵人失去隱蔽、或每揭露 1 個敵方陷阱（reveal）
# Phase 3D-8b（初值，未經模擬）：
#   revive_points     每復活 1 個倒下的友方（revive）
#   refund_ap_points  擊殺時效果每返還 1 點 AP（on_kill 的 refund_ap）
#   bomb_points_permille  定時炸彈：骰子平均 ×（半徑內敵人數 − 友方數，含施放者）× 這個千分比
# Phase 3D-8c（初值，未經模擬）：
#   overwatch_points / overwatch_max_enemies  進入監視（overwatch 狀態）：每個「走得進武器射程」的敵人 × 這個價值（一次監視射擊的預期
#                     收益），最多算幾個敵人（已經在射程內的敵人不算：直接攻擊比較划算；已有監視則 0）
#   grant_skill_points / grant_skill_uses_permille  暫時獲得技能（grant_skill）給自己或友方：每次使用的價值 × 每輪預期使用次數（‰）
#                     × 持續輪數（被給技能預估價值的近似）；重新施放只刷新輪數時不加分
rewrite:
  ap_points: 6
  ally_ap_permille: 600
  cooldown_points: 4
  undying_points: 40
  source_points: 3
  redirect_points: 24
  reaction_points: 8
  mana_points: 1
  steal_points: 8
  dispel_points: 6
  reveal_points: 6
  revive_points: 30
  refund_ap_points: 6
  bomb_points_permille: 700
  overwatch_points: 5
  overwatch_max_enemies: 2
  grant_skill_points: 8
  grant_skill_uses_permille: 800
  activation_round_points: 4    # 3D-6：啟動常駐類傳說每一輪效果的價值（限時 × 持續輪數；整場 × activation_battle_rounds）
  activation_battle_rounds: 4
  delayed_enemy_points: 5          # 3F-4b：延遲段預計範圍內每個敵人的價值（友方扣同樣的分數）
  delayed_attacked_permille: 600   # 3F-4b：被攻擊才釋放的延遲段再乘這個千分比（可能沒人來打）
# summon 的模式欄位（Phase 3-33c，初值）：follow_radius 跟隨時待在召喚者幾格內（軟性）、guard_radius 守護我時只走到召喚者幾格內、
#   guard_threat_range 守護我時敵人「威脅施放者」的距離寬限（敵人射程＋速度＋此值 ≥ 與施放者的距離）、auto_guard_hp_permille 我方 AI 施放者
#   HP 低於此千分比時召喚物改守護我（0＝不切換）、auto_focus_boss 場上有 Boss 時改集火 Boss、infusion_points 估值時帶灌注的召喚物每輪加幾點。
# summon 的灌注欄位（Phase 3-33d，初值未經模擬）：施放者 AI 把技能灌注給召喚物的分數 ＝ 召喚物從自己位置施放的完整預覽分數
#   × infuse_value_permille‰ × 存活機率（召喚物 HP ÷（HP ＋ 能打到牠的敵人數 × infuse_threat_damage））；高於其他動作才灌注（0＝不灌注）。
# summon（Phase 3D-4a 寫在程式裡，3D-4b 搬到這裡；初值未經模擬）：召喚技能的評分，收益 ＝ 召喚物的預估價值
# （單位為等值傷害點數）× 行為模式的對應權重：
#   hit_permille            召喚物預估傷害（武器骰平均 ＋ 固定傷害，每輪一次攻擊）× 持續輪數 × damage 權重
#                           的命中與走位折合（‰）
#   distance_cost_permille  召喚位置與最近敵人每差一格扣的分數（‰；在同一技能的位置之間排序）
#   totem_ally_points       圖騰：範圍內每個友方 × 狀態價值（ally_status_values，沒列出的用這個值）×
#                           持續輪數 × support 權重，同樣乘 hit_permille 折合
summon: {hit_permille: 500, distance_cost_permille: 100, totem_ally_points: 3, boss_blocker_points: 60, boss_blocker_slack: 1, follow_radius: 3, guard_radius: 2, guard_threat_range: 1, auto_guard_hp_permille: 400, auto_focus_boss: true, infusion_points: 1, detonate_targets_permille: 1000, inert_round_points: 2, infuse_value_permille: 1300, infuse_threat_damage: 2, shield_round_permille: 1000, pull_round_points: 3, snare_likelihood_permille: 400, platform_points: 2}   # boss_blocker_*：3-33b，Boss 優先清擋在它與我方非召喚物單位之間的召喚物（初值）；detonate_targets_permille／inert_round_points：3-33e2a，自爆與不行動（土牆）召喚物的估值（初值）
# summon 的 BAL-5 B5 欄位（AI／原型數值初值，待玩法 PM 確認）：
#   灌注：infuse_value_permille 700 → 1000 → 1300（玩法 PM BAL-5：灌注是召喚流特色，目標每場有召喚 ≥ 0.5 次）、infuse_threat_damage 4 → 2（3H 後灌注幾乎都輸給「自己直接放同一招」：同樣 1 AP、同樣法力，
#         灌注卻再打 7 折又乘偏悲觀的存活率）；灌注分數另乘「省下的 AP」＝ 技能 AP ÷ 灌注 AP（至少 1；2 AP 的技能灌注只花 1 AP）。
#   特性估值（原本為 0）：shield_round_permille 護盾脈動每輪護盾量平均 × shield 權重 × ‰；pull_round_points 拉扯脈動每輪等值傷害點數；
#         snare_likelihood_permille 纏繞每輪觸發的機率（× 狀態價值）；platform_points 高台每名遠程友方（非召喚物）一次性的等值傷害點數
#         （不乘輪數：乘輪數時 AI 反覆召喚圖騰、戰鬥拖長而勝率沒變；改放在施放者旁邊則圖騰不再替我方吸引火力，勝率掉到 50%，已撤回）。
# zone（Phase 3D-5；初值未經模擬）：持續區域的評分。收益 ＝ 區域每次觸發的價值（傷害骰平均 × damage 權重、
# 狀態價值、治療 × heal 權重……）× 區域格內與移動路徑上的對象數 × 持續輪數 × likelihood_permille（之後
# 每輪真的有對象觸發的比例）；移動型路徑上的對象乘 path_permille。建立當下就在區域內的對象由預覽計算。
# AI 移動時把敵方有害區域的格子當成有害表面（hazard 權重）。
zone: {likelihood_permille: 400, path_permille: 500}
# gamble（Phase 3D-7a；初值未經模擬）：賭博型技能（賭注 gamble、失手反噬 cost.on_miss）的評分用期望值——每個分支的分數 ×
# 該分支的機率（賭注：成功率與失敗率；失手反噬：預覽本身只算命中的情形，反噬不計）。施放者 HP 低於最大 HP 的 hp_floor_permille‰
# 時，反噬可能造成傷害的賭博技能（失敗分支或失手反噬有自傷）不在快死時亂賭：正分乘 low_hp_permille‰（大幅降低），負分不變。
gamble: {hp_floor_permille: 300, low_hp_permille: 100}
# self_cost（Phase 3-50；初值未經模擬）：自己付的代價的使用條件（06 6.5 共通規則 6）。自暈（會跳過回合的自身狀態）：HP 低於
# stun_hp_below_permille‰ 且 stun_enemy_radius 格內有敵人才用；透支：這一擊能擊殺，或波及的敵人 ≥ overdraft_min_targets 才用。
self_cost: {stun_hp_below_permille: 500, stun_enemy_radius: 6, overdraft_min_targets: 2}
# form（Phase 3J-1a，06 6.30）：進入形態的價值（等值傷害點數；收益 ＝ support 權重 × enter_value）。AI 沒在姿態中、
# AP 夠時才考慮進入（3J-1b：已在形態中也可輪替到另一個沒冷卻的形態，價值 rotate_value），不主動取消（維持費不夠時由規則自動解除）。進入獎勵的護盾、治療、傷害另外照一般事件計分。初值，未經模擬。
form: {enter_value: 8, rotate_value: 4}
# terrain（Phase 3T-5；初值未經模擬）：純地形技能（隆起 raise_terrain、下陷 lower_terrain）的評分，單位為等值傷害點數（× damage 權重）：
#   height_points  站在被改變格子上的單位，高度每變一層：敵人被降低／友方被抬高為收益，反過來為損失（施放者自己的格子由 height 位置權重處理）
#   pit_points     下陷造出的坑旁邊每名高出墜落門檻的敵人（我方有推擊或拉扯技能才算）；沒有任何收益就不施放
terrain: {height_points: 4, pit_points: 6}
# rune（Phase 3-23；初值未經模擬）：刻印的評分，只在行動者有讀取技能（條件 on_own_rune 或 detonate_runes）時才主動刻。
#   inscribe_points   在敵人腳下刻一個符文的價值（等值傷害點數，× damage 權重）；
#   adjacent_permille / near_permille  符文離最近的敵人 1 格、2 格時相對於腳下的比例（更遠為 0）
#   read_points       讀取技能打到站在自己符文上的敵人時，每個目標的額外價值
rune: {inscribe_points: 6, adjacent_permille: 600, near_permille: 300, read_points: 6}
# orders（Phase 2C-2）：戰術指令的評分加成，初值未經模擬（2C-4 調整）。指令只改評分，不改合法動作。
#   focus_permille        集火：對目標的預覽收益（傷害、擊倒、狀態、推擊、表面、離開掩護）×1.5；
#                         位置價值的 approach 改以「與目標的距離」計算
#   hold_weight           守位：每超出 radius 一格的位置價值扣分
#   retreat_weight        撤退：與目標格每一格距離的位置價值扣分（approach、threat 視為 0）
#   protect_min           保護：protect 權重至少這麼大，對象固定為指令的友方
#   environment_permille  利用環境：環境傷害、環境擊倒、推擊、表面、離開掩護的收益 ×2
orders: {focus_permille: 1500, hold_weight: 20, retreat_weight: 15, protect_min: 12, environment_permille: 2000}
# facing（Phase 3D-8d；初值未經模擬）：朝向與背刺的位置權重，敵我同一套（填入每個行為模式的 weights，模式自己列出的優先）。
facing: {backstab: 4, back_exposed: 3}
# weapon_ai（BAL-5 B19；AI／原型數值初值，待玩法 PM 確認）：武器站位的位置權重，敵我同一套，填入每個行為模式的 weights
# （模式自己列出的優先）。只影響「近距離武器」：距離傷害修正（range_mod 的 damage_permille）的最佳距離 ≤ 2 格、且比射程近
# （依武器資料判斷，不寫死 ID；目前只有霰彈槍）。
#   close_range  站位能打到的敵人中，距離傷害千分比最高者 × 這個值 ÷ 1000；保持距離（keep_distance）只計比最佳距離更近的敵人
weapon_ai: {close_range: 40}
# skill_ai（BAL-5 B1；AI／原型數值初值，待玩法 PM 確認）：技能選用的權重，敵我同一套，填入每個行為模式的 weights。
#   multi_target  範圍技每多打到一名敵人（預期，乘命中率；只要命中判定的敵人算命中率、不用判定的算 1）的加分；
#                 只打到 1 名時 0。目的：有 ≥ 2 名敵人可打時優先用範圍技（3-32d 的選用率 40% → ≥ 70%）
skill_ai: {multi_target: 24}
# objective_ai（Phase 3-22，玩法 #23；初值未經模擬，平衡階段再調）：撤離與守點戰的 AI 權重，敵我同一套，填入每個行為模式的 weights
# （模式自己列出的優先）。只在撤離或守點的戰鬥生效，其他戰鬥完全不變：
#   rush_exit    撤離戰，我方：離最近出口每一格的位置價值額外扣分（疊加在 objective 上）→ 朝出口
#   intercept    撤離戰，敵方：離最近出口每一格的位置價值扣分 → 守在出口路線上攔截
#   contest      守點戰，敵方：離最近守點格每一格額外扣分（疊加在 objective 上）→ 搶點
#   hold_point   守點戰，我方：離守點超過 hold_radius 格的每一格扣分 → 守在點附近
#   hold_radius  hold_point 與 hold_guard 的半徑（曼哈頓格數）
#   hold_guard   守點戰，我方在守點 hold_radius 格內、6 格內有敵人時，守護（防禦）動作多加的分數 → 守住點
objective_ai: {rush_exit: 6, intercept: 8, contest: 4, hold_point: 10, hold_radius: 2, hold_guard: 4}
