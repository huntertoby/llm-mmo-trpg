# 隨機技能組合器的調參資料（docs/phases/Phase2C計畫.md 3.1；原本寫在 skillgen/random_composer.py、
# composer_parts.py、composer_tuning.py）。‰＝千分比。這裡只放「抽選機率與範圍」；
# 組合的流程與亂數呼叫順序在程式碼。改動任何數值都會改變「種子 → 技能」的對應。

# 頂層參數（每個種子只抽一次）
rarity_weights: {common: 35, rare: 35, epic: 20, legendary: 10}
ap_weights: {1: 35, 2: 50, 3: 15}     # AP 的嘗試順序權重（結構太強或太弱時換 AP）
spell_share_permille: {default: 500, aura: 850, sacrifice: 1000}   # 骨架 → 法術占比
spell_any_weapon_permille: 250        # 法術技的武器需求為「任何」（其餘為法器）
spell_attr_weights: {int: 60, wis: 20, wil: 20}
melee_permille: 500                   # 武器技是近戰（其餘遠程）
melee_dex_permille: 250               # 近戰武器技以敏捷為主屬性（其餘力量）
infuse_permille: 350                  # 武器技帶元素（其餘物理）

# 強度旋鈕的階梯
dice:
  sides: [4, 6, 8, 10, 12]
  max_count: 8                        # 顆數 1–8，依平均值由弱到強排序
multipliers:                          # 武器倍率（‰），range(start, stop, step) 依序接起來
  - {start: 500, stop: 3000, step: 100}
  - {start: 3000, stop: 6000, step: 250}
  - {start: 6000, stop: 10001, step: 500}
duration:
  cap: 6                              # 持續上限（回合）
  movement_extra: 1                   # 移動類狀態最多比預設多幾回合（硬控不可延長）
  other_extra: 3
  surface_extra: 3
  status_weight: 2                    # 旋鈕被選到的權重
  surface_weight: 1

# 核心、形狀、效果
structure:
  knob_weight_core: 6                 # 核心效果的旋鈕權重
  knob_weight_other: 1
  push_pull_distances: [1, 2]
  blow_distances: [2, 3]              # 吹送（3-54a）距離旋鈕的階梯
  blow_surface_permille: 80           # 範圍骨架（稀有以上）加上吹送附帶效果的機率（3-54a；獨立亂數串流，沒抽中的種子不變）
  shockwave_permille: 250             # 大地主題＋直線形狀的範圍骨架（稀有以上）加上震波附帶效果的機率（3-54b；獨立亂數串流）
  displace_second_core_permille: 250  # 位移骨架有第二個核心原語
  combo_double_damage_permille: 500   # 連段有第二段傷害
  control_buff_permille: 250          # 控場核心狀態為自我增益
  stun_min_cooldown: 4
  big_ring_radius: 2                  # 達到這個半徑的環形算大範圍（強制冷卻）
  big_cone_size: 4                    # 達到這個大小的錐形算大範圍
  cross_zero_range_permille: 150      # 十字與 3×3 以自身為中心（施放距離 0）
  cross_min_range: 2
  other_min_range: 3
  fallback_secondary: [apply_status, push, pull, knock_prone]   # 骨架沒指定附帶原語時

# 條件
condition:
  skill_permille: 300                 # 稀有（含）以上有條件
  effect_level_permille: 500          # 有條件時掛在單一效果上
  target_conditions: [target_hp_below, height_advantage, target_on_surface, target_has_status, target_isolated]
  # 施放者條件（3C-6b）：技能層級的條件不需要影響範圍內有對象。flanked、from_behind、cast_tag_this_turn、
  # self_concealed 需要特定站位或前一個動作，隨機組合器不產生（驗收的測試場面無法穩定成立）；in_form（3J-3）
  # 需要先花 1 AP 進入形態，同樣不產生（形態關鍵字的組合器支援在 3J-4 評估）。
  self_conditions: [self_hp_below, moved_this_turn, adjacent_ally, first_round]
  # 低權重的額外目標型條件（3-24c；獨立的亂數串流，沒有被抽中的種子結果不變）：撞擊的真實利用者
  extra_conditions: [target_collided]
  extra_permille: 60
  # 武器親和（3I-5，初值）：給了主角手上的裝備時，組好的技能的附帶效果上的常見條件有這個機率換成「手持
  # 某種武器時」（預算不變；獨立於組合的亂數串流，沒給手上裝備時結果完全相同）
  affinity_permille: 400
  target_hp_below: {min: 200, max: 600}   # ‰
  self_hp_below: {min: 300, max: 700}

# 代價
cost:
  spell_mana_per_ap: {min: 2, max: 4}     # 法術法力 ＝ 亂數 × AP ＋ (階級 − 1) × spell_mana_per_tier
  spell_mana_per_tier: 2
  weapon_free_permille: 350               # 武器技不花法力
  weapon_mana_per_ap: {min: 1, max: 3}
  no_cooldown_permille: 300               # AP ≤ no_cooldown_max_ap 時沒有冷卻
  no_cooldown_max_ap: 2
  cooldown_base_max: 2                    # 冷卻 ＝ 1 到 (cooldown_base_max + AP)
  cooldown_cap: 6
  uses_per_battle_permille: 120
  uses_per_battle: {min: 1, max: 2}
  # 自身狀態代價（Phase 2H-1，初值，未經模擬）：主動技能以這個機率加入；狀態從 skill_budget.yaml 的
  # allowance.self_status.allowed 抽（稀有度不夠的狀態不抽），持續時間在 self_status_duration 內抽（2–3）
  self_status_permille: 60
  self_status_duration: {min: 2, max: 3}
  # 透支（Phase 3-50，3-50b 起可和自身狀態並用）：主動技能以這個機率加入透支（下回合少 1 AP，固定折抵）
  overdraft_permille: 40

# 被動（Phase 2E-1，初值）：稀有度 epic 以上、未指定骨架時改組被動的機率（獨立的亂數串流，不影響其他種子）
passive:
  skeleton_permille: 150
  other_permille: 600                 # 有「另一方」的時機：效果作用在另一方（其餘作用在持有者）
  second_effect_permille: 350         # 多帶一個附帶效果
  mana: {min: 0, max: 3}              # 法力 ＝ 亂數 ＋ (階級 − 1) × mana_per_tier
  mana_per_tier: 1
  cooldown_permille: 250
  cooldown: {min: 1, max: 2}

# 反應技（Phase 2E-2，初值）：稀有度 rare 以上、未指定骨架時改組反應技的機率（獨立的亂數串流）
reaction:
  skeleton_permille: 100
  intercept_permille: 300             # 事件為「相鄰友方被命中」（擋攻擊）的機率
  self_permille: 350                  # 其他事件：自身增益（其餘對觸發者）
  second_effect_permille: 300
  mana: {min: 0, max: 3}
  mana_per_tier: 1
  cooldown_permille: 400
  cooldown: {min: 1, max: 3}

# 姿態（Phase 2E-2，初值）
stance:
  skeleton_permille: 60
  shield_permille: 500                # 階級 2 以上一定帶
  mana: {min: 0, max: 2}

# 蓄力與終結（Phase 2E-3，初值）：稀有度 rare 以上、未指定骨架時改組蓄力／終結技的機率（獨立的亂數串流）
builder:
  skeleton_permille: 60
  builder_permille: 500               # 累積層數（其餘為消耗層數）
  max_amount: 2                       # add_stack 的 amount 旋鈕上限
  per_stack: {start: 50, stop: 501, step: 25}   # consume_stack 的 per_stack_permille 階梯（‰）
  max_required_stacks: 2              # 消耗施放者層數的技能，cost.stacks 抽 1 到這個值
  required_permille: 600

# 陷阱（Phase 2E-3，初值）：稀有度 rare 以上、未指定骨架時改組陷阱的機率（獨立的亂數串流）
trap:
  skeleton_permille: 60
  delay_permille: 450
  enter_rounds: {min: 2, max: 4}
  delay_rounds: {min: 1, max: 3}
  shape_weights: {single: 4, cross: 3, square3: 2}

# 刻印（Phase 3-23，初值）：稀有度 rare 以上、未指定骨架時改組刻印技能（inscribe）的機率（獨立的亂數串流；低權重）
rune:
  skeleton_permille: 40

# 獻祭召喚物（Phase 3-24c，初值）：稀有度 rare 以上、未指定骨架時改組獻祭技能（sacrifice_summon）的機率（獨立的亂數串流；低權重）
sacrifice:
  skeleton_permille: 30
  heal_permille: 350                  # 治療版（沒有 element）的機率，其餘為爆炸

# 強度調整：比例收在 [low, high]，目標均勻分佈在 [low, high − margin]
tuning:
  low_permille: 750
  high_permille: 950
  target_margin_permille: 20
  target_steps: 100
  jump_share_permille: 600            # 依缺口一次跳多格時實際跳的比例

# 雙屬性縮放與專精加成（Phase 2H-2，初值，未經模擬）：主動技能強度調整成功之後才抽（不影響既有結構的抽選）。
# dual_permille：稀有度達 core.yaml 的 dual_scaling_min_rarity 時加第二縮放屬性的機率，第二屬性從技能的縮放允許範圍
# （skill_scaling.yaml，主屬性以外）抽一個，範圍裡沒有別的屬性時不給（Phase 3H-7）；mastery_permille：沒有第二屬性、且有合法專精（range 需要施放距離、duration 需要施加狀態）時給 mastery 的機率。
scaling:
  dual_permille: 300                   # 3I-3 依 #46：30%（主角第二高與最高屬性差 ≤ 4 時才給，見 skill_scaling.yaml 的 dual_max_gap）
  mastery_permille: 300

# 修正技能與傳說（Phase 3C-6b，初值，未經模擬）：composer_special.py 以「列舉候選 → 預算比例在 tuning 區間內 → 亂數挑一個」組合。
# modifier_permille：稀有度史詩以上、未指定骨架時改組修正技能（kind: modifier）的機率（獨立的亂數串流）。
# 傳說（rarity_weights.legendary）一律走 composer_special：核心三擇一（修正規則、規則改變、改寫規則型原語）＋ 1–2 點源力。
special:
  modifier_permille: 100

# 戰場變奏（Phase 3-25b，docs/design/06-技能.md 6.24；初值，未經模擬）：稀有度 rare 以上的主動技能組好之後，
# 以 permille 的機率（獨立的亂數串流；沒有抽中的種子結果不變）再加一個變奏。候選＝條件 × 替換內容的所有組合
# （型態名＝「條件名・替換名」），依亂數順序逐一試，第一個通過驗證（schema、每個型態的預算窗）的採用；
# 都不合格就維持原技能。進化模板「戰場變奏」（skill_evolution.yaml）共用同一份候選。
variant:
  permille: 250
  conditions:
    - {id: wet, name_zh: 水中, when: {caster_surface: [water]}}
    - {id: icy, name_zh: 冰上, when: {caster_surface: [ice]}}
    - {id: high, name_zh: 居高, when: {caster_high_ground: true}}
    - {id: wall, name_zh: 靠牆, when: {caster_adjacent_blocker: true}}
    - {id: oil, name_zh: 油面, when: {target_surface: [oil]}}
    - {id: puddle, name_zh: 水窪, when: {target_surface: [water]}}
  changes:
    - {id: far, name_zh: 遠投, range_delta: 2}
    - {id: line, name_zh: 貫穿, shape: {type: line, size: 3}}
    - {id: fire, name_zh: 火焰, element: fire}
    - {id: lightning, name_zh: 雷電, element: lightning}
    - {id: ice, name_zh: 寒霜, element: ice}
    - {id: prone, name_zh: 擊倒, add_effect: {type: knock_prone}}

# LLM 提議題目的多樣性（Phase 4-L6，docs/phases/Phase4計畫.md 3C 節；trpg.skillgen.proposal_topic）：結構的多樣性由引擎
# 決定，不交給模型的偏好。核心原語由種子加權抽出；run 內配額＝原語已出現在這一輪的候選 n 次時，權重 ＝ 基礎 × 100 ÷ (100 ＋ n × 係數)。
# 輪替選單：附帶原語與條件只開放一部分（題目關鍵字要的必收），並由種子打亂 available 的順序。
llm_topic:
  secondary_count: 6
  condition_count: 4
  core_exclude: [enter_form, leave_form]   # 形態只由手寫內容提供（Phase 3J；LLM 題目不出形態）
  base_weight: 100
  quota_percent_per_use: 100
  core_weights: {}                          # 個別原語的基礎權重（沒列出的用 base_weight）

# LLM 提議的費用旋鈕（Phase 4-L8b，4-L3 待決 #2、4-L8 待決 #6）：結構在最低費用（AP 2、1 點資源、沒有冷卻）下仍超出預算上限時，
# 補值器依序往上試 steps（由輕到重；每階各自獨立，欄位取「原本的值」與「這一階」中較大者），取第一個讓預算比例回到上限以內的，
# 再照一般旋鈕調進區間。只影響補值器補 LLM 提議的數值，不影響手寫技能與隨機組合器；只用在主動技能。
# max_cooldown：冷卻上限 5（06 6.5；比引擎硬上限 6 保守）。mana：法力，武器技依 stamina_per_mana 換成耐力。初值，未經模擬。
llm_cost:
  max_cooldown: 5
  steps:
    - {cooldown: 1}
    - {cooldown: 2}
    - {cooldown: 3}
    - {cooldown: 4}
    - {cooldown: 5}
    - {cooldown: 5, mana: 3}
    - {cooldown: 5, mana: 6}
    - {cooldown: 5, mana: 10}
    - {ap: 3}
    - {ap: 3, cooldown: 1}
    - {ap: 3, cooldown: 2}
    - {ap: 3, cooldown: 3}
    - {ap: 3, cooldown: 4}
    - {ap: 3, cooldown: 5}
    - {ap: 3, cooldown: 5, mana: 6}

# 白板技能（Phase 3W-4，docs/design/06-技能.md 6.34.1、玩法決定 #69；trpg.skillgen.whiteboard）：1 階、一個核心效果、一個關鍵字、
# 形狀簡單（單體或小範圍）、沒有附帶效果、沒有條件；主動技用預設費用（AP 2、冷卻 0～2）；預算照同階規則（比例收在 tuning 區間內，
# 即 75～95%，落在驗收的 70～100% 內）。「單一效果」模式只從下面的配方出（配方 ＝ 一個關鍵字的一個核心效果），所以每個白板剛好製造
# 一個關鍵字；沒有配方的關鍵字（召喚物、形態，以及各種類缺的組合）由呼叫端退回手寫技能池或主動白板。稀有度取「配方需要的最低稀有度」
# （例如被動至少 epic、推擊至少 rare），不增加強度。數值為初值，未經模擬。
whiteboard:
  kind_permille: {active: 700, passive: 200, reaction: 100}   # 升級與任務三選一的種類比例（07 7.6）
  tier: 1                             # 沒指定階級時（創角）；升級與任務三選一用角色目前階級（roguelite.yaml 的 offer_tier_by_level，#72）
  ap_cost: 2
  cooldown: {min: 0, max: 2}
  passive_mana: {min: 0, max: 2}
  reaction_mana: {min: 0, max: 2}
  reaction_cooldown: {min: 1, max: 2}
  max_attempts: 60
  # 3W-R2：白板的形狀與原語分類（原本寫在 skillgen/whiteboard_check.py）
  simple_shapes: [self, single, ground_tile, cross, square3]   # 白板允許的形狀：自身、單體、單格、十字、3×3
  self_move_effects: [teleport, swap, leap]                  # 自身位移或互換（主動白板用 self_ap_cost）
  displace_effects: [teleport, swap, leap, push, pull]       # 位移類核心效果：可以帶一個小補強
  terrain_effects: [raise_terrain, lower_terrain]            # 升降地形（單格的升降地形白板用 self_ap_cost）
  active:
    - {id: fire_bolt, keyword: ignite, skeleton: strike, effect: {type: damage, element: fire}, name_zh: 火球, concept_zh: 一團火焰直直砸向目標, flavor_zh: 火球拖著尾焰撞上目標，炸出一圈熱浪}
    - {id: fire_burst, keyword: ignite, skeleton: area, effect: {type: damage, element: fire}, shapes: [cross, square3], name_zh: 烈焰爆, concept_zh: 在一小片區域引爆火焰, flavor_zh: 火舌向四面舔開，把範圍內的一切都燎了一遍}
    - {id: kindle, keyword: ignite, skeleton: control, effect: {type: apply_status, status: burning}, theme: fire, shapes: [cross, square3], name_zh: 點燃, concept_zh: 讓目標身上燒起來, flavor_zh: 一點火星落在衣角，轉眼就燒成一片}
    - {id: lightning_bolt, keyword: charged, skeleton: strike, effect: {type: damage, element: lightning}, name_zh: 雷擊, concept_zh: 一道電光劈向目標, flavor_zh: 空氣劈啪作響，電弧在目標身上炸開}
    - {id: spark_burst, keyword: charged, skeleton: area, effect: {type: damage, element: lightning}, shapes: [cross, square3], name_zh: 電爆, concept_zh: 在一小片區域釋放電流, flavor_zh: 靜電在指尖積滿，向四周同時放開}
    - {id: frost_shard, keyword: frozen, skeleton: strike, effect: {type: damage, element: ice}, name_zh: 冰錐, concept_zh: 一根冰錐射向目標, flavor_zh: 寒氣在掌心凝成尖錐，貼著空氣飛出去}
    - {id: frost_patch, keyword: frozen, skeleton: control, effect: {type: create_surface, surface: ice}, theme: ice, shapes: [cross, square3], name_zh: 凝冰, concept_zh: 讓地面結出一層冰, flavor_zh: 霜花沿著地面蔓延，眨眼間凍成滑溜溜的冰面}
    - {id: venom, keyword: poisoned, skeleton: control, effect: {type: apply_status, status: poison}, theme: poison, shapes: [cross, square3], name_zh: 淬毒, concept_zh: 讓目標中毒, flavor_zh: 一絲綠光滲進傷口，毒性開始在血管裡蔓延}
    - {id: toxic_pool, keyword: poisoned, skeleton: control, effect: {type: create_surface, surface: poison}, theme: poison, shapes: [cross, square3], name_zh: 毒沼, concept_zh: 讓地面泛出毒液, flavor_zh: 腳下的泥土冒出泡沫，散發著刺鼻的氣味}
    - {id: mark_target, keyword: marked, skeleton: control, effect: {type: apply_status, status: marked}, shapes: [single, cross, square3], name_zh: 烙印, concept_zh: 在目標身上留下一道印記, flavor_zh: 一道淡淡的光紋印在目標身上，怎麼躲都藏不住}
    - {id: shadow_bolt, keyword: concealed, skeleton: strike, effect: {type: damage, element: shadow}, name_zh: 暗影彈, concept_zh: 一團暗影撲向目標, flavor_zh: 影子從腳邊竄起，無聲無息地咬上目標}
    # 3W-9：升降地形影響 4～6 格要角色 2 階、7 格以上 3 階（6.34.9 #58），十字（5 格）的隆地 1 階不能出；改成只升一格（AP 1：單一效果的點數固定，
