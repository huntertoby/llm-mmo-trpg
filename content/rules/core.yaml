# 核心戰鬥規則數值（docs/phases/Phase1計畫.md 3.5、docs/專案計畫.md 第 5 節）。
# 百分比一律為整數千分比（‰）。修改 hit_slope 或 hit_mod_cap 後必須執行
#   uv run python scripts/gen_hit_table.py
# 重新產生 rules/hit_table.yaml（載入時會檢查兩者一致）。

# --- 行動經濟 ---
ap_per_turn: 3                # 每回合 AP
ap_carry_max: 1               # 可保留到下回合的 AP
basic_attack_ap_cost: 1       # 普攻消耗
defend_ap_cost: 1             # 防禦動作消耗
run_ap_cost: 1                # 跑步（3-20，玩法 #22）消耗
swap_ap_cost: 1               # 換位（3-21a，玩法 #24）消耗
aim_ap_cost: 1                # 瞄準（3-21a）消耗
aim_hit_bonus: 2              # 瞄準：下一次需要擲命中的攻擊命中 +2（不疊加；平衡階段初值）
guard_transfers_per_round: 1  # 守護隊友：每輪最多替隊友承受的次數（單體攻擊；平衡階段初值）
vault_ap_cost: 1              # 攀跳（3-21b，玩法 #24）消耗
vault_move_cost: 2            # 攀跳：另外消耗的移動點數（平衡階段初值）
vault_climb_height: 2         # 攀爬：可爬上的相鄰格高度差上限（超過一般移動的 max_climb_height 才算攀爬）
vault_jump_width: 1           # 跳躍：最多越過幾格連續的不可站立格（深淵、岩漿；平衡階段初值）
run_move_bonus: 3             # 跑步：本回合移動點數 +3 格（固定格數，不受加速／緩速影響；平衡階段初值）

# --- 判定 ---
hit_target: 11                # d20 + 命中修正 + 熟練 + 情境 >= 11
hit_slope: 4                  # 命中修正斜率
hit_mod_cap: 8                # 命中修正上下限 ±8
proficiency: 2                # 熟練加值
height_hit_bonus: 2           # 高打低 +2、低打高 −2
# 3D-8d：朝向與背刺（docs/design/06-技能.md 6.21；初值，未經模擬）。近戰攻擊者站在目標的背後格（目標朝向的反方向相鄰格）時自動套用；Boss 照常適用
backstab_hit_bonus: 2         # 背刺：命中 +2
backstab_crit_range_bonus: 1  # 背刺：暴擊範圍 +1（武器 20 → 19–20）
ambush_hit_bonus: 2           # 潛行偷襲：帶 concealed 狀態時發動攻擊命中 +2，攻擊結算完後移除 concealed
melee_height_limit: 1         # 近戰（射程 <= melee_height_limit_max_range）攻擊的高度差上限
melee_height_limit_max_range: 2   # 射程不超過此值的武器（近戰、長柄）受高度差限制
initiative_attr_base: 10      # 先攻：d20 + (敏捷 − 10) // 2
initiative_attr_divisor: 2

# --- 衍生數值（Phase 3-7；初值）---
hp_con_base: 10                # 體質 10 為基準：最大 HP ＝ 範本基礎 HP ＋（體質 − 10）× hp_per_con_point（至少 1）
hp_per_con_point: 3           # 每點體質 +3 最大 HP（敵我同一公式）
level_hp_permille: 50          # roguelite 每升一級：最大 HP + 基礎 HP × 5%（向下取整）

# --- 傷害 ---
basic_attack_attr_multiplier_permille: 300   # 普攻的屬性倍率（0.3）
element_mod_floor_permille: 250              # 元素修正下限（總減傷上限 75%）
min_damage_on_hit: 1                         # 命中時的最低傷害
defend_defense_bonus_permille: 250           # 防禦動作：防禦值 +25%

# --- 移動與環境 ---
move_climb_extra_cost: 1               # 爬升一層額外消耗 1 格移動
max_climb_height: 1                    # 一步最多往上 1 層（2 層以上不可通行）
fall_damage_min_drop: 2                # 往下 2 層以上才會墜落受傷（以「落差 − 1」層計算）
fall_damage_permille_per_level: 100    # 每層 10% 最大 HP
fall_damage_cap_permille: 300          # 單次墜落上限 30%
deadly_terrain_elite_permille: 300     # 精英與 Boss 落入致命地形受 30% 最大 HP
prone_stand_up_move_permille: 500      # 倒地站起消耗一半移動點數（無條件進位）

# --- 技巧動作與互動（Phase 1B）---
maneuver_ap_cost: 1           # 推擊（Shove）、絆倒（Trip）
interact_ap_cost: 1           # 互動（推動物件）
interact_height_limit: 1      # 互動：行動者與物件所在格的高度差上限（Phase 1C）
shove_distance: 1             # 推擊距離
max_displace_distance: 2      # 推擊與拉扯的距離上限（6.6；修正規則的 push_distance_delta 超過時截斷，Phase 3C-2）
consume_status_max_scale: 3   # consume_status 的 scale 倍率上限（then 的骰數 ×1～3；Phase 3C-3b）
steadfast_push_permille: 500  # steadfast 標籤：推擊距離 ×50%（無條件捨去）
collision_damage_dice: 1d6    # 撞擊傷害：被強制位移的單位因障礙每少走 1 格受一次，物理、不加屬性（Phase 3C-3a）
topple_length: 2              # 推倒（Phase 3C-5a）：topplable 物件往推的方向倒下，從下一格起壓住的格數（初值，未經模擬）
topple_damage_dice: 2d6       # 推倒壓到的單位受到的物理傷害（並倒地）；壓到的 breakable 物件受同樣傷害（初值）
topple_rubble_object: rubble  # 推倒後在最後一格產生的物件（objects.yaml）
teleport_enemy_resist_bonus: 2   # 傳送敵人（Phase 3D-2b）：目標的抵抗加成（從 d20 總和扣除；同級成功率 60% → 50%；初值）
teleport_lethal_resist_bonus: 8  # 傳送到致命地形時目標再加的抵抗加成（總 +10，同級成功率 10%；初值）
hurl_scatter_radius: 1        # 投擲物件（Phase 3C-5a）：落點被占用時，放在這個距離內最近的空格（同距離依 (y, x)），沒有就摧毀
pierce_behind_permille: 700   # 穿透（Phase 3C-5b）：穿過 penetrable 物件後，後方目標受到的傷害‰（物件本身受全額；初值，未經模擬）
# 3D-8b：復活——原格被占用或不能站立時，站到這個距離（曼哈頓）內最近的空格；範圍內沒有空格就不能施放（初值）
revive_landing_radius: 2
# 3D-7b：爆骰（explode: true）每顆骰最多再擲 explode_max 次；依情況縮放（scaling）的 cap_permille 上限（初值，未經模擬）
explode_max: 2
scale_cap_max_permille: 800
ability_mod_base: 10          # 檢定的屬性修正：(屬性 − 10) // 2
ability_mod_divisor: 2

# --- 反應（Phase 1B）---
reactions_per_round: 1        # 每輪反應次數
default_stamina: 30           # 單位範本未指定耐力時的預設值

# --- 視線與隱蔽（Phase 1B）---
base_sight_range: 24          # 基準視線距離（曼哈頓）；濃霧等天氣以倍率縮短
concealed_ranged_max_distance: 2   # 隱蔽的目標超過此距離無法被攻擊選為目標

# --- 掩護（Phase 1C，docs/phases/Phase1C計畫.md 3.1–3.2）---
half_cover_hit_penalty: 2     # 遠程攻擊半掩護後的目標：命中 −2（與隱蔽的劣勢可同時生效）

# --- 環境回合（Phase 1B）---
burning_object_rounds: 1      # 著火的物件在第幾次環境回合摧毀（1 = 下一次環境回合）

# --- 技能（Phase 2A，docs/phases/Phase2A計畫.md 4.2、4.5）---
spell_attr_multiplier_permille: 500   # 法術技與治療：縮放屬性 × 0.5 加進骰值
dual_scaling_min_rarity: epic         # 雙屬性縮放（各 50%）的最低稀有度（Phase 2H-2，初值，未經模擬）
variant_max_by_rarity: {common: 0, rare: 1, epic: 2, legendary: 2}   # 戰場變奏的數量上限（Phase 3-25a，6.24）
skill_slots:                          # 戰鬥時可裝備的技能數量上限（依 kind）
  active: 6
  passive: 3                          # 含修正技能（kind: modifier，Phase 3C-2 由 2 → 3）
  reaction: 1
  stance: 1

# --- 狀態與控制（Phase 2B-1，docs/phases/Phase2B計畫.md 3.3–3.4）---
control_dr_rounds: 2                   # 控制遞減：成功施加後，同類別遞減到第 R+2 輪結束（R＝目前輪數）
control_dr_resist_permille: 1500       # 遞減期間，同類別的抵抗判定中守方屬性 ×150%
boss_control_conversion: {stun: slow, frozen: slow}  # Boss 的硬控（control_group: hard）轉換對照

# --- 技能預算（Phase 2B-2，docs/phases/Phase2B計畫.md 4.2；其餘預算數值在 skill_budget.yaml）---
tier_budget: {1: 14, 2: 18, 3: 23, 4: 29, 5: 36}   # 各階級的基礎預算點數（每階約 +27%；2B-3 PM 決定，取代 2B-2 的校準值 14／15／19／24／30）
budget_reference_weapon_damage: 7      # 武器技的預算基準：倍率 100% ＝ 7 點

# --- 效果佇列 ---
max_chain_depth: 3            # 連鎖深度上限

# --- 技能觸發（Phase 2E-1，docs/phases/Phase2E計畫.md 3.3）---
max_trigger_depth: 3          # 技能觸發的連鎖深度上限（動作本身為 0；觸發產生的觸發 +1；超過就不結算）

# --- 姿態（Phase 2E-2，docs/phases/Phase2E計畫.md 4.3）---
stance_ap_cost: 1             # 進入姿態花的 AP；取消姿態（EndStance）免費、只能在自己的回合

# --- 源力（Phase 3C-4a，docs/design/06-技能.md 6.14.4；初值，未經模擬）---
source_max: 3                 # 源力上限
source_min_at_start: 1        # 我方單位每場開場至少 1 點（敵人一律 0）；跨戰鬥保留由 Phase 3-5 處理

# --- 召喚（Phase 3D-4a，docs/design/06-技能.md 6.16 B；初值，未經模擬）---
summon_limit_per_owner: 2     # 同一召喚者同時存在的召喚物上限；超過時最舊的消失
summon_hard_cap: 3            # 硬上限（Phase 3-33b；之後專精可提高上面的上限，但不得超過這個）
summon_role_hp_permille:         # 依定位的召喚物 HP 係數‰（3-33f1；(範本 HP + 成長) × 此值；初值，以 scripts/sim_summons.py 調整）
  melee: 2200                   # 近戰擋路（骷髏、石像、戰狼、殘影）
  totem: 1800                   # 不動型（吸引圖騰、高台圖騰、戰意圖騰、藤蔓、土牆）
  support: 2300                 # 治療、護盾輔助（水精、守護靈）
  assassin: 1700                # 刺殺（影魅）
  ranged: 1000                  # 遠程（各種靈）維持
  scout: 2400                   # 斥候（鷹隼）：仍是最脆的，但被打倒要 ≤ 50%（玩法 PM，3-33f1 驗收 2.0→2.4）
  bomber: 1000                  # 自爆（傀儡）
summon_max_duration: 4        # 召喚物持續輪數上限（技能的 duration 超過時以此為準）
boss_summon_damage_permille: 2000   # Boss（boss 標籤）對召喚物的傷害倍率（‰；×2）
summon_command_ap_cost: 1     # 指揮召喚物（Phase 3-33c，6.29.2）的 AP；切換模式（集火／守護我／跟隨／待命）免費
summon_infuse_ap_cost: 1      # 灌注技能（Phase 3-33d，6.29.3）：施放者花的 AP（法力、冷卻照技能，灌注當下付）
summon_infused_cast_ap_cost: 1  # 召喚物在自己回合開始時施放灌注的技能，佔用牠自己的 AP（取代一次普攻；初值）
# 召喚物成長（Phase 3-33b，6.29.1；初值，未經模擬）：召喚當下依施放者等級 L 與縮放屬性修正 M 快照。
summon_growth:
  hp_per_level: 2
  hp_per_attr_mod: 1
  flat_per_level_permille: 250        # 普攻固定傷害：(此值 × (L-1) + 下行 × M) / 1000，無條件捨去
  flat_per_attr_mod_permille: 250
  bonus_per_level_permille: 10        # 傷害加成‰：與施放者自己的傷害加成合計套全身 +50% 上限
  bonus_per_attr_mod_permille: 10
# 灌注關鍵字（Phase 3-33b）：召喚技能可選一個「施放者持有、且在此表中」的關鍵字，召喚物普攻命中後附加。
summon_infusions:
  ignite: {status: burning, duration: 2, roles: [ranged]}
  frozen: {status: slow, duration: 2, roles: [ranged]}
  marked: {status: marked, duration: 2, roles: [ranged]}
  collision: {knockback: 1, roles: [melee]}
  # Phase 3-33e1 補齊（初值，未經模擬）：6.29.1 的另外 6 個關鍵字
  wet: {surface: water, roles: [ranged]}                                       # 命中時在目標格造水
  charged: {extra_damage: 1d4, extra_element: lightning, roles: [ranged]}      # 普攻帶雷：另加一擊雷電傷害
  prone: {trip: true, roles: [melee]}                                          # 命中時絆倒（對抗判定，每隻每輪 1 次）
  high_ground: {height_permille: 250, roles: [ranged]}                         # 站得比目標高時傷害 +25%
  concealed: {conceal_rounds: 2, roles: [melee]}                               # 召喚時隱蔽 2 回合
  summon: {hp_permille: 200}                                                   # 召喚物自身最大 HP +20%（AI 的最後選擇）
# 召喚物小特性（Phase 3-33f2，6.29.4）：召喚技能分歧進化「加深」多給的一個小特性（初值，未經模擬）。
# 進化時依召喚物定位挑：不動或不攻擊的挑 sturdy、近戰挑 swift、遠程挑 keen（content/skill_evolution.yaml）。
summon_traits:
  sturdy: {name_zh: 堅韌, description_zh: 護甲 +1, armor_bonus: 1, budget_points: 1}
  swift: {name_zh: 迅捷, description_zh: 移動 +1, speed_bonus: 1, budget_points: 1}
  keen: {name_zh: 銳利, description_zh: 暴擊範圍擴大 1（自然 19 起暴擊）, crit_range_delta: 1, budget_points: 1}

# --- 持續區域（Phase 3D-5，docs/design/06-技能.md 6.16 G；初值，未經模擬）---
zone_limit_per_owner: 2       # 同一施放者同時存在的區域上限；超過時最舊的消失

# --- 刻印（Phase 3-23，docs/design/06-技能.md 6.25；初值，未經模擬）---
rune_limit_per_owner: 6       # 同一施放者同時存在的符文格上限；超過時最舊的消失
rune_default_rounds: 3        # inscribe 省略 duration 時，符文持續的環境回合數
rune_max_rounds: 5            # inscribe 的 duration 上限

# --- 常駐類傳說的啟動（Phase 3D-6，docs/design/06-技能.md 6.14.4；初值，以模擬調整）---
legendary_activation_ap: 1    # 啟動修正型與規則改變型傳說（activation: timed | battle）花的 AP（另花技能的源力）
legendary_timed_rounds: 3     # activation: timed 的持續輪數：持有者連同啟動那一回合共 3 個回合，第 4 個回合開始時結束
