# 核心戰鬥規則數值（docs/phases/Phase1計畫.md 3.5、docs/專案計畫.md 第 5 節）。
# 百分比一律為整數千分比（‰）。修改 hit_slope 或 hit_mod_cap 後必須執行
#   uv run python scripts/gen_hit_table.py
# 重新產生 rules/hit_table.yaml（載入時會檢查兩者一致）。

# --- 行動經濟 ---
ap_per_turn: 3                # 每回合 AP
ap_carry_max: 1               # 可保留到下回合的 AP
basic_attack_ap_cost: 1       # 普攻消耗
defend_ap_cost: 1             # 防禦動作消耗

# --- 判定 ---
hit_target: 11                # d20 + 命中修正 + 熟練 + 情境 >= 11
hit_slope: 4                  # 命中修正斜率
hit_mod_cap: 8                # 命中修正上下限 ±8
proficiency: 2                # 熟練加值
height_hit_bonus: 2           # 高打低 +2、低打高 −2
melee_height_limit: 1         # 近戰（射程 <= melee_height_limit_max_range）攻擊的高度差上限
melee_height_limit_max_range: 2   # 射程不超過此值的武器（近戰、長柄）受高度差限制
initiative_attr_base: 10      # 先攻：d20 + (敏捷 − 10) // 2
initiative_attr_divisor: 2

# --- 傷害 ---
basic_attack_attr_multiplier_permille: 300   # 普攻的屬性倍率（0.3）
element_mod_floor_permille: 250              # 元素修正下限（總減傷上限 75%）
min_damage_on_hit: 1                         # 命中時的最低傷害
defend_defense_bonus_permille: 250           # 防禦動作：防禦值 +25%

# --- 移動與環境 ---
move_climb_extra_cost: 1               # 爬升一層額外消耗 1 格移動
max_climb_height: 1                    # 一步最多往上 1 層（2 層以上不可通行）
fall_damage_min_drop: 2                # 往下 2 層以上才會墜落受傷（以「落差 − 1」層計算）
fall_damage_permille_per_level: 100    # 每層 10% 最大 HP
fall_damage_cap_permille: 300          # 單次墜落上限 30%
deadly_terrain_elite_permille: 300     # 精英與 Boss 落入致命地形受 30% 最大 HP
prone_stand_up_move_permille: 500      # 倒地站起消耗一半移動點數（無條件進位）

# --- 技巧動作與互動（Phase 1B）---
maneuver_ap_cost: 1           # 推擊（Shove）、絆倒（Trip）
interact_ap_cost: 1           # 互動（推動物件）
interact_height_limit: 1      # 互動：行動者與物件所在格的高度差上限（Phase 1C）
shove_distance: 1             # 推擊距離
steadfast_push_permille: 500  # steadfast 標籤：推擊距離 ×50%（無條件捨去）
ability_mod_base: 10          # 檢定的屬性修正：(屬性 − 10) // 2
ability_mod_divisor: 2

# --- 反應（Phase 1B）---
reactions_per_round: 1        # 每輪反應次數
default_stamina: 30           # 單位範本未指定耐力時的預設值

# --- 視線與隱蔽（Phase 1B）---
base_sight_range: 24          # 基準視線距離（曼哈頓）；濃霧等天氣以倍率縮短
concealed_ranged_max_distance: 2   # 隱蔽的目標超過此距離無法被攻擊選為目標

# --- 掩護（Phase 1C，docs/phases/Phase1C計畫.md 3.1–3.2）---
half_cover_hit_penalty: 2     # 遠程攻擊半掩護後的目標：命中 −2（與隱蔽的劣勢可同時生效）

# --- 環境回合（Phase 1B）---
burning_object_rounds: 1      # 著火的物件在第幾次環境回合摧毀（1 = 下一次環境回合）

# --- 技能（Phase 2A，docs/phases/Phase2A計畫.md 4.2、4.5）---
spell_attr_multiplier_permille: 500   # 法術技與治療：縮放屬性 × 0.5 加進骰值
skill_slots:                          # 戰鬥時可裝備的技能數量上限（依 kind）
  active: 6
  passive: 2
  reaction: 1
  stance: 1

# --- 狀態與控制（Phase 2B-1，docs/phases/Phase2B計畫.md 3.3–3.4）---
control_dr_rounds: 2                   # 控制遞減：成功施加後，同類別遞減到第 R+2 輪結束（R＝目前輪數）
control_dr_resist_permille: 1500       # 遞減期間，同類別的抵抗判定中守方屬性 ×150%
boss_control_conversion: {stun: slow}  # Boss 的硬控（control_group: hard）轉換對照

# --- 技能預算（Phase 2B-2，docs/phases/Phase2B計畫.md 4.2；其餘預算數值在 skill_budget.yaml）---
tier_budget: {1: 14, 2: 15, 3: 19, 4: 24, 5: 30}   # 各階級的基礎預算點數（T1、T2 由 scripts/calibrate_tier_budget.py 校準；T3–T5 外推，見 Phase2B-2報告）
budget_reference_weapon_damage: 7      # 武器技的預算基準：倍率 100% ＝ 7 點

# --- 效果佇列 ---
max_chain_depth: 3            # 連鎖深度上限
