id: area
name_zh: 範圍
description_zh: 形狀傷害，搭配表面或狀態等附帶效果。
kinds: [active]
enabled: true
shapes: [line, cone, cross, square3, ring, chain]
core: {primitives: [damage], min_share_permille: 500}
secondary:
  primitives: [create_surface, apply_status, push, knock_prone, destroy_object, blow_surface, shockwave, clear_surface, leave_form, contagion, add_stack, consume_stack]   # SK-2b contagion（疾病擴散，只附在燃燒、流血、中毒上；隨機組合器只以獨立串流加入）；3J-4c leave_form（解除形態，手寫專用）；3-54a blow_surface（吹送）：隨機組合器只以獨立串流加入；3-54b shockwave（震波，只能搭配直線）
  max_count: 2   # WC-2（#167）：add_stack／consume_stack＝層數關鍵字的附帶配方（組合器只以獨立串流加入）
composer:   # 隨機組合器的骨架專屬設定（3T-8）
  blow_secondary: true
  shockwave_secondary: true
