id: aura
name_zh: 光環
description_zh: 單一友方（含自己）或範圍內友方獲得治療、護盾、增益、淨化或有益表面；不得有對敵方的效果。
kinds: [active]
enabled: true
shapes: [self, single, allies_in_radius, square3]   # 2D-1：single＝單一友方（含自己），視為半徑 0 的光環
core:
  primitives: [heal, shield, cleanse, apply_status, create_surface, grant_ap, reset_cooldown, cheat_death, redirect_damage, copy_skill, extra_reaction, restore_resource, zone, rule_change, revive, grant_skill]   # 3D-8c grant_skill（暫時獲得技能）； 3D-8b revive（復活）；3D-6 rule_change（規則改變型傳說）；3D-5 zone（跟隨型光環）；3D-1 restore_resource；3C-4a、4b：改寫規則型也是光環的核心
  affects: [allies, self]
  beneficial_only: true   # 核心的狀態與表面必須 beneficial: true（statuses.yaml、surfaces.yaml）
secondary: {max_count: 1}
forbid_affects: [enemies, all]
composer:   # 隨機組合器的骨架專屬設定（3T-8）
  core_count: up_to_two
  single_allies: true
  no_secondary: true
  condition_mode: allies
  legendary: true
