# 詞條白名單 v1（測試目錄；Phase 3G，docs/design/08-裝備.md 8.24）。數值都是初值，未經模擬。
#
# 11 類詞條用 category 區分（schema：src/trpg/content/equipment.py）：
#   stat 數值｜conditional 條件數值｜keyword 技能強化｜attack 普攻附加｜weapon_trait 武器特性強化｜
#   trigger 觸發｜charge 充能｜cost 代價型｜action 動作｜reaction 反應｜rule 改變規則
# G1 結算 stat、conditional、cost 三類；其餘類別先通過 schema 與白名單驗證，結算在 G2、G3。
#
# 共用欄位：
#   name_zh      玩家看到的文字；{n} 換成擲出的數值（value_unit: permille 時顯示為百分比）。其餘數字與名稱
#                不寫死，用 {欄位} 從詞條資料代入（Phase 3-41a；可用的欄位見 src/trpg/content/affix_names.py），
#                例：{max_stacks}、{stack}、{effect.dice}、{up.move}、{skill_ap}、{rule}
#   slots        可出現的物品種類：weapon 武、offhand 副、head 頭、body 身、hands 手、feet 腳、neck 項、ring 戒
#   weapons      武器類物品限定的武器 id（其他種類不受影響）
#   weapon_class 武器類物品限定的武器大類（其他種類不受影響）
#   item_tags    依物品種類限定標籤（例：{offhand: [shield]}＝副手限盾）
#   legendary_only  只能出現在傳說物品上
#   value        數值 N 的初值範圍 {min, max}；value_unit：flat 整數、permille 千分比（150＝15%）
# 遞減疊加：同 id 的數值部分依大到小 100／50／25／0%（rules/equipment.yaml）；非數值類同 id 只生效 1 條。
affixes:
  # --- 1 數值 ---
  # 六種屬性詞條（Phase 3H-1，玩法決定 #45）：力量、敏捷、體質、智力、感知、意志，部位與範圍相同。
  - id: affix_attr_str
    category: stat
    name_zh: 力量 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: str
    value: {min: 1, max: 4}
  - id: affix_attr_dex
    category: stat
    name_zh: 敏捷 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: dex
    value: {min: 1, max: 4}
  - id: affix_attr_con
    category: stat
    name_zh: 體質 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: con
    value: {min: 1, max: 4}
  - id: affix_attr_int
    category: stat
    name_zh: 智力 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: int
    value: {min: 1, max: 4}
  - id: affix_attr_wis
    category: stat
    name_zh: 感知 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: wis
    value: {min: 1, max: 4}
  - id: affix_attr_wil
    category: stat
    name_zh: 意志 +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: attribute
    attribute: wil
    value: {min: 1, max: 4}
  - id: affix_max_hp
    category: stat
    name_zh: 最大 HP +{n}
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    stat: max_hp
    value: {min: 4, max: 16}
  - id: affix_resist_fire
    category: stat
    name_zh: 火焰抗性 +{n}
    slots: [body, head, hands, feet, neck, ring]
    stat: element_resist
    element: fire
    value: {min: 50, max: 150}
    value_unit: permille

  # --- 2 條件數值 ---
  - id: affix_cond_height_hit
    category: conditional
    name_zh: 站在高處時命中 +{n}
    slots: [weapon, head, ring]
    effect: hit
    condition: {type: height_advantage}
    value: {min: 1, max: 1}
  - id: affix_cond_still_defense
    category: conditional
    name_zh: 本回合沒有移動：防禦 +{n}
    slots: [body, head, hands, feet]
    effect: defense
    condition: {type: moved_this_turn}
    negate: true
    value: {min: 100, max: 200}
    value_unit: permille
  - id: affix_trait_longgun_still_crit
    category: conditional
    name_zh: 火槍站定（本回合沒有移動）時傷害 +{n}
    slots: [weapon]
    weapons: [longgun]
    effect: damage
    condition: {type: moved_this_turn}
    negate: true
    value: {min: 100, max: 100}
    value_unit: permille
  - id: affix_cond_low_hp_damage
    category: conditional
    name_zh: HP 低於 50% 時傷害 +{n}
    slots: [weapon, neck, ring]
    effect: damage
    condition: {type: self_hp_below, permille: 500}
    value: {min: 100, max: 150}
    value_unit: permille

  # --- 3 技能強化（結算在 G2；keyword 的 id 暫定，以 3-24b1 的關鍵字推導為準）---
  - id: affix_kw_burn_duration
    category: keyword
    name_zh: 你施加的{status} +{amount} 回合
    slots: [weapon, offhand, neck, ring]
    keyword: ignite
    direction: create
    include_attack: true
    change: status_duration
    status: burning
    amount: 1
  - id: affix_kw_prone_damage
    category: keyword
    name_zh: 利用倒地的技能傷害 +{n}
    slots: [weapon, offhand, neck, ring]
    keyword: prone
    direction: exploit
    change: damage_permille
    value: {min: 60, max: 150}
    value_unit: permille
  - id: affix_kw_shock_area
    category: keyword
    name_zh: 雷電技能範圍 +{amount}
    slots: [weapon, offhand, neck]
    keyword: charged
    direction: create
    change: area_delta
    amount: 1

  # --- 4 普攻附加（結算在 G2）---
  - id: affix_attack_lightning
    category: attack
    name_zh: 普攻帶雷電
    slots: [weapon]
    add_element: lightning
  - id: affix_attack_mark
    category: attack
    name_zh: 普攻命中時使目標「{on_hit_status}」{status_duration} 回合
    slots: [weapon]
    on_hit_status: marked
    status_duration: 1
  # --- 4 普攻附加：符文（Phase 3-31，06 6.25 普攻與符文；數值為初值，未經模擬）---
  - id: affix_attack_rune_read
    category: attack
    name_zh: 你的普攻打到站在你符文上的敵人時，傷害 +{n}（每回合 1 次）
    slots: [weapon, hands, ring]
    rune: read
    value: {min: 100, max: 150}
    value_unit: permille
  - id: affix_attack_rune_detonate
    category: attack
    name_zh: 普攻命中時，引爆目標格上你的符文（每回合 1 次）
    slots: [weapon, hands]
    rune: detonate
    dice: 1d6
  - id: affix_attack_rune_inscribe
    category: attack
    name_zh: 普攻命中時，在目標格刻下{rune}（每回合 1 次，持續 {rune_rounds} 輪）
    slots: [weapon, hands]
    rune: inscribe
    rune_element: lightning
    rune_rounds: 2
  # --- 4 普攻附加：普攻流（Phase 3-32a，08 8.25；數值為初值，未經模擬）---
  - id: affix_attack_combo
    category: attack
    name_zh: 每第 {n} 次普攻命中：多攻擊一次（{strike_permille} 傷害；每回合 1 次）
    slots: [weapon, hands]
    strike: combo
    strike_permille: 400
    value: {min: 3, max: 3}  # 3-32d：連擊只出「每第 3 次」（原 2～3）
  - id: affix_attack_cleave
    category: attack
    name_zh: 普攻命中後，對目標相鄰的另一個敵人造成 {strike_permille} 傷害（每回合 1 次）
    slots: [weapon]
    strike: cleave
    strike_permille: 300  # 3-32d：400 → 300

  # --- 5 武器特性強化（結算在 G2；火槍由 3-24a2 加入）---
  - id: affix_trait_hammer_knockback
    category: weapon_trait
    name_zh: 錘的震退 +{delta} 格
    slots: [weapon]
    weapons: [hammer]
    param: knockback
    delta: 1
  - id: affix_trait_longgun_pointblank
    category: weapon_trait
    name_zh: 火槍的貼臉懲罰減半
    slots: [weapon]
    weapons: [longgun]
    param: range_mod.penalty
    scale_permille: 500
  - id: affix_trait_bow_lob_cover
    category: weapon_trait
    name_zh: 弓的拋射無視半掩護
    slots: [weapon]
    weapons: [bow]
    param: ignore_cover
    delta: 1
  - id: affix_trait_bow_high_range
    category: weapon_trait
    name_zh: 弓站在高處時射程 +{delta}
    slots: [weapon]
    weapons: [bow]
    param: high_range
    delta: 1
  - id: affix_trait_dagger_backstab_die
    category: weapon_trait
    name_zh: 匕首背刺的普攻傷害骰 +{delta} 顆
    slots: [weapon]
    weapons: [dagger]
    param: backstab_dice
    delta: 1
  - id: affix_trait_axe_sunder
    category: weapon_trait
    name_zh: 斧的破甲持續 +{delta} 回合
    slots: [weapon]
    weapons: [axe]
    param: armor_break.rounds
    delta: 1

  # --- 6 觸發（結算在 G3）---
  - id: affix_trig_every3_prone
    category: trigger
    name_zh: 每第 {every} 次命中：目標倒地
    slots: [weapon, hands]
    trigger: every_n_hits
    n: 3
    effect_target: target
    effects: [{type: knock_prone}]
  - id: affix_trig_kill_ap
    category: trigger
    name_zh: 擊殺時：回 {effect.amount} AP（每回合 1 次）
    slots: [weapon, neck, ring]
    trigger: on_kill
    effect_target: self
    effects: [{type: grant_ap, amount: 1}]
    limit: per_turn
  - id: affix_trig_thorns_burn
    category: trigger
    name_zh: 受到近戰傷害時：攻擊者「{effect.status}」{effect.duration} 回合（每輪 1 次）
    slots: [body, offhand]
    trigger: on_damaged
    melee_only: true
    effect_target: attacker
    effects: [{type: apply_status, status: burning, duration: 1}]
    limit: per_round

  # --- 7 充能（Phase 3G-G3a；層數的定義在 stacks.yaml）---
  - id: affix_charge_static
    category: charge
    name_zh: "{gain}累積 1 層{stack}（上限 {max_stacks}）；花 {cost_stacks} 層＋{cost_ap} AP：對目標造成 {effect.dice} {effect.element}傷害"
    slots: [weapon, body]
    stack: static_charge
    max_stacks: 3
    gain_trigger: on_hit
    cost_stacks: 3
    cost_ap: 1
    effects: [{type: damage, dice: 3d6, element: lightning}]
  - id: affix_charge_fury
    category: charge
    name_zh: "{gain}累積 1 層{stack}（上限 {max_stacks}）；花 {cost_stacks} 層：獲得「{effect.status}」{effect.duration} 回合"
    slots: [body, weapon]
    stack: fury
    max_stacks: 4
    gain_trigger: on_damaged
    cost_stacks: 4
    cost_ap: 0
    effect_target: self
    effects: [{type: apply_status, status: empowered, duration: 1}]

  # --- 8 代價型（全身最多 2 條；rules/equipment.yaml 的 caps.cost_affixes）---
  - id: affix_cost_glass
    category: cost
    name_zh: 傷害 +{up.damage_permille}；受到的傷害 +{down.damage_taken_permille}
    slots: [weapon, neck, ring]
    upside: [{stat: damage_permille, amount: 200}]
    downside: [{stat: damage_taken_permille, amount: 100}]
  - id: affix_cost_blood
    category: cost
    name_zh: 回合開始時失去 {down.turn_start_hp_loss} HP（不會致死）；技能冷卻 −{up.cooldown_delta}
    slots: [neck, ring, body]
    upside: [{stat: cooldown_delta, amount: -1}]
    downside: [{stat: turn_start_hp_loss, amount: 2}]
  - id: affix_cost_swift
    category: cost
    name_zh: 移動 +{up.move}；防禦 −{down.defense_permille}
    slots: [feet, body]
    upside: [{stat: move, amount: 2}]
    downside: [{stat: defense_permille, amount: -150}]

  # --- 9 動作（結算在 G3；技能由 G3 加入 content/skills/）---
  - id: affix_act_grapple
    category: action
    name_zh: 解鎖「{skill}」：{skill_ap} AP、冷卻 {skill_cooldown}，把 {skill_range} 格內的目標拉近 {skill_effect.distance} 格
    slots: [weapon, offhand, hands]
    skill: skill_gear_grapple
  - id: affix_act_smoke
    category: action
    name_zh: 解鎖「{skill}」：{skill_ap} AP、冷卻 {skill_cooldown}，{skill_range} 格內一點產生 3×3 的煙霧（{skill_effect.duration} 回合）
    slots: [offhand, hands, neck]
    skill: skill_gear_smoke_bomb
  - id: affix_act_shield_wall
    category: action
    name_zh: 解鎖「{skill}」：{skill_ap} AP、冷卻 {skill_cooldown}，在 {skill_range} 格內產生暫時障礙（{skill_effect.duration} 回合）
    slots: [offhand]
    item_tags: {offhand: [shield]}
    skill: skill_gear_shield_wall

  # --- 10 反應（結算在 G3）---
  - id: affix_react_ranged_block
    category: reaction
    name_zh: 被遠程攻擊時也可以格擋
    slots: [offhand, body]
    item_tags: {offhand: [shield]}
    mode: extend_trigger
    reaction: block
    event: targeted_by_attack
  - id: affix_react_guard_ally
    category: reaction
    name_zh: "{range} 格內的隊友被攻擊時：替他承受（每輪 1 次）"
    slots: [body, offhand]
    mode: grant
    reaction: redirect_damage
    range: 2
    limit: per_round
  - id: affix_react_double_overwatch
    category: reaction
    name_zh: 監視射擊每輪可以多觸發 {uses} 次
    slots: [weapon, head]
    weapon_class: ranged
    mode: extra_uses
    reaction: overwatch_shot
    uses: 1

  # --- 11 改變規則（傳說；結算在 G3）---
  - id: affix_rule_fire_mends
    category: rule
    name_zh: "{rule}"
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    legendary_only: true
    rule: fire_mends_allies
  - id: affix_rule_move_any_object
    category: rule
    name_zh: "{rule}"
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    legendary_only: true
    rule: move_any_object
  - id: affix_rule_bleeding_wake
    category: rule
    name_zh: "{rule}"
    slots: [weapon, offhand, head, body, hands, feet, neck, ring]
    legendary_only: true
    rule: bleeding_wake

  # --- 召喚專用詞條（Phase 3-33f2，docs/design/06-技能.md 6.29.6；數值為初值，未經模擬）---
  # 「召喚物數值」（HP +%、攻擊 +1 骰）已有：修正規則 summon_hp_permille／summon_attack_dice（3-24b1，#35），不是裝備詞條。
  # 技能強化類（keyword: summon）：遞減疊加與硬上限照 8.21.5.3；冷卻最低 1；獻祭傷害計入全身 +50% 上限。
  - id: affix_summon_cooldown
    category: keyword
    name_zh: 你的召喚技能冷卻 −{amount}（最低 1）
    slots: [offhand, neck]
    keyword: summon
    direction: create
    change: cooldown_delta
    amount: -1
  - id: affix_summon_duration
    category: keyword
    name_zh: 你的召喚物持續 +{amount} 輪
    slots: [offhand, neck]
    item_tags: {offhand: [orb]}   # 法器珠（副手）或項鍊
    keyword: summon
    direction: create
    change: duration_delta
    amount: 1
  - id: affix_summon_sacrifice
    category: keyword
    name_zh: 你獻祭召喚物的傷害與治療 +{n}
    slots: [ring, neck]
    keyword: summon
    direction: exploit
    change: sacrifice_permille
    value: {min: 200, max: 200}
    value_unit: permille
  # 觸發類（新觸發「召喚物倒下時」，skill_triggers.yaml 的 on_summon_downed）：以倒下的召喚物為中心結算。
  - id: affix_trig_summon_blast
    category: trigger
    name_zh: 召喚物倒下時：原地爆炸，對 {effect.radius} 格內的敵人造成 {effect.dice} {effect.element}傷害（每回合 1 次）
    slots: [ring, neck]
    trigger: on_summon_downed
    effect_target: target
    effects: [{type: sacrifice_summon, dice: 1d8, radius: 1, element: fire}]
    limit: per_turn
  - id: affix_trig_summon_mend
    category: trigger
    name_zh: 召喚物倒下時：湧出治療的光，治療 {effect.radius} 格內的友方 {effect.dice}（每回合 1 次）
    slots: [ring, neck]
    trigger: on_summon_downed
    effect_target: target
    effects: [{type: sacrifice_summon, dice: 1d8, radius: 1}]
    limit: per_turn
  # 普攻附加類：召喚物繼承你 1 條普攻附加詞條（元素、命中附帶狀態、連擊、分裂；符文不繼承）。
  - id: affix_summon_inherit_attack
    category: attack
    name_zh: 你的召喚物繼承你 1 條普攻附加詞條
    slots: [weapon, offhand]
    summon_inherit: true
