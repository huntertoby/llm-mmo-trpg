# 格子物件（docs/專案計畫.md 5.1；docs/phases/Phase1計畫.md 6.1-1）。
# 欄位：id、name_zh、glyph（戰場網格顯示用的單一 ASCII 字元）、max_hp（breakable 必填）、
#       tags（引擎認得的標籤，見 src/trpg/content/environment.py 的 OBJECT_TAGS）、
#       explosion（explosive 必填：radius 切比雪夫半徑、dice、flat、element）、
#       spill（選填，Phase 1C：被傷害打破時——不是被火焰引爆——在該格與四方向相鄰格產生 surface）。
# half_cover（Phase 1C）：遠程攻擊時，目標四方向相鄰、位於攻擊者那一側的 half_cover 物件提供
#       半掩護（命中 −2，見 rules/core.yaml 的 half_cover_hit_penalty）；物件本身視為 1 層高。
# 新物件只要組合既有標籤，就自動支援所有互動規則（interactions.yaml），不需要寫新程式。
# Phase 3C-5a（docs/design/06-技能.md 6.15）：
#   penetrable：可被穿透（木製物件；3C-5b 的 pierce 使用）。
#   topplable：可推倒——被推（互動的推、技能的推擊、風）時不移動，往推的方向倒下，壓住
#       rules/core.yaml 的 topple_length 格；原物件移除，最後一格產生倒塌物（rubble）。
objects:
  - id: wooden_bridge
    name_zh: 木橋
    glyph: "="
    max_hp: 12
    tags: [breakable, flammable, over_chasm]
  - id: oil_barrel
    name_zh: 油桶
    glyph: "&"
    max_hp: 8
    tags: [breakable, flammable, explosive, pushable, half_cover]   # 躲在油桶後面很危險（刻意的）
    explosion:           # 火焰觸及即爆炸
      radius: 1          # 3×3
      dice: 2d6
      flat: 0
      element: fire
    spill:               # 非火焰傷害打破、或被投擲摔破（3D-3）時不爆炸，改為漏油（之後可被點燃）
      surface: oil
  - id: thin_ice
    name_zh: 薄冰
    glyph: ":"
    max_hp: 6
    tags: [breakable, over_chasm]   # 架在冰窟上：可以走，打破後格上的單位落入冰窟（比照木橋）
  - id: stone_pillar
    name_zh: 石柱
    glyph: "|"
    max_hp: 60
    tags: [blocks_sight, blocks_move, breakable, topplable]
  - id: grass
    name_zh: 草叢
    glyph: ";"
    tags: [conceal, flammable]
  - id: crate
    name_zh: 木箱
    glyph: "["
    max_hp: 15
    tags: [blocks_move, breakable, pushable, half_cover, flammable, penetrable]
  - id: earth_wall
    name_zh: 土牆
    glyph: "^"
    max_hp: 25
    tags: [blocks_move, blocks_sight, breakable]
  - id: low_wall
    name_zh: 矮牆
    glyph: "_"
    max_hp: 40
    tags: [blocks_move, breakable, half_cover]
  - id: fallen_log
    name_zh: 倒木
    glyph: "-"
    max_hp: 20
    tags: [blocks_move, breakable, half_cover, flammable, penetrable]
  - id: dead_tree
    name_zh: 枯樹
    glyph: "Y"
    max_hp: 20
    tags: [blocks_move, blocks_sight, breakable, flammable, topplable]
  - id: rubble
    name_zh: 倒塌物
    glyph: "m"
    max_hp: 15
    tags: [blocks_move, half_cover, breakable]   # 推倒後產生（3C-5a）；3D-3 起可以被打掉（HP 同木箱），避免永久堵死窄路
  - id: ice_wall
    name_zh: 冰牆
    glyph: "#"
    max_hp: 20
    tags: [blocks_move, blocks_sight, breakable, meltable]   # 3-11：暫時障礙（冰牆術 3 輪後融化）；火焰觸及時融化
  - id: thorn_wall
    name_zh: 荊棘叢
    glyph: "x"
    max_hp: 10
    tags: [blocks_move, breakable, flammable]   # 3-11：暫時障礙（荊棘牆術 2 輪後枯萎）；不擋視線、可燃
