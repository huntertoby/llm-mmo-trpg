# 技能的效果原語（docs/phases/Phase2A計畫.md 3.4）。Phase 2A 支援 12 個 ID（11 種）。
#
# category：numeric 數值型／structural 結構型／rule_rewrite 改寫規則型（2A 沒有）
# min_rarity：使用此原語的最低稀有度（2B-2 起由驗證器檢查：數值型 common、結構型 rare）
# budget_basis／base_points：預算點數的算法（docs/phases/Phase2B計畫.md 4.2）
#   fixed 固定 base_points／per_distance base_points × 距離／dice_average 骰子平均值／
#   damage 法術為骰子平均值、武器為倍率 × core.yaml 的 budget_reference_weapon_damage／
#   status、surface 為該狀態或表面的 budget_points × 持續 ÷ 預設持續
# harmful：有害。省略 affects 時的預設：地形類 tiles、施放者專屬 self、有害 enemies、有益 allies
# acts_on：unit（對單位）／tile（對格子；affects 為單位類別時作用在這些單位腳下的格子）／caster
# allowed_shapes：只能搭配這些形狀
# forbid_affects：不可搭配的 affects（2D-1：cleanse 不能對敵方使用；驅散不在本階段）
# 組合規則（Phase 4-L5b；SkillDef 驗證器與 LLM 提議模型共用的唯一來源）：
#   position: first／last（必須是技能的第一個／最後一個效果）、sole_effect（必須是唯一的效果）、
#   others_affect: self（其他效果必須明寫 affects: self）、max_per_skill（一個技能最多幾個）、
#   active_only（只能用在主動技能）
# params：可填的參數（type：dice／int／status／surface／object／element）
#   int 參數的 min／max 是唯一的範圍來源（Phase 3E-2f）；allowed_skeletons：只能用在這些骨架
# status：這個原語固定施加的狀態 ID（Phase 3E-2f；引擎的常數 CHEAT_DEATH_STATUS 等從這裡讀）
# 不是由原語施加、由技能機制使用的狀態（Phase 3E-2f）：charging＝複合技延遲段（followup.when: delayed）的蓄力。
mechanic_statuses:
  charging: charging

primitives:
  - id: damage
    name_zh: 傷害
    llm_hint: "對目標造成傷害；法術用骰子加屬性加成，武器用武器傷害乘上倍率。"
    description_zh: 法術技：骰值＋縮放屬性×0.5；武器技：（武器骰＋固定值＋縮放屬性×0.3）×倍率。同時傷害影響格中的可破壞物件。
    player_description: "對目標造成傷害；法術技用骰值加屬性加成，武器技用武器骰乘上倍率。"
    category: numeric
    harmful: true
    budget_basis: damage
    params:
      dice: {llm_hint: "法術傷害的骰子（幾顆幾面）。", type: dice, required: true, required_when: {category: spell}, description_zh: 法術技必填；武器技不可填（用武器骰）}
      multiplier_permille: {llm_hint: "武器傷害的倍率。", type: int, min: 1, max: 10000, description_zh: 武器技的倍率（‰），預設 1000}
      element: {llm_hint: "傷害的元素。", type: element, description_zh: 法術技必填；武器技省略時繼承武器元素}
      explode: {llm_hint: "擲到骰子最大值時再追加擲一次。", type: bool, true_only: true, description_zh: "爆骰（Phase 3D-7b）：擲到最大值再加擲一次，每顆骰最多再擲 core.explode_max 次；只能填 true"}
      scaling: {llm_hint: "傷害會隨某種情況逐步增加，並有上限。", type: scaling, description_zh: "依情況縮放（Phase 3D-7b）：by／per_step_permille／cap_permille 三個欄位；每一步傷害 +n‰（無條件捨去）、cap_permille 必填且不超過 core.scale_cap_max_permille；by 可為 missing_hp_10pct（施放者每少 10% 最大 HP）、distance（與目標每距 1 格）、enemies_adjacent_target（目標相鄰的敵方數）、enemies_adjacent_self（施放者相鄰的敵方數）"}
      lifesteal_permille: {llm_hint: "施放者依造成的傷害比例回復生命。", type: int, min: 1, max: 500, description_zh: "吸血（Phase 3D-8a）：施放者回復這個效果對敵人實際造成的傷害（扣掉護盾吸收，含溢出）× n‰（無條件捨去，不超過最大 HP）；用 heal 事件、原因 lifesteal；只有技能自己的傷害效果可以用；預算：傷害點數 × (1 ＋ n‰ × lifesteal_value_permille)"}
      on_kill: {llm_hint: "這個傷害讓敵人倒下時，施放者額外獲得的效果。", type: effects, description_zh: "技能內的擊殺時效果（Phase 3D-8b）：這個傷害效果讓敵人倒下時才結算的 1–2 個效果，對象一律是施放者。可用類型：refund_ap（返還 amount 點 AP，1–2，用專用效果、不受改寫規則限制）、refund_cooldown（本技能冷卻歸零，技能必須有 cost.cooldown）、heal、shield、apply_status（一般原語）。同一個傷害效果讓一個以上的敵人倒下只結算一次；施放者自己在結算中倒下則不結算。只有主動技能自己的傷害效果可以用。預算：on_kill 各效果的點數 × on_kill_expected_permille（預估擊殺率）"}
      form_bonus_permille: {llm_hint: "施放者在形態中時，這個效果的數值多出的比例。", type: int, min: 1, max: 1000, description_zh: "在形態中的加成（Phase 3J-4b）：施放者在形態中時，這個效果的傷害（或治療）整體 ×（1000 ＋ n）‰（骰值、屬性加成與其他倍率一起乘，屬性加成只算一次；不在形態中不變）；只有技能自己的效果可以用；預算：點數 × (1 ＋ n‰ × 在形態中條件倍率)"}
      spread: {llm_hint: "風元素傷害把範圍內的火、冰、毒往風向擴大的格數（1 或 2；省略為 1）。", type: int, show_when: {element: wind}, min: 1, max: 2, description_zh: "元素擴散格數（Phase 3-54b）：只有風元素（element: wind）的技能自己的傷害效果可以填；風吹到的火、冰、毒表面與火、冰、毒、雷區域往風向擴大 1 或 2 格（省略＝core.yaml 的 wind.spread_distance，預設 1）；預算：傷害點數 × wind_spread_permille（2 格較貴）"}
      split_heal: {llm_hint: "對敵人造成傷害的同時，用同樣的數值治療友方。", type: bool, true_only: true, allowed_skeletons: [aura, area], description_zh: "聖光雙效（Phase 3D-8a）：必須搭配 affects: all、主動法術技、aura 或 area 骨架，不可與 lifesteal、explode、scaling 並用。敵方依一般命中判定受到傷害、友方（含自己）不擲命中而治療同樣的骰值（骰一次，治療量 ＝ 骰值 ＋ 縮放屬性 × 0.5，受治療倍率影響）；預算傷害與治療兩邊都計；只能填 true"}
  - id: heal
    name_zh: 治療
    llm_hint: "回復目標的生命。"
    description_zh: 治療量＝骰值＋縮放屬性×0.5，不超過最大 HP。
    player_description: "回復目標的生命，不會超過最大生命。"
    category: numeric
    harmful: false
    budget_basis: dice_average
    params:
      dice: {llm_hint: "治療量的骰子（幾顆幾面）。", type: dice, required: true}
      form_bonus_permille: {llm_hint: "施放者在形態中時，這個效果的數值多出的比例。", type: int, min: 1, max: 1000, description_zh: "在形態中的加成（Phase 3J-4b）：施放者在形態中時，這個效果的傷害（或治療）整體 ×（1000 ＋ n）‰（骰值、屬性加成與其他倍率一起乘，屬性加成只算一次；不在形態中不變）；只有技能自己的效果可以用；預算：點數 × (1 ＋ n‰ × 在形態中條件倍率)"}
  - id: shield
    name_zh: 護盾
    llm_hint: "替目標加上一層護盾，之後的傷害先由護盾吸收。"
    description_zh: 目標獲得吸收量＝骰值＋縮放屬性×0.5（與治療同一公式）的護盾（狀態 shielded，持續 duration 回合，2–3，省略＝2）；骰值傷害先扣護盾。已有護盾時吸收量取較大值、剩餘回合取較長者。預算：骰子平均 × shield_duration_permille（持續 3 回合較貴）。
    player_description: "替目標加上一層護盾，傷害會先扣護盾，預設持續 2 回合，可延長到 3 回合。"
    category: numeric
    harmful: false
    budget_basis: dice_average
    params:
      dice: {llm_hint: "護盾吸收量的骰子（幾顆幾面）。", type: dice, required: true}
      duration: {llm_hint: "護盾持續的回合數（2–3；省略＝2）。", type: int, min: 2, max: 3, description_zh: 護盾持續回合}
  - id: cleanse
    name_zh: 淨化
    llm_hint: "移除目標身上所有負面狀態（減益）；增益與中性狀態保留。"
    description_zh: 移除影響單位身上所有減益（polarity 為 debuff）狀態，依狀態 ID 排序逐一移除；增益與中性狀態（隱蔽、姿態、免死、靈魂連結、蓄力等）保留。不能對敵方使用。
    player_description: "移除目標身上所有負面狀態，不能對敵人使用。"
    category: numeric
    harmful: false
    budget_basis: fixed
    base_points: 3
    forbid_affects: [enemies, all]
  - id: push
    name_zh: 推擊
    llm_hint: "把目標推離自己，被擋住就停下並受到撞擊傷害。"
    description_zh: 以施放者（中心格型為中心）為原點往外推；被擋住時停在擋住前的格子，steadfast 減半。
    player_description: "把目標推離自己；被擋住就停下，撞到東西會受傷。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_distance
    base_points: 2
    params:
      distance: {llm_hint: "推開的格數。", type: int, required: true, min: 1, max: 2}
      collision_dice: {llm_hint: "撞擊傷害的骰子。", type: dice, description_zh: 撞擊傷害骰（省略時用核心規則 collision_damage_dice，初值 1d6）；預算每顆骰加 collision_die_points}
  - id: pull
    name_zh: 拉扯
    llm_hint: "把目標往自己的方向拉近，被擋住就停下並受到撞擊傷害。"
    description_zh: 往施放者（中心格型為中心）的方向拉，規則同推擊。
    player_description: "把目標往自己的方向拉近。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_distance
    base_points: 2
    params:
      distance: {llm_hint: "拉近的格數。", type: int, required: true, min: 1, max: 2}
      collision_dice: {llm_hint: "撞擊傷害的骰子。", type: dice, description_zh: 撞擊傷害骰（省略時用核心規則 collision_damage_dice，初值 1d6）；預算每顆骰加 collision_die_points}
  - id: knock_prone
    name_zh: 擊倒
    llm_hint: "把目標打倒在地，倒地的單位需要花行動站起來。"
    description_zh: 對抗判定（技能的縮放屬性 vs 目標同屬性），成功才倒地。
    player_description: "屬性對抗成功時，讓目標倒地。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 3
  - id: shockwave
    name_zh: 震波
    llm_hint: "讓直線上的單位直接倒地；會飛的單位不受影響。"
    description_zh: 影響格（只能是直線形狀）上的對象單位直接倒地：不擲對抗，已經倒地的略過；帶 flying 標籤（會飛）的單位不受影響。對象可選敵方、友方或雙方（敵方需命中，友方不擲命中）。只有大地元素的技能能用（互斥規則 terrain_needs_earth，3-54d）。只能用在主動技能。預算：固定 base_points（形狀倍率另算；初值，未經模擬）。
    player_description: "讓直線範圍內的單位直接倒地，不用對抗；會飛的單位不受影響。"
    category: structural
    harmful: true
    min_rarity: rare
    active_only: true
    allowed_shapes: [line]
    budget_basis: fixed
    base_points: 4
  - id: teleport
    name_zh: 傳送
    llm_hint: "讓施放者瞬間移動到選定的位置。"
    description_zh: 施放者移動到目標格（必須可站立且沒有單位）；不觸發藉機攻擊。
    player_description: "自己瞬間移動到指定的空格，不會引來藉機攻擊。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    acts_on: caster
    allowed_shapes: [ground_tile]
  # --- Phase 3D-2：自身位移（docs/design/06-技能.md 6.16 A；點數為初值，未經模擬）---
  - id: dash
    name_zh: 衝鋒
    llm_hint: "讓施放者沿選定的方向快速衝刺。"
    description_zh: 施放者沿最短可走路徑（步行規則；不經過任何單位）移到目標單位的相鄰格（路徑成本不超過技能射程；不消耗移動點數），再結算同技能的其餘效果。一律最先結算，必須是技能的第一個效果。途中會觸發藉機攻擊與陷阱；被擋下（定身、倒地、倒下）或停下時目標不在相鄰格，其餘效果不結算。算「本回合移動過」，也觸發 on_move 被動。只能搭配形狀 single（目標單位）。
    player_description: "衝向目標並停在他旁邊，再對他施展技能的其他效果。"
    category: structural
    harmful: true
    min_rarity: rare
    position: first
    active_only: true
    budget_basis: fixed
    base_points: 3
    acts_on: caster
    allowed_shapes: [single]
  # --- Phase 3J-4c：解除形態（06 6.30 解形爆發）---
  - id: leave_form
    name_zh: 解除形態
    llm_hint: "先解除自己目前的形態，再結算技能的其他效果。"
    description_zh: 施放者先解除目前的形態（離開原因 released；照常換回手上的武器與裝備、最大 HP 減回、該形態冷卻 forms.yaml 的 cooldown 回合、取消龍的蓄力），其餘效果再照順序結算。必須是主動技能的第一個效果、一個技能最多一個、affects 一律為 self；施放者不在形態中不能施放（skill_problem）。不另計點數（base_points 0），但算代價：預算用 skill_budget.yaml 的 allowance.leave_form_permille 折抵（照 6.5 代價折抵，和其他代價加總後套整體上限）。
    player_description: "施放時先解除自己目前的形態（照常進入冷卻），再造成技能的其餘效果；不在形態中不能使用。"
    category: structural
    harmful: false
    min_rarity: rare
    acts_on: caster
    position: first
    max_per_skill: 1
    active_only: true
    budget_basis: fixed
    base_points: 0
  - id: charge_through
    name_zh: 直線衝撞
    llm_hint: "施放者向前衝過路徑，路上的敵人受到傷害與附帶效果。"
    description_zh: 選一個目標格（形狀 ground_tile；與施放者同一列或同一行、距離不超過形狀射程；可以是站著敵人的格子、牆前或地圖邊的任何格）；施放者沿直線衝過去，被牆、不可走地形或 blocks_move 物件擋住時停在擋住前最後一個能站的空格（第一格就過不去才不能施放）。目標格上的敵人若背後走不過去（牆、地圖邊、擋路物件），命中後另受一次撞擊傷害（collided，接上撞擊關鍵字與 target_collided）。沿途經過的每個敵人依路徑順序各擲一次命中；命中受 dice 物理傷害（不加屬性，暴擊與格擋照常），再依 on_hit 擊倒（對抗判定）或推到路徑旁一格（push_aside：先左後右選可站的一側，兩側都不行就往左撞，照常觸發撞擊）。隊友讓路、敵人不阻擋，一律被穿過。不觸發藉機攻擊；沿途與終點的陷阱、表面照常結算，被定身或倒地就停下。算「本回合移動過」，也觸發 on_move 被動。定身或倒地時不能施放。必須是技能的第一個效果，其餘效果只能作用在施放者自己。
    player_description: "沿一直線衝過去，撞開並傷害路上的敵人。"
    category: structural
    harmful: true
    min_rarity: rare
    position: first
    others_affect: self
    active_only: true
    budget_basis: charge_through
    acts_on: caster
    allowed_shapes: [ground_tile]
    params:
      dice: {llm_hint: "衝撞傷害的骰子。", type: dice, required: true, description_zh: 每個被撞到的敵人受到的物理傷害}
      on_hit: {llm_hint: "被撞到的敵人除了傷害之外，是被擊倒還是被推到路旁。", type: on_hit, required: true, description_zh: 命中後的額外效果（knock_prone 擊倒、push_aside 推到路徑旁）}
  # --- Phase 3D-8d：朝向與背刺（docs/design/06-技能.md 6.21；點數為初值，未經模擬）---
  - id: shadowstep
    name_zh: 瞬步
    llm_hint: "施放者瞬間閃到目標身邊。"
    description_zh: 以射程內看得到的一個敵方單位為目標，施放者瞬間出現在他相鄰的格子（不經過中間的格子、不觸發藉機攻擊，也不觸發「敵人走進相鄰格」與監視射擊；不墜落），落地後面向目標。landing：choose 一般瞬步（形狀 unit_then_tile，兩段選取：敵人 → 他相鄰的空格，玩家自選）；behind 瞬步背刺類（形狀 single，固定落在目標的背後格；被占住或不可站立時改為目標相鄰的其他空格——先左右兩側、再正面，同距離依上、右、下、左的順序；都沒有就不能施放）。落點須可站立、沒有單位、不是致命地形，與目標的高度差不超過近戰上限。落點的陷阱與表面照常結算。之後的效果以落點結算，所以接在後面的近戰傷害會吃到背刺加成。不算「本回合移動過」，不觸發 on_move 被動。必須是技能的第一個效果；定身或倒地時不能施放。
    player_description: "瞬間出現在視線內一名敵人的身旁。"
    category: structural
    harmful: true
    min_rarity: rare
    position: first
    active_only: true
    budget_basis: fixed
    base_points: 4
    acts_on: caster
    allowed_shapes: [single, unit_then_tile]
    params:
      landing: {llm_hint: "落點是由玩家選目標旁的空格，還是固定落在目標背後。", type: landing, required: true, description_zh: choose 玩家自選目標相鄰的空格；behind 固定落在目標的背後格}
  - id: leap
    name_zh: 跳躍
    llm_hint: "施放者跳躍到選定的位置，可以越過障礙。"
    description_zh: 施放者跳到射程內的指定空格：無視中間的單位與低矮（落差不超過 1 層）的地形，不能越過同時擋住行動與視線的物件（石柱）與牆；落點須可站立、沒有單位、與起點的高度差不超過 1 層。不觸發藉機攻擊，不算「本回合移動過」，也不觸發 on_move 被動；落點的陷阱與表面照常結算。定身或倒地時不能跳。
    player_description: "跳到射程內的空格，可以越過單位與矮障礙。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: fixed
    base_points: 3
    acts_on: caster
    allowed_shapes: [ground_tile]
  - id: swap
    name_zh: 交換位置
    llm_hint: "施放者與目標互換位置。"
    description_zh: 施放者與目標單位（敵我皆可）交換位置。對敵人（affects 為 enemies）要過一般位移檢定（對抗判定：技能的縮放屬性 vs 目標同屬性；抵抗成功則不交換），不再另外擲命中；對友方（affects 為 allies）自動成功。不能和自己交換。交換後雙方的落點互動（表面、陷阱、致命地形、墜落）照常結算。不算「本回合移動過」，不觸發 on_move 被動。
    player_description: "與目標交換位置；對敵人要通過位移對抗。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: fixed
    base_points: 4
    forbid_affects: [self, all, tiles]
    allowed_shapes: [single]
  # --- Phase 3D-2b：位移他人（docs/design/06-技能.md 6.19；點數為初值，未經模擬）---
  - id: teleport_target
    name_zh: 傳送他人
    llm_hint: "把選定的單位傳送到另一個位置。"
    description_zh: 兩段選取：射程內的一個單位（不能是自己）→ 射程內的落點（可站立、沒有單位的格子，或致命地形）。友方不檢定、一定成功；敵方要過抵抗（對抗判定：技能的縮放屬性 vs 目標同屬性，目標再加 teleport_enemy_resist_bonus）；落點是致命地形（深淵、岩漿）時目標再加 teleport_lethal_resist_bonus，成功率極低，失敗時目標不移動。Boss 對傳送到致命地形免疫（不能選）；傳送到一般格照常檢定。落點的陷阱、表面與致命地形照常結算，不觸發離開相鄰格的反應。必須搭配形狀 unit_then_tile，而且是技能唯一的效果。
    player_description: "把射程內的一個單位傳送到另一個指定的格子；敵人可以抵抗。"
    category: structural
    harmful: false
    min_rarity: rare
    sole_effect: true
    active_only: true
    budget_basis: fixed
    base_points: 11
    acts_on: caster
    allowed_shapes: [unit_then_tile]
  - id: swap_any
    name_zh: 任意兩者互換
    llm_hint: "讓兩個選定的單位互換位置。"
    description_zh: 選射程內的兩個單位（敵我皆可，不必包含施放者），互換位置；兩格都要能讓對方站上去。含敵人時每個敵方各自過一般位移檢定（對抗判定：技能的縮放屬性 vs 目標同屬性），任一個抵抗成功則整個互換失敗；全是友方時不檢定。落點的陷阱、表面與墜落照常結算。必須搭配形狀 unit_pair，而且是技能唯一的效果。
    player_description: "讓射程內的兩個單位互換位置；敵人可以抵抗。"
    category: structural
    harmful: false
    min_rarity: rare
    sole_effect: true
    active_only: true
    budget_basis: fixed
    base_points: 12
    acts_on: caster
    allowed_shapes: [unit_pair]
  - id: apply_status
    name_zh: 施加狀態
    llm_hint: "對目標施加一個狀態。"
    description_zh: 施加 statuses.yaml 中的狀態，重複施加時刷新持續時間。
    player_description: "讓目標獲得一個狀態，重複施加會刷新持續時間。"
    category: numeric
    harmful: true
    budget_basis: status
    params:
      status: {llm_hint: "要施加的狀態。", type: status, required: true}
      duration: {llm_hint: "狀態持續的回合數。", type: int, min: 1, max: 10}
  - id: create_surface
    name_zh: 產生表面
    llm_hint: "在地面製造一種表面（例如水、油、火）。"
    description_zh: 在影響格產生表面（先查互動表，例如水熄滅火）；表面記錄施放者陣營。
    player_description: "在範圍內留下一種地面表面（水、油、火等），會與既有表面互相反應。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: surface
    acts_on: tile
    params:
      surface: {llm_hint: "要製造的表面種類。", type: surface, required: true}
      duration: {llm_hint: "表面持續的回合數。", type: int, min: 1, max: 10}
  - id: destroy_object
    name_zh: 摧毀物件
    llm_hint: "摧毀範圍內的可破壞物件。"
    description_zh: 摧毀影響格中的可破壞物件。
    player_description: "摧毀範圍內可破壞的物件。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: tile
  - id: create_obstacle
    name_zh: 產生障礙
    llm_hint: "在格子上放置一個障礙物件。"
    description_zh: 在影響格中的空格產生物件；可選 duration（1–10 個環境回合）讓它到期自動消失（不算摧毀：不觸發破壞效果、不掉落、不算擊殺），省略為永久。預算：基礎點數 × obstacle_duration_permille（永久 ＝ 基礎）。
    player_description: "在範圍內的空格生出障礙物，可設定幾回合後消失。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: obstacle
    base_points: 3
    acts_on: tile
    params:
      object: {llm_hint: "要放置的物件種類。", type: object, required: true}
      duration: {llm_hint: "障礙持續的回合數，不填則永久存在。", type: int, min: 1, max: 10}
  - id: raise_terrain
    name_zh: 隆起地形
    llm_hint: "把格子的地形抬高。"
    description_zh: 影響格的高度 +1（上限 3），站在上面的單位跟著升高。
    player_description: "讓範圍內的地面升高一層，站在上面的單位跟著升高。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 7
    acts_on: tile
    params:
      amount: {llm_hint: "抬高的層數。", type: int, min: 1, max: 1}
  - id: lower_terrain
    name_zh: 下陷地形
    llm_hint: "把格子的地形降低。"
    description_zh: 影響格的高度 −1（下限 0），站在上面的單位跟著下沉、不受傷（不會墜落；同一格下陷兩次成為 2 層深的坑，把單位推進去才會墜落，#66）。
    player_description: "讓範圍內的地面下降一層，落差太大的單位會摔落。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 7
    acts_on: tile
    params:
      amount: {llm_hint: "降低的層數。", type: int, min: 1, max: 1}
  - id: intercept
    name_zh: 替隊友擋攻擊
    llm_hint: "施放者站到被攻擊的友方前面，替他承受攻擊。"
    description_zh: 只能出現在 event 為 ally_hit_adjacent 的反應技。相鄰友方被單體攻擊命中後、傷害與其他效果結算之前，這次攻擊的所有效果改為作用在持有者身上（不重擲命中；位移方向重新計算；範圍技能不攔截）。守護者的護盾、減傷、抗性照常結算。點數為初值，未經模擬。
    player_description: "隊友被單體攻擊命中時，改由自己承受這次攻擊。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    acts_on: caster
    allowed_shapes: [self]
  # --- Phase 2E-3：層數與陷阱（點數為初值，未經模擬）---
  - id: add_stack
    name_zh: 累積層數
    llm_hint: "替目標累積一種可疊加的層數。"
    description_zh: 依該層數（stacks.yaml）的 owner 把 amount 層加在施放者自己（affects 只能是 self；技能有對敵方的效果時，至少命中一名敵人才累積）或命中的目標（affects 只能是 enemies）身上，超過上限截斷。
    player_description: "替自己或命中的目標累積指定的層數。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_amount
    base_points: 2
    params:
      stack: {llm_hint: "要累積的層數種類。", type: stack, required: true, description_zh: 層數 ID（stacks.yaml）}
      amount: {llm_hint: "一次增加的層數。", type: int, required: true, min: 1, max: 3, description_zh: 累積的層數}
  - id: consume_stack
    name_zh: 消耗層數
    llm_hint: "消耗目標身上累積的層數，每一層都轉成額外的威力。"
    description_zh: 消耗全部該層數（self 型從施放者、target 型從每個被命中的目標）；同一技能被加成的效果（預設是傷害；層數的 consumer.boosts 可以加上治療、護盾，見 stacks.yaml）依消耗的層數 × per_stack_permille 加成（200 ＝ 每層 +20%）。沒有層數也可施放（加成 0）。預算以期望消耗＝上限的一半估算加成點數。
    player_description: "消耗全部層數，讓同一技能的傷害依層數增加。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: consume_stack
    params:
      stack: {llm_hint: "要消耗的層數種類。", type: stack, required: true, description_zh: 層數 ID（stacks.yaml）}
      per_stack_permille: {llm_hint: "每一層帶來的威力。", type: int, required: true, min: 50, max: 500, description_zh: 每層的傷害加成（‰）}
  # --- Phase 3C-3b：狀態當燃料（docs/design/06-技能.md 6.14.2 管道 1；點數為初值，未經模擬）---
  - id: consume_status
    nested_core: true
    name_zh: 消耗狀態
    llm_hint: "移除目標身上的某個狀態，並依此引爆後續的效果。"
    description_zh: 目標（affects，預設敵方，需命中）身上有 status 時先移除它，再對同一個單位結算 then 的效果（1–2 個，只能是 damage／heal／shield／apply_status，自動命中；施加狀態照常擲抵抗）。沒有該狀態的單位不受影響，全部都沒有時整個效果不結算（effect_fizzled）。scale 把 then 的傷害、治療、護盾骰數乘上倍率（上限見 rules/core.yaml 的 consume_status_max_scale）：remaining_rounds＝被消耗狀態的剩餘回合（永久狀態為 1）、stacks＝同時消耗目標身上 stack 的層數。splash 設為 1 時 then 也作用在被消耗者周圍 1 格內的敵方單位。
    player_description: "移除目標身上的指定狀態，並對他再結算一組追加效果。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: consume_status
    params:
      status: {llm_hint: "要被移除的狀態。", type: status, required: true, description_zh: 要消耗的狀態}
      then: {llm_hint: "移除狀態之後接著結算的效果。", type: effects, required: true, description_zh: 移除狀態後結算的效果（1–2 個）}
      scale: {llm_hint: "後續效果的威力依剩餘回合數或層數放大。", type: scale, description_zh: 後續效果依狀態的剩餘回合數或層數放大威力（省略＝不放大）}
      stack: {llm_hint: "同時消耗的層數種類。", type: stack, show_when: {scale: stacks}, description_zh: 後續效果依層數放大時，要消耗的層數種類}
      splash: {llm_hint: "後續效果也波及被消耗者周圍的敵人，範圍是幾格。", type: int, min: 1, max: 1, description_zh: 後續效果也作用在被消耗者周圍這麼遠（格）的敵方單位}
  - id: place_trap
    name_zh: 放置陷阱
    llm_hint: "在格子上設下陷阱，敵人踏入時才發動。"
    description_zh: 在目標格放一個對放置者陣營以外隱藏的陷阱，同一格只能有一個。陷阱帶著同一技能其餘的效果（自動命中，狀態照常擲抵抗；施放者的屬性在放置時快照），敵人進入（trap.trigger enter）或延遲回合數到了（delay）時，以陷阱格為中心依 trap.shape 結算。需要技能的 trap 欄位。
    player_description: "在目標格放下對敵人隱形的陷阱，被踩到時觸發技能的效果。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: caster
    allowed_shapes: [ground_tile]
  # --- Phase 3C-4a：改寫規則型原語（docs/design/06-技能.md 6.3、6.6；點數為初值，未經模擬）---
  # 每個技能最多 1 個（skill_budget.yaml 的 max_rule_rewrite）；必須每場限一次或冷卻至少
  # rule_rewrite_min_cooldown 回合，花源力（cost.source，傳說技能）時改為冷卻至少 rule_rewrite_min_cooldown_with_source。
  - id: grant_ap
    name_zh: 給予 AP
    llm_hint: "讓施放者獲得額外的 AP。"
    description_zh: 目標（自己或友方）立刻獲得 amount AP（1–2），超過本回合上限（ap_per_turn ＋ ap_carry_max）的部分不保留；目標不在自己的回合時，在它下次回合開始時加上。同一單位每輪最多被給一次（之後的給予不結算，effect_fizzled）。
    player_description: "讓自己或友方立刻獲得 AP。"
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: per_amount
    base_points: 4
    forbid_affects: [enemies, all]
    params:
      amount: {llm_hint: "獲得的 AP 點數。", type: int, required: true, min: 1, max: 2, description_zh: 給予的 AP}
  - id: reset_cooldown
    name_zh: 重置冷卻
    llm_hint: "讓技能的冷卻重新歸零。"
    description_zh: 目標友方（不含施放者自己）的技能冷卻歸零：which 為 all 時全部技能、tag 時只有帶 tag 標籤的技能；花源力的技能（cost.source）與這個技能本身不會被重置。沒有可重置的冷卻時不結算（effect_fizzled）。
    player_description: "讓友方的技能冷卻歸零。"
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 7
    forbid_affects: [enemies, all, self]
    params:
      which: {llm_hint: "重置全部技能，還是只重置帶指定標籤的技能。", type: which, required: true, description_zh: 重置全部技能，或只重置帶指定標籤的技能}
      tag: {llm_hint: "只重置帶這個標籤的技能。", type: tag, show_when: {which: tag}, description_zh: 選「標籤」時，要重置的技能標籤}
  - id: cheat_death
    status: undying
    name_zh: 免死
    llm_hint: "在受到致命傷害時保住一條命。"
    description_zh: 目標（自己或友方）獲得狀態「免死」（undying）duration 回合（省略時用狀態的預設持續）：期間 HP 會降到 0 時改為 1 並移除此狀態（墜落與致命地形照樣生效）。
    player_description: "讓自己或友方在一段時間內，致命傷害改為剩下 1 點生命。"
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 8
    forbid_affects: [enemies, all]
    params:
      duration: {llm_hint: "效果持續的回合數。", type: int, min: 1, max: 2, description_zh: 免死的持續回合}
  # --- Phase 3C-4b：另外三個改寫規則型原語（同上：每技能最多 1 個、冷卻或源力規則；點數為初值，未經模擬）---
  - id: redirect_damage
    status: soul_link
    name_zh: 分擔傷害
    llm_hint: "把一部分受到的傷害轉移給施放者。"
    description_zh: 目標友方（不含施放者自己）獲得狀態「靈魂連結」（soul_link）duration 回合：它受到的傷害有 permille‰（≤ 500）轉給施放者，直接扣施放者的 HP。與替隊友擋下整次攻擊（intercept）不同；兩者同時存在時先攔截，傷害落在守護者身上之後才看守護者有沒有連結。施放者倒下或離場時連結消失。
    player_description: "讓友方受到的一部分傷害轉由自己承受。"
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 7
    forbid_affects: [enemies, all, self]
    params:
      permille: {llm_hint: "轉移的傷害比例。", type: int, required: true, min: 100, max: 500, description_zh: 轉移給施放者的傷害千分比}
      duration: {llm_hint: "效果持續的回合數。", type: int, min: 1, max: 3, description_zh: 連結持續的回合（省略時用狀態的預設持續）}
  - id: copy_skill
    name_zh: 複製技能
    llm_hint: "複製目標最近使用的技能，讓施放者可以立刻使用。"
    description_zh: 立即施放「本輪內最後一個被其他單位施放、且施放者看得到的主動技能」，由自己當施放者重新選目標；不能複製傳說、改寫規則型技能與有層數需求的技能。複製的技能不扣法力與 AP、不進冷卻，不檢查武器需求（傷害與射程照自己的武器算），但射程、視線與目標都要合法。沒有可以複製的技能時不能施放。必須是技能唯一的效果，形狀為 self。
    player_description: "施放本輪最後一個被看見的主動技能。"
    category: rule_rewrite
    lookup_by_skill_id: true
    harmful: false
    min_rarity: epic
    sole_effect: true
    active_only: true
    budget_basis: fixed
    base_points: 9
    acts_on: caster
    allowed_shapes: [self]
  - id: extra_reaction
    name_zh: 額外反應
    llm_hint: "讓施放者本輪多一次反應的機會。"
    description_zh: 目標（自己或友方）本輪的反應次數上限 +amount（1），到下一輪開始為止。
    player_description: "讓自己或友方本輪多一次反應機會。"
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: per_amount
    base_points: 7
    forbid_affects: [enemies, all]
    params:
      amount: {llm_hint: "增加的反應次數。", type: int, required: true, min: 1, max: 1, description_zh: 額外的反應次數}
  # --- Phase 3C-5a：場景物件原語（docs/design/06-技能.md 6.15；點數為初值，未經模擬）---
  - id: hurl_object
    name_zh: 投擲物件
    llm_hint: "舉起附近的可推動物件，往另一個位置丟出去砸人。"
    description_zh: 舉起 range 格內看得到的一個 pushable 物件，丟到落點格（形狀 object_then_tile；飛行路徑不檢查阻擋，落點要在視線內）。命中判定照技能，落點被命中的單位受 dice 物理傷害（不加屬性），knock_prone 為 true 時再以對抗判定擊倒。物件落地後依標籤結算：explosive 在落點爆炸、breakable 碎掉（摧毀）、其他放在落點；落點有單位或物件時放在 hurl_scatter_radius（rules/core.yaml）內最近的空格（同距離依 (y, x)），沒有空格或落點是致命地形就摧毀。預算為骰子平均 × 「需要附近有物件」折扣（skill_budget.yaml 的 hurl_object_discount_permille），擊倒另加 knock_prone 的點數。
    player_description: "舉起附近的可推動物件，投擲到指定的格子。"
    category: structural
    harmful: true
    min_rarity: rare
    max_per_skill: 1
    active_only: true
    budget_basis: hurl_object
    allowed_shapes: [object_then_tile]
    params:
      range: {llm_hint: "可以舉起的物件離施放者最遠幾格。", type: int, required: true, min: 1, max: 6, description_zh: 可以舉起的物件與施放者的最遠距離}
      dice: {llm_hint: "砸中時的傷害骰子。", type: dice, required: true, description_zh: 落點單位受到的物理傷害}
      knock_prone: {llm_hint: "砸中落點的單位時是否一併擊倒。", type: bool, description_zh: 命中時另外擊倒（對抗判定）}
  - id: topple
    name_zh: 推倒
    llm_hint: "把站著的物件推倒，壓到倒下方向上的單位。"
    description_zh: 推倒目標（射程內看得到的 topplable 物件，技能只能以物件為目標），往遠離施放者的方向倒下：從下一格起壓住 topple_length 格（rules/core.yaml），壓到的單位受 topple_damage_dice 物理傷害並倒地、壓到的 breakable 物件受同樣傷害，其他物件擋住倒下；原物件移除，最後一格產生倒塌物。互動的推、技能的推擊與風推到 topplable 物件時也一樣會推倒它（通用規則）。
    player_description: "把高大的物件推倒，壓傷倒下路徑上的單位。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 6
    acts_on: tile
    allowed_shapes: [single]
  # --- Phase 3D-1：資源互動（docs/design/06-技能.md 6.16 H；點數為初值，未經模擬）---
  - id: restore_resource
    name_zh: 回復資源
    llm_hint: "回復施放者的法力，或縮短技能的冷卻。"
    description_zh: resource 為 mana：目標（自己或友方）回復 amount 點法力，不超過法力上限；為 cooldown：目標所有技能的冷卻 −amount（最多 2，下限 0）。冷卻不影響花源力的技能（cost.source），也不影響施放中的這個技能。目標沒有法力空間或沒有冷卻中的技能時發出 effect_fizzled。預算：法力每點 restore_mana_point_permille‰、冷卻每回合 restore_cooldown_points 點（skill_budget.yaml）。
    player_description: "回復法力，或縮短冷卻。"
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: restore_resource
    forbid_affects: [enemies, all]
    params:
      resource: {llm_hint: "回復的是法力還是技能冷卻。", type: resource, required: true, description_zh: mana 回復法力、cooldown 縮短冷卻}
      amount: {llm_hint: "回復的數量。", type: int, required: true, min: 1, max: 10, description_zh: 回復的法力點數，或縮短的冷卻回合（最多 2）}
  - id: steal_buff
    name_zh: 奪取增益
    llm_hint: "奪取目標身上的一個增益狀態，轉到施放者身上。"
    description_zh: 移除目標身上一個增益狀態（statuses.yaml 中 polarity 為 buff；有多個時取剩餘回合最長、同長依狀態 ID 排序），並以相同的剩餘回合與數值施加到施放者身上（已有同狀態時取較長者）。目標沒有增益時發出 effect_fizzled（no_buff）。
    player_description: "奪走目標身上一個增益，轉給自己。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    forbid_affects: [allies, all, self]

  - id: dispel
    name_zh: 驅散
    llm_hint: "驅散目標身上的增益狀態。"
    description_zh: 移除敵方目標身上的 count 個增益（statuses.yaml 中 polarity 為 buff；依剩餘回合最長者先，永久最長，同長依狀態 ID 排序；all 為全部）。中性狀態（姿態、隱蔽、不死、靈魂連結）與減益不是增益，不會被驅散。目標沒有增益時發出 effect_fizzled（no_buff）。預算：1 個 dispel_one_points 點、全部 dispel_all_points 點（skill_budget.yaml）。
    player_description: "移除敵人身上的增益。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: dispel
    forbid_affects: [allies, all, self]
    params:
      count: {llm_hint: "驅散的個數，或全部。", type: count, required: true, min: 1, max: 1, description_zh: 驅散的增益個數（1）或 all（全部）}
  - id: reveal
    name_zh: 揭露
    llm_hint: "揭露範圍內隱蔽的單位與機關。"
    description_zh: 揭露技能範圍內的敵人與陷阱（自動命中，不擲命中判定）：敵人失去 concealed 狀態（原因 revealed），並獲得 revealed 狀態 duration 回合——期間不算隱蔽（黑暗表面與草叢也不算）、不能再獲得 concealed；範圍內的敵方陷阱對施放者的陣營顯示（事件 trap_revealed，只給施放者的陣營）。範圍內沒有敵人也沒有敵方陷阱時發出 effect_fizzled（nothing_hidden）。預算：reveal_base_points ＋ reveal_round_points × duration。
    player_description: "揭露範圍內的隱蔽敵人與陷阱，讓他們暫時無法躲藏。"
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: reveal
    forbid_affects: [allies, all, self]
    params:
      duration: {llm_hint: "揭露效果持續的回合數。", type: int, required: true, min: 1, max: 3, description_zh: 被揭露的敵人不能再隱蔽的回合數}

  # --- Phase 3D-8b：復活與定時炸彈 ---
  - id: revive
    name_zh: 復活
    llm_hint: "讓倒下的友方重新站起來。"
    description_zh: "目標必須是射程內倒下的友方（倒下的單位留在戰鬥狀態、保留位置，但不占格子）：目標以 hp_permille‰ 的最大 HP（至少 1）站起來，站回原位置；原格被占用、不能站立或是致命地形時，站到 core.yaml revive_landing_radius 格內最近的空格（距離相同依 (y, x) 順序），範圍內沒有空格就不能施放。每個單位每場最多被復活 1 次；召喚物不能被復活；倒下時已移除的狀態（姿態、以來源為依據的狀態）、陷阱、區域與召喚物不會恢復。事件 unit_revived。技能必須每場限一次（uses_per_battle: 1）或冷卻至少 rule_rewrite_min_cooldown 回合。只能搭配 single 形狀，其餘效果必須是 affects: self。預算：revive_base_points ＋ hp_permille × revive_hp_point_permille ÷ 1000。"
    player_description: "讓射程內倒下的友方以部分生命站起來。"
    category: structural
    harmful: false
    min_rarity: rare
    others_affect: self
    max_per_skill: 1
    active_only: true
    budget_basis: revive
    allowed_shapes: [single]
    forbid_affects: [enemies, all, self]
    params:
      hp_permille: {llm_hint: "站起來時回復的生命比例。", type: int, required: true, min: 100, max: 1000, description_zh: 站起來時的 HP（最大 HP 的 n‰，至少 1）}
  - id: delayed_damage
    status: time_bomb
    name_zh: 定時炸彈
    llm_hint: "在目標身上放一顆定時炸彈，幾輪後爆炸並波及周圍。"
    description_zh: "命中的敵方目標身上附加狀態 time_bomb（不擲抵抗；已有定時炸彈的目標不能再附加，發出 effect_fizzled）：每次環境回合倒數 −1，歸零時在 **目標當下位置** 爆炸——目標與 radius 格（曼哈頓距離）內的所有存活單位（敵我不分，包含施放者）受到 dice ＋ 縮放屬性 × 0.5 的 element 傷害（自動命中、不暴擊、沒有格擋），空格依元素觸及；帶元素的傷害照常與表面、物件互動。目標在倒數中倒下時，立即在倒下的位置爆炸（目標已倒下，不算受傷者）。可被淨化（cleanse）移除；驅散（dispel）不移除（time_bomb 不是增益）。環境預告顯示倒數與爆炸範圍。只能用在主動的法術技。預算：骰子平均 × 預期波及的敵人數（delayed_damage_expected_targets_permille）。"
    player_description: "在目標身上裝上定時炸彈，倒數結束時爆炸並傷害周圍。"
    category: structural
    lookup_by_skill_id: true
    harmful: true
    min_rarity: rare
    max_per_skill: 1
    active_only: true
    budget_basis: delayed_damage
    allowed_shapes: [single]
    forbid_affects: [allies, all, self]
    params:
      dice: {llm_hint: "爆炸傷害的骰子。", type: dice, required: true}
      element: {llm_hint: "爆炸的元素。", type: element, required: true}
      rounds: {llm_hint: "幾輪後爆炸。", type: int, required: true, min: 1, max: 3, description_zh: 倒數的環境回合數}
      radius: {llm_hint: "爆炸波及的半徑。", type: int, required: true, min: 0, max: 2, description_zh: 爆炸半徑（曼哈頓距離，0 只波及目標）}

  # --- Phase 3D-4a：召喚（docs/design/06-技能.md 6.16 B；點數為初值，未經模擬）---
  - id: summon
    name_zh: 召喚
    llm_hint: "召喚一個協助戰鬥的單位。"
    description_zh: 在目標格（形狀 ground_tile；必須可站立、不是致命地形、沒有單位）召喚 unit 範本（content/units/summons/）的召喚物，屬於施放者陣營，由效用 AI 控制。召喚物緊接在召喚者之後行動（插入先攻順序，不擲先攻；同一召喚者的召喚物依召喚順序排在一起），持續 duration 輪：在召喚者第 duration 次回合結束時消失（施放當回合不算）；召喚者倒下或撤離時一併消失。同一召喚者同時存在的召喚物超過 summon_limit_per_owner（core.yaml）時，最舊的消失。召喚物沒有源力、不取用源泉、不計入勝負條件、不能撤離。必須是主動技能，其餘效果只能作用在施放者自己。
    player_description: "在指定的格子召喚一個替你戰鬥的召喚物。"
    category: structural
    harmful: false
    min_rarity: rare
    others_affect: self
    max_per_skill: 1
    active_only: true
    budget_basis: summon
    acts_on: caster
    allowed_shapes: [ground_tile]
    params:
      unit: {llm_hint: "要召喚的單位種類。", type: summon, required: true, description_zh: 召喚物範本 ID（content/units/summons/）}
      duration: {llm_hint: "召喚物停留的回合數。", type: int, required: true, min: 1, max: 4, description_zh: 召喚物存在的輪數}
      count: {llm_hint: "一次召喚的隻數。", type: int, min: 1, max: 2, description_zh: 一次召喚的數量（1 或 2；2 是數量型分歧進化，必須同時填 power_permille；省略為 1）}
      power_permille: {llm_hint: "多隻召喚物時，每隻相對於一般強度的比例。", type: int, show_when: {count: "2"}, min: 100, max: 999, description_zh: 數量型分歧進化：每隻召喚物的最大 HP 與傷害只有一般的這麼多‰（count 為 2 時必填）}
      max_hp_permille: {llm_hint: "召喚物額外增加的最大生命比例。", type: int, min: 1, max: 1000, description_zh: 加深分歧進化：召喚物的最大 HP 多這麼多‰}
      trait: {llm_hint: "召喚物擁有的小特性。", type: summon_trait, description_zh: 加深分歧進化：召喚物的小特性（core.yaml 的 summon_traits）}
      infusion: {llm_hint: "召喚物固有的灌注元素。", type: infusion, description_zh: 橋接分歧進化：召喚物固有的第二個灌注關鍵字（core.yaml 的 summon_infusions）}

  # --- Phase 3D-5：持續區域（docs/design/06-技能.md 6.16 G；點數為初值，未經模擬）---
  - id: zone
    nested_core: true
    name_zh: 持續區域
    llm_hint: "在地面留下一塊持續的區域，單位進入或停留時受到效果。"
    description_zh: 在技能形狀的格子上建立持續 duration 輪的區域（施放者第 duration 次回合結束時消失，施放當回合不算；施放者不在場時於那一輪的環境回合消失）。anchor：tile 固定在施放時的格子、caster 跟隨施放者（形狀 self／ring／allies_in_radius，每次施放者移動就以新位置重新展開；施放者倒下或離場時消失）、moving 每次環境回合沿施放方向前進 speed 格（形狀 line／cone；前進到牆壁或地圖外的格子消失，全部消失時區域消失）。單位進入區域（區域建立、移動或跟隨到他身上也算；在區域內移動不算）或回合開始時站在區域內（when：enter／turn_start／both），依 affects（enemies／allies／all）對他結算 effects（1–2 個 damage／heal／shield／apply_status；自動命中，狀態照常擲抵抗，施放者屬性在建立時快照；施放者自己不受 all 的有害效果）。surface：區域新覆蓋的格子留下表面。同一施放者同時存在的區域超過 zone_limit_per_owner（core.yaml）時最舊的消失。必須是主動技能唯一的效果。
    player_description: "在範圍內建立持續數輪的區域，區域內的單位會受到效果影響。"
    category: structural
    lookup_by_skill_id: true
    harmful: false
    min_rarity: rare
    sole_effect: true
    active_only: true
    budget_basis: zone
    forbid_affects: [self, tiles]
    allowed_shapes: [self, ground_tile, cross, square3, line, cone, ring, allies_in_radius]
    params:
      anchor: {llm_hint: "區域固定在施放處、跟著施放者，還是會往前移動。", type: anchor, required: true, description_zh: 固定在施放時的格子、跟隨施放者，或沿施放方向移動}
      when: {llm_hint: "區域的效果在單位進入時、回合開始時，或兩者都結算。", type: zone_when, required: true, description_zh: 單位進入區域時、回合開始時站在區域內時，或兩者都結算}
      duration: {llm_hint: "區域持續的回合數。", type: int, required: true, min: 1, max: 4, description_zh: 區域持續的輪數}
      effects: {llm_hint: "區域對單位結算的效果。", type: effects, required: true, description_zh: 區域結算的效果（1–2 個）}
      speed: {llm_hint: "移動型區域每輪前進的格數。", type: int, show_when: {anchor: moving}, min: 1, max: 2, description_zh: 區域每個環境回合沿施放方向前進的格數}
      surface: {llm_hint: "區域留下的表面種類。", type: surface, description_zh: 區域新覆蓋的格子留下的表面（省略＝不留）}

  # --- Phase 3D-6：規則改變（docs/design/06-技能.md 6.16 F、6.14.4；點數在 rule_changes.yaml 的 kinds）---
  - id: rule_change
    name_zh: 規則改變
    llm_hint: "在本場戰鬥中改變一條戰鬥規則。"
    description_zh: 傳說的第三種核心：引用 rule_changes.yaml 的一條規則改變（只影響施放者自己）。技能必須寫 activation（timed 持續 legendary_timed_rounds 輪、battle 本場剩餘時間），施放＝以 legendary_activation_ap AP ＋ 源力啟動；生效中不能再啟動。每個單位最多裝 1 個、同時最多 1 個生效中的規則改變。必須是主動技能唯一的效果、形狀 self。
    player_description: "傳說技能專用：在一段時間內改寫施放者自己的戰鬥規則。"
    category: rule_change
    harmful: false
    min_rarity: legendary
    sole_effect: true
    active_only: true
    budget_basis: rule_change
    acts_on: caster
    allowed_shapes: [self]
    params:
      rule: {llm_hint: "要改變的規則。", type: rule_change, required: true, description_zh: rule_changes.yaml 的規則改變 ID}

  # --- Phase 3D-7a：賭博型（docs/design/06-技能.md 6.17 A；點數為初值，未經模擬）---
  # win／lose 的效果類型只有 damage、heal、shield、apply_status，以及只能出現在分支裡的
  # damage_multiplier（本次傷害 × damage_multiplier_permille‰）與 self_damage_of_hit（施放者受本次
  # 傷害的 self_damage_permille_of_hit‰）；後兩者不是原語，沒有獨立的條目。
  - id: gamble
    nested_core: true
    name_zh: 賭注
    llm_hint: "賭一把：成功時結算一組效果，失敗時結算另一組。"
    description_zh: 命中判定之後（未命中則整個不結算；技能沒有對敵方的效果時直接擲）擲一次 d1000，不超過 chance_permille 結算 win 的效果，否則結算 lose 的效果（各 0–2 個，至少一邊有效果）。win／lose 可以對施放者自己（affects self，例如失敗的反噬）；damage_multiplier 讓本次施放的傷害效果乘上倍率，self_damage_of_hit 讓施放者受到本次造成傷害的 n‰。施放者受到的反噬傷害不會讓他的 HP 低於 1，反噬狀態不能是硬控、跳過回合或持續傷害。必須是主動技能的最後一個效果。預算以期望值計（成功率 × win ＋ 失敗率 × lose），對自己的有害效果打折（gamble_self_harm_permille）。
    player_description: "擲骰賭一把：成功時結算好效果，失敗時結算壞效果。"
    category: structural
    harmful: true
    min_rarity: rare
    position: last
    max_per_skill: 1
    active_only: true
    budget_basis: gamble
    acts_on: caster
    params:
      chance_permille: {llm_hint: "成功的機率。", type: int, required: true, min: 50, max: 950, description_zh: 成功（結算 win）的機率（‰）}
      win: {llm_hint: "成功時結算的效果。", type: effects, description_zh: 成功時結算的效果（0–2 個）}
      lose: {llm_hint: "失敗時結算的效果。", type: effects, description_zh: 失敗時結算的效果（0–2 個）}

  # --- Phase 3D-8c：暫時獲得技能（docs/design/06-技能.md 6.20；點數為初值，未經模擬）---
  - id: grant_skill
    name_zh: 暫時獲得技能
    llm_hint: "暫時給目標一個技能。"
    description_zh: "目標（施放者自己，或形狀 single 選的友方）的技能列暫時多出 skill 指定的技能，持續 duration 輪：在目標自己的回合結束時倒數，歸零時消失（事件 skill_granted、skill_grant_expired），冷卻與使用次數紀錄一併清除。被給的技能是一般的主動技能（content/skills/），不佔技能欄位；不能是傳說、不含改寫規則型原語、不能是 grant_skill 技能或自己。同一個被給的技能不疊加，重新施放只刷新剩餘輪數；目標原本就裝備了該技能時不結算（effect_fizzled：already_equipped）。被給的技能照它自己的規則施放（AP、法力、冷卻、武器需求）。預算：被給技能的總點數 × 預期使用次數（grant_skill_expected_uses_per_round_permille × duration ÷ 1000）。"
    player_description: "讓自己或友方暫時多獲得一個技能。"
    category: structural
    harmful: false
    min_rarity: rare
    max_per_skill: 1
    active_only: true
    budget_basis: grant_skill
    allowed_shapes: [self, single]
    forbid_affects: [enemies, all]
    params:
      skill: {llm_hint: "要給予的技能。", type: skill, required: true, description_zh: 暫時給出的技能 ID（content/skills/）}
      duration: {llm_hint: "技能可使用的回合數。", type: int, required: true, min: 1, max: 4, description_zh: 持續的輪數（在目標回合結束時倒數）}

  # --- Phase 3-23：刻印（docs/design/06-技能.md 6.25；點數為初值，未經模擬）---
  - id: inscribe
    name_zh: 刻印
    llm_hint: "在格子上刻下符文，之後可以被引爆或被其他技能利用。"
    description_zh: 在影響格（可站立的格子）留下施放者專屬的符文：恰好帶一個 element（元素，例如雷紋、火紋）或 tag（標籤），持續 duration 個環境回合（省略為 core.yaml 的 rune_default_rounds，初值 3；上限 5）。符文本身沒有任何效果，敵我都看得到；只有刻下它的施放者讀得到（條件 on_own_rune、消耗型原語 detonate_runes）。同一施放者在同一格再刻一次是更新；同一施放者同時存在的符文格超過 rune_limit_per_owner（core.yaml，初值 6）時最舊的消失。施放者倒下時符文保留到時效結束。預算：base_points × inscribe_duration_permille（依 duration；省略＝預設 3 輪）。
    player_description: "在地面刻下只有自己能引爆的符文，帶有元素或標籤。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: inscribe
    base_points: 5
    acts_on: tile
    forbid_affects: [self, enemies, allies, all]   # 刻印只作用在格子（3-48c）；要刻在腳下用「自身」形狀
    params:
      element: {llm_hint: "符文的元素。", type: element, required: true, required_when: {unless_filled: tag}, description_zh: 符文的元素（選了標籤就不用選；元素和標籤恰好選一個）}
      tag: {llm_hint: "符文帶有的標籤，供其他技能辨識。", type: tag, description_zh: 符文的標籤（只能選已定義的符文標籤；元素和標籤恰好選一個）}
      duration: {llm_hint: "符文持續的回合數。", type: int, min: 1, max: 5, description_zh: 符文持續的環境回合數}
  - id: detonate_runes
    name_zh: 引爆符文
    llm_hint: "引爆範圍內自己刻下的符文，造成傷害。"
    description_zh: 引爆影響範圍內施放者自己的符文（依編號）：每格移除符文，並對該格上符合 affects 的單位自動命中（不擲命中）造成一次傷害＝骰值＋縮放屬性×0.5（法術公式）；元素取 element、省略時取符文的元素（標籤符文為物理）。施放者自己不受傷害；沒有符文的格子沒有效果。預算：骰子平均 × detonate_runes_permille（需要先刻印的折扣）。
    player_description: "引爆範圍內自己的符文，對符文上的單位造成傷害。"
    category: structural
    harmful: true
    min_rarity: rare
    active_only: true
    budget_basis: detonate_runes
    forbid_affects: [self, allies, tiles]
    allowed_shapes: [cross, square3, ring, allies_in_radius]
    params:
      dice: {llm_hint: "引爆傷害的骰子。", type: dice, required: true, description_zh: 每格的傷害骰}
      element: {llm_hint: "只引爆這個元素的符文。", type: element, description_zh: 傷害元素（省略時取符文的元素）}
      scope: {llm_hint: "只引爆被命中目標腳下那一格的符文。", type: scope, description_zh: 填 target_cell 只引爆被命中目標所在的那 1 格（只能用在修正規則的命中後效果與普攻詞條；主動技能不可填）}

  # --- Phase 3-24c：獻祭召喚物（docs/design/06-技能.md 6.27.2；點數為初值，未經模擬）---
  - id: sacrifice_summon
    name_zh: 獻祭召喚物
    llm_hint: "獻祭自己的召喚物，在牠的位置引發爆炸。"
    description_zh: 選射程內自己的一個召喚物（含圖騰；別人的、敵人的不行）作為獻祭：它立刻消失（原因「被獻祭」，不算倒下），並在它所在的位置以 radius 格（曼哈頓距離）為半徑結算一次——填了 element 是爆炸：範圍內所有敵人自動命中（不擲命中、不暴擊）受到 dice ＋ 縮放屬性 × 0.5 的 element 傷害（帶元素的傷害照常與表面、物件互動）；省略 element 是治療：範圍內的友方（含施放者，不含被獻祭的召喚物）回復 dice ＋ 縮放屬性 × 0.5 的 HP（受治療量修正）。只能用在主動技能，形狀 single。預算：骰子平均 × sacrifice_summon_permille（需要先有召喚物、且召喚物會消失的折扣）。
    player_description: "獻祭自己的一個召喚物，在它的位置爆發出效果。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: sacrifice_summon
    forbid_affects: [self, enemies, all, tiles]
    allowed_shapes: [single]
    params:
      dice: {llm_hint: "爆炸傷害的骰子。", type: dice, required: true, description_zh: 爆炸的傷害骰或治療骰}
      radius: {llm_hint: "爆炸波及的半徑。", type: int, required: true, min: 0, max: 2, description_zh: 結算半徑（曼哈頓距離，0 只波及召喚物所在的格子）}
      element: {llm_hint: "爆炸的元素。", type: element, description_zh: 填了＝爆炸（傷害敵人）；省略＝治療範圍內的友方}

  # --- Phase 3-54a：風的吹送（docs/design/06-技能.md 6.33，#56；點數為初值，未經模擬）---
  - id: blow_surface
    name_zh: 吹送
    llm_hint: "用風把範圍內的地面表面（火、毒、冰、水、油、煙霧）整片往風向吹走幾格。"
    description_zh: 把影響格上可吹送的表面（rules/core.yaml 的 wind.blow_surfaces：火、毒、冰、水、油、煙霧）整片往風向平移 distance 格（2～3），保留剩餘回合與建立者。風向：方向型形狀為形狀的方向；中心格型為「施放者 → 中心格」的主要軸向；以施放者為中心的形狀為「施放者 → 該格」的主要軸向（往外吹）。表面一格一格前進，遇到地圖外、牆壁、blocks_move 物件、比目前高的格子就停在前一格；單位不阻擋；推進致命地形（深淵、岩漿；上面不能有表面）的表面走到那一格就消失。原格的表面移除；落點先查互動表（同產生表面，例如水熄滅火），帶元素的表面落在物件上照常觸及。多片落在同一格時，風向最前面的先放。只能用在主動技能、只作用在格子。預算：base_points × 距離。
    player_description: "用風把範圍內的地面表面（火、毒、冰、水、油、煙霧）整片往風向吹走幾格；撞到牆或擋路的東西就停下。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: per_distance
    base_points: 1
    acts_on: tile
    forbid_affects: [self, enemies, allies, all]   # 吹送只作用在格子
    params:
      distance: {llm_hint: "表面被吹走的格數。", type: int, required: true, min: 2, max: 3, description_zh: 表面往風向平移的格數}

  # --- Phase 3-54c：清除表面（06 6.33 清風，#63；點數為初值，未經模擬）---
  - id: clear_surface
    name_zh: 清除表面
    llm_hint: "清掉範圍內的地面表面。"
    description_zh: 移除影響格上指定種類（surface）的表面；省略 surface 時移除 rules/core.yaml 的 clear_surfaces（煙霧、毒）。affects 為 allies 時只清有友方站著的格子，tiles 時清整個範圍。不帶元素、不查互動表、不觸及物件、不觸發風的擴散。只作用在格子、只能用在主動技能。預算：base_points 3（形狀與對象倍率照一般效果）。
    player_description: "把範圍內指定種類的地面效果直接清掉（不選＝清掉煙霧與毒）；可以只清友方腳下的。不帶元素，也不會引發其他反應。"
    category: structural
    harmful: false
    min_rarity: rare
    active_only: true
    budget_basis: fixed
    base_points: 3
    acts_on: tile
    params:
      surface: {llm_hint: "表面種類；省略＝煙霧與毒。", type: surface, description_zh: 要清除的表面種類；省略時清除煙霧與毒}

  # --- Phase 3J-1a：進入形態（06 6.30，玩法決定 #48；點數為初值，未經模擬）---
  - id: enter_form
    name_zh: 進入形態
    llm_hint: "化身為一種形態：普攻改用天生武器，持續到取消。"
    description_zh: 進入 form（content/forms.yaml）的形態。形態是姿態的擴充——只能是姿態（kind 為 stance）唯一的效果、形狀 self；花 stance_ap_cost（1）AP，同時只能有一個姿態或形態（進入形態會取代姿態、施加姿態會解除形態），自己回合用 end_stance 取消（免費），倒下、撤離或戰鬥結束時解除；佔一個主動技能欄位。形態中普攻改用天生武器（屬性 × 0.3；手上武器的普攻特性與主手的普攻詞條不生效，武器技仍看手上武器），套用形態效果（防禦、移動、最大 HP、受傷修正、治療加成、高度差當平地），每次進入觸發進入獎勵。每回合開始付維持費（物理形態扣耐力、心智形態扣法力，forms.yaml），不夠付就自動解除。離開（取消、被迫解除、切換）後該形態冷卻 forms.yaml 的 cooldown 回合，其他形態不受影響；已在該形態中或該形態冷卻中不能使用。元素可選的形態用 use_skill 的 form_element 選（省略＝清單第一個）。預算：base_points 11（照姿態計，skill_budget.yaml 的 form_coefficient_permille）。
    player_description: "化身為一種形態：普攻改用天生武器，獲得形態效果與進入獎勵；每回合要付維持費，持續到取消。"
    category: structural
    harmful: false
    min_rarity: rare
    acts_on: caster
    allowed_shapes: [self]
    sole_effect: true
    max_per_skill: 1
    budget_basis: fixed
    base_points: 11
    params:
      form: {llm_hint: "要化身的形態。", type: form, required: true, description_zh: 形態 ID（content/forms.yaml）}
