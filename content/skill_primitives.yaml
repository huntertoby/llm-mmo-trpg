# 技能的效果原語（docs/phases/Phase2A計畫.md 3.4）。Phase 2A 支援 12 個 ID（11 種）。
#
# category：numeric 數值型／structural 結構型／rule_rewrite 改寫規則型（2A 沒有）
# min_rarity：使用此原語的最低稀有度（2B-2 起由驗證器檢查：數值型 common、結構型 rare）
# budget_basis／base_points：預算點數的算法（docs/phases/Phase2B計畫.md 4.2）
#   fixed 固定 base_points／per_distance base_points × 距離／dice_average 骰子平均值／
#   damage 法術為骰子平均值、武器為倍率 × core.yaml 的 budget_reference_weapon_damage／
#   status、surface 為該狀態或表面的 budget_points × 持續 ÷ 預設持續
# harmful：有害。省略 affects 時的預設：地形類 tiles、施放者專屬 self、有害 enemies、有益 allies
# acts_on：unit（對單位）／tile（對格子；affects 為單位類別時作用在這些單位腳下的格子）／caster
# allowed_shapes：只能搭配這些形狀
# forbid_affects：不可搭配的 affects（2D-1：cleanse 不能對敵方使用；驅散不在本階段）
# params：可填的參數（type：dice／int／status／surface／object／element）
primitives:
  - id: damage
    name_zh: 傷害
    description_zh: 法術技：骰值＋縮放屬性×0.5；武器技：（武器骰＋固定值＋縮放屬性×0.3）×倍率。同時傷害影響格中的可破壞物件。
    category: numeric
    harmful: true
    budget_basis: damage
    params:
      dice: {type: dice, required: true, description_zh: 法術技必填；武器技不可填（用武器骰）}
      multiplier_permille: {type: int, min: 1, max: 10000, description_zh: 武器技的倍率（‰），預設 1000}
      element: {type: element, description_zh: 法術技必填；武器技省略時繼承武器元素}
  - id: heal
    name_zh: 治療
    description_zh: 治療量＝骰值＋縮放屬性×0.5，不超過最大 HP。
    category: numeric
    harmful: false
    budget_basis: dice_average
    params:
      dice: {type: dice, required: true}
  - id: shield
    name_zh: 護盾
    description_zh: 目標獲得吸收量＝骰值＋縮放屬性×0.5（與治療同一公式）的護盾（狀態 shielded，持續 2 回合）；骰值傷害先扣護盾。已有護盾時取較大值並刷新持續時間。
    category: numeric
    harmful: false
    budget_basis: dice_average
    params:
      dice: {type: dice, required: true}
  - id: cleanse
    name_zh: 淨化
    description_zh: 移除影響單位身上所有非有益的狀態（依狀態 ID 排序逐一移除）。不能對敵方使用。
    category: numeric
    harmful: false
    budget_basis: fixed
    base_points: 3
    forbid_affects: [enemies, all]
  - id: push
    name_zh: 推擊
    description_zh: 以施放者（中心格型為中心）為原點往外推；被擋住時停在擋住前的格子，steadfast 減半。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_distance
    base_points: 2
    params:
      distance: {type: int, required: true, min: 1, max: 2}
      collision_dice: {type: dice, description_zh: 撞擊傷害骰（省略時用核心規則 collision_damage_dice，初值 1d6）；預算每顆骰加 collision_die_points}
  - id: pull
    name_zh: 拉扯
    description_zh: 往施放者（中心格型為中心）的方向拉，規則同推擊。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_distance
    base_points: 2
    params:
      distance: {type: int, required: true, min: 1, max: 2}
      collision_dice: {type: dice, description_zh: 撞擊傷害骰（省略時用核心規則 collision_damage_dice，初值 1d6）；預算每顆骰加 collision_die_points}
  - id: knock_prone
    name_zh: 擊倒
    description_zh: 對抗判定（技能的縮放屬性 vs 目標同屬性），成功才倒地。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 3
  - id: teleport
    name_zh: 傳送
    description_zh: 施放者移動到目標格（必須可站立且沒有單位）；不觸發藉機攻擊。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    acts_on: caster
    allowed_shapes: [ground_tile]
  # --- Phase 3D-2：自身位移（docs/design/06-技能.md 6.16 A；點數為初值，未經模擬）---
  - id: dash
    name_zh: 衝鋒
    description_zh: 施放者沿最短可走路徑（步行規則；不經過任何單位）移到目標單位的相鄰格（路徑成本不超過技能射程；不消耗移動點數），再結算同技能的其餘效果。一律最先結算，必須是技能的第一個效果。途中會觸發藉機攻擊與陷阱；被擋下（定身、倒地、倒下）或停下時目標不在相鄰格，其餘效果不結算。算「本回合移動過」，也觸發 on_move 被動。只能搭配形狀 single（目標單位）。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 3
    acts_on: caster
    allowed_shapes: [single]
  - id: charge_through
    name_zh: 直線衝撞
    description_zh: 選一個終點格（形狀 ground_tile；與施放者同一列或同一行、距離不超過形狀射程、可站立且沒有單位）；施放者沿直線衝過去，被牆、不可走地形或 blocks_move 物件擋住時停在擋住前最後一個能站的空格（停不下來就不能施放）。沿途經過的每個敵人依路徑順序各擲一次命中；命中受 dice 物理傷害（不加屬性，暴擊與格擋照常），再依 on_hit 擊倒（對抗判定）或推到路徑旁一格（push_aside：先左後右選可站的一側，兩側都不行就往左撞，照常觸發撞擊）。隊友讓路、敵人不阻擋，一律被穿過。不觸發藉機攻擊；沿途與終點的陷阱、表面照常結算，被定身或倒地就停下。算「本回合移動過」，也觸發 on_move 被動。定身或倒地時不能施放。必須是技能的第一個效果，其餘效果只能作用在施放者自己。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: charge_through
    acts_on: caster
    allowed_shapes: [ground_tile]
    params:
      dice: {type: dice, required: true, description_zh: 每個被撞到的敵人受到的物理傷害}
      on_hit: {type: on_hit, required: true, description_zh: 命中後的額外效果（knock_prone 擊倒、push_aside 推到路徑旁）}
  - id: leap
    name_zh: 跳躍
    description_zh: 施放者跳到射程內的指定空格：無視中間的單位與低矮（落差不超過 1 層）的地形，不能越過同時擋住行動與視線的物件（石柱）與牆；落點須可站立、沒有單位、與起點的高度差不超過 1 層。不觸發藉機攻擊，不算「本回合移動過」，也不觸發 on_move 被動；落點的陷阱與表面照常結算。定身或倒地時不能跳。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 3
    acts_on: caster
    allowed_shapes: [ground_tile]
  - id: swap
    name_zh: 交換位置
    description_zh: 施放者與目標單位（敵我皆可）交換位置。對敵人（affects 為 enemies）要過一般位移檢定（對抗判定：技能的縮放屬性 vs 目標同屬性；抵抗成功則不交換），不再另外擲命中；對友方（affects 為 allies）自動成功。不能和自己交換。交換後雙方的落點互動（表面、陷阱、致命地形、墜落）照常結算。不算「本回合移動過」，不觸發 on_move 被動。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    forbid_affects: [self, all, tiles]
    allowed_shapes: [single]
  # --- Phase 3D-2b：位移他人（docs/design/06-技能.md 6.19；點數為初值，未經模擬）---
  - id: teleport_target
    name_zh: 傳送他人
    description_zh: 兩段選取：射程內的一個單位（不能是自己）→ 射程內的落點（可站立、沒有單位的格子，或致命地形）。友方不檢定、一定成功；敵方要過抵抗（對抗判定：技能的縮放屬性 vs 目標同屬性，目標再加 teleport_enemy_resist_bonus）；落點是致命地形（深淵、岩漿）時目標再加 teleport_lethal_resist_bonus，成功率極低，失敗時目標不移動。Boss 對傳送到致命地形免疫（不能選）；傳送到一般格照常檢定。落點的陷阱、表面與致命地形照常結算，不觸發離開相鄰格的反應。必須搭配形狀 unit_then_tile，而且是技能唯一的效果。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 11
    acts_on: caster
    allowed_shapes: [unit_then_tile]
  - id: swap_any
    name_zh: 任意兩者互換
    description_zh: 選射程內的兩個單位（敵我皆可，不必包含施放者），互換位置；兩格都要能讓對方站上去。含敵人時每個敵方各自過一般位移檢定（對抗判定：技能的縮放屬性 vs 目標同屬性），任一個抵抗成功則整個互換失敗；全是友方時不檢定。落點的陷阱、表面與墜落照常結算。必須搭配形狀 unit_pair，而且是技能唯一的效果。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 12
    acts_on: caster
    allowed_shapes: [unit_pair]
  - id: apply_status
    name_zh: 施加狀態
    description_zh: 施加 statuses.yaml 中的狀態，重複施加時刷新持續時間。
    category: numeric
    harmful: true
    budget_basis: status
    params:
      status: {type: status, required: true}
      duration: {type: int, min: 1, max: 10}
  - id: create_surface
    name_zh: 產生表面
    description_zh: 在影響格產生表面（先查互動表，例如水熄滅火）；表面記錄施放者陣營。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: surface
    acts_on: tile
    params:
      surface: {type: surface, required: true}
      duration: {type: int, min: 1, max: 10}
  - id: destroy_object
    name_zh: 摧毀物件
    description_zh: 摧毀影響格中的可破壞物件。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: tile
  - id: create_obstacle
    name_zh: 產生障礙
    description_zh: 在影響格中的空格產生物件。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 3
    acts_on: tile
    params:
      object: {type: object, required: true}
  - id: raise_terrain
    name_zh: 隆起地形
    description_zh: 影響格的高度 +1（上限 3），站在上面的單位跟著升高。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: tile
    params:
      amount: {type: int, min: 1, max: 1}
  - id: lower_terrain
    name_zh: 下陷地形
    description_zh: 影響格的高度 −1（下限 0），站在上面的單位跟著下降（落差達門檻時墜落）。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: tile
    params:
      amount: {type: int, min: 1, max: 1}
  - id: intercept
    name_zh: 替隊友擋攻擊
    description_zh: 只能出現在 event 為 ally_hit_adjacent 的反應技。相鄰友方被單體攻擊命中後、傷害與其他效果結算之前，這次攻擊的所有效果改為作用在持有者身上（不重擲命中；位移方向重新計算；範圍技能不攔截）。守護者的護盾、減傷、抗性照常結算。點數為初值，未經模擬。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    acts_on: caster
    allowed_shapes: [self]
  # --- Phase 2E-3：層數與陷阱（點數為初值，未經模擬）---
  - id: add_stack
    name_zh: 累積層數
    description_zh: 依該層數（stacks.yaml）的 owner 把 amount 層加在施放者自己（affects 只能是 self；技能有對敵方的效果時，至少命中一名敵人才累積）或命中的目標（affects 只能是 enemies）身上，超過上限截斷。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: per_amount
    base_points: 2
    params:
      stack: {type: stack, required: true, description_zh: 層數 ID（stacks.yaml）}
      amount: {type: int, required: true, min: 1, max: 3, description_zh: 累積的層數}
  - id: consume_stack
    name_zh: 消耗層數
    description_zh: 消耗全部該層數（self 型從施放者、target 型從每個被命中的目標）；同一技能的傷害效果依消耗的層數 × per_stack_permille 加成（200 ＝ 每層 +20%）。沒有層數也可施放（加成 0）。預算以期望消耗＝上限的一半估算加成點數。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: consume_stack
    params:
      stack: {type: stack, required: true, description_zh: 層數 ID（stacks.yaml）}
      per_stack_permille: {type: int, required: true, min: 50, max: 500, description_zh: 每層的傷害加成（‰）}
  # --- Phase 3C-3b：狀態當燃料（docs/design/06-技能.md 6.14.2 管道 1；點數為初值，未經模擬）---
  - id: consume_status
    name_zh: 消耗狀態
    description_zh: 目標（affects，預設敵方，需命中）身上有 status 時先移除它，再對同一個單位結算 then 的效果（1–2 個，只能是 damage／heal／shield／apply_status，自動命中；施加狀態照常擲抵抗）。沒有該狀態的單位不受影響，全部都沒有時整個效果不結算（effect_fizzled）。scale 把 then 的傷害、治療、護盾骰數乘上倍率（上限見 rules/core.yaml 的 consume_status_max_scale）：remaining_rounds＝被消耗狀態的剩餘回合（永久狀態為 1）、stacks＝同時消耗目標身上 stack 的層數。splash 設為 1 時 then 也作用在被消耗者周圍 1 格內的敵方單位。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: consume_status
    params:
      status: {type: status, required: true, description_zh: 要消耗的狀態}
      then: {type: effects, required: true, description_zh: 移除狀態後結算的效果（1–2 個）}
      scale: {type: scale, description_zh: remaining_rounds 或 stacks（省略＝不倍增）}
      stack: {type: stack, description_zh: scale 為 stacks 時消耗的目標型層數}
      splash: {type: int, min: 1, max: 1, description_zh: then 也作用在被消耗者周圍這麼遠的敵方單位}
  - id: place_trap
    name_zh: 放置陷阱
    description_zh: 在目標格放一個對放置者陣營以外隱藏的陷阱，同一格只能有一個。陷阱帶著同一技能其餘的效果（自動命中，狀態照常擲抵抗；施放者的屬性在放置時快照），敵人進入（trap.trigger enter）或延遲回合數到了（delay）時，以陷阱格為中心依 trap.shape 結算。需要技能的 trap 欄位。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: fixed
    base_points: 2
    acts_on: caster
    allowed_shapes: [ground_tile]
  # --- Phase 3C-4a：改寫規則型原語（docs/design/06-技能.md 6.3、6.6；點數為初值，未經模擬）---
  # 每個技能最多 1 個（skill_budget.yaml 的 max_rule_rewrite）；必須每場限一次或冷卻至少
  # rule_rewrite_min_cooldown 回合，花源力（cost.source，傳說技能）時改為冷卻至少 rule_rewrite_min_cooldown_with_source。
  - id: grant_ap
    name_zh: 給予行動點
    description_zh: 目標（自己或友方）立刻獲得 amount AP（1–2），超過本回合上限（ap_per_turn ＋ ap_carry_max）的部分不保留；目標不在自己的回合時，在它下次回合開始時加上。同一單位每輪最多被給一次（之後的給予不結算，effect_fizzled）。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: per_amount
    base_points: 4
    forbid_affects: [enemies, all]
    params:
      amount: {type: int, required: true, min: 1, max: 2, description_zh: 給予的 AP}
  - id: reset_cooldown
    name_zh: 重置冷卻
    description_zh: 目標友方（不含施放者自己）的技能冷卻歸零：which 為 all 時全部技能、tag 時只有帶 tag 標籤的技能；花源力的技能（cost.source）與這個技能本身不會被重置。沒有可重置的冷卻時不結算（effect_fizzled）。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 7
    forbid_affects: [enemies, all, self]
    params:
      which: {type: which, required: true, description_zh: all 或 tag}
      tag: {type: tag, description_zh: which 為 tag 時必填：要重置的技能標籤}
  - id: cheat_death
    name_zh: 免死
    description_zh: 目標（自己或友方）獲得狀態「不死」（undying）duration 回合（省略時用狀態的預設持續）：期間 HP 會降到 0 時改為 1 並移除此狀態（墜落與致命地形照樣生效）。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 8
    forbid_affects: [enemies, all]
    params:
      duration: {type: int, min: 1, max: 2, description_zh: 不死的持續回合}
  # --- Phase 3C-4b：另外三個改寫規則型原語（同上：每技能最多 1 個、冷卻或源力規則；點數為初值，未經模擬）---
  - id: redirect_damage
    name_zh: 分擔傷害
    description_zh: 目標友方（不含施放者自己）獲得狀態「靈魂連結」（soul_link）duration 回合：它受到的傷害有 permille‰（≤ 500）轉給施放者，直接扣施放者的 HP。與替隊友擋下整次攻擊（intercept）不同；兩者同時存在時先攔截，傷害落在守護者身上之後才看守護者有沒有連結。施放者倒下或離場時連結消失。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 7
    forbid_affects: [enemies, all, self]
    params:
      permille: {type: int, required: true, min: 100, max: 500, description_zh: 轉移給施放者的傷害千分比}
      duration: {type: int, min: 1, max: 3, description_zh: 連結持續的回合（省略時用狀態的預設持續）}
  - id: copy_skill
    name_zh: 複製技能
    description_zh: 立即施放「本輪內最後一個被其他單位施放、且施放者看得到的主動技能」，由自己當施放者重新選目標；不能複製傳說、改寫規則型技能與有層數需求的技能。複製的技能不扣法力與 AP、不進冷卻，不檢查武器需求（傷害與射程照自己的武器算），但射程、視線與目標都要合法。沒有可以複製的技能時不能施放。必須是技能唯一的效果，形狀為 self。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: fixed
    base_points: 9
    acts_on: caster
    allowed_shapes: [self]
  - id: extra_reaction
    name_zh: 額外反應
    description_zh: 目標（自己或友方）本輪的反應次數上限 +amount（1），到下一輪開始為止。
    category: rule_rewrite
    harmful: false
    min_rarity: epic
    budget_basis: per_amount
    base_points: 7
    forbid_affects: [enemies, all]
    params:
      amount: {type: int, required: true, min: 1, max: 1, description_zh: 額外的反應次數}
  # --- Phase 3C-5a：場景物件原語（docs/design/06-技能.md 6.15；點數為初值，未經模擬）---
  - id: hurl_object
    name_zh: 投擲物件
    description_zh: 舉起 range 格內看得到的一個 pushable 物件，丟到落點格（形狀 object_then_tile；飛行路徑不檢查阻擋，落點要在視線內）。命中判定照技能，落點被命中的單位受 dice 物理傷害（不加屬性），knock_prone 為 true 時再以對抗判定擊倒。物件落地後依標籤結算：explosive 在落點爆炸、breakable 碎掉（摧毀）、其他放在落點；落點有單位或物件時放在 hurl_scatter_radius（rules/core.yaml）內最近的空格（同距離依 (y, x)），沒有空格或落點是致命地形就摧毀。預算為骰子平均 × 「需要附近有物件」折扣（skill_budget.yaml 的 hurl_object_discount_permille），擊倒另加 knock_prone 的點數。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: hurl_object
    allowed_shapes: [object_then_tile]
    params:
      range: {type: int, required: true, min: 1, max: 6, description_zh: 可以舉起的物件與施放者的最遠距離}
      dice: {type: dice, required: true, description_zh: 落點單位受到的物理傷害}
      knock_prone: {type: bool, description_zh: 命中時另外擊倒（對抗判定）}
  - id: topple
    name_zh: 推倒
    description_zh: 推倒目標（射程內看得到的 topplable 物件，技能只能以物件為目標），往遠離施放者的方向倒下：從下一格起壓住 topple_length 格（rules/core.yaml），壓到的單位受 topple_damage_dice 物理傷害並倒地、壓到的 breakable 物件受同樣傷害，其他物件擋住倒下；原物件移除，最後一格產生倒塌物。互動的推、技能的推擊與風推到 topplable 物件時也一樣會推倒它（通用規則）。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 6
    acts_on: tile
    allowed_shapes: [single]
  # --- Phase 3D-1：資源互動（docs/design/06-技能.md 6.16 H；點數為初值，未經模擬）---
  - id: restore_resource
    name_zh: 回復資源
    description_zh: resource 為 mana：目標（自己或友方）回復 amount 點法力，不超過法力上限；為 cooldown：目標所有技能的冷卻 −amount（最多 2，下限 0）。冷卻不影響花源力的技能（cost.source），也不影響施放中的這個技能。目標沒有法力空間或沒有冷卻中的技能時發出 effect_fizzled。預算：法力每點 restore_mana_point_permille‰、冷卻每回合 restore_cooldown_points 點（skill_budget.yaml）。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: restore_resource
    forbid_affects: [enemies, all]
    params:
      resource: {type: resource, required: true, description_zh: mana 回復法力、cooldown 縮短冷卻}
      amount: {type: int, required: true, min: 1, max: 10, description_zh: 回復的法力點數，或縮短的冷卻回合（最多 2）}
  - id: steal_buff
    name_zh: 奪取增益
    description_zh: 移除目標身上一個增益狀態（statuses.yaml 中 polarity 為 buff；有多個時取剩餘回合最長、同長依狀態 ID 排序），並以相同的剩餘回合與數值施加到施放者身上（已有同狀態時取較長者）。目標沒有增益時發出 effect_fizzled（no_buff）。
    category: structural
    harmful: true
    min_rarity: rare
    budget_basis: fixed
    base_points: 4
    forbid_affects: [allies, all, self]

  # --- Phase 3D-4a：召喚（docs/design/06-技能.md 6.16 B；點數為初值，未經模擬）---
  - id: summon
    name_zh: 召喚
    description_zh: 在目標格（形狀 ground_tile；必須可站立、不是致命地形、沒有單位）召喚 unit 範本（content/units/summons/）的召喚物，屬於施放者陣營，由效用 AI 控制。召喚物緊接在召喚者之後行動（插入先攻順序，不擲先攻；同一召喚者的召喚物依召喚順序排在一起），持續 duration 輪：在召喚者第 duration 次回合結束時消失（施放當回合不算）；召喚者倒下或撤離時一併消失。同一召喚者同時存在的召喚物超過 summon_limit_per_owner（core.yaml）時，最舊的消失。召喚物沒有源力、不取用源泉、不計入勝負條件、不能撤離。必須是主動技能，其餘效果只能作用在施放者自己。
    category: structural
    harmful: false
    min_rarity: rare
    budget_basis: summon
    acts_on: caster
    allowed_shapes: [ground_tile]
    params:
      unit: {type: summon, required: true, description_zh: 召喚物範本 ID（content/units/summons/）}
      duration: {type: int, required: true, min: 1, max: 4, description_zh: 召喚物存在的輪數}
      count: {type: int, min: 1, max: 1, description_zh: 一次召喚的數量（目前只能是 1；省略為 1）}
