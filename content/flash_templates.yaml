  - {id: support_imbue, category: bridge, op: support_imbue, only: support, prefix_zh: 附帶, summary_zh: "橋接{keyword}：施放時在目標腳下留下{keyword}的場地", headline_zh: "目標腳下留下{keyword}的場地"}
  - {id: shield_potency, category: deepen, op: shield_potency, only: shield, prefix_zh: 厚實, summary_zh: 加深：護盾量提高（依預算）, headline_zh: "護盾更厚"}
  - {id: shield_thorns, category: deepen, op: shield_status, only: shield, status: shielded_thorns, prefix_zh: 荊棘, summary_zh: 加深：護盾附反傷（吸收近戰攻擊時，對攻擊者反彈物理傷害）, headline_zh: "護盾被近戰打到時反彈傷害", say_zh: "護盾擋下近戰攻擊時，對攻擊者反彈一點物理傷害。"}
  - {id: shield_mending, category: deepen, op: shield_status, only: shield, status: shielded_mending, prefix_zh: 回春, summary_zh: 加深：護盾結束時（打破或到期）回復少量生命, headline_zh: "護盾結束時回一點血", say_zh: "護盾被打破或時間到時，你會回一點血。"}
  - {id: shield_wet, category: bridge, op: shield_status, only: shield, status: shielded_wet, keyword: wet, prefix_zh: 水幕, summary_zh: 橋接潮濕：護盾被打破時，在自己腳下造出一灘水, headline_zh: "護盾破掉時，腳下積一灘水", say_zh: "護盾被打破時，腳下積一灘水。"}
  - {id: shield_marking, category: bridge, op: shield_status, only: shield, status: shielded_marking, keyword: marked, prefix_zh: 烙印, summary_zh: 橋接標記：護盾被打破時，對打破它的攻擊者施加標記, headline_zh: "護盾破掉時，標記打破它的敵人", say_zh: "護盾被打破時，標記打破它的敵人。"}
