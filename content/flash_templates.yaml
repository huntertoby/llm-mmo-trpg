  - id: mod_stack
    category: modifier
    usage_base: 1
    op: mod_stack
    kinds: [modifier]
    prefix_zh: 疊勢
    summary_zh: 計數上限 +1：依空欄位計算的加成多算 1 格（幅度依預算調整）
    headline_zh: "計算加成時多算 1 格"
  - id: mod_cooldown
    category: modifier
    usage_base: 1
    op: mod_cooldown
    kinds: [modifier]
    prefix_zh: 迴轉
    summary_zh: 冷卻：命中後冷卻 −1 加深成 −2（幅度依預算調整）
    headline_zh: "命中後冷卻減得更多"
  - id: mod_cost
    category: modifier
    usage_base: 1
    op: mod_cost
    kinds: [modifier]
    prefix_zh: 減負
    summary_zh: 代價減輕：附帶的代價（傷害降低、命中降低……）減輕一級，不會變成沒有代價（其他幅度依預算調整）
    headline_zh: "附帶的代價變輕"
  # 專注（修正型被動，BAL-10e，#75）：作用範圍收回一級，或規則的條件收緊一級，換成修正幅度
  - id: focus_mod_range
    category: modifier
    op: focus_mod_range
    kinds: [modifier]
    prefix_zh: 專注
    summary_zh: 專注：作用範圍收回一級（範圍、射程 −1），省下的預算全部換成修正幅度
    headline_zh: "作用範圍收小，換更大的加成"
  - id: focus_mod_condition
    category: modifier
    op: focus_mod_condition
    kinds: [modifier]
    prefix_zh: 專注
    summary_zh: 專注：條件收緊一級（沒有條件 → 目標血量低於 50%；血量門檻收緊；「或」拿掉一支），換成修正幅度
    headline_zh: "條件變嚴，換更大的加成"

