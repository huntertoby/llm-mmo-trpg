    headline_zh: "敵人身上有{keyword}時，這招多傷一截"
  # 精煉（BAL-10e，#75；06 6.34.4「收回家族」）：拿掉一個附帶效果（附帶狀態、第二元素、第二關鍵字、接續段），
  # 拿掉的預算＋這次的 +40‰ 全部換成主要效果的威力（trpg.skillgen.flash_reclaim；共用 trpg.skillgen.flash_trade）。
  - id: refine
    category: element
    op: refine
    kinds: [active]
    prefix_zh: 精煉
    summary_zh: 精煉：拿掉一個附帶效果（附帶狀態、第二元素、第二關鍵字或接續段），省下的預算全部換成主要效果的威力
    headline_zh: "拿掉附帶效果，主要效果更強"
    skeletons: [strike, combo]   # 拿掉附帶效果後原骨架不合適時（例：控制技拿掉狀態）依序改試打擊、連擊
  # ---- 延長與收割 ----
  - id: extend_duration
    category: extend
    op: extend
    generic: true
    prefix_zh: 恆久
    summary_zh: 延長：這招的狀態、表面與區域多持續 1 回合（效果依預算調整）
    headline_zh: "效果多持續 {n} 回合"
  - id: summon_toughen
    category: extend
    op: summon_toughen
    kinds: [active]
    generic: true
    prefix_zh: 強壯
    summary_zh: 強壯：召喚物的最大生命再多一截（召喚技能的小變化，強度固定所以靠這個補）
