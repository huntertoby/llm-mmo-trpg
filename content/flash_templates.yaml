  # BAL-19e（#110「閃現的姿態變化模板補到約 10 種」）：進入代價 +1 的反向——進入時的法力或耐力 +1，姿態本體提高一級；
  # 維持費不動（#67）；變身姿態不出（BAL-10c）；進入冷卻不算代價（BAL-10c），不列
  - id: stance_enter_heavy
    category: cost
    op: stance_enter_heavy
    kinds: [stance]
    cost_fields: [mana, stamina]
    prefix_zh: 沉勢
    summary_zh: 進入代價 +1：進入姿態的法力或耐力 +1，姿態效果提高一級（維持費不變）
    headline_zh: "進入姿態多付一點，效果強一級"
  # ---- 輔助（治療、護盾、增益） ----
  - id: support_potency
    category: support
    op: potency
    generic: true
    prefix_zh: 強效
    summary_zh: 效果 +（治療、護盾、增益依預算提高）
    headline_zh: "這招給的效果更強"
  - id: support_area
    category: support
    op: area
    delta: 1
    prefix_zh: 廣布
    summary_zh: 範圍 +1（效果依預算調整）
    headline_zh: "範圍變大 {n} 格，照顧更多人"
  - id: support_area_wide
    category: support
    op: area
    delta: 2
