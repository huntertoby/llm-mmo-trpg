# 與召喚技能（沿用 3-33f2 的三支）。op 的實作在 trpg.skillgen.flash_major。
extra_major:
  - {id: support_wide, category: deepen, op: support_wide, only: support, prefix_zh: 廣佈, summary_zh: 加深：影響範圍擴大 1 格，多照顧一個人（效果依預算調整）, headline_zh: "範圍變大，多照顧一個人"}
