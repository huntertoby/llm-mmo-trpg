  - {id: summon_deepen, category: deepen, op: summon_deepen, only: summon, prefix_zh: 強化, summary_zh: 加深：召喚物更強壯，並多一個小特性, headline_zh: "召喚物更強，還多一個小本事"}
  - {id: summon_count, category: deepen, op: summon_count, only: summon, prefix_zh: 雙生, summary_zh: 加深：一次召喚 2 隻較弱的召喚物, headline_zh: "一次召出 2 隻，各自弱一點", say_zh: "一次召出 2 隻，每隻比原本弱，但能分頭行動、多擋一個位置。"}
