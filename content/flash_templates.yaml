    say_zh: "這個反應觸發時，你所有技能的冷卻都少 1 回合。"
  # 專注（BAL-10e，#75；06 6.34.4「收回家族」）：觸發範圍收回一級，或觸發條件收緊一級，換成觸發效果的威力
  - id: focus_range
    category: trigger
    op: focus_range
    prefix_zh: 專注
    summary_zh: 專注：觸發範圍收回一級，省下的預算全部換成觸發效果（依預算）
    headline_zh: "觸發範圍收小，換更強的效果"
  - id: focus_condition
    category: trigger
    op: focus_condition
    prefix_zh: 專注
    summary_zh: 專注：觸發條件收緊一級（例：被攻擊時 → 被近戰攻擊時；沒有條件 → 目標血量低於 50%），換成觸發效果（依預算）
    headline_zh: "觸發條件變嚴，換更強的效果"
  # ---- 修正（修正型被動、姿態） ----
  - id: mod_potency
    category: modifier
    usage_base: 2
    op: mod_potency
    kinds: [modifier]
    generic: true
    prefix_zh: 強效
    summary_zh: 修正幅度 +（依預算提高）
