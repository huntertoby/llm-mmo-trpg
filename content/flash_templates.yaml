# 白板技能的閃現（靈光一閃）（Phase 3W-1，docs/design/06-技能.md 6.34；玩法決定 #69、#70）。
#
# 花靈感點指定一招技能，跳出幾個「變化」，選 1 個套用。每次閃現讓這招的預算上限 +budget_step_permille‰
# （佔同階預算），套用變化之後由預算器依新的上限重調強度（trpg.skillgen.flash），仍受 6.6 硬上限約束。
# 模板只描述「怎麼改」，不寫強度。op 沒有實作的模板不會出現（實作在 trpg.skillgen.flash_ops）。
# 選項由種子衍生：標籤 flash/<技能>/<第幾次>/<重閃次數>[/<指定類別>]，同種子同選項，可重播。

rules:
  max_flashes: 5              # 每招最多閃 5 次
  major_flash: 3              # 第 3 次是大變化（加深、橋接；有合法轉型時轉型一定是選項之一）
  budget_step_permille: 40    # 每次閃現：預算上限 +40‰（初值；5 次共 +200‰）
  needs_use: true             # 自上次閃現（或取得）後要先上場用過
  reflash_needs_use: false    # 重閃不需要先上場用過，也不增加閃現次數
  dissolve_refund_permille: 500  # 溶掉技能退回花在它身上的靈感點的一半，無條件捨去（#71）
  insight_per_win: 2          # BAL-1（玩法 PM 204014e9, 06 6.34.2）：原型專用，每打贏一場 2 點靈感
  insight_start: 0            # 開局給的靈感點（BAL-1 經濟旋鈕，預設 0＝不給）
  insight_preboss: 0          # 打贏最後一場一般戰鬥（下一場是 Boss）額外加給的點數（BAL-1，預設 0）
  usage_min_uses: 3           # 這招的放出次數少於這個數，用法統計不夠，先出通用變化（generic）
  # 沒有階梯的單一狀態姿態（狂怒、堅壁…，BAL-2b）費用／修正類可換到的姿態幅度（‰）；比完整技能寬，角色階級高時靠它補預算
  stance_magnitudes: [1000, 1040, 1080, 1120, 1160, 1200, 1250, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000]
  # 變身姿態（BAL-2c）修正類與升階重配可換到的形態幅度（‰，上限 2000）：每 50 一格，比上面細——升階把形態拉到接近原本的
  # 比例（約 99%）後，一次閃現的 +40‰ 預算仍放得下下一格
  # BAL-10b：修正型被動沒有正的傷害／治療幅度時，強效（mod_potency）與持續、計數、冷卻、代價減輕這幾個修正模板
  # 可以重調的其他幅度（由弱到強）。形態維持費照 #67 不列；冷卻、召喚持續輪數有自己的模板，也不列。
  modifier_knobs:
    summon_hp_permille: [100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000]
    summon_damage_permille: [100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000]
    form_entry_permille: [100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000]
    push_distance_delta: [1, 2]
  modifier_on_hit_dice: true  # 命中後效果的骰子也當旋鈕
  modifier_fine_step: 5       # 新增的修正模板重調傷害／治療‰ 的階梯間距（結構一變點數常跳太多，要能往下補）
  # BAL-11b（玩法 PM 2026-10-31，06 6.34.4「BAL-11a 定」）：細階梯只用在閃現——「強效」的修正傷害每 10‰（原 50～1000 每 25）、
  # 接續段強化類的接續段武器倍率每 25‰（3000‰ 以下，原每 100）；升階重配、完整技能、形態幅度照舊
  modifier_potency_step: 10
  followup_multiplier_step: 25
  # BAL-12b 定（玩法 PM 2026-10-31，06 6.34.4）：
  #   trigger_flat_bonus  被動、反應「效果 +」骰子一階跳過預算窗時，法術傷害再試 +1 固定值（damage.flat_bonus）
  #   area_trap_shapes    「範圍 +1」用在陷阱：觸發範圍依序換到下一個
  #   area_tile_shapes    「範圍 +1」用在地面格：指定格 → 十字（半徑 +1）
  #   extend_effects      「延長」原本的狀態／表面／區域延長不了時，改延長這些效果的回合（召喚物存活、障礙、刻印）
  #   extend_trap         「延長」也加陷阱持續回合（trap.rounds +1）
  trigger_flat_bonus: 1
  area_trap_shapes: [single, cross, square3]
  area_tile_shapes: [ground_tile, cross]
  extend_effects: [summon, create_obstacle, inscribe]
  extend_trap: true
  modifier_drawback_step: 100 # 代價減輕（mod_cost）：負的傷害／治療‰ 往 0 減輕多少
  # 收回家族（收束起，BAL-10d，06 6.34.4）的單發上限：一次施放對單一目標的期望傷害（治療／護盾同理）最多是
  # 同階、同 AP 單體技能預算（tier_budget × AP 係數）的這麼多‰（初值 3 倍）；超過的預算改成減費用，減不動就不出
  single_hit_cap_permille: 3000
  # 收束的用法分數（BAL-10d2，玩法 PM 2026-10-31；原型 AI 權重）：放過、平均命中目標數 < 1.5（‰ 門檻）時加分；
  # 換形狀在同樣條件下是 2 分，給 3 分讓常打單體的範圍技先看到收束
  converge_targets_permille: 1500
  converge_usage_score: 3
  # 專注的條件收緊一級（BAL-10e2，06 6.34.4「BAL-10e 定」）：預算器不幫條件計價，固定視為拿掉這麼多‰，加這次的 +40‰ 一起換
  tighten_permille: 100
  form_magnitudes: [1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350, 1400, 1450, 1500, 1550, 1600, 1650, 1700, 1750, 1800, 1850, 1900, 1950, 2000]
  complete:                   # 完整技能（6.34.6）：視為已閃 3 次、+120‰、不能再閃、可以重閃
    flashes: 3
    budget_permille: 120
    cap_permille: 150         # 實際加上去的上限；一步超過時先用較細的旋鈕補（06 6.34.6）
    stop_over_permille: 200   # BAL-12b 定：都不行時若會超過 +200‰，改停在 +120‰ 以下最接近的一階
    modifier_step: 5          # BAL-12b 定：完整技能的修正幅度每 5‰ 一格（只用在完整技能）
    can_flash: false
    can_reflash: true
    # +120‰ 怎麼加上去（3W-5b）：預算器的強度旋鈕（傷害、治療、護盾、推拉）照舊，召喚與姿態另外多一個旋鈕，
    # 一起重調到預算分數 ≥ 原本 ×1.12。數值是倍率（‰），從 1000（不變）往上。
    summon_power_steps: [1000, 1040, 1080, 1120, 1160, 1200, 1250, 1300]     # 召喚物 HP 與傷害（乘在 power_permille 上）
    stance_magnitude_steps: [1000, 1040, 1080, 1120, 1160, 1200, 1250, 1300] # 姿態幅度（有利那一邊離 100% 的距離）
    status_magnitude_steps: [1000, 1040, 1080, 1120, 1160, 1200, 1250, 1300] # BAL-12e：數值型狀態與表面的強度（和持續回合同一組加）
    # 仍然沒有可加的數值時，依序一次減一格代價（維持費、冷卻、法力、耐力、AP），直到 +120‰ 或沒有能減的
    cost_cuts:
      - {field: stance_upkeep, step: 1}
      - {field: cooldown, step: 1}
      - {field: mana, step: 1}
      - {field: stamina, step: 1}
      - {field: ap_cost, step: 1}

# 出題方式（#70，使用者：「選擇 類別 多花1點」）。重閃和閃現同價。
pricing:
  open:                       # 不指定類別：花 1 點，出 4 個混合變化，至少涵蓋 2 類
    cost: 1
    options: 4
    min_categories: 2
  focused:                    # 指定類別：花 2 點，從該類出 3 個（類別內依用法統計排序）
    cost: 2
    options: 3
  reflash_same_price: true
  allow_focus: true
  transform_guaranteed: true  # 第 3 次（或重閃第 3 次）有合法轉型時一定是選項之一；指定加深／橋接時另列第 4 個

# 輔助技的判定（support_only 類別用；3W-R2 從程式移到資料）：沒有 harm_effects，而且有 help_effects，
# 或有作用於友方（affects: allies）的 ally_effects。
support:
  harm_effects: [damage, delayed_damage]
  help_effects: [heal, shield]
  ally_effects: [heal, shield, apply_status, cleanse, grant_ap]

# 變化類別。kinds：可以出這類的技能種類；support_only：只給輔助技（治療、護盾、增益，沒有傷害）。
# 姿態可以出「修正」「費用」兩類（玩法 PM 3W-2）。3W-2b：姿態有每招維持費欄位（SkillDef.stance_upkeep），
# 元素姿態（stance_ladders）的費用類＝維持費 ±1 搭配效果降低／提高，修正類＝同維持費換到較高級。
# BAL-2b：沒有階梯的單一狀態姿態（狂怒、堅壁…）也適用——費用類＝維持費 ±1 搭配姿態幅度（rules.stance_magnitudes）
# 降低／提高，修正類＝同維持費、幅度提高。
# BAL-2c：變身姿態只出修正類＝形態幅度（enter_form.magnitude_permille，級距 rules.form_magnitudes）提高；維持費照形態種類
# 固定（#67），形態上沒有其他可動的代價，所以費用類不出。
# BAL-10b 曾放寬費用類到變身姿態（進入冷卻 ±1），BAL-10c 玩法 PM 2026-10-31 收回：姿態進入後一直持續到取消，
# 進入冷卻幾乎不是代價，所以變身姿態仍只出修正類（BAL-2c）；stance_cost_light／heavy 的 cost_fields 保持空。
# 多效果姿態只動姿態本體那個效果。
categories:
  - {id: area, name_zh: 範圍, kinds: [active]}
  - {id: combo, name_zh: 連段, kinds: [active]}
  - {id: element, name_zh: 元素與關鍵字, kinds: [active, passive, reaction]}
  - {id: cost, name_zh: 費用, kinds: [active, stance]}    # 蓄力或輕巧（主動技）；姿態＝維持費 ±1（元素姿態階梯）
  - {id: extend, name_zh: 延長與收割, kinds: [active, passive, reaction]}
  - {id: support, name_zh: 輔助, kinds: [active], support_only: true}
  - {id: trigger, name_zh: 觸發, kinds: [passive, reaction]}
  - {id: modifier, name_zh: 修正, kinds: [modifier, stance]}   # 修正型被動、姿態
  - {id: deepen, name_zh: 加深, stage: major, kinds: [active, passive, reaction, stance, modifier]}
  - {id: bridge, name_zh: 橋接, stage: major, kinds: [active, passive, reaction, stance, modifier]}

# 小變化模板（第 1、2、4、5 次）。op 的實作在 trpg.skillgen.flash_ops。generic: true 是「通用變化」
# （用法統計少的技能先出這些，usage_min_uses 見 rules）。強度不寫在這裡，套用後由預算器重調。
minor:
  # ---- 範圍 ----
  - id: area_plus
    category: area
    op: area
    delta: 1
    generic: true
    prefix_zh: 擴展
    summary_zh: 範圍 +1（傷害依預算調整）
    headline_zh: "範圍變大 {n} 格"
  - id: range_plus
    category: area
    op: range
    delta: 1
    generic: true
    prefix_zh: 遠射
    summary_zh: 距離 +1（傷害依預算調整）
    headline_zh: 射程變遠 {n} 格        # FL-1b（移植需求 8.2、9.1 #29）
    say_zh: "{shape}照舊，中心最遠可以放到 {range} 格外。"   # FL-1b 9.3 第 1 個
  - id: reshape_shape
    category: area
    op: reshape
    prefix_zh: 擴散
    summary_zh: 換形狀（直線 3、錐形 2、十字）：一次打到更多目標（傷害依預算調整）
    headline_zh: "換個形狀，一次打到更多敵人"
    shapes:
      - {type: line, size: 3}
      - {type: cone, size: 2}
      - {type: cross, range: 3}
  - id: reshape_square3
    category: area
    op: reshape
    min_tier: 2
    prefix_zh: 方陣
    summary_zh: 換成 3×3（傷害依預算調整）
    headline_zh: "範圍換成 3×3，一次打到更多敵人"
    shapes:
      - {type: square3, range: 4}
  - id: reshape_line6
    category: area
    op: reshape
    min_tier: 3
    prefix_zh: 貫穿
    summary_zh: 換成整排直線（長度 6，傷害依預算調整）
    headline_zh: "換成一整排直線，貫穿 6 格"
    shapes:
      - {type: line, size: 6}
  - id: reshape_chain
    category: area
    op: reshape
    min_tier: 3
    prefix_zh: 連鎖
    summary_zh: 換成連鎖跳躍（再跳 2 次，傷害依預算調整）
    headline_zh: "換成連鎖，打中後再跳到 2 個敵人"
    shapes:
      - {type: chain, range: 4, jumps: 2, jump_range: 2}
  # BAL-10b：複合技的接續段範圍、距離（第一段形狀不動）
  - id: followup_area
    category: area
    op: followup_area
    delta: 1
    kinds: [active]
    prefix_zh: 延展
    summary_zh: 接續段範圍 +1（傷害依預算調整）
    headline_zh: "後面那一段範圍變大 {n} 格"
  - id: followup_range
    category: area
    op: followup_range
    delta: 1
    kinds: [active]
    prefix_zh: 長驅
    summary_zh: 接續段距離 +1（傷害依預算調整）
    headline_zh: "後面那一段射程變遠 {n} 格"
  # 地形變化（#58 的稀有度門檻 → 3W 改成最低角色階級；只有升降地形的技能套得上）：影響格數 4～6 格 2 階、7 格以上 3 階
  - id: terrain_mid
    category: area
    op: terrain_area
    min_tier: 2
    min_cells: 4
    max_cells: 6
    prefix_zh: 隆起
    summary_zh: 地形變化：升降地形的影響範圍擴大到 4～6 格（十字），必要時附帶少量落石傷害（強度由預算補）
    headline_zh: "地形變化的範圍變大"
    shapes:
      - {type: cross, range: 4}
  - id: terrain_wide
    category: area
    op: terrain_area
    min_tier: 3
    min_cells: 7
    prefix_zh: 崩山
    summary_zh: 地形變化：升降地形的影響範圍擴大到 7 格以上（3×3 或更大），必要時附帶少量落石傷害（強度由預算補）
    headline_zh: "地形變化的範圍大幅變大"
    shapes:
      - {type: square3, range: 4}
      - {type: allies_in_radius, radius: 2}
  # 合體（BAL-10e，#75；BAL-10e2 玩法 PM 改歸「範圍」：數量換強度，同收束）：一次召喚 2 隻以上的召喚技，隻數 −1，
  # 換成召喚物更強（最大 HP，照強壯 summon_toughen 的階梯）。
  - id: fuse
    category: area
    op: fuse
    kinds: [active]
    prefix_zh: 合體
    summary_zh: 合體：召喚隻數 −1，省下的預算全部換成召喚物的生命（一隻時恢復完整強度）
    headline_zh: "召喚物合成一隻，更耐打"
  # 收束（BAL-10d，#74；06 6.34.4「收束」「收回家族」）：把範圍收小，省下的預算＋這次的 +40‰ 全部換成威力
  # （trpg.skillgen.flash_trade）。只對有傷害／治療／護盾量的主動技；BAL-10e 補陷阱（觸發範圍）與地面格（持續區域
  # 裡的傷害／治療／護盾）；複合技只動第一段形狀；
  # 範圍造的表面、區域跟著縮。單發上限見 rules.single_hit_cap_permille。排在範圍類最後；常打單體時靠用法分數往前（BAL-10d2）。
  - id: converge_single
    category: area
    op: converge_single
    prefix_zh: 收束
    summary_zh: 收成單體：範圍收成一個目標，省下的預算全部換成威力（以自己為中心的改成射程 1）
    headline_zh: "範圍收成單一目標，換更高的傷害"
    skeletons: [strike, combo]   # 範圍骨架不允許單體：依序改試打擊、連擊（原骨架允許單體時照舊）
  - id: converge_step
    category: area
    op: converge_step
    prefix_zh: 收束
    summary_zh: 縮小一級：直線、錐形長度 −1，或 3×3 改十字，省下的預算全部換成威力
    headline_zh: "範圍縮小一級，換更高的傷害"
  # ---- 連段 ----
  - id: multi_hit
    category: combo
    op: multi_hit
    prefix_zh: 連打
    summary_zh: 多打一下：同一個目標多一段命中（每段傷害依預算調整）
    headline_zh: "同一個敵人多挨一段"
  - id: followup_hit
    min_tier: 2
    category: combo
    op: followup
    prefix_zh: 追擊
    summary_zh: 接續段：命中後再接一小段傷害（6.23 複合技，傷害依預算調整）
    headline_zh: "打中後再補一小段傷害"
  # BAL-10b：複合技的接續段強化（複合技不改第一段形狀、也不再加接續段，改強化已有的接續段）
  - id: followup_potency
    category: combo
    op: followup_potency
    kinds: [active]
    prefix_zh: 續勁
    summary_zh: 接續段強化：接續段的傷害提高（依預算）
    headline_zh: "後面那一段更痛"
  # 精煉・多段併一段（BAL-10e，#75；06 6.34.4「收回家族」）：同一目標的多段同元素傷害併成一段，總量不變、只換成單發
  - id: refine_merge
    category: combo
    op: refine_merge
    kinds: [active]
    prefix_zh: 精煉
    summary_zh: 多段併一段：同一目標的幾段傷害併成一段單發（總量不變，依預算換成威力）
    headline_zh: "幾段傷害併成一次重擊"
  # ---- 元素與關鍵字 ----
  - id: element_second
    min_tier: 2
    category: element
    op: element
    prefix_zh: 雙元
    summary_zh: 加第二元素：多一段別種元素的傷害（傷害依預算調整）
    headline_zh: "多帶一段{keyword}傷害"
    elements: [fire, ice, lightning, poison, wind, earth, holy, shadow]
  - id: followup_element
    min_tier: 2
    category: element
    op: followup_element
    kinds: [active]
    prefix_zh: 雙元
    summary_zh: 接續段加第二元素：接續段多一段別種元素的傷害（傷害依預算調整）
    headline_zh: "後面那一段多帶{keyword}傷害"
    elements: [fire, ice, lightning, poison, wind, earth, holy, shadow]
  - id: dual_scaling
    min_tier: 3
    category: element
    op: dual_scaling
    prefix_zh: 雙修
    summary_zh: 雙屬性縮放：加第二縮放屬性（命中與傷害取兩個屬性的平均）
    headline_zh: "威力多看一個屬性"
  - id: keyword_imbue
    category: element
    op: keyword_imbue
    prefix_zh: 附魔
    summary_zh: 加第二個關鍵字：命中時額外製造該關鍵字
    headline_zh: "打中時還會造成{keyword}"
  - id: keyword_exploit
