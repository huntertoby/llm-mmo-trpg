  - id: mod_keyword
    category: modifier
    op: mod_keyword
    kinds: [modifier]
    prefix_zh: 雙引
    summary_zh: 加第二個關鍵字：條件變成「原條件，或另一個關鍵字的條件」（幅度依預算調整）
    headline_zh: "條件多一種：{keyword}也算"
  - id: stance_potency
    category: modifier
    usage_base: 2
    op: stance_potency
    kinds: [stance]
    generic: true
    prefix_zh: 強效
    summary_zh: 姿態效果 +（元素傷害加成與小特色提高一級，維持費不變）
    headline_zh: "姿態效果強一級"
  # 姿態附帶（BAL-19e，#110「閃現的姿態變化模板補到約 10 種」；06 6.34.4 姿態的「修正」類）：進入姿態時多一個作用於
  # 自己的效果（trpg.skillgen.flash_ops 的 self_rider）。只給只有姿態本體一個效果的姿態（骨架附帶最多 1 個；變身姿態
  # 的進入形態必須是唯一效果，不出）。姿態技能只能施加姿態狀態，所以附帶不用狀態（加速、隱蔽不行）。rider 的數值只是起點：先試本體不變、由預算器重調附帶的骰子，放不進預算時本體降一級
  - id: stance_ward
    category: modifier
    usage_base: 1
    op: self_rider
    kinds: [stance]
    rider: {type: shield, dice: 1d4, affects: self}
    prefix_zh: 護體
    summary_zh: 姿態附帶護盾：進入姿態時得到一層護盾（護盾量依預算）
    headline_zh: "進入姿態時得到一層護盾"
  - id: stance_mend
    category: modifier
    usage_base: 1
    op: self_rider
    kinds: [stance]
    rider: {type: heal, dice: 1d4, affects: self}
    prefix_zh: 調息
    summary_zh: 姿態附帶治療：進入姿態時回復生命（治療量依預算）
    headline_zh: "進入姿態時回一點血"
  - id: stance_refocus
    category: modifier
    usage_base: 1
    op: self_rider
    kinds: [stance]
    rider: {type: restore_resource, resource: cooldown, amount: 1, affects: self}
    prefix_zh: 凝神
    summary_zh: 姿態附帶回氣：進入姿態時自己所有技能的冷卻 −1（必要時姿態效果降一級）
    headline_zh: "進入姿態時所有技能的冷卻 −1"
  - id: stance_channel
    category: modifier
    usage_base: 1
    op: self_rider
    kinds: [stance]
    rider: {type: restore_resource, resource: mana, amount: 2, affects: self}
    prefix_zh: 蓄能
    summary_zh: 姿態附帶回魔：進入姿態時回復法力（回復量依預算）
    headline_zh: "進入姿態時回一點法力"
  - id: stance_cleanse
    category: modifier
    usage_base: 1
    op: self_rider
    kinds: [stance]
    rider: {type: cleanse, affects: self}
    prefix_zh: 澄心
    summary_zh: 姿態附帶淨化：進入姿態時移除自己身上的減益（必要時姿態效果降一級）
    headline_zh: "進入姿態時清掉身上的減益"
  - id: mod_relax
    category: modifier
    usage_base: 1
    op: mod_relax
    kinds: [modifier]
    prefix_zh: 寬限
    summary_zh: 條件放寬一級：血量門檻放寬，或多一個「或」分支（幅度依預算調整）
    headline_zh: "條件放寬，更容易成立"
  # BAL-10b：修正型被動的持續、計數上限、冷卻、代價（其他幅度依預算調整；沒有傷害／治療幅度時用 rules.modifier_knobs）
  - id: mod_duration
    category: modifier
