  - id: kill_refund
    category: extend
    op: kill_refund
    prefix_zh: 收割
    summary_zh: 擊殺返還 1 AP
    headline_zh: "打倒敵人時拿回 1 AP"
    say_zh: "這招打倒敵人時，馬上拿回 1 AP，可以接著行動。"
    kinds: [active]
  # ---- 費用方向（只限主動技；姿態改維持費，待引擎欄位） ----
  - id: cost_charge
    category: cost
    op: charge
    kinds: [active]
    prefix_zh: 蓄力
    summary_zh: 蓄力：冷卻 +2（最多 5 回合），威力提高
    headline_zh: 多等幾回合再用，換這招變強   # FL-1b（9.1 #30）；下固定區的一句話照差異清單組（9.3 第 2 個）
  - id: cost_light
    category: cost
    op: light
    kinds: [active]
    prefix_zh: 輕巧
    summary_zh: 輕巧：AP −1（最少 1）、冷卻縮短，威力降低；AP 已是 1 時改成冷卻或資源 −1（每項最少留 1）
    headline_zh: 省一點代價，這招弱一點     # FL-1b（9.1 #30）
    cost_fields: [cooldown, mana, stamina]   # BAL-12b 定：AP 已是 1 時依序試這些代價 −1
  # BAL-10c（玩法 PM 2026-10-31）：cost_fields 清空，變身姿態不出費用類（回到 BAL-2c）——姿態進入後一直持續，
  # 進入冷卻幾乎不是代價；多效果姿態只動姿態本體那個效果
