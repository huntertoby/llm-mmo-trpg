  # 一起重調。BAL-19e 同時讓「觸發範圍 +1／+2」用在反應的單體射程（原本只看觸發距離與形狀大小，反應套不上）
  - id: reaction_ward
    category: trigger
    usage_base: 1
    op: self_rider
    kinds: [reaction]
    rider: {type: shield, dice: 1d4, affects: self}
    prefix_zh: 護身
    summary_zh: 附帶護盾：反應觸發時，自己也得到一層護盾（強度依預算重新分配）
    headline_zh: "觸發時自己也得到一層護盾"
    say_zh: "這個反應觸發時，你自己也會得到一層護盾。"
  - id: reaction_refocus
    category: trigger
    usage_base: 1
    op: self_rider
    kinds: [reaction]
