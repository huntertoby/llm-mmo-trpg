    category: cost
    op: stance_light
    kinds: [stance]
    prefix_zh: 輕巧
    summary_zh: 輕巧：姿態維持費 −1，效果降低一級
    headline_zh: "維持費少 {n}，姿態效果弱一點"
  - id: stance_cost_heavy
    category: cost
    op: stance_heavy
    kinds: [stance]
    prefix_zh: 蓄力
    summary_zh: 蓄力：姿態維持費 +1，效果提高
    headline_zh: "維持費多 {n}，姿態效果強一點"
  # BAL-10b／10c：進入代價 −1——只減進入時的施放費用（冷卻、法力、耐力，每項最少留 1；姿態的進入 AP 由規則固定），維持費不動
  - id: stance_enter_light
    category: cost
    op: stance_enter_light
    kinds: [stance]
    cost_fields: [ap_cost, cooldown, mana, stamina]
    prefix_zh: 俐落
    summary_zh: 進入代價 −1：進入姿態的冷卻、法力或耐力 −1（最少留 1；維持費不變，效果不變）
