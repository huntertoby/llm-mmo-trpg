    prefix_zh: 遍布
    summary_zh: 範圍 +2（光環類，效果依預算調整）
    headline_zh: "光環範圍變大 {n} 格"
  - id: support_keyword
    category: support
    op: keyword_imbue
    prefix_zh: 附帶
    summary_zh: 附帶第二個關鍵字（例：治療時造水＝潮濕）
    keywords: [wet, concealed]
  # ---- 觸發（被動、反應） ----
  - id: trigger_range
    category: trigger
    usage_base: 1
    op: trigger_range
    prefix_zh: 廣域
    summary_zh: 觸發範圍 +1（效果依預算調整）
    headline_zh: "觸發的範圍變大 {n} 格"
  - id: trigger_range_wide
    category: trigger
    usage_base: 1
    op: trigger_range
    delta: 2
    min_tier: 2
    prefix_zh: 遠域
    summary_zh: 觸發範圍 +2（效果依預算調整）
    headline_zh: "觸發的範圍變大 {n} 格"
  - id: trigger_potency
    category: trigger
    usage_base: 2
    op: potency
    generic: true
    prefix_zh: 強效
    summary_zh: 效果 +（依預算提高）
    headline_zh: "觸發時的效果更強"
  - id: trigger_cap
    category: trigger
    usage_base: 1
    op: trigger_cap
    kinds: [passive]
    prefix_zh: 連發
    summary_zh: 每回合觸發次數上限 +1（效果依預算調整，不超過 6.6）
    headline_zh: "每回合多觸發 {n} 次"
  # 附帶護身（BAL-19e，#110「閃現的反應變化模板補到約 10 種」；觸發類的「效果 +」）：反應觸發時順便給自己護盾或回氣（冷卻 −1；治療會碰到「傷害與友方治療不並存」）
