# 轉型（6.34.5、#73）：第 3 次閃現（或重閃第 3 次）有合法轉型時一定是選項之一（#70）；可轉的種類有好幾種時
# 由種子挑一種。min_tier：最低角色階級（1 階被動、反應；2 階起召喚、陷阱、姿態；3 階起修正型被動）。
# 轉型後照新種類的預算重算；之前的小變化對新種類合法的保留、不合法的換成同類別的合法變化。
transforms:
  - id: to_passive_on_hit
    to: passive
    prefix_zh: 餘波
    summary_zh: 轉成被動：你的攻擊命中時，自動對被打中的敵人補上縮小版的這招
    trigger: {event: on_hit, target: other}
    scale_permille: 500
  - id: to_reaction_melee
    to: reaction
    prefix_zh: 反擊
    summary_zh: 轉成反應：被近戰攻擊時，對攻擊者施放縮小版的這招
    reaction: {event: hit_by_melee}
    scale_permille: 600
  - id: to_summon
    to: summon
    min_tier: 2
    prefix_zh: 靈召
    summary_zh: 轉成召喚：召喚一隻幫你出手的召喚物（依這招的元素）
    summon_duration: 2
    summon_boosts:        # 角色階級高、預算變大時依序加試（先試不強化的）
      - {duration: 3}
      - {duration: 4}
      - {duration: 4, max_hp_permille: 300}
      - {duration: 4, max_hp_permille: 600}
    units:
      fire: [summon_fire_spirit]
      ice: [summon_ice_spirit]
      lightning: [summon_thunder_spirit]
      wind: [summon_hawk]
      poison: [summon_vine]
      earth: [summon_golem, summon_earth_wall]
      holy: [summon_guardian_spirit]
      shadow: [summon_shade]
      any: [summon_war_wolf, summon_skeleton_warrior, summon_elemental_spirit]
  - id: to_trap
    to: trap
    min_tier: 2
    prefix_zh: 伏設
    summary_zh: 轉成陷阱：在地上布下陷阱，敵人踩上去時才發動這招的效果
    trap: {trigger: enter, rounds: 3, shape: single}
  - id: to_stance
    to: stance
    min_tier: 2
    prefix_zh: 架式
    summary_zh: 轉成姿態：進入一個持續到取消的姿態（原招有傷害給同元素的元素姿態、沒有傷害給防守向）
    stances:
      offense: [stance_fury]
      defense: [stance_bulwark, stance_guard, stance_ironwall, stance_bastion]
  - id: to_modifier
    to: modifier
    min_tier: 3
    prefix_zh: 化氣
    summary_zh: 轉成修正型被動：你的同元素技能命中時，帶上這招的效果（沒有可帶的效果時改為傷害提高）
    damage_permille_steps: [400, 300, 200, 150, 100, 50]

# 元素姿態的階梯（3W-2b、06 6.34.5）：元素 → 由弱到強 5 級的姿態狀態（statuses.yaml `stance_<元素>_<級>`）。
# 轉型（to_stance）優先轉成同元素的姿態（沒有元素＝物理，戰意架勢）；姿態的「費用」「修正」類小變化在同一階梯上換級。
# 級別的預算點數 15／17／19／22／28 搭配維持費折抵（skill_budget.yaml stance_upkeep_per_point）對上 2、3 階的預算窗。
stance_ladders:
  physical: [stance_physical_1, stance_physical_2, stance_physical_3, stance_physical_4, stance_physical_5]
  fire: [stance_fire_1, stance_fire_2, stance_fire_3, stance_fire_4, stance_fire_5]
  ice: [stance_ice_1, stance_ice_2, stance_ice_3, stance_ice_4, stance_ice_5]
  lightning: [stance_lightning_1, stance_lightning_2, stance_lightning_3, stance_lightning_4, stance_lightning_5]
  poison: [stance_poison_1, stance_poison_2, stance_poison_3, stance_poison_4, stance_poison_5]
  wind: [stance_wind_1, stance_wind_2, stance_wind_3, stance_wind_4, stance_wind_5]
  earth: [stance_earth_1, stance_earth_2, stance_earth_3, stance_earth_4, stance_earth_5]
  holy: [stance_holy_1, stance_holy_2, stance_holy_3, stance_holy_4, stance_holy_5]
  shadow: [stance_shadow_1, stance_shadow_2, stance_shadow_3, stance_shadow_4, stance_shadow_5]
  # 白板姿態（3W-4b）的階梯：轉型不看這幾條（沒有同名元素），只給「費用」「修正」類小變化換級
  guard: [stance_guard, stance_ironwall, stance_bastion]
  flame: [stance_flame, stance_blaze]
  frost: [stance_frost, stance_glacier]
