# 雲嶺敵人（Phase 5A-3；docs/design/18-雲嶺內容.md 18.2，#111 玩法 PM 代決、待使用者確認）。
# 數值是初值（未經模擬）；外觀（doll）見檔尾（5A-ART4）。
# 山中修士・刺客：「霧襲」瞬步背刺；受擊時隱蔽。
id: sect_mist_walker
name_zh: 霧行者
attributes: {str: 10, dex: 16, con: 10, int: 10, wis: 10, wil: 10}
max_hp: 24
speed: 6
armor_bonus: 1
weapon: dagger
ai_profile: assassin
resist: {}
element_mods: {}
tags: [humanoid, sect]
skills: [skill_shadow_backstab, skill_rx_slip_away]
reactions:
  - reaction: block
    when: {event: targeted_by_melee}
    unless: {self_stamina_below: 20}
  - reaction: opportunity_attack
    when: {event: enemy_leaves_adjacent}
  - reaction: skill_rx_slip_away
    when: {event: hit_by_attack}
# 外觀（5A-ART4，docs/art/敵人外觀.md；美術代決待使用者確認，改名改配色只動這裡）
doll: {skin: '#f1c9a5', hair: short, gear: {body: {kind: robe, material: cloth, color: '#e8ecee', trim: '#b8c4cc'}, head: {kind: veil, material: cloth}}}
