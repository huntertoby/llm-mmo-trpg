# 灰燼荒原區域 Boss（Phase 5F-5a；docs/design/19-灰燼荒原與賽季主線.md 19.2.3、09 9.6.8 #86）：灰燼之心，熔心坑（Boss 地圖 molten_heart_pit）。
# 一塊會呼吸的源晶核心殘片，嵌在熔岩甲蟲堆成的殼裡；不移動。主線第 2 章結尾、等級 9；隊伍主角＋2（可帶影子，#87）。
# 數值是初值（模擬見 docs/phases/Phase5F-5a報告.md）；外觀（doll）見檔尾（5A-ART4）。
# 階段（引擎資料化，trpg.engine.boss_phases）：
#   1 殼（100～60%）：開場狀態「熔殼」（受到的傷害 −40%；被冰打到就碎，元素沒有水，代決 5F5a-6）；「熔岩濺落」延遲段（BAL-21b 起，原「熔岩噴發」），施放時選 4 格內一格、下回合在那格 3×3 落下並造火地。
#   2 呼吸（≤ 60%）：殼裂開（移除熔殼）；「熔心吸氣」把 2 格內的人拉近並小火傷、「熔心吐息」身邊第 2 圈小火傷＋燃燒（需要治療或護盾的時刻）；召喚 2 隻餘燼蜥。
#   3 熔毀（≤ 30%）：坑底多處冒出火地（引擎沒有「火地每回合擴散」，用進入階段時一次放 8 格近似）；蓄力強招「熔心爆」（十字臂長 2，提前一輪預告）。
