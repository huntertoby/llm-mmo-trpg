# 關鍵字推導表（Phase 3-24b1，docs/design/06-技能.md 6.27.1）。
#
# 關鍵字是唯一的組織方式：技能「製造」或「利用」關鍵字，任何兩招製造與利用同一個關鍵字的技能都能互相
# 觸發。遊戲不定義流派——這裡只有關鍵字，沒有主題分類。製造與利用由原語、條件、觸發 **自動推導**
# （trpg.skillgen.keywords.derive_keywords），不由人填寫；新增內容不需要改程式。
#
# 一條規則恰好指定一種來源，再用參數縮小範圍（參數必須等於來源上同名的欄位）：
#   effect     效果原語（含 then／賭注分支／擊殺時效果／區域效果／修正規則的命中後效果）
#   condition  技能、效果或修正規則上的條件
#   trigger    被動技能的觸發時機
#   shape      技能形狀
#   change     修正規則的改變種類（add_element 以 element 比對）
# 參數：status、surface、element、object、stack、rule、on_hit、tag、skill
#
# 技能池（trpg.skillgen.keywords.keyword_pools）：技能製造或利用某關鍵字就歸入該池，一招可在多個池。
keywords:
  - id: ignite
    name_zh: 點燃
    description_zh: 火焰讓目標燃燒；燃燒中的目標會受到更重的傷害，或被引爆。
    makes:
      - {effect: apply_status, status: burning}
      - {effect: damage, element: fire}
      - {effect: create_surface, surface: fire}
      - {effect: create_surface, surface: oil}
      - {effect: zone, surface: fire}
      - {effect: delayed_damage, element: fire}
      - {effect: inscribe, element: fire}
      - {effect: hurl_object, element: fire}
      - {change: add_element, element: fire}
    uses:
      - {condition: target_has_status, status: burning}
      - {condition: target_on_surface, surface: fire}
      - {condition: target_on_surface, surface: oil}
      - {effect: consume_status, status: burning}
      - {trigger: on_status_applied, status: burning}
      - {condition: cast_tag_this_turn, tag: fire}
      - {trigger: on_cast_tag, tag: fire}
      - {effect: rule_change, rule: fire_mends_allies}
  - id: wet
    name_zh: 潮濕
    description_zh: 水讓目標與地面變得潮濕；潮濕的目標容易導電與凍結。
    makes:
      - {effect: create_surface, surface: water}
      - {effect: zone, surface: water}
    uses:
      - {condition: target_on_surface, surface: water}
      - {trigger: on_enter_surface, surface: water}
      - {condition: cast_tag_this_turn, tag: water}
      - {effect: heal}
      - {effect: shield}
      - {effect: cleanse}
      - {effect: damage, element: holy}
      - {change: allow_self_target}
      - {change: shape_to}
      - {change: heal_permille}
  - id: charged
    name_zh: 帶電
    description_zh: 雷電讓目標帶電；帶電的目標會被連鎖、被雷擊得更重。
    makes:
      - {effect: damage, element: lightning}
      - {effect: delayed_damage, element: lightning}
      - {effect: inscribe, element: lightning}
      - {change: add_element, element: lightning}
      - {effect: add_stack, stack: static_charge}
      - {effect: add_stack, stack: overload_surge}
    uses:
      - {shape: chain}
      - {effect: consume_stack, stack: static_charge}
      - {condition: on_own_rune, element: lightning}
      - {condition: cast_tag_this_turn, tag: lightning}
  - id: frozen
    name_zh: 冰凍
    description_zh: 寒冰凍結目標或水面；冰凍的目標可以被擊碎，冰面讓人滑倒。
    makes:
      - {effect: apply_status, status: frozen}
      - {effect: damage, element: ice}
      - {effect: create_surface, surface: ice}
      - {effect: create_obstacle, object: ice_wall}
      - {effect: inscribe, element: ice}
    uses:
      - {condition: target_has_status, status: frozen}
      - {condition: target_on_surface, surface: ice}
      - {effect: consume_status, status: frozen}
  - id: prone
    name_zh: 倒地
    description_zh: 絆倒、撞擊、推倒讓目標倒地；倒地的目標更容易被背刺與處決。
    makes:
      - {effect: knock_prone}
      - {effect: topple}
      - {effect: charge_through, on_hit: knock_prone}
      - {effect: apply_status, status: prone}
    uses:
      - {condition: target_has_status, status: prone}
      - {effect: consume_status, status: prone}
      - {effect: damage, weapon_req: melee, category: weapon}
      - {trigger: on_crit}
      - {effect: apply_status, status: stance_fury}
  - id: collision
    name_zh: 撞擊
    description_zh: 推擊把人撞上牆或同伴，造成撞擊傷害；撞擊時可以觸發更多效果。
    makes:
      - {effect: push}
      - {effect: pull}
      - {effect: dash}
      - {effect: charge_through}
      - {change: push_distance_delta}
      - {effect: create_obstacle}
      - {effect: hurl_object}
      - {effect: rule_change, rule: move_any_object}
    uses:
      - {trigger: on_collision}
      - {trigger: on_damaged}
      - {effect: apply_status, status: stance_bulwark}
  - id: marked
    name_zh: 標記
    description_zh: 咒印與揭露標記目標；標記可以被引爆，被標記者會被追擊。
    makes:
      - {effect: apply_status, status: marked}
      - {effect: inscribe}
      - {effect: reveal}
      - {effect: apply_status, status: overwatch}
      - {effect: apply_status, status: silenced}
      - {effect: apply_status, status: feared}
      - {effect: apply_status, status: taunted}
      - {effect: apply_status, status: poison}
      - {effect: rule_change, rule: bleeding_wake}
      - {effect: copy_skill}
      - {change: area_delta}
      - {change: damage_permille, applies_to: all_attacks, unconditional: true}
    uses:
      - {condition: target_has_status, status: marked}
      - {effect: detonate_runes}
      - {condition: on_own_rune}
      - {effect: consume_status}
  - id: high_ground
    name_zh: 高處
    description_zh: 升高平台、飛行與攀跳讓你站得更高；居高臨下命中更準。
    makes:
      - {effect: raise_terrain}
      - {effect: lower_terrain}
      - {effect: leap}
      - {effect: grant_skill, skill: skill_flight}
      - {effect: teleport_target}
      - {effect: swap_any}
      - {trigger: on_move}
      - {effect: grant_ap}
    uses:
      - {condition: height_advantage}
      - {effect: damage, weapon_req: ranged, category: weapon}
      - {change: grant_pierce}
  - id: concealed
    name_zh: 隱蔽
    description_zh: 煙霧、黑暗與暗影讓你隱蔽；隱蔽中的偷襲與伏擊更致命。
    makes:
      - {effect: apply_status, status: concealed}
      - {effect: create_surface, surface: smoke}
      - {effect: create_surface, surface: darkness}
      - {effect: damage, element: shadow}
      - {effect: place_trap}
    uses:
      - {condition: self_concealed}
      - {condition: from_behind}
  - id: summon
    name_zh: 召喚物
    description_zh: 召喚與圖騰讓場上多出幫手；召喚物也能被獻祭或當作施放的原點。
    makes:
      - {effect: summon}
      - {effect: rule_change, rule: afterimage_double}
    uses:
      - {condition: adjacent_ally}
      - {effect: apply_status, affects: allies}
      - {effect: restore_resource, affects: allies}
      - {effect: reset_cooldown, affects: allies}
      - {effect: grant_skill, affects: allies}
      - {effect: redirect_damage}
      - {effect: extra_reaction, affects: allies}
      - {effect: cheat_death, affects: allies}
      - {effect: zone, affects: allies}
      - {effect: swap, affects: allies}
      - {effect: revive}
      - {change: summon_hp_permille}
      - {change: summon_attack_dice}
      - {effect: intercept}
