# 關鍵字推導表（Phase 3-24b1，docs/design/06-技能.md 6.27.1）。
#
# 關鍵字是唯一的組織方式：技能「製造」或「利用」關鍵字，任何兩招製造與利用同一個關鍵字的技能都能互相
# 觸發。遊戲不定義流派——這裡只有關鍵字，沒有主題分類。製造與利用由原語、條件、觸發 **自動推導**
# （trpg.skillgen.keywords.derive_keywords），不由人填寫；新增內容不需要改程式。
#
# 一條規則恰好指定一種來源，再用參數縮小範圍（參數必須等於來源上同名的欄位）：
#   effect     效果原語（含 then／賭注分支／擊殺時效果／區域效果／修正規則的命中後效果）
#   condition  技能、效果或修正規則上的條件
#   trigger    被動技能的觸發時機
#   shape      技能形狀
#   change     修正規則的改變種類（add_element 以 element 比對）
# 參數：status、surface、element、object、stack、rule、on_hit、tag、skill、unit
#
# 規則分三種：專屬（原語、條件本身就對應該關鍵字）、通用（沒有專屬機制的技能類型，依既有引擎規則歸類，註解寫「通用」）、
# 暫定（沒有真實機制可接、為了「每招技能至少一個關鍵字」先歸類，註解寫「暫定」；之後應換成真實內容）。
# 欄位 grade 標示種類：省略＝專屬（exclusive）、general＝通用、provisional＝暫定。開局技能池與候選產生器
# （Phase 3-24b2）只看專屬規則推導的關鍵字；通用與暫定只用來滿足「每招至少一個關鍵字」的檢查與技能卡顯示。
#
# actions（選填）：和關鍵字相符的基本動作；候選產生器（trpg.skillgen.candidates）依玩家用過的次數偏向該關鍵字。
#
# 技能池（trpg.skillgen.keywords.keyword_pools）：技能製造或利用某關鍵字就歸入該池，一招可在多個池。
keywords:
  - id: ignite
    name_zh: 點燃
    description_zh: 火焰讓目標燃燒；燃燒中的目標會受到更重的傷害，或被引爆。
    makes:
      - {effect: summon, infusion: ignite}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_fire_spirit}   # 3-33e1：召喚物的固有關鍵字
      - {effect: summon, unit: summon_bomb_puppet}   # 3-33e2a：召喚物的固有關鍵字
      - {effect: apply_status, status: burning}
      - {effect: damage, element: fire}
      - {effect: create_surface, surface: fire}
      - {effect: create_surface, surface: oil}
      - {effect: zone, surface: fire}
      - {effect: delayed_damage, element: fire}
      - {effect: inscribe, element: fire}
      - {effect: hurl_object, element: fire}
      - {change: add_element, element: fire}
    uses:
      - {condition: target_has_status, status: burning}
      - {condition: target_on_surface, surface: fire}
      - {condition: target_on_surface, surface: oil}
      - {effect: consume_status, status: burning}
      - {trigger: on_status_applied, status: burning}
      - {condition: cast_tag_this_turn, tag: fire}
      - {trigger: on_cast_tag, tag: fire}
      - {effect: rule_change, rule: fire_mends_allies}
  - id: wet
    name_zh: 潮濕
    description_zh: 水讓目標與地面變得潮濕；潮濕的目標容易導電與凍結。
    makes:
      - {effect: summon, infusion: wet}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_water_sprite}   # 3-33e1：召喚物的固有關鍵字
      - {effect: create_surface, surface: water}
      - {effect: zone, surface: water}
    uses:
      - {condition: target_on_surface, surface: water}
      - {trigger: on_enter_surface, surface: water}
      - {condition: cast_tag_this_turn, tag: water}
      - {effect: heal, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}   # 通用：潮濕表面治療（08 8.21.4.2）——治療、護盾、淨化類技能利用潮濕
      - {effect: shield, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}
      - {effect: cleanse, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}
      - {effect: damage, element: holy, grade: general, reason_zh: 神聖傷害多半搭配治療（聖水、雙效治療），和治療同一類 build}   # 通用：神聖傷害（聖水、雙效治療）
      - {change: allow_self_target, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}   # 通用：治療類修正（套用在治療技能上）
      - {change: shape_to, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}
      - {change: heal_permille, grade: general, reason_zh: 治療類技能和水系常一起組 build（不是直接的規則連動）}
  - id: charged
    name_zh: 帶電
    description_zh: 雷電讓目標帶電；雷電能沿著水與連鎖擴散，靜電也能累積成更強的一擊。
    makes:
      - {effect: summon, infusion: charged}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_thunder_spirit}   # 3-33e1：召喚物的固有關鍵字
      - {effect: damage, element: lightning}
      - {effect: delayed_damage, element: lightning}
      - {effect: inscribe, element: lightning}
      - {change: add_element, element: lightning}
      - {effect: add_stack, stack: static_charge}
      - {effect: add_stack, stack: overload_surge}
    uses:
      - {shape: chain}
      - {effect: consume_stack, stack: static_charge}
      - {condition: on_own_rune, element: lightning}
      - {condition: cast_tag_this_turn, tag: lightning}
  - id: frozen
    name_zh: 冰凍
    description_zh: 寒冰凍結目標或水面；冰凍的目標可以被擊碎，冰面讓人滑倒。
    makes:
      - {effect: summon, infusion: frozen}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_ice_spirit}   # 3-33e1：召喚物的固有關鍵字
      - {effect: apply_status, status: frozen}
      - {effect: damage, element: ice}
      - {effect: create_surface, surface: ice}
      - {effect: create_obstacle, object: ice_wall}
      - {effect: inscribe, element: ice}
    uses:
      - {condition: target_has_status, status: frozen}
      - {condition: target_on_surface, surface: ice}
      - {effect: consume_status, status: frozen}
  - id: prone
    name_zh: 倒地
    description_zh: 絆倒、推倒、撞擊讓目標倒地；倒地的目標更容易被近戰命中與處決。
    actions: [trip]   # 行為紀錄提示（Phase 3-24b2）：常用這個動作的玩家，候選偏向這個關鍵字
    makes:
      - {effect: summon, infusion: prone}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_skeleton_warrior}   # 3-33e1：召喚物的固有關鍵字
      - {effect: summon, unit: summon_war_wolf}   # 3-33e2a：召喚物的固有關鍵字
      - {effect: summon, unit: summon_vine}   # 3-33e2b：藤蔓纏住（倒地）
      - {effect: knock_prone}
      - {effect: topple}
      - {effect: charge_through, on_hit: knock_prone}
      - {effect: apply_status, status: prone}
    uses:
      - {condition: target_has_status, status: prone}
      - {effect: consume_status, status: prone}
      - {effect: damage, weapon_req: melee, category: weapon, grade: general, reason_zh: 近戰攻擊倒地的目標有優勢}   # 通用：近戰攻擊倒地者有優勢（statuses.yaml prone）
      - {trigger: on_crit, grade: provisional}   # 暫定：暴擊類（08 8.21.4.2「對倒地暴擊」），之後換成真實條件
      - {effect: apply_status, status: stance_fury, grade: provisional}   # 暫定：同上
  - id: collision
    name_zh: 撞擊
    description_zh: 推擊把人撞上牆或同伴，造成撞擊傷害；撞擊時可以觸發更多效果。
    actions: [shove]   # 行為紀錄提示（Phase 3-24b2）：常用這個動作的玩家，候選偏向這個關鍵字
    makes:
      - {effect: summon, infusion: collision}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_golem}   # 3-33e2a：召喚物的固有關鍵字
      - {effect: summon, unit: summon_earth_wall}   # 3-33e2a：召喚物的固有關鍵字
      - {effect: summon, unit: summon_pull_totem}   # 3-33e2b：吸引圖騰拉扯
      - {effect: push}
      - {effect: pull}
      - {effect: dash}
      - {effect: charge_through}
      - {change: push_distance_delta}
      - {effect: create_obstacle, grade: general, reason_zh: 被推的人撞上障礙物會受到撞擊傷害}   # 通用：障礙物是讓人撞上的牆
      - {effect: hurl_object, grade: general, reason_zh: 投擲物件砸人，和撞擊一樣是拿場上的東西打人}   # 通用：投擲物件（08 8.21.4.2：撞擊、投擲）
      - {effect: rule_change, rule: move_any_object}
    uses:
      - {trigger: on_collision}
      - {condition: target_collided}   # 3-24c：對本回合撞過牆的目標加碼
      - {trigger: on_damaged, grade: provisional}   # 暫定：受傷（含撞擊傷害）時反擊
      - {effect: apply_status, status: stance_bulwark, grade: provisional}   # 暫定：堅壁姿態站穩腳步、不怕被推
  - id: marked
    name_zh: 標記
    description_zh: 咒印與揭露標記目標；標記可以被引爆，被標記者會被追擊。
    actions: [aim]   # 行為紀錄提示（Phase 3-24b2）：常用這個動作的玩家，候選偏向這個關鍵字
    makes:
      - {effect: summon, infusion: marked}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_hawk}   # 3-33e1：召喚物的固有關鍵字
      - {effect: apply_status, status: marked}
      - {effect: inscribe}
      - {effect: reveal}
      - {effect: apply_status, status: overwatch}
      - {effect: apply_status, status: silenced, grade: provisional}   # 暫定：控制型的標記（被盯上的目標）：沉默、恐懼、嘲諷、中毒
      - {effect: apply_status, status: feared, grade: provisional}   # 暫定
      - {effect: apply_status, status: taunted, grade: provisional}   # 暫定
      - {effect: apply_status, status: poison, grade: provisional}   # 暫定
      - {effect: rule_change, rule: bleeding_wake, grade: provisional}   # 暫定：血痕標記路徑上的敵人
      - {effect: copy_skill, grade: provisional}   # 暫定
      - {change: area_delta, grade: provisional}   # 暫定：吼叫（嘲諷）範圍 +1
      - {change: damage_permille, applies_to: all_attacks, unconditional: true, grade: provisional}   # 暫定：無條件的全攻擊傷害修正
      - {change: damage_permille, applies_to: actions, unconditional: true, grade: provisional}   # 暫定：普攻的無條件傷害修正（普攻精通，3-32a）
    uses:
      - {condition: target_has_status, status: marked}
      - {effect: detonate_runes}
      - {condition: on_own_rune}
      - {effect: consume_status, grade: general, reason_zh: 消耗目標身上的狀態，和標記一樣是先上狀態再引爆}   # 通用：引爆任何狀態
  - id: high_ground
    name_zh: 高處
    description_zh: 升高平台、飛行與攀跳讓你站得更高；居高臨下命中更準。
    actions: [vault]   # 行為紀錄提示（Phase 3-24b2）：常用這個動作的玩家，候選偏向這個關鍵字
    makes:
      - {effect: summon, infusion: high_ground}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_hawk}   # 3-33e1：召喚物的固有關鍵字
      - {effect: summon, unit: summon_plateau_totem}   # 3-33e2b：高台圖騰升起高台
      - {effect: raise_terrain}
      - {effect: lower_terrain}
      - {effect: leap}
      - {effect: grant_skill, skill: skill_flight}
      - {effect: teleport_target, grade: provisional}   # 暫定：把人調到別的位置（高低差）
      - {effect: swap_any, grade: provisional}   # 暫定
      - {trigger: on_move, grade: provisional}   # 暫定
      - {effect: grant_ap, grade: provisional}   # 暫定
    uses:
      - {condition: height_advantage}
      - {effect: damage, weapon_req: ranged, category: weapon, grade: general, reason_zh: 站得比目標高時遠程攻擊命中提高}   # 通用：遠程攻擊吃高低差命中加成（core.yaml height_hit_bonus）
      - {change: grant_pierce, grade: general, reason_zh: 遠程攻擊的修正，搭配高處的射擊}   # 通用：遠程修正
  - id: concealed
    name_zh: 隱蔽
    description_zh: 煙霧、黑暗與暗影讓你隱蔽；隱蔽中的偷襲與伏擊更致命。
    makes:
      - {effect: summon, infusion: concealed}   # 3-33f2：橋接進化的第二個灌注關鍵字
      - {effect: summon, unit: summon_shade}   # 3-33e1：召喚物的固有關鍵字
      - {effect: apply_status, status: concealed}
      - {effect: create_surface, surface: smoke}
      - {effect: create_surface, surface: darkness}
      - {effect: damage, element: shadow}
      - {effect: place_trap, grade: general, reason_zh: 陷阱是隱藏的，敵人看不到}   # 通用：陷阱藏在落葉底下
    uses:
      - {condition: self_concealed}
      - {condition: from_behind}
  - id: summon
    name_zh: 召喚物
    description_zh: 召喚與圖騰讓場上多出幫手；你可以獻祭自己的召喚物，在它所在的位置爆炸或治療。
    makes:
      - {effect: summon}
      - {effect: rule_change, rule: afterimage_double}
    uses:
      - {effect: sacrifice_summon}   # 3-24c：獻祭召喚物（專屬）
      - {condition: adjacent_ally, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用：召喚物也是友方；以下是對友方生效的效果（召喚物也算友方）
      - {effect: apply_status, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: restore_resource, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: reset_cooldown, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: grant_skill, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: redirect_damage, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: extra_reaction, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: cheat_death, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: zone, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: swap, affects: allies, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {effect: revive, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
      - {change: summon_hp_permille}
      - {change: summon_attack_dice}
      - {change: summon_limit_delta}
      - {change: summon_duration_delta}
      - {change: summon_damage_permille}
      - {effect: intercept, grade: general, reason_zh: 召喚物也算友方：對友方生效的效果也能用在召喚物上}   # 通用
