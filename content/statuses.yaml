# 狀態表（docs/phases/Phase1計畫.md 4.5、docs/phases/Phase2B計畫.md 3.1）。
# 欄位：id、name_zh、description_zh、duration（預設持續回合；省略表示不倒數）、
#       expires（turn_end：帶有者回合結束時 −1，歸零移除；own_turn_start：帶有者下回合開始時移除；
#                never：只能由效果或動作移除）、stacking（refresh：重複施加時刷新持續時間，不疊加）、
#       on_turn_start_damage（回合開始時的持續傷害：dice、element）。
# 數值型的規則效果（防禦 +25%、倒地站起的移動消耗）放在 rules/core.yaml。
# 2B-1 的數值效果欄位（‰：1000 = ×1，省略為 1000；同一欄位有多個狀態時依序相乘、逐步無條件捨去）：
#   move_permille              回合開始時的移動點數倍率（緩速 500）
#   prevents_move              true：不能主動移動（強制位移照常）
#   skip_turn                  true：回合開始時跳過整個回合（沒有 AP、移動點數與反應），發出 turn_skipped
#   damage_dealt_permille      自己造成的攻擊傷害（cause: attack）倍率
#   damage_taken_permille      受到的骰值傷害倍率（不含墜落、致命地形等以最大 HP 比例計算的傷害）
#   healing_received_permille  受到的治療倍率
#   save_attr                  由技能或動作施加時的抵抗屬性（守方用此屬性，攻方用技能的縮放屬性）；
#                              省略表示命中即施加。表面與環境造成的狀態不擲抵抗
#   control_group              控制類別（movement／mental／hard）：成功施加後，目標在 core.yaml 的
#                              control_dr_rounds 輪內對同類別的抵抗判定守方屬性 ×150%；
#                              hard 類別的狀態施加在 boss 標籤的單位上時依 boss_control_conversion 轉換
# 2B-2 的預算欄位：
#   budget_points  技能施加此狀態（預設持續時間）的預算點數；省略表示不能由技能施加（defending）
#   min_rarity     技能使用此狀態的最低稀有度（省略為 common）
# 2B-3：
#   beneficial     對帶有者有益（省略為 false）；光環骨架的核心狀態必須有益
# 2D-1（保護、增益與嘲諷；數值全是初值，未經模擬，平衡階段再調）：
#   attr_bonus          {屬性: 加值}：帶有者的有效屬性加值（多個狀態相加）。命中比例、抵抗判定、對抗判定、
#                       傷害／治療／護盾的屬性縮放都用有效屬性（trpg.engine.rules.statuses.effective_attribute）；
#                       先攻在戰鬥開始時擲，不受影響
#   on_turn_start_heal  回合開始時治療（dice）；與 on_turn_start_damage 同一時點，受 healing_received_permille 影響
#   forces_target       嘲諷：帶有者對「狀態來源以外」的單位發動攻擊時有劣勢；來源倒下或離場時此狀態立即移除。
#                       刷新時來源改為最新的施放者
#   absorbs_damage      護盾：狀態帶有吸收量（StatusInstance.amount，由 shield 原語施加），骰值傷害在所有倍率之後、
#                       扣 HP 之前先扣護盾；吸收量歸零時移除（原因 depleted）。不能由 apply_status 施加（無 budget_points）
# 2D-2（負面狀態；數值全是初值，未經模擬，平衡階段再調）：
#   fear_source              恐懼：帶有者主動移動時，每一步都不能讓自己與狀態來源的曼哈頓距離變小（強制位移照常）；
#                            攻擊（任何目標）有劣勢；來源倒下或離場時此狀態立即移除。刷新時來源改為最新的施放者
#   blocks_spells            沉默：不能使用 category: spell 的技能（武器技與基本攻擊照常），從合法動作中排除
#   attack_range_cap         致盲：攻擊與以單位為目標的技能只能選擇此距離（曼哈頓）以內的單位；攻擊有劣勢
#   grants_advantage_against 被標記：對帶有者的攻擊有優勢；帶有者不受 concealed（含黑暗表面、草叢）的
#                            「無法選為目標」限制（隱蔽的劣勢仍在，與優勢互相抵消）
# 2E-2（姿態；數值全是初值，未經模擬，平衡階段再調）：
#   stance   姿態：持續到取消（expires: never、不設 duration），帶有者同時最多一個姿態狀態，施加新的會先移除舊的
#            （StatusRemoved 原因 replaced）；倒下或撤離時移除；淨化（cleanse）不移除；EndStance 免費取消。
#            姿態技能（kind: stance）進入時花 core.yaml 的 stance_ap_cost。budget_points 是姿態技能的點數（可用預算 ＝
#            tier_budget × skill_budget.yaml 的 stance_coefficient_permille）
# 2H-1（冰凍；數值全是初值，未經模擬，平衡階段再調）：
#   removed_by_element  元素清單：帶有者受到這些元素的傷害（數值 > 0）時立即移除此狀態
#                       （StatusRemoved 原因 thawed）。冰凍用 [fire]。引擎不寫死狀態 ID，全由此欄位驅動
# 3C-4a（改寫規則型原語；初值，未經模擬）：
#   prevents_death  不死：帶有者受到傷害、HP 會降到 0 時改為 1，並移除此狀態（StatusRemoved 原因 spent，
#                   事件 death_cheated）。墜落與致命地形照樣生效。只能由 cheat_death 原語施加（無 budget_points）
# control_group 新增 mental（心智：恐懼、沉默）：適用控制遞減，不是 hard，對 Boss 不轉換。
statuses:
  - id: defending
    name_zh: 防禦
    description_zh: 防禦值 +25%，持續到自己的下回合開始。
    expires: own_turn_start
    stacking: refresh
    beneficial: true
    budget_points: 2
  - id: prone
    name_zh: 倒地
    description_zh: 移動前要先站起來（消耗一半移動點數）；近戰攻擊倒地者有優勢，遠程攻擊有劣勢。
    expires: never
    stacking: refresh
    budget_points: 3
    min_rarity: rare
  - id: burning
    name_zh: 燃燒
    description_zh: 回合開始時受到 1d6 火焰傷害，持續 2 回合；重複施加時刷新持續時間。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    on_turn_start_damage:
      dice: 1d6
      element: fire
  - id: concealed
    name_zh: 隱蔽
    description_zh: 對其攻擊有劣勢；超過 2 格的遠程攻擊無法選為目標。站在黑暗表面或草叢中的單位也視為隱蔽。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    min_rarity: rare
    beneficial: true
  - id: slow
    name_zh: 緩速
    description_zh: 回合開始時的移動點數減半（無條件捨去）。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    move_permille: 500
    save_attr: dex
    control_group: movement
  - id: root
    name_zh: 定身
    description_zh: 不能主動移動（仍可被推擊、拉扯等強制位移）。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 4
    min_rarity: rare
    prevents_move: true
    save_attr: str
    control_group: movement
  - id: stun
    name_zh: 暈眩
    description_zh: 跳過整個回合：沒有 AP、移動點數與反應。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 8
    min_rarity: rare
    skip_turn: true
    save_attr: con
    control_group: hard
  - id: frozen
    name_zh: 冰凍
    description_zh: 跳過整個回合（同暈眩，與暈眩共用硬控的控制遞減）；受到火焰傷害時立即解除。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 8
    min_rarity: rare
    skip_turn: true
    save_attr: con
    control_group: hard
    removed_by_element: [fire]
  - id: weaken
    name_zh: 虛弱
    description_zh: 自己造成的攻擊傷害 ×75%。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    damage_dealt_permille: 750
    save_attr: con
  - id: vulnerable
    name_zh: 易傷
    description_zh: 受到的骰值傷害 ×125%（不含墜落、致命地形等百分比傷害）。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    damage_taken_permille: 1250
    save_attr: wil
  - id: bleed
    name_zh: 流血
    description_zh: 回合開始時受到 1d4 物理傷害，持續 3 回合。
    duration: 3
    expires: turn_end
    stacking: refresh
    budget_points: 3
    on_turn_start_damage:
      dice: 1d4
      element: physical
  - id: poison
    name_zh: 中毒
    description_zh: 回合開始時受到 1d4 毒素傷害，持續 3 回合；受到的治療減半。
    duration: 3
    expires: turn_end
    stacking: refresh
    budget_points: 3
    healing_received_permille: 500
    on_turn_start_damage:
      dice: 1d4
      element: poison
  - id: guarded
    name_zh: 護衛
    description_zh: 受到的骰值傷害 ×70%（不含墜落、致命地形等百分比傷害）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    damage_taken_permille: 700
  - id: empowered
    name_zh: 激昂
    description_zh: 六個屬性各 +2（命中、抵抗、傷害與治療的縮放都用加值後的屬性；先攻不變）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    attr_bonus: {str: 2, dex: 2, con: 2, int: 2, wis: 2, wil: 2}
  - id: hasted
    name_zh: 加速
    description_zh: 回合開始時的移動點數 ×150%（無條件捨去）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 3
    move_permille: 1500
  - id: regenerating
    name_zh: 再生
    description_zh: 回合開始時恢復 1d4 HP，持續 3 回合。
    duration: 3
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    on_turn_start_heal:
      dice: 1d4
  - id: shielded
    name_zh: 護盾
    description_zh: 帶有吸收量；受到的骰值傷害先扣護盾，吸收量歸零時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    absorbs_damage: true
  - id: undying
    name_zh: 不死
    description_zh: 受到致命傷害時 HP 留在 1，然後此狀態消失（墜落與致命地形除外）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    prevents_death: true
  - id: taunted
    name_zh: 嘲諷
    description_zh: 對嘲諷者以外的目標發動攻擊時有劣勢；嘲諷者倒下時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    save_attr: wil
    forces_target: true
  - id: feared
    name_zh: 恐懼
    description_zh: 主動移動時不能靠近恐懼的來源；攻擊有劣勢。來源倒下時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 5
    min_rarity: rare
    save_attr: wis
    control_group: mental
    fear_source: true
  - id: silenced
    name_zh: 沉默
    description_zh: 不能使用法術技（武器技與基本攻擊照常）。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 5
    min_rarity: rare
    save_attr: wil
    control_group: mental
    blocks_spells: true
  - id: blinded
    name_zh: 致盲
    description_zh: 攻擊與以單位為目標的技能只能選擇 2 格以內的單位；攻擊有劣勢。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 4
    min_rarity: rare
    save_attr: wis
    attack_range_cap: 2
  - id: marked
    name_zh: 被標記
    description_zh: 對其攻擊有優勢；隱蔽也無法讓它免於被選為目標。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    save_attr: wis
    grants_advantage_against: true
  - id: stance_fury
    name_zh: 狂怒姿態
    description_zh: 力量 +2，但受到的骰值傷害 ×120%；持續到取消。
    expires: never
    stacking: refresh
    beneficial: true
    budget_points: 11
    min_rarity: rare
    stance: true
    attr_bonus: {str: 2}
    damage_taken_permille: 1200
  - id: stance_bulwark
    name_zh: 堅壁姿態
    description_zh: 受到的骰值傷害 ×75%，但回合開始時的移動點數減半；持續到取消。
    expires: never
    stacking: refresh
    beneficial: true
    budget_points: 11
    min_rarity: rare
    stance: true
    damage_taken_permille: 750
    move_permille: 500
