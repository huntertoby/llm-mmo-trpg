# 狀態表（docs/phases/Phase1計畫.md 4.5、docs/phases/Phase2B計畫.md 3.1）。
# 欄位：id、name_zh、description_zh、duration（預設持續回合；省略表示不倒數）、
#       expires（turn_end：帶有者回合結束時 −1，歸零移除；own_turn_start：帶有者下回合開始時移除；
#                never：只能由效果或動作移除）、stacking（refresh：重複施加時刷新持續時間，不疊加）、
#       on_turn_start_damage（回合開始時的持續傷害：dice、element）。
# 數值型的規則效果（防禦 +25%、倒地站起的移動消耗）放在 rules/core.yaml。
# 2B-1 的數值效果欄位（‰：1000 = ×1，省略為 1000；同一欄位有多個狀態時依序相乘、逐步無條件捨去）：
#   move_permille              回合開始時的移動點數倍率（緩速 500）
#   move_reduction（3I-1）     true：回合開始時移動點數再減狀態的數值（StatusInstance.amount，例：鞭的纏繞 2），最低 0；
#                              多個時取最大（不疊加）
#   prevents_move              true：不能主動移動（強制位移照常）
#   skip_turn                  true：回合開始時跳過整個回合（沒有 AP、移動點數與反應），發出 turn_skipped
#   damage_dealt_permille      自己造成的攻擊傷害（cause: attack）倍率
#   damage_taken_permille      受到的骰值傷害倍率（不含墜落、致命地形等以最大 HP 比例計算的傷害）
#   healing_received_permille  受到的治療倍率
#   save_attr                  由技能或動作施加時的抵抗屬性（守方用此屬性，攻方用技能的縮放屬性）；
#                              省略表示命中即施加。表面與環境造成的狀態不擲抵抗
#   control_group              控制類別（movement／mental／hard）：成功施加後，目標在 core.yaml 的
#                              control_dr_rounds 輪內對同類別的抵抗判定守方屬性 ×150%；
#                              hard 類別的狀態施加在 boss 標籤的單位上時依 boss_control_conversion 轉換
# 2B-2 的預算欄位：
#   budget_points  技能施加此狀態（預設持續時間）的預算點數；省略表示不能由技能施加（defending）
#   min_rarity     技能使用此狀態的最低稀有度（省略為 common）
# 2B-3：
#   beneficial     對帶有者有益（省略為 false）；光環骨架的核心狀態必須有益
# 2D-1（保護、增益與嘲諷；數值全是初值，未經模擬，平衡階段再調）：
#   attr_bonus          {屬性: 加值}：帶有者的有效屬性加值（多個狀態相加）。命中比例、抵抗判定、對抗判定、
#                       傷害／治療／護盾的屬性縮放都用有效屬性（trpg.engine.rules.statuses.effective_attribute）；
#                       先攻在戰鬥開始時擲，不受影響
#   on_turn_start_heal  回合開始時治療（dice）；與 on_turn_start_damage 同一時點，受 healing_received_permille 影響
#   forces_target       嘲諷：帶有者對「狀態來源以外」的單位發動攻擊時有劣勢；來源倒下或離場時此狀態立即移除。
#                       刷新時來源改為最新的施放者
#   absorbs_damage      護盾：狀態帶有吸收量（StatusInstance.amount，由 shield 原語施加），骰值傷害在所有倍率之後、
#                       扣 HP 之前先扣護盾；吸收量歸零時移除（原因 depleted）。不能由 apply_status 施加（無 budget_points）
# 2D-2（負面狀態；數值全是初值，未經模擬，平衡階段再調）：
#   fear_source              恐懼：帶有者主動移動時，每一步都不能讓自己與狀態來源的曼哈頓距離變小（強制位移照常）；
#                            攻擊（任何目標）有劣勢；來源倒下或離場時此狀態立即移除。刷新時來源改為最新的施放者
#   blocks_spells            沉默：不能使用 category: spell 的技能（武器技與基本攻擊照常），從合法動作中排除
#   attack_range_cap         致盲：攻擊與以單位為目標的技能只能選擇此距離（曼哈頓）以內的單位；攻擊有劣勢
#   grants_advantage_against 被標記：對帶有者的攻擊有優勢；帶有者不受 concealed（含黑暗表面、草叢）的
#                            「無法選為目標」限制（隱蔽的劣勢仍在，與優勢互相抵消）
# 2E-2（姿態；數值全是初值，未經模擬，平衡階段再調）：
#   stance   姿態：持續到取消（expires: never、不設 duration），帶有者同時最多一個姿態狀態，施加新的會先移除舊的
#            （StatusRemoved 原因 replaced）；倒下或撤離時移除；淨化（cleanse）不移除；EndStance 免費取消。
#            姿態技能（kind: stance）進入時花 core.yaml 的 stance_ap_cost。budget_points 是姿態技能的點數（可用預算 ＝
#            tier_budget × skill_budget.yaml 的 stance_coefficient_permille）
# 2H-1（冰凍；數值全是初值，未經模擬，平衡階段再調）：
#   removed_by_element  元素清單：帶有者受到這些元素的傷害（數值 > 0）時立即移除此狀態
#                       （StatusRemoved 原因 thawed）。冰凍用 [fire]。引擎不寫死狀態 ID，全由此欄位驅動
# 3C-4a（改寫規則型原語；初值，未經模擬）：
#   prevents_death  不死：帶有者受到傷害、HP 會降到 0 時改為 1，並移除此狀態（StatusRemoved 原因 spent，
#                   事件 death_cheated）。墜落與致命地形照樣生效。只能由 cheat_death 原語施加（無 budget_points）
# 3C-4b（redirect_damage；初值，未經模擬）：
#   redirects_damage  靈魂連結：帶有者受到的傷害有 StatusInstance.amount‰ 轉給狀態來源（施放者，直接扣 HP），
#                     來源倒下或離場時立即移除。只能由 redirect_damage 原語施加（無 budget_points）
# 3D-1（資源互動）：
#   polarity  分類：buff 增益（steal_buff 可奪取、dispel 可驅散）／debuff 減益／neutral 中性（姿態、隱蔽、不死、
#             靈魂連結等帶有來源或唯一性語意的狀態，不能被奪取或驅散）。每個狀態都必須填；buff 必須 beneficial: true、
#             debuff 不可 beneficial。
# 3D-8a（揭露）：
#   prevents_concealment  被揭露：帶有者不算隱蔽（連黑暗表面、草叢也不算），也不能獲得 concealed 狀態。只能由 reveal 原語施加
#                         （無 budget_points）
# 3D-8c（監視射擊）：
#   overwatch  監視：持續到持有者下回合開始（expires: own_turn_start）；reactions.yaml 的內建反應 overwatch_shot
#              （requires_status: overwatch）在敵人於射程與視線內完成一步移動時自動普攻一次，之後移除此狀態
# 3-24a1（武器擴充）：
#   attack_bonus   戰意（3-33e1）：帶有者的攻擊值加這麼多（戰意；戰意圖騰的光環狀態）
#   defense_break  破甲：帶有者的防禦值降低 StatusInstance.amount ‰（斧的普攻命中帶入；沒有 budget_points，只能由武器施加）
# 3I-6（臨時附魔，玩法決定 #52；初值，未經模擬）：
#   attack_element  攻擊元素：帶有者的普攻與沒有自己元素的武器技，物理傷害改成這個元素（優先順序見
#                   trpg.engine.attack_element：附魔 ＞ 普攻附加詞條 ＞ 武器元素詞條 ＞ 武器本身元素 ＞ 物理）。
#                   同時只會有一個附魔狀態：施加新的會先移除舊的（StatusRemoved 原因 replaced）；外觀顯示該元素色
# control_group 新增 mental（心智：恐懼、沉默；2026-10-23 加嘲諷）：適用控制遞減，不是 hard，對 Boss 不轉換。
statuses:
  - id: defending
    polarity: buff
    name_zh: 守護
    description_zh: 防禦值提高，持續到自己的下回合開始；若守護著相鄰隊友，敵人的單體攻擊會改由自己承受（每輪 1 次）。
    expires: own_turn_start
    stacking: refresh
    beneficial: true
    budget_points: 2
  - id: prone
    polarity: debuff
    name_zh: 倒地
    description_zh: 移動前要先站起來（消耗部分移動點數）；近戰攻擊倒地者有優勢，遠程攻擊有劣勢。
    expires: never
    stacking: refresh
    budget_points: 3
    min_rarity: rare
  - id: burning
    polarity: debuff
    name_zh: 燃燒
    description_zh: 身上著火，每回合開始時受到火焰傷害；重複施加時刷新持續時間。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    on_turn_start_damage:
      dice: 1d6
      element: fire
  - id: concealed
    polarity: neutral
    name_zh: 隱蔽
    description_zh: 對其攻擊有劣勢；太遠的遠程攻擊無法選為目標。站在黑暗表面或草叢中的單位也視為隱蔽。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    min_rarity: rare
    beneficial: true
  - id: revealed
    polarity: debuff
    name_zh: 被揭露
    description_zh: 不算隱蔽（黑暗與草叢也一樣），也不能再獲得隱蔽。只能由揭露效果施加。
    duration: 2
    expires: turn_end
    stacking: refresh
    prevents_concealment: true
  - id: overwatch
    polarity: buff
    name_zh: 監視
    description_zh: 持續到自己的下回合開始。期間敵人在武器射程與視線內完成一步移動，就自動普攻一次（佔本輪反應，不花 AP），射擊後監視結束。
    expires: own_turn_start
    stacking: refresh
    beneficial: true
    budget_points: 6
    min_rarity: rare
  - id: time_bomb
    polarity: debuff
    name_zh: 定時炸彈
    description_zh: 身上綁著定時炸彈，剩餘回合就是倒數（每次環境回合倒數一次）：歸零時在身體當下的位置爆炸，波及周圍；倒下時也會立即爆炸。可被淨化移除，驅散不移除。只能由定時炸彈效果施加。
    expires: never
    stacking: refresh
  - id: charging
    polarity: neutral
    name_zh: 蓄力
    description_zh: 延遲段（複合技能）等待釋放中：下回合開始時、或被攻擊時（依技能）以自己為中心釋放第二段。倒下、暈眩或冰凍時取消。不能被淨化、驅散或奪取。只能由延遲段施加。
    expires: never
    stacking: refresh
    beneficial: true
  - id: slow
    polarity: debuff
    name_zh: 緩速
    description_zh: 回合開始時的移動點數減少。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3
    move_permille: 500
    save_attr: dex
    control_group: movement
  - id: root
    polarity: debuff
    name_zh: 定身
    description_zh: 不能主動移動（仍可被推擊、拉扯等強制位移）。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 4
    min_rarity: rare
    prevents_move: true
    save_attr: str
    control_group: movement
  - id: stun
    polarity: debuff
    name_zh: 暈眩
    description_zh: 跳過整個回合：沒有 AP、移動點數與反應。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 8
    min_rarity: rare
    skip_turn: true
    save_attr: con
    control_group: hard
  - id: frozen
    polarity: debuff
    name_zh: 冰凍
    description_zh: 跳過整個回合（同暈眩，與暈眩共用硬控的控制遞減）。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 8
    min_rarity: rare
    skip_turn: true
    save_attr: con
    control_group: hard
    removed_by_element: [fire]
  - id: weaken
    polarity: debuff
    name_zh: 虛弱
    description_zh: 自己造成的攻擊傷害降低。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    damage_dealt_permille: 750
    save_attr: con
  - id: vulnerable
    polarity: debuff
    name_zh: 易傷
    description_zh: 受到的骰值傷害增加（不含墜落、致命地形等百分比傷害）。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    damage_taken_permille: 1250
    save_attr: int
  - id: armor_broken
    polarity: debuff
    name_zh: 破甲
    description_zh: 防禦值降低。
    duration: 1
    expires: turn_end
    stacking: refresh
    defense_break: true
  # Phase 3I-1：鞭的纏繞（08 8.11）。不擲抵抗、不算控制類別、不能由技能施加（沒有 budget_points）。
  # 由帶有者自己的回合施加時（例如反應攻擊）持續 2，確保作用在「下一個」回合。
  - id: entangled
    polarity: debuff
    name_zh: 纏繞
    description_zh: 被鞭纏住，下一個回合開始時移動點數減少（不疊加）。
    duration: 1
    expires: turn_end
    stacking: refresh
    move_reduction: true
  - id: bleed
    polarity: debuff
    save_attr: con
    name_zh: 流血
    description_zh: 傷口流血，每回合開始時受到物理傷害。
    duration: 3
    expires: turn_end
    stacking: refresh
    budget_points: 3
    on_turn_start_damage:
      dice: 1d4
      element: physical
  - id: poison
    polarity: debuff
    save_attr: con
    name_zh: 中毒
    description_zh: 中毒，每回合開始時受到毒素傷害；受到的治療降低。
    duration: 3
    expires: turn_end
    stacking: refresh
    budget_points: 3
    healing_received_permille: 500
    on_turn_start_damage:
      dice: 1d4
      element: poison
  - id: guarded
    polarity: buff
    name_zh: 護衛
    description_zh: 受到的骰值傷害降低（不含墜落、致命地形等百分比傷害）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    damage_taken_permille: 700
  - id: empowered
    polarity: buff
    name_zh: 激昂
    description_zh: 屬性提高（命中、抵抗、傷害與治療的縮放都用加值後的屬性；先攻不變）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    attr_bonus: {str: 2, dex: 2, con: 2, int: 2, wis: 2, wil: 2}
  - id: rallied
    polarity: buff
    name_zh: 戰意
    description_zh: 攻擊值提高（戰意圖騰的光環）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    min_rarity: rare
    attack_bonus: 1
  - id: hasted
    polarity: buff
    name_zh: 加速
    description_zh: 回合開始時的移動點數增加。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 3
    move_permille: 1500
  - id: regenerating
    polarity: buff
    name_zh: 再生
    description_zh: 每回合開始時恢復 HP。
    duration: 3
    expires: turn_end
    stacking: refresh
    beneficial: true
    budget_points: 4
    on_turn_start_heal:
      dice: 1d4
  - id: shielded
    polarity: buff
    name_zh: 護盾
    description_zh: 帶有吸收量；受到的骰值傷害先扣護盾，吸收量歸零時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    absorbs_damage: true
  - id: undying
    polarity: neutral
    name_zh: 不死
    description_zh: 受到致命傷害時 HP 留在 1，然後此狀態消失（墜落與致命地形除外）。
    duration: 2
    expires: turn_end
    stacking: refresh
    beneficial: true
    prevents_death: true
  - id: soul_link
    polarity: neutral
    name_zh: 靈魂連結
    description_zh: 受到的傷害有一部分轉給連結者（施放者）；連結者倒下時消失。
    duration: 3
    expires: turn_end
    stacking: refresh
    beneficial: true
    redirects_damage: true
  - id: taunted
    polarity: debuff
    name_zh: 嘲諷
    description_zh: 對嘲諷者以外的目標發動攻擊時有劣勢；嘲諷者倒下時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 3   # 玩法 PM 2026-10-23：加 mental 後由 4 降 3，控制遞減就是代價、不再用預算加價
    save_attr: wil
    control_group: mental   # 玩法 PM 2026-10-23：適用控制遞減，防止嘲諷無限連鎖鎖住 Boss
    forces_target: true
  - id: feared
    polarity: debuff
    name_zh: 恐懼
    description_zh: 主動移動時不能靠近恐懼的來源；攻擊有劣勢。來源倒下時消失。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 5
    min_rarity: rare
    save_attr: wis
    control_group: mental
    fear_source: true
  - id: silenced
    polarity: debuff
    name_zh: 沉默
    description_zh: 不能使用法術技（武器技與基本攻擊照常）。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 5
    min_rarity: rare
    save_attr: wil
    control_group: mental
    blocks_spells: true
  - id: blinded
    polarity: debuff
    name_zh: 致盲
    description_zh: 攻擊與以單位為目標的技能只能選擇近距離的單位；攻擊有劣勢。
    duration: 1
    expires: turn_end
    stacking: refresh
    budget_points: 4
    min_rarity: rare
    save_attr: wis
    attack_range_cap: 2
  - id: marked
    polarity: debuff
    name_zh: 被標記
    description_zh: 對其攻擊有優勢；隱蔽也無法讓它免於被選為目標。
    duration: 2
    expires: turn_end
    stacking: refresh
    budget_points: 4
    save_attr: wis
    grants_advantage_against: true
  - id: stance_fury
    polarity: neutral
    name_zh: 狂怒姿態
    description_zh: 力量提高，但受到的骰值傷害增加；持續到取消。
    expires: never
    stacking: refresh
    beneficial: true
    budget_points: 11
    min_rarity: rare
    stance: true
    attr_bonus: {str: 2}
    damage_taken_permille: 1200
  - id: stance_bulwark
    polarity: neutral
    name_zh: 堅壁姿態
    description_zh: 受到的骰值傷害降低，但回合開始時的移動點數減少；持續到取消。
    expires: never
    stacking: refresh
    beneficial: true
    budget_points: 11
    min_rarity: rare
    stance: true
    damage_taken_permille: 750
    move_permille: 500
  - id: infused_fire
    polarity: buff
    name_zh: 火焰附魔
    description_zh: 普攻與沒有自己元素的武器技，物理傷害改成火焰（可點燃油與易燃物）；與其他附魔不並存，後施放的覆蓋先施放的。
    duration: 3
    expires: turn_end
    stacking: refresh
    beneficial: true
    min_rarity: rare
