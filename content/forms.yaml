# 形態（Phase 3J-1a，docs/design/06-技能.md 6.30；玩法決定 #48）。數值為初值（照 6.30 表），未經模擬。
# 形態＝姿態的擴充：enter_form 原語（技能 kind: stance）進入，花 1 AP、和姿態互斥、自己回合取消免費、倒下或戰鬥結束解除。
# 不加六屬性：只加天生武器、防禦、移動、最大 HP %、抗性與形態專屬效果。百分比一律寫千分比（‰）。
#
# upkeep_stamina／upkeep_mana：每回合開始的維持費（物理形態扣耐力、心智形態扣法力），不夠付就自動解除。
# cooldown：離開一個形態（自己取消、被迫解除、切換）後「該形態」的冷卻回合；別的形態不受影響。
#
# 10 種：3J-1a 放熊、貓、巨鵰、元素化身、狼人；3J-1b 補天生武器特性（traits：strikes 打幾下、knockback 推擊、
# reach 觸及、bleed 流血回合、backstab_crit 背刺暴擊範圍）與惡魔、巨人、暗影形態、樹人、龍。
# 龍的天生武器是蓄力吐息（3J-2 的定向蓄力，charge）：普攻＝選方向開始蓄力，下一個自己的回合開始時以錐形釋放
# （1d8＋智力 × 0.3 的所選元素傷害）；range 只用來列出「朝某個敵人」的快捷動作。
upkeep_stamina: 8                # #67（2026-10-29，使用者「A」）：5 → 8，耐力每回合回 5，淨扣 3
upkeep_mana: 3
stance_upkeep_stamina: 2         # 3W-2b：一般姿態每點維持費（SkillDef.stance_upkeep）的耐力數（武器技）
stance_upkeep_mana: 1            # 法力數（法術技）
cooldown: 2
forms:
  - id: bear
    name_zh: 熊
    category: physical
    look: form_bear
    natural_weapon: {name_zh: 熊爪, dice: 1d8, attack: melee, attrs: [str, con]}
    effects: {max_hp_permille: 150, defense_permille: 100, move: -1}
    entry: {shield_max_hp_permille: 100}
  - id: cat
    name_zh: 貓
    category: physical
    look: form_cat
    natural_weapon: {name_zh: 貓爪, dice: 1d6, attack: melee, attrs: [dex], traits: {backstab_crit: 1}}
    effects: {move: 1}
    entry: {next_attack_crit: 2}
  - id: roc
    name_zh: 巨鵰
    category: mental
    look: form_roc
    natural_weapon: {name_zh: 鳥喙, dice: 1d6, attack: ranged, range: 4, attrs: [wis]}
    effects: {flat_height: 1, max_hp_permille: -100}
    entry: {next_attack_hit: 2}
  - id: elemental
    name_zh: 元素化身
    category: mental
    look: form_elemental
    natural_weapon:
      {name_zh: 元素彈, dice: 1d6, attack: ranged, range: 4, attrs: [int], element_choices: [fire, ice, lightning], damage_permille: 100}
    effects: {damage_taken: [{element: chosen, permille: 500}]}
    entry: {burst: {radius: 1, dice: 1d6, element: chosen}}
  - id: werewolf
    name_zh: 狼人
    category: physical
    look: form_werewolf
    natural_weapon: {name_zh: 狼人爪, dice: 1d8, attack: melee, attrs: [str, dex], traits: {bleed: 1}}
    effects: {move: 1, defense_permille: -100}
    entry: {heal_max_hp_permille: 100}
  - id: demon
    name_zh: 惡魔
    category: physical
    look: form_demon
    natural_weapon:
      {name_zh: 雙刃, dice: 1d6, attack: melee, attrs: [dex], element: shadow, traits: {strikes: 2}}
    effects: {move: 1}
    entry: {move: 2}
  - id: giant
    name_zh: 巨人
    category: physical
    look: form_giant
    natural_weapon: {name_zh: 巨拳, dice: 1d10, attack: melee, attrs: [str], traits: {knockback: 1}}
    effects: {move: -1}
    entry: {collision_permille: 500}
  - id: shadow
    name_zh: 暗影形態
    category: mental
    look: form_shadow
    natural_weapon: {name_zh: 暗影觸, dice: 1d6, attack: ranged, range: 3, attrs: [wil]}
    effects: {damage_taken: [{element: physical, permille: 800}, {element: holy, permille: 1500}]}
    entry: {conceal: 1}
  - id: treant
    name_zh: 樹人
    category: mental
    look: form_treant
    natural_weapon: {name_zh: 枝條, dice: 1d6, attack: melee, range: 2, attrs: [wis], traits: {reach: 2}}
    effects: {heal_permille: 200, move: -2, damage_taken: [{element: fire, permille: 1500}]}
    entry: {heal_adjacent: {dice: 1d8, attr: wis, attr_permille: 500}}
  - id: dragon
    name_zh: 龍
    category: mental
    look: form_dragon
    natural_weapon:
      {name_zh: 吐息, dice: 1d8, attack: ranged, range: 3, attrs: [int], element_choices: [fire, ice, lightning], charge: {size: 3}}
    effects: {max_hp_permille: 100, move: -1}
    entry: {shield_max_hp_permille: 50}
