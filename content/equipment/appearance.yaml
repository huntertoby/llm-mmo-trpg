# 裝備外觀清單（Phase 3G-G5a；來源：美術 PM 的 docs/art/裝備外觀移植需求.md 第 1 節與 docs/art/sample/gearArt.js 的 KINDS）。
#
# 外觀只由資料欄位決定，不影響任何規則。物品（items.yaml）可選填 kind／form／material／dye／style；
# LLM 之後只能從這份清單選。不認得的值一律退回預設（前端 render/gearIcon.ts 的 resolve），不會出錯：
#   kind 不認得 → sword｜form 不認得 → 該 kind 的第一個形制｜material 不在允許內 → 該 form 的預設材質（沒有就用 kind 的預設）
#   dye 只對布、皮有效，否則不染色｜style 目前只有 common｜rarity 不認得 → common
# keywords 不是人填的：由物品的詞條推導（trpg.content.appearance.derive_keywords），取前 2 個；id 與
# skill_keywords.yaml（3-24b1）一致。顏色不放這裡，統一在前端 render/artPalette.ts。
# 風格包（東方、魔導、科技、現代）不做，等世界觀定案。
# 前端用的 JSON 由 scripts/export_appearance.py 匯出到 client/src/render/gearAppearance.json（tests 檢查沒有過期）。
styles: [common]
materials: [iron, steel, copper, silver, gold, wood, leather, cloth, bone, crystal]
dyes: [red, blue, green, purple, black, white, brown, gold]
dye_materials: [cloth, leather]
rarities: [common, uncommon, rare, epic, legendary]
max_keywords: 2
keywords: [ignite, wet, charged, frozen, prone, collision, marked, high_ground, concealed, summon]
# 元素關鍵字（混色）；其餘只加小圖樣
element_keywords: [ignite, wet, charged, frozen]
