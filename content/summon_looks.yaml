# 召喚物外觀表（Phase 3-33h1，docs/art/召喚物外觀.md「移植需求」第 1 節；美術 PM 定案的 17 種）。
# 純顯示資料，不進引擎結算。召喚物範本（content/units/summons/）存在時，範本的 look 欄位要與這裡一致
# （tests/content/test_summon_looks.py 檢查）；尚未存在的（3-33e1／e2 才新增）先放在這裡，新增時照填。
# element 用關鍵字 ID（skill_keywords.yaml），實際顯示以召喚物的灌注關鍵字為先。
# 大小倍率：small 0.8、medium 1.0、large 1.25（前端）。
