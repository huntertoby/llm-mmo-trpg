# 技能縮放屬性的允許範圍（Phase 3H-1；docs/design/06-技能.md 6.10、07-角色成長.md 7.2；玩法決定 #45）。
#
# 武器技（category: weapon）：**看手上武器的屬性**（Phase 3H-6，玩法決定 #45）——命中與傷害用武器的縮放屬性
#   （雙屬性武器取較高／取平均），技能自己的 scaling_attr 不生效，只當顯示提示。內建技能的 scaling_attr
#   必須是某把同大類（weapon_req）、玩家可裝備的武器的縮放屬性（含第二縮放屬性，見 weapons.yaml）；
#   隨機組合器、LLM 提議與工坊產生的武器技則一律設為 weapon_class_attrs 的武器大類主屬性（不帶第二屬性）。
# 法術技（category: spell）：依主題，**主題由效果推導**（Phase 3H-7，玩法 PM 2026-10-24）。依序看技能的效果（主要效果
#   在前；複合技能接著看第二段），第一個帶有主題訊號的效果是「主要效果」：訊號＝原語 effect_types_any、元素
#   elements_any（召喚看召喚物武器的元素）、表面 surfaces_any、狀態 statuses_any（consume_status 的 then 一起看）。
#   主要效果符合的主題中，spell_themes 順序第一個決定主屬性；同一個效果也符合組合主題的另一個主題時可看其一
#   （附帶效果不算）。物理傷害、拉扯、障礙、減速等沒有主題訊號，跳過看下一個效果。
#   **標籤只當輔助**：每個效果都沒有訊號時（物理傷害、修正規則、規則改變…）才看 tags_any／tags_none；
#   標籤不能改掉效果推導出的主題。都不符合的（物理、裝備動作等）是身體類，允許 body_attrs。
#   智力＝元素傷害與互動｜感知＝治療、護盾、輔助、偵測與標記｜意志＝召喚、獻祭、詛咒、心智控制、暗影。
# overrides：個別技能的例外，要寫理由。
# 內建技能由 `trpg content check` 與 tests/content/test_skill_scaling.py 檢查；
# 3H-3 的隨機組合器與 LLM 提議也從這份規則取得允許的屬性。

spell_themes:
  # 意志：召喚、獻祭、詛咒、心智控制、暗影（先比對，因為「召喚＋輔助」「暗影＋治療」仍算意志）
  - id: mind
    attr: wil
    label_zh: 召喚、獻祭、詛咒、心智控制、暗影
    effect_types_any: [summon, sacrifice_summon]
    elements_any: [shadow]
    surfaces_any: [darkness]
    statuses_any: [feared, silenced, taunted]
    tags_any: [summon, sacrifice, shadow, curse, fear, silence, taunt]
    tags_none: [mark]          # 標記屬於偵測與標記（感知），即使是暗影系（只在看標籤時）
  # 感知：治療、護盾、輔助、偵測與標記
  - id: support
    attr: wis
    label_zh: 治療、護盾、輔助、偵測與標記
    effect_types_any: [heal, shield, cleanse, revive, reveal, restore_resource, redirect_damage, cheat_death, extra_reaction, grant_skill, grant_ap, reset_cooldown]
    elements_any: [holy]
    surfaces_any: [holy]
    statuses_any: [marked, revealed, guarded, regenerating, defending, shielded, undying, soul_link, rallied]
    tags_any: [heal, shield, support, reveal, scout, mark, cleanse, guard, utility, luck, holy, nature, buff]
    tags_none: [physical, gear, rage]   # 物理與裝備動作、怒氣增益屬於身體類（只在看標籤時）
  # 智力：元素傷害與互動（含奧術位移、念力、符文引爆、複製法術）
  - id: elemental
    attr: int
    label_zh: 元素傷害與互動
    effect_types_any: [teleport, teleport_target, swap_any, hurl_object, topple, detonate_runes, copy_skill]
    elements_any: [fire, ice, lightning, earth, poison, wind]
    surfaces_any: [fire, ice, oil, poison, water]
    statuses_any: [burning, frozen, poison]
    tags_any: [fire, ice, lightning, earth, water, arcane, rune, rune_read, rune_make, rune_detonate, ash, poison, telekinesis, oil]

body_attrs: [str, dex, con]

# 武器技的武器大類主屬性（Phase 3H-6）：產生器與驗證器給武器技的 scaling_attr；每個值必須是該大類
# 玩家可裝備武器的縮放屬性（載入時檢查）。武器技的 weapon_req 只有 melee、ranged。
weapon_class_attrs: {melee: str, ranged: dex}

# 組合主題（玩法 PM 2026-10-23，06 6.10）：法術同時帶元素和另一個主題時，可以看兩者之一，產生技能時取主角
# 較高的那個（例：火焰詛咒、召喚火靈看智力或意志；聖水、治療之雨看智力或感知）。純元素傷害仍只看智力。
# 內建技能不重新指定（它們目前的屬性本來就在允許範圍內），這條只放寬隨機組合器與 LLM 提議的選擇範圍。
combos:
  - {themes: [elemental, mind], anywhere: [elemental], reason_zh: 元素＋意志主題（暗影、詛咒、恐懼、召喚、獻祭）看智力或意志}
  - {themes: [elemental, support], anywhere: [elemental], reason_zh: 元素＋感知主題（治療、護盾、輔助、標記）看智力或感知}

overrides:
  - {skill: skill_arcane_blade, attrs: [str, int], reason_zh: 魔劍斬是力量＋智力的雙屬性法術（混搭 build 的範例；魔劍士方案 A 決定前維持特例）}
  - {skill: skill_fracture_mark, attrs: [int], reason_zh: 裂骨印記是物理弱點標記，原本看智力，效果與數值不變}
  - {skill: skill_hunt_sigil, attrs: [wis], reason_zh: 獵印是標記獵物（偵測與標記），不是元素符文}
  - {skill: skill_mountain_mover, attrs: [str], reason_zh: 移山之力是力量傳說（位移改造），不看元素}
  - {skill: skill_summon_elite, attrs: [wil], reason_zh: 召喚物強化修正技能，跟著召喚走意志}
  - {skill: skill_summon_swarm, attrs: [wil], reason_zh: 召喚物強化修正技能，跟著召喚走意志}
  # 3H-7：主題改由效果推導後，下列內建技能的主要效果（治療、護盾、毒表面）會落到別的主題；維持現值並附理由
  - {skill: skill_bloodlust, attrs: [str, dex, con], reason_zh: 嗜血是擊殺回血的身體被動（物理、怒氣），治療只是結果，不是感知系的治療法術}
  - {skill: skill_grief_rage, attrs: [str, dex, con], reason_zh: 悲憤是怒氣反應（增傷加護盾），屬於身體類，不是感知系的護盾法術}
  - {skill: skill_ember_ward, attrs: [int], reason_zh: 餘燼護盾是火焰系被動（火焰法師的防身），維持智力}
  - {skill: skill_thorn_wall, attrs: [wis], reason_zh: 荊棘牆是自然系的屏障（毒只是荊棘的附帶），歸感知}
  # 造水表面算元素主題（玩法 PM 2026-10-24）後，下列兩招和喚潮同樣是「造水＋緩速」會推導成只看智力；維持原本的範圍待玩法 PM 決定
  - {skill: skill_downpour, attrs: [wis, int], reason_zh: 驟雨原本可看感知或智力（輔助＋造水），範圍不變；是否比照喚潮只看智力待玩法 PM 決定}
  - {skill: skill_splash_flask, attrs: [wis, int], reason_zh: 潑水瓶原本可看感知或智力（輔助＋造水），範圍不變；是否比照喚潮只看智力待玩法 PM 決定}
