# 技能成長（Phase 3-26a，06 6.28；玩法決定 #38）。數值一律放這裡；計算用整數千分比（‰），無條件捨去。
# 只有主動技能可以升級（被動、反應、姿態的等級先不做）。

max_level: 5                  # 技能等級 1～5
points_per_level: 2           # 主角每升 1 級給的技能點（等級 10 約 18 點）
upgrade_cost: 1               # 技能每升 1 級花的技能點（PM 決定，3-26a）

# 各等級的累計效果加成（‰），第 N 個值是 N 級：2 級、4 級各 +10%，3 級先只計等級（分歧進化在 3-26b）。
# 套用在傷害、治療、護盾的倍率上（技能效果的 dice／縮放屬性算出來之後再乘，無條件捨去）。
effect_permille: [0, 100, 100, 200, 200]

# 5 級的小特性（原型依技能自動擇一）：技能的形狀有可增加的範圍（size／radius，且未達形狀上限 6.6）就範圍 +1，
# 否則冷卻 −1（原冷卻至少要 min_cooldown，減完不會變成沒有冷卻）；兩者都做不到就沒有小特性。
trait_level: 5
trait_area_delta: 1
trait_cooldown_delta: 1
trait_min_cooldown: 2

# 3 級分歧進化的門檻（用過次數）在 3-26b 才使用，先保留設定位置（原型 3、大世界 10）。
evolve_level: 3
