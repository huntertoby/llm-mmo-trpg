# 反應（docs/專案計畫.md 5.2.1；docs/phases/Phase1計畫.md 6.1-9）。
# reactions：反應定義（effect 的語意由引擎實作，數值在這裡）。
#   reduce_damage：本次攻擊傷害 ×(1 − damage_reduction_permille)，無條件捨去，最低 1。
#   basic_attack：以武器普攻觸發者（不花 AP；requires_melee_weapon 時只有近戰武器能用）。
# 反應技（kind: reaction，Phase 2E-2、3D-3；技能的 reaction.event，同時是單位反應規則的 when.event）的觸發事件：
#   hit_by_melee／hit_by_attack     被近戰／任何攻擊命中、傷害之後
#   ally_hit_adjacent                相鄰友方被攻擊命中、傷害之前（配 intercept 原語）
#   enemy_leaves_adjacent            敵人離開相鄰格時（同藉機攻擊）
#   hit_by_spell（3D-3）             被 category: spell 的技能命中、傷害之前；另一方是施放者
#   ally_downed（3D-3）              視野內的友方倒下之後；另一方是倒下的友方（反應技形狀必須是 self）
#   enemy_enters_adjacent（3D-3）    敵人主動移動（步行、衝鋒、直線衝撞）進入相鄰格之後；強制位移不算
#   ally_targeted（3D-3）            相鄰友方被敵人單體技能或普攻選為目標、命中判定之前；另一方是攻擊者（aid: true 時是那名友方）
#   ally_hit_near（TF-1）            相鄰友方被敵人的攻擊（普攻或技能）命中、傷害之後仍站著；另一方是那名友方（必須 aid: true）
# 內建反應的事件（reactions[].events）：
#   enemy_moves_in_range（3D-8c）    敵人主動移動（步行、衝鋒、直線衝撞）的一步結束後，位置在持有者武器射程與視線內
#                                    （強制位移、傳送、跳躍、互換不算）。監視射擊 overwatch_shot 用它
#   ally_hit_in_range（3G-G3b）      射程內（距離由裝備詞條決定）的友方被敵人單體攻擊命中、傷害之前；另一方是攻擊者。
#                                    redirect_damage 用它（只由裝備詞條授予，不在 default_rules）
#   kin_hit_in_range（5A-M1）        range 格內帶 kin_tag 的友方被敵人的攻擊（普攻或技能）命中、傷害之前；另一方是攻擊者。
#                                    shield_ally 用它（同門相護：替他加 shield_dice + shield_flat 的護盾）
# redirect_damage：改由持有者承受這次攻擊（同 intercept，不重擲命中、不花耐力）。
# requires_status（3D-8c）：持有者必須帶有這個狀態才能反應，反應用掉（普攻結算完）之後移除該狀態
# 監視射擊沒有出現在 default_rules：單位裝備了施加 overwatch 狀態的技能時，由引擎自動加上一條 auto 規則
# （玩家可用 SetReactionMode 改成 prompt 或 off）。
# default_rules：單位範本沒有指定 reactions 時使用的預設規則（格式照計畫範例；mode 預設 auto）。
# 每個單位每輪最多反應 rules/core.yaml 的 reactions_per_round 次（每輪開始時重設）。
reactions:
  - id: block
    name_zh: 格擋
    description_zh: 被近戰攻擊命中後，傷害減半，消耗 10 耐力。
    effect: reduce_damage
    events: [targeted_by_melee, targeted_by_attack]
    stamina_cost: 10
    damage_reduction_permille: 500
  - id: opportunity_attack
    name_zh: 藉機攻擊
    description_zh: 敵人離開武器的觸及範圍（一般近戰為相鄰格，矛為 2 格）時，以近戰武器攻擊一次（不花 AP）。
    effect: basic_attack
    events: [enemy_leaves_adjacent]
    requires_melee_weapon: true
  - id: overwatch_shot
    name_zh: 監視射擊
    description_zh: 帶有「監視」狀態時，敵人在武器射程與視線內完成一步移動，就自動普攻一次（不花 AP）；射擊後監視結束。
    effect: basic_attack
    events: [enemy_moves_in_range]
    requires_status: overwatch
  # Phase 3I-1：拳套的反擊（08 8.11）。不在 default_rules：手上武器有 counter 時由引擎自動加上一條 auto 規則；
  # 佔本輪反應（和格擋共用次數），不花 AP、不花耐力。
  - id: counter_attack
    name_zh: 反擊
    description_zh: 相鄰敵人的近戰攻擊命中你、你還站著時，自動對攻擊者普攻一次（拳套；不花 AP 與耐力）。
    effect: basic_attack
    events: [hit_by_melee]
    requires_melee_weapon: true
    requires_counter_weapon: true
  - id: redirect_damage
    name_zh: 替隊友承受
    description_zh: 範圍內的隊友被敵人單體攻擊命中時，改由你承受這次攻擊（來自裝備，每輪最多一次）。
    effect: redirect_damage
    events: [ally_hit_in_range]
  # Phase 5A-M1：雲嶺山中修士的招牌「同門相護」（docs/design/18-雲嶺內容.md 18.2.1；數值初值，未經模擬）。
  # 不在 default_rules：範本的 reactions 明寫一條 kin_ward 規則才有。佔本輪反應（每輪 1 次）；被沉默時不能用。
  - id: kin_ward
    name_zh: 同門相護
    description_zh: 2 格內的同門被敵人攻擊命中時（傷害之前），替他加一層小護盾（每輪 1 次；被沉默時不能用）。
    effect: shield_ally
    events: [kin_hit_in_range]
    range: 2
    kin_tag: sect
    shield_dice: 1d4
    shield_flat: 2
    blocked_by_silence: true
# events（Phase 3E-2e）：反應事件的中文名與說明，ReactionWhen.event 的每個值都要有一列（schema 與測試檢查）；
# 技能卡的「反應時機」部件與 glossary API 用，前端不再手寫。
events:
  - {id: targeted_by_melee, name_zh: 被近戰攻擊時, description_zh: 被近戰攻擊命中之後、傷害結算之前。}
  - {id: targeted_by_attack, name_zh: 被攻擊時, description_zh: 被任何攻擊命中之後、傷害結算之前。}
  - {id: enemy_leaves_adjacent, name_zh: 敵人離開時, description_zh: 敵人離開你的觸及範圍時。}
  - {id: hit_by_melee, name_zh: 被近戰擊中時, description_zh: 被近戰攻擊命中、傷害結算之後。}
  - {id: hit_by_attack, name_zh: 被攻擊時, description_zh: 被任何攻擊命中、傷害結算之後。}
  - {id: ally_hit_adjacent, name_zh: 身旁隊友受擊時, description_zh: 相鄰的友方被攻擊命中、傷害結算之前。}
  - {id: hit_by_spell, name_zh: 被法術擊中時, description_zh: 被法術技命中、傷害結算之前；另一方是施放者。}
  - {id: ally_downed, name_zh: 隊友倒下時, description_zh: 視野內的友方倒下之後。}
  - {id: enemy_enters_adjacent, name_zh: 敵人靠近時, description_zh: 敵人主動移動進入你的相鄰格之後；被強制位移不算。}
  - {id: ally_targeted, name_zh: 隊友被瞄準時, description_zh: 相鄰友方被敵人的單體技能或普攻選為目標、命中判定之前。}
  - {id: ally_hit_near, name_zh: 身旁隊友受擊後, description_zh: 相鄰友方被敵人的攻擊（普攻或技能）命中、傷害結算之後仍站著；反應作用在那名友方。}
  - {id: enemy_moves_in_range, name_zh: 敵人在射程內移動時, description_zh: 敵人主動移動一步後，位置在你的武器射程與視線內。}
  - {id: ally_hit_in_range, name_zh: 範圍內隊友受擊時, description_zh: 範圍內的友方被敵人單體攻擊命中、傷害結算之前。}
  - {id: kin_hit_in_range, name_zh: 同門受擊時, description_zh: 範圍內帶同門標籤的友方被敵人的攻擊命中、傷害結算之前。}
default_rules:
  - reaction: block
    when: {event: targeted_by_melee}
    unless: {self_stamina_below: 20}
  - reaction: opportunity_attack
    when: {event: enemy_leaves_adjacent}
