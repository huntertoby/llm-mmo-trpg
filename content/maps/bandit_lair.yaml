# Boss 地圖：盜賊巢穴（Phase 3-5b）。只給 roguelite 一輪的 Boss 戰，不進一般抽選、`sim matrix`
# 與網頁的一般地圖列表（地圖類型 boss）。12×10，我方從西側攻入，盜賊首領坐鎮東側高台。
#
# - 高低差：東側 x 9–11、y 3–6 是高 2 的高台（首領與弓手居高臨下），經由 x 8 的高 1 台階（y 3–6）
#   爬上；西南角 (1–2, 8–9) 有高 1 的矮坡。
# - 致命地形：北側中央與南側偏東各一個 2×2 的岩漿池（x 4–5、y 2–3；x 6–7、y 6–7）。把人推進去
#   就死（首領與精英只受 30% 最大 HP）。
# - 源泉格：兩個，在兩個岩漿池之間的中場 (5, 5) 與 (6, 4)，要往前搶。
# - 可推倒的石柱：(3, 3)、(3, 6)；往東推倒會壓向岩漿與中場，可以架出通路或擋住射線。
# - 可投擲／可推的物件：木箱（北、南各兩個）、台階前的兩個油桶（火焰會引爆，波及台階上的人）。
# - 援軍：第 3 輪結束時兩名盜賊從北、南兩側緣出現（提前一輪預告）。
