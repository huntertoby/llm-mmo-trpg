# 地圖類型：吊橋深淵（bridge_chasm）的變體：岩漿河。一條 2 格寬的岩漿河切開戰場，兩岸高度 1；
# 中央有一座 2×2 的寬木橋，北端被牆封住，只剩最南邊一格寬的陸路可以繞過去。橋是主戰場：
# 推擊、燒斷木橋、爆炸都能把人送進岩漿（致命地形）。位移流與火焰流有利；怕被推的近戰重甲不利。
# 敵方是兩名盾衛加兩名弓手，弓手在對岸居高（高度 1 的岸邊）射擊橋上的人。
