# 示範地圖：油庫。油桶與漏油遍地；火焰與範圍攻擊大顯身手，站在油上的近戰要小心。
# 盜賊們守在漏油的倉庫中央；第 3 輪結束時，援軍從東北角出現（提前一輪預告）。
# Phase 1C：倉庫東側的牆壁（全掩護）；我方前方的矮牆與木箱提供半掩護——油桶也是半掩護，
# 但躲在油桶後面很危險。
