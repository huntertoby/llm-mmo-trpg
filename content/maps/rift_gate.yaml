# - 浮台半徑約 6 格；外圈是虛空（吊橋深淵的致命地形 chasm，掉下去就出局）。
# - 三個方向各 1 根源晶柱：霧柱（北 6,1）、雷柱（西南 2,9）、火柱（東南 10,9）；柱子之間有幾格斷裂（虛空）。
# - 碎晶之主在中央（6,6）；我方從南側上台。
# 荒原的地點圖還沒進遊戲，挑戰從城鎮進入（代決 5F3-1）。階段寫在本體與柱子的範本裡。
