# Boss 地圖：熔心坑（Phase 5F-5a；docs/design/20-第一季商店與裝備內容.md 20.6、19-灰燼荒原與賽季主線.md 19.2.3）。
# 灰燼荒原區域 Boss「灰燼之心」的專屬地圖（地圖類型 boss：不進一般抽選、模擬的預設地圖與一般地圖列表）。12×12，熔岩洞窟的 Boss 版。
#
# GB-2 改圖（#152、#164；19.2.3「熔心坑改圖」，座標由開發定）：
# - 坑底（x 2–9、y 2–9）維持 8×8 石地；外圈是岩漿（致命地形），南側留 2 條通路（3, 10）、（8, 10）；我方從南邊的通路入口（y 11）進坑。
# - 灰燼之心是 3×3 的不動巨型頭目，中心 (5, 3)，佔 x 4–6、y 2–4，靠北側中段、背後（北，y 1）是岩漿；朝南（giant_facing）。
#   兩隻餘燼蜥開場在 (2, 4)、(8, 4)；第 2 階段召喚的從殼縫東西兩側 (3, 3)、(7, 3) 出來（寫在灰燼之心的範本）。
# - 2 道矮牆往南移到 (4, 9)、(7, 9)（不擋 (3, 9)、(8, 9) 的通路）。
# - 4 個冷卻井（水表面）：殼縫旁 (3, 4)、(7, 4)（殼縫攻擊位 (3, 3)、(7, 3) 的南邊一格），南邊 (3, 8)、(8, 8)。
#   沒有「打破造水」的物件（換皮要新物件與美術），先用預放、不會消失的水表面（各 1 格）代替（代決 5F5a-7）。
# - 南邊入口兩側各 1 格高台 (2, 9)、(9, 9)，高 1。
# 階段（第 2 階段殼裂、召喚；第 3 階段火地從頭目南緣往南長）寫在灰燼之心的範本裡（content/units/ashen_heart.yaml）。
