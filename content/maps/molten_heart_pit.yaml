# Boss 地圖：熔心坑（Phase 5F-5a；docs/design/20-第一季商店與裝備內容.md 20.6、19-灰燼荒原與賽季主線.md 19.2.3）。
# 灰燼荒原區域 Boss「灰燼之心」的專屬地圖（地圖類型 boss：不進一般抽選、模擬的預設地圖與一般地圖列表）。12×12，熔岩洞窟的 Boss 版。
#
# - 坑底（x 2–9、y 2–9）是石地；灰燼之心在中央（5, 5），不移動；兩隻餘燼蜥在核心兩側（3, 5）、（7, 5）。
# - 外圈是岩漿（致命地形），南側留 2 條通路（3, 10）、（8, 10）；我方從南邊的通路入口（y 11）進坑。
# - 4 個冷卻井：沒有「打破造水」的物件（換皮要新物件與美術），先用預放、不會消失的水表面（各 1 格）代替（代決 5F5a-7）。
# 階段（第 2 階段殼裂、召喚；第 3 階段坑底冒火）寫在灰燼之心的範本裡（content/units/ashen_heart.yaml）。
