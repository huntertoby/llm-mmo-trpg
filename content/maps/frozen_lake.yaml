# 地圖類型：冰湖（frozen_lake）。湖面（x=3–8）整片是永久的冰面：走進去要過敏捷檢定（DC 12），
# 失敗倒地；火焰會把冰融成水。湖面散布 6 個冰窟（致命地形，被推進去直接死亡），其中兩個蓋著薄冰
# （可以走，但 HP 只有 6，打破後上面的單位落入冰窟）。兩岸是穩固的石地。
# 位移（推進冰窟）、冰凍與控場有利；近戰硬衝的 build 容易滑倒，火焰系會融掉自己的優勢。
