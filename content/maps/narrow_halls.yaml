# 地圖類型：狹窄走廊（corridor）。中央的厚牆把戰場切成東西兩間大廳，只靠兩條走廊相連：
# 北邊 1 格寬（y=2）、南邊 2 格寬（y=5、6）。走廊長 4 格，一旦有人堵住就是一夫當關。
# 直線、貫穿與範圍技能（走廊裡的人排成一列）、坦克（堵口）有利；需要繞側翼、靠高度或位移的
# build 不利。大廳各有兩根石柱、一個木箱與一個油桶（走廊口的油桶是雙面刃）。
