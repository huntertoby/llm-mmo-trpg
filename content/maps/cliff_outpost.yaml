# 地圖類型：廢墟高台（ruined_heights）的變體：懸崖前哨。東側是高度 3 的高台，敵人佔據；
# 高台西緣是懸崖（落差 3 層，無法攀爬），只有中央一座 2 格寬的階梯（高度 1→2→3）可以直接登上，
# 另有東北角的小坡（高度 1→2）可以繞後。從高台被推下來會受到墜落傷害。
# 遠程、高處射擊與位移（把人推下懸崖）有利；沒有射程、必須爬階梯硬攻的近戰不利。
