# roguelite 一輪的參數（Phase 3-5a；docs/phases/Phase3計畫.md 0.2、0.11、7.1）。數值都是初值，未經模擬。
# 所有亂數（地圖、遭遇、每場戰鬥的種子、升級候選、重骰）由「一輪的種子」以固定方式衍生。

battles: 5                    # 一般戰鬥的場數，之後 1 場 Boss（設計文件 7.1 的目標是 8–10 場）

# 一般戰鬥的地圖池：每場先抽一個地圖類型（同一輪不重複），再抽該類型的一張地圖。Boss 地圖不在池內。
map_pool: [bridge_chasm, cliff_outpost, dark_forest, frozen_lake, lava_crossing, narrow_halls, oil_depot, open_plain, swamp]

# 勝利條件輪替（Phase 3-22，玩法 #23）：一般戰鬥中至少 N 場撤離、M 場守點，其餘全滅；Boss 戰一律全滅。
# 抽一輪時一併決定（亂數標籤 plan/objective/*）；撤離與守點的格子與輪數由地圖的 alt_objectives 提供。
objective_rotation:
  min_escape: 1
  min_defend: 1

# 第 1 場起每場的敵人（先用現有盜賊系列；隨場數增加人數與種類），每場從 options 抽一組。
# 起始區每方 4 格，所以最多 4 名敵人。
encounters:
  - options:
      - [bandit, bandit]
      - [bandit, bandit_archer]
  - options:
      - [bandit, bandit, bandit_archer]
      - [bandit, bandit_archer, bandit_shieldbearer]
  - options:
      - [bandit, bandit, bandit_archer, bandit_shieldbearer]
      - [bandit, bandit_archer, bandit_archer, bandit_shieldbearer]
  - options:
      - [bandit, bandit, bandit_archer, bandit_archer]
      - [bandit, bandit_shieldbearer, bandit_archer, bandit_archer]
  - options:
      - [bandit_shieldbearer, bandit, bandit_archer, bandit_archer]
      - [bandit_shieldbearer, bandit_shieldbearer, bandit_archer, bandit_archer]

# Boss 戰（Phase 3-5b）：專屬地圖 bandit_lair（地圖類型 boss，不進一般抽選）與加強版頭目。
# 地圖另有第 3 輪的援軍事件（2 名盜賊）。
boss:
  map: bandit_lair
  enemies: [bandit_warlord, bandit, bandit_archer, bandit_shieldbearer]

companions: [sim_companion_fighter, sim_companion_archer]   # 每場 2 名標準隊友（0.11 H）
max_rounds: 30                # 每場輪數上限；超過算沒有打贏（一輪失敗）

# 經驗與升級（0.11 I：每場固定）
xp_per_battle: 100
level_thresholds: [100, 200, 350, 500, 700]   # 升到第 2、3、4、5、6 級的累計經驗
attribute_points_per_level: 2
base_attribute: 10            # 開局六項屬性皆為 10（設計文件 7.2）
start_free_points: 4          # 另有 4 點自由分配

# 升級與重骰的技能候選（隨機組合器）
offer_size: 3
off_route_per_offer: 1        # 其中 1 個「偏離路線」：縮放屬性與主角目前最高屬性不同（0.2 C）
offer_tier_by_level: [1, 1, 2, 2, 3, 3]       # 主角等級 → 候選的階級
offer_max_attempts: 200       # 湊齊候選最多試幾個組合器種子

# 營火（0.11 G）：HP、法力、耐力（3H-2）回滿，源力 +campfire，並提供重骰（0.2 F）。中段（第 3 場後）與 Boss 前（第 5 場後）。
campfire_after: [3, 5]
rerolls_per_campfire: 1
# 每場打贏後回滿的資源（Phase 3H-2 設定點；mana／stamina）。「每場法力回滿」（B 選項）待使用者決定，目前不開：[]
refill_after_battle: []

# 源力（0.11 K；上限 3、每場開場至少 1 在 rules/core.yaml）
source:
  after_battle: 1             # 打贏一場 +1（擊殺精英的 +1 在戰鬥中由引擎處理）
  campfire: 1
  boss_floor: 2               # 進入 Boss 戰前至少 2 點

# 新開局（Phase 3-24b2，06 6.27.3）：自選起始武器（weapons.yaml 全部）＋選 keywords 個關鍵字，從每個關鍵字的
# 技能池（只看專屬規則推導的關鍵字）各給 1 招 1 階起始技能（以一輪的種子抽；亂數標籤 start/skill/<關鍵字>）。
# 池裡沒有與武器相容的技能時，以隨機組合器（指定該關鍵字）補，最多試 composer_tries 個種子；仍湊不到就不能選這個關鍵字。
# 主角的基礎數值依武器大類（比照先前的白板戰士、白板射手、白板法師）；所有人起始預算相同。
# 法力與耐力上限（3H-2，07 7.2）＝ 這裡的基礎（max_mana、stamina）＋ 屬性加成（rules/core.yaml 的 resources）。
# 耐力基礎依武器大類 近戰 40／遠程 30／法器 20，和法力 20／20／40 對稱（玩法 PM 2026-10-23，07 7.2）。
start:
  keywords: 2
  composer_tries: 16
  heroes:
    melee:  {name_zh: 冒險者, max_hp: 60, armor_bonus: 4, max_mana: 20, stamina: 40, resist: {physical: 100}}
    ranged: {name_zh: 冒險者, max_hp: 50, armor_bonus: 2, max_mana: 20, stamina: 30, resist: {physical: 50}}
    focus:  {name_zh: 冒險者, max_hp: 40, armor_bonus: 1, max_mana: 40, stamina: 20, resist: {elemental: 150}}

# 共用候選產生器（Phase 3-24b2，06 6.27.4；trpg.skillgen.candidates）：升級與營火三選一＝加深、橋接、新方向。
# 每個候選先以 composer_share_permille 的機率決定先從隨機組合器（指定關鍵字）或技能池找，找不到再換另一個來源；
# 組合器每個候選最多試 composer_tries 個種子。
candidates:
  composer_share_permille: 500
  composer_tries: 8
