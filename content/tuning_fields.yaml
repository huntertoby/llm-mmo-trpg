      - {path: modifier.points_milli.summon_limit, label_zh: 修正：召喚物上限 ±1的價值, group_zh: 修正技能, kind: int, hint_min: 1750, hint_max: 7000, note_zh: 千分之一點；修正規則「召喚物同時上限 ±1 的價值」，乘上每場預估使用次數就是點數。越大，帶這條規則的修正技能越貴。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: modifier.points_milli.summon_duration, label_zh: 修正：召喚物持續 +1 輪的價值, group_zh: 修正技能, kind: int, hint_min: 200, hint_max: 800, note_zh: 千分之一點；修正規則「召喚物持續 +1 輪的價值」，乘上每場預估使用次數就是點數。越大，帶這條規則的修正技能越貴。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: modifier.points_milli.summon_damage_per_100, label_zh: 修正：召喚物傷害每 +10%的價值, group_zh: 修正技能, kind: int, hint_min: 150, hint_max: 600, note_zh: 千分之一點；修正規則「召喚物傷害每 +10% 的價值」，乘上每場預估使用次數就是點數。越大，帶這條規則的修正技能越貴。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: modifier.points_milli.form_upkeep_per_100, label_zh: 修正：形態維持費每 −10%的價值, group_zh: 修正技能, kind: int, hint_min: 100, hint_max: 400, note_zh: 千分之一點；修正規則「形態維持費每減少 10% 的價值」，乘上每場預估使用次數就是點數。越大，帶這條規則的修正技能越貴。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: modifier.points_milli.form_entry_per_100, label_zh: 修正：形態進入獎勵每 +10%的價值, group_zh: 修正技能, kind: int, hint_min: 100, hint_max: 400, note_zh: 千分之一點；修正規則「形態進入獎勵每 +10% 的價值」，乘上每場預估使用次數就是點數。越大，帶這條規則的修正技能越貴。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: modifier.points_milli.silent_strike, label_zh: 無聲（被動常駐）的價值, group_zh: 修正技能, kind: int, hint_min: 0, hint_max: 1000, note_zh: 千分之一點；每次近戰攻擊不讓目標轉身值多少，乘上預估使用次數（所有攻擊 10 次）就是無聲被動的預算點數（360＝3.6 點）。改了「無聲步」這類被動的預算比例跟著變。}
      # SK-2b（SK-2 待決 5）：鉤的冷卻下限。
      - {path: hook_min_cooldown, label_zh: 鉤的最短冷卻（回合）, group_zh: 冷卻規則, kind: int, hint_min: 2, hint_max: 5, note_zh: 帶「鉤」（把直線上第一個敵人拉到身邊）的技能冷卻至少這麼多回合；手寫、組合器、LLM 與工坊做的鉤都照這個。越小鉤越常用。只能 1 以上。}
      - {path: borrow_min_cooldown, label_zh: 預支的最短冷卻（回合）, group_zh: 冷卻規則, kind: int, hint_min: 1, hint_max: 4, note_zh: 帶「預支」的技能每場限 1 次，或冷卻至少這麼多回合。越小預支越常用。只能 1 以上。}
      - {path: rule_rewrite_min_cooldown, label_zh: 改寫規則型技能的最短冷卻（回合）, group_zh: 冷卻規則, kind: int, hint_min: 2, hint_max: 8, note_zh: 帶改寫規則型原語（給 AP、重置冷卻、免死…）的技能每場限 1 次，或冷卻至少這麼多回合。只能 1 以上。}
      - {path: rule_rewrite_min_cooldown_with_source, label_zh: 花源力時改寫規則的最短冷卻（回合）, group_zh: 冷卻規則, kind: int, hint_min: 1, hint_max: 4, note_zh: 花源力（傳說）的改寫規則型技能改為每場限 1 次，或冷卻至少這麼多回合。只能 1 以上。}
      # FL-1a（06 6.34「費用方向」第 4 點）：閃現蓄力、輕巧每一級調多少（規則「一定要變、順序、回合 +1／累計 +2／最少留 1」不開）。
      - {path: flash_cost.damage_rungs, label_zh: 蓄力：傷害每次往上調幾格, group_zh: 閃現, kind: int, hint_min: 1, hint_max: 3, note_zh: 閃現「蓄力」在預算重調後沒有任何一項變強時，改把傷害（再來治療、護盾）的骰子或武器倍率往上調這麼多格（骰子依平均排序、倍率每格 100‰）；調完預算比例還低於 70% 時同一項再往上。1＝最小的一步。改了所有招的蓄力選項跟著變。}
      - {path: flash_cost.magnitude_step, label_zh: 蓄力／輕巧：狀態強度每級（‰）, group_zh: 閃現, kind: int, hint_min: 10, hint_max: 100, note_zh: 閃現「蓄力」「輕巧」調數值型狀態（燃燒、中毒、減速、易傷等）的強度時每一級多少千分比（25＝每級 +2.5%）。蓄力只在狀態回合已經加不上去（到 6 回合或原招 +2）時才加強度，最多到 2000‰；輕巧往下最多降回 1000‰。}
      # TF-1（#159，06 6.34.5「數值：縮小多少、持續幾回合，放進數值工坊由使用者調」）：召喚技的伴生、護主。
      - {path: flash_transform.companion_power_permille, label_zh: 伴生：開場召喚物的強度（‰）, group_zh: 閃現, kind: permille, hint_min: 200, hint_max: 1000, note_zh: 召喚技閃成「伴生」後，每場開打時身邊跟著的那隻召喚物的最大 HP 與傷害是一般的這麼多千分比（500＝一半）。這是起點：做出來的被動不在預算範圍時，會每 100‰ 往上下找最接近、合格的強度。}
      - {path: flash_transform.companion_duration, label_zh: 伴生：開場召喚物待幾輪, group_zh: 閃現, kind: int, hint_min: 1, hint_max: 4, note_zh: 伴生召出的召喚物存在幾輪（同一般召喚：在你第這麼多次回合結束時消失）。}
      - {path: flash_transform.guardian_power_permille, label_zh: 護主：反咬召喚物的強度（‰）, group_zh: 閃現, kind: permille, hint_min: 200, hint_max: 1000, note_zh: 召喚技閃成「護主」後，被近戰攻擊時冒出來反咬的那隻召喚物的最大 HP 與傷害是一般的這麼多千分比。這是起點：不在預算範圍時會每 100‰ 往上下找最接近、合格的強度。}
      - {path: flash_transform.guardian_duration, label_zh: 護主：反咬召喚物待幾輪, group_zh: 閃現, kind: int, hint_min: 1, hint_max: 4, note_zh: 護主召出的召喚物存在幾輪（設計是 1 回合）。}
  # NW-3（CW-1 報告待決 5）：格子物件（content/objects.yaml，所有物件在同一個檔、全體共用）。只開 max_hp，只展開已寫的物件
  # （沒寫＝打不破，插入會變成結構改動）；爆炸、漏出、標籤等不開。
  - kind: object
    label_zh: 格子物件
    glob: objects.yaml
    fields:
      - {path: "objects[*].max_hp", label_zh: 最大 HP, kind: int, hint_min: 10, hint_max: 990, existing_only: true, note_zh: 打破這種物件要的傷害；所有地圖上的這種物件一起變。只能 1 以上。HP 越低越容易被打破（敵我的攻擊、爆炸、範圍技都算），例：冷卻井打破後周圍 3×3 變成水面。}
  # PK-1（挑選模式提案第 6 節第 5 題 A：打分權重放數值工坊，由使用者調）：skill_pick.yaml 全部開。
  - kind: pick
    label_zh: 技能挑選模式
    glob: skill_pick.yaml
    fields:
      - {path: pool.seeds, label_zh: 候選池：組合器抽幾個種子, kind: int, hint_min: 10, hint_max: 200, note_zh: 每次出題組合器最多抽這麼多個種子（每個種子一招，同一個設計只留第一個）。越多候選越多樣，但出題越慢（帶關鍵字的題目每個種子約 20～150 毫秒）。}
      - {path: pool.designs, label_zh: 候選池：湊到幾個不同設計就停, kind: int, hint_min: 4, hint_max: 40, note_zh: 不同設計（骨架＋種類＋形狀＋效果種類＋元素；只差數字算同一個）湊到這麼多個就不再抽。是打分前的候選上限。}
      - {path: pool.top_k, label_zh: 送給本機模型幾個候選, kind: int, hint_min: 2, hint_max: 8, note_zh: 打分後取前這麼多個給本機模型挑一個並取名（提案建議 4～6 個）。越多 prompt 越長、越慢。}
      - {path: pool.min_for_llm, label_zh: 候選少於幾個就不問模型, kind: int, hint_min: 1, hint_max: 4, note_zh: 合法候選少於這個數就直接用分數第一名、取組合式名稱，不呼叫本機模型。不能大於「送給本機模型幾個候選」。}
      - {path: pool.handwritten_max, label_zh: 候選裡最多幾個手寫技能, kind: int, hint_min: 0, hint_max: 1, note_zh: PK-1b：送給本機模型的候選裡最多放幾個內容庫的手寫技能（0＝不放，挑選模式只出新招；1＝最多一個）。玩家手上已有的技能不論這裡設多少都不會進候選。}
      - {path: pool.element_seeds, label_zh: 同元素補抽：最多幾個種子, kind: int, hint_min: 0, hint_max: 200, note_zh: PK-1b：玩家手上有元素技能、而候選池裡同元素的設計不夠時，另外再抽最多這麼多個種子，只收和玩家同元素的新設計；0＝不補抽。越多越慢。}
      - {path: pool.element_designs, label_zh: 同元素補抽：至少要幾個同元素設計, kind: int, hint_min: 0, hint_max: 10, note_zh: PK-1b：候選池裡和玩家手上技能同元素的設計少於這個數才補抽，補到這個數就停。}
      - {path: pool.slot_seeds, label_zh: 三選一每格另外抽幾個種子, kind: int, hint_min: 0, hint_max: 40, note_zh: PK-2：升級與完整技能三選一的每一格（加深、橋接、新方向），照這一格的出題條件（關鍵字、種類、屬性路線）另外抽這麼多個種子當候選，再打分取前幾名給本機模型挑。越多越慢；0＝每格只有原本出題的那一張。}
      - {path: pool.complete_slot_seeds, label_zh: 完整技能三選一每格另外抽幾個種子, kind: int, hint_min: 0, hint_max: 20, note_zh: PK-2：完整技能三選一（原型特殊時刻、大世界機遇）的每一格另外抽這麼多個種子。組合器做整招比白板慢（每個種子約 0.05～0.2 秒），越多出題越慢；0＝每格只有原本出題的那一張。}
      - {path: pool.nondamage_seeds, label_zh: 非傷害保底格最多補抽幾個種子, kind: int, hint_min: 0, hint_max: 40, note_zh: PK-2：每次三選一有一格只放非傷害技能（輔助、治療、控制、位移、召喚、防守）。這一格的非傷害候選不夠（或三格都沒有）時，最多另外補抽這麼多個種子，只收非傷害的；0＝不補抽。}
      - {path: pool.relax_until, label_zh: 三選一每格至少湊幾個候選才停止放寬, kind: int, hint_min: 1, hint_max: 8, note_zh: PK-3：每一格先只收全部關鍵字都對、路線也對的候選；不到這麼多個時，依序放寬（橋接這類多關鍵字的格子先收只帶部分關鍵字的，再收不跟主路線的「偏離」候選）補上，放寬的另外扣分、排在後面。越大越常放寬。}
      - {path: pool.flash_top_k, label_zh: 閃現每格給模型幾個候選, kind: int, hint_min: 1, hint_max: 8, note_zh: PK-3：閃現與重閃的每一個選項格（類別由程式決定），依用法統計排序後給本機模型這麼多個候選挑一個並取名；第一個就是原本會出的那一個。越多 prompt 越長、越慢。}
      - {path: pool.wish_candidates, label_zh: 許願池：候選量, kind: int, hint_min: 3, hint_max: 30, note_zh: PK-4（07 7.6「許願池：願望驅動」第 2 點，初值一般每格 4～6 個、許願 15～20 個）：照願望標籤用組合器做幾個不同設計，打分後全部交給本機模型挑 3 張。越多越可能找到合願望的招，但出題越慢（帶關鍵字時每個種子約 0.05～0.2 秒；召喚之類難做的關鍵字最多約 4 秒）、prompt 越長。}
      - {path: weights.synergy_per_link, label_zh: 協同：每條連線的分數, kind: int, hint_min: 0, hint_max: 1000, note_zh: 候選製造的關鍵字有一招手上的技能利用（或候選利用、手上的技能製造），每一條連線（手上技能 × 關鍵字 × 方向）加這麼多分。}
      - {path: weights.synergy_max_links, label_zh: 協同：最多算幾條連線, kind: int, hint_min: 0, hint_max: 6, note_zh: 協同分數最多算這麼多條連線（避免手上技能多的關鍵字永遠壓過其他候選）。}
      - {path: weights.keyword_make, label_zh: 關鍵字貼合：製造題目關鍵字, kind: int, hint_min: 0, hint_max: 500, note_zh: PK-1b：題目要的關鍵字由候選「製造」（例：題目要冰凍、候選會冰凍敵人），每個加這麼多分。}
      - {path: weights.keyword_use, label_zh: 關鍵字貼合：利用題目關鍵字, kind: int, hint_min: 0, hint_max: 500, note_zh: PK-1b：題目要的關鍵字由候選「利用」（例：對冰凍的敵人加傷），每個加這麼多分；製造和利用都有就兩項都加。}
      - {path: weights.keyword_extra_penalty, label_zh: 關鍵字貼合：多帶無關關鍵字扣分, kind: int, hint_min: 0, hint_max: 300, note_zh: PK-1b：候選另外帶的關鍵字既不是題目要的、玩家手上也沒有，每個扣這麼多分（主題太分散）。}
      - {path: weights.theme_per_keyword, label_zh: 主題相合：每個共同關鍵字, kind: int, hint_min: 0, hint_max: 500, note_zh: PK-1b：候選帶的關鍵字（題目要的以外）玩家手上的技能也有，每個加這麼多分。}
      - {path: weights.theme_max_keywords, label_zh: 主題相合：最多算幾個, kind: int, hint_min: 0, hint_max: 6, note_zh: PK-1b：主題相合最多算這麼多個共同關鍵字。}
      - {path: weights.element_match, label_zh: 元素相合：每招同元素的手上技能, kind: int, hint_min: 0, hint_max: 1000, note_zh: PK-1b：玩家手上每有一招和候選同元素的技能（例：手上兩招冰系、候選也是冰），加這麼多分。}
      - {path: weights.element_match_max, label_zh: 元素相合：最多算幾招, kind: int, hint_min: 0, hint_max: 6, note_zh: PK-1b：元素相合最多算這麼多招手上的技能。}
      - {path: weights.element_any, label_zh: 有元素加分, kind: int, hint_min: 0, hint_max: 500, note_zh: PK-1b：候選有元素（不是物理）就加這麼多分；有元素的招名稱和描述比較有主題感。}
      - {path: weights.behavior_per_point, label_zh: 打法：每次相符動作的分數, kind: int, hint_min: 0, hint_max: 100, note_zh: 候選帶的關鍵字和玩家用過的動作相符（例：常跳上高台→高處），每用過 1 次加這麼多分。}
      - {path: weights.behavior_cap, label_zh: 打法：分數上限, kind: int, hint_min: 0, hint_max: 1000, note_zh: 打法這一項最多加這麼多分。}
      - {path: weights.route_main, label_zh: 屬性路線：跟主屬性, kind: int, hint_min: 0, hint_max: 500, note_zh: 縮放屬性跟主角最高屬性（武器技看手上武器）時加這麼多分。}
      - {path: weights.route_dual, label_zh: 屬性路線：雙屬性跟上, kind: int, hint_min: 0, hint_max: 500, note_zh: 雙屬性技能靠第二屬性跟上主屬性時加這麼多分。}
      - {path: weights.pool_bonus, label_zh: 手寫技能加分, kind: int, hint_min: 0, hint_max: 500, note_zh: 候選是內容庫的手寫技能（技能池）時加這麼多分；0＝和組合器的候選一視同仁。「候選裡最多幾個手寫技能」是 0 時用不到。}
      - {path: weights.odd_condition_penalty, label_zh: 怪條件扣分, kind: int, hint_min: 0, hint_max: 1000, note_zh: PK-1b：候選帶「怪條件」（例：狀態效果只在第一輪才生效、刻紋要滿足條件才刻得下），每一處扣這麼多分。只影響挑選的排序，不改技能合不合法。}
      - {path: weights.thin_penalty, label_zh: 單薄扣分, kind: int, hint_min: 0, hint_max: 1000, note_zh: PK-2「這招有沒有料」：候選單薄時每一項扣這麼多分——只有沒效果的刻紋、標記或揭露；只有條件式的非傷害效果（例：只有「居高臨下時推開」）；史詩以上有作用的效果太少。只影響挑選的排序。}
      - {path: weights.thin_epic_min_effects, label_zh: 史詩至少幾個有作用的效果, kind: int, hint_min: 1, hint_max: 4, note_zh: PK-2：史詩以上的候選有作用的效果（刻紋、標記、揭露不算）少於這個數就算單薄、扣「單薄扣分」。}
      - {path: weights.same_skeleton_penalty, label_zh: 多樣性：同骨架扣分, kind: int, hint_min: 0, hint_max: 500, note_zh: 排前幾名時，和已經排進去的候選同骨架，每一個扣這麼多分。}
      - {path: weights.same_shape_penalty, label_zh: 多樣性：同形狀扣分, kind: int, hint_min: 0, hint_max: 500, note_zh: 和已經排進去的候選同形狀，每一個扣這麼多分。}
      - {path: weights.same_effects_penalty, label_zh: 多樣性：同效果種類扣分, kind: int, hint_min: 0, hint_max: 1000, note_zh: 和已經排進去的候選效果種類完全相同（只差元素或數字），每一個扣這麼多分。}
      - {path: weights.same_element_penalty, label_zh: 多樣性：同元素扣分, kind: int, hint_min: 0, hint_max: 500, note_zh: 和已經排進去的候選元素相同，每一個扣這麼多分。}
      - {path: weights.route_off_penalty, label_zh: 偏離這一格路線的候選扣分, kind: int, hint_min: 0, hint_max: 1000, note_zh: PK-3：「跟主路線」改成扣分。候選不符合這一格的路線（加深、橋接要跟主屬性；新方向要不同屬性）扣這麼多分；只有符合路線的候選不夠時才會放進來。}
      - {path: weights.keyword_relaxed_penalty, label_zh: 只帶部分關鍵字的候選扣分, kind: int, hint_min: 0, hint_max: 1000, note_zh: PK-3：橋接這類要兩個關鍵字的格子，放寬收只帶其中一個關鍵字的候選時扣這麼多分。}
      - {path: weights.wish_match, label_zh: 許願池：願望相合, kind: int, hint_min: 0, hint_max: 3000, note_zh: PK-4（07 7.6「許願池：願望驅動」第 3 點）：許願的候選每命中一個願望標籤（關鍵字、元素、效果類型、形狀、種類）加這麼多分。要高過和手上技能的協同（協同最多「每條連線的分數 × 最多算幾條」＝750），願望才是最大權重；越高越照願望、越不管協同。只有許願池用。}
  # SK-5（SK-3b 待決 4、WC-2 待決 11、SK-4 待決 4）：被動觸發時機的預算係數（skill_triggers.yaml，全體共用）。
  # 只展開有 budget_coefficient_permille 的時機（every_n_hits 依 n 查表，鍵是數字，路徑寫不出來，不開）。
  - kind: skill_triggers
    label_zh: 被動觸發時機
    glob: skill_triggers.yaml
    fields:
      - {path: "triggers[*].budget_coefficient_permille", label_zh: 的預算係數（‰）, kind: permille, hint_min: 100, hint_max: 600, existing_only: true, note_zh: 用這個時機的被動技能，可用預算＝階級預算 × 這個係數（取代主動技能的 AP 係數）。越大，用這個時機的被動效果可以越強；改了所有用這個時機的被動（手寫、組合器、LLM、裝備詞條）預算比例跟著變，超出合格區間的會在驗證時列出。例：「你造的關鍵字被利用時」300、「命中時」400、「回合開始時」500。只能 1 以上。}
      # HC-B：「每命中 n 次」依 n 查的係數（鍵是數字，HC-B 起路徑寫得出來）。
      - {path: "triggers[*].budget_by_n_permille.2", label_zh: 的預算係數（n＝2，‰）, kind: permille, hint_min: 100, hint_max: 900, existing_only: true, note_zh: 用「每命中 n 次」時機、n＝2 的被動，可用預算＝階級預算 × 這個係數。越大，這種被動可以越強。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
      - {path: "triggers[*].budget_by_n_permille.3", label_zh: 的預算係數（n＝3，‰）, kind: permille, hint_min: 100, hint_max: 900, existing_only: true, note_zh: 用「每命中 n 次」時機、n＝3 的被動，可用預算＝階級預算 × 這個係數。越大，這種被動可以越強。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
  # SK-5：組合器的附帶配方機率（skill_composer.yaml，全體共用）。只開 SK-2b、SK-3b、WC-2、SK-4 加的這幾個值；
  # 結構性的清單（例 structure.lifesteal_skeletons）與其他抽選機率不開。都是獨立亂數串流：改了只影響抽中與否，沒抽中的種子不變。
  - kind: skill_composer
    label_zh: 技能組合器的附帶配方
    glob: skill_composer.yaml
    fields:
      # SK-2b：#166 新原語接進出題
      - {path: structure.hook_core_permille, label_zh: 位移骨架改成鉤的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 組合器做位移骨架（稀有以上）時，核心改成「鉤」（把直線上第一個敵人拉到身邊）的機率。越大越常出鉤。只能 0～1000。}
      - {path: structure.absorb_core_permille, label_zh: 光環骨架改成吸收表面的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 組合器做光環骨架（稀有以上）時，核心改成「吸收表面」（吸自己腳下的表面換治療或護盾）的機率。只能 0～1000。}
      - {path: structure.absorb_secondary_permille, label_zh: 打擊／蓄力加上吸收表面的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 打擊、蓄力／終結骨架（稀有以上、單體形狀、附帶效果還有空位）加上吸收表面（換層數或元素）的機率。只能 0～1000。}
      - {path: structure.contagion_permille, label_zh: 加上疾病擴散的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 打擊、範圍、控場、陷阱骨架（稀有以上、已施加燃燒／流血／中毒、附帶效果還有空位）加上「疾病擴散」的機率。只能 0～1000。}
      # AP-2：白板主動技的預設 AP（06 6.34.1 ⚠ #168 題 5）
      - {path: whiteboard.ap_cost, label_zh: 白板主動技的預設 AP, kind: int, hint_min: 1, hint_max: 3, note_zh: 升級、任務三選一與創角給的白板主動技預設花幾 AP（初值 1）。調不進預算範圍時退回「白板退回的 AP」；召喚、自身增益、位移這些配方自己寫了 AP 的不受影響。只能 1～3。}
      - {path: whiteboard.fallback_ap_cost, label_zh: 白板退回的 AP, kind: int, hint_min: 1, hint_max: 3, note_zh: 白板主動技用預設 AP 調不進預算範圍（70～100%）時改用這個 AP 再調一次（初值 2）。只能 1～3。}
      # AP-2：預支與「這回合用完所有 AP 時」接進出題
      - {path: structure.borrow_core_permille, label_zh: 光環骨架改成預支的機率（‰）, kind: permille, hint_min: 0, hint_max: 300, note_zh: 組合器做光環骨架（稀有以上）時，核心改成「預支」（0 AP：這回合多 1 AP、下回合少 1 AP，冷卻 2）的機率。越大越常出預支。只能 0～1000。}
      - {path: structure.ap_spent_passive_permille, label_zh: 被動改成「用完所有 AP 時」的機率（‰）, kind: permille, hint_min: 0, hint_max: 300, note_zh: 組合器做被動（史詩以上、題目沒指定關鍵字）時，觸發時機改成「這回合用完所有 AP 時」的機率。只能 0～1000。}
      # SK-3b：SK-3 的新觸發與重擲
      - {path: structure.exploit_passive_permille, label_zh: 被動改成「被利用時」的機率（‰）, kind: permille, hint_min: 0, hint_max: 300, note_zh: 組合器做被動（史詩以上、題目沒指定關鍵字）時，觸發時機改成「你造的關鍵字被利用時」的機率。只能 0～1000。}
      - {path: structure.reroll_reaction_permille, label_zh: 反應技改成重擲的機率（‰）, kind: permille, hint_min: 0, hint_max: 300, note_zh: 組合器做反應技（稀有以上、法術或不限類別、題目沒指定關鍵字）時，改成「重擲」的機率。只能 0～1000。}
      # WC-2：自身周圍被動、層數與召喚物的附帶配方
      - {path: passive.around_permille, label_zh: 被動改成「自身周圍」的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 組合器做被動時，效果改成作用在持有者周圍一圈敵人（自身周圍小範圍）的機率。只能 0～1000。}
      - {path: structure.stack_rider_permille, label_zh: 層數關鍵字走附帶配方的機率（‰）, kind: permille, hint_min: 0, hint_max: 1000, note_zh: 題目指定層數關鍵字（連擊、怒氣、專注、氣）時，改成「一般主動技＋累積或消耗那種層數」的機率（其餘照原本的蓄力骨架）。只能 0～1000。}
      - {path: structure.summon_rider_permille, label_zh: 召喚物關鍵字走附帶配方的機率（‰）, kind: permille, hint_min: 0, hint_max: 1000, note_zh: 題目指定召喚物關鍵字時，改成「一般主動技＋對自己施加號令（你的召喚物傷害提高）」的機率（其餘照原本）。只能 0～1000。}
      # SK-4：吸血配方
      - {path: structure.lifesteal_permille, label_zh: 傷害附吸血的機率（‰）, kind: permille, hint_min: 0, hint_max: 500, note_zh: 打擊、範圍骨架的對敵傷害（沒有聖光雙效）附上吸血的機率。越大越常出吸血招；許願同時有「傷害＋治療」時另有專門補抽，不靠這個機率。只能 0～1000。}
      - {path: structure.lifesteal_amount_permille, label_zh: 附上的吸血比例（‰）, kind: permille, hint_min: 100, hint_max: 500, note_zh: 組合器附上的吸血是造成傷害的這麼多千分比（300＝回復傷害的 30%）。預算照吸血的價值計價，比例越高，同一招的傷害會被重調得越低。只能 1～500（原語上限）。}
  # HC-B：條件的預算倍率覆寫（skill_conditions.yaml，全體共用）。平常照嚴苛度查 skill_budget.yaml 的
  # condition_permille；這裡只展開已經寫了 budget_permille 的條件（沒寫的不給插入：插入會改掉那個條件的計價方式）。
  - kind: skill_conditions
    label_zh: 技能條件的預算倍率
    glob: skill_conditions.yaml
    fields:
      - {path: "conditions[*].budget_permille", label_zh: 的預算倍率（‰）, kind: permille, hint_min: 500, hint_max: 1000, existing_only: true, note_zh: 帶這個條件的技能或效果，點數乘這個千分比（取代嚴苛度的倍率；1000＝不打折）。越小折扣越大、帶這個條件的招其他效果可以越強。只能 1～1000。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
  # HC-B：協同係數（skill_synergies.yaml，全體共用）。標籤組合是結構，只開係數。
  - kind: skill_synergies
    label_zh: 技能協同係數
    glob: skill_synergies.yaml
    fields:
      - {path: "synergies[*].coefficient_permille", label_zh: 的係數（‰）, kind: permille, hint_min: 1000, hint_max: 1500, note_zh: 技能同時帶有這組機制標籤時，總點數乘這個千分比（符合多條時全部相乘）。越大，帶這組機制的招算得越貴、其他效果越弱；1000＝不加價。改了相關的招（手寫、組合器、LLM、工坊）預算比例跟著重算，超出合格區間的會在驗證時列出。}
  # HC-W2：形態（forms.yaml）。只開數值：共通的維持費與冷卻；每個形態的天生武器、形態中的效果、進入時的獎勵
  # （都只展開已寫的：沒寫＝這個形態沒有那個機制，加上去屬結構）。ID、名稱、外觀、屬性、元素、類別不開。
  - kind: forms
    label_zh: 形態
    glob: forms.yaml
    fields:
      - {path: upkeep_stamina, label_zh: 物理形態每回合維持費（耐力）, group_zh: 共通, kind: int, hint_min: 40, hint_max: 160, note_zh: 物理形態（熊、貓、狼人、惡魔、巨人）每回合開始扣這麼多耐力，不夠付就自動解除形態。越大，物理形態越難久撐；越小越能一直維持。}
      - {path: upkeep_mana, label_zh: 心智形態每回合維持費（法力）, group_zh: 共通, kind: int, hint_min: 15, hint_max: 60, note_zh: 心智形態（巨鵰、元素化身、暗影形態、樹人、龍）每回合開始扣這麼多法力，不夠付就自動解除形態。越大，心智形態越難久撐；越小越能一直維持。}
      - {path: stance_upkeep_stamina, label_zh: 姿態每點維持費（耐力）, group_zh: 共通, kind: int, hint_min: 10, hint_max: 40, note_zh: 一般姿態（武器技）的維持費每 1 點，每回合開始扣這麼多耐力；付不起就自動解除姿態。越大，帶維持費的武器姿態越貴。}
      - {path: stance_upkeep_mana, label_zh: 姿態每點維持費（法力）, group_zh: 共通, kind: int, hint_min: 5, hint_max: 20, note_zh: 一般姿態（法術技）的維持費每 1 點，每回合開始扣這麼多法力；付不起就自動解除姿態。越大，帶維持費的法術姿態越貴。}
      - {path: cooldown, label_zh: 離開形態後的冷卻（回合）, group_zh: 共通, kind: int, hint_min: 1, hint_max: 4, note_zh: 離開一個形態（自己取消、被迫解除、切換）後，「那個形態」要等這麼多回合才能再進入；別的形態不受影響。越大，越不能頻繁切換同一個形態。只能 1～5。}
      - {path: "forms[*].natural_weapon.dice", label_zh: 天生武器的傷害骰, kind: dice, note_zh: 形態中普攻用的天生武器擲這個骰（再加屬性加成）。骰子越大，形態的普攻越痛。}
      - {path: "forms[*].natural_weapon.range", label_zh: 天生武器的射程（格）, kind: int, hint_min: 1, hint_max: 6, existing_only: true, note_zh: 天生武器最遠打幾格（近戰的觸及另見「觸及」；龍的吐息用這個列出「朝某個敵人」的快捷動作）。越大越能在遠處出手。只能 1～8。}
      - {path: "forms[*].natural_weapon.damage_permille", label_zh: 天生武器的傷害加成（‰）, kind: permille, hint_min: 0, hint_max: 300, existing_only: true, note_zh: 天生武器的傷害再多這麼多千分比（100＝+10%）。越大普攻越痛。只能 0～1000。}
      - {path: "forms[*].natural_weapon.traits.strikes", label_zh: 天生武器一次打幾下, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 普攻一次打幾下（每下各擲命中）。越多傷害越高。只能 1～3。}
      - {path: "forms[*].natural_weapon.traits.knockback", label_zh: 天生武器的推擊（格）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 普攻命中把目標推開幾格。越大越能把人推進危險地形或拉開距離。只能 0～3。}
      - {path: "forms[*].natural_weapon.traits.reach", label_zh: 天生武器的觸及（格）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 近戰普攻能打到幾格外。越大越安全。只能 1 到近戰上限。}
      - {path: "forms[*].natural_weapon.traits.bleed", label_zh: 天生武器的流血（回合）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 普攻命中讓目標流血這麼多回合。越大持續傷害越多。只能 0～3。}
      - {path: "forms[*].natural_weapon.traits.backstab_crit", label_zh: 天生武器的背刺暴擊範圍, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 從背後普攻時，暴擊範圍再擴大這麼多（1＝自然 19 起就暴擊）。越大越常暴擊。只能 0～3。}
      - {path: "forms[*].natural_weapon.charge.size", label_zh: 蓄力吐息的錐形長度, kind: int, hint_min: 2, hint_max: 4, existing_only: true, note_zh: 蓄力普攻（龍的吐息）下一回合釋放時的錐形長度（向前幾排）。越大打到越多格。只能 2～4。}
      - {path: "forms[*].effects.max_hp_permille", label_zh: 形態中最大 HP（‰）, kind: permille, hint_min: -200, hint_max: 300, existing_only: true, note_zh: 形態中最大 HP 多（負值＝少）這麼多千分比（150＝+15%）。越大越耐打。只能 −500～500。}
      - {path: "forms[*].effects.defense_permille", label_zh: 形態中防禦（‰）, kind: permille, hint_min: -200, hint_max: 200, existing_only: true, note_zh: 形態中防禦值多（負值＝少）這麼多千分比（100＝+10%）。越大越不容易被打中。只能 −500～500。}
      - {path: "forms[*].effects.move", label_zh: 形態中移動（格）, kind: int, hint_min: -2, hint_max: 2, existing_only: true, note_zh: 形態中每回合移動多（負值＝少）幾格。越大越靈活。只能 −3～3。}
      - {path: "forms[*].effects.heal_permille", label_zh: 形態中受到的治療（‰）, kind: permille, hint_min: 100, hint_max: 400, existing_only: true, note_zh: 形態中受到的治療多這麼多千分比（200＝+20%）。越大越好補。只能 0～1000。}
      - {path: "forms[*].effects.flat_height", label_zh: 形態中的高度（格）, kind: int, hint_min: 1, hint_max: 2, existing_only: true, note_zh: 形態中視為站高幾格（飛行；高處的命中與視野加成照高度算）。越大越佔優勢。只能 0～2。}
      - {path: "forms[*].effects.damage_taken[*].permille", label_zh: "形態中受到{element}傷害的倍率（‰）", kind: permille, hint_min: 500, hint_max: 1500, note_zh: 形態中受到這種元素的傷害乘這個千分比（500＝只受一半、1500＝多受 50%；「所選元素」＝進入形態時選的元素）。越小越耐這種元素；越大越怕。只能 0～3000。}
      - {path: "forms[*].entry.shield_max_hp_permille", label_zh: 進入時的護盾（最大 HP 的 ‰）, kind: permille, hint_min: 50, hint_max: 200, existing_only: true, note_zh: 進入形態時得到最大 HP 這麼多千分比的護盾（100＝10%）。越大進入時越安全。只能 1～1000。}
      - {path: "forms[*].entry.shield_duration", label_zh: 進入時護盾的持續（回合）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 進入形態時的護盾維持幾回合。越大越久。只能 1～3。}
      - {path: "forms[*].entry.heal_max_hp_permille", label_zh: 進入時回復（最大 HP 的 ‰）, kind: permille, hint_min: 50, hint_max: 200, existing_only: true, note_zh: 進入形態時回復最大 HP 這麼多千分比（100＝10%）。越大越好用來救急。只能 1～1000。}
      - {path: "forms[*].entry.next_attack_hit", label_zh: 進入後下一次攻擊的命中加值, kind: int, hint_min: 1, hint_max: 4, existing_only: true, note_zh: 進入形態後下一次攻擊的命中再加這麼多。越大越容易打中。只能 0～5。}
      - {path: "forms[*].entry.next_attack_crit", label_zh: 進入後下一次攻擊的暴擊範圍, kind: int, hint_min: 1, hint_max: 4, existing_only: true, note_zh: 進入形態後下一次攻擊的暴擊範圍擴大這麼多（2＝自然 18 起就暴擊）。越大越容易暴擊。只能 0～5。}
      - {path: "forms[*].entry.move", label_zh: 進入時的額外移動（格）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 進入形態的那一回合多移動幾格。越大越好用來突進或脫身。只能 0～3。}
      - {path: "forms[*].entry.conceal", label_zh: 進入時的隱蔽（回合）, kind: int, hint_min: 1, hint_max: 3, existing_only: true, note_zh: 進入形態時隱蔽幾回合。越大越久不被看見。只能 1～3。}
      - {path: "forms[*].entry.collision_permille", label_zh: 進入後的撞擊加成（‰）, kind: permille, hint_min: 250, hint_max: 1000, existing_only: true, note_zh: 形態中把人推去撞牆、撞人時，撞擊傷害多這麼多千分比（500＝+50%）。越大推擊越痛。只能 0～2000。}
      - {path: "forms[*].entry.burst.radius", label_zh: 進入時爆發的範圍（格）, kind: int, hint_min: 1, hint_max: 2, existing_only: true, note_zh: 進入形態時對周圍幾格內的敵人造成一次爆發傷害。越大打到越多人。只能 1～3。}
      - {path: "forms[*].entry.burst.dice", label_zh: 進入時爆發的傷害骰, kind: dice, existing_only: true, note_zh: 進入形態時爆發傷害擲這個骰。骰子越大越痛。}
      - {path: "forms[*].entry.heal_adjacent.dice", label_zh: 進入時治療相鄰友方的骰, kind: dice, existing_only: true, note_zh: 進入形態時治療相鄰友方擲這個骰（再加屬性加成）。骰子越大補越多。}
      - {path: "forms[*].entry.heal_adjacent.attr_permille", label_zh: 進入時治療相鄰友方的屬性加成（‰）, kind: permille, hint_min: 250, hint_max: 1000, existing_only: true, note_zh: 進入形態時治療相鄰友方，再加屬性這麼多千分比（500＝屬性的一半）。越大補越多。只能 0～1000。}
  # HC-W2：裝備規則（rules/equipment.yaml）。遞減權重與硬上限都開；總減傷上限（caps.damage_reduction_permille）
  # 必須等於 1000 − rules/core.yaml 的 element_mod_floor_permille（載入時檢查；那一欄沒開，所以這裡也不開）。
  - kind: equipment
    label_zh: 裝備規則
    glob: rules/equipment.yaml
    fields:
      - {path: "diminishing_permille[*]", label_zh: "同名詞條第 {n} 條的效果（‰）", group_zh: 同名詞條的遞減, kind: permille, hint_min: 0, hint_max: 1000, note_zh: 全身同一種數值詞條依數值大到小排，第幾條只生效這麼多千分比（第 1 條必須是 1000，後面不能比前面大；列表之後的一律 0）。越大，疊同一種詞條越划算；越小越鼓勵混搭。}
      - {path: max_affixes_per_item, label_zh: 每件物品最多幾條詞條, group_zh: 硬上限, kind: int, hint_min: 2, hint_max: 6, note_zh: 一件裝備最多帶幾條詞條（產生器、打造、驗證都看這個）。越大單件裝備能越強。只能 1～8。}
      - {path: caps.damage_bonus_permille, label_zh: 全身傷害加成上限（‰）, group_zh: 硬上限, kind: permille, hint_min: 250, hint_max: 1000, note_zh: 裝備來源的傷害加成合計最多這麼多千分比（500＝+50%）；超出的部分不算。越大，堆傷害的裝備越強。}
      - {path: caps.element_resist_permille, label_zh: 單一元素抗性上限（‰）, group_zh: 硬上限, kind: permille, hint_min: 250, hint_max: 750, note_zh: 裝備給的單一元素抗性最多這麼多千分比（500＝50%）；超出的部分不算。越大，越能把某種元素疊到幾乎免疫。}
      - {path: caps.ap_gain_per_round, label_zh: 每回合 AP 回復加成上限, group_zh: 硬上限, kind: int, hint_min: 0, hint_max: 2, note_zh: 所有來源合計，每回合最多多回這麼多 AP。越大，多動作的 build 越強。}
      - {path: caps.cooldown_min, label_zh: 冷卻最低（回合）, group_zh: 硬上限, kind: int, hint_min: 0, hint_max: 2, note_zh: 裝備縮短冷卻時，有冷卻的技能最低只能縮到這麼多回合（本來就沒有冷卻的不受影響）。越小，縮冷卻的裝備越強。}
      - {path: caps.crit_range_min, label_zh: 暴擊範圍最低（自然骰）, group_zh: 硬上限, kind: int, hint_min: 16, hint_max: 19, note_zh: 裝備擴大暴擊範圍時，最多擴大到自然骰這個數字起就暴擊（18＝18、19、20 都暴擊）。越小，堆暴擊的裝備越強。只能 2～20。}
      - {path: caps.move_bonus, label_zh: 全身移動加成上限（格）, group_zh: 硬上限, kind: int, hint_min: 1, hint_max: 4, note_zh: 裝備的移動加成合計最多幾格。越大，堆移動的裝備越強。}
      - {path: caps.cost_affixes, label_zh: 全身代價型詞條上限, group_zh: 硬上限, kind: int, hint_min: 1, hint_max: 4, note_zh: 全身最多穿幾條代價型詞條（超過時穿戴驗證失敗）。越大，越能用代價換強度。}
      - {path: caps.rule_affixes, label_zh: 全身改變規則類詞條上限, group_zh: 硬上限, kind: int, hint_min: 0, hint_max: 2, note_zh: 全身最多幾條改變規則類詞條同時生效（超過時穿戴驗證失敗）。越大，越能疊改變規則的效果。}
  # HC-W2：物品生成（item_gen.yaml）。只開計價與規則數值；稀有度條件的分類（conditional_rates）、類別清單、
  # 必選詞條、獨特與暫緩詞條清單是結構，不開；max_attempts、offer_attempts 是程式的重試次數，不開。
  - kind: item_gen
    label_zh: 物品生成
    glob: item_gen.yaml
    fields:
      - {path: rarity_weights.common, label_zh: 稀有度權重：普通, group_zh: 稀有度, kind: int, hint_min: 20, hint_max: 80, note_zh: 產生物品時抽稀有度的權重（各稀有度的權重相比，例：普通 40／合計 100＝40%）。越大，越常掉這個稀有度。}
      - {path: rarity_weights.uncommon, label_zh: 稀有度權重：優良, group_zh: 稀有度, kind: int, hint_min: 12, hint_max: 50, note_zh: 產生物品時抽稀有度的權重（各稀有度的權重相比）。越大，越常掉這個稀有度。}
      - {path: rarity_weights.rare, label_zh: 稀有度權重：稀有, group_zh: 稀有度, kind: int, hint_min: 10, hint_max: 40, note_zh: 產生物品時抽稀有度的權重（各稀有度的權重相比）。越大，越常掉這個稀有度。}
      - {path: rarity_weights.epic, label_zh: 稀有度權重：史詩, group_zh: 稀有度, kind: int, hint_min: 6, hint_max: 26, note_zh: 產生物品時抽稀有度的權重（各稀有度的權重相比）。越大，越常掉這個稀有度。}
      - {path: rarity_weights.legendary, label_zh: 稀有度權重：傳說, group_zh: 稀有度, kind: int, hint_min: 0, hint_max: 4, note_zh: 產生物品時抽稀有度的權重（各稀有度的權重相比；傳說從現有的傳說物品挑同部位的，沒有就降為史詩）。越大，越常掉傳說。}
      - {path: rarities.common.min_affixes, label_zh: 普通：最少詞條數, group_zh: 稀有度, kind: int, hint_min: 0, hint_max: 1, note_zh: 普通物品至少幾條詞條。越大，普通物品越強。不能大於最多詞條數。}
      - {path: rarities.common.max_affixes, label_zh: 普通：最多詞條數, group_zh: 稀有度, kind: int, hint_min: 0, hint_max: 2, note_zh: 普通物品最多幾條詞條。越大，普通物品越強。只能 0～8。}
      - {path: rarities.uncommon.min_affixes, label_zh: 優良：最少詞條數, group_zh: 稀有度, kind: int, hint_min: 0, hint_max: 2, note_zh: 優良物品至少幾條詞條。越大，優良物品越強。不能大於最多詞條數。}
      - {path: rarities.uncommon.max_affixes, label_zh: 優良：最多詞條數, group_zh: 稀有度, kind: int, hint_min: 1, hint_max: 3, note_zh: 優良物品最多幾條詞條。越大，優良物品越強。只能 0～8。}
      - {path: rarities.rare.min_affixes, label_zh: 稀有：最少詞條數, group_zh: 稀有度, kind: int, hint_min: 1, hint_max: 3, note_zh: 稀有物品至少幾條詞條（含 1 條 build 詞條）。越大，稀有物品越強。不能大於最多詞條數。}
      - {path: rarities.rare.max_affixes, label_zh: 稀有：最多詞條數, group_zh: 稀有度, kind: int, hint_min: 2, hint_max: 4, note_zh: 稀有物品最多幾條詞條。越大，稀有物品越強。只能 0～8。}
      - {path: rarities.epic.min_affixes, label_zh: 史詩：最少詞條數, group_zh: 稀有度, kind: int, hint_min: 2, hint_max: 4, note_zh: 史詩物品至少幾條詞條（含 1 條 build 詞條）。越大，史詩物品越強。不能大於最多詞條數。}
      - {path: rarities.epic.max_affixes, label_zh: 史詩：最多詞條數, group_zh: 稀有度, kind: int, hint_min: 2, hint_max: 4, note_zh: 史詩物品最多幾條詞條。越大，史詩物品越強。只能 0～8。}
      - {path: "total_budget[*].total", label_zh: 總點數, group_zh: 預算, kind: int, hint_min: 50, hint_max: 700, note_zh: 這個物品等級的全身裝備預算（點）；表列等級之間線性內插，最後一段之後沿用最後一段的斜率。越大，同等級的裝備越強。後面的等級不能比前面少。}
      - {path: min_fill_permille, label_zh: 詞條點數至少用到預算的（‰）, group_zh: 預算, kind: permille, hint_min: 350, hint_max: 1000, note_zh: 產生的詞條點數至少要到詞條預算的這麼多千分比（700＝70%）。越大，產出越接近滿預算（強度更平均）；越小，弱裝備越多。只能 0～1000。}
      - {path: min_affix_points, label_zh: 每條詞條至少幾點, group_zh: 預算, kind: int, hint_min: 1, hint_max: 4, note_zh: 每條詞條至少要分到這麼多點。越大，低等級的裝備越難塞多條詞條。}
      - {path: base_strength.fallback_level, label_zh: 沒有等級的物品當作幾級, group_zh: 預算, kind: int, hint_min: 1, hint_max: 3, note_zh: 初始裝備、基礎武器這類沒有物品等級的物品，算「預算分數」時當作這個等級（只用在比較，不進預算檢查）。越大，這些物品在比較時算得越強。}
      - {path: slot_permille.weapon, label_zh: 部位預算：主手（‰）, group_zh: 部位比例, kind: permille, hint_min: 150, hint_max: 600, note_zh: 全身預算分給這個部位的千分比（戒指是每枚）。越大，這個部位的裝備越強。}
      - {path: slot_permille.body, label_zh: 部位預算：身體（‰）, group_zh: 部位比例, kind: permille, hint_min: 100, hint_max: 400, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.offhand, label_zh: 部位預算：副手（‰）, group_zh: 部位比例, kind: permille, hint_min: 50, hint_max: 200, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.head, label_zh: 部位預算：頭（‰）, group_zh: 部位比例, kind: permille, hint_min: 40, hint_max: 160, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.hands, label_zh: 部位預算：手（‰）, group_zh: 部位比例, kind: permille, hint_min: 40, hint_max: 160, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.feet, label_zh: 部位預算：腳（‰）, group_zh: 部位比例, kind: permille, hint_min: 40, hint_max: 160, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.neck, label_zh: 部位預算：項鍊（‰）, group_zh: 部位比例, kind: permille, hint_min: 40, hint_max: 160, note_zh: 全身預算分給這個部位的千分比。越大，這個部位的裝備越強。}
      - {path: slot_permille.ring, label_zh: 部位預算：戒指（每枚，‰）, group_zh: 部位比例, kind: permille, hint_min: 20, hint_max: 80, note_zh: 全身預算分給每一枚戒指的千分比。越大，戒指越強。}
      - {path: affix_permille.weapon, label_zh: 詞條佔比：主手（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 200, hint_max: 800, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，這個部位的詞條越多越強、基礎越弱。}
      - {path: affix_permille.body, label_zh: 詞條佔比：身體（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 200, hint_max: 800, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，詞條越強、基礎越弱。}
      - {path: affix_permille.offhand, label_zh: 詞條佔比：副手（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 200, hint_max: 800, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，詞條越強、基礎越弱。}
      - {path: affix_permille.head, label_zh: 詞條佔比：頭（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 250, hint_max: 1000, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，詞條越強、基礎越弱。}
      - {path: affix_permille.hands, label_zh: 詞條佔比：手（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 250, hint_max: 1000, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，詞條越強、基礎越弱。}
      - {path: affix_permille.feet, label_zh: 詞條佔比：腳（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 250, hint_max: 1000, note_zh: 這個部位的預算有多少千分比給詞條（其餘是底材的基礎數值）。越大，詞條越強、基礎越弱。}
      - {path: affix_permille.neck, label_zh: 詞條佔比：項鍊（‰）, group_zh: 詞條佔比, kind: permille, hint_min: 500, hint_max: 1000, note_zh: 這個部位的預算有多少千分比給詞條（項鍊沒有底材差異，1000＝全部給詞條）。越小，詞條越弱。}
