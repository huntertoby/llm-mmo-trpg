# 技能與效果的條件（docs/phases/Phase2A計畫.md 6.1）。引擎實作 10 種，資料檔必須全部定義。
#
# 技能層級的 condition：決定技能能否使用（不成立時不在 legal_actions）。
#   自身條件（self_hp_below）看施放者；其他條件要求影響範圍內（不含施放者所在格）至少有一個
#   符合的單位（或格子）。單體技能就是被選中的目標。
# 效果層級的 condition：對該效果的每個對象（單位，或地形類效果的格子）分別判斷，不成立的對象
#   不受這個效果影響。效果依技能內的順序結算，判斷的是「結算到該效果當下」的狀態。
#
# harshness：common 常見／harsh 嚴苛，決定預算的條件倍率（2B-2：0.85／0.6）
# min_rarity：使用此條件的最低稀有度（2B-2：條件從 rare 起才能使用）
# params：沿用原語參數的格式（type：int／status／surface／tag）
#
# 3D-1（連段條件；harshness 為初值，未經模擬）：施放者條件（self_hp_below、moved_this_turn、adjacent_ally、
# first_round、cast_tag_this_turn）只看施放者，技能層級的條件不需要影響範圍內有對象；
# 單位條件（target_isolated）要求影響範圍內至少有一個符合的單位。
conditions:
  - id: target_hp_below
    name_zh: 目標血量低於
    description_zh: 目標的目前 HP ÷ 最大 HP 低於 permille ‰。
    harshness: common
    min_rarity: rare
    params:
      permille: {type: int, required: true, min: 1, max: 999}
  - id: self_hp_below
    name_zh: 自身血量低於
    description_zh: 施放者的目前 HP ÷ 最大 HP 低於 permille ‰。
    harshness: harsh
    min_rarity: rare
    params:
      permille: {type: int, required: true, min: 1, max: 999}
  - id: height_advantage
    name_zh: 居高臨下
    description_zh: 施放者所在格的高度大於目標所在格的高度。
    harshness: common
    min_rarity: rare
  - id: target_on_surface
    name_zh: 目標站在表面上
    description_zh: 目標腳下的格子是指定的表面（例如水、油、火）。
    harshness: common
    min_rarity: rare
    params:
      surface: {type: surface, required: true}
  - id: target_has_status
    name_zh: 目標帶有狀態
    description_zh: 目標身上有指定的狀態（例如燃燒、倒地）。
    harshness: common
    min_rarity: rare
    params:
      status: {type: status, required: true}
  - id: moved_this_turn
    name_zh: 本回合移動過
    description_zh: 施放者本回合做過主動移動（步行；傳送與被強制位移不算）。
    harshness: common
    min_rarity: rare
  - id: adjacent_ally
    name_zh: 身旁有友方
    description_zh: 施放者相鄰（上下左右）有存活的友方。
    harshness: common
    min_rarity: rare
  - id: target_isolated
    name_zh: 目標落單
    description_zh: 目標相鄰（上下左右）沒有它的存活友方。
    harshness: common
    min_rarity: rare
  - id: first_round
    name_zh: 第一輪
    description_zh: 目前是戰鬥的第 1 輪。
    harshness: harsh
    min_rarity: rare
  - id: cast_tag_this_turn
    name_zh: 本回合施放過同類技能
    description_zh: 施放者本回合已經施放過帶指定標籤的技能（不含這次施放）。
    harshness: common
    min_rarity: rare
    params:
      tag: {type: tag, required: true}
  - id: flanked
    name_zh: 夾擊
    description_zh: 以目標為中心，施放者所在的那一側（上下左右四個方向中，與施放者位置軸向相同、離施放者較近的一側；距離相同時以左右優先）的對面格，站著施放者的存活友方（不含施放者自己）。相鄰攻擊就是目標正對面的那一格；遠程攻擊也看目標背對施放者的那一格。
    harshness: common
    min_rarity: rare
  # 3D-8d（朝向與背刺；harshness 為初值，未經模擬）
  - id: from_behind
    name_zh: 背刺
    description_zh: 施放者站在目標的背後格（目標朝向的反方向相鄰格；只算相鄰）。單位的朝向由引擎自動更新：主動移動後面向移動方向，攻擊或對單位施放技能後面向目標。
    harshness: common
    min_rarity: rare
  - id: self_concealed
    name_zh: 潛行偷襲
    description_zh: 施放者帶有「隱蔽」狀態（concealed；站在黑暗或草叢中不算）。隱蔽中發動攻擊另有通用的命中加成，攻擊結算完後脫離隱蔽。
    harshness: harsh
    min_rarity: rare
  # 3-23 刻印（harshness 為初值，未經模擬）：需要先用 inscribe 刻下符文才成立，所以算嚴苛。
  - id: on_own_rune
    name_zh: 站在自己的符文上
    description_zh: 目標所在的格子上有施放者自己（用 inscribe）刻下的符文；可用 element 或 tag 篩選符文（省略＝任何符文）。別人的符文不算；對格子判斷，所以也可以用在沒有單位的格子。
    harshness: harsh
    min_rarity: rare
    params:
      element: {type: element}
      tag: {type: tag}
