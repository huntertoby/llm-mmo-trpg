    note: HC-4a：只拿來當護欄的模組常數（骰數、尺寸、字數、‰ 上限、引擎只支援的佔格、錯誤列印數）。形態幅度的上限 HC-4b3 改成載入時對照 enter_form 原語。
      HC-4b 加 MAX_VARIANTS：一招最多 2 個變奏是護欄，實際上限依稀有度（core.yaml 的 variant_max_by_rarity，
      Ruleset 層檢查）。HC-4b2 加 _MIN_SIDES：骰子至少 2 面是護欄（組合器的骰面階梯在 skill_composer.yaml）。
  - id: py-content-guard-constants-hc4d
    class: guard
    status: done
    lang: py
    kind: number
    files: [src/trpg/content/world_encounters.py, src/trpg/content/world_narration.py,
            src/trpg/content/world_quests.py, src/trpg/content/world_situations.py,
            src/trpg/content/maps.py, src/trpg/content/rule_changes.py]
    where:
      - '<module>.MAX_HEIGHT'
      - '<module>._MAX_DURATION'
      - '<module>.MAX_GROUP_SIZE'
      - '<module>.MAX_THIRD_SIZE'
      - '<module>.STORY_SENTENCES_MAX'
      - '<module>.STORY_REFS_MAX'
      - '<module>._MAX_LEVEL'
      - '<module>.DC_SHIFT_LIMIT'
      - '<module>.CARE_LIMIT'
      - '<module>._DANGER_LEVELS'
    note: HC-4d 改判 guard。一場敵人最多 4 名、第三方最多 3 名＝戰場地圖敵方／第三方起始區的格數（戰鬥地圖模板
      4 格、就地切戰場 world/rules.yaml 的 field.min_enemy_cells），是格式上限；旁白最多 3 句、每種引用最多 4 個＝LLM
      輸出的格式護欄（同 TEXT_MAX_CHARS 等字數上限）；任務等級 ≤ 10 是 xp_level／level_to 的護欄（等級上限在
      world/rules.yaml 的 hero_growth.level_cap）；難度調整 ±2、用心清單 +2 是 9.6.4 使用者定的天花板，實際值在
      situation_rules.yaml 的 check.dc_shift_max／care_max（資料只能更嚴，同 RACE_BONUS_LIMIT）；危險度 1～3
      是刻度格式（DangerDef.level、模板 danger 的 le=3 同一件事）。地圖高度 0～3（MAX_HEIGHT）是地圖格式
      （heights 一格一個數字）與引擎、AI、畫面的層數上限，引擎 heights.py 夾住、AI 拿它當哨兵；規則改變的
      持續 ≤ 3（_MAX_DURATION）只擋手寫的離譜回合數（HC-4a：回合類上限＝guard）。
