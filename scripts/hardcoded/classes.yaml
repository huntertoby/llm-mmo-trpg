  # ---------------------------------------------------- 後端 content：上下限重新歸類（HC-4a 第 1 項）
  # HC-1 開發 PM 裁定 2：純驗證用的上下限＝guard（留在 schema，done）；上下限本身就是遊戲規則的＝config；
  # 內容沒寫、靠預設值生效的預設值＝config（留在下面各檔的 py-content-*-config-number）。
  # 判斷：設計文件寫成規則、或技能／生成器／LLM 都要遵守的上下限（AP 1～3、元素數、效果數、階級數、修正幅度、
  # 代價持續、願望關鍵字……）＝規則；只擋手寫或工坊填出離譜值的（射程、半徑、回合、‰ 上限、清單長度、
  # 字數、地圖尺寸）＝guard。拿不準時歸 config（保守），留給 HC-4b～d 逐檔再看。
  # 先寫規則型的例外（config todo），再寫 guard 的寬規則；順序不能換（第一條符合的勝出）。
  - id: py-content-rule-bounds-world
    class: guard
    status: done
    kind: number
    files: [src/trpg/content/world_events.py, src/trpg/content/world_situations.py]
    where: [SolutionDef, MethodDef]
    owner: [threads, attributes]
    note: HC-4d 改判 guard：骨架解法的線頭數 ≤ 2 是 9.6.7（#6）「0～2 條」的格式上限，實際上限在
      situation_rules.yaml 的 budget.threads_max（它的 le=2 也是 guard）；方法的「常見屬性」最多 2 個是
      分類資料的格式（9.6.11、#115），不是玩法數值。
  - id: py-content-guard-bounds
    class: guard
    status: done
    lang: py
    kind: number
    files: src/trpg/content/*
    slot: ['Field(le)', 'Field(ge)', 'Field(lt)', 'Field(gt)', 'Field(max_length)', 'Field(min_length)']
    not: {files: src/trpg/content/audio.py}   # 音效合成參數照 HC-1 歸 const（py-content-audio-const-number）
    note: HC-4a：content schema 的護欄（le／ge／長度），擋手寫、工坊、LLM 填出的離譜值；實際數值在內容檔。
