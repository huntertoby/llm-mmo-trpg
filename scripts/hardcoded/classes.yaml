# 寫死數值歸類（HC-1；docs/phases/PhaseHC-1計畫.md 第 3 項；盤點初稿 docs/phases/寫死數值-盤點初稿.md）。
#
# scan_py.py（src/trpg/）和 scan_ts.py（client/src/）列出的每一筆都要被下面某一條規則涵蓋
# （tests/test_hardcoded_scan.py 檢查）。規則由上往下比對，**第一條符合的勝出**：窄的寫前面、寬的寫後面。
#
# 五類：
#   config  應該進 content 或工坊設定的玩法數值                 status: todo（搬完改 done）
#   scale   量類，應該由 quantity_scale 推導                      status: todo
#   text    說明文字裡的數字，應該從資料帶入                      status: todo
#   const   真的是常數：格數、AP、d20、‰ 換算、程式邏輯、開發說明  status: done
#   layout  前端呈現：排版、繪圖座標、動畫毫秒、顏色、音效合成    status: done
#   guard   schema 的護欄：純驗證用的上下限（擋不合理輸入），留在 schema 不搬  status: done
#           （HC-4a；PhaseHC-1報告.md 開發 PM 裁定 2）。上下限本身就是遊戲規則的（例「最多 2 個元素」
#           「主動技 AP 1～3」）不是 guard，歸 config；內容沒寫、靠預設值生效的預設值也歸 config。
# 拿不準 config 還是 const 時歸 config（保守）；這類規則的 note 開頭寫「保守」，報告會列出來。
# 拿不準 guard 還是 config（規則型上下限）時也歸 config。
#
# 每條規則的欄位（除了 id／class／status／note，其他都是「要全部成立」的條件；沒寫就不限）：
#   lang     py 或 ts
#   files    檔案路徑（從專案根目錄起算），fnmatch 樣式：* 可跨資料夾，例 src/trpg/content/*
#   scope    所在函式或類別（巢狀用 . 連起來，模組層是 <module>），fnmatch 樣式
#   kind     number（數字字面值）／text（含數字的中文字串）／docstring（後端的 docstring 與屬性說明）
#   where    scope 的簡寫：函式或類別裡的是 scope，模組層的是 <module>.常數名（例 <module>.MAX_X）
#   slot     數字所在的位置，fnmatch 樣式：
#              後端 Field(le)＝關鍵字參數、max(#1)＝第 2 個位置參數、=NAME＝指派、{key}＝dict 的值、
#                   def:param＝函式預設值、cmp:左邊＝比較、return、index＝下標
#              前端 {key}＝物件鍵、=name＝指派、attr=name＝JSX 屬性、name()＝呼叫參數、[]＝陣列、
#                   cmp＝比較、op:*＝運算、return、?:＝三元
#   owner    所在敘述的指派目標（欄位名、常數名；前端是物件鍵或宣告名），fnmatch 樣式
#   ann      後端欄位的型別註記，fnmatch 樣式
#   value    數字的值，fnmatch 樣式（照掃描結果的寫法：'2'、'0.5'、'-2'、'0x*'）
#   text     值的正規表示式（re.search），用在字串
#   context  那一行原文的正規表示式（re.search）
#   bare_digits  true／false：字串去掉占位（{x}、${x}）和下面 references 的引用之後還有沒有數字
#   not      條件的 mapping（欄位同上）：這些條件「全部成立」時排除，例 not: {owner: '*permille*'}
#
# 不比對行號：別人改動檔案、行號移動時歸類照舊成立。新增的寫死數字沒有規則涵蓋時測試會失敗，
# 失敗訊息會附一段規則範本。

# 字串裡這些樣式的數字算「引用」（決定編號、章節、階段代號、日期、識別字），不算數值。
references:
  - '#\d+'                                       # 決定編號 #169
  - '(?<![\d.])\d+(\.\d+)+'                      # 章節 5.4.1、6.29.5、版本號
  - '\b\d{2}(?= \d+\.\d)'                        # 設計文件編號「06 6.15」的 06
  - '\b(Phase|phase)\s*[0-9A-Za-z]+(-[0-9A-Za-z]+)*'  # Phase 3-33f1、Phase 2H-1
  - '\b[0-9]*[A-Z][A-Za-z]*[0-9]*-[0-9A-Za-z]+(-[0-9A-Za-z]+)*'  # BAL-12e、X10-1、5F-4b、3G-G1、FL-1g
  - '\b[0-9]+[A-Z]+[0-9]*[a-z]*\b'               # 3H、5D2、6L
  - '\b[A-Z]{1,4}[0-9]+[a-z]?\b'                 # B7、B16、P95、S1
  - '\d{4}-\d{2}-\d{2}'                          # 日期
  - '[A-Za-z_][A-Za-z_]*[0-9]+[A-Za-z0-9_]*'     # 識別字裡的數字：d20、utf-8 以外的 x10、ring_1
  - '代決 *[0-9A-Za-z-]+'

