rules:
  # ======================================================================== 共通

  - id: py-docstring
    class: const
    status: done
    kind: docstring
    note: 後端 docstring 與欄位說明（開發文件，玩家看不到）；數值本身另外列在 number。改數值時順手更新。
  - id: text-refs-only
    class: const
    status: done
    kind: text
    bare_digits: false
    note: 字串裡的數字只有引用（決定編號、章節、階段代號）或占位，沒有寫死的數值。
  - id: text-structural-0-1
    class: const
    status: done
    kind: text
    text: '^(?:[^0-9{]|\{[^}]*\})*(?:至少 ?1(?! ?(?:層|格|AP|回合|輪|次|名|招))|不可為 ?0|大於 ?0|≥ ?1|>= ?1|> ?0|必須是 ?0|不能是 ?0|0～\{|1 ?(?:到|～|–) ?\{)(?:[^0-9{]|\{[^}]*\})*$'
    note: 只有「至少 1」「不可為 0」「1 到 {上限}」這種結構性的 0／1（上限本身已經從常數帶入）。
  - id: text-slot-labels
    class: const
    status: done
    kind: text
    text: '^戒指 \d$'
    note: 欄位序號。


