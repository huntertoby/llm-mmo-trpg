    # 工坊的建議範圍：跟著被 ×10 的欄位一起 ×10。
    scale:
      - targets[kind=unit].fields[path=max_hp|armor_bonus|max_mana|stamina|"phases[*].mana_restore"|"parts[*].armor_bonus"].hint_*
