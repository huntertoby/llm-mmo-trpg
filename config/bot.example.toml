# Discord Bot 設定範本（Phase 5E-2）。此檔進版控，裡面「沒有」真的值。
#
# 用法（二選一，由使用者自己填，agent 不經手）：
#   1. 複製成 config/bot.local.toml 再填值（*.local.* 已在 .gitignore，不會進版控）。
#   2. 用環境變數（建議 token 只放這裡）：
#        TRPG_BOT_TOKEN、TRPG_BOT_GUILD_ID、TRPG_BOT_ROLE_ID、TRPG_BOT_ANNOUNCE_CHANNEL_ID
#      也可用 TRPG_BOT_CONFIG 指定別的設定檔路徑。環境變數優先於設定檔。
#
# ID 的拿法：Discord「使用者設定 → 進階 → 開發者模式」打開後，在伺服器／身分組／頻道上右鍵「複製 ID」。
# 檢查設定：uv run python scripts/discord_bot.py check

[discord]
# Bot token（Discord Developer Portal → 你的應用程式 → Bot → Reset Token）。絕對不要貼進版控或聊天。
token = ""
# Discord 伺服器 ID。
guild_id = ""
# 能領帳號的身分組 ID（身分組被拔時帳號停用）。
role_id = ""
# 公告頻道 ID（每日公告與首殺公告貼在這裡，5E-3）。
announce_channel_id = ""

[announce]
# 每日公告的時間（Phase 5E-3）：每天 hour 點（timezone）貼今日目標與世界事件進度。
timezone = "Asia/Taipei"
# 系統沒有時區資料時（Windows 沒裝 tzdata）改用固定時差（分鐘）；台灣沒有日光節約，480＝UTC+8。
utc_offset_minutes = 480
hour = 6
