# 部署設定範本（Phase 5E-3；docs/部署說明.md）。此檔進版控，裡面沒有任何機器專屬的值。
#
# 用法：複製成 config/deploy.local.toml（*.local.* 已在 .gitignore，不會進版控）再改。
# 也可以用環境變數 TRPG_DEPLOY_CONFIG 指定別的設定檔。
# 檢查：uv run python scripts/deploy.py check

[deploy]
# 遊戲伺服器綁定的位址與埠。經 Tunnel 對外時維持 127.0.0.1（只有本機的 Tunnel 程式連得到）。
host = "127.0.0.1"
port = 8000
# 啟動 Tunnel 的指令（字串陣列，由你自己填；本專案不安裝任何 Tunnel 工具）。空＝不啟動。
# cloudflared 的例子（先自己裝好並登入、建立名為 trpg 的 tunnel）：
#   tunnel_command = ["cloudflared", "tunnel", "run", "trpg"]
# 臨時網址的例子（每次網址都會變）：
#   tunnel_command = ["cloudflared", "tunnel", "--url", "http://127.0.0.1:8000"]
tunnel_command = []
