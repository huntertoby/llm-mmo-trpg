# 數值工坊（開發工具）自己的設定（HC-8）。此檔進版控；這些不是遊戲規則，改了不影響遊戲本身。
# 想改成自己的值：複製要改的那幾行到 config/tuning.local.toml（不進版控，*.local.* 已在 .gitignore），
# 有寫的鍵蓋過這裡、沒寫的照這裡。也可以用環境變數 TRPG_TUNING_CONFIG 指定別的設定檔。
# 改完要重開伺服器（trpg serve）才生效。打錯鍵名、值小於 1、預設種子大於上限，伺服器啟動時直接報錯。
# 說明：docs/dev/上手-數值工坊.md「工坊工具的設定」。

[sim]
# 頭目戰按「跑模擬」時預設幾個種子（1 個頭目 × 8 個 build × 這個數＝場數）。
# 調高：結果比較穩、等比較久；調低：比較快、勝率跳動比較大。
default_seeds = 3
# 地圖戰預設幾個種子（1 張圖 × 這個數＝場數）。調高、調低同上。
map_default_seeds = 24
# 地圖戰一次最多選幾張圖。調高：一次能比更多圖，但更久；調低：選圖時擋得比較早。
max_maps = 3
# 單次模擬（頭目戰、地圖戰）最多幾場，超過就拒絕、請你減少種子或 build。
# 調高：能跑更大的模擬，但伺服器會忙比較久；調低：大的請求早點被擋下。
max_battles = 160
# 分母（場數、回合數）小於這個數時，結果旁標「樣本小」提醒別太相信。
# 調高：更多結果會被標「樣本小」；調低：比較少提醒，小樣本也照常顯示。
small_sample = 30

[ratio]
# 比值情境每組預設幾個種子。調高：比值比較穩、等比較久；調低：比較快、比較跳。
default_seeds = 50
# 每組種子數的上限（比值情境、頭目戰、地圖戰的「種子」欄都不能超過這個數；上面三個預設也不能超過）。
# 調高：允許更大的請求；調低：輸入框能填的最大值變小。
max_seeds = 250
# 比值情境單次上限：組數 × 種子數不能超過這個數，超過就拒絕。
# 調高：一次能算更多組，但更久；調低：大的請求早點被擋下。
max_work = 40000

[drafts]
# 草稿名稱最多幾個字（小寫英數、底線、連字號）。調高：名字可以取長一點；調低：名字要短一點，
# 已經存在、比這個長的舊草稿名稱會讀不到（改回來就好）。
name_max = 40

[skills]
# 技能「分組改」一次最多改幾招，超過就請你加篩選條件。
# 調高：一次能改更多招，但更容易改到不想改的；調低：一次改得少、比較好檢查。
max_group = 100
