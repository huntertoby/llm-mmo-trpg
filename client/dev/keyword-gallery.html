<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裝備關鍵字小圓章（開發用）</title>
    <style>
      body { background: #1b1d22; color: #d8dbe0; font: 12px "Noto Sans TC", sans-serif; margin: 12px; }
      h2 { font-size: 13px; margin: 12px 0 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: flex-start; max-width: 1560px; }
      .cell { display: flex; flex-direction: column; align-items: center; text-align: center; background: #2a2a3c; border-radius: 6px; padding: 3px; }
      .cell .icons { display: flex; gap: 4px; align-items: center; }
      .cell canvas { display: block; image-rendering: pixelated; flex: none; }
      .cell .label { margin-top: 2px; max-width: 200px; font-size: 11px; line-height: 1.2; color: #b8ab96; word-break: break-all; }
      .bag { display: grid; gap: 6px; background: #141419; padding: 9px; border-radius: 8px; width: max-content; }
      .bag canvas { display: block; image-rendering: pixelated; }
      .sw { display: inline-block; width: 12px; height: 12px; border-radius: 6px; box-shadow: 0 0 0 1px #000; vertical-align: middle; }
      .out { font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; color: #c8ccd4; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/dev/keywordGallery.ts"></script>
  </body>
</html>
