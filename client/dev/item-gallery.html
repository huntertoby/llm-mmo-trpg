<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物品的 Q 版小圖示（開發用）</title>
    <style>
      body { background: #17151b; color: #d8dbe0; font: 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 10px; }
      h2 { font-size: 13px; margin: 10px 0 5px; color: #f2e6c8; }
      .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: flex-start; max-width: 1580px; }
      .cell { display: flex; flex-direction: column; align-items: center; text-align: center; background: #2a2a3c; border-radius: 6px; padding: 3px; }
      .cell .icons { display: flex; gap: 10px; align-items: flex-end; padding: 4px; border-radius: 4px; background: #23202a; }
      .one { display: flex; gap: 4px; align-items: flex-end; }
      .lab { margin-top: 2px; max-width: 420px; font-size: 11px; line-height: 1.25; color: #b8ab96; }
      .panel { background: var(--ui-navy, #1e2236); border: 1px solid #3a3a4e; border-radius: 8px; padding: 8px 10px; color: var(--ui-text, #e8e2d2); box-sizing: border-box; }
      .ptitle { font-size: 12px; color: #e8cf90; margin-bottom: 6px; }
      .flyrow { display: flex; gap: 14px; align-items: center; padding: 10px; }
      .flyrow.big { gap: 6px; }
      .flyrow.big canvas { image-rendering: pixelated; }
      .out { font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; color: #c8ccd4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/itemGallery.tsx"></script>
  </body>
</html>
