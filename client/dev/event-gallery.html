<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>事件卡的 Q 版小圖示（開發用）</title>
    <style>
      body { background: #17151b; color: #d8dbe0; font: 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 10px; }
      h2 { font-size: 13px; margin: 10px 0 5px; color: #f2e6c8; }
      .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: flex-start; max-width: 1560px; }
      .cell { display: flex; flex-direction: column; align-items: center; text-align: center; background: #2a2a3c; border-radius: 6px; padding: 3px; }
      .cell .icons { display: flex; gap: 6px; align-items: center; padding: 4px; border-radius: 4px; }
      canvas { display: block; image-rendering: pixelated; flex: none; }
      .cell .label { margin-top: 2px; max-width: 260px; font-size: 11px; line-height: 1.2; color: #b8ab96; }
      .box { background: #201d24; border: 1px solid #3a3440; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
      .sub { font-size: 11px; color: #8a7e6c; }
      .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; font-size: 12px; font-weight: 700; background: rgb(30 34 54 / 88%); border: 1px solid rgba(200,168,104,.5); border-radius: 10px; color: #f0e6cc; box-sizing: border-box; }
      .statchip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 1px 6px; background: #1a1410; border: 1px solid #5a4a38; border-radius: 11px; box-sizing: border-box; width: max-content; }
      .pips { display: inline-flex; gap: 3px; }
      .pips.big { gap: 18px; }
      .float .fhead { display: inline-flex; gap: 40px; align-items: flex-start; padding: 8px 10px; background: rgb(28 28 38 / 96%); border: 1px solid #3a3a4e; border-radius: 6px; color: #f2e6c8; font-weight: 700; }
      .float .fbar { display: inline-block; padding: 4px 10px; background: rgb(28 28 38 / 96%); border: 1px solid #3a3a4e; border-radius: 0 0 6px 6px; color: #9a98a6; font-size: 12px; }
      .float .fbar canvas { display: inline-block; vertical-align: -2px; }
      .out { font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; color: #c8ccd4; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/dev/eventGallery.ts"></script>
  </body>
